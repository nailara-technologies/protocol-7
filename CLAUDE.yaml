# CLAUDE.yaml - Quick Reference for Protocol-7
# Token-efficient structured guide
# Last Updated: 2025-01-15

meta:
  repository: nailara-technologies/protocol-7
  purpose: Perl-based modular multi-agent system (zenki)
  default_branch: base
  architecture: Asynchronous message-passing between autonomous agents
  documentation: CLAUDE.md  # Read for comprehensive technical details

# CRITICAL: Session initialization
initialization:
  required_command: ./bin/Protocol-7 work overview
  why: single command provides complete development context
  token_cost: ~800-1000 tokens
  provides:
    - current branch and git status
    - recent commits [ last 5 ]
    - open todos and bugs
    - missing dependencies
    - context-aware suggestions ranked by relevance

  alternative_docs:
    - SESSION-START-HERE.md
    - data/yaml/project-context/next-session-start.yaml
    - .env.session  # environment-based context

# Quick commands [ most useful ]
quick_commands:
  overview: ./bin/Protocol-7 work overview
  run_zenka: ./bin/Protocol-7 <zenka-name>

  interactive_shell:
    recommended: p7.nshell  # nshell zenka with buffered non-blocking I/O
    alternative: ./bin/nshell  # legacy script [ prints full protocol replies ]

  command_execution:
    local: p7c <command> [args]  # protocol-7 command [ local execution ]
    remote: p-7-r <command> [args]  # protocol-7 remote [ network execution ]

  work:
    bug_list: ./bin/Protocol-7 work bug-list
    todo_list: ./bin/Protocol-7 work todo-list
    commit: ./bin/Protocol-7 work version-sign-commit "message"
    search: ./bin/Protocol-7 work search <pattern>

  workspace_transfer:
    status: ./bin/Protocol-7 workspace-transfer status-check
    checkpoint: ./bin/Protocol-7 workspace-transfer checkpoint
    bug: ./bin/Protocol-7 workspace-transfer bug "<description>"
    todo: ./bin/Protocol-7 workspace-transfer todo "<task>"

# Multi-agent architecture (Zenki)
zenki_system:
  core_concept: Each agent (zenka, plural: zenki) is an autonomous process

  core_zenki:
    cube: message router between all zenki [ started first ]
    v7: zenka manager [ starts and manages other zenki, auto-compiles p7c and p-7-r ]
    httpd: HTTP server agent with async file transfer
    nshell: interactive shell with buffered non-blocking I/O and UTF-8 support
    work: development workflow automation [ via p7.work or symlink ]
    workspace-transfer: workspace-transfer repo integration

  deployment_modes:
    always_on: Listed in configuration/zenki/v7/start-set-up.base
    on_demand: Started when first accessed (auto-timeout possible)
    unmanaged: Manually started, connects but not monitored
    standalone: Runs independently without cube connection

  communication:
    transport: Unix domain sockets or TCP [ equivalent after auth ]
    routing: via cube zenka [ message router ]
    syntax:
      - direct: "list users" [ no dots ]
      - routed: "zenka.command" [ dot notation ]
      - example: "work.overview" → routes to work zenka

# Module system (unique architecture)
modules:
  location: modules/  # All 5270+ functional modules
  naming: Dot notation (e.g., base.init_code, httpd.file_transfer.init)

  structure: |
    ## [:< ##
    # name = module.name.here
    # descr = Brief description
    # Implementation code...

  no_sub_declarations: Filename becomes the callable subroutine

  invocation:
    standard: $code{'module.name'}->()
    special: <[module.name]>->()  # Parsed before compilation

  organization:
    base: Common functionality (base.*)
    zenka_specific: Each zenka has namespace (cube.*, httpd.*, workflow.*)
    shared: Descriptive names for reuse across zenki

  signature: AMOS7 data signatures at end of files for integrity

# AMOS7 system
amos7:
  location: data/lib-path/pm/AMOS7/
  purpose: Project-internal Perl modules for unique functionality

  key_modules:
    Assert_Truth: Harmonic truth calculation (division by 13)
    CHKSUM: Specialized checksum implementations
    Protocol_P7: Protocol-7 specific implementations
    Twofish: Cryptographic functions

  constants:
    TRUE: 5
    FALSE: 0
    UNKNOWN: 2

  harmonic_truth:
    TRUE_HARMONIC: 384615  # 5/13 repeating
    FALSE_HARMONIC: 230769  # 3/13 repeating

# Dependencies
dependencies:
  install_minimal: ./bin/dependencies/install_minimal_dependencies.debian.sh
  install_full: ./bin/dependencies/install_dependencies.debian.sh
  cpan_modules: ./bin/dependencies/cpan_install.debian.sh

  system_deps:
    - gcc, make, libc6-dev
    - perl (v5.24+)
    - git

  perl_modules:
    - Curve25519 (included in data/lib-path/pm-src/)
    - Digest::BMW
    - Many others (see install scripts)

# Color scheme (Protocol-7 aesthetic)
colors:
  blacklight: "\e[38;2;68;39;172m"  # Blacklight purple
  TRUE_blue: "\e[38;2;6;71;195m"  # TRUE harmonic blue
  neon_orange: "\e[38;2;197;141;7m"
  neon_green: "\e[38;2;71;195;6m"
  neon_red: "\e[38;2;195;6;71m"
  nailara_bg: "\e[48;2;9;5;42m"  # Nailara background

  usage: Used in console output for workflow, workspace-transfer zenki

# Cryptographic system
crypto:
  keys: modules/crypt.C25519.* (Curve25519)
  checksums: Multiple algorithms (AMOS, BMW, ELF, JHA)
  user_keys: modules/USR.[username].*
  signatures: AMOS7 signatures for file integrity
  link_encryption: Encrypted communication channels for enhanced security

# Recent developments (high iteration frequency)
recent_developments:
  llm_integration: Basic LLM integration for AI-assisted operations and analysis
  link_encryption: Encrypted communication channels for enhanced security
  network_enhancements: Core transport layer upgrades for performance and reliability
  zenki_expansion: Rapid iteration on new essential agents for system capabilities
  nshell_portability: Replaced XS dependencies with pure-Perl non-blocking I/O
  binary_tools: p7c (local) and p-7-r (remote) auto-compiled by v7 zenka

# work zenka integration
work:
  purpose: development workflow automation with AI assistance
  access: p7.work or symlink to work zenka

  features:
    - git status and commit management
    - todo and bug tracking across workspace repos
    - dependency checking and installation
    - context-aware suggestions
    - signature verification
    - email harmonization

  commands:
    overview: complete development context
    bug_list: show tracked bugs
    todo_list: show tracked todos
    commit: version-sign-commit workflow
    search: search work data/notes

  storage:
    todos: data/yaml/indexes/todos-index.yaml
    bugs: aggregated from workspace repos
    context: data/yaml/project-context/

# code style and llm integration
code_style:
  purpose: maintain visual consistency and support productive llm code generation
  principles:
    - lowercase narrative flow [ # read config from file ]
    - bracket conventions [ use [ word ] not ( word ) ]
    - holographic consistency [ style at all code levels ]
    - speed reading support [ smooth visual rhythm ]
    - quality correlation [ consistent style = higher quality ]

  references:
    comprehensive_guide: data/md/development/CODE-STYLE-AND-LLM-INTEGRATION.md
    quick_reference: data/yaml/code-style/CONVENTIONS.yaml

  llm_strategy:
    - non-blocking correction [ zenki silently fix issues during generation ]
    - post-feedback [ notify llm after completion ]
    - contextual learning [ llm adopts conventions through repeated feedback ]
    - reduced_workload [ future generations need fewer corrections ]

  usage:
    initialization: include CONVENTIONS.yaml in llm context setup
    reminders: use CODE-STYLE-AND-LLM-INTEGRATION.md for long multi-turn sessions
    enforcement: zenki should mentor rather than block

# workspace-transfer integration
workspace_transfer:
  repo: https://github.com/nailara-technologies/workspace-transfer.git
  local_path: /var/run/.7/workspace-transfer

  zenka_modules:
    - workspace-transfer.init_code
    - workspace-transfer.console.status-check
    - workspace-transfer.console.checkpoint
    - workspace-transfer.cmd.bug
    - workspace-transfer.cmd.todo
    - workspace-transfer.console.bug-commit
    - workspace-transfer.console.todo-commit

  purpose: AI collaboration staging area for Protocol-7 development
  workflow: Stage work → Transfer to protocol-7 → Commit → Push

# Directory structure
structure:
  bin/: Executables (Protocol-7, nshell, utilities)
  bin/c_src/: C source for p7c and p-7-r (auto-compiled by v7)
  modules/: All 5270+ functional modules
  configuration/: System and zenka configs

  data/:
    yaml/: YAML configuration and metadata indexes
      - project-context/: Session and workflow context
      - indexes/: Todo and bug tracking indexes
    md/: Markdown documentation and guides
    lib-path/: Internal Perl modules (AMOS7, custom libraries)
    gfx/: Graphics and resources
    <other>/: Additional data directories

  read-me/: Project documentation and guides
    md/: Main markdown documentation
    project-identity/: Licensing, versions, contributions

  docs/: Additional documentation
  scripts/: Additional scripts
  appliances/: Appliance definitions
  var/: Runtime data

  session_management:
    incoming_symlinks:
      - session-state.md -> read-me/md/session-state/
      - context.yaml -> data/yaml/
    purpose: Organize incoming session data into proper locations

# git workflow
git:
  default_branch: base
  commit_workflow: ./bin/Protocol-7 work version-sign-commit "message"
  admin_tools:
    - ./bin/admin/vc_commit
    - ./bin/dev/vci
    - ./bin/dev/update-version

  signatures: commits include AMOS7 signatures for integrity

# development workflow
session_pattern:
  start:
    - cd /data/projects/protocol-7  # or your path
    - ./bin/Protocol-7 work overview
    - read suggested actions
    - check data/yaml/project-context/ for context

  during:
    - work on suggested tasks
    - use work commands for tracking
    - commit with version-sign-commit

  end:
    - ensure all changes committed
    - update session documentation in data/yaml/project-context/
    - push to remote

# Common issues
troubleshooting:
  missing_dependencies:
    symptom: "Can't locate <Module>.pm"
    fix: ./bin/dependencies/install_minimal_dependencies.debian.sh

  crypto_warnings:
    symptom: Crypt::C25519 warnings
    fix: Set crypt.C25519.auto_load_keys = no in config

  key_directory:
    symptom: "no read permission to key dir"
    fix: Create /home/protocol-7/.n/user-keys or disable crypto

  deep_recursion:
    symptom: Deep recursion error
    fix: Use // 0 or // {} for all %data hash access

# best practices
practices:
  - always run 'work overview' at session start
  - use work commands for tracking [ not manual git ]
  - follow module naming conventions
  - include AMOS7 signatures
  - test before committing
  - use context-aware suggestions
  - update session documentation
  - respect code style principles [ see code_style section ]

# philosophy
philosophy: |
  protocol-7 is a self-organizing multi-agent system where:
  - each zenka is autonomous and resumable
  - communication via harmonic message routing
  - cryptographic integrity throughout
  - code quality via verifiable physics [ harmonic resonance ]
  - AI-assisted development via work zenka
  - style consistency supports productive llm code generation

  "quality emerges from verifiable truth, not authority."

# Related repositories
related:
  workspace-transfer: https://github.com/nailara-technologies/workspace-transfer
  purpose: AI collaboration and staging for Protocol-7 development
