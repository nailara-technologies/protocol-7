# Protocol-7 Dependency Profiles
# Defines dependencies for different installation types
# Format: profile -> package_manager -> packages

profiles:
  minimal:
    description: "minimal protocol-7 runtime [core dependencies only]"
    apt:
      - git
      - perl
      - make
    cpan:
      - Event
      - IO::AIO
      - IO::Socket::SSL
      - JSON::XS
      - Time::HiRes
      - URI

  runtime:
    description: "Protocol-7 runtime with essential modules"
    apt:
      - git
      - perl
      - make
      - libssl-dev
      - curl
      - libio-compress-perl
      - libanyevent-http-perl
      - libasync-interrupt-perl
      - libguard-perl
      - libyaml-perl
      - libyaml-libyaml-perl
      - libyaml-tiny-perl
    cpan:
      - AnyEvent
      - AnyEvent::HTTP
      - Event
      - File::Rsync
      - IO::AIO
      - IO::Socket::SSL
      - JSON::XS
      - Module::Refresh
      - Net::DNS
      - Tie::Dir
      - Time::HiRes
      - URI
      - YAML
      - YAML::Tiny
      - YAML::XS

  network:
    description: "network and TLS support"
    apt:
      - libssl-dev
      - libnet-ssh2-perl
      - libnet-ssleay-perl
      - libnet-libdnet-perl
    cpan:
      - IO::Socket::SSL
      - Net::SSLeay
      - Net::DNS

  cryptography:
    description: "cryptography and checksumming"
    apt:
      - libcrypt-openssl-rsa-perl
      - libglib2.0-dev
    cpan:
      - Crypt::Curve25519
      - Crypt::Ed25519
      - Crypt::OpenSSL::X509
      - Digest::BMW
      - Digest::SHA
      - Digest::Skein

  X11-Desktop:
    description: "X11 Desktop environment and GUI frameworks"
    apt:
      - libcairo-perl
      - libglib-perl
      - libglib2.0-dev
      - libgraphics-magick-perl
      - libgtk3-perl
      - libgtk3-webkit2-perl
      - libx11-keyboard-perl
      - libx11-protocol-perl
      - lua5.3
      - liblua5.3-dev
      - xserver-xorg-core
      - notify-osd
    cpan:
      - Cairo
      - Convert::Color
      - Font::FreeType
      - Glib
      - Glib::Object::Introspection
      - Graphics::Magick
      - Gtk3
      - Gtk3::WebKit2
      - Inline::Lua
      - SDL
      - SDL::Color
      - SDL::Event
      - SDL::Events
      - SDL::GFX::Rotozoom
      - SDL::Image
      - SDL::Mouse
      - SDL::RWOps
      - SDL::Rect
      - SDL::Surface
      - SDL::TTF
      - SDL::Video
      - X11::Keyboard
      - X11::Protocol
      - X11::Protocol::WM
      - X11::Protocol::XSetRoot

  tools:
    description: "utility tools and scripts [DBI, database tools, etc.]"
    apt:
      - libdbi-perl
      - libdbd-sqlite3-perl
    cpan:
      - DBI
      - DBD::SQLite

  zenka-common:
    description: "common modules for active zenka [v7, httpd, httpsd, letsencr, nshell, test-link-upgrade]"
    apt:
      - libbsd-resource-perl
      - libcrypt-dev
      - libcrypt-openssl-x509-perl
      - libdata-uuid-perl
      - libprotocol-websocket-perl
      - libsys-mmap-perl
      - liblinux-termios2-perl
      - libyaml-perl
    cpan:
      - BSD::Resource
      - Capture::Tiny
      - IPC::Shm::Simple
      - Clone
      - Const::Fast
      - Crypt::Digest::BLAKE2b_384
      - Crypt::Digest::MD5
      - Crypt::Digest::SHA1
      - Crypt::Misc
      - Crypt::PRNG::Fortuna
      - Digest::CRC
      - Digest::JHash
      - File::ExtAttr
      - File::MimeInfo::Magic
      - File::Which
      - FreezeThaw
      - Hash::Flatten
      - Hash::Merge::Simple
      - HTTP::Date
      - HTTP::Request
      - IO::Interface::Simple
      - IO::Socket::Multicast
      - IPC::Open2
      - IPC::Open3
      - JSON::PP
      - Linux::Inotify2
      - Linux::Termios2
      - List::MoreUtils
      - LWP::UserAgent
      - LWPx::ParanoidAgent
      - Protocol::WebSocket
      - Module::Refresh
      - Module::Runtime
      - Net::IP::Lite
      - Proc::ProcessTable
      - Sys::Filesystem
      - URI::QueryParam
      - YAML
      - YAML::Tiny

  graphics-matrix:
    description: "graphics processing and visual similarity [graphics-matrix zenka]"
    apt:
      - libgraphics-magick-perl
    cpan:
      - Image::Hash

  opencv:
    description: "computer vision and GPU-accelerated image processing [opencv zenka]"
    apt:
      - pdl
      - libopencv-core-dev
      - libopencv-imgproc-dev
      - libopencv-imgcodecs-dev
      - libopencv-objdetect-dev
    cpan:
      - PDL::OpenCV

  development:
    description: "full Protocol-7 development [covers v7, httpd, httpsd, letsencr, test-link-upgrade]"
    includes:
      - minimal
      - runtime
      - network
      - cryptography
      - tools
      - zenka-common

  ai-models:
    description: "AI/LLM model support [local and remote backends]"
    apt:
      - libanyevent-http-perl
      - libanyevent-perl

  amos-term:
    description: "3D terminal with FUSE buffer mounting and hybrid editor"
    includes:
      - runtime
      - X11-Desktop
    apt:
      - fuse3
      - libfuse3-dev
      - libsys-mmap-perl
      - lua5.3
      - liblua5.3-dev
    cpan:
      - Filesys::Fuse3
      - File::ExtAttr
      - Inline::Lua
      - Sys::Mmap

  protocol7-extended:
    description: "complete Protocol-7 system with GUI and advanced tools"
    includes:
      - development
      - X11-Desktop
      - ai-models
