# Protocol-7 Dependency Profiles
# Defines dependencies for different installation types
# Format: profile -> package_manager -> packages

profiles:
  minimal:
    description: "minimal protocol-7 runtime [core dependencies only]"
    apt:
      - git
      - perl
      - make
      - libcrypt-dev       # XS build header : Digest::BMW [ pm-src build ]
      - libio-compress-lzma-perl  # IO::Uncompress::UnXz : xz inline subs [ boot ]
      - libinline-c-perl   # Inline::C : AMOS7::INLINE [ boot, compiles with gcc ]
      - gcc                # Inline::C compiles at first use
    cpan:
      - Event
      - IO::AIO
      - IO::Socket::SSL
      - JSON::XS
      - Time::HiRes
      - URI
      - Digest::BMW      # AMOS7::INLINE path names [ pm-src build ]
      - Crypt::Curve25519  # C25519 keys : every zenka start
      - Crypt::Ed25519     # C25519 signatures : every zenka start
      - Crypt::Misc      # encode_b32r ; debian : libcryptx-perl
      - List::MoreUtils  # INLINE minmax ; debian : liblist-moreutils-perl

  runtime:
    description: "Protocol-7 runtime with essential modules"
    apt:
      - git
      - perl
      - make
      - libssl-dev
      - curl
      - libio-compress-perl
      - libanyevent-http-perl
      - libasync-interrupt-perl
      - libguard-perl
      - libyaml-perl
      - libyaml-libyaml-perl
      - libyaml-tiny-perl
      - libterm-clui-perl
    cpan:
      - AnyEvent
      - AnyEvent::HTTP
      - Event
      - File::Rsync
      - IO::AIO
      - IO::Socket::SSL
      - JSON::XS
      - Module::Refresh
      - Net::DNS
      - Tie::Dir
      - Time::HiRes
      - URI
      - YAML
      - YAML::Tiny
      - YAML::XS

  network:
    description: "network and TLS support"
    apt:
      - libssl-dev
      - libnet-ssh2-perl
      - libnet-ssleay-perl
      - libnet-libdnet-perl
    cpan:
      - IO::Socket::SSL
      - Net::SSLeay
      - Net::DNS

  cryptography:
    description: "tls + certificate extras [ boot crypto lives in minimal ]"
    apt:
      - libcrypt-openssl-rsa-perl  # letsencr account keys
    cpan:
      - Crypt::OpenSSL::X509
      - Digest::Skein

  vault:
    description: "personal vault [ bin/p7-vault ] -- also all a host needs to open a vault copy"
    apt:
      - perl
      - libcryptx-perl          # chacha20-poly1305, hkdf ; argon2id built in from CryptX 0.088
      - libcrypt-argon2-perl    # argon2id where CryptX is older [ debian bookworm : 0.077 ] ;
                                # identical output, verified 2026-10-09 against 0.013
      - libterm-readkey-perl    # no-echo passphrase input
      - rsync                   # resumable blob transfer between vault copies
                                # [ --partial-dir, until p7-vault sync resumes itself : HTC ]
    cpan:
      - CryptX
      - Crypt::Argon2
      - JSON::PP
      - Term::ReadKey

  X11-Desktop:
    description: "X11 Desktop environment and GUI frameworks"
    apt:
      - libcairo-perl
      - libglib-perl
      - libglib2.0-dev
      - libgraphics-magick-perl
      - libgtk3-perl
      - libgtk3-webkit2-perl
      - libx11-keyboard-perl
      - libx11-protocol-perl
      - libsdl-perl    # satisfies the SDL::* cpan deps below directly; without
                       # it cpanm falls through to Alien::SDL's from-source
                       # build, which fetches long-dead upstream tarball URLs
                       # and fails on a stale checksum (confirmed 2026-09-19
                       # on a host with fewer apt packages preinstalled)
      - lua5.3
      - liblua5.3-dev
      - xserver-xorg-core
      - notify-osd
      - dunst          # parallel notification daemon [ dunst zenka ]
      - xdotool        # synthetic X11 input + window/grab query, dev diag
      - x11-utils      # xwininfo/xprop, live X11 state inspection
    cpan:
      - Cairo
      - Convert::Color
      - Font::FreeType
      - Glib
      - Glib::Object::Introspection
      - Graphics::Magick
      - Gtk3
      - Gtk3::WebKit2
      - Inline::Lua
      - SDL
      - SDL::Color
      - SDL::Event
      - SDL::Events
      - SDL::GFX::Rotozoom
      - SDL::Image
      - SDL::Mouse
      - SDL::RWOps
      - SDL::Rect
      - SDL::Surface
      - SDL::TTF
      - SDL::Video
      - X11::Keyboard
      - X11::Protocol
      - X11::Protocol::WM
      - X11::Protocol::XSetRoot

  tools:
    description: "utility tools and scripts [DBI, database tools, etc.]"
    apt:
      - libdbi-perl
      - libdbd-sqlite3-perl
    cpan:
      - DBI
      - DBD::SQLite
      - FFI::Platypus

  hw-thinkpad-sandybridge:
    description: "hardware : sandy bridge thinkpads [ x220 tablet, w520 ] -- needs the non-free-firmware apt component"
    # replaces the legacy blanket 'firmware-misc-nonfree' : these machines
    # load nothing from it [ i915 needs no blobs before skylake ]. check a
    # fresh install with : dmesg | grep -i 'direct firmware load' -- add
    # what it names [ e.g. a swapped bluetooth card ] per machine
    apt:
      - firmware-iwlwifi        # intel centrino 6205 \ 6300 wifi
      - intel-microcode         # cpu microcode updates

  coding:
    description: "coding zenka [ libgit2 diffs through Git::Native -- not built on servers ]"
    cpan:
      - Git::Native

  zenka-common:
    description: "common modules for active zenka [v7, httpd, httpsd, letsencr, nshell, test-link-upgrade]"
    apt:
      - libbsd-resource-perl
      - libcrypt-dev
      - libcrypt-openssl-x509-perl
      - libdata-uuid-perl
      - libprotocol-http2-perl
      - libprotocol-websocket-perl
      - libsys-mmap-perl
      - liblinux-termios2-perl
      - libyaml-perl
      ## declared by server zenki, missing until 2026-10-15 [ yourum's
      ## system zenka ran without Sys::Statistics::Linux for days ]
      - libcompress-raw-lzma-perl       # Compress::Raw::Lzma [ most zenki ]
      - libsys-statistics-linux-perl    # Sys::Statistics::Linux [ system ]
      - libjson-perl                    # JSON [ httpd ]
      - libtimedate-perl                # Date::Parse [ httpsd, events ]
      - libcrypt-openssl-random-perl    # Crypt::OpenSSL::Random [ letsencr ]
      - libio-compress-lzma-perl        # IO::Compress::Xz [ smtpd ]
      - libapt-pkg-perl                 # AptPkg::Cache [ debian, optional ]
    cpan:
      - BSD::Resource
      - Capture::Tiny
      - IPC::Shm::Simple
      - Clone
      - Const::Fast
      - Crypt::Digest::BLAKE2b_384
      - Crypt::Digest::MD5
      - Crypt::Digest::SHA1
      - Crypt::Misc
      - Crypt::PRNG::Fortuna
      - Digest::CRC
      - Digest::JHash
      - Email::MIME
      - File::ExtAttr
      - File::MimeInfo::Magic
      - File::Which
      - FreezeThaw
      - Hash::Flatten
      - Hash::Merge::Simple
      - HTTP::Date
      - HTTP::Request
      - IO::Interface::Simple
      - IO::Socket::Multicast
      - IPC::Open2
      - IPC::Open3
      - JSON::PP
      - Linux::Inotify2
      - Linux::Termios2
      - List::MoreUtils
      - LWP::UserAgent
      - LWPx::ParanoidAgent
      - Protocol::HTTP2
      - Protocol::WebSocket
      - Module::Refresh
      - Module::Runtime
      - Net::IP::Lite
      - Proc::ProcessTable
      - Sys::Filesystem
      - URI::QueryParam
      - YAML
      - YAML::Tiny

  graphics-matrix:
    description: "graphics processing and visual similarity [graphics-matrix zenka]"
    apt:
      - libgraphics-magick-perl
      - libconvert-color-perl
      - libgd-perl    # satisfies Image::Hash's GD dependency; CPAN's GD
                       # build needs libgd-dev + a compiler, the precompiled
                       # Debian binding avoids that build entirely
    cpan:
      - Image::Hash

  opencv:
    description: "computer vision and GPU-accelerated image processing [opencv zenka]"
    apt:
      - libgraphics-magick-perl
      - pdl
      - pkg-config
      - libopencv-dev                 # makes Alien::OpenCV use system OpenCV
      - libopencv-core-dev
      - libopencv-imgproc-dev
      - libopencv-imgcodecs-dev
      - libopencv-objdetect-dev
    cpan:
      - PDL::OpenCV

  basic-remote-server:
    description: "headless remote deployment [v7, httpd, httpsd, letsencr, test-link-upgrade]"
    host_power: awake
    includes:
      - minimal
      - runtime
      - network
      - cryptography
      - tools
      - zenka-common
      - graphics-matrix    # plugin.web.space.* [ orbital/cursor ] calls graphics-matrix.* cross-zenka
      - vault              # every host can open a vault backup copy

  ai-models:
    description: "AI/LLM model support [local and remote backends]"
    apt:
      - bsdutils               # script : a pseudo-terminal for `claude --cloud`
                                # [ bin/mcp-server-p7 claude_cloud_dispatch --
                                # the cli refuses --cloud without a terminal ]
      - libanyevent-http-perl
      - libanyevent-perl
      - python3.14-venv        # needed to create a python3.14 venv matching
                                # libinline-python-perl's embedded interpreter
                                # version -- confirmed missing live 2026-09-10
                                # (`python3.14 -m venv` fails without it)
      - libinline-python-perl  # NOTE 2026-09-10: pulls libpython3.14 as a
                                # dependency, which does NOT match this
                                # host's system python3 (3.13.15) or the
                                # .venv-lora training venv (also 3.13.15) --
                                # a torch import inside an Inline::Python
                                # block will run against a DIFFERENT cpython
                                # than the one torch's compiled extensions
                                # were built for. confirm whether libpython
                                # 3.14 has its own torch-compatible site-
                                # packages, or whether this needs pinning to
                                # a 3.13 build, before relying on this for
                                # anything beyond an isolated compatibility
                                # test -- see data/tasks/coding-lora-p7-
                                # idioms.md's Inline::Python discussion

  embeddings:
    description: "fasttext CLI for on-disk semantic embedding domains [dep-graph, security-intel, etc.]"
    apt:
      - fasttext

  amos-term:
    description: "3D terminal with FUSE buffer mounting and hybrid editor"
    includes:
      - runtime
      - X11-Desktop
    apt:
      - fuse3
      - libfuse3-dev
      - libsys-mmap-perl
      - lua5.3
      - liblua5.3-dev
    cpan:
      - Filesys::Fuse3
      - File::ExtAttr
      - Inline::Lua
      - Sys::Mmap

  protocol7-extended:
    description: "complete Protocol-7 system with GUI and advanced tools"
    includes:
      - basic-remote-server
      - X11-Desktop
      - ai-models
      - coding
