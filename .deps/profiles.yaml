# Protocol-7 Dependency Profiles
# Defines dependencies for different installation types
# Format: profile -> package_manager -> packages

profiles:
  minimal:
    description: "Minimal protocol-7 runtime (core dependencies only)"
    apt:
      - git
      - perl
      - make
    cpan:
      - Event
      - IO::AIO
      - IO::Socket::SSL
      - JSON::XS
      - Time::HiRes
      - URI

  runtime:
    description: "Protocol-7 runtime with essential modules"
    apt:
      - git
      - perl
      - make
      - libssl-dev
      - curl
      - libio-compress-perl
      - libanyevent-http-perl
      - libasync-interrupt-perl
      - libguard-perl
    cpan:
      - AnyEvent
      - AnyEvent::HTTP
      - Event
      - File::Rsync
      - IO::AIO
      - IO::Socket::SSL
      - JSON::XS
      - Module::Refresh
      - Net::DNS
      - Tie::Dir
      - Time::HiRes
      - URI
      - YAML::Tiny
      - YAML::XS

  network:
    description: "Network and TLS support"
    apt:
      - libssl-dev
      - libnet-ssh2-perl
      - libnet-ssleay-perl
      - libnet-libdnet-perl
    cpan:
      - IO::Socket::SSL
      - Net::SSLeay
      - Net::DNS

  cryptography:
    description: "Cryptography and checksumming"
    apt:
      - libcrypt-openssl-rsa-perl
      - libglib2.0-dev
    cpan:
      - Crypt::Curve25519
      - Crypt::Ed25519
      - Crypt::OpenSSL::X509
      - Digest::BMW
      - Digest::SHA
      - Digest::Skein

  X11-Desktop:
    description: "X11 Desktop environment and GUI frameworks"
    apt:
      - libcairo-perl
      - libglib-perl
      - libglib2.0-dev
      - libgraphics-magick-perl
      - libgtk3-perl
      - libgtk3-webkit2-perl
      - libx11-keyboard-perl
      - libx11-protocol-perl
      - xserver-xorg-core
      - notify-osd
    cpan:
      - Cairo
      - Convert::Color
      - Font::FreeType
      - Glib
      - Glib::Object::Introspection
      - Graphics::Magick
      - Gtk3
      - Gtk3::WebKit2
      - Inline::Lua
      - SDL
      - SDL::Color
      - SDL::Event
      - SDL::Events
      - SDL::GFX::Rotozoom
      - SDL::Image
      - SDL::Mouse
      - SDL::RWOps
      - SDL::Rect
      - SDL::Surface
      - SDL::TTF
      - SDL::Video
      - X11::Keyboard
      - X11::Protocol
      - X11::Protocol::WM
      - X11::Protocol::XSetRoot

  tools:
    description: "Utility tools and scripts (DBI, database tools, etc.)"
    apt:
      - libdbi-perl
      - libdbd-sqlite3-perl
    cpan:
      - DBI
      - DBD::SQLite

  zenka-common:
    description: "Common modules for active zenka (v7, httpd, httpsd, letsencr, nshell, test-link-upgrade)"
    apt:
      - libbsd-resource-perl
      - libcrypt-dev
      - libcrypt-openssl-x509-perl
      - libdata-uuid-perl
      - libprotocol-websocket-perl
      - libsys-mmap-perl
      - liblinux-termios2-perl
    cpan:
      - BSD::Resource
      - Capture::Tiny
      - IPC::Shm::Simple
      - Clone
      - Const::Fast
      - Crypt::Digest::BLAKE2b_384
      - Crypt::Digest::MD5
      - Crypt::Digest::SHA1
      - Crypt::Misc
      - Crypt::PRNG::Fortuna
      - Digest::CRC
      - Digest::JHash
      - File::ExtAttr
      - File::MimeInfo::Magic
      - File::Which
      - FreezeThaw
      - Hash::Flatten
      - Hash::Merge::Simple
      - HTTP::Date
      - HTTP::Request
      - IO::Interface::Simple
      - IO::Socket::Multicast
      - IPC::Open2
      - IPC::Open3
      - JSON::PP
      - Linux::Inotify2
      - Linux::Termios2
      - List::MoreUtils
      - LWP::UserAgent
      - LWPx::ParanoidAgent
      - Protocol::WebSocket
      - Module::Refresh
      - Module::Runtime
      - Net::IP::Lite
      - Proc::ProcessTable
      - Sys::Filesystem
      - URI::QueryParam
      - YAML::Tiny

  development:
    description: "Full Protocol-7 development (covers v7, httpd, httpsd, letsencr, test-link-upgrade)"
    includes:
      - minimal
      - runtime
      - network
      - cryptography
      - tools
      - zenka-common

  ai-models:
    description: "AI/LLM model support (local and remote backends)"
    apt:
      - libanyevent-http-perl
      - libanyevent-perl

  protocol7-extended:
    description: "Complete Protocol-7 with GUI and advanced tools"
    includes:
      - development
      - X11-Desktop
      - ai-models
