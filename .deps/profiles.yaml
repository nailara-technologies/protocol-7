# Protocol-7 Dependency Profiles
# Defines dependencies for different installation types
# Format: profile -> package_manager -> packages

profiles:
  minimal:
    description: "Minimal protocol-7 runtime (core dependencies only)"
    apt:
      - git
      - perl
      - make
    cpan:
      - Event
      - IO::AIO
      - IO::Socket::SSL
      - JSON::XS
      - Time::HiRes
      - URI

  runtime:
    description: "Protocol-7 runtime with essential modules"
    apt:
      - git
      - perl
      - make
      - libssl-dev
      - curl
    cpan:
      - AnyEvent
      - Event
      - File::Rsync
      - IO::AIO
      - IO::Socket::SSL
      - JSON::XS
      - Module::Refresh
      - Net::DNS
      - Time::HiRes
      - URI
      - YAML::XS

  network:
    description: "Network and TLS support"
    apt:
      - libssl-dev
      - libnet-ssleay-perl
    cpan:
      - IO::Socket::SSL
      - Net::SSLeay
      - Net::DNS

  cryptography:
    description: "Cryptography and checksumming"
    apt:
      - libglib2.0-dev
    cpan:
      - Crypt::Curve25519
      - Crypt::Ed25519
      - Crypt::OpenSSL::RSA
      - Crypt::OpenSSL::X509
      - Digest::BMW
      - Digest::SHA
      - Digest::Skein

  x11-desktop:
    description: "X11 Desktop environment and GUI frameworks"
    apt:
      - libcairo-perl
      - libglib-perl
      - libglib2.0-dev
      - libgraphics-magick-perl
      - libgtk3-perl
      - libgtk3-webkit2-perl
      - libx11-keyboard-perl
      - libx11-protocol-perl
      - xserver-xorg-core
      - notify-osd
    cpan:
      - Cairo
      - Convert::Color
      - Font::FreeType
      - Glib
      - Glib::Object::Introspection
      - Graphics::Magick
      - Gtk3
      - Gtk3::WebKit2
      - Inline::Lua
      - SDL
      - SDL::Color
      - SDL::Event
      - SDL::Events
      - SDL::GFX::Rotozoom
      - SDL::Image
      - SDL::Mouse
      - SDL::RWOps
      - SDL::Rect
      - SDL::Surface
      - SDL::TTF
      - SDL::Video
      - X11::Keyboard
      - X11::Protocol
      - X11::Protocol::WM
      - X11::Protocol::XSetRoot

  development:
    description: "Full development environment (all profiles)"
    includes:
      - minimal
      - runtime
      - network
      - cryptography
      - x11-desktop
