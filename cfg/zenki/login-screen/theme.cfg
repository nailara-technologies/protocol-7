## dark native greeter palette : configured rgb is brightness-scaled ##

login-screen.theme.font_family = White Rabbit
login-screen.theme.font_size = 32
login-screen.theme.title_size = 42
login-screen.theme.status_size = 22
login-screen.theme.brightness = 1.0

login-screen.theme.color.background = 000013
login-screen.theme.color.panel = 000042
login-screen.theme.color.text = 0055CC
login-screen.theme.color.muted = 003A8C
login-screen.theme.color.accent = 0055CC
login-screen.theme.color.entry = 000042
login-screen.theme.color.error = 4427AC

login-screen.theme.content_width = 620
login-screen.theme.padding = 42
login-screen.theme.panel_padding = 36
login-screen.theme.panel_alpha = 0.92

login-screen.lock.show_user = yes
login-screen.lock.show_time = yes
login-screen.lock.fade_duration = 1.7
login-screen.lock.blank = yes
login-screen.lock.blank_delay = 1.2
login-screen.lock.input_delay = 15
login-screen.lock.fade_out_duration = 3.0

