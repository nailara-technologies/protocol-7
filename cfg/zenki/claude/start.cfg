## [:< ##

# name  = start.cfg
# descr = 'claude' zenka startup configuration used by 'v7-zenki' zenka

## on-demand : a claude code session runs while it is used, the zenka idles ##
## out between uses [ the session id is kept : the next start resumes it ]  ##

dependencies       = cube
start.on-demand    = 1
restart.disabled   = 1
heartbeat.disabled = 1

: v7-init :
  start_mode = stdin-zenka
  cube.key = [base.prng.chars-anum:44]
  [v7-zenki.callback.setup_zenka_key:<instance_id>,'<zenka_name>',<cube.key>]

: zenka-init :
  [base.auth.set_zenka_key:'<{cube.key}>']
  [base.zenki.set_ondemand_timeout:3900]

