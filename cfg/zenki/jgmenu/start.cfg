## [:< ##

# name  = start.cfg
# descr = jgmenu root menu : a login session program [ exec-external ]

dependencies = cube X-11
max_concurrency = 1
heartbeat.disabled = 1

: v7-init :
  start_mode = exec-external
  exec_bin = jgmenu
  exec_usr = <session-user>
  exec_args = --hide-on-startup

