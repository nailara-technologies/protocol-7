## [:< ##

# name  = start.cfg
# descr = tint2 panel : a login session program [ exec-external ]

dependencies = cube X-11
max_concurrency = 1
heartbeat.disabled = 1

: v7-init :
  start_mode = exec-external
  exec_bin = tint2
  exec_usr = <session-user>
  exec_args = -c <home>/.config/tint2/tint2rc

