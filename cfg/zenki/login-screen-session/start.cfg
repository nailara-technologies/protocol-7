## [:< ##

# name  = start.cfg
# descr = external per-user desktop session started only by login admission

dependencies = cube X-11
max_concurrency = 1
restart.disabled = 1
heartbeat.disabled = 1

: v7-init :
  start_mode = exec-external
  exec_bin = login-screen-session
  exec_usr = root
  exec_usr_from_subname = 1

