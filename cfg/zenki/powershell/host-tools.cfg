.:[ windows host tools : winget packages and pinned url downloads ]:.

## entries drive powershell.host-tools.ensure at zenka init :               ##
## source = winget : resolve an already-installed winget package            ##
##                   [ machine-wide path first , per-user package second ]  ##
## source = url    : fetch the asset into %LOCALAPPDATA%\protocol-7\<name>  ##
##                   and unzip when it is a zip . no upstream digest        ##
##                   exists : the first verified download pins a BMW-384    ##
##                   B32 checksum in data/state/powershell.host-tools.state ##
##                   [ native p7 config style ] ; later downloads must      ##
##                   match the pin or fail closed .                         ##
## cfg_var : dotted %data key receiving the resolved wsl exe path           ##

powershell.tools.usbipd.source       = winget
powershell.tools.usbipd.package      = dorssel.usbipd-win
powershell.tools.usbipd.exe          = usbipd.exe
powershell.tools.usbipd.machine_path = /mnt/c/Program Files/usbipd-win/usbipd.exe
powershell.tools.usbipd.install_hint = winget install dorssel.usbipd-win
powershell.tools.usbipd.cfg_var      = powershell.cfg.usbipd_path

## portable pulseaudio for the windows host [ wslg pulse bridge fallback ]  ##
## pgaskin/pulseaudio-win32 v5 release asset pulseaudio.zip [ ~8.75 MB ] -- ##
## deliberately NOT pasetup.exe [ no installer , no service ]               ##
powershell.tools.pulseaudio.source       = url
powershell.tools.pulseaudio.url          = https://github.com/pgaskin/pulseaudio-win32/releases/download/v5/pulseaudio.zip
powershell.tools.pulseaudio.exe          = pulseaudio/bin/pulseaudio.exe
powershell.tools.pulseaudio.install_hint = auto-downloaded on first use
powershell.tools.pulseaudio.cfg_var      = powershell.cfg.pulseaudio_path

