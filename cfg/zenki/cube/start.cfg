## [:< ##

# name  = start.cfg
# descr = 'cube' zenka start-up configuration used by 'v7-zenki' zenka

max_concurrency   = 1

## raised 13 -> 27 2026-09-17: cube was heartbeat-killed during a routine   ##
## zenka reload today [ whitelist/source reload across the network is       ##
## synchronous work on cube's own event loop, not a hang ] -- 13s + the ~4s ##
## retry tail left too little headroom for that legitimate busy period.     ##
## still deliberately tighter than other zenki since a genuinely hung cube  ##
## blocks the whole network                                                 ##
heartbeat.timeout = 27

: v7-init :
  start_mode = stdin-zenka
  cube.key = [base.prng.chars-anum:44]

: zenka-init :
  [base.auth.set_v7_key:'<{cube.key}>']

: v7-post-init :
  status.post-init = [v7-zenki.callback.connect_to_cube:<instance_id>]
  [v7-zenki.callback.register_ondemand]

: startup-error :
  [v7-zenki.teardown:'start of cube zenka not successful']

