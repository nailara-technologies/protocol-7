## [:< ##

# name  = start.cfg
# descr = 'letsencr' zenka startup configuration used by 'v7-zenki' zenka

## the httpsd group must exist                                             ##
## [ letsencr.init_code makes the cert dir setgid httpsd ] -- it appears   ##
## when the httpsd zenka first drops privs.  a condition, not a dependency ##
## on the running httpsd zenka : once the group exists, letsencr starts    ##
## whether httpsd runs or not. a host without httpsd needs the group       ##
## created once [ groupadd -r httpsd ]                                     ##
dependencies       = cube unix_group:httpsd
start.on-demand    = 1
restart.disabled   = 1
heartbeat.timeout  = 45

: v7-init :
  start_mode = stdin-zenka
  cube.key = [base.prng.chars-anum:44]
  [v7-zenki.callback.setup_zenka_key:<instance_id>,'<zenka_name>',<cube.key>]

: zenka-init :
  [base.auth.set_zenka_key:'<{cube.key}>']
  ## idle exit after ~22 minutes : safe because this start.cfg declares     ##
  ## start.on-demand = 1 -- letsencr has no non-ondemand start path [ both  ##
  ## start-set-up.remote-server* profiles keep it in zenki.on-demand ], so  ##
  ## an always-on start that the timeout could kill does not exist          ##
  [base.zenki.set_ondemand_timeout:1300]

