## [:< ##

# web auth plugin configuration
# shared between web and httpd zenki (reference or symlink)

---
session:
  ttl_seconds: 86400         ## 24 hours ##
  idle_timeout_seconds: 900  ## 15 minutes without real user activity ##
  max_age_seconds: 43200     ## 12 hours from the first token login ##
  overlap_seconds: 30        ## previous-token grace for concurrent tabs ##
  prune_after_epochs: 7      ## keep expired sessions for 7 epochs ##

## no secret in this tracked file -- ever. the token secret comes from   ##
## host config only [ /etc/protocol-7/host-config/<zenka>.cfg :                 ##
##   web.auth.secret = <long random string>                              ##
## the httpd, httpsd and web zenka must carry the SAME value. a missing  ##
## secret fails closed : every auth.required route answers 401 ]        ##
##                                                                        ##
## optional host config keys :                                            ##
##   web.auth.group = httpd     ## unix group of the shared session     ##
##                              ## store [ default 'httpd' ]            ##
##   web.auth.exempt_peers = .. ## extra peers for auth.exempt-loopback ##
##   web.auth.session.idle_timeout_seconds = 900                        ##
##   web.auth.session.max_age_seconds = 43200                           ##
##   web.auth.session.overlap_seconds = 30                              ##

