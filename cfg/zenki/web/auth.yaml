# web auth plugin configuration
# shared between web and httpd zenki (reference or symlink)

---
session:
  ttl_seconds: 86400        ## 24 hours ##
  prune_after_epochs: 7     ## keep expired sessions for 7 epochs ##

## no secret in this tracked file -- ever. the token secret comes from   ##
## host config only [ /etc/protocol-7/<zenka>/host.cfg :                 ##
##   web.auth.secret = <long random string>                              ##
## the httpd and the web zenka must carry the SAME value. a missing      ##
## secret fails closed : every auth.required route answers 401 ]        ##

