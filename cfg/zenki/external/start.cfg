## [:< ##

# name  = start.cfg
# descr = 'external' zenka start-up configuration used by 'v7-zenki' zenka

dependencies = cube nodes

## discover is lan multicast [ orbital links ] : started where it is     ##
## enabled, left out where a host disables it [ remote-server profiles ] ##
optional_dependencies = discover

## started at boot where a host enables it [ host-config/v7-zenki.cfg : ##
## v7-zenki.host.zenki.enable = external ], never on demand : the link  ##
## supervisor opens the managed links at zenka start -- an on-demand    ##
## start would leave them down until the first external.* call          ##
## start.on-demand = 1
heartbeat.timeout = 47

: v7-init :
  start_mode = stdin-zenka
  cube.key = [base.prng.chars-anum:44]
  [v7-zenki.callback.setup_zenka_key:<instance_id>,'<zenka_name>',<cube.key>]

: zenka-init :
  [base.auth.set_zenka_key:'<{cube.key}>']

