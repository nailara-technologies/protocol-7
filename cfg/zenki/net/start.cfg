## [:< ##

# name  = start.cfg
# descr = 'net' zenka startup configuration used by 'v7-zenki' zenka

dependencies    = cube
start.on-demand    = 1
restart.disabled   = 1
stdio.multiplex    = yes

: v7-init :
  start_mode = stdin-zenka
  cube.key = [base.prng.chars-anum:44]
  [v7-zenki.callback.setup_zenka_key:<instance_id>,'<zenka_name>',<cube.key>]

: zenka-init :
  [base.auth.set_zenka_key:'<{cube.key}>']
  [base.zenki.set_ondemand_timeout:780]
  [base.stdio_multiplex.connect]

