## [:< ##

# name  = start.cfg
# descr = 'events' zenka startup configuration used by 'v7-zenki' zenka

dependencies = cube
max_concurrency = 1

## heartbeat timeout 27 [ 2026-11-27 ] : the 17 s fallback cost a restart ##
## on a short load burst -- a restart costs more than waiting             ##
heartbeat.timeout = 27

: v7-init :
  start_mode = stdin-zenka
  cube.key = [base.prng.chars-anum:44]
  [v7-zenki.callback.setup_zenka_key:<instance_id>,'<zenka_name>',<cube.key>]

: zenka-init :
  [base.auth.set_zenka_key:'<{cube.key}>']

