## [:< ##

# name  = ext-pkg registry entry : kimi-cli
# descr = kimi code cli [ moonshot ] .., installed via uv tool

name: kimi-cli
manager: uv-tool
package: kimi-cli

## presence check : exit 0 = present .., stdout captured for version     ##
check: command -v kimi >/dev/null 2>&1 && kimi --version

## install [ only ever run when the check fails .., never to upgrade ]  ##
install: uv tool install kimi-cli

## verified 2026-07-29 : PyPI package 'kimi-cli' .., uv tool install is  ##
## how it is actually installed on this host [ shim ~/.local/bin/kimi    ##
## -> ~/.local/share/uv/tools/kimi-cli/ ] .., uv is at /usr/local/bin    ##
## [ system-wide , not user-scoped like nvm ] .., NOTE : the npm         ##
## package named 'kimi-cli' is an UNRELATED front-end tool [ 0.0.2 ]     ##
self_updating: true
update_owner: uv tool upgrade kimi-cli

