## [:< ##

# name  = pressure.cfg
# descr = host memory\io pressure sampler thresholds [ v7-zenki ]

.: memory pressure sampler :.

## sampler ##
v7-zenki.cfg.pressure.sample_interval   = 5      ## seconds between samples
v7-zenki.cfg.pressure.ring_size         = 72     ## samples kept [ 6 min ]
v7-zenki.cfg.pressure.curve_values      = 24     ## values shown in curve

## hysteresis [ sustained samples to enter \ leave a level ] ##
v7-zenki.cfg.pressure.enter_samples     = 3
v7-zenki.cfg.pressure.leave_samples     = 13     ## ~1 min [ 5s samples ]

## elevated ##
v7-zenki.cfg.pressure.elevated.mem_full_avg60  = 1.0    ## psi mem full avg60 [ steady ]
v7-zenki.cfg.pressure.elevated.mem_some_avg60  = 10.0   ## psi mem some avg60
v7-zenki.cfg.pressure.elevated.swap_pps        = 256    ## swap in+out pages\s
v7-zenki.cfg.pressure.elevated.min_avail_mb    = 1024   ## MemAvailable floor

## critical ##
v7-zenki.cfg.pressure.critical.mem_full_avg10  = 5.0    ## psi mem full avg10
v7-zenki.cfg.pressure.critical.mem_full_avg60  = 5.0    ## psi mem full avg60
v7-zenki.cfg.pressure.critical.swap_pps        = 2048   ## swap in+out pages\s
v7-zenki.cfg.pressure.critical.min_avail_mb    = 256    ## MemAvailable floor

## heartbeat : a late reply under pressure extends the timeout instead of ##
## counting it [ secs per extension, max extensions per level ]           ##
v7-zenki.cfg.pressure.heartbeat_ext.secs       = 17
v7-zenki.cfg.pressure.heartbeat_ext.elevated   = 3      ## ~51s extra
v7-zenki.cfg.pressure.heartbeat_ext.critical   = 6      ## ~102s extra

## restart gate : an error-path restart [ heartbeat \ start timeout,     ##
## crash ] is deferred while critical, released per sample [ one per    ##
## sample while not calm ] -- manual restarts are never gated           ##
v7-zenki.cfg.pressure.restart_gate.enabled     = 1
v7-zenki.cfg.pressure.restart_gate.max_wait    = 300    ## secs, then restart anyway

## start gate : on-demand starts + start-set-up autostarts go one per   ##
## sample while elevated \ critical and wait for MemAvailable above     ##
## estimate + reserve [ small hosts ]. max wait stays below cube's      ##
## ondemand starting watchdog [ 90s, system.ondemand_starting_watchdog_timeout ] ##
v7-zenki.cfg.pressure.start_gate.enabled       = 1
v7-zenki.cfg.pressure.start_gate.max_wait      = 45     ## secs, then start anyway
v7-zenki.cfg.pressure.start_gate.reserve_mb    = 256    ## MemAvailable kept free
v7-zenki.cfg.pressure.start_gate.default_estimate_mb = 64  ## per zenka [ until 6b ]

