## [:< ##

# name  = pressure.cfg
# descr = host memory\io pressure sampler thresholds [ v7-zenki ]

.: memory pressure sampler :.

## sampler ##
v7-zenki.cfg.pressure.sample_interval   = 5      ## seconds between samples
v7-zenki.cfg.pressure.ring_size         = 72     ## samples kept [ 6 min ]
v7-zenki.cfg.pressure.curve_values      = 24     ## values shown in curve

## hysteresis [ sustained samples to enter \ leave a level ] ##
v7-zenki.cfg.pressure.enter_samples     = 3
v7-zenki.cfg.pressure.leave_samples     = 6

## elevated ##
v7-zenki.cfg.pressure.elevated.mem_full_avg10  = 1.0    ## psi mem full avg10
v7-zenki.cfg.pressure.elevated.mem_some_avg10  = 10.0   ## psi mem some avg10
v7-zenki.cfg.pressure.elevated.swap_pps        = 256    ## swap in+out pages\s
v7-zenki.cfg.pressure.elevated.min_avail_mb    = 1024   ## MemAvailable floor

## critical ##
v7-zenki.cfg.pressure.critical.mem_full_avg10  = 5.0    ## psi mem full avg10
v7-zenki.cfg.pressure.critical.mem_full_avg60  = 5.0    ## psi mem full avg60
v7-zenki.cfg.pressure.critical.swap_pps        = 2048   ## swap in+out pages\s
v7-zenki.cfg.pressure.critical.min_avail_mb    = 256    ## MemAvailable floor

