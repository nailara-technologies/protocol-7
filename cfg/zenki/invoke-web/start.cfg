## [:< ##

# name  = start.cfg
# descr = 'invoke-web' zenka startup configuration used by 'v7-zenki' zenka

dependencies = cube

start.on-demand    = 1
restart.disabled   = 1
max_concurrency    = 1

## heartbeat timeout 47 [ 2026-11-27 ] : on the 17 s fallback it timed out  ##
## while a render was finishing -- keep-children saved the render, a safety ##
## net, not a rhythm to rely on                                             ##
heartbeat.timeout  = 47

## crash keep-children : on status 'error' [ e.g. heartbeat timeout ] v7    ##
## does NOT kill the registered children [ invoke.ai ] -- the next instance ##
## claims them by name [ v7-zenki.claim-children ]. unclaimed kept children ##
## are terminated after the grace period. a planned end                     ##
## [ terminate \ restart \ idle-term \ drain ] ends them as before          ##
restart.keep_children        = yes
restart.keep_children_grace  = 120

: v7-init :
  start_mode = stdin-zenka
  invoke-web.key = [base.prng.chars-anum:44]
  [v7-zenki.callback.setup_zenka_key:<instance_id>,'<zenka_name>',<invoke-web.key>]

: zenka-init :
  [base.auth.set_zenka_key:'<{invoke-web.key}>']
  [base.zenki.set_ondemand_timeout:300]

