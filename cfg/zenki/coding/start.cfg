## [:< ##

# name  = start.cfg
# descr = 'coding' zenka startup configuration used by 'v7-zenki' zenka

dependencies       = cube
start.on-demand    = 1
restart.disabled   = 1
max_concurrency    = 1
restart.min_delay  = 1.3

## heartbeat re-enabled 2026-08-26 [ was disabled before the ondemand ##
## heartbeat/idle-timeout conflict fix, commit 3f386f6de2d ]. 47s     ##
## response-wait matches the established convention already used by   ##
## mpv/tile/window-place/screen-setup/select-region/content/weather/  ##
## external [ default is 17s ] -- coding's self-test / model-switch   ##
## cycles are already fully async so this isn't compensating for a    ##
## blocked event loop, just tolerating real GPU-backend hiccups       ##
##
## raised 47 -> 77 2026-09-17: heartbeat-killed live during the model  ##
## sweep when both backends switched candidates within the same ~15s   ##
## window [ 6+ llama-server children spawned back to back ]. the self- ##
## test code itself is confirmed non-blocking, so this is real system- ##
## level contention [ concurrent multi-GB GGUF loads on both backends  ##
## saturating disk I/O / CPU ], not a code hang -- the 2026-08-26      ##
## assumption above held for the code path, just not for the resource  ##
## envelope a concurrent two-backend sweep can hit                     ##
heartbeat.timeout = 77

: v7-init :
  start_mode = stdin-zenka
  coding.key = [base.prng.chars-anum:44]
  [v7-zenki.callback.setup_zenka_key:<instance_id>,'<zenka_name>',<coding.key>]

: zenka-init :
  [base.auth.set_zenka_key:'<{coding.key}>']
  [base.zenki.set_ondemand_timeout:4620]

