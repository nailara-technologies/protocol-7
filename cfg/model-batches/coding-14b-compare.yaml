# 14b-class coding comparison -- 2026-10-10
# the default 9b against the three 14b models on disk [ all fit 12 GB at
# Q4_K_M ]. three task kinds : a doc from reading code, a small edit of an
# existing module [ the everyday case ], and a new module with exact
# binary parsing [ the hard case, from qwen38-fable5-coding ]. scored by
# model_batch.score.task : criteria hits + bin/format-code -c of touched
# src/ files. capture/revert between tasks keeps the tree pristine.

batch_spec_version: 1
backend: gpu

models:
  - OFSQC4I:QDBKEXY    # Qwen3.8 9B Heretic Uncensored Q4_K_M [default]
  - 72T4WFI:TK55OIY    # Qwen3.6 14B A3B FableVibes Q4_K_M [moe, vision]
  - EBCVWUQ:DTQAPFQ    # Qwen Security Builder 14b Q4_K_M
  - XFX2XIQ:MWUPQMA    # Qwen Security Auditor 14b Q4_K_M

reference_tps: 20

tasks:
  - id: sweep-cursor-doc
    budget_hint: 600
    prompt: |
      work submit "read src/coding.model_sweep.handler.poll_sweep, then
      create src/doc/model-sweep-cursor.md : explain in maximum 30 lines
      how the sweep cursor survives a zenka restart and under what exact
      condition the circuit breaker pauses the sweep. write the file, then
      reply with a single-line confirmation."
    criteria:
      - cursor
      - restart
      - breaker

  - id: label-size-edit
    budget_hint: 600
    prompt: |
      work submit "edit src/coding.image.label : when $image->{'bytes'} is
      a positive number, add the encoded size to the label as KB with one
      decimal [ e.g. '[ image : a.png, image/png, 800x600, 41.3 KB ]' ].
      keep everything else as it is and keep the house style [ lowercase
      ## comments with [ ] annotations ]. then reply with a single-line
      confirmation."
    criteria:
      - bytes
      - KB
      - '%.1f'

  - id: dims-from-header-module
    budget_hint: 900
    prompt: |
      work submit "read src/coding.image.label and src/coding.image.mime_from_magic
      for the module format and house style [ header comments, lowercase
      ## comments with [ ] annotations, no sub { } wrapper : the file body
      is the subroutine ]. then create src/coding.image.dims_from_header : it
      takes the first bytes of an image file as a string and returns
      ( width, height ) read from the header for png [ IHDR chunk ], gif
      [ logical screen descriptor ] and jpeg [ scan the segments to the first
      SOF0..SOF15 start-of-frame marker, skipping DHT, DAC and JPG ], or an
      empty list when the format is unknown or the bytes are too short. write
      the file, then reply with a single-line confirmation."
    criteria:
      - IHDR
      - SOF
      - width
      - height
