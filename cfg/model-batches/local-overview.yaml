# mmproj-free weight ), one small real task each. purpose : a first
# broad tps/verdict survey of what is worth deeper experimentation.
# the runner's own machinery handles non-fitting candidates : they fail
# to spawn, get a startup verdict, and the circuit breaker pauses on
# repeated identical crash signatures [ resume with :force: ].

