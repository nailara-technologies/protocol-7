<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker - Enhanced</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #000000; color: #8ddeff; }
        .min-h-screen { min-height: 100vh; }
        .bg-slate-900 { background-color: #0a0a1a; }
        .text-blue-100 { color: #8ddeff; }
        .p-4 { padding: 1rem; }
        .max-w-4xl { max-width: 64rem; margin: auto; }
        .space-y-6 { display: flex; flex-direction: column; gap: 1.5rem; }
        .bg-slate-800 { background-color: #131340; }
        .border-slate-700 { border-color: #2a2260; }
        .text-xl { font-size: 1.5rem; }
        .text-blue-300 { color: #40f0ff; }
        .card-header { padding: 1rem; }
        .card-title { margin: 0; font-weight: bold; }
        .card-content { padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .grid { display: grid; gap: 1rem; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        @media (min-width: 768px) {
            .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        .h-8 { height: 2rem; }

            padding: 0 5px 2px 5px;
            border: none;
            border-radius: 0.25rem;
            color: rgba(224, 255, 255, 0.85);
            cursor: pointer;

        button:hover {
            color: rgba(224, 255, 255, 1);

        }
        .move-btn {
            background-color: rgba(64, 240, 255, 0.25);
            color: rgba(64, 240, 255, 0.85);
        }
        .move-btn:hover {
            background-color: rgba(64, 240, 255, 0.35);
            color: rgba(64, 240, 255, 1);
            box-shadow: 0 0 10px rgba(64, 240, 255, 0.5);

            background-color: rgba(42, 34, 96, 0.3);

            background-color: rgba(170, 136, 0, 0.4);
            color: rgba(255, 240, 128, 0.85);
        }
        .hover\:bg-yellow-800:hover {

            color: rgba(255, 240, 128, 1);

        }
        .bg-violet-900 {
            background-color: rgba(75, 0, 130, 0.5);
        }
        .hover\:bg-violet-800:hover {

        }
        .bg-green-900 {
            background-color: rgba(0, 153, 68, 0.4);
            color: rgba(159, 255, 128, 0.85);
        }
        .hover\:bg-green-800:hover {
            background-color: rgba(0, 170, 68, 0.5);
            color: rgba(159, 255, 128, 1);
            box-shadow: 0 0 10px rgba(159, 255, 128, 0.5);
        }
        .bg-red-900 {
            background-color: rgba(170, 17, 51, 0.4);
            color: rgba(255, 51, 102, 0.85);
        }
        .hover\:bg-red-800:hover {
            background-color: rgba(255, 0, 85, 0.5);
            cursor: pointer;
            color: rgba(255, 51, 102, 1);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);

        .bg-orange-900 {
            background-color: rgba(170, 85, 0, 0.4);
            color: rgba(255, 170, 85, 0.85);
        }
        .hover\:bg-orange-800:hover {
            background-color: rgba(204, 102, 0, 0.5);
            color: rgba(255, 170, 85, 1);
            box-shadow: 0 0 10px rgba(255, 170, 85, 0.5);
        }
        .edit-form {
            display: none;
            padding: 1rem;
            background-color: #0a0a1a;
            border-radius: 0.25rem;
            margin-top: 0.5rem;
        }
        .edit-form.active {
            display: block;
        }
        .edit-form input,
        .edit-form select {
            width: 100%;
            margin-bottom: 0.5rem;
        }
        .edit-form-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        label.glow-button {
            padding: 0.5rem 1rem;
            display: inline-block;
        }
        .archive-info {
            font-size: 0.875rem;
            color: rgba(141, 222, 255, 0.7);
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen bg-slate-900 text-blue-100 p-4">
        <div class="max-w-4xl mx-auto space-y-6">
            <!-- Storage Controls -->
            <div class="bg-slate-800 border-slate-700 no-print neon-border">
                <div class="card-header">
                    <h1 class="text-xl text-blue-300">Bewerbungen Speichern</h1>
                </div>
                <div class="card-content">
                    <div class="storage-controls">
                        <button id="loadStorageBtn" class="glow-button">Daten Laden</button>
                        <button id="saveStorageBtn" class="glow-button">Daten Speichern</button>
                        <button id="clearStorageBtn" class="bg-red-900 hover:bg-red-800">Daten Löschen</button>
                    </div>
                    <div class="storage-controls">
                        <label for="csvFileInput" class="glow-button" style="cursor: pointer; margin: 0;">
                            CSV Importieren
                            <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
                        </label>
                        <button id="exportCSVFileBtn" class="glow-button">CSV Exportieren</button>
                    </div>
                    <div class="storage-controls">
                        <label for="archiveFileInput" class="bg-orange-900 hover:bg-orange-800" style="cursor: pointer; margin: 0; padding: 0.5rem 1rem; display: inline-block; border-radius: 0.25rem;">
                            Archiv Importieren
                            <input type="file" id="archiveFileInput" accept=".csv" style="display: none;">
                        </label>
                        <button id="exportArchiveBtn" class="bg-orange-900 hover:bg-orange-800">Archiv Exportieren</button>
                        <button id="toggleArchiveViewBtn" class="glow-button">Archiv anzeigen</button>
                    </div>
                    <div class="archive-info">
                        Archiv: <span id="archiveCount">0</span> Einträge
                    </div>
                </div>
            </div>

            <!-- Input Form -->
            <div class="bg-slate-800 border-slate-700 no-print neon-border">
                <div class="card-header">
                    <h1 class="text-xl text-blue-300">Neue Bewerbung</h1>
                </div>
                <div class="card-content">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="date" name="date" id="dateInput" class="bg-slate-700 border-slate-600 text-white" required>
                        <input type="text" name="company" id="companyInput" placeholder="Unternehmen" class="bg-slate-700 border-slate-600 text-white" required>
                        <input type="text" name="position" id="positionInput" placeholder="Position" class="bg-slate-700 border-slate-600 text-white" required>
                        <select id="statusSelect" class="bg-slate-700 border-slate-600 text-white">
                            <option value="pending">Noch ausstehend</option>
                            <option value="rejected">Absage erhalten</option>
                            <option value="interview_scheduled">Vorstellungsgespräch geplant</option>
                            <option value="interview_completed">Vorstellungsgespräch abgeschlossen</option>
                            <option value="offer_received">Angebot erhalten</option>
                            <option value="offer_accepted">Angebot angenommen</option>
                            <option value="offer_declined">Angebot abgelehnt</option>
                        </select>
                    </div>
                    <div id="duplicateNotice" class="duplicate-notice">
                        ⚠ Mögliches Duplikat gefunden.
                    </div>
                    <div class="flex gap-2">
                        <button id="addApplicationBtn" class="w-full bg-violet-900 hover:bg-violet-800 action-btn glow-button">Bewerbung hinzufügen</button>
                    </div>
                </div>
                <div style="text-align: right; padding-right: 4px;">
                    <span id="addTestDataBtn"
                          style="font-size: 10px; opacity: 0.5; cursor: pointer; transition: all 0.2s ease;"
                          onmouseover="this.style.textShadow='0 0 10px #9fff80'; this.style.color='#9fff80'; this.style.opacity='0.9';"
                          onmouseout="this.style.textShadow='none'; this.style.color='rgb(71, 85, 105)'; this.style.opacity='0.5';"
                          onmousedown="this.style.textShadow='0 0 10px #40a9ff'; this.style.color='#40a9ff';"
                          onmouseup="this.style.textShadow='0 0 10px #9fff80'; this.style.color='#9fff80';"
                          class="text-slate-600 select-none">Testdaten</span>
                </div>
            </div>

            <!-- Applications List -->
            <div id="applicationsList" class="space-y-4 no-print"></div>

            <!-- Archive List (hidden by default) -->
            <div id="archiveList" class="space-y-4 no-print" style="display: none;">
                <div class="bg-slate-800 border-slate-700 neon-border">
                    <div class="card-header">
                        <h2 class="text-xl text-blue-300">Archivierte Bewerbungen</h2>
                    </div>
                    <div id="archiveListContent" class="card-content"></div>
                </div>
            </div>

            <!-- Export Section -->
            <div id="exportSection" class="p-4 bg-slate-800 rounded no-print neon-border">
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <span>Gesamt: <span id="applicationCount">0</span> Bewerbungen</span>
                    </div>
                    <div class="flex gap-2">
                        <button id="toggleExportBtn" class="bg-violet-900 hover:bg-violet-800 glow-button">Export anzeigen</button>
                    </div>
                </div>
                <div id="exportContent" style="display: none;">
                    <div class="mt-4 flex gap-2 mb-4">
                        <button id="exportTableBtn" class="bg-violet-900 hover:bg-violet-800 glow-button">Tabelle</button>
                        <button id="exportCSVBtn" class="bg-violet-900 hover:bg-violet-800 glow-button">CSV</button>
                    </div>
                    <div id="printSection" class="p-4 bg-slate-900 rounded"></div>
                    <div id="csvActions" class="csv-actions" style="display: none;">
                        <a id="downloadCSVBtn" href="#" class="download-link">Als CSV speichern</a>
                    </div>
                    <div class="mt-4">
                        <button id="printBtn" class="bg-slate-700 hover:bg-slate-600 action-btn glow-button">Drucken</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        ////////////////////////////////////////////////////////////////
        // ╔══════════════════════════════════════════════════════════╗
        // ║  AMOS7 ELF-7 CHECKSUM LIBRARY - REUSABLE COMPONENT      ║
        // ║  Based on AMOS7::CHKSUM::ELF Perl implementation         ║
        // ║  Version: AMOS-13-ELF-7-JS                               ║
        // ╚══════════════════════════════════════════════════════════╝
        ////////////////////////////////////////////////////////////////

        /**
         * ELF-7 Checksum Algorithm (AMOS7 JavaScript Port)
         *
         * Harmonic checksum algorithm using division by 13 properties.
         * Supports multiple modes (4, 7) and configurable shift bits.
         *
         * @param {string} str - Input string to checksum
         * @param {number} start_sum - Starting checksum value (for continuation)
         * @param {number} elf_mode - ELF mode: 4 (stable) or 7 (entropic)
         * @param {number} shift_bits - Right shift bits (default: 13 for AMOS7)
         * @returns {number} 32-bit unsigned integer checksum
         */
        function elf7_checksum(str, start_sum = 0, elf_mode = 7, shift_bits = 13) {
            const overflow_threshold = 0xFE000000;  // AMOS-13-ELF-7 threshold
            let result = start_sum >>> 0;           // Ensure unsigned 32-bit
            let carryover;

            const left = elf_mode;                  // Left shift value
            const right = shift_bits;               // Right shift value
            const shift_limit = (~result >>> 0) >>> 4;
            let actual_left = left;

            // Process each character
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);

                // Reset shift to prevent entropy loss
                if (actual_left > 4 && result >= shift_limit) {
                    actual_left = 4;
                }

                // Core ELF algorithm
                result = ((result << actual_left) + char) >>> 0;

                // Handle overflow
                carryover = result & overflow_threshold;
                if (carryover) {
                    result ^= carryover >>> right;
                }
                result &= ~carryover;
            }

            return result;
        }

        /**
         * Normalize string for checksum comparison
         * Removes common variations that should be treated as identical
         *
         * @param {string} str - Input string
         * @returns {string} Normalized string
         */
        function normalize_for_checksum(str) {
            return str
                .toLowerCase()
                .replace(/\s+/g, ' ')                    // Normalize whitespace
                .replace(/[^a-z0-9\s]/g, '')            // Remove special chars
                .replace(/\b(gmbh|ag|llc|inc|corp|ltd|limited|plc|sa|se|kg|ohg|gbr)\b/gi, '')
                .trim();
        }

        /**
         * Generate 64-bit checksum from string (mode 4 + mode 7)
         * Returns high/low 32-bit values for quad-integer encoding
         *
         * @param {string} str - Input string
         * @returns {Object} {high: number, low: number, combined: string}
         */
        function generate_checksum_64(str) {
            const norm = normalize_for_checksum(str);

            // Mode 4: Stable, consistent for similar strings
            const cksum_m4 = elf7_checksum(norm, 0, 4, 13);

            // Mode 7: Entropic, differentiates similar strings
            const cksum_m7 = elf7_checksum(norm, 0, 7, 13);

            // Format as 18-digit string (9 digits each, zero-padded)
            // Compatible with quad-integer BASE32 encoding
            return {
                high: cksum_m4,
                low: cksum_m7,
                combined: String(cksum_m4).padStart(9, '0') +
                         String(cksum_m7).padStart(9, '0')
            };
        }

        /**
         * Check if two checksum objects match
         *
         * @param {Object} cksum1 - First checksum {high, low}
         * @param {Object} cksum2 - Second checksum {high, low}
         * @returns {boolean} True if checksums match
         */
        function checksums_match(cksum1, cksum2) {
            return cksum1.high === cksum2.high &&
                   cksum1.low === cksum2.low;
        }

        ////////////////////////////////////////////////////////////////
        // ╔══════════════════════════════════════════════════════════╗
        // ║  END OF REUSABLE CHECKSUM LIBRARY                        ║
        // ╚══════════════════════════════════════════════════════════╝
        ////////////////////////////////////////////////////////////////

        // Initialize applications array and archive
        let applications = [];
        let archive = [];
        let currentFormat = 'table';
        let isExportVisible = false;
        let isArchiveVisible = false;
        let editingId = null;

        // LocalStorage keys
        const STORAGE_KEY = 'jobTrackerApplications';
        const ARCHIVE_KEY = 'jobTrackerArchive';

        // Functions for localStorage operations
        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(applications));
                localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archive));
                showNotification('Daten erfolgreich gespeichert!', 'success');
            } catch (error) {
                console.error('Error saving to localStorage:', error);
                showNotification('Fehler beim Speichern der Daten!', 'error');
            }
        }

        function loadFromLocalStorage() {
            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                const storedArchive = localStorage.getItem(ARCHIVE_KEY);

                if (storedData) {
                    applications = JSON.parse(storedData);
                }
                if (storedArchive) {
                    archive = JSON.parse(storedArchive);
                }

                renderApplicationsList();
                renderArchiveList();
                updateApplicationCount();
                updateArchiveCount();
                updateExport();

                const totalLoaded = applications.length + archive.length;
                showNotification(`${totalLoaded} Einträge geladen (${applications.length} aktiv, ${archive.length} archiviert)`, 'success');
            } catch (error) {
                console.error('Error loading from localStorage:', error);
                showNotification('Fehler beim Laden der Daten!', 'error');
            }
        }

        function clearLocalStorage() {
            try {
                if (confirm('Möchten Sie wirklich alle gespeicherten Daten (inkl. Archiv) löschen?')) {
                    localStorage.removeItem(STORAGE_KEY);
                    localStorage.removeItem(ARCHIVE_KEY);
                    applications = [];
                    archive = [];
                    renderApplicationsList();
                    renderArchiveList();
                    updateApplicationCount();
                    updateArchiveCount();
                    updateExport();
                    showNotification('Alle Daten wurden gelöscht!', 'success');
                }
            } catch (error) {
                console.error('Error clearing localStorage:', error);
                showNotification('Fehler beim Löschen der Daten!', 'error');
            }
        }

        // Archive functions
        function archiveApplication(id) {
            const index = applications.findIndex(app => app.id === id);
            if (index !== -1) {
                const app = applications[index];

                // Create archive entry
                const archiveEntry = {
                    checksum_h: app.checksum_h,
                    checksum_l: app.checksum_l,
                    company: app.company,
                    position: app.position,
                    date: app.date
                };

                // Add to archive if not already there
                const exists = archive.some(a =>
                    a.checksum_h === archiveEntry.checksum_h &&
                    a.checksum_l === archiveEntry.checksum_l
                );

                if (!exists) {
                    archive.push(archiveEntry);
                }

                // Remove from applications
                applications.splice(index, 1);

                renderApplicationsList();
                renderArchiveList();
                updateApplicationCount();
                updateArchiveCount();
                updateExport();

                showNotification('Bewerbung archiviert!', 'success');
            }
        }

        function restoreFromArchive(checksum_h, checksum_l) {
            const index = archive.findIndex(a =>
                a.checksum_h === checksum_h &&
                a.checksum_l === checksum_l
            );

            if (index !== -1) {
                const archiveEntry = archive[index];

                // Create new application from archive
                const application = {
                    id: Date.now(),
                    date: archiveEntry.date,
                    company: archiveEntry.company,
                    position: archiveEntry.position,
                    status: 'pending',
                    checksum_h: archiveEntry.checksum_h,
                    checksum_l: archiveEntry.checksum_l
                };

                // Add to applications
                applications.push(application);

                // Remove from archive
                archive.splice(index, 1);

                renderApplicationsList();
                renderArchiveList();
                updateApplicationCount();
                updateArchiveCount();
                updateExport();

                showNotification('Bewerbung wiederhergestellt!', 'success');
            }
        }

        function deleteArchiveEntry(checksum_h, checksum_l) {
            if (confirm('Möchten Sie diesen Archiv-Eintrag wirklich löschen?')) {
                const index = archive.findIndex(a =>
                    a.checksum_h === checksum_h &&
                    a.checksum_l === checksum_l
                );

                if (index !== -1) {
                    archive.splice(index, 1);
                    renderArchiveList();
                    updateArchiveCount();
                    showNotification('Archiv-Eintrag gelöscht!', 'success');
                }
            }
        }

        function renderArchiveList() {
            const archiveListContent = document.getElementById('archiveListContent');

            if (archive.length === 0) {

        // Archive CSV Import/Export
        function parseArchiveCSV(csvText) {
            const lines = csvText.trim().split('\n');
            if (lines.length < 2) {
                throw new Error('Archiv-CSV ist leer oder ungültig');
            }

            const header = lines[0].split(';').map(h => h.trim());
            const requiredFields = ['Datum', 'Firma', 'Position', 'Checksum_H', 'Checksum_L'];
            const missingFields = requiredFields.filter(field => !header.includes(field));

            if (missingFields.length > 0) {
                throw new Error(`Fehlende Spalten: ${missingFields.join(', ')}`);
            }

            const archiveEntries = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const values = line.split(';').map(v => v.trim());
                if (values.length < 5) {
                    console.warn(`Zeile ${i + 1} übersprungen: zu wenige Felder`);
                    continue;
                }

                const dateIdx = header.indexOf('Datum');
                const companyIdx = header.indexOf('Firma');
                const positionIdx = header.indexOf('Position');
                const checksumHIdx = header.indexOf('Checksum_H');
                const checksumLIdx = header.indexOf('Checksum_L');

                const date = values[dateIdx];
                const company = values[companyIdx];
                const position = values[positionIdx];
                const checksum_h = parseInt(values[checksumHIdx]) || 0;
                const checksum_l = parseInt(values[checksumLIdx]) || 0;

                if (!date || !company || !position || !checksum_h || !checksum_l) {
                    console.warn(`Zeile ${i + 1} übersprungen: ungültige Daten`);
                    continue;
                }

                archiveEntries.push({
                    date,
                    company,
                    position,
                    checksum_h,
                    checksum_l
                });
            }

            return archiveEntries;
        }

        function handleArchiveImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const csvText = e.target.result;
                    const importedEntries = parseArchiveCSV(csvText);

                    if (importedEntries.length === 0) {
                        showNotification('Keine gültigen Archiv-Daten gefunden', 'error');
                        return;
                    }

                    let newCount = 0;
                    let duplicateCount = 0;

                    importedEntries.forEach(entry => {
                        const exists = archive.some(a =>
                            a.checksum_h === entry.checksum_h &&
                            a.checksum_l === entry.checksum_l
                        );

                        if (!exists) {
                            archive.push(entry);
                            newCount++;
                        } else {
                            duplicateCount++;
                        }
                    });

                    renderArchiveList();
                    updateArchiveCount();

                    let message = `${newCount} Archiv-Einträge importiert`;
                    if (duplicateCount > 0) {
                        message += `, ${duplicateCount} Duplikate übersprungen`;
                    }
                    showNotification(message, 'success');

                } catch (error) {
                    console.error('Archive Import Error:', error);
                    showNotification(`Fehler beim Importieren: ${error.message}`, 'error');
                }

                event.target.value = '';
            };

            reader.onerror = function() {
                showNotification('Fehler beim Lesen der Datei', 'error');
            };

            reader.readAsText(file, 'UTF-8');
        }

        function exportArchive() {
            if (archive.length === 0) {
                showNotification('Kein Archiv zum Exportieren vorhanden', 'error');

            const csvContent = `Datum;Firma;Position;Checksum_H;Checksum_L\n${

        // CSV Import/Export Functions (for applications)
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            if (lines.length < 2) {
                throw new Error('CSV-Datei ist leer oder ungültig');
            }

            const header = lines[0].split(';').map(h => h.trim());
            const requiredFields = ['Datum', 'Firma', 'Position', 'Status'];
            const missingFields = requiredFields.filter(field => !header.includes(field));

            if (missingFields.length > 0) {
                throw new Error(`Fehlende Spalten: ${missingFields.join(', ')}`);
            }

            const applications = [];
            const statusMap = {
                'Noch ausstehend': 'pending',
                'Absage erhalten': 'rejected',
                'Vorstellungsgespräch geplant': 'interview_scheduled',
                'Vorstellungsgespräch abgeschlossen': 'interview_completed',
                'Angebot erhalten': 'offer_received',
                'Angebot angenommen': 'offer_accepted',
                'Angebot abgelehnt': 'offer_declined'
            };

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const values = line.split(';').map(v => v.trim());
                if (values.length < 4) {
                    console.warn(`Zeile ${i + 1} übersprungen: zu wenige Felder`);
                    continue;
                }

                const dateIdx = header.indexOf('Datum');
                const companyIdx = header.indexOf('Firma');
                const positionIdx = header.indexOf('Position');
                const statusIdx = header.indexOf('Status');

                const date = values[dateIdx];
                const company = values[companyIdx];
                const position = values[positionIdx];
                const statusLabel = values[statusIdx];
                const status = statusMap[statusLabel] || 'pending';

                if (!date || !company || !position) {
                    console.warn(`Zeile ${i + 1} übersprungen: fehlende Pflichtfelder`);
                    continue;
                }

                const checksum = generate_checksum_64(company + '|' + position);

                applications.push({
                    id: Date.now() + i,
                    date,
                    company,
                    position,
                    status,
                    checksum_h: checksum.high,
                    checksum_l: checksum.low
                });
            }

            return applications;
        }

        function handleCSVImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const csvText = e.target.result;
                    const importedApps = parseCSV(csvText);

                    if (importedApps.length === 0) {
                        showNotification('Keine gültigen Daten in CSV gefunden', 'error');
                        return;
                    }

                    let newCount = 0;
                    let duplicateCount = 0;

                    importedApps.forEach(importedApp => {
                        const exists = applications.some(app =>
                            app.checksum_h === importedApp.checksum_h &&
                            app.checksum_l === importedApp.checksum_l
                        );

                        if (!exists) {
                            applications.push(importedApp);
                            newCount++;
                        } else {
                            duplicateCount++;
                        }
                    });

                    renderApplicationsList();
                    updateApplicationCount();
                    updateExport();

                    let message = `${newCount} Bewerbungen importiert`;
                    if (duplicateCount > 0) {
                        message += `, ${duplicateCount} Duplikate übersprungen`;
                    }
                    showNotification(message, 'success');

                } catch (error) {
                    console.error('CSV Import Error:', error);
                    showNotification(`Fehler beim Importieren: ${error.message}`, 'error');
                }

                event.target.value = '';
            };

            reader.onerror = function() {
                showNotification('Fehler beim Lesen der Datei', 'error');
            };

            reader.readAsText(file, 'UTF-8');
        }

        // Duplicate detection (checks both applications and archive)
        function checkForDuplicate(company, position) {
            if (!company || !position) return null;

            const checksum = generate_checksum_64(company + '|' + position);

            // Check in active applications
            const activeMatch = applications.find(app =>
                app.checksum_h === checksum.high &&
                app.checksum_l === checksum.low
            );

            if (activeMatch) {
                return { source: 'active', data: activeMatch };
            }

            // Check in archive
            const archiveMatch = archive.find(entry =>
                entry.checksum_h === checksum.high &&
                entry.checksum_l === checksum.low
            );

            if (archiveMatch) {
                return { source: 'archive', data: archiveMatch };
            }

            return null;
        }

        // Update duplicate warning UI
        function updateDuplicateWarning() {
            const company = document.getElementById('companyInput').value;
            const position = document.getElementById('positionInput').value;
            const duplicateNotice = document.getElementById('duplicateNotice');
            const companyInput = document.getElementById('companyInput');
            const positionInput = document.getElementById('positionInput');

            const duplicate = checkForDuplicate(company, position);

            if (duplicate) {
                duplicateNotice.classList.add('show');
                if (duplicate.source === 'active') {
                    duplicateNotice.textContent = `⚠ Aktives Duplikat: ${duplicate.data.company} - ${duplicate.data.position} (${duplicate.data.date})`;
                } else {
                    duplicateNotice.textContent = `⚠ Im Archiv: ${duplicate.data.company} - ${duplicate.data.position} (${duplicate.data.date})`;
                }
                companyInput.classList.add('duplicate-warning');
                positionInput.classList.add('duplicate-warning');
            } else {
                duplicateNotice.classList.remove('show');
                companyInput.classList.remove('duplicate-warning');
                positionInput.classList.remove('duplicate-warning');
            }
        }

        // Notification system
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.position = 'fixed';
            notification.style.bottom = '20px';
            notification.style.right = '20px';
            notification.style.padding = '10px 20px';
            notification.style.borderRadius = '5px';
            notification.style.zIndex = '1000';
            notification.style.opacity = '0';
            notification.style.transition = 'opacity 0.3s ease';

            if (type === 'success') {
                notification.style.backgroundColor = '#131340';
                notification.style.color = '#9fff80';
                notification.style.border = '1px solid #9fff80';
                notification.style.boxShadow = '0 0 10px rgba(159, 255, 128, 0.7)';
            } else if (type === 'error') {
                notification.style.backgroundColor = '#131340';
                notification.style.color = '#ff3366';
                notification.style.border = '1px solid #ff3366';
                notification.style.boxShadow = '0 0 10px rgba(255, 51, 102, 0.7)';
            } else {
                notification.style.backgroundColor = '#131340';
                notification.style.color = '#40f0ff';
                notification.style.border = '1px solid #40f0ff';
                notification.style.boxShadow = '0 0 10px rgba(64, 240, 255, 0.7)';
            }

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '1';
            }, 10);

            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }

            if (editingId === id) {
                editingId = null;
            } else {

            }
            renderApplicationsList();
        }

        function saveEdit(id) {
            const index = applications.findIndex(app => app.id === id);
            if (index !== -1) {
                const date = document.getElementById(`edit-date-${id}`).value;
                const company = document.getElementById(`edit-company-${id}`).value;
                const position = document.getElementById(`edit-position-${id}`).value;
                const status = document.getElementById(`edit-status-${id}`).value;

                if (date && company && position) {
                    const checksum = generate_checksum_64(company + '|' + position);

                    applications[index] = {
                        ...applications[index],
                        date,
                        company,
                        position,
                        status,
                        checksum_h: checksum.high,
                        checksum_l: checksum.low
                    };
                    editingId = null;
                    renderApplicationsList();
                    updateApplicationCount();
                    updateExport();
                    showNotification('Bewerbung aktualisiert!', 'success');
                }
            }
        }

        function moveApplication(id, direction) {
            const index = applications.findIndex(app => app.id === id);
            if (index === -1) return;

            if (direction === 'up' && index > 0) {
                [applications[index - 1], applications[index]] = [applications[index], applications[index - 1]];
            } else if (direction === 'down' && index < applications.length - 1) {
                [applications[index], applications[index + 1]] = [applications[index + 1], applications[index]];
            }

            renderApplicationsList();
            updateExport();
        }

            const url = URL.createObjectURL(blob);
            downloadLink.href = url;
            downloadLink.download = `bewerbungen_${new Date().toISOString().slice(0,10)}.csv`;

            downloadLink.onclick = function() {
                setTimeout(function() {
                    URL.revokeObjectURL(url);
                }, 100);
            };
        }

        function handlePrint() {
            const wasExportVisible = isExportVisible;
            const originalContent = document.body.innerHTML;

            const printContent = `
                <div style="padding: 20px;">
                    <style>
                        @media print {
                            body {
                                font-family: Arial, sans-serif;
                                color: black;
                                background: white;
                            }
                            table {
                                width: 100%;
                                border-collapse: collapse;
                                margin-top: 20px;
                            }
                            th, td {
                                border: 1px solid black;
                                padding: 8px;
                                text-align: left;
                            }
                            th {
                                background-color: #f0f0f0;
                            }
                            pre {
                                background-color: white;
                                padding: 10px;
                                border: 1px solid #ccc;
                            }
                        }
                    </style>
                    ${document.getElementById('printSection').innerHTML}
                </div>
            `;

            document.body.innerHTML = printContent;
            window.print();
            document.body.innerHTML = originalContent;

            initializeEventListeners();

            isExportVisible = wasExportVisible;
            const newExportContent = document.getElementById('exportContent');
            const newToggleExportBtn = document.getElementById('toggleExportBtn');
            newExportContent.style.display = isExportVisible ? 'block' : 'none';
            newToggleExportBtn.textContent = isExportVisible ? 'Export verbergen' : 'Export anzeigen';

            renderApplicationsList();
            renderArchiveList();
            updateApplicationCount();
            updateArchiveCount();

            if (isExportVisible) {
                updateExport();
            }
        }

        function initializeEventListeners() {
            // Storage controls
            document.getElementById('loadStorageBtn').addEventListener('click', loadFromLocalStorage);
            document.getElementById('saveStorageBtn').addEventListener('click', saveToLocalStorage);
            document.getElementById('clearStorageBtn').addEventListener('click', clearLocalStorage);

            // CSV Import/Export
            document.getElementById('csvFileInput').addEventListener('change', handleCSVImport);
            document.getElementById('exportCSVFileBtn').addEventListener('click', exportCSVFile);

            // Archive Import/Export
            document.getElementById('archiveFileInput').addEventListener('change', handleArchiveImport);
            document.getElementById('exportArchiveBtn').addEventListener('click', exportArchive);
            document.getElementById('toggleArchiveViewBtn').addEventListener('click', toggleArchiveView);

            document.getElementById('addApplicationBtn').addEventListener('click', () => {
                const date = document.getElementById('dateInput').value;
                const company = document.getElementById('companyInput').value;
                const position = document.getElementById('positionInput').value;
                const status = document.getElementById('statusSelect').value;

                if (date && company && position) {
                    const checksum = generate_checksum_64(company + '|' + position);

                    const application = {
                        id: Date.now(),
                        date,
                        company,
                        position,
                        status,
                        checksum_h: checksum.high,
                        checksum_l: checksum.low
                    };
                    applications.push(application);
                    renderApplicationsList();
                    resetForm();
                    updateApplicationCount();
                    updateExport();
                }
            });

            document.getElementById('companyInput').addEventListener('input', updateDuplicateWarning);
            document.getElementById('positionInput').addEventListener('input', updateDuplicateWarning);

            document.getElementById('addTestDataBtn').addEventListener('click', () => {
                const testApplications = [
                    { id: Date.now() + 1, date: '2024-02-01', company: 'Tech Innovations Inc.', position: 'Senior Software Engineer', status: 'pending' },
                    { id: Date.now() + 2, date: '2024-02-05', company: 'Global Solutions LLC', position: 'Product Manager', status: 'interview_scheduled' },
                    { id: Date.now() + 3, date: '2024-02-10', company: 'Creative Designs Co.', position: 'UX Designer', status: 'offer_received' }
                ].map(app => {
                    const checksum = generate_checksum_64(app.company + '|' + app.position);
                    return { ...app, checksum_h: checksum.high, checksum_l: checksum.low };
                });

                applications.push(...testApplications);
                renderApplicationsList();
                updateApplicationCount();
                updateExport();
            });

            const toggleExportBtn = document.getElementById('toggleExportBtn');
            const exportContent = document.getElementById('exportContent');

            toggleExportBtn.addEventListener('click', () => {
                isExportVisible = !isExportVisible;
                exportContent.style.display = isExportVisible ? 'block' : 'none';
                toggleExportBtn.textContent = isExportVisible ? 'Export verbergen' : 'Export anzeigen';
                if (isExportVisible) {
                    updateExport();
                }
            });

            document.getElementById('exportTableBtn').addEventListener('click', () => {
                currentFormat = 'table';
                updateExport();
            });

            document.getElementById('exportCSVBtn').addEventListener('click', () => {
                currentFormat = 'csv';
                updateExport();
            });

            document.getElementById('printBtn').addEventListener('click', handlePrint);
        }

        function checkForExistingData() {
            try {
                const storedData = localStorage.getItem(STORAGE_KEY);
                const storedArchive = localStorage.getItem(ARCHIVE_KEY);

                let dataCount = 0;
                let archiveCount = 0;

                if (storedData) {
                    dataCount = JSON.parse(storedData).length;
                }
                if (storedArchive) {
                    archiveCount = JSON.parse(storedArchive).length;
                }

                const totalCount = dataCount + archiveCount;

                if (totalCount > 0) {
                    showNotification(`${totalCount} Einträge gefunden (${dataCount} aktiv, ${archiveCount} archiviert). Klicken Sie auf "Daten Laden".`, 'info');
                }
            } catch (error) {
                console.error('Error checking for existing data:', error);
            }
        }

        initializeEventListeners();
        window.addEventListener('load', checkForExistingData);
    </script>
</body>
</html>
