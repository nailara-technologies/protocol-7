# [:< ##
#
# httpd classify pattern family : env-credential-scan
# observed 2026-08-23 against this deployment [ laravel/docker/aws sweep ]

family: env-credential-scan
descr: dotenv / laravel / docker credential-file probes
severity: probe
patterns:
  - name: dotenv-root
    path_regex: '^/\.env(\.[a-z]+)?$'
  - name: laravel-storage-env
    path_regex: '^/storage/\.env$'
  - name: docker-env
    path_regex: '^/(config|app|api|prod)/\.env$'
  - name: nested-dotenv
    path_regex: '^/[a-z0-9_.-]+/\.env(\.[a-z]+)?$'
  - name: env-backup-variant
    path_regex: '^/\.(env|environment)\.(bak|backup|old|save|swp|dist)$'
