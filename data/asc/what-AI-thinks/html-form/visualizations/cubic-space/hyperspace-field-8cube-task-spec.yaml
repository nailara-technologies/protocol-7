  must_have:
    - "Opens without console errors"
    - "8 cubes visible in 2×2×2 formation"
    - "All missing corners point INWARD toward center"
    - "Central void visible and prominent"
    - "Smooth rotation and zoom"
    - "Colors shift smoothly as structure rotates"
    - "No erroneous edge lines connecting across voids"
    - "Clean edge geometry on outer cubes"
