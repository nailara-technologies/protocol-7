  visual_test:
    - "Rotate to view down X axis: should see 4 cubes with inward-facing voids"
    - "Rotate to view down Y axis: should see 4 cubes with inward-facing voids"
    - "Rotate to view down Z axis: should see 4 cubes with inward-facing voids"
    - "View at 45° angles: should see central void where all cutouts meet"
    - "Zoom in: central void becomes more prominent"
    - "Colors should visibly shift as rotation changes"
    - "Blue-violet → cyan → blue spectrum cycling"
    - "Fluorescent glow effect maintained throughout"
    - "Hue shifts smooth, not jarring"

critical_requirement:
  title: "INWARD-FACING CUTOUTS FOR CENTRAL VOID"
  explanation: |
    The entire point of this visualization is that the 8 missing corners
    combine to create a LARGER central void. This only works if all cutouts
    point INWARD toward the center.

    Think of it like 8 people standing in a circle, each taking a step
    backward - they create a larger empty space in the middle.

    If cutouts pointed outward, they would just be 8 separate voids with
    no connection - defeating the "hyperspace corridor" concept.

    The combined central void should be approximately:
      - Size: ~(cubeSize/4) × 2 = cubeSize/2 in each dimension
      - This creates a substantial "hole in space" at the origin

implementation_hints:
  - "Use Math.sign() to determine which direction is toward center for each cube position"
  - "For cube at position (x, y, z), the vertex closest to (0,0,0) has signs: (-sign(x), -sign(y), -sign(z))"
  - "In 4×4×4 grid, subcube (0,0,0) is at corner (-X,-Y,-Z), subcube (3,3,3) is at corner (+X,+Y,+Z)"
  - "Cutout neighbors: the 3 subcubes that share a face with the missing subcube"
  - "Calculate hue shift once per frame at start of draw() function"
  - "Apply hue rotation to all base colors before using them"
  - "Consider caching rotated colors in frame-level variables"

