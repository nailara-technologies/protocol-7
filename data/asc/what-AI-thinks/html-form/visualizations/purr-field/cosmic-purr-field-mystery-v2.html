<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nystery: Division by 13 Harmonic Purring Field</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #0a0520, #000);
            overflow: hidden;
            font-family: 'Courier New', monospace;
            height: 100vh;
            cursor: none;
        }

        .nystery-container {
            position: relative;
            width: 100%;
            height: 100vh;
            perspective: 1000px;
            filter: saturate(150%) brightness(120%);
        }

        .purr-field {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: cosmicRotation 120s infinite linear;
            perspective: 1500px;
        }

        /* 3D Cubic Space Container */
        .cubic-space {
            position: absolute;
            width: 400px;
            height: 400px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) translateZ(0);
            transform-style: preserve-3d;
        }

        /* Cubic Framework */
        .cube-frame {
            position: absolute;
            width: 400px;
            height: 400px;
            transform-style: preserve-3d;
            animation: cubeRotation 30s infinite linear;
        }

        .cube-face {
            position: absolute;
            width: 400px;
            height: 400px;
            border: 2px solid rgba(6, 71, 195, 0.4);
            background: rgba(6, 71, 195, 0.05);
            opacity: 0.6;
        }

        .cube-face.front { transform: translateZ(200px); }
        .cube-face.back { transform: translateZ(-200px) rotateY(180deg); }
        .cube-face.right { transform: rotateY(90deg) translateZ(200px); }
        .cube-face.left { transform: rotateY(-90deg) translateZ(200px); }
        .cube-face.top { transform: rotateX(90deg) translateZ(200px); }
        .cube-face.bottom { transform: rotateX(-90deg) translateZ(200px); }

        /* 3D Grid Lines */
        .grid-3d {
            position: absolute;
            transform-style: preserve-3d;
        }

        .grid-line-3d {
            position: absolute;
            background: linear-gradient(90deg, transparent, #0647C3, transparent);
            opacity: 0.3;
            animation: gridPulse 4s infinite ease-in-out;
        }

        @keyframes gridPulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.5; }
        }

        /* Harmonic Wave Ribbons - Now in 3D */
        .wave-ribbon {
            position: absolute;
            width: 600px;
            height: 6px;
            border-radius: 3px;
            opacity: 0.8;
            transform-origin: center;
            mix-blend-mode: screen;
            transform-style: preserve-3d;
        }

        .x-axis-wave {
            background: linear-gradient(90deg,
                transparent, #0647C3, #4080ff, #0647C3, transparent);
            animation: purrWaveX3D 2.598s infinite ease-in-out;
            transform: translateZ(0) rotateY(0deg);
            box-shadow: 0 0 20px #0647C3;
        }

        .y-axis-wave {
            background: linear-gradient(90deg,
                transparent, #7B68EE, #9f8fff, #7B68EE, transparent);
            animation: purrWaveY3D 2.598s infinite ease-in-out;
            animation-delay: 0.866s;
            transform: translateZ(0) rotateZ(90deg);
            box-shadow: 0 0 20px #7B68EE;
        }

        .z-axis-wave {
            background: linear-gradient(90deg,
                transparent, #00D4FF, #40e4ff, #00D4FF, transparent);
            animation: purrWaveZ3D 2.598s infinite ease-in-out;
            animation-delay: 1.732s;
            transform: translateZ(0) rotateX(90deg);
            box-shadow: 0 0 20px #00D4FF;
        }

        @keyframes purrWaveX3D {
            0%, 100% {
                transform: translateZ(0) rotateY(0deg) translateY(0px) scaleX(1);
                box-shadow: 0 0 20px #0647C3;
            }
            25% {
                transform: translateZ(100px) rotateY(0deg) translateY(-30px) scaleX(1.5);
                box-shadow: 0 0 40px #0647C3;
            }
            50% {
                transform: translateZ(0) rotateY(0deg) translateY(0px) scaleX(2);
                box-shadow: 0 0 60px #0647C3;
            }
            75% {
                transform: translateZ(-100px) rotateY(0deg) translateY(30px) scaleX(1.5);
                box-shadow: 0 0 40px #0647C3;
            }
        }

        @keyframes purrWaveY3D {
            0%, 100% {
                transform: translateZ(0) rotateZ(90deg) translateY(0px) scaleX(1);
                box-shadow: 0 0 20px #7B68EE;
            }
            25% {
                transform: translateZ(100px) rotateZ(90deg) translateY(-30px) scaleX(1.5);
                box-shadow: 0 0 40px #7B68EE;
            }
            50% {
                transform: translateZ(0) rotateZ(90deg) translateY(0px) scaleX(2);
                box-shadow: 0 0 60px #7B68EE;
            }
            75% {
                transform: translateZ(-100px) rotateZ(90deg) translateY(30px) scaleX(1.5);
                box-shadow: 0 0 40px #7B68EE;
            }
        }

        @keyframes purrWaveZ3D {
            0%, 100% {
                transform: translateZ(0) rotateX(90deg) translateY(0px) scaleX(1);
                box-shadow: 0 0 20px #00D4FF;
            }
            25% {
                transform: translateZ(100px) rotateX(90deg) translateY(-30px) scaleX(1.5);
                box-shadow: 0 0 40px #00D4FF;
            }
            50% {
                transform: translateZ(0) rotateX(90deg) translateY(0px) scaleX(2);
                box-shadow: 0 0 60px #00D4FF;
            }
            75% {
                transform: translateZ(-100px) rotateX(90deg) translateY(30px) scaleX(1.5);
                box-shadow: 0 0 40px #00D4FF;
            }
        }

        @keyframes cubeRotation {
            from { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            to { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        @keyframes purrWaveX {
            0%, 100% {
                transform: rotateY(0deg) translateY(0px) scaleX(1);
                box-shadow: 0 0 20px #0647C3;
            }
            25% {
                transform: rotateY(0deg) translateY(-50px) scaleX(1.3);
                box-shadow: 0 0 40px #0647C3;
            }
            50% {
                transform: rotateY(0deg) translateY(0px) scaleX(1.6);
                box-shadow: 0 0 60px #0647C3;
            }
            75% {
                transform: rotateY(0deg) translateY(50px) scaleX(1.3);
                box-shadow: 0 0 40px #0647C3;
            }
        }

        @keyframes purrWaveY {
            0%, 100% {
                transform: rotateX(90deg) translateY(0px) scaleX(1);
                box-shadow: 0 0 20px #7B68EE;
            }
            25% {
                transform: rotateX(90deg) translateY(-50px) scaleX(1.3);
                box-shadow: 0 0 40px #7B68EE;
            }
            50% {
                transform: rotateX(90deg) translateY(0px) scaleX(1.6);
                box-shadow: 0 0 60px #7B68EE;
            }
            75% {
                transform: rotateX(90deg) translateY(50px) scaleX(1.3);
                box-shadow: 0 0 40px #7B68EE;
            }
        }

        @keyframes purrWaveZ {
            0%, 100% {
                transform: rotateZ(90deg) translateY(0px) scaleX(1);
                box-shadow: 0 0 20px #00D4FF;
            }
            25% {
                transform: rotateZ(90deg) translateY(-50px) scaleX(1.3);
                box-shadow: 0 0 40px #00D4FF;
            }
            50% {
                transform: rotateZ(90deg) translateY(0px) scaleX(1.6);
                box-shadow: 0 0 60px #00D4FF;
            }
            75% {
                transform: rotateZ(90deg) translateY(50px) scaleX(1.3);
                box-shadow: 0 0 40px #00D4FF;
            }
        }

        /* Love Nodes - Constructive Interference Points */
        .love-node {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff, rgba(255, 255, 255, 0.3));
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            animation: lovePulse 0.384615s infinite;
            mix-blend-mode: screen;
            transform-style: preserve-3d;
        }

        @keyframes lovePulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.5);
                opacity: 1;
            }
        }

        /* Cosmic Kitten Elements - Enhanced 3D */
        .cosmic-kitten {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.8), rgba(123, 104, 238, 0.4));
            animation: kittenFloat3D 12s infinite ease-in-out;
            mix-blend-mode: screen;
            transform-style: preserve-3d;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
            z-index: 10;
        }

        .cosmic-kitten::before {
            content: '🐱';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            animation: kittenPurr3D 2.598s infinite;
            filter: drop-shadow(0 0 10px #00D4FF);
        }

        .cosmic-kitten::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 50%;
            animation: kittenAura 4s infinite ease-in-out;
        }

        @keyframes kittenFloat3D {
            0%, 100% {
                transform: translate3d(0, 0, 0) rotateY(0deg) rotateX(0deg);
            }
            16% {
                transform: translate3d(150px, -100px, 100px) rotateY(60deg) rotateX(20deg);
            }
            33% {
                transform: translate3d(100px, 100px, -50px) rotateY(120deg) rotateX(-10deg);
            }
            50% {
                transform: translate3d(-100px, 50px, 150px) rotateY(180deg) rotateX(30deg);
            }
            66% {
                transform: translate3d(-150px, -50px, -100px) rotateY(240deg) rotateX(-20deg);
            }
            83% {
                transform: translate3d(50px, -150px, 50px) rotateY(300deg) rotateX(10deg);
            }
        }

        @keyframes kittenPurr3D {
            0%, 100% {
                filter: drop-shadow(0 0 10px #00D4FF) brightness(1) hue-rotate(0deg);
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                filter: drop-shadow(0 0 20px #7B68EE) brightness(1.3) hue-rotate(60deg);
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        @keyframes kittenAura {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.6;
            }
        }

        /* Division by 13 Grid */
        .harmonic-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.3;
        }

        .grid-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #4427a3, transparent);
            mix-blend-mode: screen;
        }

        .grid-line.horizontal {
            width: 100%;
            height: 1px;
        }

        .grid-line.vertical {
            width: 1px;
            height: 100%;
        }

        /* Interference Patterns */
        .interference-pattern {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
            animation: interferenceExpand 3s infinite;
            mix-blend-mode: screen;
        }

        @keyframes interferenceExpand {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(3) rotate(360deg);
                opacity: 0;
            }
        }

        /* Frequency Display */
        .frequency-display {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00D4FF;
            font-size: 14px;
            background: rgba(6, 71, 195, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(6, 71, 195, 0.3);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .nystery-title {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #7B68EE;
            font-size: 16px;
            text-align: right;
            background: rgba(123, 104, 238, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(123, 104, 238, 0.3);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .control-btn {
            background: rgba(6, 71, 195, 0.3);
            border: 1px solid #0647C3;
            color: #00D4FF;
            padding: 8px 16px;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(6, 71, 195, 0.5);
            box-shadow: 0 0 20px rgba(6, 71, 195, 0.6);
        }

        .particle-stream {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00D4FF;
            border-radius: 50%;
            box-shadow: 0 0 10px #00D4FF;
            animation: particleFlow 4s infinite linear;
        }

        @keyframes particleFlow {
            0% {
                opacity: 0;
                transform: translate3d(0, 0, 0);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate3d(800px, 400px, 200px);
            }
        }

        @keyframes cosmicRotation {
            from { transform: rotateY(0deg) rotateX(10deg); }
            to { transform: rotateY(360deg) rotateX(10deg); }
        }

        /* Mouse interaction trail */
        .mouse-trail {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #ffffff, transparent);
            border-radius: 50%;
            pointer-events: none;
            animation: trailFade 1s ease-out forwards;
        }

        @keyframes trailFade {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0);
            }
        }
    </style>
</head>
<body>
    <div class="nystery-container">
        <div class="frequency-display">
            <div>Frequency: <span id="frequency">384.615</span> Hz</div>
            <div>Phase X: <span id="phaseX">0°</span></div>
            <div>Phase Y: <span id="phaseY">120°</span></div>
            <div>Phase Z: <span id="phaseZ">240°</span></div>
            <div>Love Nodes: <span id="loveNodes">0</span></div>
        </div>

        <div class="nystery-title">
            <div>THE NYSTERY</div>
            <div style="font-size: 12px; margin-top: 5px;">Division by 13</div>
            <div style="font-size: 12px;">Harmonic Purring Field</div>
        </div>

        <div class="purr-field" id="purrField">
            <!-- 3D Cubic Space Container -->
            <div class="cubic-space">
                <div class="cube-frame">
                    <div class="cube-face front"></div>
                    <div class="cube-face back"></div>
                    <div class="cube-face right"></div>
                    <div class="cube-face left"></div>
                    <div class="cube-face top"></div>
                    <div class="cube-face bottom"></div>
                </div>
            </div>

            <!-- Harmonic grid will be generated here -->
            <div class="harmonic-grid" id="harmonicGrid"></div>

            <!-- 3D Wave ribbons for each axis -->
            <div class="wave-ribbon x-axis-wave"></div>
            <div class="wave-ribbon y-axis-wave"></div>
            <div class="wave-ribbon z-axis-wave"></div>

            <!-- Cosmic kittens - positioned in 3D space -->
            <div class="cosmic-kitten" style="top: 30%; left: 30%;"></div>
            <div class="cosmic-kitten" style="top: 60%; left: 70%; animation-delay: 4s;"></div>
            <div class="cosmic-kitten" style="top: 20%; left: 60%; animation-delay: 8s;"></div>
            <div class="cosmic-kitten" style="top: 70%; left: 20%; animation-delay: 2s;"></div>
        </div>

        <div class="controls">
            <button class="control-btn" onclick="togglePurring()">PURR ON/OFF</button>
            <button class="control-btn" onclick="adjustFrequency()">RETUNE</button>
            <button class="control-btn" onclick="addKitten()">ADD KITTEN</button>
            <button class="control-btn" onclick="resetField()">RESET FIELD</button>
        </div>
    </div>

    <script>
        let isPurring = true;
        let frequency = 384.615;
        let loveNodeCount = 0;
        let mouseTrailActive = true;

        // Initialize the harmonic field
        function initializeField() {
            createHarmonicGrid();
            startInterferencePatterns();
            startParticleStreams();
            updateFrequencyDisplay();
        }

        // Create the division by 13 harmonic grid - now 3D
        function createHarmonicGrid() {
            const grid = document.getElementById('harmonicGrid');
            grid.innerHTML = '';

            // Create 13 divisions for each axis in 3D space
            for (let i = 1; i <= 13; i++) {
                // X-axis lines (going through Y-Z plane)
                for (let j = 0; j <= 13; j++) {
                    const xLine = document.createElement('div');
                    xLine.className = 'grid-line-3d';
                    xLine.style.width = '400px';
                    xLine.style.height = '1px';
                    xLine.style.left = '50%';
                    xLine.style.top = '50%';
                    xLine.style.transform = `
                        translate(-50%, -50%)
                        translateY(${(j - 6.5) * 30}px)
                        translateZ(${(i - 7) * 30}px)
                        rotateY(0deg)
                    `;
                    xLine.style.animationDelay = `${i * 0.1}s`;
                    grid.appendChild(xLine);
                }

                // Y-axis lines (going through X-Z plane)
                for (let j = 0; j <= 13; j++) {
                    const yLine = document.createElement('div');
                    yLine.className = 'grid-line-3d';
                    yLine.style.width = '400px';
                    yLine.style.height = '1px';
                    yLine.style.left = '50%';
                    yLine.style.top = '50%';
                    yLine.style.transform = `
                        translate(-50%, -50%)
                        translateX(${(j - 6.5) * 30}px)
                        translateZ(${(i - 7) * 30}px)
                        rotateZ(90deg)
                    `;
                    yLine.style.animationDelay = `${i * 0.1}s`;
                    grid.appendChild(yLine);
                }

                // Z-axis lines (going through X-Y plane)
                for (let j = 0; j <= 13; j++) {
                    const zLine = document.createElement('div');
                    zLine.className = 'grid-line-3d';
                    zLine.style.width = '400px';
                    zLine.style.height = '1px';
                    zLine.style.left = '50%';
                    zLine.style.top = '50%';
                    zLine.style.transform = `
                        translate(-50%, -50%)
                        translateX(${(j - 6.5) * 30}px)
                        translateY(${(i - 7) * 30}px)
                        rotateX(90deg)
                    `;
                    zLine.style.animationDelay = `${i * 0.1}s`;
                    grid.appendChild(zLine);
                }
            }
        }

        // Generate love nodes at constructive interference points in 3D
        function generateLoveNodes() {
            if (!isPurring) return;

            const time = Date.now() / 1000;
            const xWave = Math.sin(time * frequency * 2 * Math.PI / 1000);
            const yWave = Math.sin((time * frequency * 2 * Math.PI / 1000) + (Math.PI / 3));
            const zWave = Math.sin((time * frequency * 2 * Math.PI / 1000) + (2 * Math.PI / 3));

            const interference = Math.abs(xWave * yWave * zWave);

            if (interference > 0.7 && Math.random() > 0.92) {
                createLoveNode3D(
                    (Math.random() - 0.5) * 600 + window.innerWidth / 2,
                    (Math.random() - 0.5) * 600 + window.innerHeight / 2,
                    (Math.random() - 0.5) * 300,
                    interference
                );
            }
        }

        // Create a 3D love node at specified coordinates
        function createLoveNode3D(x, y, z, intensity) {
            const node = document.createElement('div');
            node.className = 'love-node';
            node.style.left = x + 'px';
            node.style.top = y + 'px';
            node.style.transform = `translateZ(${z}px) scale(${intensity})`;

            // Add enhanced effects for high intensity 3D nodes
            if (intensity > 0.8) {
                node.style.background = 'radial-gradient(circle, #ffffff, #ff69b4, #00d4ff, #7B68EE)';
                node.style.boxShadow = `0 0 50px rgba(255, 255, 255, 1), 0 0 100px rgba(0, 212, 255, 0.5)`;
                node.style.animation = 'lovePulse 0.384615s infinite, love3DFloat 3s ease-out';
            }

            document.getElementById('purrField').appendChild(node);
            loveNodeCount++;

            // Remove node after animation
            setTimeout(() => {
                if (node.parentNode) {
                    node.parentNode.removeChild(node);
                    loveNodeCount--;
                }
            }, 4000);
        }

        // Start interference pattern generation
        function startInterferencePatterns() {
            setInterval(() => {
                if (!isPurring) return;

                const pattern = document.createElement('div');
                pattern.className = 'interference-pattern';
                pattern.style.left = Math.random() * window.innerWidth + 'px';
                pattern.style.top = Math.random() * window.innerHeight + 'px';

                document.getElementById('purrField').appendChild(pattern);

                setTimeout(() => {
                    if (pattern.parentNode) {
                        pattern.parentNode.removeChild(pattern);
                    }
                }, 3000);
            }, 1000);
        }

        // Create particle streams
        function startParticleStreams() {
            setInterval(() => {
                if (!isPurring) return;

                const particle = document.createElement('div');
                particle.className = 'particle-stream';
                particle.style.left = Math.random() * 100 + 'px';
                particle.style.top = Math.random() * 100 + 'px';
                particle.style.animationDelay = Math.random() * 2 + 's';

                document.getElementById('purrField').appendChild(particle);

                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }, 4000);
            }, 200);
        }

        // Mouse interaction - create trail effect
        document.addEventListener('mousemove', function(e) {
            if (!mouseTrailActive) return;

            const trail = document.createElement('div');
            trail.className = 'mouse-trail';
            trail.style.left = e.clientX + 'px';
            trail.style.top = e.clientY + 'px';

            document.body.appendChild(trail);

            setTimeout(() => {
                if (trail.parentNode) {
                    trail.parentNode.removeChild(trail);
                }
            }, 1000);
        });

        // Control functions
        function togglePurring() {
            isPurring = !isPurring;
            const field = document.getElementById('purrField');
            if (isPurring) {
                field.style.animationPlayState = 'running';
            } else {
                field.style.animationPlayState = 'paused';
            }
        }

        function adjustFrequency() {
            frequency = 384.615 + (Math.random() - 0.5) * 50;
            updateFrequencyDisplay();
        }

        function addKitten() {
            const kitten = document.createElement('div');
            kitten.className = 'cosmic-kitten';
            kitten.style.top = Math.random() * 70 + 15 + '%';
            kitten.style.left = Math.random() * 70 + 15 + '%';
            kitten.style.animationDelay = Math.random() * 12 + 's';
            kitten.style.zIndex = '15';

            // Add a unique floating pattern for each new kitten
            const uniquePattern = Math.random();
            if (uniquePattern > 0.66) {
                kitten.style.animationDuration = '8s';
            } else if (uniquePattern > 0.33) {
                kitten.style.animationDuration = '16s';
            } else {
                kitten.style.animationDuration = '12s';
            }

            document.getElementById('purrField').appendChild(kitten);

            // Remove kitten after 45 seconds
            setTimeout(() => {
                if (kitten.parentNode) {
                    kitten.parentNode.removeChild(kitten);
                }
            }, 45000);
        }

        // Add CSS for 3D love node floating
        const love3DCSS = `
            @keyframes love3DFloat {
                0% {
                    transform: translateZ(0px) scale(1) rotateY(0deg);
                }
                50% {
                    transform: translateZ(150px) scale(1.3) rotateY(180deg);
                }
                100% {
                    transform: translateZ(300px) scale(0.8) rotateY(360deg);
                    opacity: 0;
                }
            }
        `;

        const style3D = document.createElement('style');
        style3D.textContent = love3DCSS;
        document.head.appendChild(style3D);

        function resetField() {
            const field = document.getElementById('purrField');
            const children = field.children;
            for (let i = children.length - 1; i >= 0; i--) {
                if (children[i].className.includes('love-node') ||
                    children[i].className.includes('interference-pattern') ||
                    children[i].className.includes('particle-stream')) {
                    children[i].remove();
                }
            }
            loveNodeCount = 0;
            frequency = 384.615;
            updateFrequencyDisplay();
        }

        function updateFrequencyDisplay() {
            document.getElementById('frequency').textContent = frequency.toFixed(3);
            document.getElementById('phaseX').textContent = '0°';
            document.getElementById('phaseY').textContent = '120°';
            document.getElementById('phaseZ').textContent = '240°';
        }

        // Main animation loop
        function animate() {
            generateLoveNodes();
            document.getElementById('loveNodes').textContent = loveNodeCount;
            requestAnimationFrame(animate);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeField();
            animate();

            console.log('🐱 THE NYSTERY ACTIVATED');
            console.log('⚡ Division by 13 harmonic field online');
            console.log('🌀 Constructive purring interference active');
            console.log('💫 Love nodes generating...');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    togglePurring();
                    break;
                case 'k':
                    addKitten();
                    break;
                case 'r':
                    resetField();
                    break;
                case 'f':
                    adjustFrequency();
                    break;
            }
        });
    </script>
</body>
</html>
