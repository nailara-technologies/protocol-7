# Protocol-7 Editor Integration Planning
# Feature completeness analysis and missing components

project: protocol-7
version: 1.0
date: 2024-01-01

## Overview
This document outlines the missing module components required to enable seamless editor toggle functionality between nshell's network terminal mode and an integrated editor mode.

## Current State Analysis

### Existing Infrastructure
1. **nshell** - Native shell with:
   - History management (ring buffer)
   - AMOS7::TERM editor integration (character insertion, deletion, cursor movement)
   - Search mode (Ctrl+R)
   - History navigation (Page Up/Down, arrow keys)

2. **amos-term** - Terminal infrastructure with:
   - GTK3 window management
   - Buffer management (SHM-based)
   - Window operations (open, close, resize, fullscreen)
   - Key press handling
   - Cursor movement

3. **pager** - Pager with editor integration:
   - Virtual buffer support
   - Editor callback integration
   - Line-based rendering

4. **protocol-7-menu** - Menu infrastructure with:
   - Graphical menu support (Gtk3)
   - Action key system
   - Provider registration

### Key Gap: Editor Namespace Missing
There is no `modules/editor/` namespace yet. This is the primary blocker.

## Missing Components

### 1. Core Editor Zenka (modules/editor/)
Priority: HIGH

- editor.init_code
  - Initialize editor state machine
  - Set up editor buffers
  - Configure AMOS7::TERM editor
  - Handle editor lifecycle

- editor.mode.switch
  - Toggle between modes: NORMAL, INSERT, VISUAL
  - Handle mode transitions
  - Update display state

- editor.buffer.create
  - Create new editor buffer
  - Initialize buffer metadata
  - Set up SHM connection

- editor.buffer.load
  - Load file content into buffer
  - Handle large files with pagination
  - Support binary and text files

- editor.buffer.save
  - Save buffer to file
  - Handle overwrite prompts
  - Support incremental saves

- editor.buffer.close
  - Close buffer
  - Clean up resources
  - Release SHM

- editor.file.open
  - Open file dialog (via protocol-7-menu)
  - Parse file path
  - Validate file existence

- editor.file.save
  - Save file dialog
  - Handle path creation
  - Write file content

- editor.file.quit
  - Quit editor
  - Save unsaved changes prompt
  - Clean up buffers

- editor.search
  - Search functionality
  - Search in files
  - Search in buffers

- editor.replace
  - Find and replace
  - Global replace
  - Replace in files

