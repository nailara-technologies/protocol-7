<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Nailara v12 - Concentric Rings + Rotational Cutouts</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a12; color: #99aacc;
    font-family: 'Courier New', monospace;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px;
}
h1 { color: #6060ff; font-size: 11px; letter-spacing: 3px;
     text-transform: uppercase; margin-bottom: 8px; }
.main-area { position: relative; width: 640px; height: 640px;
             border: 1px solid #333366; background: #06060f; }
.main-area canvas { position: absolute; top:0; left:0; width:100%; height:100%; }
#refCanvas { z-index: 1; }
#drawCanvas { z-index: 2; }
.steps-row { margin-top: 6px; display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.step-panel { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.step-panel span { font-size: 7px; color: #445; letter-spacing: 1px; }
.step-panel canvas { width: 68px; height: 68px; border: 1px solid #1a1a33; background: #050510; cursor: pointer; }
.ctrl-section { margin-top: 6px; width: 100%; max-width: 740px; }
.ctrl-section h2 { font-size: 10px; color: #6060ff; letter-spacing: 2px;
                   text-transform: uppercase; margin: 5px 0 2px;
                   border-bottom: 1px solid #222244; padding-bottom: 2px; }
.ctrl-grid {
    display: grid; grid-template-columns: 220px 50px 200px;
    gap: 2px 6px; align-items: center; font-size: 10px;
}
.ctrl-grid label { text-align: right; color: #667788; }
.ctrl-grid input[type=range] { width: 100%; accent-color: #6060ff; }
.val { color: #aabbff; font-family: monospace; }
.toggle-row { display: flex; gap: 10px; font-size: 10px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
.toggle-row label { cursor: pointer; display: flex; align-items: center; gap: 3px; }
.toggle-row input[type=checkbox] { accent-color: #6060ff; }
.toggle-row select { background: #1a1a2e; color: #aabbff; border: 1px solid #333; font-size: 10px; }
.info { margin-top: 5px; font-size: 9px; color: #556; background: #0c0c1a;
        border: 1px solid #1a1a33; padding: 4px 8px; font-family: monospace;
        white-space: pre; max-width: 740px; width: 100%; }
</style>
</head>
<body>
<h1>Nailara v12 &mdash; Concentric rings + rotational cutouts (solid)</h1>
<div class="main-area">
    <canvas id="refCanvas" width="640" height="640"></canvas>
    <canvas id="drawCanvas" width="640" height="640"></canvas>
</div>
<div class="toggle-row">
    <label>Ref: <select id="refSelect" onchange="drawRef()">
        <option value="dark">trans-dark</option>
        <option value="light">light</option>
        <option value="none">none</option>
    </select></label>
    <label>Opacity <input type="range" id="refOp" min="0" max="100" value="50"
           style="width:60px;accent-color:#6060ff" oninput="drawRef()"></label>
    <label>Line: <select id="drawColor" onchange="rebuild()">
        <option value="#44ff44">Green</option>
        <option value="white">White</option>
        <option value="#ff4444">Red</option>
    </select></label>
    <label><input type="checkbox" id="showSteps" checked onchange="showHideSteps()"> Steps</label>
    <label>Stop: <select id="pipeStop" onchange="rebuild()">
        <option value="99">Full</option>
        <option value="1">1:outer ring</option>
        <option value="2">2:+outer cuts</option>
        <option value="3">3:+middle ring</option>
        <option value="4">4:+middle cuts</option>
        <option value="5">5:+inner ring</option>
        <option value="6">6:+inner cuts</option>
        <option value="7">7:+center hole</option>
        <option value="8">8:flower done</option>
        <option value="9">9:+rot45 copy</option>
        <option value="10">10:+scaled inner</option>
    </select></label>
</div>
<div class="steps-row" id="stepsRow"></div>

<div class="ctrl-section">
<h2>Outer ring + cutouts</h2>
<div class="ctrl-grid" id="ctrl_outer"></div>
<h2>Middle ring + cutouts</h2>
<div class="ctrl-grid" id="ctrl_middle"></div>
<h2>Inner ring + cutouts + center</h2>
<div class="ctrl-grid" id="ctrl_inner"></div>
<h2>Duplication</h2>
<div class="ctrl-grid" id="ctrl_dup"></div>
</div>
<div class="info" id="infoPanel"></div>

<script>
var SIZE = 640, HALF = 640 / 2;

var S = {
    outer: {
        r_out:      { val: 48, min: 30, max: 64, step: 1, label: 'Outer radius' },
        r_in:       { val: 44, min: 25, max: 60, step: 1, label: 'Inner radius' },
        cut_r:      { val: 25, min: 10, max: 45, step: 1, label: 'Cutout disc radius' },
        cut_off:    { val: 35, min: 15, max: 55, step: 1, label: 'Cutout offset from center' },
        cut_n:      { val: 4,  min: 2,  max: 8,  step: 1, label: 'Number of cutouts' },
        cut_angle:  { val: 0,  min: 0,  max: 90, step: 0.5, label: 'Starting angle (deg)' }
    },
    middle: {
        on:         { val: 1,  min: 0,  max: 1,  step: 1, label: 'Enabled' },
        r_out:      { val: 35, min: 15, max: 50, step: 1, label: 'Outer radius' },
        r_in:       { val: 29, min: 10, max: 45, step: 1, label: 'Inner radius' },
        cut_r:      { val: 18, min: 5,  max: 35, step: 1, label: 'Cutout disc radius' },
        cut_off:    { val: 30, min: 10, max: 50, step: 1, label: 'Cutout offset' },
        cut_angle:  { val: 45, min: 0,  max: 90, step: 0.5, label: 'Starting angle (deg)' }
    },
    inner: {
        on:         { val: 1,  min: 0,  max: 1,  step: 1, label: 'Enabled' },
        r_out:      { val: 22, min: 8,  max: 35, step: 1, label: 'Outer radius' },
        r_in:       { val: 17, min: 5,  max: 30, step: 1, label: 'Inner radius' },
        cut_r:      { val: 10, min: 3,  max: 25, step: 1, label: 'Cutout disc radius' },
        cut_off:    { val: 18, min: 5,  max: 35, step: 1, label: 'Cutout offset' },
        cut_angle:  { val: 0,  min: 0,  max: 90, step: 0.5, label: 'Starting angle (deg)' },
        center_r:   { val: 8,  min: 2,  max: 20, step: 1, label: 'Center hole radius' }
    },
    dup: {
        rot_union:  { val: 1,  min: 0,  max: 1,  step: 1, label: '+rot45 union' },
        rot_angle:  { val: 45, min: 0,  max: 90, step: 0.5, label: 'Rotation angle' },
        inner_on:   { val: 1,  min: 0,  max: 1,  step: 1, label: 'Inner element' },
        inner_scale:{ val: 0.425, min: 0.2, max: 0.6, step: 0.005, label: 'Inner scale' },
        inner_rot:  { val: -22.5, min: -45, max: 0, step: 0.5, label: 'Inner rotation' }
    }
};

function px(v) { return v * SIZE / 128; }
function createBuf() { var c = document.createElement('canvas'); c.width = SIZE; c.height = SIZE; return c; }
function cloneBuf(s) { var c = createBuf(); c.getContext('2d').drawImage(s, 0, 0); return c; }

function drawRef() {
    var c = document.getElementById('refCanvas').getContext('2d');
    c.clearRect(0, 0, SIZE, SIZE);
    var sel = document.getElementById('refSelect').value;
    var op = parseInt(document.getElementById('refOp').value) / 100;
    var img = sel === 'dark' ? document.getElementById('refDark') :
              sel === 'light' ? document.getElementById('refLight') : null;
    if (img && img.complete && img.naturalWidth > 0) {
        c.globalAlpha = op; c.imageSmoothingEnabled = false;
        c.drawImage(img, 0, 0, SIZE, SIZE); c.globalAlpha = 1.0;
    }
}

// Add a filled annulus (ring) to canvas
function addRing(ctx, rOut, rIn) {
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(HALF, HALF, rOut, 0, Math.PI * 2);
    ctx.arc(HALF, HALF, Math.max(0.5, rIn), 0, Math.PI * 2, true);
    ctx.fill();
}

// Cut N discs equally spaced around center
function cutDiscs(src, n, cutR, cutOff, startAngle) {
    var out = cloneBuf(src);
    var ctx = out.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'white';
    for (var i = 0; i < n; i++) {
        var a = (startAngle + i * (360 / n)) * Math.PI / 180;
        var cx = HALF + Math.cos(a) * cutOff;
        var cy = HALF + Math.sin(a) * cutOff;
        ctx.beginPath();
        ctx.arc(cx, cy, cutR, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    return out;
}

function cutCenter(src, r) {
    var out = cloneBuf(src);
    var ctx = out.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'white';
    ctx.beginPath(); ctx.arc(HALF, HALF, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    return out;
}

function rotateBuf(src, deg) {
    var out = createBuf(), ctx = out.getContext('2d');
    ctx.translate(HALF, HALF); ctx.rotate(deg * Math.PI / 180); ctx.translate(-HALF, -HALF);
    ctx.drawImage(src, 0, 0); return out;
}

function scaleBuf(src, f) {
    var out = createBuf(), ctx = out.getContext('2d');
    ctx.drawImage(src, HALF*(1-f), HALF*(1-f), SIZE*f, SIZE*f); return out;
}

function unionBuf(a, b) {
    var out = createBuf(), ctx = out.getContext('2d');
    ctx.drawImage(a, 0, 0); ctx.drawImage(b, 0, 0); return out;
}

var steps = [];
function rec(c, l) { steps.push({ canvas: cloneBuf(c), label: l }); return c; }

function rebuild() {
    steps = [];
    var stop = parseInt(document.getElementById('pipeStop').value);

    // === 1: Outer ring ===
    var shape = createBuf();
    var sctx = shape.getContext('2d');
    addRing(sctx, px(S.outer.r_out.val), px(S.outer.r_in.val));
    rec(shape, '1:outer ring');
    if (stop <= 1) return finish(shape);

    // === 2: Cut outer discs ===
    shape = cutDiscs(shape, S.outer.cut_n.val,
        px(S.outer.cut_r.val), px(S.outer.cut_off.val), S.outer.cut_angle.val);
    rec(shape, '2:+cuts');
    if (stop <= 2) return finish(shape);

    // === 3: Add middle ring ===
    if (S.middle.on.val) {
        var mctx = shape.getContext('2d');
        addRing(mctx, px(S.middle.r_out.val), px(S.middle.r_in.val));
        rec(shape, '3:+mid ring');
        if (stop <= 3) return finish(shape);

        // === 4: Cut middle discs ===
        shape = cutDiscs(shape, 4,
            px(S.middle.cut_r.val), px(S.middle.cut_off.val), S.middle.cut_angle.val);
        rec(shape, '4:+mid cuts');
        if (stop <= 4) return finish(shape);
    } else if (stop <= 4) return finish(shape);

    // === 5: Add inner ring ===
    if (S.inner.on.val) {
        var ictx = shape.getContext('2d');
        addRing(ictx, px(S.inner.r_out.val), px(S.inner.r_in.val));
        rec(shape, '5:+inner ring');
        if (stop <= 5) return finish(shape);

        // === 6: Cut inner discs ===
        shape = cutDiscs(shape, 4,
            px(S.inner.cut_r.val), px(S.inner.cut_off.val), S.inner.cut_angle.val);
        rec(shape, '6:+inner cuts');
        if (stop <= 6) return finish(shape);

        // === 7: Center hole ===
        shape = cutCenter(shape, px(S.inner.center_r.val));
        rec(shape, '7:center hole');
        if (stop <= 7) return finish(shape);
    } else if (stop <= 7) return finish(shape);

    // === 8: Flower done ===
    rec(shape, '8:flower');
    if (stop <= 8) return finish(shape);

    // === 9: +rot45 union ===
    if (S.dup.rot_union.val) {
        var rot = rotateBuf(shape, S.dup.rot_angle.val);
        shape = unionBuf(shape, rot);
        rec(shape, '9:+rot' + S.dup.rot_angle.val);
    }
    if (stop <= 9) return finish(shape);

    // === 10: Inner element ===
    if (S.dup.inner_on.val) {
        var innerEl = scaleBuf(rotateBuf(shape, S.dup.inner_rot.val), S.dup.inner_scale.val);
        shape = unionBuf(shape, innerEl);
        rec(shape, '10:+inner');
    }
    finish(shape);
}

function finish(canvas) {
    var c = document.getElementById('drawCanvas').getContext('2d');
    c.clearRect(0, 0, SIZE, SIZE);
    var color = document.getElementById('drawColor').value;
    if (color !== 'white') {
        var tmp = createBuf(), tc = tmp.getContext('2d');
        tc.drawImage(canvas, 0, 0);
        tc.globalCompositeOperation = 'source-atop';
        tc.fillStyle = color; tc.fillRect(0, 0, SIZE, SIZE);
        tc.globalCompositeOperation = 'source-over';
        c.drawImage(tmp, 0, 0);
    } else { c.drawImage(canvas, 0, 0); }
    showHideSteps(); updateInfo();
}

function showHideSteps() {
    var row = document.getElementById('stepsRow');
    if (!document.getElementById('showSteps').checked) { row.style.display = 'none'; return; }
    row.style.display = 'flex'; row.innerHTML = '';
    for (var i = 0; i < steps.length; i++) {
        (function(idx) {
            var w = document.createElement('div'); w.className = 'step-panel';
            var l = document.createElement('span'); l.textContent = steps[idx].label;
            var cv = document.createElement('canvas'); cv.width = 68; cv.height = 68;
            cv.style.cssText = 'width:68px;height:68px;border:1px solid #1a1a33;background:#050510;cursor:pointer';
            cv.getContext('2d').drawImage(steps[idx].canvas, 0, 0, 68, 68);
            cv.onclick = function() {
                var dc = document.getElementById('drawCanvas').getContext('2d');
                dc.clearRect(0, 0, SIZE, SIZE);
                var color = document.getElementById('drawColor').value;
                if (color !== 'white') {
                    var tmp = createBuf(), tc = tmp.getContext('2d');
                    tc.drawImage(steps[idx].canvas, 0, 0);
                    tc.globalCompositeOperation = 'source-atop';
                    tc.fillStyle = color; tc.fillRect(0, 0, SIZE, SIZE);
                    tc.globalCompositeOperation = 'source-over';
                    dc.drawImage(tmp, 0, 0);
                } else { dc.drawImage(steps[idx].canvas, 0, 0); }
            };
            w.appendChild(l); w.appendChild(cv); row.appendChild(w);
        })(i);
    }
}

function updateInfo() {
    document.getElementById('infoPanel').textContent = [
        'Concentric rings (additive) + disc cutouts (subtractive) at each level',
        'Outer: ring(' + S.outer.r_out.val + '->' + S.outer.r_in.val + ') - ' + S.outer.cut_n.val + '*disc(r=' + S.outer.cut_r.val + ',off=' + S.outer.cut_off.val + ',@' + S.outer.cut_angle.val + 'deg)',
        'Middle: ring(' + S.middle.r_out.val + '->' + S.middle.r_in.val + ') - 4*disc(r=' + S.middle.cut_r.val + ',off=' + S.middle.cut_off.val + ',@' + S.middle.cut_angle.val + 'deg)',
        'Inner: ring(' + S.inner.r_out.val + '->' + S.inner.r_in.val + ') - 4*disc(r=' + S.inner.cut_r.val + ',off=' + S.inner.cut_off.val + ',@' + S.inner.cut_angle.val + 'deg) - center(r=' + S.inner.center_r.val + ')',
        '',
        'The shape IS the logo. No outline extraction. Visible lines = narrow rings.',
        'Ring width = r_out - r_in. Leaf width = where cutout disc doesnt reach.'
    ].join('\n');
}

function makeSlider(cid, gk) {
    var ct = document.getElementById(cid), g = S[gk], ks = Object.keys(g);
    for (var i = 0; i < ks.length; i++) {
        (function(k) {
            var p = g[k];
            var lb = document.createElement('label'); lb.textContent = p.label;
            var vs = document.createElement('span'); vs.className = 'val'; vs.id = 'v_'+gk+'_'+k; vs.textContent = p.val;
            var inp = document.createElement('input'); inp.type = 'range';
            inp.min = p.min; inp.max = p.max; inp.step = p.step; inp.value = p.val;
            inp.oninput = function() { S[gk][k].val = parseFloat(this.value); vs.textContent = this.value; rebuild(); };
            ct.appendChild(lb); ct.appendChild(vs); ct.appendChild(inp);
        })(ks[i]);
    }
}

makeSlider('ctrl_outer', 'outer');
makeSlider('ctrl_middle', 'middle');
makeSlider('ctrl_inner', 'inner');
makeSlider('ctrl_dup', 'dup');

function init() { drawRef(); rebuild(); }
var imgs = document.querySelectorAll('img');
var ld = 0;
for (var i = 0; i < imgs.length; i++) {
    if (imgs[i].complete) ld++;
    else imgs[i].onload = function() { ld++; if (ld >= imgs.length) init(); };
}
if (ld >= imgs.length) init();

</script>
