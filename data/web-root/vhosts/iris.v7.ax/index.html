<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iris — BMW384 field visualization</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: rgba(255,255,255,0.6);
      font-family: monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 860px;
      padding: 1.2rem 1rem 0.4rem;
      display: flex;
      align-items: baseline;
      gap: 1.2rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: normal;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.15em;
    }

    h1 span { color: rgba(255,255,255,0.5); }

    .controls {
      width: 100%;
      max-width: 860px;
      padding: 0.6rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .mode-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.4);
      font-family: monospace;
      font-size: 0.78rem;
      padding: 0.25rem 0.65rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn:hover {
      border-color: rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.7);
    }

    .mode-btn.active {
      border-color: rgba(255,255,255,0.5);
      color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.05);
    }

    .param-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 0.4rem;
    }

    .label-mode-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 0.4rem;
    }

    .param-label {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.25);
    }

    .param-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      font-family: monospace;
      font-size: 0.78rem;
      padding: 0.22rem 0.5rem;
      border-radius: 2px;
      width: 12rem;
      outline: none;
    }

    .param-input:focus {
      border-color: rgba(255,255,255,0.3);
    }

    .rings-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .route-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 0.4rem;
    }

    .rings-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      font-family: monospace;
      font-size: 0.78rem;
      padding: 0.22rem 0.4rem;
      border-radius: 2px;
      width: 4rem;
      outline: none;
      text-align: center;
    }

    .render-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      font-family: monospace;
      font-size: 0.78rem;
      padding: 0.25rem 0.8rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .render-btn:hover {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.95);
    }

    .iris-frame {
      width: 100%;
      max-width: 820px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      position: relative;
    }

    .iris-frame svg {
      width: 100%;
      height: 100%;
    }

    .status {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.2);
      padding: 0.3rem 1rem 1rem;
      align-self: flex-start;
      max-width: 860px;
      width: 100%;
    }

    .loading { color: rgba(255,255,255,0.15); }
    .error   { color: rgba(200,60,60,0.6); }
  </style>
</head>
<body>

<header>
  <h1>[ <span>iris</span> ] — BMW384 field</h1>
</header>

<div class="controls">
  <button class="mode-btn active" data-mode="ring">ring</button>
  <button class="mode-btn" data-mode="gauss">gauss</button>
  <button class="mode-btn" data-mode="heatmap">heatmap</button>
  <button class="mode-btn" data-mode="arc-width">arc-width</button>
  <button class="mode-btn" data-mode="overlay">overlay</button>
  <button class="mode-btn" data-mode="metric">metric</button>
  <button class="mode-btn" data-mode="density">density</button>

  <div class="label-mode-row">
    <span class="param-label">labels</span>
    <button class="mode-btn active" data-label-mode="linear">linear</button>
    <button class="mode-btn" data-label-mode="namespace63">namespace63</button>
  </div>

  <div class="param-row" id="param-row" style="display:none">
    <span class="param-label" id="param-label">arcs</span>
    <input class="param-input" id="param-input" type="text" value="">
  </div>

  <div class="param-row">
    <span class="param-label">translucency</span>
    <button class="mode-btn active" data-tl="0" class="mode-btn">off</button>
    <button class="mode-btn" data-tl="1" class="mode-btn active">bi</button>
    <button class="mode-btn" data-tl="2">ccw</button>
    <button class="mode-btn" data-tl="3">cw</button>
  </div>

  <div class="param-row">
    <span class="param-label">intensity</span>
    <input class="rings-input" id="tl-intensity" type="number"
           min="0" max="1" step="0.1" value="0.5" style="width:4.5rem">
    <span class="param-label" style="margin-left:0.5rem">expanse</span>
    <input class="rings-input" id="tl-expanse" type="number"
           min="1" max="5" step="1" value="3" style="width:3rem">
  </div>

  <div class="param-row">
    <span class="param-label">namespace</span>
    <input class="param-input" id="ns-input" type="text"
           placeholder="base, kimi, jobsite..." style="width:8rem">
  </div>

  <div class="rings-row">
    <span class="param-label">rings</span>
    <input class="rings-input" id="rings-input" type="number"
           min="1" max="63" value="26">
  </div>

  <button class="render-btn" id="render-btn">render</button>

  <div class="route-controls">
    <button class="mode-btn" id="add-vortex-btn">+ vortex</button>
    <button class="mode-btn" id="add-arc-btn">+ arc</button>
    <span class="param-label">from arc</span>
    <input class="rings-input" id="route-from" value="13" min="0" max="25">
    <span class="param-label">to</span>
    <input class="rings-input" id="route-to" value="0" min="0" max="25">
  </div>
</div>

<div class="iris-frame" id="iris-frame">
  <span class="status loading">loading...</span>
</div>

<div class="status" id="status-line"></div>

<script>
  const modeParams = {
    gauss:   { label: 'arcs to glow', placeholder: 'D,H — all nodes still visible', default: 'A' },
    overlay: { label: 'namespaces', placeholder: 'base,kimi,jobsite', default: 'base,kimi,jobsite,route' },
  };

  let currentMode      = 'ring';
  let currentRings     = 26;
  let currentLabelMode = 'linear';
  let currentTlMode    = '0';
  let currentIntensity = '0.5';
  let currentExpanse   = '3';

  const frame      = document.getElementById('iris-frame');
  const statusLine = document.getElementById('status-line');
  const paramRow   = document.getElementById('param-row');
  const paramLabel = document.getElementById('param-label');
  const paramInput = document.getElementById('param-input');
  const ringsInput = document.getElementById('rings-input');
  const nsInput      = document.getElementById('ns-input');
  const tlButtons    = document.querySelectorAll('.mode-btn[data-tl]');
  const tlIntensity  = document.getElementById('tl-intensity');
  const tlExpanse    = document.getElementById('tl-expanse');

  function setStatus(msg, cls) {
    statusLine.textContent = msg;
    statusLine.className = 'status ' + (cls || '');
  }

  function updateParamRow(mode) {
    const cfg = modeParams[mode];
    if (cfg) {
      paramLabel.textContent = cfg.label;
      paramInput.placeholder = cfg.placeholder;
      if (!paramInput.value) paramInput.value = cfg.default;
      paramRow.style.display = 'flex';
    } else {
      paramRow.style.display = 'none';
    }
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if ( btn.dataset.mode ) {
        document.querySelectorAll('.mode-btn[data-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        if ( currentMode === 'heatmap' && parseInt(ringsInput.value) > 13 ) {
          ringsInput.value = '13';
        }
        updateParamRow(currentMode);
        render();
      } else if ( btn.dataset.labelMode ) {
        document.querySelectorAll('.mode-btn[data-label-mode]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLabelMode = btn.dataset.labelMode;
        render();
      } else if ( btn.dataset.tl !== undefined ) {
        tlButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTlMode = btn.dataset.tl;
        render();
      }
    });
  });

  document.getElementById('render-btn').addEventListener('click', render);
  ringsInput.addEventListener('change', render);
  paramInput.addEventListener('keydown', e => { if (e.key === 'Enter') render(); });
  tlIntensity.addEventListener('change', render);
  tlExpanse.addEventListener('change', render);

  document.getElementById('add-vortex-btn').addEventListener('click', () => addRoute('vortex_spiral'));
  document.getElementById('add-arc-btn').addEventListener('click', () => addRoute('orbital_arc'));

  function addRoute(curveType) {
    const fromArc = parseInt(document.getElementById('route-from').value) || 13;
    const toArc   = parseInt(document.getElementById('route-to').value)   || 0;
    setStatus('registering route...', 'loading');
    fetch('/iris/route', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from_arc: fromArc, to_arc: toArc, curve_type: curveType, duration: 5 })
    })
    .then(r => {
      if (!r.ok) return r.text().then(t => Promise.reject(t));
      return r.json();
    })
    .then(data => {
      setStatus(`route ${data.curve_id} registered (${data.hop_count} hops)`);
      render();
    })
    .catch(err => {
      setStatus('route error: ' + err, 'error');
    });
  }

  function render() {
    const rings = parseInt(ringsInput.value) || 26;
    const param = paramInput.value.trim();
    const ns    = nsInput.value.trim();
    let url = `/iris/svg?mode=${currentMode}&rings=${rings}&label_mode=${currentLabelMode}`;
    if (param && modeParams[currentMode]) url += `&param=${encodeURIComponent(param)}`;
    if (ns) url += `&ns=${encodeURIComponent(ns)}`;
    url += `&tl=${currentTlMode}`;
    url += `&intensity=${tlIntensity.value}&expanse=${tlExpanse.value}`;

    setStatus('rendering...', 'loading');
    const t0 = performance.now();

    fetch(url)
      .then(r => {
        if (!r.ok) return r.text().then(t => Promise.reject(t));
        return r.text();
      })
      .then(svg => {
        frame.innerHTML = svg;
        const ms = Math.round(performance.now() - t0);
        setStatus(`mode: ${currentMode}  rings: ${rings}  ${ms}ms`);
      })
      .catch(err => {
        frame.innerHTML = '';
        setStatus('error: ' + err, 'error');
      });
  }

  render();
</script>
</body>
</html>
