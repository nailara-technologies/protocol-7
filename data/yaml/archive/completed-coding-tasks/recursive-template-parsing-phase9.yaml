notes: |
  This implementation provides a robust, scalable template processing system
  that leverages the upgraded base.parser.pattern_split routine for recursive
  parsing. The offloading to web zenka improves httpd performance and enables
  horizontal scaling by running multiple web zenka instances.

  The recursive parsing allows for powerful template composition where
  commands can generate other commands, which are then processed in turn.
  This enables dynamic content generation with proper depth limiting to
  prevent infinite loops.

  The IPC-based architecture maintains clean separation of concerns between
  httpd (HTTP protocol handling) and web zenka (content processing), following
  the Protocol-7 zenka design pattern.

