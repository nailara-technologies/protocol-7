task_id: context-provider-frame
title: context.provider.frame — wire ascii.frame.* into context.template.resolve
priority: high
estimated_rounds: 12

signatures_note: |
  Module files end with a 4-line AMOS7 signature footer starting with #,,,
  IGNORE these lines completely — they are auto-generated by the signing system
  and must not be modified or investigated. Focus only on the code above them.
  New files must NOT include any signature stub or `#,,..,.,,,...` line —
  leave them clean. The signing system runs after merge and creates the footer
  itself; adding a stub blocks the signing pipeline.

style_guidance: |
  Protocol-7 module style:
    - lowercase comments throughout — ## read config from file ## not ## Read
    - use [ word ] in comments for annotations, never ( word )
    - use $ARG / @ARG (English) not $_ / @_ inside subs ; use shift to peel args
    - explicit args: my $x = @_ ? shift : $ARG;  for handlers that may also be
      invoked as event callbacks
    - never use SUPER:: — these are not OO subs
    - no signature stub — leave the file ending at the last code line
    - module body has NO `sub { }` wrapper — the file IS the sub
    - call other modules via <[namespace.name]>->( $arg ) — implicit ->() only
      when no args; with args, ->( ... ) is required
    - access data slots via <namespace.key.path>  →  $data{'namespace'}{...}
    - keep functions short ; helper subs defined at bottom of file
    - do not introduce error-handling for impossible cases
    - do not add backward-compat shims

goal: |
  Implement one new module: src/context.provider.frame
  This is a context template SECTION PROVIDER. It is called by
  context.template.resolve when a template section has:
    provider: context.provider.frame
  The provider receives a params hashref, returns a rendered ascii-frame
  STRING (with optional ANSI color) which the template engine then incorporates
  into the assembled context output.

  This is the bridge between two existing subsystems:
    [ ascii.frame.* ]  → frame load + parse + render machinery
    [ context.template.resolve ] → template assembly with budgets and sections

calling_convention: |
  context.template.resolve invokes the provider like this:
    $code{'context.provider.frame'}->( \%prov_params );

  where %prov_params is the section's params:
    {
      frame  => 'user-profile',           ## named frame
      mockup => "...inline mockup...",    ## OR an inline mockup string
      vars   => { ROLE => '...', ... },   ## slot values; pre-substituted
      mode   => 'expanded',               ## or 'progress'; default 'expanded'
      budget => 2000,                     ## chars budget (already injected
                                          ## by template.resolve)
      color  => 0,                        ## boolean: apply ANSI color pass
    }

  Return value: scalar string (the rendered + optionally colored frame).
  Failure return: a single-line error comment string of the form
    "<!-- frame 'name' not available: reason -->"
  so the template output stays valid.

design_spec:
  frame_resolution: |
    if params->{'frame'} is set:
      $entry = <[ascii.frame.load]>->( $params->{'frame'} );
    elif params->{'mockup'} is set:
      ## cache inline mockups by length+checksum so repeat calls reuse ##
      my $mockup = $params->{'mockup'};
      my $cache_key = sprintf 'mockup:%d:%s',
                      length($mockup),
                      <[base.chk-sum.elf]>->($mockup);
      if ( exists <context.frame.cache>->{$cache_key} ) {
          $entry = <context.frame.cache>->{$cache_key};
      } else {
          my $result = <[ascii.frame.from_mockup]>->(
              { mockup => $mockup, strict => 0 }
          );
          if ( $result->{'ok'} ) {
              $entry = {
                  name        => 'inline',
                  descriptor  => $result->{'descriptor'},
                  border_style => 'single',
              };
              <context.frame.cache>->{$cache_key} = $entry;
          } else {
              return "<!-- frame 'inline' not available: parse failed -->";
          }
      }
    else:
      return "<!-- frame ??? not available: no frame or mockup param -->";

    if not defined $entry:
      return "<!-- frame '$frame_name' not available: load failed -->";

    note : <context.frame.cache> is a SEPARATE cache from <ascii.frame.cache>.
    ascii.frame.load already caches its own results — this layer caches the
    inline mockup wrappers built by from_mockup so they don't re-parse.

  mode_selection: |
    my $mode = $params->{'mode'} // 'expanded';
    my $descriptor;
    if ( exists $entry->{'descriptor'} ) {
        ## single-mode frame : ignore $mode ##
        $descriptor = $entry->{'descriptor'};
    } elsif ( exists $entry->{'descriptors'} ) {
        ## dual-mode frame : pick by name ##
        $descriptor = $entry->{'descriptors'}{$mode}
                   // $entry->{'descriptors'}{'expanded'}
                   // ( values %{ $entry->{'descriptors'} } )[0];
    }
    if ( not defined $descriptor ) {
        return "<!-- frame '$name' not available: no descriptor for "
             . "mode '$mode' -->";
    }

  slot_values: |
    my $values = $params->{'vars'} // {};
    ## vars hash : flat slot_name => value_string ##
    ## context.template.resolve has ALREADY substituted {{template.var}}
    ## references in the params (via context.util.template.substitute_vars)
    ## before calling the provider — do NOT re-substitute here.
    ## missing slot values : leave as '' [ never undef ] in the values hash.
    ## the renderer treats // '' itself, so we can pass the hash through.

  rendering: |
    my $rendered = <[ascii.frame.render]>->(
        { descriptor => $descriptor,
          values     => $values,
        }
    );
    return "<!-- frame '$name' not available: render failed -->"
        if not defined $rendered or not length $rendered;

  border_style_double: |
    if $entry->{'border_style'} eq 'double':
      apply a post-render string pass : replace a single ':' at line-start
      and ':' at line-end of CONTENT rows with '::'.
      borders [ first and last lines ] are NOT modified.

      my @rl = split "\n", $rendered, -1;
      ## first and last lines are borders : leave them alone ##
      ## NOTE : if descriptor has no bottom border, only first line is border ##
      my $top_idx = 0;
      my $bot_idx = $#rl;
      ## detect whether last line is a structural border [ density >= 0.5 ] ##
      my $last_line = $rl[$bot_idx] // '';
      my $sc = 0;
      $sc++ while $last_line =~ m{[:.,#=\[\]]}g;
      my $density = length($last_line)
                  ? $sc / length($last_line) : 0;
      my $last_is_border = $density >= 0.5;
      my $end_content = $last_is_border ? $bot_idx - 1 : $bot_idx;

      for my $i ( $top_idx + 1 .. $end_content ) {
          $rl[$i] =~ s{^:}{::};
          $rl[$i] =~ s{:$}{::};
      }
      $rendered = join "\n", @rl;

  budget_truncation_with_sentinel: |
    my $budget = $params->{'budget'};
    if ( defined $budget and $budget > 0 ) {
        ## chars-per-token approximation ; render is already chars ##
        my $char_budget = $budget * <context.cfg.chars_per_token>;
        if ( length($rendered) > $char_budget ) {
            ## truncate to last complete line within budget ##
            my $trunc = substr( $rendered, 0, $char_budget );
            $trunc =~ s|[^\n]*$||s;
            $trunc =~ s|\n$||;
            ## append a reconstructed bottom border so the frame stays closed ##
            my $sentinel = _frame_bottom_sentinel(
                $descriptor, $values, $entry->{'border_style'} // 'single'
            );
            $rendered = $trunc . "\n" . $sentinel;
        }
    }

    helper sub _frame_bottom_sentinel :
      compute frame_width the same way ascii.frame.render does — by
      replicating the width computation [ min_width + padding + slot widths +
      static row widths + border widths ] — then call _render_border_line
      logic to render the bottom elements at that width.

      since ascii.frame.render's helpers are file-scoped, we replicate the
      width computation inline here using the same descriptor fields.
      for the border render, REPLICATE the _render_border_line algorithm
      [ ~30 lines ] in our helper rather than coupling cross-file.

      if border_style is 'double', apply the same s|^:|::| / s|:$|::| pass
      to the sentinel line.

      if descriptor has no bottom border elements, emit a minimal close —
      a single line of border-left + repeat border char + border-right with
      a small structural fragment, e.g.  border->{'left'} + ':' x width
      + border->{'right'}. simpler : if no bottom border, sentinel is just
      the marker:  '.:[ truncated ]:.'

  color_pass: |
    if ( $params->{'color'} ) {
        my $colored = <[ascii.frame.render.color]>->($rendered);
        $rendered = $colored if defined $colored;
    }

  return: |
    return $rendered;

  error_returns: |
    every error path returns a single-line string of the form
      "<!-- frame '<name>' not available: <reason> -->"
    so context.template.resolve treats it as content [ defined + length ]
    rather than skipping the section.

module_file: |
  Save as: src/context.provider.frame
  Begin with the standard header:

    ## [:< ##

    # name  = context.provider.frame
    # descr = ascii frame section provider for context.template.resolve

  Body follows the spec above. End with no signature stub.

usage_example: |
  In a context template yaml:

    ## src/.../my-context.yaml ##
    name: example
    sections:
      - label: user profile
        priority: 10
        budget_pct: 20
        provider: context.provider.frame
        params:
          frame:  user-profile
          mode:   expanded
          vars:
            ROLE:  '{{user.role}}'
            FOCUS: '{{user.focus}}'
            LEVEL: '{{user.level}}'

  context.template.resolve substitutes {{user.role}} etc. in params from
  the caller's vars hash via context.util.template.substitute_vars, then
  invokes context.provider.frame with the substituted params plus a budget.

testing_notes: |
  no test harness expected — the change will be exercised manually after
  merge by invoking context.template.resolve with a small test template.
  ensure the module is syntactically valid Perl when read through the
  Protocol-7 module loader [ the parser converts <[name]> and <name>
  syntax to $code{...} and $data{...} prior to compilation ].

acceptance_criteria:
  - module file src/context.provider.frame exists and parses cleanly
  - named frame loading via ascii.frame.load works
  - inline mockup path works and caches by length+elf checksum
  - mode selection picks correct descriptor for dual-mode frames
  - mode selection ignores $mode for single-mode frames
  - budget truncation appends a sentinel bottom border line
  - border_style double pass converts content row :...: to ::...::
  - color pass invokes ascii.frame.render.color when params->{'color'} is true
  - all error paths return a string of form <!-- frame '...' not available: ... -->
  - no signature stub footer is added

