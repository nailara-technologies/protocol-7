# Key Insights

technical_learnings:
  - UTF-8 flag is implicit and unreliable across module boundaries
  - Global 'use bytes;' pragma is effective for consistent byte semantics
  - Protocol modes must be explicit (SIZE vs CHRSIZE) not inferred
  - Session-level negotiation pattern mirrors authentication
  - Signal isolation needed when spawning blocking child processes

architectural_principles:
  - Explicit over implicit (protocol modes named clearly)
  - Separation of concerns (byte operations internally, format negotiation externally)
  - Client-server negotiation pattern for protocol capabilities
  - Endpoint translation matching session preference
  - Rate limiting on configuration commands

avoided_anti_patterns:
  - Auto-detection of encoding from string content
  - Attempting UTF-8 flag consistency across boundaries
  - Implicit mode selection based on data
  - Blocking operations without signal isolation

