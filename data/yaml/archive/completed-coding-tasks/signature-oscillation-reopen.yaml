priority: medium

title: |
  Signature oscillation Variant B — double-footer on newly-signed non-empty files

description: |
  The signature oscillation bug was archived as resolved, but is demonstrably
  still present. Surfaced 2026-03-15 when the file.all_files recursion fix
  brought previously-unreachable files into signing scope for the first time.

  These files had never been signed, so their first signing pass is the
  reproducible trigger.

symptom: |
  "checksum correct but signature not valid" — the signer writes a footer,
  then verification of that same footer fails. On closer inspection, the
  signer is APPENDING a second footer rather than replacing the existing one.

  git diff shows it clearly for bin/dev/tests/math/test-13.sh:
  - File already had a valid 4-line footer ending with #:::::
  - Signer added a blank line after #::::: then appended a complete second footer
  - Now the file has two footers; verification fails because the body checksum
    covers content up to the FIRST footer, not the second

root_cause: |
  The harmonizer adds a trailing newline after the #::::: separator line.
  This breaks footer detection on the next pass — the extractor uses #:::::
  as the EOF marker, so a trailing newline after it causes the extractor to
  not recognize the existing footer, treating the file as unsigned.
  Result: signer appends a new footer rather than updating the existing one.

  This is the same endline harmonization issue from the archived tasks, just
  in a slightly different form: not state=0, but trailing-newline-after-separator.

secondary_issue: |
  bin/dev/lib/ is a symlink to data/lib-path/pm/. With bin/dev/** recursive
  scanning, files under that path were being found TWICE (once via the symlink,
  once via data/lib-path/pm/**). The !dev/lib exclusion now prevents this.
  data/lib-path/pm/Curses/UI/*.pm and data/lib-path/pm/Devel/REPL/Error.pm
  were modified by the signer as a result of the double-signing attempt.

reproducible_state: |
