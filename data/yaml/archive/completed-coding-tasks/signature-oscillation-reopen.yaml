two_variants: |
  There are two distinct manifestations of the oscillation:

  VARIANT A — silent (no error message):
    Reproducer: touch an empty file and sign it.
      touch src/another.test
      bin/Protocol-7 sourcecode update-signatures src/another.test
    Observation: update-signatures wants to sign it a second time before
    it is considered stable. No error emitted — just requires two passes.
    Confirmed 2026-03-16 with empty file.

  VARIANT B — with error ("checksum correct but signature not valid"):
    Reproducer: sign a file that has never been signed before (non-empty).
    Triggered by the file.all_files recursion fix bringing previously-
    unreachable files into scope. Error message is emitted on the first pass;
    second pass may or may not stabilize.
    Preserved fixtures: data/asc/test-fixtures/signature-oscillation-2026-03-15/

  Both variants share the same root cause (trailing newline after #:::::
  breaks footer detection on the next pass) but present differently.
  Variant A is the cleanest test environment — isolates footer mechanics
  with no body content. Use it for initial debugging.

  Clean up after testing: rm src/another.test

workaround: |
  Sign affected files multiple times until the footer stabilizes.
  The !dev/lib exclusion in sourcecode.source_path_set_up prevents the
  symlink double-signing issue going forward.

