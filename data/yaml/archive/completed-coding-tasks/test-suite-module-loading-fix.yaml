root_cause:
  issue: "Tests call modules but they're not registered in models zenka loader"
  example: "Test tries to call models.template.substitute via network, gets 'no such zenka found'"
  reason: "New modules written but not added to models zenka startup configuration"

what_works:
  - "Conversation system code is valid (conversation registry working)"
  - "Template substitution code is valid (tested via metrics)"
  - "Vision-parser integration code is valid (async architecture recognized)"
  - "Test infrastructure is correct (just routing to wrong place)"

what_needs_fixing:
  step_1_add_modules_to_loader: |
    File: /data/projects/protocol-7/cfg/zenki/models/zenka.v7
    Line: modules.load = auth net protocol io.unix models models.config.loader devmod

    Action: Add new modules to this list
    Need to add: models.template models.conversation

    Result line should be:
    modules.load = auth net protocol io.unix models models.template models.conversation models.config.loader devmod

  step_2_reload_models_zenka: |
    Command: p7 models reload
    or: p7 v7.restart models

    This will load the new modules into the running system

  step_3_rerun_tests: |
    Command: perl /data/projects/protocol-7/bin/test-scripts/run-all-tests.pl

    Expected result: All tests pass once modules are loaded

