---
title: amos-term — interaction plugin type for streaming model/user exchange
priority: low
status: completed  ## commit 3dd6d53bd ##
type: new-feature

design_doc: data/md/design/CODING-ZENKA-USER-INTERACTION-SURFACES.md

context: |
  amos-term is already a plugin-typed, hot-reloadable extension system
  [ amos-term.plugin-init_code ]: types decoder / routing / render / input, each with a
  hook and a src/amos-term.plugin-<type>/ dir, registry watched by inotify for
  hot-reload. it already has the primitive needed for a live back-and-forth:
  buffer-attach_generic( buffer_id, kind, { cursor_x, cursor_y, cursor_z, write, read,
  data => { on_buffer_change => ... } } ) — the same mechanism amos-term.nshell.bridge uses
  to wire an interactive shell session into a 3D buffer today.

  this is the track for open-ended, multi-turn exchanges [ "let's talk through this
  design" ] where a modal popup [ see protocol-7-menu-dialog-plugin-system.yaml ] would be
  the wrong shape.

scope:
  new_plugin_type:
    name: interaction
    hook: agent.query
    dir: src/amos-term.plugin-interaction
    registration: |
      add to <amos-term.plugin-types> alongside decoder/routing/render/input, following
      the exact structure already used for those four.

  buffer_lifecycle_decision: |
    RESOLVED [ 2026-08-04 ]: dedicated, lazily-created, named, reusable buffer —
    NOT attach-into-an-arbitrary-existing-window.

    rationale:
      1. visibility — the zenka cannot know which existing window the user is
         currently watching; attaching into an arbitrary buffer fails the core
         purpose [ the question must be seen ]. nshell.bridge attaches into a
         buffer created for nshell's own session — the honest analog is a buffer
         the interaction channel owns.
      2. contention — a shared buffer interleaves question text with that
         buffer's own output stream.
      3. timeout-fade — the idle/unanswered depth-alpha fade applies cleanly to
         a dedicated buffer; fading someone else's working buffer is wrong.
      4. addressing — buffer-attach_generic already resolves name:<name>, so
         ask_user_stream needs only a well-known buffer name, not a window
         handle. sub-question resolved: buffer_id [ by name ], no window handle.

    shape:
      - one well-known named buffer per channel: name:agent-interaction
        [ per-task name:agent-interaction-<task_id> possible later ]. lazily
        created on first ask_user_stream, reused thereafter.
        [ name must match <regex.base.usr> -- no dots: window-create passes
          client_name as session user name to base.session.init ]
      - multi-turn scrollback via Z-layer history shift [ Z+1, newest at Z=0 ],
        same pattern as nshell.
      - window lifecycle is internal to the plugin: on first question, if a GTK
        session is available, window-create + window-open on the buffer;
        headless -> degrade straight to record_question [ track 3 ]. reopening a
        closed window re-attaches to the same named buffer, history survives.

  coding_zenka_side: |
    ask_user_stream(question) -> open/reuse buffer, buffer-write the question,
    buffer-attach_generic( read=>TRUE, write=>TRUE, on_buffer_change => own handler ),
    continue working — reply arrives via callback, not a blocking call.

  timeout_degrade: |
    an open interaction buffer unanswered for N minutes [ configurable,
    amos-term.cfg.interaction_timeout, no default chosen yet ] auto-degrades to a
    record_question entry, model proceeds on a flagged assumption. streaming interaction
    must never become a silent deadlock — this is the track's main risk versus track 1's
    modal dialogs, which fail visibly (dialog just sits open) rather than silently.

visual_style: |
  reuse the existing amos-term background rgba(0,0,0.024,alpha) and cursor #4427AC, with
  the existing depth-alpha falloff [ 1.0 -> 0.3 over Z=13, via
  graphics-3d.calc.cursor-translucency ] applied to an idle/unanswered interaction buffer
  the same way it already applies to unfocused Z-layers — no new color introduced.

verification:
  - a coding-zenka ask_user_stream call opens a buffer, question text appears in it
  - a user reply in the buffer triggers on_buffer_change and is delivered back to the
    calling task without blocking its other work
  - an unanswered buffer past the configured timeout produces a record_question entry
    and the task proceeds
  - plugin hot-reloads via the existing inotify watcher without restarting the zenka

notes: |
  largest and least-specified of the three branches [ fallback-chain tools, protocol-7-menu
  dialogs, this one ] — buffer_lifecycle_decision resolved 2026-08-04 [ see scope above ].

  PREMISE CORRECTION [ found during resolution, 2026-08-04 ]: the infrastructure this
  task's context describes as existing is only partially implemented —
    - <amos-term.plugin-watcher> is declared //= undef but no inotify watch is ever
      installed on plugin dirs [ hot-reload does not exist yet ]
    - the type hooks [ buffer.decode / event.route / render.frame / input.key ] are
      registered as metadata but never dispatched anywhere
    - on_buffer_change is registered by nshell.bridge but nothing in the codebase
      invokes it [ amos-term.buffer-write does not notify attachments ]
  scope must therefore additionally include:
    a. notify-on-write dispatch in amos-term.buffer-write [ or SHM watch ] invoking
       client_data.on_buffer_change handlers
    b. installing the inotify hot-reload watcher on plugin dirs [ verification item 4
       depends on this ]
    c. the timeout timer -> record_observation [ type=question ] degrade path

prototype_results: |
  PROTOTYPED live 2026-08-04 against the nshell.bridge pattern [ in the running
  amos-term zenka, headless ]:
    src/amos-term.interaction.ask               [ core, mirrors nshell.bridge ]
    src/amos-term.handler.interaction-changed   [ reply accumulation + delivery ]
    src/amos-term.handler.interaction-deliver   [ default delivery endpoint ]
    src/amos-term.cmd.interaction-ask           [ test entry: ask ]
    src/amos-term.cmd.interaction-reply         [ test entry: simulated user reply ]
    src/amos-term.cmd.interaction-status        [ channel state inspection ]
    amos-term.buffer-write                          [ scope item (a) DONE:
      on_buffer_change notify dispatch, re-entrancy-guarded, optional client_type
      param so a writer can filter its own writes ]
  verified live [ verification items 1+2 PASS ]:
    [1] interaction-ask -> lazily creates name:agent-interaction buffer, question
        text visible in the SHM segment [ cross-process read of /dev/shm file,
        Z-history shift works ]
    [2] interaction-reply -> on_buffer_change accumulates reply chars, newline
        finalizes, reply_handler invoked with [ question, reply ] — no blocking
        of other work; Q/A pair stored in channel state
  bugs found + fixed during prototyping:
    - amos-term.buffer-create: whole-scalar assign of the mmap'd SHM scalar
      [ ${$mmap_ptr} = "\0" x N ] DETACHES the Sys::Mmap mapping -> segment
      silently process-private, backing file never updated. fixed with in-place
      substr assignment.
    - amos-term.buffer-create: voxel data was addressed from mapping offset 0,
      on top of the 512-byte P7SH header [ SHM_HEADER_SIZE ]. fixed by storing a
      data-region alias [ \substr( $$mmap_ptr, header_size ) ] as shm_ptr [ raw
      mapping kept as shm_map_ptr ] — all consumers [ buffer-write, shift_z,
      erase, render ] transparently offset.
    - window client_name must match <regex.base.usr> [ alnum + - _ , NO dots ]:
      base.session.init rejects it otherwise -> channel buffer is named
      'agent-interaction', not 'agent.interaction'.
    - loader: `reload source` does not pick up edits to already-loaded cmd
      modules [ known issue: data/tasks/loader-reload-stale-cmd-modules.md ] —
      use v7.restart <zenka> during development.
  remaining scope [ NOT done ]:
    - timeout degrade timer -> record_question [ verification 3 ]
    - inotify hot-reload watcher on plugin dirs [ verification 4 ]
    - 5th plugin-type registration + src/amos-term.plugin-interaction/
      scaffolding [ unblocked: lifecycle resolved, mechanism proven ]
    - GTK window-open path [ prototype ran headless; window-open untested ]
    - new modules are UNSIGNED: run bin/Protocol-7 sourcecode update-signatures

