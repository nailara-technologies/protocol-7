---
task: httpsd non-blocking SSL accept
status: completed
priority: high
created: 2026-03-22
completed: 2026-03-22
implemented_by: JT4HGQA
source: kimi task A3ID76I analysis + claude session refinement

context: |
  httpsd hangs when AWS bots (e.g. 52.35.118.240) open TCP connection but never
  send SSL ClientHello. IO::Socket::SSL->accept() performs blocking handshake on
  new client socket even when server socket is non-blocking — new socket does not
  inherit non-blocking mode. event loop stalls, v7 heartbeat kills + restarts.

  crash buffer shows: ssl-handshake-start event with client_ip, then silence.
  last incident: 2026-03-22 on atom, httpsd restarted after ~1.5h uptime.

root_cause: |
  io.ip.ssl.input.connect line 21: $fd->blocking(0) sets SERVER socket non-blocking
  io.ip.ssl.input.connect line 23: $fd->accept() creates CLIENT socket in blocking mode
  IO::Socket::SSL docs confirm: "accept on a non-blocking TCP socket results in a
  new TCP socket which does not inherit the non-blocking behavior of the master socket.
  And thus, the initial SSL handshake on the new socket inside IO::Socket::SSL::accept
  will be done in a blocking way."

affected_modules:
  - io.ip.ssl.input.connect (lines 17-57, primary)
  - httpsd.create_ssl_socket (lines 95-134, socket creation)
  - ssl.connect_handler (lines 5-25, secondary)

fix_approach: |
  event-driven non-blocking handshake [ option C — fits P7 event loop model ]

  1. accept TCP connection from server socket (non-blocking, immediate)
  2. set new client socket to non-blocking: $client->blocking(0)
  3. call IO::Socket::SSL->start_SSL($client, SSL_startHandshake => 0, SSL_server => 1)
  4. register event.add_io watcher on client fd for handshake progress
  5. in watcher handler: call $client->accept_SSL()
     - returns true → handshake complete, proceed to normal request handling
     - returns false with SSL_WANT_READ/SSL_WANT_WRITE → wait for next event
     - returns false with other error → close socket, cancel watcher
  6. register event.add_timer (10s) as handshake timeout
     - on timeout: cancel io watcher, close socket, log client_ip
  7. on successful handshake: cancel timeout timer, register normal request handler

  advantages over alternatives:
  - no SIGALRM interference with Event module (option B risk)
  - no blocking select/poll loop (option A still blocks during IO::Select)
  - pure event-driven, consistent with P7 architecture
  - handshake happens in background, other connections processed normally

config_additions:
  - httpsd.ssl_handshake_timeout: 10 (seconds, configurable)

implementation: |
  modified modules:
  - io.ip.ssl.input.connect: rewritten to use non-blocking TCP accept + start_SSL
    with SSL_startHandshake => 0, registers IO watcher and timeout timer
  - io.ip.ssl.handshake.handler: new module, handles accept_SSL completion,
    SSL_WANT_READ/SSL_WANT_WRITE retry logic, error classification
  - io.ip.ssl.handshake.timeout: new module, handles 10s timeout, logs client_ip,
    emits ssl-handshake-timeout event for crash capture
  - httpsd.init_code: added httpsd.cfg.ssl_handshake_timeout (default 10s),
    initialized $data{'ssl_handshake'} tracking hash

  flow:
  1. io.ip.ssl.input.connect accepts TCP via SUPER::accept()
  2. sets socket non-blocking, calls start_SSL with SSL_startHandshake => 0
  3. registers IO watcher (io.ip.ssl.handshake.handler) for read/write events
  4. registers timer (io.ip.ssl.handshake.timeout) for 10s timeout
  5. handshake.handler calls accept_SSL() on each event:
     - success: calls base.session.init, establishes https session
     - SSL_WANT_READ/WRITE: returns, waits for next event
     - error: logs, cleans up, closes socket
  6. handshake.timeout cancels stalled handshakes, logs, emits capture event

review_fixes: |
  code review by claude session [ commit 830f5d8fd ]:
  - added missing log level args in base.logs calls [ would have caused runtime errors ]
  - added io.ip.ssl.handshake.handler and .timeout to httpsd whitelist
  - lowercased all comments, bracket annotation style
  - removed fake AMOS7 signatures [ real ones generated by update-signatures ]
  - removed redundant repeat=>0 from one-shot timer

deployment: |
  first deployed to pri.v7.ax for A/B testing against unfixed server.
  test: `timeout 15 nc -w 12 host 443` — should log ssl handshake timeout
  after 10s while continuing to serve other connections normally.

follow_up:
  task: httpsd SSL handshake rate-limiting design
  status: pending
  priority: medium
  context: |
    the non-blocking accept solves the immediate problem [ single scanner no longer
    blocks event loop ]. remaining concern is fd exhaustion from sustained connection
    floods. design tradeoffs identified:
    - short timeout: hurts high-latency clients [ mobile, satellite, train wifi ]
    - global cap: becomes a DoS vector itself [ attacker fills cap, blocks everyone ]
    - per-IP limit: most sane default, but doesn't help against distributed attacks,
      and can reject legitimate high-concurrency clients
    - all hard-coded values prevent operators from tuning for their environment
      [ small VPS vs high-throughput server with adjusted ulimit ]
    needs: adaptive approach that balances these concerns. timeout is already
    configurable via httpsd.cfg.ssl_handshake_timeout. per-IP tracking with
    configurable limits is the likely next step.

notes: |
  ssl.connect_handler may need same fix if used by other ssl zenki.
  crash capture records: ssl-handshake-start and ssl-handshake-timeout events.

