### TIER 1: NEXT (from roadmap 2025-11-26)

**Phase 2: File Handle Encoding Mode Validation** ⭐ RECOMMENDED NEXT
  source: "next-session-roadmap.yaml (Phase 2)"
  status: pending
  priority: MEDIUM
  effort: 30-45 minutes
  impact: MEDIUM (catches invalid encodings early, prevents silent failures)

  objective:
    Implement validation for encoding mode parameters in base.fh-encoding.set to catch
    invalid encoding names early and provide clear error messages.

  current_gap:
    base.fh-encoding.set accepts any string as encoding_mode and stores it without validation.
    When base.fh-encoding.apply tries to use invalid encoding with binmode(), it silently fails.

  implementation_steps:
    1. Research valid encoding names (UTF-8, OCTETS, latin1, cp1252, ascii, utf16, etc.)
    2. Create encoding validation subroutine
    3. Validate against Perl's encoding registry
    4. Modify .set module to validate before storing
    5. Enhance .apply module with better diagnostics
    6. Test with various encodings (valid, invalid, edge cases)

  key_locations:
    - src/base.fh-encoding.set (where encoding_mode is stored)
    - src/base.fh-encoding.apply (where binmode() is called)
    - Perl documentation for binmode() and PerlIO::encoding

