## Performance Impact

### Current (Restart Loop)
- CPU: ~1% per restart (frequent)
- Disk: 5-10 MB/hour of log spam
- Memory: Stable but wasted restarts
- UX: Failed HTTPS for duration

### With Graceful Startup
- CPU: ~0% while waiting (no unnecessary restarts)
- Disk: Single "waiting for certificate" message
- Memory: Stable, no wasted restarts
- UX: Clean startup once cert available

