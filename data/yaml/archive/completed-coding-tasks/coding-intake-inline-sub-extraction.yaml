---
task_id: coding-intake-inline-sub-extraction
date_created: 2026-03-16
status: completed  ## commit 6b866f9fb ##
priority: medium

title: |
  Extract inline subroutines from coding.task.intake into stub modules

description: |
  src/coding.task.intake contains four inline anonymous subs assigned to
  lexical variables, which violates the one-module-one-function convention.
  Empty stub module files already exist for all four. The task is to populate
  them and replace coding.task.intake with a clean dispatcher.

  A December 2025 Kimi session created the stub files but never filled them,
  leaving 12 empty signed modules. The coding.queue.* set is a duplicate
  wrong-namespace attempt at the same goal and should simply be deleted,
  as coding.task.queue_* already has the real queue implementations.

source_module: src/coding.task.intake

inline_subs_to_extract:

  parse_command_string:
    target: src/coding.intake.parse_command_string
    lines: 8-36
    notes: |
      Parses "type: description | constraints" CLI-style strings.
      Fallback: treat whole string as description with type=analysis.
      Remove the lexical $parse_command_string = sub { ... } wrapper —
      the module file IS the subroutine body.

  validate_task:
    target: src/coding.intake.validate_task
    lines: 38-52
    notes: |
      Validates that task has request.description and type fields.
      Returns { valid => bool, errors => [] }.

  normalize_task:
    target: src/coding.intake.normalize_task
    lines: 54-69
    notes: |
      Lowercases type, sets priority from request.priority (default: normal),
      sets execution.status = pending. Normalizes invalid priority values to normal.

  intake_work:
    target: src/coding.intake.work
    lines: 71-151
    notes: |
      Main intake logic. Accepts hashref or string. Calls parse_command_string
      for strings. Calls coding.helper.task_id_generator for missing ids.
      Replace lexical $parse_command_string->() calls with
      <[coding.intake.parse_command_string]>->().

  intake_orchestrator:
    target: src/coding.intake.process
    lines: 153-180
    notes: |
      The bottom block (currently bare code with { }) calls intake_work,
      then validate_task, then normalize_task. This becomes coding.intake.process.
      Replace all lexical sub refs with <[coding.intake.*]>->() calls.

new_coding_task_intake: |
  After extraction, coding.task.intake becomes a one-line dispatcher:
    return <[coding.intake.process]>->(@ARG);
  Preserving the same external interface.

delete_these_empty_stubs: |
  The following 7 modules are empty and use the wrong namespace.
  coding.task.queue_* already provides the real implementations.
  coding.task.queue already dispatches to coding.task.queue_*.
  Simply delete:
    src/coding.queue.clear_completed
    src/coding.queue.complete_task
    src/coding.queue.dequeue_next
    src/coding.queue.enqueue_task
    src/coding.queue.fail_task
    src/coding.queue.get_queue_stats
    src/coding.queue.get_task_status

  Also remove src/another.test if still present (was a test file
  for signature oscillation reproduction).

verification: |
  After changes:
  - src/coding.task.intake contains only the dispatcher line
  - src/coding.intake.{parse_command_string,validate_task,normalize_task,work,process}
    each contain the extracted logic with no anonymous sub wrappers
  - src/coding.queue.* files are gone
  - grep -r '\$parse_command_string\|\$validate_task\|\$normalize_task\|\$intake_work'
    src/coding.* returns nothing
  - Sign all modified/new files; commit

related:
  - data/yaml/coding-tasks/src-subdir-pm-extraction.yaml
