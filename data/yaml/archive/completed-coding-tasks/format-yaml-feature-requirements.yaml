analysis_dimensions:
  operations:
    description: |
      for each module, identify which yaml operations are performed:
        load_file     — parse yaml from a file path → data structure
        write_file    — serialize data structure → yaml file
        load_str      — parse yaml from an in-memory string
        dump_str      — serialize data structure → yaml string [ in-memory ]
        load_multi    — load multiple documents from one file [ YAML multi-doc ]
        in_place_edit — load → modify → write back to same path

  error_handling:
    description: |
      how does each module handle yaml errors currently?
        eval + EVAL_ERROR check
        die / warn propagation
        return undef on failure
        error logged and skipped
        error logged and fatal
      note patterns that would benefit from the yaml-errors buffer approach.

  backend_assumptions:
    description: |
      does the module assume YAML::XS, pure YAML, or is it backend-agnostic?
      does it load the module itself inline or expect it to be pre-loaded?
      any strictness issues observed [ unquoted colons, aliases, multi-doc ]?

  data_shapes:
    description: |
      what does the parsed yaml typically look like?
        flat key-value config
        nested config structure
        list of records
        free-form document
        mixed
      are there any unusual structures that format.yaml must handle correctly?

  caching:
    description: |
      does the module cache loaded yaml data in %data?
      does it re-read the file on each call or load once?
      any mtime / invalidation logic?

  path_handling:
    description: |
      how are file paths constructed?
        absolute paths
        paths relative to system.root_path
        paths via base.path.to_keywords or similar helpers
        user-supplied paths [ need sanitization? ]

output_format:
  description: |
    write the report as a yaml file:
    data/yaml/coding-tasks/format-yaml-feature-requirements-report.yaml

    structure the report with sections:
      summary         — one paragraph: what format.yaml needs to be
      required_ops    — list of operations with usage count + representative examples
      error_handling  — recommended unified approach based on observed patterns
      edge_cases      — unusual patterns that need special handling
      migration_notes — per-zenka notes on what changes when migrating [ no code ]
      open_questions  — anything that needs user/architect input before implementing

    be specific. cite actual module names as examples.
    flag any module that has unusual requirements or does something unexpected.
    the report will be reviewed and annotated before any implementation begins.

acceptance: |
  - report file written to data/yaml/coding-tasks/format-yaml-feature-requirements-report.yaml
  - all 80 modules listed above analyzed [ at least cursorily ]
  - required_ops section covers all distinct operation types found
  - edge_cases section identifies at minimum 3 non-obvious patterns
  - report is self-contained and reviewable without re-reading the source modules
  - no implementation code written anywhere

completed_notes: |
  kimi produced comprehensive 80-module analysis. report reviewed and annotated
  inline by claude (2026-03-18). key annotations applied to report:
  1. load_str error return: format.yaml returns undef always [ not {} ] —
     {} is caller-side wrapping convention, not format.yaml responsibility
  2. recommended_unified_approach step 3 corrected to match actual impl
  3. added yaml_xs_strict_fallback edge case [ severity: high ] — YAML::XS
     rejects 29/38 task yaml files; per-call fallback to pure YAML required
  4. dump_str option named 'omit_marker' [ was vague 'strip marker option' ]
  5. yaml::tiny open question resolved: yes consolidate, 5 modules to migrate
  6. async loading open question resolved: non-requirement [ IO::AIO layer ]
  7. fixed yaml formatting bug in statistics.modules_no_yaml_usage section
  report is now ready to drive format.yaml.load_str and dump_str implementation.

