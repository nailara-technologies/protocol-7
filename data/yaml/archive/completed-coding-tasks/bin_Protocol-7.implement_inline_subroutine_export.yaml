      sub p7_export_subroutines_to_modules {
          my $module_directory = shift // './src';
          my @sub_names = @_;
          
          # Create directory if not exists
          unless (-d $module_directory) {
              mkdir $module_directory or die "Could not create directory $module_directory: $!";
          }
          
          foreach my $sub_name (@sub_names) {
              # Generate module filename (e.g., handler.end_code.pm)
              my $module_name = $sub_name;
              $module_name =~ s|^p7__||g;
              $module_name =~ s|__|\.|g;
              $module_name =~ s|\.|/|g;
              $module_name .= '.pm';
              
              my $module_path = "$module_directory/$module_name";
              
              # Ensure directory structure exists  
              my $dir = dirname($module_path);
              unless (-d $dir) {
                  mkdir $dir or die "Could not create directory $dir: $!";
