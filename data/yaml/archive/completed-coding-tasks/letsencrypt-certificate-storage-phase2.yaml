    - modules/letsencrypt.parent.notify_httpd_certificate_update
    - modules/letsencrypt.parent.check_certificate_expiration
    - modules/letsencrypt.parent.queue_renewal_requests
    - modules/letsencrypt.parent.update_registry_from_disk

  command_handlers_to_create:
    - modules/letsencrypt.cmd.request-certificate
    - modules/letsencrypt.cmd.renew-certificate
    - modules/letsencrypt.cmd.certificate-status
