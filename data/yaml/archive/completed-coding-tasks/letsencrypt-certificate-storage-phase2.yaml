  File operations:
  - File::Spec::Functions (catfile, abs_path)
  - File::Path (make_path)
  - JSON::XS (metadata parsing)

  All required modules already in configuration.

success_criteria:

  minimum_viable: |
    ✓ Can query httpd for vhost list
    ✓ Can save certificates with metadata
    ✓ Renewal check finds expiring certificates
    ✓ Certificate requests queued and sent to child
    ✓ Child responses processed and saved
    ✓ Retry logic works with exponential backoff
    ✓ Registry persists across restarts
    ✓ Statistics tracked and accessible

  full_integration: |
    ✓ All above, plus:
    ✓ HTTPd notified when certificates change
    ✓ Manual commands work (request, renew, revoke, status)
    ✓ Handles httpd unavailable gracefully
    ✓ Disk space management for backups
    ✓ Comprehensive error logging

next_phase: |
  Phase 3: HTTP-01 Challenge Implementation
  - Currently Phase 1 assumes challenges are handled elsewhere
  - Phase 3 will:
    1. Set up HTTP-01 endpoint in parent or separate service
    2. Send challenge tokens to httpd for serving
    3. Poll for challenge validation
    4. Handle challenges for multiple domains in parallel

  Phase 4: HTTPd Certificate Reload
  - Implement httpd.cmd.reload-certificate
  - Reload certificates without httpd restart
  - Handle zero-downtime updates

