## phase 1 — local hash FUSE mount (no network async needed)

status: ✓ COMPLETED

description: |
  for data living in the local in-process hash, FUSE callbacks return
  data directly — no async/blocking problem. this is the primary use case
  and works without complex IPC.

type_mapping:
  HASH   → fuse directory (getattr returns S_IFDIR, readdir returns keys)
  SCALAR → fuse file      (getattr returns S_IFREG + size, read returns value)
  ARRAY  → fuse directory (entries are array elements with auto-named keys)
  CODE   → fuse directory (executed on access, returns dynamic listing)

path_translation:
  fuse path  /user/taeki/files/uploads
  hash path  user.taeki.files.uploads
  rule: strip leading slash, replace / with .

implementation_notes: |
  - callbacks check <data.fuse.root_hash_path> to resolve paths relative
    to the mount root (set by spawn module in child process)
  - child process runs Fuse::main() blocking loop
  - parent registers mount and continues async operation
  - IO::AIO::reinit() called in child before FUSE startup
  - SIGCHLD handler set to dev.null in child to prevent interference
  - logging routed through parent via p7-log.append

---

## phase 2 — network-backed / remote data (optional, future)

status: deferred

description: |
  when the requested hash path is not local (remote cubic lookup, network
  fetch), the FUSE child cannot return immediately. use the child+IPC pattern
  from the design doc: child queues request to parent, parent fetches async,
  populates shared cache (data.mount.shm), signals child, child returns data.

  this phase is NOT required for phase 1 to be useful. defer unless needed.

async_strategy: Option C (Protocol-7 native deferred replies) preferred
  — child sends request with callback id via parent route
  — parent issues deferred data.get call
  — when reply arrives, parent sends to child session
  — child matches callback id, serves FUSE read

reference: |
  data/md/design/CONCEPT-DATA-ZENKA-ARCHITECTURE.md
  section "The FUSE Blocking Problem" and "Child Zenka Pattern" diagram

---

## testing

manual_test_sequence:
  - "p7c data.attach-fs-mount network.hosts /tmp/test-mount"
  - "ls /tmp/test-mount"       # should show hash keys as dirs/files
  - "cat /tmp/test-mount/..."  # read scalar value
  - "p7c data.list-fs-mounts"   # verify registry entry
  - "p7c data.detach-cube /tmp/test-mount"  # unmount and verify child exits

alternative_test:
  - "p7c data.mount-hash test.files /tmp/test-mount"
  - "ls /tmp/test-mount"       # should show test.files structure
  - "fusermount -u /tmp/test-mount"  # manual unmount

success_criteria:
  - ✓ mount command forks child, returns immediately to parent
  - ✓ ls on mount point shows correct directory structure
  - ✓ cat on a scalar key returns the value
  - ✓ child process exits cleanly on unmount
  - ✓ parent remains stable throughout

notes: |
  the fork-child canonical pattern is documented in MEMORY.md and the
  completed task archive. IO::AIO::reinit() used in child before Fuse::main().
  log level kept at default (1) in child to avoid log storm.

  all FUSE callbacks are context-aware and use <data.fuse.root_hash_path>
  when running in child process, allowing proper path resolution relative
  to the mount root.

