### Group B: nshell ctrl+o Debugging (Second Shell)
**Priority**: HIGH
**Status**: In parallel with Group A
**Effort**: 3-5 hours
**Blocker**: Debug interface improvements available
**Enables**: Phase 2 work using nshell

#### Task B1: Resume ctrl+o debugging in second Claude Code shell
**Status**: pending (blocked on context switch)
**Effort**: 3-5 hours
**Blocker**: User must switch to second shell

Description:
  Continue work on nshell ctrl+o functionality using debug commands.
  Use improvements made to debug interface from recent commits.
  Identify root cause of ctrl+o malfunction.

Context from git history:
  - Recent commits added debug commands to nshell access control
  - Network reply routing was improved (unknown-command hooks disabled)
  - Cursor display fixes were applied

Steps:
  1. Switch to second Claude Code shell (already open in neighboring tab)

  2. Review recent nshell changes:
     - modules/nshell.init_code (recent changes)
     - modules/nshell.handler.debug_input (newly added)
     - cfg/zenki/nshell/access.* (debug command permissions)

  3. Identify current ctrl+o behavior:
     - Does it respond at all?
     - What error does it produce?
     - Is it reaching the nshell module, or failing at network layer?

  4. Use debug interface to trace execution:
     - Enable debug logging for ctrl+o handling
     - Trace message flow from input → handler → response
     - Identify which module is failing

  5. Fix identified issues

  6. Test ctrl+o functionality end-to-end

  7. Commit changes with clear message about ctrl+o fix

Key locations:
  - modules/nshell.init_code
  - modules/nshell.handler.input
  - modules/nshell.handler.debug_input (new debug utilities)
  - modules/nshell.no-tty-debug.cmd.* (debug command implementations)
  - cfg/zenki/nshell/ (config & access control)

Acceptance criteria:
  - ctrl+o functionality working in interactive nshell
  - Debug approach clearly documented
  - No breaking changes to other nshell features
  - Commit created with clear message

#### Task B2: Improve debug interface for broader zenka support
**Status**: pending (after B1)
**Effort**: 1-2 hours
**Blocker**: Task B1 completion
**Dependencies**: Task B1

Description:
  Use lessons from ctrl+o debugging to improve debug interface.
  Create reusable patterns for debugging other zenka.
  Document debug methodology for future troubleshooting.

Steps:
  1. Review debug patterns used for ctrl+o

  2. Generalize into helper modules for broader zenka:
     - Message tracing utilities
     - Handler execution hooks
     - Response validation tools

  3. Create debug interface documentation:
     - How to enable debug logging
     - How to trace message flow
     - Common debugging patterns
     - Where to look for errors

  4. Test with another zenka to validate generalized patterns

Acceptance criteria:
  - Debug utilities generalized for reuse
  - Documentation created
  - Tested on at least 2 zenka (nshell + one other)

