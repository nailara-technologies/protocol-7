## Task Groups

### Group A: Visualization Archive (Current Session)
**Priority**: HIGH
**Status**: Pending
**Effort**: 2-4 hours
**Enables**: Session completion, clears context for transition work

#### Task A1: Import VISUAL_INCOMING files to archive
**Status**: pending
**Effort**: 1 hour
**Blocker**: None

Description:
  Archive 42 HTML visualization files from VISUAL_INCOMING directory.
  Move to organized location in data/asc/what-AI-thinks/html-form/visualizations/cubic-space/.

Steps:
  1. Review file listing and create semantic naming scheme
     - Use simple, clear names that indicate version/approach
     - Avoid redundant numbering (remove "(n).html" patterns)
     - Group by generation/approach (early, hyperspace variants, network-grid series)

  2. Create archive subdirectories by generation:
     - archive/v1-early-experiments/
     - archive/v2-hyperspace-variants/
     - archive/v3-network-grid-series/
     - current/ (for production version v13.7.1)

  3. Create minimal manifest (YAML):
     - Maps old names to new canonical names
     - Tracks visual properties explored (coloring, effects, navigation)
     - Notes key differences vs v13.7.1
     - This prepares for eventual template extraction automation

  4. Move/rename files with checksums verified

  5. Test that all archived files are accessible and load correctly

Implementation notes:
  - Use ccdiff output to identify truly distinct versions
  - Preserve all files (even intermediate ones) for research value
  - Focus naming on clarity, not brevity
  - Manifest format should support future WebKit3 automation

Acceptance criteria:
  - All 42 files in organized location with clear names
  - Manifest created with file properties
  - Original VISUAL_INCOMING directory can be cleared/archived
  - v13.7.1 marked as current production version
  - Files remain accessible for web serving

