## Objectives

- Automatic certificate installation to httpsd after enrollment/renewal
- Secure certificate and key file handling with proper permissions
- Symlink management for current active certificate
- HTTPSD TLS reload after certificate updates
- Manual installation command for operators
- Complete activity logging for installation operations

## Completed Components

### Certificate Installation Module
- **letsencrypt.parent.install_certificate_to_httpsd**: Core installation logic
  * Validates certificate exists in letsencrypt registry
  * Verifies source certificate and key files in cache
  * Creates httpsd certificate directory if needed (`/etc/protocol-7/certs/`)
  * Copies certificate file with permissions 0644 (readable by all)
  * Copies private key file with permissions 0600 (owner read/write only)
  * Updates symlinks: `current.pem` → `domain.pem`, `current.key` → `domain.key`
  * Calls `httpsd.reload_certificates` to reload TLS
  * Returns structured result: `{ status => 'success'|'partial'|'error', message => ... }`
  * Logs all operations to ACME activity buffer
  * Handles errors gracefully with detailed error messages

### Automatic Installation Integration
- **letsencrypt.parent.handler_enrollment_reply**: Updated for new cert installation
  * After successful certificate enrollment and save
  * Calls `install_certificate_to_httpsd` automatically
  * Logs installation result (success/partial/failed)
  * Updates activity log with httpsd installation status
  * Falls back gracefully if httpsd installation fails (cert still saved)

- **letsencrypt.parent.handler_renewal_reply**: Updated for renewed cert installation
  * After successful certificate renewal
  * Installs renewed certificate to httpsd automatically
  * Reloads HTTPSD TLS with new certificate
  * Activity logging for renewal → installation flow
  * Graceful handling of installation failures

### Manual Installation Command
- **letsencrypt.parent.cmd.install-certificate**: Operator command
  * Usage: `p7 letsencrypt.parent.cmd.install-certificate <domain>`
  * Validates domain exists in certificate registry
  * Calls installation module
  * Returns TRUE/FALSE with descriptive message
  * Allows manual installation/reinstallation when needed

## Certificate Path Structure

```
/etc/protocol-7/certs/
├── current.pem          → example.com.pem (symlink - active cert)
├── current.key          → example.com.key (symlink - active key)
├── example.com.pem      (full chain certificate)
├── example.com.key      (private key, mode 0600)
├── *.example.com.pem    (wildcard certificate)
└── *.example.com.key    (wildcard key, mode 0600)
```

## Integration Flow

### New Certificate Enrollment
1. User: `p7 letsencrypt.parent.cmd.request-certificate example.com`
2. Child performs ACME enrollment (HTTP-01 or DNS-01)
3. Parent receives certificate bundle from child
4. Parent saves certificate to cache (`/var/protocol-7/letsencrypt/certs/`)
5. **Parent installs to httpsd** (`/etc/protocol-7/certs/`)
6. **Parent creates/updates symlinks** (`current.pem` → `example.com.pem`)
7. **Parent calls httpsd.reload_certificates**
8. HTTPSD reloads TLS with new certificate
9. HTTPS connections now use new certificate

### Certificate Renewal
1. Renewal check timer fires (24 hours)
2. Parent detects certificate expiring within 30 days
3. Child performs ACME renewal
4. Parent saves renewed certificate to cache
5. **Parent installs renewed cert to httpsd**
6. **HTTPSD reloads TLS** (seamless, no downtime)
7. Activity log updated with renewal success

### Manual Installation
1. Operator: `p7 letsencrypt.parent.cmd.install-certificate example.com`
2. Module validates certificate exists
3. Copies certificate and key to httpsd paths
4. Updates symlinks
5. Reloads HTTPSD TLS
6. Returns status to operator

## Security Features

### File Permissions
- Certificates (`.pem`): **0644** - World readable (certificates are public)
- Private keys (`.key`): **0600** - Owner read/write only (keys are secret)
- Certificate directory: **0755** - Standard directory permissions

### Error Handling
- Validates source files exist before copying
- Creates directories with proper permissions
- Atomic symlink updates (unlink old, create new)
- Graceful fallback if httpsd reload fails
- Detailed error logging for debugging

### Activity Logging
All operations logged to `buffer.acme-activity`:
- `install | domain | pending | installing to httpsd`
- `install | domain | success | installed to httpsd`
- `install | domain | partial | installed but reload failed`
- `install | domain | failed | certificate not found`

## HTTPSD Configuration

From `configuration/zenki/httpsd/start`:
```perl
httpsd.cfg.tls_version              = TLSv1_2
httpsd.cfg.cipher_suite             = DEFAULT:!aNULL:!eNULL:!MD5:!3DES:!DES:!RC4
httpsd.cfg.certificate_path         = /etc/protocol-7/certs/current.pem
httpsd.cfg.key_path                 = /etc/protocol-7/certs/current.key
httpsd.cfg.hsts_max_age             = 31536000    ## 1 year
httpsd.cfg.hsts_include_subdomains  = 1
```

HTTPSD reads certificates from symlinks `current.pem` and `current.key`,
allowing seamless certificate updates without configuration changes.

