## Testing Scenarios

### Test 1: New Certificate Enrollment
```
p7 letsencrypt.parent.cmd.request-certificate example.com
# Verify:
# - Certificate saved to cache
# - Certificate installed to /etc/protocol-7/certs/
# - Symlinks created: current.pem → example.com.pem
# - HTTPSD reloaded TLS
# - HTTPS works with new certificate
```

### Test 2: Certificate Renewal
```
# Wait for renewal check or force renewal
# Verify:
# - Renewed certificate installed to httpsd
# - Symlinks updated (may be same domain)
# - HTTPSD reloaded without downtime
# - Activity log shows renewal → install flow
```

### Test 3: Manual Installation
```
p7 letsencrypt.parent.cmd.install-certificate example.com
# Verify:
# - Returns TRUE with success message
# - Certificate and key copied
# - Symlinks updated
# - HTTPSD reloaded
```

### Test 4: Wildcard Certificate
```
p7 letsencrypt.parent.cmd.request-certificate *.example.com
# Uses DNS-01 challenge (from Phase 6)
# Verify:
# - Wildcard cert installed to httpsd
# - HTTPS works for any subdomain
```

### Test 5: Error Handling
```
# Test missing certificate
p7 letsencrypt.parent.cmd.install-certificate nonexistent.com
# Verify: Returns FALSE with "certificate not found" message

# Test permission denied
# chmod 000 /etc/protocol-7/certs
# p7 letsencrypt.parent.cmd.install-certificate example.com
# Verify: Returns FALSE with "failed to write" error
```

