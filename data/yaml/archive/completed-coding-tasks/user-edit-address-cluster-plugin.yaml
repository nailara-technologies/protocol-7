---
# Task: user-edit address clusters (multiple addresses via a plugin)
# Date: 2026-08-13
# Status [ 2026-08-25 ] — DONE. Implemented via da2cca07f (scaffold) ..
#         3b247caf7 (complete address-cluster plugin -- real editing logic
#         + fixes), plus six follow-on polish/fix commits (fe4e68648,
#         6c36effef, 5092b3ff3, ef08d6a79, c2f79fe78, 3a624ddf7). All 10
#         src/plugin.user-edit.address-cluster.* modules confirmed present
#         2026-08-25. Archived to completed-coding-tasks/.
#
# Status (original, superseded above): DESIGN DRAFT, not yet implemented.
#         Raised by user right after the simple 'address' multiline field
#         landed (commit 989e5ebb3 + follow-up fix for the add_field/
#         schema_from_record drift) : one scalar address is not enough
#         once home/work/billing/etc. all need to coexist. Consulted
#         advisor before drafting.

context: |
  'address' today is exactly what 'note' is -- one multiline scalar. Fine
  for a single address, wrong the moment more than one needs to coexist
  with a label and a "which one is primary" distinction. Rather than
  inventing a new core "list of multiline blocks" field type, the user
  proposed composing THREE systems already built this session :

  1. the plugin detail-tabs mechanism ( user-edit-plugin-detail-tabs.yaml )
     -- a plugin pins itself to a field, takes over its display via the
     already-generic editor.control.get_display_value 'display_override'
     hook, and owns a full custom-rendered page entered via the same
     Right-two-stage trigger every other pinned field already uses.
  2. multiline editing ( user-edit-multiline-note.yaml ) -- windowed
     display, PgUp/PgDn, Enter-splits-a-line, Up/Down-within-buffer, all
     built on generic editor.control.multiline.* helpers that operate on
     plain text, not on any specific field.
  3. this project's own checksum-addressing lineage ( AMOS7::CHKSUM,
     base.chk-sum.*, P7REF ) -- content gets a short, stable, addressable
     code rather than a numeric row id.

  the composed idea, per user : the top-level 'address' field, once a
  plugin owns it, does NOT show address text at all -- it shows short
  checksum REFERENCES to the actual entries, which live behind the
  detail-tab page. that page is where the real list -- multiple labelled
  addresses, one marked primary -- gets edited.

decided_so_far:
  ref_semantics: |
    RESOLVED, per user, explicitly asked rather than assumed [ advisor's
    flag : "reference to content" and "stable identifier" diverge
    completely and the storage shape follows directly from which one it
    is ] -- STABLE IDENTIFIER. Minted ONCE when an address entry is
    created, stored alongside its label/primary-flag/body, never
    recomputed from the body text. Survives edits to the body. This is
    what makes it an actual REFERENCE rather than a fingerprint that
    changes on every keystroke -- matches the project's own P7REF /
    checksum-addressing lineage, not a hash-of-content display gimmick.

  ref_generation: |
    RESOLVED, per user's own precedent : `bin/todo`'s `chk3()`/`gen_id()`
    -- a random 3-character AMOS7::CHKSUM::amos_chksum code [
    `local $AMOS7::CHKSUM::str_length = 3` ], regenerated on collision,
    gated through AMOS7::Assert::Truth::is_true when the harmonic space
    allows it [ ~99.6% of codes per that script's own measured comment ],
    falling back to a non-harmonic retry pass if the budget runs out.

    ONE ADAPTATION NEEDED, not a straight copy : `bin/todo` is a
    STANDALONE script with no zenka state, so its entropy source is
    `rand()`/`time`/`$PID`. `user-edit` is a running zenka with
    `<base.prng.fortuna>` available -- the real precedent is `chk3`'s
    CHECKSUM step [ `AMOS7::CHKSUM::amos_chksum` at length 3 ] combined
    with Fortuna for the seed, not `base.gen_id` itself [ that module
    generates plain NUMERIC ids from a digit alphabet via Fortuna, a
    different mechanism entirely -- `bin/todo`'s own comment says it
    "mirrors base.gen_id's SHAPE" [ random candidate / collision retry /
    harmonic gate ], not its digit-generation internals ].

    COLLISION SCOPE, per user : "the same for address id in the namespace
    of that user" -- collision-checked against refs already present in
    THIS user's own address blob only, not a global registry. Small N per
    user makes this cheap and matches `bin/todo`'s own scoping [ checked
    against items still in ITS OWN file, not some wider store ].

    SEED SOURCE, refined by user after the first pass above : `bin/todo`'s
    own history went from a plain INCREMENTING id first, then moved away
    from that -- an incrementing counter narrows the entropy space over
    time and becomes predictable, the opposite of what a collision-
    resistant short code wants. The fix that generalises here : fold
    `<[base.ntime]>` [ this codebase's own encoded-epoch primitive, ALREADY
    the timestamp mechanism `users.record.build` stamps every record with
    -- confirmed via that module directly, not assumed ] into the seed on
    EVERY retry attempt, not just once up front. A fresh `<[base.ntime]>`
    call each retry gives each collision-retry attempt genuinely new
    high-resolution entropy for free, without needing an explicit retry
    counter or an incrementing id anywhere in the scheme -- collision
    avoidance falls out of "ask for the time again", not "add one".
    Concretely: `join('-', <[base.ntime]>, <base.prng.fortuna>->..., $try)`
    as the per-attempt seed into the same `chk3`-shaped checksum step.

    WHY "add one" is wrong, PRECISELY -- corrected by user after an
    overstated first pass here : the problem is narrower than "any
    increment is bad". It is specifically using the incrementing value AS
    THE STORED IDENTITY itself [ `bin/todo`'s ORIGINAL `next_id` scheme,
    before it moved to random checksums -- see [[project-bin-todo-random-
    id-scheme]] ] -- reconstructing "what the counter's next value should
    be" needs exact prior collision/skip state carried alongside it, and
    separately hits the birthday-paradox growth problem that memory
    already documents.

    An incrementing value used as ONE INGREDIENT HASHED INTO a checksum
    candidate is a DIFFERENT, perfectly fine thing -- per user's own
    example : `amos-chksum LOVES` -> `PKHKHVA`, `amos-chksum 001:LOVES`
    -> `NKDRXUA`. Different input, different checksum, entirely by
    design. `bin/todo`'s OWN `gen_id()` already does exactly this : `$try`
    [ the retry loop's own counter, 1..200 ] sits directly in the seed
    alongside `time`/`$PID`/`rand()`. The final identity is always the
    HASH OUTPUT, checked directly against the live collision set on every
    attempt -- never inferred from the counter's value, so nothing about
    it needs reconstructing. `<[base.ntime]>` refines the ENTROPY quality
    of that seed [ project-native, high-resolution, vs raw `time()` ], it
    does not need to replace an incrementing `$try` component -- both can
    coexist in the same seed exactly as `bin/todo`'s already does.

    ONE MORE SCOPING, per user : a plain incrementing counter AS identity
    is still entirely valid -- but mostly within a CLOSED entropy pool,
    one that fits in memory on a single node or lives only as long as one
    session's own hash. The reconstructability problem is really about
    the counter needing to be validated OUTSIDE the bounded scope that
    generated it -- across a restart, across nodes, or once persisted
    without its accompanying counter state travelling with it. A counter
    that never leaves one node's memory for its entire meaningful
    lifetime has none of that problem, because nothing about it ever
    needs reconstructing -- the full history was never lost in the first
    place. THIS feature's ref is explicitly the OTHER case : persisted to
    disk, meant to survive edits and be referenced again in a later
    session -- squarely where the reconstructability problem bites, so
    the random/checksum approach stays right HERE. Worth remembering as
    the general shape, not this feature's rule : a transient in-session
    counter [ e.g. numbering rows in a not-yet-submitted UI list purely
    for internal bookkeeping, never itself the persisted key ] could
    legitimately just increment.

    CONFIRMED, per user : the closed-entropy-pool rule is NOT broken by
    this feature being persisted -- it still holds here, for two reasons.
    First, the LIVE set this checksum is deduplicated against is always
    small [ one user's own address entries -- realistically single
    digits ], so a 3-char code's space is vastly larger than what it
    needs to stay unique within, cheaply. Second, the ref is STABLE by
    the earlier ref_semantics decision -- it does not reorder or need
    regenerating on its own ; only actual content change could ever put
    it in question, and even then a stable identifier is deliberately
    never recomputed from content. So the persisted/cross-session
    property that makes a bare incrementing counter risky elsewhere
    [ reconstructability across a boundary ] does not undermine the
    checksum approach here -- the two properties [ closed pool vs.
    persisted lifetime ] are independent, and this design satisfies both
    at once : persisted AND checked against a pool small enough to stay
    effectively closed.

storage_shape: |
  ONE pinned key, 'address' -- the SAME name the plain scalar field
  already uses today. Once the address-cluster plugin is active for a
  user, it pins to 'address' exactly the way any other plugin pins to a
  real field [ per the design doc's own resolution : "the plugin also
  owns the CROSS-REFERENCING between its own pinned keys... a plugin's
  storage footprint is just however many plain-scalar keys it declares,
  not a single fixed shape" -- here that's ONE key holding an ENCODED
  LIST rather than several separate keys, still a plain scalar at the
  storage boundary ].

  the blob : a plugin-owned encoding [ format.yaml.* is the obvious
  choice -- already proven round-tripping embedded newlines correctly,
  see multiline-note's own storage_and_round_trip note ] of
  `[ { ref => '<3-char amos_chksum>', label => '...', primary => TRUE|
  FALSE, body => <CONTENT> }, ... ]`. exactly ONE entry ever has
  primary => TRUE ; the plugin enforces that invariant on every edit, not
  the storage layer.

  CONTENT TYPING, per user -- no separate 'reftype' key at all, dispatched
  by Perl's own ref() on `body` instead, the SAME idiom user-edit.form.
  schema_from_record already uses one level up [ arrayref => list field,
  plain scalar => line field -- confirmed by reading that module ] :
    - scalar or scalar-ref `body` => PLAIN CONTENT, exactly what is built
      today -- multiline address text, windowed/edited as already shipped.
    - arrayref `body` => NOT literal content at all, but a REFERENCE of
      some other kind -- even a single-element array is still array-
      shaped and reads as "this is a reference, not text" unambiguously.
      the array's own first element is the natural place for a reftype
      discriminator [ e.g. `['pubkey', 'C25519', $key_id]` vs
      `['plugin', 'credentials', $checksum_id]` ] -- NOT built now, no
      concrete reftype has a real consumer yet [ credential types are
      their own separate, already-tracked project -- see
      [[project-credential-types-into-user-edit]] ], this just reserves
      the DISPATCH shape so a future reftype costs adding one arrayref
      convention, not a storage migration.
  this resolves the earlier open question of whether a 'reftype' flag
  belongs in editor.control's generic contract or stays plugin-private --
  there IS no separate key to place anywhere. The distinction lives
  entirely inside this plugin's own private blob format, using a
  mechanism [ ref() dispatch on a value ] that is already zenka-agnostic
  Perl, not a new concept anyone else needs to know about.

  NOT decided yet, deliberately left open : whether an EXISTING plain-
  scalar 'address' [ written before this plugin ever existed, or by any
  other client that doesn't know about clusters ] gets auto-migrated into
  a one-entry cluster on first plugin-mediated edit, or whether that is a
  manual "convert to cluster" action. Needs a decision before
  implementation, not guessed at here.

main_form_display: |
  PARTIALLY decided : per user, the field shows checksum REFERENCES, not
  raw address text -- this is `display_override` doing exactly what it
  already does for the plugin-tabs feature [ zero new mechanism there ].

  NOT yet decided : whether it shows the PRIMARY entry's ref alone [
  singular, matches "the parent address field... shows... references to
  the actual addresses" read as "the primary one, by reference" ] or ALL
  refs at once [ user's phrasing was plural -- "amos-chksum or BMW-L13
  references to the actual addresses", which could mean either "one ref
  per address, shown as a set" or just grammatical pluralisation of "the
  feature in general" ]. Recommend showing the primary's ref alone, with
  a count suffix if more exist [ e.g. '[ XY7 +2 ]' ] -- keeps the
  collapsed row's width bounded and matches how a collapsed LIST field
  already shows a count rather than every entry. Worth a one-line
  confirmation before building the render, not worth blocking the rest of
  this doc on.

checksum_algorithm: |
  NOT yet decided : user named BOTH amos-chksum and BMW-L13 as
  candidates. `bin/todo`'s own precedent uses plain `AMOS7::CHKSUM::
  amos_chksum` at 3 chars -- matching that exactly is the path of least
  surprise and reuses a ALREADY-PROVEN collision-rate measurement [ the
  99.6% harmonic-space figure `bin/todo`'s comment cites ]. BMW-L13 [
  `AMOS7::13::*` / `base.chk-sum.bmw` per CLAUDE.md's own module list ]
  is a different algorithm family with no equivalent measured collision
  behaviour at short lengths documented anywhere found so far -- would
  need its own characterisation before trusting it at 3 characters the
  way amos_chksum's is already trusted. Recommend amos_chksum unless
  there's a specific reason to prefer BMW-L13 for this.

open_engineering_question -- MULTILINE EDITING INSIDE A PLUGIN TAB: |
  RESOLVED 2026-08-13, superseding the (a)/(b) fork originally recorded
  here -- see MULTILINE VIEWPORT below, which folds this question into a
  bigger, GENERAL fix rather than a plugin-scoped workaround. The plugin
  still reimplements windowing itself [ still-valid part of former option
  (a) -- pure editor.control.multiline.* text functions, no schema needed
  ], but the actual per-line WIDTH problem that made this question hard is
  now solved once, centrally, not duplicated per-caller.

MULTILINE VIEWPORT -- RESOLVED 2026-08-13, raised by user mid-design: |
  starts from a REAL LATENT BUG found while resolving the plugin-tab
  question above, not a hypothetical : editor.ui.ascii_frame.render_form's
  existing multiline block [ user-edit-multiline-note.yaml's own shipped
  feature ] places each windowed line's FULL raw text into its `{{name_N}}`
  slot with no length cap at all [ line ~134, `$line_text =
  $lines->[$line_index]` straight into `$display` ]. user-edit.form.
  build_frame's own width-floor scan [ `$display_length` ] returns 0 for a
  multiline field's own row -- confirmed by reading it -- so a multiline
  body's length has NEVER contributed to `min_width`. That is fine for the
  FLOOR [ narrowing ], but build_frame's own comment on `min_width` says it
  plainly for the CEILING too : "a value longer than anything reserved
  still widens the frame as it always did" [ ascii.frame.render's own
  behaviour, unconditional ]. So today, right now, in shipped code : one
  very long line in `note` or `address` already blows the card width open.
  This was going to bite the plugin identically the moment its own tab
  tried to show one address entry's body, which is what surfaced it.

  Two options were on the table for the plugin's single-row tab view
  specifically [ hard-wrap-to-real-newlines vs a non-mutating slice
  viewport ] -- user picked the slice viewport, and for a reason that
  generalises past the plugin : hard-wrap is DESTRUCTIVE [ inserted \n is
  indistinguishable from a typed one, so re-wrapping at a different width
  later silently rewrites content and can ratchet ], whereas a slice
  viewport reads the SAME stored text unmodified and just bounds what one
  render shows. Per user : "the other option is to somehow implement a
  viewport [passthrough] with elegant and compact overflow handling" --
  and per user's own further framing on the (now moot, since nothing is
  written) wrap-width question, overlong content should normalize into
  "something window width independent" so that "'as seen' would be the
  [recreated] truth" -- satisfied here differently than first framed :
  truth is recreated because the SOURCE never changes, only the view does,
  so "as seen" this render and "as seen" any other render of the same
  content are both faithful slices of one unchanged truth, not two
  independently-wrapped copies that can drift from each other.

  SCOPE, per user : GENERAL, not plugin-only. Applies to the already-
  shipped `note`/`address` cap-3 windowed rows [ fixing the latent bug
  above ] AND to the new plugin's single-row tab view, both calling the
  SAME helper -- one fix, one place, not a plugin-private reimplementation
  of something the core feature needed anyway.

  WIDTH SOURCE, per user : dynamic, tied to the frame's own actual current
  width, not a fixed column constant. Concretely : user-edit.form.
  build_frame already computes `$min_width` [ the width floor from every
  OTHER field/label in the form -- a multiline field's own body never
  contributes to it, confirmed above ], and stores it on the generated
  descriptor as `$descriptor->{'min_width'}`, which editor.ui.ascii_frame.
  render_form already loads via `ascii.frame.load` before it ever touches
  the multiline block. That is the natural, ALREADY-COMPUTED width source
  -- no new plumbing to carry a width value anywhere, no chicken-and-egg
  with build_frame [ multiline content contributing 0 to the scan is
  exactly what keeps this well-defined : the floor this reads is computed
  from everything else in the form, never from the thing being capped ].
  Being non-destructive is what makes "dynamic" safe here where it would
  not have been for hard-wrap : recomputing the slice against a
  frame-width that shifts between renders [ e.g. another field's value
  changed length ] just shows a different window of the SAME text, never
  rewrites it, so there is no ratcheting risk to worry about at all.

  MECHANISM, to build : new pure-text helper, `editor.control.multiline.
  viewport_slice($line_text, $width, $cursor_col)` -- given one line
  [ never the whole multiline buffer -- the existing per-line windowing in
  render_form's multiline block already isolates one line at a time before
  this would be called ], a target character width, and the cursor's
  column within that line [ -1 / undef when this is not the cursor's own
  row ], returns a string at most `$width` chars : the raw line unchanged
  if it already fits, otherwise a WINDOW of it that keeps `$cursor_col`
  visible [ centring or edge-clamping the same way a scrollable single-line
  input already would ], with a 1-char overflow marker [ `<` / `>` ]
  replacing the edge character whenever content is truncated on that side.
  A non-cursor row with no cursor_col simply windows from its own start
  [ offset 0 ] when too long, matching the plugin's own single-row case
  where there is no live cursor most of the time.

  EXACT WIDTH BUDGET given `$descriptor->{'min_width'}` [ how many chars a
  multiline row's own body may use out of it, after label/colon/framing
  overhead ] is not hand-derived here -- build_frame's row-geometry algebra
  [ `row_width = inner_width + len(display) - len(name) - 4` ] is exact for
  MEASURING a fixed mockup token, not for INVERTING to "how much body fits
  in a given inner_width" without re-deriving per-row constants live. Done
  empirically instead, matching how window_cap [ '3' ] and every other
  magic number in this feature was picked : `min_width - label_width - 10`,
  floored at 20.

  BUILT AND MEASURED, 2026-08-13, not left as an inference -- advisor
  flagged that "the card no longer widens" needed an actual A/B
  measurement, not just plausible-looking captures. Method : `git stash`
  the two changed core modules [ render_form, build_frame -- the new
  viewport_slice module itself set aside too, since without the other two
  wired to it, it does nothing ], drive a fresh throwaway record
  [ `p7-fieldtest2` ] headless through the identical long address value on
  the UNPATCHED code, measure the rendered title-bar line length, restore
  the fix, repeat against a fresh throwaway [ `p7-fieldtest3` ] with the
  IDENTICAL input. Result : **178 characters unpatched, 108 characters
  patched**, same content both times -- confirms the floor genuinely caps
  the frame rather than merely looking bounded in one capture. label_width
  + 10 held up as a workable subtraction at this content length ; no
  further tuning needed yet, revisit only if a real record surfaces a
  width that looks wrong.

  CURSOR-MARKER CORRECTNESS, also verified rather than assumed : advisor
  separately flagged a specific risk -- does the cursor's display column
  ever get computed to land ON a '<'/'>' overflow marker instead of a real
  character, reachable by ordinary Right-arrow through a long line, not a
  degenerate input. Checked exhaustively with a standalone Perl harness
  reproducing viewport_slice's exact logic : swept every width 3..40
  against every cursor position across a 150-character line [ 5,738 cases
  total ], asserting the character at the returned display_col always
  matches the ORIGINAL character at that cursor position [ never a marker
  ], with one legitimate exception carved out explicitly -- a cursor
  exactly at end-of-text lands one position past the slice's own last
  index, which is correct "cursor after the last character" semantics
  [ the same convention the pre-existing non-viewport cursor-overlay
  already uses, per render_form's own downstream clamp ], not a bug.
  Zero failures across all 5,738 cases once that legitimate case was
  accounted for.

  live char-add captures separately confirmed the WINDOWING behaviour
  itself [ typed a ~150-char address line, then walked the cursor left
  through it in the actual headless harness -- '<'/'>' markers correctly
  appeared and disappeared at each end as the visible window followed the
  cursor ], though the cursor MARKER CHARACTER itself is not visible in
  char-add's own capture rendering at all -- confirmed pre-existing and
  unrelated to this change [ a plain short "hello" typed into an untouched
  'note' field shows the identical gap ], not something this change
  introduced or needs to fix.

  BUILD ORDER, per user's own earlier prioritisation of the (now-
  superseded) plugin-tab question : fix the general note/address latent
  bug FIRST [ smaller, already-live code, immediately testable against the
  existing headless-driving technique with a deliberately long value ],
  THEN build the plugin's own tab reusing the same helper -- verifies the
  helper once against a known-working feature before a brand new one
  depends on it.

collision_check_before_building: |
  the throwaway test plugin ( plugin.user-edit.example ) already caused
  one real live production bug this session by pinning to a name that
  turned out to collide with a real field [ 'location' -- fixed in
  2b504e4ef ]. before any REAL address-cluster plugin ships, confirm
  its pinned_keys is exactly [ 'address' ] and that no OTHER plugin
  [ including the still-wired example one, currently pinned to
  'example_test_field' ] pins the same name.

open_questions: ALL RESOLVED per user 2026-08-13, recorded here for the
  record rather than left as open:
  - blob migration : RESOLVED -- LAZY, parse-on-read. An existing plain-
    scalar 'address' that does not parse as the plugin's own blob format
    is treated, for DISPLAY only, as a synthetic one-entry cluster [
    single entry, primary => TRUE, body => the raw legacy text verbatim,
    ref minted on the fly for that render but NOT persisted ]. Nothing is
    written to disk until an actual edit happens -- avoids a write-storm
    touching every existing user record the moment this plugin's
    pinned_keys activates it globally [ pinning is systemic, not
    per-user opt-in, same as every other plugin -- see the collision
    hotfix precedent, 2b504e4ef ]. The real persisted migration happens
    naturally the first time `user-edit.form.submit` writes the field
    again, same as any other edit.
  - main-form display : RESOLVED -- primary ref alone, plus a count
    suffix when more exist [ e.g. '[ XY7 +2 ]' ].
  - checksum algorithm : RESOLVED -- amos_chksum [ has bin/todo's
    measured collision-rate precedent ; BMW-L13 stays a possible future
    swap if ever characterised at short length, not blocking this ].
  - multiline-inside-a-plugin-tab : RESOLVED -- approach (a), the plugin
    reimplements windowing via the generic editor.control.multiline.*
    helpers directly. This is still the one piece of real new
    engineering in the whole feature ; build and live-test it first,
    before the rest, since everything else is composition of what
    already exists and carries much lower risk.

implementation_status: |
  BUILT AND LIVE-VERIFIED, 2026-08-13. `plugin.user-edit.address-cluster.*` :
  init_code, tab_info (pinned_keys => ['address']), gen_ref, parse_blob,
  serialize_blob, write_buffer, render, handler.key. Every path exercised
  live against throwaway records via the established headless-driving
  technique : entry create (Insert, collision-avoided refs), body/label
  edit, PageUp/PageDown cycling, Ctrl+P primary toggle (exactly-one-primary
  invariant held), Ctrl+D delete (with primary reassignment), collapsed
  display (primary ref + count, or '[ none ]'), submit, and reload -- both
  the non-empty and the empty-after-delete-all cases round-tripped
  correctly (`address: ''`, not `'--- []'`).

  TWO CORE BUGS found and fixed at the source while building this, both
  affecting the plugin-tabs feature generally, not just this plugin :
  - user-edit.form.add_field never wired plugin-pinned fields (readonly/
    plugin/display_override) when added fresh via the cycler -- same gap
    class as the earlier multiline/sort_on_focus drift (2a6a4b841), fixed
    by reading the plugin registry directly (no third hand-duplicated
    list needed, unlike those two).
  - user-edit.handler.stdin_key's two-stage Right-entry trigger required
    the cursor to move past position 0, impossible on a field with ZERO
    content -- any plugin pinned to a field that starts empty (this
    plugin's own primary case) could never be entered at all. Fixed to
    enter on the first Right when the field's value is genuinely empty.
  - editor.ui.ascii_frame.render_form's generic cursor_bearing overlay
    fired on ANY plugin's display_override output using the RAW BUFFER's
    character offset -- meaningless once a plugin restructures its own
    display string [ this plugin's tab view bears no positional relation
    to the raw YAML buffer at all ]. Added 'plugin' to the same exclusion
    list list/menu_row/add_field/list_info already use.

  ONE BUG caught by advisor before it shipped, not found live : an early
  draft let Backspace's write-through be conditional on a guard inside the
  key branch, with the fallthrough case landing in the printable-character
  check -- which does not exclude "\x7f" (ord 127, satisfies >= 32 same as
  real printable bytes). Backspace at cursor 0 would have inserted a
  literal DEL byte instead of no-op'ing. Fixed by having Enter/Backspace/
  Delete-forward each return unconditionally once matched, same pattern
  plugin.user-edit.example.handler.key's own backspace/printable pair
  already uses.

  KEYBINDINGS, none recoverable from reading the code alone, recorded here
  deliberately : PageUp/PageDown cycle entries (only established paging
  precedent in this codebase). Tab swaps which of label/body typing goes
  to. Insert creates a new entry. Ctrl+P toggles primary on the current
  entry. Ctrl+D deletes the current entry (NOT bare Delete, which stays an
  ordinary forward-character-delete). Right moves the cursor forward in
  the targeted text ; Left is PERMANENTLY UNAVAILABLE inside plugin mode
  [ user-edit.handler.stdin_key intercepts it unconditionally to leave ],
  filled by Ctrl+B ('back') as the non-destructive move-backward key. Up/
  Down move between the BODY's own lines only (no-op on label, always one
  line). Home/End jump to start/end of the current line (body) or whole
  text (label). Cursor lands at END of the newly-shown text on every
  selection/target change (Tab, PageUp/PageDown, Ctrl+D), not the start --
  reconsidered from an initial cursor-at-0 choice per advisor, since
  landing at 0 would PREPEND to existing content on the very next
  keystroke rather than continuing it, the less conventional of the two.

  KNOWN QUIRK, not a bug introduced here, a live property of the ALREADY-
  SHIPPED plugin-tabs trigger worth recording since it cost real time while
  testing headless : the two-stage Right-entry protection [ first Right
  lets an ordinary cursor move stand, second commits ] is keyed on the raw
  buffer's cursor position BEFORE the keystroke. Once a field has been
  entered and left at least once, that raw cursor is wherever editing left
  it -- almost never 0 again -- so EVERY subsequent Tab-arrival-then-Right
  on that field re-enters immediately, single-stage, not two-stage. Not
  wrong exactly [ the field has already been "discovered" once ], but
  surprising, and it is why a Right/Enter sequence intended to leave a
  plugin field and move to the NEXT form field will instead re-enter the
  plugin and dispatch Enter to its handler.key -- use Tab to leave the
  outer field's row after a Left-exit, never Right.

  NOT YET BUILT : content-type reference dispatch (arrayref `body` =>
  typed reference, per the CONTENT TYPING section above) -- no concrete
  reftype has a real consumer yet, still correctly deferred.

REVERTED, same day (2026-08-13), per user : the ref/label/primary/multi-
entry model was the wrong shape for the actual use case -- one plain
address per person, not several. Concretely : the mandatory
'[N/M]* ref:XXX label: body:...' prefix could not be turned off even for
a single entry, meaning a plain address was no longer a free-form field
at all ; and the storage format was an embedded YAML document inside the
'address' scalar, visible as raw YAML the moment anything outside this
plugin's own render() displayed the field. Two live cursor-position bugs
(see the sections above) were found and fixed on the way to this
realization, but neither was the real problem -- the whole shape was.
Unwound cleanly rather than patched further : `plugin.user-edit.address-
cluster` removed from `cfg/zenki/user-edit/zenka.v7`'s
`plugins.load`, all eight `plugin.user-edit.address-cluster.*` module
files deleted, `cfg/zenki/user-edit/subroutines.load-early`
regenerated via `bin/dev/gen-sub-whitelist user-edit`. `address` falls
straight back through to the PRE-EXISTING plain-multiline path
(`user-edit.form.multiline_field_names` already listed it alongside
`note`, predating this plugin -- the plugin's own pin in
`user-edit.form.schema_from_record` was intercepting it first) : zero
schema changes needed for that part, since the plain path was there
the whole time underneath. Live data for the one real record already
carrying the migrated blob was converted back to a plain multi-line
scalar by hand, and the whole path re-verified live end to end against
a throwaway record (add via cycler, type multi-line text, renders/
edits exactly like `note` does -- no ref, no metadata, no YAML).

This plugin's OWN infrastructure (`plugin.user-edit.registry`, the
plugin-detail-tabs mechanism, `plugin.user-edit.example` as a live
precedent) is untouched and still fully functional for a FUTURE case
that genuinely needs multiple structured entries per field -- this
reversal removes only this one plugin's use of it, not the mechanism
itself.

REBUILT, same day, same conversation, per user correction : the revert
above over-corrected. Per user, the interaction model AS IMPLEMENTED was
incomplete, not wrong as a concept -- "completing it" was the right call,
not deleting it. The actual gap : the structured ref/label/position view
showed UNCONDITIONALLY, even for the overwhelmingly common case of
exactly one address with no label, where none of that metadata means
anything yet. Restored via `git restore --staged --worktree` (all eight
files were only `git rm`'d, not yet committed, so the pre-revert content
-- including both cursor-position fixes from the sections above -- came
back exactly as it was) and `cfg/zenki/user-edit/zenka.v7`'s
`plugins.load` re-appended.

NEW PRINCIPLE, computed fresh on every `render()` call from `$entries`
alone, never cached : `$is_plain` = exactly one entry AND that entry
carries no label. While true, BOTH the collapsed view (address text's own
first line, not a ref) and the tab-mode view (bare text with its cursor,
no `[N/M]* ref:XXX label:`/`body:` scaffolding at all) look and edit
indistinguishably from an ordinary multiline field -- matches `note`
exactly from the outside, which was the actual ask. The MOMENT a 2nd
entry is Insert'ed, or a character actually lands in `label` [ Tab still
switches target underneath even while plain, unchanged -- the structured
view simply takes over on the very next render once label is non-empty,
no separate "promote" step needed anywhere ], `$is_plain` goes false and
the full structured view appears. Ctrl+D back down to one unlabeled entry
demotes it again, same mechanism, both directions verified live.

REAL BUG caught building this, not hypothetical : `my $is_plain = (...)
and (...)` -- `and` binds looser than `=`, so `$is_plain` was silently
only ever the FIRST half of the condition. Caught by `perl -c`'s own
"useless use of not in void context" warning before this ever ran live
-- the same documented precedence trap this project's memory already
warns about repeatedly, made again regardless, worth noting once more :
`&&`, not `and`, whenever the result feeds an assignment on the same
statement.

Taeki's real `address` field needed NO further data migration for this
rebuild : it already held the plain-scalar text from the first revert,
and `parse_blob`'s existing LAZY MIGRATION path already turns that into
exactly one unlabeled synthetic entry -- precisely the shape `$is_plain`
treats as plain. Live-verified against a throwaway record : empty ->
Insert (bare cursor, no scaffolding) -> type multi-line text (plain
throughout) -> Left (collapsed preview, first line + an ellipsis when
there is more than one line, no ref) -> Right/Right/Insert a 2nd entry
(structured view appears immediately) -> Ctrl+D the 2nd entry (demotes
back to plain immediately).

CURSOR STYLING, third round, same day : full inverse-video/coloured
parity with the parent form's own cursor treatment, without the width
regression the first attempt shipped. Root architecture : `render()`'s
`\x01` placeholder is now left UNRESOLVED all the way out, surviving
into `user-edit.form.render`'s existing post-width-math `\x01`
substitution pass -- the same mechanism every ordinary field already
uses safely, previously unusable here only because that pass computes
its styling character via a raw-buffer `substr()` meaningless for a
plugin's restructured display. Fixed with a new OPTIONAL per-plugin
convention : `<plugin>.cursor_char($editor_state, $field)`, checked via
`<user-edit.plugin.registry>{'by_key'}` for the active field. New
`plugin.user-edit.address-cluster.resolve_state` shares the entries/
selection/target/cursor resolution between `render()` and the new
`cursor_char` sub, so the styled glyph cannot drift from the position
actually shown -- an advisor-flagged risk of two independent copies of
that arithmetic disagreeing silently, invisible in any piped capture.

A second gap, also advisor-flagged before shipping : `user-edit.cmd.
char-add` -- the no-tty debug path this whole plugin's live testing has
run through -- has no substitution pass of its own for a plugin field's
placeholder ; it relied entirely on `render()` resolving it locally.
Fixed there too, explicitly, right after its own `render_form` call,
with the RAW character rather than a styled one -- matches char-add's
own established philosophy of self-overlaying the cursor with the
character already there, never corrupting or marking the captured
value.

Verified live against `zztest-addr`, headless `-no-tty`, driven via
`char-add` : confirmed the wiring end-to-end with a temporary sentinel
return value in `cursor_char` (`Z`), watched it land exactly at the
cursor position in the capture, reverted. Could NOT verify the actual
inverse-video ANSI live this way -- `-no-tty` mode gates OFF the
dirty-watcher print path entirely (`user-edit.handler.value_get_reply`'s
`<user-edit.form.interactive> and not <user-edit.mode.no_tty_debug>`),
so `user-edit.form.render` never runs under it, real pty on STDOUT or
not. The styling application itself is the SAME three-case block every
other field already renders correctly with all session -- only the
source feeding `$cursor_char` changed for a plugin field -- so this is
a structural correctness argument, not a live-verified one ; needs
confirmation from an actual terminal.

LEFT-KEY SYMMETRY, same day, reported by the user immediately after
confirming the cursor styling itself : entering the plugin's tab mode
and cursor styling both worked, but Left exited on the very first
press regardless of cursor position -- a leftover from Left's earlier
"permanently unavailable, unconditionally intercepted to leave" design,
with Ctrl+B filling the gap as the only way to move backward. Fixed
symmetric with Right's own two-stage entry trigger : Left is now
offered to `plugin.user-edit.address-cluster.handler.key` first, same
as every other key in plugin mode, and `user-edit.handler.stdin_key`
only leaves plugin mode when that sub explicitly declines by returning
FALSE. Declines specifically at column 0 of the CURSOR'S CURRENTLY
DISPLAYED ROW, not column 0 of the whole text -- per the user's own
follow-up clarification -- since only one line of a body is ever
visible at once, so wrapping to the end of the previous line the way a
real editor's Left usually does would move the cursor somewhere the
user cannot see change. A label is always one line, so the distinction
collapses to the same condition there. Verified live against
`zztest-addr`'s two-line body ("123 Main St" / "Somewhere") : 9 Lefts
walk back through "Somewhere" without leaving the field, the 10th
(column 0 of that row) exits correctly to the collapsed preview, and
Right re-enters normally afterward.

