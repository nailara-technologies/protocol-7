title: |
  dynamic context and system message templates for models / kimi integration

description: |
  build a context-provider layer on top of the existing recursive template
  engine [ web.process_template_recursive, already complete and supporting
  nested <[outer:<[inner]>]> syntax ]. the goal is to make system messages
  and chat context dynamically assembled from registered provider commands
  rather than hardcoded strings or naive chat-history compaction.

  the template engine is the core primitive. what is missing is:
    1. a way to invoke it outside the httpd/web-serving path [ models layer ]
    2. context-provider commands that return ai-relevant content
    3. token budget awareness so providers self-limit to fit the context window
    4. a format for registering system message templates per model / use case

  nesting already works [ max depth 8 ]. no new parsing infrastructure needed.

rationale: |
  static system messages become stale and waste tokens on irrelevant context.
  simple history compaction loses semantic structure [ a module list compresses
  differently than code, which compresses differently than error output ].
  templates let each context component own its own representation strategy
  and self-limit to its token budget independently, producing a structured
  and always-relevant system message assembled fresh per request.

dependencies:
  - web.process_template_recursive  ## already complete ✅
  - models.chat / models.backend.*  ## already complete ✅
  - kimi zenka / coding zenka       ## already complete ✅

---

components:

  ## phase 1: decouple template engine from web/httpd path

  - id: template.render
    title: generic template renderer accessible from any zenka
    status: ✅ COMPLETE (2026-03-03)
    description: |
      created web.cmd.render-template module that wraps web.process_template_recursive
      and provides a clean interface for models.* and other zenki to render templates
      via route-send to web zenka.
    implementation: |
      src/web.cmd.render-template
        - accepts template_path or inline content
        - accepts meta vars hash
        - accepts budget parameter (token budget)
        - returns structured result with status, content, elapsed_ms
        - uses web.process_template_recursive for actual rendering
    usage: |
      my $result = <[protocol-7.route-send]>->(
          {   command   => qw| cube.web.render-template |,
              call_args => { template_path => '...', budget => 4000 },
              reply     => { handler => qw| models.handler.xxx |, ... }
          }
      );

  ## phase 2: context provider commands

  - id: context.providers
    title: context provider modules callable from templates
    status: ✅ COMPLETE (initial providers, 2026-03-03)
    description: |
      template commands [ <[context.X:arg]> ] that return ai-relevant content.
      each provider receives a token budget and self-truncates to fit.
      providers are regular protocol-7 modules, so any zenka can register one.
    token_budget_convention: |
      call args include 'budget=N' where N is approximate token count.
      provider converts to character estimate [ ~4 chars/token ], truncates
      or selects content to fit, returns condensed string.
      template composer allocates budget across providers from total window.
    initial_providers:
      - id: context.git.recent_changes
        status: ✅ COMPLETE
        file: src/context.git.recent_changes
        returns: |
          recent git diff summary or changed file list, truncated to budget.
          useful for: code review, continuation tasks, kimi context injection.
        args: [ budget, max_files, since_commit ]

      - id: context.task.active
        status: ✅ COMPLETE
        file: src/context.task.active
        returns: |
          current active task description from yaml/task system, if any.
          useful for: orienting the model to what is being worked on.

      - id: context.modules.list
        status: ✅ COMPLETE
        file: src/context.modules.list
        returns: |
          list of modules in a given namespace, truncated to budget.
          args: [ namespace, budget ]
          useful for: "what modules exist in coding.*?"

      - id: context.file
        status: ✅ COMPLETE
        file: src/context.file
        returns: |
          content of a specific file, truncated to budget.
          args: [ path, budget, from_line, to_line ]
          enables: kimi reviewing a specific module without git-diff injection

      - id: context.history.recent
        status: ⏳ PENDING (phase 4)
        returns: |
          recent N exchanges from chat history, newest-first, budget-limited.
          naive inclusion, no relevance scoring [ phase 1 ].
          args: [ budget, max_turns ]

      - id: context.history.relevant
        status: ⏳ PENDING (phase 2)
        returns: |
          history entries scored for relevance to current query [ phase 2 ].
          requires embedding or keyword overlap scoring.
          args: [ budget, topic, max_turns ]
        note: deferred, needs scoring primitive

  ## phase 3: system message templates

  - id: system-message-templates
    title: per-model / per-use-case system message template files
    status: ✅ COMPLETE (initial templates, 2026-03-03)
    description: |
      system messages are .tmpl files rendered fresh per request.
      stored in cfg/models/system-messages/.
      each model backend specifies its default template; callers can override.
    files_created:
      - cfg/models/system-messages/coding-assistant.tmpl
      - cfg/models/system-messages/default.tmpl
    templates:
      - coding-assistant.tmpl: |
          ## protocol-7 coding assistant ##
          you are a protocol-7 module writer. work in the existing code style.
          ## style guidelines ##
          - all comments lowercase
          - use <[...]> not <(...) > for template commands
          ## active task ##
          <[context.task.active]>
          ## recent changes ##
          <[context.git.recent_changes:budget=1500]>
          ## relevant modules ##
          <[context.modules.list:namespace=coding:budget=800]>
    next_steps:
      - create code-review.tmpl
      - integrate into models.backend.*
    rendering: |
      models.backend.* calls web.cmd.render-template with:
        - template path or inline string
        - meta vars: { model => 'kimi', task_id => '...', ... }
        - total budget: context_window - estimated_reply_tokens
      web zenka renders, providers self-limit, result is the system message.

  ## phase 4: chat context assembly

  - id: chat-context-assembly
    title: dynamic chat history assembly replacing static concatenation
    status: ✅ IN PROGRESS (integration started, 2026-03-03)
    description: |
      integrated dynamic system message rendering into models.backend.kimi_web.
      models.chat.messages_to_prompt remains unchanged (clean separation).
      system message is rendered and prepended before messages_to_prompt call.
    implementation: |
      src/models.backend.kimi_web:
        - calls web.cmd.render-template to render system message
        - defaults to coding-assistant.tmpl
        - accepts system_template parameter to override
        - prepends system message to messages array
        - falls back to minimal message on render failure
    budget_allocation: |
      total_budget = context_window - max_reply_tokens
      system_msg_budget  = total_budget * 0.25  ## 25%
      history_budget     = total_budget * 0.50  ## 50%
      current_msg_budget = total_budget * 0.25  ## 25%
    history_strategy: |
      phase 1: newest-first inclusion until history_budget exhausted
      phase 2: relevance-scored selection within budget
    files_modified:
      - src/models.backend.kimi_web         ## ✅ integrated system message rendering
      - src/models.backend.coding.invoke    ## ✅ integrated system message rendering
    files_pending:
      - src/models.chat.messages_to_prompt  ## add budget-aware assembly
    status: ✅ COMPLETE (basic integration, 2026-03-04)

---

implementation_order: |
  1. web.cmd.render-template           [ small, unlocks everything else ]
  2. context.git.recent_changes        [ highest value, kimi already sees diff ]
  3. context.task.active               [ trivial, reads yaml/task state ]
  4. context.file                      [ enables targeted file review ]
  5. system-message-templates          [ coding-assistant.tmpl as first test ]
  6. context.history.recent            [ naive budget-limited history ]
  7. budget allocation in messages_to_prompt
  8. context.modules.list              [ lower priority ]
  9. context.history.relevant          [ phase 2, needs scoring ]

first_useful_test: |
  render coding-assistant.tmpl as system message for a kimi ask-reply call.
  template includes recent git diff + active task. verify kimi responds with
  context-aware output [ references actual changed files, current task ].
  this tests: template rendering via web zenka, context providers,
  system message injection into kimi backend, end-to-end flow.

notes: |
  the recursive template engine [ web.process_template_recursive ] is already
  complete and handles nesting. no new parsing work needed.
  context providers are just regular protocol-7 modules — any zenka can
  register one by creating a module in the context.* namespace.
  the token budget convention [ budget=N in call args ] is voluntary in phase 1;
  providers that ignore it just return full content. add enforcement later.
  this design also works for the doc-sweep use case [ local models ]:
  use context.file to feed files one at a time with budget limiting.

