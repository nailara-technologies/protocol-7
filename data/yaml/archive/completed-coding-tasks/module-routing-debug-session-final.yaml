  status: "IDENTIFIED - Syntax issue with dynamic module calls"

current_problem:
  symptom: "Models receive commands but fail with 'expected mode and data reply keys'"
  root_cause_identified: "Dynamic module invocation <[$module]> doesn't work with scalar variables"
  error_pattern: "<<< expected 'mode' and 'data' reply keys >>> [base.handler.command:755]"

what_was_done_this_session:
  - Reorganized modules from flat namespace to .cmd. namespace
  - Created models.cmd.substitute_template, models.cmd.conversation_create, etc.
  - Added command routing in models.init_code for substitute_template and conversation_*
  - Implemented response format wrapping (mode/data envelope)
  - Access control permissions added across models/coding/cube
  - Test files updated to use dot notation (p7 models.substitute_template)

current_code_location:
  file: "/data/projects/protocol-7/modules/models.init_code"
  problem_lines: "221-225"
  current_code: |
    my $module = 'models.cmd.' . $cmd;
    unshift @ARG, $cmd, @args;
    my $module_result = <[$module]>;
    $result = {
        'mode' => 'json',
        'data' => JSON::PP::encode_json($module_result)
    };
  issue: "Line 221: <[$module]> doesn't work with scalar - syntax is literal only"

solution_options:

  option_1_fixed_if_statement:
    description: "Replace regex match with explicit if/elsif for each conversation subcommand"
    implementation: |
      } elsif ( $cmd eq 'conversation_create' ) {
          unshift @ARG, $cmd, @args;
          my $module_result = <[models.cmd.conversation_create]>;
          $result = { 'mode' => 'json', 'data' => JSON::PP::encode_json($module_result) };
      } elsif ( $cmd eq 'conversation_add_turn' ) {
          unshift @ARG, $cmd, @args;
          my $module_result = <[models.cmd.conversation_add_turn]>;
          $result = { 'mode' => 'json', 'data' => JSON::PP::encode_json($module_result) };
      } elsif ( $cmd eq 'conversation_get_context' ) {
          unshift @ARG, $cmd, @args;
          my $module_result = <[models.cmd.conversation_get_context]>;
          $result = { 'mode' => 'json', 'data' => JSON::PP::encode_json($module_result) };
    effort: "5 min - verbose but reliable"
    note: "Matches existing pattern for get_model_path, maintenance, etc."

  option_2_eval_based:
    description: "Use eval to dynamically construct module call"
    risk: "eval is dangerous and slow, requires careful escaping"
    effort: "10 min - complex, risky"

  option_3_generic_dispatcher:
    description: "Create a generic models.cmd.dispatch module that routes to submodules"
    effort: "15 min - elegant but adds layer"

recommended_approach: "Option 1 (fixed if/elsif) - matches existing pattern, safest, fastest"

