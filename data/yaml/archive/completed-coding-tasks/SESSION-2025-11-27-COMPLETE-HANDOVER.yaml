**protocol-7 Repository**
- Analyzed actual module dependencies using `./bin/ncode s src perlmod.autoload`
- Discovered old protocol7_full profile had 189 dependencies (excessive)
- Created new `zenka-common` profile (38 modules) with modules actually used by active zenka
- Restructured dependency profiles hierarchically:
  - minimal (9 deps) → runtime (18) → network (5) → cryptography (8) → zenka-common (38) → development (~58 total)
