### Key Technical Achievement

Used ground-truth dependency analysis instead of documentation guessing:
```bash
./bin/ncode s src perlmod.autoload | grep -E "->\\(" | sort -u
```

This identified exactly which modules each zenka actually loads at runtime, enabling precise
profile composition that's both sufficient and minimal.

