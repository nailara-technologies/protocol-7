## Key Insights & Learning Points

### 1. Ground-Truth Over Documentation
Using actual module introspection (`./bin/ncode s src perlmod.autoload`) proved far superior
to guessing dependencies from documentation. This method gives concrete evidence of what's
actually needed vs. what might theoretically be useful.

**Lesson**: When in doubt about dependencies, measure reality directly.

### 2. Hierarchical Profile Composition
Breaking dependencies into logical groups (framework, cryptography, HTTP, system utilities)
and composing profiles by including these groups creates:
- Clear intent for each profile
- Easy updates (change one group, propagates to all dependent profiles)
- User choice based on actual use case

### 3. Commit History is Documentation
The most reliable truth about project state isn't in summaries or comments - it's in recent
commits. "Phase 1 is complete" is only verified by actually checking git log, not by assuming
documentation is current.

**Lesson**: Always check recent commits when planning next work.

### 4. Knowledge Repository as Intuition Seed
300 files of accumulated insights, properly organized and accessible, serves as foundation
for new models to understand the project's "thinking space." This beats even expert documentation
because it shows the full evolution and exploration that led to current design.

### 5. Relaxed Development Emerges Naturally
When development serves immediate time-saving needs and each layer naturally enables the next
logical step, the pace becomes sustainable. No need to rush toward predetermined endpoints;
the path becomes obvious when viewed from reality rather than top-down design.

