# Task: Consolidate models discovery commands
# Created: 2026-03-31
# Priority: medium

overview:
  The models zenka currently has 3 commands that do overlapping discovery/registry
  operations. This creates confusion, code duplication, and inconsistent interfaces.

current_commands:
  - name: models.cmd.discover
    purpose: List models from registry
    flags: [":all:", ":available:", ":unavailable:"]
  
  - name: models.cmd.discover_files
    purpose: Discover .gguf from filesystem, populate registry
    flags: []
  
  - name: models.cmd.clear-registry
    purpose: Clear registry, optionally re-scan
    flags: [":re-scan:"]

problems:
  - Redundancy: discover_files and clear-registry :re-scan: do similar scanning
  - Inconsistent interface: Different flag conventions across commands
  - Unclear purpose: Users don't know which command to use when
  - Code duplication: Scanning logic exists in multiple places

proposed_solution:
  Merge into a single models.discover command with unified flags:
  
  models.discover                    # List from registry
  models.discover :re-scan:          # Re-scan filesystem, update registry
  models.discover :clear:            # Clear registry without scan
  models.discover :clear: :re-scan:  # Clear then re-scan
  
  # Filter flags (work with all modes)
  models.discover :available:        # Only show available (file exists)
  models.discover :unavailable:      # Only show unavailable (file missing)

affected_zenki:
  - coding.*          # model discovery at startup
  - lm-vision.*       # vision model loading
  - image-quality.*   # vision model config
  # TODO: audit all zenki that call these commands

implementation_steps:
  - step: 1
    task: Audit usage
    details: Find all callers of the 3 commands across all zenki
  
  - step: 2
    task: Design unified interface
    details: Finalize flag semantics and backward compatibility plan
  
  - step: 3
    task: Create models.discover (unified)
    details: New consolidated command with all functionality
  
  - step: 4
    task: Update callers
    details: Migrate each zenka to new interface
  
  - step: 5
    task: Deprecate old commands
    details: Mark as deprecated, keep as wrappers with warnings
  
  - step: 6
    task: Remove old commands
    details: After transition period, remove deprecated commands

files_to_modify:
  - src/models.cmd.discover
  - src/models.cmd.discover_files
  - src/models.cmd.clear-registry
  # Plus any zenka modules that call the above

acceptance_criteria:
  - Single models.discover command handles all use cases
  - All existing functionality preserved via flags
  - No breaking changes to external zenki (deprecation period)
  - Documentation updated
  - Old commands marked deprecated with migration notice

related_work:
  - Recent fix: models.gguf.file.extract_name (parent directory name extraction)
  - Recent fix: models.gguf.file.is_garbage_name (garbage name detection)

## resolution — 2026-09-05

Implemented directly (not dispatched). Step 1 (audit usage) done first,
repo-wide grep for all three command names across src/cfg/bin/data:

- `models.cmd.discover` : ONLY real caller is `coding` (`coding.handler.
  fetch_model_discovery` + `coding.init_code`'s on-demand routing target
  `cube.models.discover`), calling with the bare-word contract
  `call_args => { args => 'available' }` -- NOT the `:available:`
  colon-form the proposed_solution describes. `lm-vision`, `vision-batch`,
  and `v7-zenki` all have `models.discover` ACCESS GRANTED in
  `cfg/zenki/cube/access.zenki` but zero actual call sites found in any
  of their source -- likely legacy/unused grants, left untouched (out of
  scope, access grants aren't hurting anything unused).
- `models.cmd.discover_files` / `models.cmd.clear-registry` : ZERO
  callers found anywhere in src/cfg (console/human-operator use only,
  presumably). The `affected_zenki` list above (`lm-vision.*`,
  `image-quality.*`) was stale/wrong -- `image-quality` has no relation
  to this at all (confused with `vision-batch`, which calls
  `image-quality.analyze` for something unrelated), and neither
  `lm-vision` nor `vision-batch` actually call any of the 3 commands
  despite having access.

Given zero real callers for the two redundant commands, **removed them
outright rather than deprecating** (user's direct call, given callsites
would be trivial to update -- there were none): deleted
`src/models.cmd.discover_files` and `src/models.cmd.clear-registry`,
dropped their tokens from `cfg/zenki/models/zenka.v7`'s
`access.cmd.usr.cube` grant and from `src/base.list.subroutines`,
regenerated `cfg/zenki/models/subroutines.load-early` via
`bin/dev/gen-sub-whitelist models` (scoped to just this zenka --
running it with no target arg triggers a full-repo regen, caught and
reverted the resulting unrelated churn in 4 other zenki's whitelists
before it finished).

`src/models.cmd.discover` rewritten as the unified command per
`proposed_solution` above (`:clear:`, `:re-scan:`, `:available:`/
`:unavailable:`), with the bare-word filter contract kept as a
backward-compatible synonym (`coding`'s exact call still works
unchanged) and the LIST-mode reply text format kept byte-identical
(`coding.handler.models_discover_reply` parses it by regex). New shared
helper `src/models.discover.scan_all_paths` factors out the
search-path-resolution + scan loop that was duplicated verbatim between
the two old commands (`problems` section above, now actually fixed
rather than just described).

Verified via `bin/dev/ptd -c` on every changed file; not live-tested
against the running `models` zenka (would require a restart, not done
as part of this pass).

