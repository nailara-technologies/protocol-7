---
task: nshell history navigation fixes
status: completed
priority: high
completed: 2026-03-22
commit: 8c8424687

context: |
  nshell history navigation had several bugs introduced in commit fb8515e99
  (ctrl-o cycle feature) and made worse in b2777cc0b (attempted fix).
  fixed in two sessions: first fixing arrow navigation and removing broken
  $shift calculation, then rebuilding char-add debug infrastructure and
  implementing proper Ctrl+O cycling.

completed_items:
  - fix inverted comments in arrow_up and arrow_down
  - remove broken $shift index calculation (history_add uses push, indices don't shift)
  - fix ctrl_o_cycle: proper duplicate-skipping search, execute + advance to next older
  - fix output colors after ctrl_o execution (restore p7_fg_0004 after \e[0m)
  - fix state reset: current_mode explicitly reset in ctrl_o_cycle (bypasses read_from_buffer cleanup)
  - consistent -1 sentinel for ctrl_o_start_position (not undef)
  - fix char-add debug infrastructure: restore event.once, add cube command routing
  - add diagnostic logging in char-add (PRE_PROCESS, POST_ONCE_1, POST_LOOP)
  - guard undef editor fields in editor.process newline handler
  - increase nshell-state-track buffer from 12K to 24K
  - new module nshell.handler.ctrl_o_render_preload: timer-based deferred display
  - 150ms timer ensures command reply prints before preloaded entry appears

remaining:
  - history dump debug command (nice to have, not blocking)
  - step-by-step debug mode (covered by existing char-add diagnostics)
  - off-by-one bug with failed commands in history (not reproducible, monitor)

