task_id: radio-log-buffers
title: radio zenka — stream-status and jingle-detection log buffers
priority: normal
estimated_rounds: 12

signatures_note: |
  Module files end with a 4-line AMOS7 signature footer starting with #,,,
  IGNORE these lines completely — they are auto-generated by the signing system
  and must not be modified or investigated. Focus only on the code above them.
  New files must NOT include any signature stub — leave them clean.

context: |
  Add two circular log buffers to the radio zenka for observability:
    radio.stream-log   — connection/reconnect/listener events
    radio.jingle-log   — every title change with verdict and gap_fill decision

  buffer pattern (from discover.init_code — follow this exactly):

    if ( not exists <buffer.host-status> ) {
        <buffer.host-status.max_size> = 24 * 1024;
        my $log_level  = 0;
        my $log_msg    = 'host status buffer initialized ..,';
        my $time_stamp = <[base.anum_log_time]>->( 5, TRUE );
        <[base.buffer.add_line]>->(
            qw| host-status |,
            join( ' ', $time_stamp, $log_level, $log_msg ), $log_level
        );
    }

  to add a line to the buffer:
    my $time_stamp = <[base.anum_log_time]>->( 5, TRUE );
    <[base.buffer.add_line]>->(
        qw| radio-stream |,
        join( ' ', $time_stamp, $log_level, $msg ), $log_level
    );

  to expose a buffer as a command (SIZE reply), look at how discover exposes
  its host-status buffer — search for 'host-status' in src/discover.cmd.*
  to find the pattern, then mirror it for radio.cmd.stream-log and
  radio.cmd.jingle-log.

buffer specs:
  radio-stream:
    max_size: 16 * 1024   (16K)
    init msg: 'radio stream log initialized'
    events to log:
      - radio.connect: 'connecting to <url>' (level 2)
      - radio.connect success: 'connected :. <host>:<port>' (level 1)
      - radio.connect failure: 'connect failed :. <reason>' (level 0)
      - radio.handler.reconnect: 'reconnect scheduled :. <delay>s' (level 1)
      - radio.handler.stream-chunk on disconnect: 'stream disconnected' (level 1)
      - plugin.httpd.radio: listener added/removed with count (level 2)

  radio-jingle:
    max_size: 16 * 1024   (16K)
    init msg: 'radio jingle log initialized'
    events to log:
      - radio.handler.stream-chunk on title change:
          'title :. <new_title>' (level 2)
          'duration :. <seconds>s [ <prev_title> ]' (level 2)
          'verdict :. jingle [ pattern ]' or 'verdict :. jingle [ duration ]'
          or 'verdict :. music' (level 1)
      - radio.filter.jingle: matched pattern :. <pattern> (level 2)
      - radio.gap_fill.start: 'gap fill started :. <filename>' (level 2)
      - radio.gap_fill.tick on EOF/stop: 'gap fill ended' (level 2)

deliverables:
  new_modules:
    - radio.cmd.stream-log   (SIZE reply: buffer content)
    - radio.cmd.jingle-log   (SIZE reply: buffer content)

  modified_modules:
    - radio.init_code          (initialize both buffers)
    - radio.connect            (log connect attempt + result)
    - radio.handler.reconnect  (log reconnect schedule)
    - radio.handler.stream-chunk (log disconnect + title change + verdict)
    - radio.filter.jingle      (log matched pattern)
    - radio.gap_fill.start     (log gap fill start)
    - radio.gap_fill.tick      (log gap fill end on EOF)
    - plugin.httpd.radio.*     (log listener add/remove — find the right module)

style_notes: |
  - all comments lowercase, annotations [ word ] not ( word )
  - use <[base.logs]>->( level, 'format', args ) for normal zenka logging
  - buffer lines: join( ' ', $time_stamp, $log_level, $msg ) — no sprintf needed
  - log levels: 0=error, 1=important, 2=info, 3=debug
  - module invocation: <[module.name]>->($args) — closing ]> BEFORE ->
  - do not add any signature stub to new files

verification: |
  1. p7c 'radio.stream-log' — shows connection history
  2. p7c 'radio.jingle-log' — shows title changes with verdicts
  3. wait for a jingle — confirm verdict logged with pattern or duration reason
  4. p7c 'radio.jingle-log' after reconnect — buffer persists across reconnects

