task_id: nshell-strm-support
title: nshell zenka — STRM protocol awareness
priority: high
estimated_rounds: 25

signatures_note: |
  Module files end with a 4-line AMOS7 signature footer starting with #,,,
  IGNORE these lines completely — they are auto-generated by the signing system
  and must not be modified or investigated. Focus only on the code above them.
  New files must NOT include any signature stub — leave them clean.

context: |
  The nshell zenka is an interactive terminal shell that connects to the cube
  router and lets users run zenka commands interactively. It processes replies
  through base.handler.command which parses reply types (TRUE, FALSE, SIZE,
  CHRSIZE, STRM, ...) and dispatches to registered handlers.

  current reply flow:
    socket → base.handler.command (parses reply type + framing)
      → nshell.handler.command_reply   (TRUE, FALSE, SIZE replies)
      → nshell.hook.unknown_reply_type (anything unrecognised — prints raw)

  nshell.handler.command_reply (src/nshell.handler.command_reply):
    - receives $reply hashref with keys: cmd, call_args.args, data
    - for SIZE/multi-line replies: $reply->{'data'} contains the payload,
      printed directly with print $payload_str
    - for single-line (TRUE/FALSE): colorised and printed inline
    - after output: reprints cursor prompt via stdin_handler->now()

  the problem:
    STRM replies currently fall through to nshell.hook.unknown_reply_type
    which just prints the raw frame bytes (header lines + binary chunks) to
    the terminal, corrupting it. there is no STRM-aware handler.

  what is needed:
    a new handler nshell.handler.strm_reply that:
    1. recognises the STRM open frame (bounded: 'STRM open N', unbounded:
       'STRM open') and sets up accumulation state
    2. receives each STRM chunk frame ('STRM <size>\n<data>') and writes
       the raw data bytes directly to STDOUT (no colorisation, no encoding)
    3. on 'STRM close': cleans up state, reprints the cursor prompt

    for text streams (e.g. log tail): each chunk is printed as-is.
    for binary streams (e.g. radio.listen audio): bytes go straight to
    STDOUT so the user can pipe: p7 nshell <<< 'radio.listen' | mpv -
    nshell running non-interactively (no-tty mode) should pass binary through
    cleanly; in TTY mode a brief status line is acceptable.

  how base.handler.command delivers STRM to handlers:
    base.handler.command calls the reply handler once per logical unit.
    for STRM this means it will be called:
      - once with cmd='STRM' and the open frame info when stream starts
      - once per chunk with the chunk data
      - once with cmd='STRM' and 'close' signal when done
    check src/base.handler.command for exact dispatch shape —
    look at how SIZE replies are dispatched as a reference since STRM
    likely follows the same pattern. the key question is whether chunks
    arrive as separate handler calls or accumulated into $reply->{'data'}.

  existing hooks to wire:
    nshell.register_hooks (src/nshell.register_hooks) registers all
    reply handlers. add STRM registration there mirroring the SIZE pattern.

  key existing modules:
    src/nshell.handler.command_reply  — main reply handler (reference)
    src/nshell.register_hooks         — hook registration
    src/nshell.hook.unknown_reply_type — current STRM fallthrough
    src/nshell.init_code              — zenka init
    src/base.handler.command          — upstream parser (read-only ref)

investigation_first: |
  Before writing any code, read:
  1. src/nshell.register_hooks — understand how handlers are registered
  2. src/base.handler.command  — search for STRM dispatch: how does it
     call the reply handler for STRM chunks? does it accumulate or stream?
  3. src/nshell.handler.command_reply — understand $reply structure for
     SIZE replies (closest analogue to STRM)
  then design the handler based on what you find.

deliverables:
  new_modules:
    - nshell.handler.strm_reply
      registers for STRM reply type; handles open/chunk/close lifecycle;
      writes raw bytes to STDOUT; reprints prompt on close

  modified_modules:
    - nshell.register_hooks
      register nshell.handler.strm_reply for STRM reply type

style_notes: |
  - all comments lowercase
  - annotations use [ word ] not ( word )
  - log format: '[nshell] description :. value'
  - use <[base.logs]>->( level, 'format', args ) for logging
  - log levels: 0=error, 1=important, 2=info, 3=debug
  - module invocation: <[module.name]>->($args) — closing ]> BEFORE ->
  - do not add any signature stub to new files

verification: |
  after implementing:
  1. start nshell zenka, connect interactively
  2. run: base.stream-file /etc/hostname
     → file content appears cleanly, no frame headers visible
  3. run: radio.listen
     → binary audio bytes flow to stdout (pipe to mpv to confirm audio)
  4. run: list users
     → normal SIZE reply still works correctly (regression check)
  5. run: weather.desc
     → normal TRUE reply still works (regression check)

