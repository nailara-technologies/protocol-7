---
task: extract llm.* inline subroutines into separate modules
status: completed
priority: low
created: 2026-03-22
completed: 2026-03-22
source: code review observation during ssl handshake review
completed_by: kimi task AKXEYFQ
commit: 526d91760

context: |
  several llm.service.* modules define internal subroutines via `sub _name { }`
  inline. while this pattern works in P7, extracting them into dedicated module
  files improves discoverability, testability, and consistency with the module
  naming convention where filename = callable subroutine.

affected_modules:
  - llm.service.subprocess_wrapper (3 inline subs)
  - llm.service.consensus_vote (3 inline subs)

inline_subroutines:
  subprocess_wrapper:
    - _extract_completion: parse completion text from inference server response
    - _estimate_tokens: rough token count estimation for a text string
    - _estimate_confidence: confidence score heuristic for completion quality
  consensus_vote:
    - _encode_harmonic_certainty: encode certainty level using harmonic mathematics
    - _interpret_certainty_level: decode harmonic certainty back to human-readable
    - _generate_mock_response: produce synthetic response for testing / fallback

approach: |
  for each inline sub:
  1. create new module file: src/llm.service.<parent>.<sub_name_without_underscore>
     e.g. llm.service.subprocess_wrapper.extract_completion
  2. move function body into new module [ standard module header format ]
  3. replace inline `sub _name { }` with call to new module via $code{} or <[]> syntax
  4. add new modules to relevant zenka whitelists [ coding, models ]
  5. run update-signatures on new files

notes: |
  - some inline subs may reference lexical variables from the parent module scope
    via closure — these need to be converted to explicit parameters
  - the `sub _name` pattern IS valid in P7 [ confirmed in letsencr, weather,
    plugin.web, download modules ] — this is a style improvement, not a bug fix
  - lower priority than functional work; good candidate for kimi task dispatch

