## TECHNICAL DETAILS

### Signature Process Flow

**Signing (source.cmd.get-code-signed):**
```
1. Read file                           (line 29)
2. Extract footer in 'repair' mode     (line 47)
3. Check policy for normalization      (line 78-80)
4. Get extracted content with state    (extract_sig_body restores endlines)
5. Apply normalization if needed       (lines 167-177)
6. Calculate AMOS/BMW checksums        (in create_harmonic_footer)
7. Generate signature                  (in create_harmonic_footer)
8. Write file with new signature       (line 260)
```

**Verification (sourcecode.console.verify-p7-signatures):**
```
1. Read file                           (line 100)
2. Extract footer in 'strict' mode     (line 101)
3. Check policy for normalization      (line 140)
4. Get extracted content with state    (extract_sig_body restores endlines)
5. Apply normalization if needed       (lines 141-147)
6. Verify AMOS/BMW checksums           (in source.signature_valid)
7. Verify C25519 signature             (in source.signature_valid)
```

**The mismatch likely occurs at step 2 or 4.**

### Endline State Encoding
```
State 0-4: Removed N newlines during signing
State 5:   No change (canonical - 1 trailing newline)
State 6:   Added 2 newlines (file had 0 newlines originally)
State 7:   Added 2 newlines (incomplete line + separator)
```

### Restore Logic (source.restore_payload_endline_state)
```perl
# State 5: No change
return 0 if $endline_state_oct == 5;

# State < 5: Add newlines back
if ( $endline_state_oct < 5 ) {
    my $endline_count = abs( $endline_state_oct - 4 );
    $payload_sref->$* .= "\n" x $endline_count;
}

# State 6/7: Remove 2 newlines
if ( $endline_state_oct == 6 or $endline_state_oct == 7 ) {
    $endline_count = 2;
}
$payload_sref->$* =~ s|(\n){$endline_count}$||s;
```

### Normalize Logic (source.normalize_endlines)
```perl
# Simply: ensure exactly 1 trailing newline
$src_ref =~ s|\n*$|\n|s;
```

