## THE PROBLEM

### Symptom
```bash
./bin/Protocol-7 sourcecode update-signatures read-me/author
# Completes successfully

./bin/Protocol-7 sourcecode verify-p7-signatures read-me/author
# FAILS: bmw-chksum-matches: false, AMOS-chksum-matches: false
```

### Oscillation Bug Discovery
User observed that re-signing **swallows the separator endline**, creating an oscillation:

**Expected format:**
```
<[p7-src@protocol-7.network]>
                                    <-- blank separator line
#,,..,,..,,,,,..,,...,.,.,,..,,,.,.
```

**Actual format after re-signing:**
```
<[p7-src@protocol-7.network]>
#,,..,,..,,,,,..,,...,.,.,,..,,,.,.  <-- NO blank separator line!
```

This explains why manually re-signing doesn't fix the problem:
1. Sign: loses separator endline
2. Verify: detects missing separator
3. Re-sign: loses separator endline again
4. Repeat infinitely...

**The separator newline added at line 172 of source.cmd.get-code-signed is being lost somewhere!**

### Root Cause Hypothesis
There is a MISMATCH in content processing between signing and verification:

**During Signing:**
- Uses `extract_sig_body(..., 'strip', 'repair')` (line 47 in source.cmd.get-code-signed)
- Applies `source.normalize_endlines` (line 167)
- Adds separator newline (line 172)
- Sets state to 7 (line 176)
- Calculates checksums on THIS content

**During Verification:**
- Uses `extract_sig_body(..., 'strip', 'strict')` (line 101 in verify-p7-signatures)
- Applies `source.normalize_endlines` (line 141)
- Adds separator newline (line 143)
- Sets state to 7 (line 144)
- Calculates checksums on THIS content

**The difference in extraction mode ('repair' vs 'strict') might cause different
content restoration, leading to different checksums!**

