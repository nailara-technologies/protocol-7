title: |
  Signature oscillation Variant A — state encoding fix for 0-newline and empty bodies

resolution_summary: |
  Variant A resolved by correcting the endline state encoding in
  source.create_harmonic_footer and fixing the restore semantics in
  source.restore_payload_endline_state. 109 files resigned to correct state.

  Variant B (double-footer on never-signed files) remains open.
  See: data/yaml/coding-tasks/signature-oscillation-variant-b.yaml (if created)
  or the preserved fixtures at: data/asc/test-fixtures/signature-oscillation-2026-03-15/

root_cause: |
  source.create_harmonic_footer was assigning state=4 for files with 0 trailing
  newlines (non-empty bodies). Correct state is 7 (delta=+2, two newlines added:
  one content + one separator). Empty files (content_size==0) were also getting
  state=7; correct is state=6 (delta=+1, only the separator \n is added).

  source.restore_payload_endline_state was using "strip all trailing \n, then add N"
  semantics. Correct is "remove exactly N trailing \n" (s/\n{N}$//s). The old logic
  corrupted bodies that had > N trailing newlines before signing.

fix_applied:
  source.create_harmonic_footer:
    - capture $content_size and $orig_nl_count BEFORE body modification
    - state assignment block:
        content_size==0  → state=6  (empty file: separator \n added, remove 1)
        orig_nl_count==0 → state=7  (no trailing \n: 2 added, remove 2)
        orig_nl_count==1 → state=6  (1 trailing \n: 1 added, remove 1)
        else             → state=5  (canonical ≥2 trailing \n: no modification)

  source.restore_payload_endline_state:
    - delta = state - 5
    - if delta > 0: s/\n{delta}$//s   (remove exactly N)
    - if delta < 0: payload .= "\n" x abs(delta)  (add back N)
    - states < 5 confirmed correct by code inspection (add-only harmonize never generates them)

test_files_created:
  - src/test.0   (0 trailing \n → expected state=7)
  - src/test.1   (1 trailing \n → expected state=6)
  - src/test.2   (2 trailing \n → expected state=5)
  - src/test.3   (3 trailing \n → expected state=5, harmonize no-op)
  - src/test.empty  (0 bytes → expected state=6)

verification_task: data/yaml/coding-tasks/signature-endline-state-verification.yaml

new_tooling:
  - src/sourcecode.console.report-endline-state
