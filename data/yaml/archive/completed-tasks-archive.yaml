key_architectural_patterns:
  protocol_7_parser_syntax:
    title: "Protocol-7 Code Syntax Patterns"
    description: "Critical patterns required for code to work with Protocol-7's parser"
    patterns:
      - name: "Subroutine Calls"
        pattern: "<[sub_name]->()"
        converts_to: "$code{'sub_name'}->()"
        example: "<[source.extract_sig_body]>->()"

      - name: "Variable References (Basic)"
        pattern: "<base.sub-key.deeper.levels>"
        converts_to: "$data{'base'}{'sub-key'}{'deeper'}{'levels'}"
        supports: "Arbitrary depth hash access"
        example: "<source.cmd.get-code-signed>"

      - name: "Variable References (with Dereferencing)"
        pattern: "<hash_ref>->%"
        converts_to: "Hash dereferencing following Perl reference syntax"
        example: "foreach my $type (<[base.sort]>->($report_ref))"

      - name: "Quoted Keys (Keys with Dots)"
        pattern: "<base.'key.with.dots'>"
        converts_to: "$data{'base'}{'key.with.dots'}"
        purpose: "Handle keys containing dots"
        example: "<base.'key.with.dots'>"

    dependency_modules:
      - "base.resolve_key: Resolves hash keys at arbitrary depths"
      - "base.resolve_hash: Translates system.zenka.name type keys to references"
      - "base.parser.data_hkey_tree: Parses data hash key strings into trees"
      - "base.validate.data_key_syntax: Validates data key syntax with quoting"
      - "base.resolve_data_key.regex: Regex-based key resolution"

  signature_system_architecture:
    title: "Endline Normalization System"
    description: "Simplified endline handling with deterministic behavior"

    core_principles:
      - "Normalize all files to canonical format: content\n#signature (exactly 1 separator endline)"
      - "Delta encoding records what transformation was applied for reversibility"
      - "Deterministic: same input always produces same output (no oscillation)"
      - "Self-healing: files converge to canonical format through normalization"

    active_states:
      state_1: "Normalize excess endlines (2+ → 1)"
      state_5: "No change (already had exactly 1)"
      state_6: "Add separator (0 → 1)"

    reserved_states: "0, 2, 3, 4, 7 available for future enhancements"

    implementation_location: "src/source.cmd.get-code-signed:161-195"

    key_benefits:
      - "Cleaner: only 3 active states vs complex 8-state recovery system"
      - "Deterministic: eliminates oscillation on repeated operations"
      - "Reversible: delta encoding preserves transformation information"
      - "Self-healing: files normalize on re-signing"

    related_modules:
      - "src/source.cmd.get-code-signed: Core normalization logic"
      - "src/source.create_harmonic_footer: Encodes delta in signature"
      - "src/source.extract_sig_body: Detects current endline state"
      - "src/amos7.encode_octal_header: Stores state in AMOS7 header position 11"

  verification_and_validation:
    title: "Signature Verification Strategy"
    description: "How signatures are validated without modifying files"

    verification_levels:
      - "Header validation: Ensures header structure is valid"
      - "Payload checksum validation: AMOS payload checksum matches"
      - "BMW checksum validation: Footer BMW checksum matches"
      - "Cryptographic validation: C25519 signatures are valid"
      - "Format validation: File is in canonical format (exactly 1 separator)"

    canonical_format_requirement: "Exactly one newline between content and signature footer"

    self_healing_process:
      - "Detect files not in canonical format"
      - "Mark as invalid during verification"
      - "Run bin/Protocol-7 sourcecode update-signatures"
      - "Normalization process converts to canonical format"
      - "Re-verification passes"

common_issues_and_solutions:
  issue_missing_separator_endline:
    symptom: "Signature footer appended directly to last content line without separator"
    root_cause: "extract_sig_body treating missing endlines as fatal error"
    solution: "Flag endline issues for repair instead of failing immediately"
    affected_code: "src/source.extract_sig_body, src/source.cmd.get-code-signed"

  issue_oscillation_on_resigning:
    symptom: "Signatures invalidate after content changes and re-signing"
    root_cause: "Stale endline-state values not matching current file format"
    solution: "Detect current endline state and normalize to exactly 1 before signing"
    affected_code: "src/source.cmd.get-code-signed:161-195"

  issue_verification_requires_key_access:
    symptom: "Cannot verify signatures in restricted environments (CI/CD)"
    root_cause: "Old system required full signing key access"
    solution: "Implement separate verify module that only needs public key"
    affected_code: "src/sourcecode.console.verify-p7-signatures"

testing_strategies_learned:
  comprehensive_test_coverage:
    - "Test with files of different types (code, markdown, yaml)"
    - "Test with different line ending styles (LF, CRLF)"
    - "Test with existing vs missing signatures"
    - "Test with different endline state encodings (0-7)"
    - "Test edge cases: empty files, whitespace-only content"
    - "Automate regression detection with validation scripts"

  verification_checklist:
    - "Files have proper separator endlines (exactly 1)"
    - "Endline state encoding/decoding works correctly"
    - "Signatures remain valid after endline modifications"
    - "No unintended side-effects on content"
    - "Format validation catches malformed signatures"

