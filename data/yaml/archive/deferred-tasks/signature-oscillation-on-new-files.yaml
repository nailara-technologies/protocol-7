title: "Signature system oscillation when file has no prior signature [RESOLVED]"

description: |
  Signature oscillation issue has been successfully resolved. Files no longer require
  multiple signing passes to stabilize. The system now produces deterministic signatures
  on the first pass, with automatic repair of files missing separator endlines.

symptoms_resolved:
  - ✓ Files sign correctly on first pass
  - ✓ No signature verification mismatches
  - ✓ No oscillation between states
  - ✓ Automatic repair of missing separator endlines
  - ✓ Single signing pass required (no double-signing workaround needed)

impact_resolved:
  - ✓ Cleaner workflow - no need to watch for oscillation trap
  - ✓ Files with missing separator endlines auto-repaired during signing
  - ✓ Update-sub-list and other bulk operations now stable
  - ✓ No extra passes required when adding new src/files

affected_files:
  - cfg/protocol-7.src-ver (observed during Session 2C)
  - Any newly created module files getting signatures for first time

root_causes_and_fixes:
  - issue_1_FIXED: |
      CRITICAL: needs_separator_endline flag never cleared (source.cmd.get-code-signed:138)
      STATUS: ✓ FIXED

      Root cause: Flag set during extraction but never reset after separator added during signing.
      This caused verification to always trigger re-sign on every cycle.

      Location: src/source.cmd.get-code-signed line 161-163
      Fix applied: Clear flag immediately after separator endline is successfully added
      Result: Flag no longer causes re-signing oscillation

  - issue_2_FIXED: |
      CRITICAL: Inverted endline restoration logic (source.extract_sig_body:640-654)
      STATUS: ✓ FIXED

      Root cause: Restoration condition was handling separator logic backwards.
      This caused content endlines to be modified in opposite directions.

      Location: src/source.extract_sig_body lines 640-654
      Fix applied: Correct condition: if separator_absent { skip } else { restore }
      Result: Restoration now correctly reverses harmonization based on state

  - issue_3_FIXED: |
      CRITICAL: State-dependent endline harmonization (source.harmonize_payload_line_feed:35-71)
      STATUS: ✓ FIXED

      Root cause: Function used $mod_offset (state parameter) making it state-dependent.
      This prevented convergence and caused oscillation between different states.

      Location: src/source.harmonize_payload_line_feed lines 35-71
      Fix applied:
        - Remove $mod_offset dependency entirely
        - Normalize to canonical form: exactly 2 newlines (blank line separator)
        - Force state=5 for canonical files
      Result: Deterministic harmonization - identical input always produces identical output

  - issue_4_STATUS: |
      HIGH: State encoding vs actual modification mismatch (source.create_harmonic_footer:224-248)
      STATUS: ✓ ALREADY IMPLEMENTED

      This was already correctly implemented with recalculation of state after harmonization.
      No additional fixes needed.

  - issue_5_FIXED: |
      CRITICAL: Restoration logic asymmetry (source.restore_payload_endline_state:27-50)
      STATUS: ✓ FIXED

      Root cause: Restoration tried to enforce canonical 1-newline format regardless of state.
      This didn't match what harmonize did, causing asymmetric transformations.

      Location: src/source.restore_payload_endline_state lines 27-50
      Fix applied:
        - State 6: Remove 1 newline (reverses harmonize addition)
        - State 7: Remove 2 newlines (reverses harmonize addition)
        - State 5: No restoration (file already canonical)
      Result: Restoration now exactly reverses harmonization based on encoded state

investigation_status: "COMPLETED - Root causes identified and fixed"
fix_priority: "HIGH - COMPLETED"

implementation_summary: |
  All critical fixes have been successfully implemented and tested:

  - Fix #1: ✓ Flag clearing (source.cmd.get-code-signed:161-163)
  - Fix #2: ✓ Restoration logic (source.extract_sig_body:640-654)
  - Fix #3: ✓ Deterministic harmonization (source.harmonize_payload_line_feed:35-71)
  - Fix #4: ✓ Already implemented (source.create_harmonic_footer:224-248)
  - Fix #5: ✓ Correct restoration (source.restore_payload_endline_state:27-50)

  Key insight: The core issue was state-dependent behavior in harmonization function.
  Solution: Make harmonization deterministic by normalizing to canonical form (2 newlines)
  and forcing state=5 for canonical files, preventing oscillation.

verification: |
