  issue_3_custom_fork_dependency_chain:
    status: "ARCHITECTURAL"
    observation: |
      ik_llama.cpp is not a drop-in build but a heavily customized fork:
      - Custom headers in non-standard locations (minja/*, mtmd/*)
      - Modified core llama.cpp interfaces
      - Additional build dependencies not documented in README
      - Complex interdependencies between modules

    impact: "Standard build approach fails; needs fork-specific build environment"

