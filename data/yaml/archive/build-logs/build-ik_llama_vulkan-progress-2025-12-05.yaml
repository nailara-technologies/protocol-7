lessons_learned:
  1: "Vulkan backend is viable - shaders compile, basic compilation works"
  2: "ik_llama.cpp fork has undocumented build complexity beyond standard llama.cpp"
  3: "Fork-specific issues are not blockers for Vulkan - they're dependency/infrastructure issues"
  4: "Containerization could solve build reproducibility across different environments"
  5: "Official llama.cpp + selective ik optimizations might be faster path than fixing fork"
  6: "Parallel remote CPU server strategy removes urgency from GPU optimization"

conclusion: |
  The Vulkan backend itself is functional - shaders compile, Vulkan libraries work correctly.
  The blocker is the ik_llama.cpp fork's build infrastructure, not the GPU acceleration.

  Two viable paths forward:
  1. Containerize the fork's build environment (more complex, preserves all ik optimizations)
  2. Switch to official llama.cpp + selective ik integration (simpler, potentially sufficient)

  Either path should succeed where CUDA failed, as Vulkan avoids the stdlib incompatibility.
  Recommend containerized approach first (documents fork requirements), then pivot if needed.

