      - "examples/server/server.cpp"
    root_cause: "ik_llama.cpp has custom dependencies not in standard llama.cpp"
    impact: "Cannot link binaries without all transitive dependencies available"

  issue_2_linker_errors:
    status: "BLOCKING"
    category: "Undefined reference errors"
    types:
      - "IQK quantization functions not linked"
      - "llama_model_loader class methods undefined"
      - "LLM_KV class methods undefined"
      - "llama_file class methods undefined"
      - "common_chat_verify_template function undefined"
