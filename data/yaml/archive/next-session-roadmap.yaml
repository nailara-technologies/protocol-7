## Phase 3: Module Permission Auto-Management (Low Priority)

### Priority: LOW
### Estimated Scope: Medium (1 hour)
### Dependencies: Phases 1-2 optional

### Objective
Implement automatic permission management for module files to prevent unreadable
module issues from occurring in the first place.

### Context

Currently, module files must be manually set to 644 after creation. Administrators
sometimes forget this, leading to the unreadable source problems we just fixed.

### Implementation Options

#### Option A: Auto-fix During Module Load (Recommended)
When loading modules, if file is unreadable, automatically chmod to 644 with logging.
- Pros: Fixes issues automatically, no operator intervention needed
- Cons: May hide permission configuration errors, requires root/appropriate privileges
- Location: In p7_check_bin_p7() or early in module loading

#### Option B: Module Creation Hook
Create hook that runs when modules are added/updated:
- Watches for new/modified modules
- Sets correct permissions automatically
- Logs permission changes
- Pro: Preventative rather than reactive
- Con: Requires integration with file modification detection

#### Option C: Configuration-Driven
Add Protocol-7 configuration for module permission defaults:
- config: 'modules.default_permission = 0644'
- Checked during module discovery
- Allows customization per environment

### Current Priority Reasoning
This is LOW priority because:
1. The fix in Phase 1 properly handles unreadable modules
2. Manual chmod is acceptable in current workflow
3. Focus should be on robustness and clear error messages first
4. This is an optimization, not a critical fix

### If Implemented
Recommend Option A + C combined:
- Configuration option for desired permissions
- Auto-fix during load with warning log
- Allows operators to choose strictness level

