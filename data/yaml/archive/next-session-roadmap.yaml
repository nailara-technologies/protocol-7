## Phase 1: Broken Routine Handler Integration (Recommended Next)

### Priority: HIGH
### Estimated Scope: Medium (1-2 hour session)
### Dependencies: Current session complete

### Objective
Integrate the broken routine handler with the $compilation_success flag flow to ensure
that unreadable modules and failed compilations both trigger proper error substitution
rather than leaving undefined code.

### Context & Architecture

**Current State**:
- Line 1757: We set `$compilation_success = FALSE` when source_not_readable
- Lines 1772-1803: Broken routine handler creates fallback subroutines
- The handler has two code paths: regular modules and cmd/console commands

**What Needs Enhancement**:
The broken routine handler currently doesn't receive any context about WHY the compilation
failed. To improve diagnostics further, we should pass the failure reason to the handler.

### Detailed Implementation Steps

#### Step 1: Analyze Handler Message Flow
Read the broken routine handler implementation at lines 1776-1803 to understand:
- How it determines message type (routine vs command)
- What information is available in the handler context
- How the $reason variable is used (we added it)
- What additional context might be useful

**Key locations**:
- Line 1778: $reason variable determination
- Line 1782: lmsg construction
- Line 1796: Command error response formatting
- Line 1791: Silent exception warning

#### Step 2: Track Failure Reason Through Flow
Store additional failure context when setting compilation_success=FALSE:
- Check if source is unreadable
- Check if source is empty
- Check if eval error occurred

Option A: Store in $data{'code'}{$sub_name}{'failure_reason'}
Option B: Use $reason variable directly (we already set it)

Current approach uses Option B at line 1778 - verify this is working correctly.

#### Step 3: Test Handler Path Selection
Create test scenario:
1. Create module with chmod 600 (unreadable)
2. Verify 'undefined' message appears in logs
3. Verify broken routine can be called without crash
4. Verify error includes caller information

#### Step 4: Document Handler Behavior
In code comments, clarify:
- When handler is invoked vs when compilation succeeds
- What messages are logged for different failure types
- How developers can diagnose failures from logs

### Expected Outcome
Module loading produces clear, actionable error messages:
- Unreadable source: "called undefined routine : 'modulename'"
- Compilation failure: "called broken routine : 'modulename'"
- Caller information included in all cases

### Verification Checklist
- [ ] Unreadable modules produce "undefined" message
- [ ] Syntax error modules produce "broken" message
- [ ] Caller information is present in error logs
- [ ] No undefined reference warnings appear
- [ ] All broken routines can be called safely

