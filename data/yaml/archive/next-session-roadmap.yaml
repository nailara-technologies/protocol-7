## Phase 2: File Handle Encoding Mode Validation (Medium Priority)

### Priority: MEDIUM
### Estimated Scope: Small (30-45 min)
### Dependencies: Phase 1 optional (can run in parallel)

### Objective
Implement validation for encoding mode parameters in base.fh-encoding.set to catch
invalid encoding names early and provide clear error messages.

### Current Implementation Gap

The base.fh-encoding.set module accepts any string as encoding_mode and stores it in
the hash without validation. When base.fh-encoding.apply tries to use an invalid
encoding with binmode(), it silently fails.

### Detailed Implementation Steps

#### Step 1: Research Valid Encoding Names
Determine what encoding names Perl's binmode() accepts:
- 'UTF-8' - standard UTF-8
- 'OCTETS' - binary mode (:bytes)
- 'latin1', 'cp1252', etc. - other character sets
- 'ascii', 'utf16', etc.

Check Perl documentation for PerlIO::encoding and binmode() valid formats.

#### Step 2: Create Encoding Validation Subroutine
Add validation logic to base.fh-encoding.set that:
1. Recognizes standard known encodings (UTF-8, OCTETS, latin1, etc.)
2. Validates unknown encodings against Perl's encoding registry
3. Logs warnings for suspicious but potentially valid encodings
4. Returns FALSE with clear reason for invalid encodings

Option: Create separate module base.fh-encoding.validate if logic is reusable

#### Step 3: Implement Validation in .set Module
Modify lines handling $encoding_mode in base.fh-encoding.set:
- Before storing in %fh_encoding, validate the encoding
- Return FALSE with error message if invalid
- Log which encoding was rejected and why

```perl
# Pseudo-code pattern:
my %valid_encodings = ( 'UTF-8' => 1, 'OCTETS' => 1, ... );
return FALSE if not valid_encoding($encoding_mode);
```

#### Step 4: Add Error Context to .apply Module
Enhance base.fh-encoding.apply to provide better diagnostics:
- If binmode() fails, log which encoding failed
- Include file descriptor number in error message
- Suggest common encodings if typo is suspected

#### Step 5: Test with Various Encodings
Create test cases:
- Valid: 'UTF-8', 'OCTETS', 'latin1'
- Invalid: 'NOTSUPPORTED', 'bad_name'
- Edge cases: empty string, special characters

### Expected Outcome
Clear, early detection of encoding mode problems with actionable error messages.

### Verification Checklist
- [ ] Valid encodings are accepted
- [ ] Invalid encodings are rejected with reason
- [ ] Error messages are helpful and specific
- [ ] Binmode failures are clearly reported

