## Implementation Notes & Patterns

### Error Handling Pattern
When a module loading step fails:
1. Set `$compilation_success = FALSE`
2. Store failure reason in `$data{'code'}{$sub_name}` hash
3. Let broken routine handler create fallback
4. Log specific error message for diagnostics
5. Continue loading other modules (don't abort)

### Testing Pattern for Permission Issues
```bash
chmod 600 modules/test.module
./bin/Protocol-7 v7  # Should show "undefined routine" message
chmod 644 modules/test.module
# Module should work normally after chmod
```

### Encoding Assignment Pattern
```perl
# In code that needs OCTETS mode:
<[base.fh-encoding.set]>->($output_fh, 'OCTETS');
<[base.fh-encoding.apply]>->($output_fh);

# In code that needs UTF-8:
<[base.fh-encoding.set]>->($input_fh, 'UTF-8');
<[base.fh-encoding.apply]>->($input_fh);
```

### Code Review Checklist for All Phases
- [ ] Perl syntax valid (perl -c)
- [ ] No warnings when compiled
- [ ] TRUE/FALSE constants used (not 0/1)
- [ ] Error messages are helpful and specific
- [ ] Caller context included in errors
- [ ] Documentation updated
- [ ] No breaking changes to existing modules

