---
# layer 1 — top-level category branches.
# these are stable attractors below the root. task items never live here directly.
# reference weight accumulates from their children upward.

branches:

  infrastructure:
    id: infrastructure
    parent: ROOT
    type: category
    title: network fabric, transport, and zenka lifecycle reliability
    value: { refs: 0, weight: 0.0 }
    children:
      - infra.async-io
      - infra.stream-transport
      - infra.tls-acme
      - infra.zenka-lifecycle
      - infra.httpd

  intelligence:
    id: intelligence
    parent: ROOT
    type: category
    title: inference coordination, task routing, and model awareness
    value: { refs: 0, weight: 0.0 }
    children:
      - intel.task-tree
      - intel.valued-trees
      - intel.coding-zenka
      - intel.kimi-zenka
      - intel.consensus
      - intel.context-templates

  coherence:
    id: coherence
    parent: ROOT
    type: category
    title: style, signatures, checksums, documentation, and code quality
    value: { refs: 0, weight: 0.0 }
    children:
      - coher.code-style
      - coher.signatures
      - coher.module-format
      - coher.documentation

  self-improvement:
    id: self-improvement
    parent: ROOT
    type: category
    title: ncode pattern learning, workflow optimization, and template evolution
    value: { refs: 0, weight: 0.0 }
    children:
      - self.ncode-learning
      - self.template-evolution
      - self.outcome-analysis
      - self.observation-triage

  meta-workflow:
    id: meta-workflow
    parent: ROOT
    type: category
    title: parallel activities independent of task topics — ask, summarize, route
    value: { refs: 0, weight: 0.0 }
    description: |
      meta-workflow nodes are not tasks — they are recurring activities that
      run alongside the main task branches. they ask models questions about
      the workflow itself, collect and route the results, and feed insights
      back into the tree as reference weight adjustments and template updates.

      they fire based on outcomes of other branches, not on their own schedule.
      a blocked task fires a different meta-workflow node than a successful one.
    children:
      - meta.post-success
      - meta.post-blocked
      - meta.post-surprising
      - meta.workflow-query
      - meta.template-query
      - meta.session-summary

