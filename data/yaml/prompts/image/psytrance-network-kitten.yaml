## image generation prompt : the protocol-7 psytrance-network-kitten ##
## [ reference-guided : real kitten photos re-rendered, not invented ] ##

name: psytrance-network-kitten
created: 2026-10-17

prompt: |
  task : upgrade rendering quality and repair anatomy where necessary

  style : deep blue and blacklight futuristic goa-trance

  quality : high-resolution photorealistic

  character : native protocol-7 psytrance-network-kitten

## the organic references already have perfect anatomy -- kept anyway ##
## for references that do not                                         ##
negative_prompt: bad anatomy, redundant bodyparts

generator:
  app: invokeai 6.14.1-post1
  mode: qwen_image_txt2img [ with one reference image ]
  model:
    name: qwen-image-2.1-UC-Q4_K_M.gguf
    hash: blake3:907c00c345dd661b91fad13fb463868dc5ae416efec893690a2ae843b01a6699
  vae:
    name: qwen_image_2.1_vae_bf16
    hash: blake3:62cf77e928196a5ba4f118fe108a384a306fdd7cff734df62d2528bcaa69a4b0
  vl_encoder:
    name: qwen3vl_8b_int8_convrot
    hash: blake3:2ee468103d3735269c37f572ee6190ccd03691678eb1b0ab2ab82872376d2fec
  settings:
    width: 1216
    height: 704
    steps: 24
    cfg_scale: 5.0
    shift: 1
    quantization: none
  ## model behaviour : qwen-image 2.1 LOCKS IN strongly on the composition ##
  ## of the reference -- refinement [ fur, colour, light ] follows short   ##
  ## plain instructions ; a pose \ composition change needs a bold stated  ##
  ## reason in the prompt, then it does it [ the elves showed it ]. the     ##
  ## lock-in keeps step \ cfg comparisons fair ONLY WITH A FIXED SEED      ##
  ## [ invoke picks a new one per run otherwise ] : same composition,      ##
  ## other refinement. cfg 1 disables guidance AND the negative prompt.          ##
  ## reference ROLES : qwen-image 2.1 follows instructions that name the   ##
  ## references -- e.g. re-render reference image 1 at the rotated angle  ##
  ## of reference image 2 [ subject from one, camera angle from the other ##
  ## -- the camera rig ]. unnamed references compete or stack instead.    ##
  ## GRID ROOM LOCK-IN [ proven 2026-10-18 ] : a grid scene WE render and ##
  ## control, given as a reference, holds the scenery -- different        ##
  ## kittens render into the same room, their angle to it changeable.     ##
  ## reusable scenery ; quality still improvable by a prompt asking for it ##

## the reference image carries the subject : same seed, different photo ##
## -> a different kitten scene                                           ##
reference: a photo of real kittens [ e.g. ginger kittens on a sunny day ]
## provenance of the base results : origin unknown, one pass ; the scene
## was RESTYLED, not replaced [ trees and grass keep their form as
## crystal \ fibre structures ] -> the photo's own environment remains
source: photo of unknown origin ; scene restyled, environment structure kept ; one pass

## the same chain as the elf pipeline : reference acquisition -> quality ##
## filter -> reference-conditioned render [ its qwen-image 2.1 route ]  ##
related:
  - data/tasks/network-elf-avatar-pipeline.md [ steps 1 + 6 ]
  - data/tasks/images-elfdb-feature-collection.md
  - data/md/design-specs/fractal-data-architecture-holographic-tty.md [ network-kitten themes ]

