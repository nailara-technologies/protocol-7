    seed: 3781658147
  - file: data/gfx/backgrounds/5TFDO7EKGTPK542YIS2GYHLRPM2EWE4G5UAPJQTKQCTHM.png
    seed: 3781658147

## variant : a source with white fur segments \ a grey kitten -- the
## refinement block isolates them and keeps both kittens distinct. built
## over a step series [ cfg 3.5 ] : 24 -> 32 -> 48 -> 63 -> 77, the seed
## NOT fixed [ 63 and 77 differ : 77 added a second tail parallel to a
## violet-tinted leg, read as an extra limb -- the SEED did that ]. then
## 63 -> 113 with the 63 seed FIXED : same composition, no new parts, the
## one existing tail completed [ longer, fuller ], detail up everywhere
## [ head +10 %, violet leg +7 %, background lines +50 % sharper ], same
## peak brightness. lesson : new parts come from the seed, more steps
## complete and refine what is there. 113 chosen.
## cfg 5 had crushed the grey kitten into black. the environment line is
## in twice [ the darkness fix was appended, not replaced ] -- kept as run
variants:
  - name: sleeping-embrace
    reference: a black-and-white and a blue-grey kitten asleep in an embrace on a grey blanket [ photo, 736 x 552, dim light ]
    source: 'photo of unknown origin [ reverse image search, yandex, 2026-10-17 : no match ] ; isolated subject, environment fully replaced ; one pass'
    prompt: |
      task : upgrade rendering quality and repair anatomy where necessary

      style : deep blue and blacklight futuristic goa-trance

      quality : high-resolution photorealistic, fine individual fur strands throughout

      character : native protocol-7 psytrance-network-kittens, two kittens asleep in an embrace

      refinement : keep the exact sleeping pose -- the black-and-white kitten's white front leg wraps around the grey kitten, heads resting together.

        isolate both kittens cleanly from the blanket and place them resting in a native cubic-space-topology network environment : dim nodes and thin connection lines, far darker than the kittens.

        black-and-white kitten : black fur stays deep black with a faint blue rim light ; the white segments become a muted deep violet that keeps the full fur texture and the soft shading of the original white fur -- a dyed fur colour, not a flat fill and not a light source.

        grey kitten : keep it a distinct blue-grey kitten -- its fur becomes smoky silver-blue under the blacklight, with visible fur structure and gentle highlights on head and paws, clearly separate from the black kitten.

       place them resting in a native cubic-space-topology network environment : a dim but clearly visible network of nodes and thin connection lines, darker than the kittens.

        lighting : calm and moody, soft blue ambient light shows both kittens completely including their bodies and tails, no glowing areas, the brightest parts are the kittens' ear rims
    negative_prompt: bad anatomy, redundant bodyparts, flat colour fill, glowing fur, neon, overexposed, bright white, crushed blacks, merged bodies, extra legs
    settings:
      steps: 113
      cfg_scale: 3.5
    results:
      ## not imported yet : the grey kitten has fur past the other kitten's
      ## outline -- an improved render is in progress
      - file: data/gfx/backgrounds/D77KPQLTRFNDIGBPZUUTKHJ7GT7BPIG43D635ROOSXIUG.png
        seed: 3965576381
        status: pending

## magic style prompt [ user, 2026-10-17 ] : style keywords only, no
## specification -- the model interprets, coherence comes from the
## style family. not rendered yet ; watch 'radiates' for glowing fur
style_prompts:
  - name: implosion-into-awareness
    prompt: the psytrance-network-kitten radiates blacklight space on fluorescently shimmering translucent field-lines of the inescapable implosion into awareness of which its presence is the anchor.
  - name: curious-visitor
    ## [ user, 2026-10-17 ] : a subject TEMPLATE -- kitten or elf [ the
    ## shared sweetie template ] ; also a repair prompt for off-range
    ## renders. 'protocol-7' as an unknown name may act like a watermark
    ## for sophistication -- test : same seed with and without it
    prompt: a deeply blue and violet blacklight hyperspace grid with a curious protocol-7 network <subject> as a native inhabitant visiting
    subject: kitten | elf
    ## GENERIC form [ user ] : no subject word -- the reference image
    ## decides the type [ kitten, elf, .. ], the prompt only the scene
    ## and the state
    generic: a deeply blue and violet blacklight hyperspace grid with a curious native protocol-7 network inhabitant visiting
    results:
      ## first success 2026-10-17 : subject kitten, ONE reference [ the gimp
      ## original R2G.. ], a NEW seed [ not the reference's ] -- hue 243,
      ## mean brightness 10, brightest 0.1 % at 85, no catchlights, face
      ## detail kept. kept outside the repo until the checksum storage
      - file: /mnt/ext-xfs-data/backup/src-gfx/USE47XOTC4RFERUISWMD62UE22QM67CFAFS6UCC3KTAJO.png
        seed: 7747777
        reference: data/gfx/backgrounds/R2G5EBRDYGXW6DEKT7IFAEZUN7YPJNC2MYVJJKWSRN7FO.png
        negative_prompt: green, teal, cyan, neon, overexposed, white glow, bright stars, catchlights, bad anatomy, redundant bodyparts, extra legs

## reference chains [ 2026-10-18 ] : one photo, two prompt modes. the
## PROMPT decides the subject count : a singular visitor in a grid space
## -> the model selects ONE subject [ the clearest face ] and drops the
## rest ; the base prompt [ upgrade quality, style, native kitten ] ->
## it keeps ALL subjects and restyles the environment natively.
## files not recorded -- the chains are kept as examples of the method
chains:
  - name: visitor-into-grid-room
    ## two generations : the subject survives the chain [ stripes, eyes, ##
    ## nose kept ], the stage is replaced each time -- no retracing      ##
    steps:
      - in:
          - 'photo : four ginger kittens on a meadow [ fisheye, sunny ]'
          - 'a symmetric blue grid corridor'
        prompt: curious-visitor [ singular ]
        out: ONE kitten isolated in the corridor [ the front one ; three kittens, meadow, sky, trees dropped ]
      - in: [ 'the isolated kitten', 'the darkest-state node field screenshot [ near black ]' ]
        prompt: reference roles [ kitten from reference 1, room angle from reference 2 ]
        out: the same kitten in a corner room aligned to the screenshot perspective
    ## the same room took other kittens too [ the R2G runner, the
    ## sleeping pair ] -> reusable scenery
  - name: style-transfer-whole-scene
    in:
      - 'the same four ginger kittens photo'
    prompt: 'the base prompt above [ task : upgrade rendering quality .. ]'
    out: all four kittens in place, trees as blue crystal silhouettes, grass as fibre \ glitter network ; first attempt
    ## environment restyled, not replaced -> shareable only from a free
    ## source. watch : the eyes turned to glowing blue [ eye-max ]
    ## NEXT : the same base prompt as a quality pass over the grid-room
    ## renders [ a third generation, new seed -- not the render's own ]

## lighting [ user, 2026-10-18 ] : the eyes follow the light the model
## ASSUMES -- with only holographic lines lighting the scene it invents
## its own sources and the eyes glow. naming light needs an exact source
## and its spread, a wide one gives wide reflections [ a panorama, blue
## water at a beach ] -- wanted. point sources pierce the colour range as
## outliers, downgrade it and pull the subconscious focus onto them.
lighting:
  example: a deep blue ambient grid plane lit by a blacklight sun
  ## or name what the eyes REFLECT -- the world described like in a book,
  ## its details exist even where only a reflection shows them
  reflected: a wide blue sky | a galaxy | a violet space nebula
  ## blacklight = UV to the model : it renders fluorescence where a
  ## fluorescent material is present, and none where not -> naming the
  ## materials places the glow [ e.g. grid lines fluorescent, fur matte ]
  fluorescent: name which materials glow under the blacklight
  wanted: wide reflections [ panorama quality ]
  avoid: point light sources [ outliers above the colour range ]

## style framework [ user, 2026-10-18 ] : fluorescence, ambience,
## translucency, holography and goa-trance combined -- a futuristic deep
## style reaching from eternal shamanism to [ disentangled from ] time
## travelling space ships. the model loads these references implicitly.
## kittens and elves complement each other : one framework, two natives
framework:
  parts:
    - fluorescence
    - ambience
    - translucency
    - holography
    - goa-trance
  natives:
    - psytrance-network-kitten
    - goatrance-network-elf
  ## background rules depend on the context [ user, 2026-10-18 ] but BUILD
  ## ON EACH OTHER, never exclude : neon is embedded in the blue \ violet
  ## base framework ; on a screen behind translucent dark terminals it
  ## shimmers through ; projected by a laser beamer it lights the room.
  ## the dark visualizations will not stay dark either -- colour is a
  ## progressive build-up where each colour has a function and a meaning,
  ## multi-layered and harmonically integrated : more information without
  ## overload, because overall balanced
  ## the PURPOSE above all layers [ user, 2026-10-18 ] : what shimmers
  ## through matters too. elves, kittens, space and to a degree nature
  ## keep the mind in a creative flow state -- backgrounds sustain and
  ## support that flow, never interrupt it
  purpose: sustain and support the creative flow state
  subjects:
    - elves
    - kittens
    - space
    - nature [ to a degree ]
  ## and the practical check beside it : translucent text over the image
  ## stays readable -- low luminance and little fine high-contrast detail
  ## where the terminals sit [ edge density competes with glyphs ]
  readable: translucent terminal text stays readable over it
  layers:
    base: deep blue and violet [ every context ]
    neon: embedded in the base, never on its own
    meaning: each added colour carries a function
  media:
    screen: behind translucent dark terminals the colours shimmer through
    projection: the image lights the room

## magic words [ user, 2026-10-17 ] : one word sets a whole learned
## reference set -- the model falls back on it wherever in doubt
magic_words:
  - word: psytrance
    sets: the style family [ palettes, fractal structure, uv glow ]
  - word: blacklight
    sets: the style family, dark radiance
  - word: goa-trance
    sets: the style family
  - word: awareness
    sets: eye clarity and focus, ear states, posture as one state [ watch for catchlights ]
  - word: native
    sets: the subject belongs to its environment [ light, shadow, edges -- multi-element correlation ]
  - word: serenity
    sets: calm [ relaxed posture, lower contrast, no harsh highlights ]
  - word: deep
    sets: darkness without flattening [ replaced soft, which lifts the shadows ]

