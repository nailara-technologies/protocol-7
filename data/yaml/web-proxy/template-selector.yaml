rules:
  - regex:    "\\.(pdf|PDF)$"
    on_path:  true
    template: document.proxy

  - regex:    "\\.(jpg|jpeg|png|gif|webp|svg)$"
    on_path:  true
    template: image.passthrough

  - regex:    "\\.(js|css|woff2?)$"
    on_path:  true
    template: asset.passthrough

  - static:   { "request.method": CONNECT }
    template: tunnel.passthrough

fallback:   generic.proxy

