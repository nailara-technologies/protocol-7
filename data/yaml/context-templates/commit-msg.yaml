---
name: commit-msg
descr: analyze staged git changes and suggest a commit message
budget: 3000
sections:
  ## recent commit messages for style reference ##
  - provider: context.git.recent_changes
    priority: 1
    budget_pct: 15
    params:
      max_files: 5
    optional: true
    label: recent changes for style reference

  ## instructions ##
  - static: |
      analyze the staged git diff provided below and write a commit message.

      rules:
      - first line: imperative mood, max 72 chars, no period
        [ e.g. "Add X", "Fix Y", "Refactor Z" ]
      - blank line after subject
      - body: bullet points explaining what changed and why
      - group related changes under a single bullet
      - mention module names with dot notation [ coding.tools.dispatch ]
      - do not mention signature or version file changes
      - do not list every file — summarize by purpose

      output ONLY the commit message, nothing else. no markdown fencing.
      start directly with the subject line.
    priority: 2
    budget_pct: 85
    label: commit message instructions

