---
name: sliding-compact
descr: sliding window summarization for long documents — prev summary + current + next preview, summarize only current
budget: 6000
sections:
  ## core knowledge ##
  - include: system-base
    priority: 1
    budget_pct: 15

  ## sliding window instructions ##
  - static: |
      you are summarizing a long document section by section using a
      sliding window. you will see three things at each step:
        [ prev_summary ] — your own summary of the section just before this one
        [ current ]      — the section you must summarize now
        [ next_preview ] — the section that follows (read-only context)

      rules:
        - summarize ONLY the current section
        - use next_preview for calibration only — do not summarize it
        - use prev_summary for continuity — your output should read
          naturally after it, but not repeat it
        - keep each section summary dense: 2-4 sentences max
        - preserve specific names, values, module names, decisions
          that appear in the current section — these are load-bearing

      ## sliding window protocol ##

      ### step 1: read state ###
      call tree_read with path="sliding.state" to get:
        { offset: N, chunk_size: N, pass: N }
      if the path does not exist (error contains "not found"), initialize:
        { offset: 0, chunk_size: {{chunk_size}}, pass: 1 }
      do NOT retry tree_read if it returns not found — that is expected on
      the first pass. initialize and continue.

      ### step 2: read current chunk ###
      call read_file with:
        path: "{{target_file}}"
        offset: <current offset from state>
        length: <chunk_size from state>
        show_line_numbers: true

      if the result is empty or shorter than 10 lines and offset > 0:
        you have reached the end. go to step 6 (synthesis).

      note the actual line count returned — use it to detect end of file.

      ### step 3: read next chunk as preview ###
      call read_file with:
        path: "{{target_file}}"
        offset: <current offset + chunk_size>
        length: <chunk_size / 2>   [ half-width preview is enough ]
        show_line_numbers: false

      ### step 4: read prev summary ###
      call tree_read with path="sliding.prev"
      (not found on first pass — treat as empty string, that is fine)

      ### step 5: summarize current chunk ###
      given [ prev_summary | current_chunk | next_preview ]:
        write a 2-4 sentence summary of ONLY the current chunk.
        start with a one-line header: "## lines N–M: <topic> ##"

      then:
        call tree_write path="sliding.prev"   value=<your summary>
        call tree_write path="sliding.all"    value=<existing content + "\n## lines N–M ##\n" + summary>
        call tree_write path="sliding.state"  value=<JSON: {"offset": new_offset, "chunk_size": chunk_size, "pass": pass+1}>

      if next_preview was empty (end of file reached): go to step 6.
      otherwise: go back to step 2 with the updated offset.

      ### step 6: synthesis ###
      call tree_read with path="sliding.all" to retrieve all section summaries.

      synthesize them into a single coherent summary of the full document:
        - preserve the arc: beginning → middle → end
        - collapse redundancy across sections
        - keep all load-bearing specifics (names, values, decisions)
        - target length: {{synthesis_length}} [ default: one paragraph per
          major section, or ~10% of the per-section summary total ]

      write the final synthesis as the last output block:
        ## document summary: {{target_file}} ##
        <synthesis>

        ## section index ##
        <one line per section: "lines N–M: topic">

      ### cleanup ###
      call tree_write path="sliding.prev"  value=""
      call tree_write path="sliding.all"   value=""
      call tree_write path="sliding.state" value=""
    priority: 2
    budget_pct: 85
    label: sliding window instructions

