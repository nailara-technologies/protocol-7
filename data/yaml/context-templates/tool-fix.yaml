---
name: tool-fix
descr: fix a specific tool handler based on error diagnosis
budget: 3500
sections:
  ## style conventions ##
  - provider: context.style.guide
    priority: 1
    budget_pct: 10
    label: style conventions

  ## the tool definitions ##
  - provider: context.file.extract
    priority: 2
    budget_pct: 20
    params:
      path: "src/coding.tools.definitions"
    label: tool definitions

  ## the dispatch module — full content ##
  - provider: context.file.extract
    priority: 3
    budget_pct: 35
    params:
      path: "src/coding.tools.dispatch"
    label: dispatch handlers

  ## the target module the tool calls ##
  - provider: context.file.extract
    priority: 4
    budget_pct: 15
    params:
      path: "{{target_module}}"
    optional: true
    label: target provider module

  ## fix instructions ##
  - static: |
      fix the tool handler issue described below.
      use write_new_file or replace_in_file to apply changes to disk.
      do NOT return code in the response — write it directly to the file.

      issue: {{issue_description}}

      check these common problems:
      - return format: tools must return string content, dispatch wraps it
      - missing args handling: default all params with //
      - undefined $code{} refs: check exists before calling
      - file paths: prepend <system.root_path> for relative paths
      - shell safety: validate/sanitize user input for exec calls

      ## p7 module format ##
      header must be exactly:  ## [:< ##
      descr max 55 chars, lowercase, no capitals
      do NOT add footer lines — leave file ending with       ## p7 data key syntax ##
      CORRECT : <key.sub>->{$id}
      WRONG   : $data{'key.sub'}{$id}

      ## tool parameter reference ##
      write_new_file:         { path: "src/name", content: "..." }
      replace_in_file:        { path: "src/name", old: "...", new: "..." }
      validate_module_format: { name: "module.name.here" }
      ptd_check:              { path: "src/name" }
    priority: 5
    budget_pct: 25
    label: fix instructions

