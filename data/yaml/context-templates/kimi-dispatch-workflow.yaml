---
name: kimi-dispatch-workflow
descr: write effective kimi task files and use kimi_dispatch / kimi_continue correctly
budget: 3000
sections:

  - static: |
      ## kimi dispatch workflow ##

      kimi K2.6 is a full remote model from Moonshot AI — not the local 9B.
      use kimi for deep code work: autonomous multi-file exploration, bug fixes,
      feature implementation. it has long context and tool use built in.

      ## writing the task file ##

      task files live in data/yaml/coding-tasks/<task-id>.yaml
      write them with enough context that kimi can work without asking questions.

      required sections:
        objective:    one sentence — what is being built or fixed
        context:      key files, module names, patterns to follow
        steps:        numbered — clear enough to audit, not so narrow as to trap
        acceptance:   how to verify it is done
        signatures_note: |
          do NOT add #,,.,,... stub at end of any file.
          leave new files clean — signing system adds the real 4-line footer.

      ## common kimi hallucinations — always guard against these ##

      SUPER:: calls   — P7 modules have no class hierarchy. there is no SUPER.
                        grep the codebase; if SUPER:: appears, kimi invented it.

      $_ in loops     — protocol-7 uses $ARG not $_. kimi reverts after compaction.
                        verify: all map/grep/for in generated code use $ARG.

      fake signatures — kimi sometimes adds #,,.,,... stubs "to help".
                        these BLOCK the real signing system. always add signatures_note
                        to every task file (see above).

      namespace swaps — kimi confuses similar-named modules (cube vs cube-13, etc.)
                        always name the exact modules in the task context section.

      LWP as async    — LWP::UserAgent is blocking. kimi sometimes uses it in event
                        handlers. always specify "use IO::Async / EV patterns only"
                        when writing async code.

      whitelist entries — kimi sometimes adds cube/access.zenki entries that do not
                          match the real access pattern. verify any cube access changes
                          against the existing file format before applying.

      stale v7 naming — the v7 management zenka was renamed to v7-zenki
                          (2026-08-31/09-02, commits 23a0e8d53/3f1d6b40f). any task
                          context doc dated before that (check its own date/commit
                          references) still says v7.<something> — e.g. `v7.restart` —
                          which no longer resolves. translate before or while dispatching:
                          `v7.restart` -> `v7-zenki.restart` (module is
                          `v7-zenki.zenka.cmd.restart`), same pattern for
                          `v7.start`/`v7.stop`/etc. the `zenka.v7` file-extension
                          convention and the `v7.ax` domain name are UNRELATED and
                          were deliberately left unchanged — do not "fix" those.

      ## live console tap — give kimi this instead of ad-hoc reload/grep ##

      v7-zenki aggregates every zenka's STDOUT into one combined, live-tailable
      ring buffer: `/dev/shm/.7/STDOUT/<socket-id>` (stable symlink also at
      `/var/run/.7/STDOUT/<socket-id>`). current known-live socket-id in this
      deployment: `NIW7OAQ` (confirmed live, check freshness with `ls -la` before
      trusting it in a new session — it can rotate on a v7-zenki restart). when a
      task needs kimi to verify a `reload`/live-behavior result, mention this path
      directly in the task file's context section so kimi tails/greps it instead of
      re-running commands and reasoning about baselines. background:
      data/ai-mem/claude/feedback-kimi-v7-console-hint.md,
      data/ai-mem/claude/feedback-kimi-reload-baseline-noise.md

      ## structuring the kimi_dispatch prompt ##

      minimal overhead format (token-efficient):
        prompt:   "read data/yaml/coding-tasks/<id>.yaml and complete the task"
        task_id:  "<id>"   [ used for kimi_continue if needed ]
        model:    "kimi"   [ default; no need to specify unless overriding ]

      avoid putting the full task text in the prompt — kimi reads the file.
      keep the prompt to one line pointing at the task file.

      auto_summarize is TRUE by default. the return value from kimi_dispatch
      will be a rolling-window summary, not the raw output. this is correct
      behavior — raw output would overflow parent context.

      ## kimi_continue for follow-up passes ##

      use kimi_continue when:
        - kimi called task_complete but left items unfinished
        - a follow-up verification pass is needed [ ptd -c, read output, etc. ]
        - injecting a redirect message to a running session

      format:
        session_id:  "<uuid from kimi_dispatch return>"
        prompt:      "verify the modules pass ptd -c and fix any errors found"

      p7c coding.inject-message <id> <msg> — alternative: redirect stuck kimi mid-task

      ## what kimi needs in context (include these in task files) ##

      - exact module names to read/create/edit (not namespace wildcards)
      - the full P7 syntax rules (see CONVENTIONS.yaml)
      - which zenka it is editing and its start file path
      - the signatures_note (always)
      - acceptance steps that use tools kimi has (read_file, ptd_check, etc.)

      ## what kimi tends to hallucinate (never rely on) ##

      - SUPER:: — never valid in P7
      - $_ in inner loops — always $ARG
      - #,,... footer stubs — forbidden
      - CPAN modules not in the codebase — kimi invents them; grep first
      - blocking I/O inside event handlers — specify async requirement explicitly
    priority: 1
    budget_pct: 100
    label: kimi dispatch workflow

