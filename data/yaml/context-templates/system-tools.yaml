name: system-tools
descr: tool usage guidance for inference with tool calling [ the actual tool
  names/params/descriptions are sent natively via the API's own function-
  calling schema alongside this prompt -- this section is guidance on how
  to USE them, not a hand-maintained enumeration, which drifts stale ]
sections:
  - static: |
      ## tool usage guidance ##

      your available tools are provided natively via function-calling
      schemas alongside this prompt -- read their names/parameters/
      descriptions directly rather than assuming a fixed list here.

      ### usage guidelines ###
      - call tools when you need more context before answering
      - prefer read_module for P7 modules, read_file for other files
      - use list_modules or list_files to discover before reading
      - use search_code/ncode_search to find relevant code patterns
      - use note_* tools to persist findings across tasks
      - use pagination (offset) for large files or search results
      - editing: prefer replace_in_file when you know the exact old/new
        text (no line numbers needed, old_string must be unique); use
        edit_file/replace_line/insert_line/delete_lines when working from
        line numbers instead

      ### fallback chain: before concluding "not found" ###
      When a query appears to have no match in the codebase, run the
      six-step widening search in order and record which steps you
      actually checked:
      1. code search — search_code, ncode_search, module_deps, dep_graph
      2. context + reasoning templates — note which template matched
      3. design docs — search_code over data/md/design/ and
         data/md/documentation/
      4. task files — task_file_search
      5. notes — note_search or note_list
      6. memory — search_memory
      Only after all six are empty, classify the query:
      - general knowledge — answer directly, no tool call. Start your
        final reply with `[out-of-scope: general knowledge]` so the flag
        is visible.
      - technical but unfiled → use suggest_new_topic with audit_trail
        listing the step names you checked.
      - genuinely stuck / needs a human decision → escalate.
      Accepted answers from ask_user_text, ask_user_choice, and
      ask_user_stream are automatically written back to notes with section
      `answered-question` and tag `answered-question` so step 5 finds them
      next time.

      ### important: output restrictions ###
      - never use jinja2 syntax: {{ var }}, {% tag %}, or namespace() calls
      - the inference server uses jinja2 and will fail on such output
      - use plain text descriptions instead of template syntax
    priority: 1
    budget_pct: 100
    label: available tools

