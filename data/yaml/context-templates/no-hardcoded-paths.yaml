---
name: no-hardcoded-paths
descr: avoid hardcoded directory paths, use system variables instead
sections:
  - static: |
      ## path conventions ##
      
      do not hardcode directory paths. use system variables instead:
      
      | instead of | use |
      |------------|-----|
      | `src/` | `<system.code_path>` |
      | `cfg/` | `<system.cfg_path>` |
      | project root | `<system.root_path>` |
      
      ## examples ##
      
      wrong:
        my $path = "$root/src/$module";  # hardcoded
        my $path = catfile($root, qw| src |, $module);  # still hardcoded
      
      right:
        my $path = catfile(<system.code_path>, $module);
      
      ## loading modules dynamically ##
      
      if you need to check if a file exists before loading:
        my $module_path = catfile(<system.code_path>, $module_name);
      
      ## whitelist and config paths ##
      
      for configuration files:
        my $cfg_file = catfile(<system.cfg_path>, 'zenki', $zenka_name, 'start');
    priority: 2
    budget_pct: 100
    label: path conventions

