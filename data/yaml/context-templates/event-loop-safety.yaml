  - static: |
      ## event-loop-safety detection checklist ##

      When reviewing any while/until loop, apply this checklist:

      1. Does the loop call `event.once()` or `event.add_timer()` inside?
         -> SAFE: event loop is actively polled
         -> if yes, check minimum interval (0.01-0.07s typical)

      2. Does the loop call a blocking syscall (sysread, LWP, HTTP)?
         -> DANGER: BLOCKS THE ENTIRE OS THREAD including the event loop
         -> event.once() BEFORE the call does NOT help — the call itself
            blocks all watchers for its full duration (seconds to minutes)
         -> LWP::UserAgent, HTTP::Tiny->get/post ARE blocking — they are
            NOT async. "async at the OS level" is a false belief.
         -> must use coding.async.http_client or forked child instead
         -> use consensus_query(mode: verify) to confirm this classification

      3. Does the loop call NEITHER of the above?
         -> DANGER: tight spin loop, no yield mechanism
         -> ALL watchers frozen - network I/O, timers, other zenki halted

      4. Is the loop bounded by a small constant (< 100 iterations)?
         -> ACCEPTABLE if documented with annotation (see exceptions below)

      5. Is the loop in a forked child or startup-only path?
         -> ACCEPTABLE if not blocking parent event loop

      6. Does the loop have an explicit exit condition that will eventually
         fire (not just "while true" with hope)?

      ## repair patterns ##

      ### tight spin loop -> timer watcher with cancel ###
      BAD:
        while ($done == 0) {
          if ($condition) $done = 1;
        }

      GOOD:
        my $timer = <[event.add_timer]>->(
          {
            'after'   => 0.01,
            'repeat'  => 1,
            'handler' => qw| module.sub |,
            'data'    => $state,
          }
        );
        # cancel when done
        $timer->cancel() if $done;

      ### blocking LWP call -> async http_client or forked child ###
      BAD:
        my $r = LWP::UserAgent->new->get($url);
        return $r->decoded_content;

      GOOD:
        my $result = <[coding.async.http_client]>->($url, {}, $callbacks);
        # callbacks handle streaming asynchronously

      OR forked child for long operations:
        my $pid = fork();
        if ($pid) {
          # parent continues event loop
          <[event.add_timer]>->({ 'after' => 30, 'handler' => 'poll_child' });
        } else {
          # child does blocking work, exits
          exit(0);
        }

      ### regex buffer loop -> add advance guard ###
      BAD:
        while (1) {
          $buffer =~ s/^\r?\n//;
        }

      GOOD:
        my $last_len = 0;
        while (1) {
          my $len = length($buffer);
          if ($len == $last_len) {
            last;  # no progress - prevent infinite loop
          }
          $last_len = $len;
          $buffer =~ s/^\r?\n//;
        }

      ### polling loop -> event.once with minimum interval ###
      BAD:
        while (!$completed) {
          # poll state
          <[event.once]>;  # too fast, no minimum interval
        }

      GOOD:
        while (!$completed) {
          <[event.once]>->(0.01);  # minimum 10ms between polls
          # OR use event.add_timer with repeat=1
        }

      ### watcher callback loop -> ensure proper cancel ###
      GOOD (already safe):
        while ($event->w) {
          my $watcher = $event->w;
          $watcher->cancel;  # critical: cancel before continuing
          # process event
        }

      ## legitimate exceptions with required annotation ##

      Some while loops are acceptable when properly documented:

      1. Bounded iterations (document N and why):
         ```perl
         ## event-loop-safe: bounded 50 iterations, startup probe [ no yield needed ] ##
         while ($probe_count++ < 50 && $status != 'ready') {
           sleep(0.001);
         }
         ```

      2. Startup-only paths (never in event loop context):
         ```perl
         ## event-loop-safe: startup initialization, no event loop active ##
         while (open($fh, '<', $config_file)) {
           # read config
         }
         ```

      3. Forked child processes (parent event loop not affected):
         ```perl
         ## event-loop-safe: forked child, event loop suspended in parent ##
         my $child = fork();
         if ($child) {
           # parent: continue event loop
         } else {
           # child: blocking operation safe here
           while ($result == undef) {
             $result = blocking_op();
           }
           exit(0);
         }
         ```

      4. Regex buffer loops with advance guarantee:
         ```perl
         ## event-loop-safe: regex advances by at least 1 byte per iteration ##
         while ($buffer =~ s/^([^\r\n]*)\r?\n//) {
           # process line
         }
         ```

      ## audit instructions ##

      When this template is active:

      1. Search for while/until/for loops in the target module:
         - Use `search_code(pattern: "while\s*\(`) to find while loops
         - Check each one against the checklist

      2. For each DANGER classification:
         - Verify with consensus_query(mode: verify)
         - Quote the loop code and explain why it's unsafe
         - Propose concrete repair using the patterns above

      3. Document exceptions:
         - If a loop appears to be an acceptable exception,
         - verify it has the proper annotation
         - if missing, flag for addition

      4. Verify repairs:
         - After proposing repairs, re-check the loop
         - Ensure the repair actually yields to the event loop

      ## key patterns from P7 codebase ##

      ### event.once pattern (safe) ###
      Used in: coding.cmd.wait-done, coding.handler.process-queued-task
      ```perl
      <[event.once]>->(0.07);  # poll and yield every 70ms
      ```

      ### event.add_timer pattern (safe) ###
      Used in: coding.async.http_client, coding.handler.http_poll
      ```perl
      my $next = <[event.add_timer]>->(
        {
          'after'   => 0.01,
          'repeat'  => 1,      # repeat indefinitely
          'handler' => qw| module.sub |,
          'data'    => $state,
        }
      );
      ```

      ### event.add_io pattern (safe) ###
      Used in: coding.async.http_client, coding.handler.http_io
      ```perl
      my $io_watcher = <[event.add_io]>->(
        {
          'fd'      => $sock,
          'handler' => qw| coding.handler.http_io |,
          'data'    => $state,
        }
      );
      ```

      ### sysread loop with syswrite (safe) ###
      Used in: coding.async.http_client (write request)
      ```perl
      while ($total_written < $req_bytes) {
        my $n = syswrite($sock, $data, $req_bytes - $total_written, $total_written);
        if (defined $n) {
          $total_written += $n;
        } elsif ($!{EAGAIN} || $!{EWOULDBLOCK}) {
          select(undef, undef, undef, 0.001);  # yield OS
        } else {
          # error
        }
      }
      ```

