      ## known P7 patterns verified safe ##

      These patterns from the P7 codebase are verified safe:

      1. **event.once with interval** (min 0.01s recommended)
         - src/coding.cmd.wait-done line 66
         - src/coding.handler.process-queued-task line 207
         - src/nshell.no-tty-debug.cmd.char-add lines 256, 291

      2. **event.add_timer with repeat=1**
