  - static: |
      ## summary ##

      Event loop safety in Protocol-7 means ensuring that while loops
      do not bypass the AnyEvent/EV event system. The event loop drives
      all network I/O, timers, and watcher callbacks - blocking it freezes
      the entire zenka.

      Detection checklist:
      1. event.once or event.add_timer inside? -> safe
      2. Blocking syscall? -> investigate (may block OS thread)
      3. Neither? -> DANGER (tight spin)
      4. Bounded iterations? -> acceptable if documented
      5. Forked child/startup-only? -> acceptable

      Repair patterns available for each class of unsafe loop.

      Legitimate exceptions must be documented with the annotation:
      ```perl
      ## event-loop-safe: <reason> [ annotation text ] ##
      ```

