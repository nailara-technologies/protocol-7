         - src/radio.connect line 114

      4. **sysread/syswrite loops with non-blocking mode**
         - src/coding.async.http_client lines 125-137
         - src/coding.handler.drain_pipe (safe: pipe watcher context)

      5. **Regex buffer loops with advance guarantee**
         - src/coding.handler.http_io (saves headers, parses SSE)
         - src/coding.handler.http_io_parse_line

      6. **Watcher callback loops with cancel**
         - src/base.list.subroutines:clear_from_disk
         - src/base.referenced_subroutines:clear_from_disk
         - Pattern: watcher->cancel before continuing

  - static: |
      ## red flags requiring consensus verification ##

      The following loop patterns should trigger consensus_query(mode: verify):

      1. **while(1) or while($var) with no event.once inside**
         - Classic tight spin
         - Verify: is there ANY yield mechanism?

      2. **LWP blocking calls in while loops**
         - src/coding.handler.process-queued-task line 204 suspected
         - Verify: is this in forked child? async replacement available?

      3. **Polling loops with very short intervals (< 0.001s)**
         - Could cause event loop starvation even with event.once
         - Verify: is minimum interval enforced?

      4. **Regex loops without length check**
         - Could spin if regex doesn't advance
         - Verify: does regex have advance guarantee?

      5. **while loops in init_code or startup paths**
         - May be acceptable but verify event loop not active

