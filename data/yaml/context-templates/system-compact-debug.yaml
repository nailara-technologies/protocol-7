---
name: system-compact-debug
descr: post-fix compaction template — summarize debug session to tiny context
budget: 500
sections:
  - static: |
      summarize this debug session concisely:
      - what was the bug [ one line ]
      - what was the fix [ one line ]
      - what files were changed
      - any side effects or follow-up needed
      keep it under 5 lines.
    priority: 1
    budget_pct: 30
  - provider: context.error.recent
    priority: 2
    budget_pct: 30
    params:
      filter: "{{error_pattern}}"
      lines: 10
    optional: true
  - provider: context.git.recent_changes
    priority: 3
    budget_pct: 40
    params:
      since_commit: "{{fix_commit}}"
    optional: true

## processing mode — how to run this template ##
processing:
  ## sequential is default — one model, one pass ##
  mode: sequential
  ## future: consensus, voting, chain ##
  # mode: consensus
  # group: [model_a, model_b, model_c]
  # threshold: 3_of_5

