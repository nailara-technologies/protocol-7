---
name: code-review
budget: 4000
sections:
  - provider: context.style.guide
    budget_pct: 10
    priority: 1
  - provider: context.git.recent_changes
    budget_pct: 30
    priority: 2
    params:
      max_files: 5
      exclude_pattern: '^#,,'
  - provider: context.file
    budget_pct: 40
    priority: 3
    params:
      path: "{{target_file}}"
  - provider: context.task.active
    budget_pct: 10
    priority: 4
  - provider: context.error.recent
    budget_pct: 10
    priority: 5
    optional: true

