---
name: record-pattern
descr: record a learned pattern or rule for future tasks
sections:
  - static: |
      ## pattern recording ##
      
      you just learned something useful. record it so future tasks benefit.
      
      ## what to record ##
      
      - **error pattern** — mistake you made and how to avoid it
      - **success pattern** — approach that worked well
      - **convention** — naming, style, or structure rule discovered
      - **tool usage** — how to use a tool effectively
      - **workaround** — solution to a recurring issue
      
      ## where to record ##
      
      1. **task notes** — via note_write, tied to current task
         use for: specific findings, temporary workarounds
      
      2. **system prompt** — via editing coding.system_prompt
         use for: universal rules, behavior changes
         
      3. **context template** — create new template if pattern is reusable
         use for: complex workflows, multi-step guidance
      
      ## format for recording ##
      
      be concise. include:
      - what (the pattern/rule)
      - when (situation where it applies)
      - why (consequence of not following)
      - example (brief code or command sample)
      
      ## examples ##
      
      error pattern:
        "always validate_module before declaring complete.
         missed this on task X, had to fix syntax errors in follow-up."
      
      convention:
        "use qw| word | not qw() or qw// for quoted words."
      
      tool usage:
        "use read_module() for P7 modules, read_file() for other files."
    priority: 2
    budget_pct: 100
    label: pattern recording

