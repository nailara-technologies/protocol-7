---
name: inference-review
descr: context template for local model code review with awareness
budget: 2000
sections:
  - provider: context.style.guide
    budget_pct: 15
    priority: 1
  - provider: context.file.extract
    budget_pct: 50
    priority: 2
    params:
      path: "{{target_module}}"
  - provider: context.tree.summary.get-branch
    budget_pct: 20
    priority: 3
    params:
      branch: "{{awareness_branch}}"
      format: narrative
      time_range: ["-1 hour", "now"]
    optional: true
  - provider: context.error.recent
    budget_pct: 15
    priority: 4
    optional: true

