---
name: tasks-completed
descr: find completed coding tasks and verify against git history
budget: 3500
sections:
  ## recent git changes for cross-reference ##
  - provider: context.git.recent_changes
    priority: 1
    budget_pct: 15
    params:
      max_files: 7
    optional: true
    label: recent git changes

  ## scan instructions ##
  - static: |
      scan the live task backlog to find tasks that are actually DONE and
      should move from data/tasks/*.md into data/tasks/completed/.

      use list_files and read_file to examine every *.md file directly in
      data/tasks/ [ not the completed/ or needs-testing/ subdirs — those
      are already sorted ].

      a task file's own `## status` section is often STALE — it was written
      when the task was drafted and never updated after the work landed.
      do not trust it on its own. instead, for each task:
      - extract the module/zenka names and the core feature it describes
      - use search_code / ncode_search to check whether the described
        modules or handlers now exist and match the spec
      - cross-reference recent_changes / git log for commits whose message
        matches the task's subject (jobsite, x11, coding-zenka, etc.)
      - treat a task as done only when you find concrete evidence: a
        matching commit, or code that clearly implements the described
        behavior — not just "sounds plausible"

      output format:
      ## move to completed [ high confidence ] ##
      - task_name — one-line reason [ commit: hash if found ]

      ## possibly completed [ needs a human look ] ##
      - task_name — what evidence exists, what's missing to be sure

      ## still open ##
      - task_name — brief note if something looked partially done
    priority: 2
    budget_pct: 85
    label: task verification instructions

