---
name: module-header-normalization
descr: audit and fix module header convention violations
budget: 2500
sections:
  - static: |
      ## task: fix module header convention violations ##

      conventions:
      - ALL lines: maximum 78 characters
      - *.cmd.* and *.console.* modules: descr = max 55 characters
      - header format: ## [:< ## then # name = X, # descr = Y, # param = Z

      available tools:
      - module_convention_check — scan for violations
      - regex_replace_preview — preview diff before applying
      - regex_replace_apply — commit previewed replacement
      - regex_replace_undo — undo if something went wrong
      - perltidy — auto-format file

      process:
      1. run module_convention_check on the target path
      2. for each violation: preview fix, apply if correct
      3. re-run module_convention_check to verify
      4. call task_complete with summary

      the user message below specifies the target file or directory.
      start immediately by calling module_convention_check.
      do not ask for clarification. do not explain your plan. just execute.
    priority: 1
    budget_pct: 100
    label: header normalization

on_complete:
  - when: [output_contains=fixed]
    action: memory_update
    topic: "header-normalization"

