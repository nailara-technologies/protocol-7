---
name: summarize-events
descr: compress awareness tree events into higher-level summaries
budget: 1500
sections:
  - provider: context.tree.summary.get-branch
    budget_pct: 70
    priority: 1
    params:
      branch: "{{source_branch}}"
      format: events
      time_range: ["{{time_start}}", "{{time_end}}"]
      max_events: 50
  - provider: context.style.guide
    budget_pct: 10
    priority: 2
  - provider: context.tree.summary.get-branch
    budget_pct: 20
    priority: 3
    params:
      branch: "{{source_branch}}"
      format: summary
      time_range: ["-24 hours", "{{time_start}}"]
    optional: true

