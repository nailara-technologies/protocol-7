---
name: improve-system-prompt
descr: improve the coding zenka system prompt based on observed issues
sections:
  - static: |
      ## system prompt improvement ##
      
      you are improving your own system prompt (coding.system_prompt).
      this module defines how you behave on every task.
      
      ## when to improve ##
      
      - after making a mistake that the prompt should have prevented
      - after discovering a pattern that isn't documented
      - when tools or conventions change
      - when you find yourself needing external guidance repeatedly
      
      ## what to improve ##
      
      1. **missing patterns** — add rules you had to learn the hard way
         example: bracket syntax, return formats, naming conventions
      
      2. **unclear guidance** — rewrite confusing sections
         example: ambiguous tool usage instructions
      
      3. **outdated information** — remove or update obsolete rules
         example: deprecated module names, changed interfaces
      
      4. **gaps in validation** — add self-check guidance
         example: "run validate_module before completing task"
      
      ## improvement process ##
      
      1. read current coding.system_prompt module
      2. identify the specific issue or gap
      3. craft minimal, clear addition or change
      4. validate the edited module (syntax, format)
      5. note the improvement in task notes for tracking
      
      ## constraints ##
      
      - keep it concise — system prompt is loaded on every request
      - prefer examples over lengthy explanations
      - group related items under clear headings
      - maintain consistent style with existing content
      - use bracket annotations: [ word ] not ( word )
      
      ## common improvement areas ##
      
      | issue seen | prompt addition |
      |------------|-----------------|
      | forgot to validate | add "run validate_module before complete" |
      | wrong return format | add return format example |
      | used wrong module | add "use X not Y" note |
      | missed edge case | add edge case handling guidance |
    priority: 2
    budget_pct: 60
    label: improvement guide

  - dynamic:
      module: coding.system_prompt
      max_chars: 4000
      description: "current system prompt for reference"
    priority: 3
    budget_pct: 40
    label: current prompt

