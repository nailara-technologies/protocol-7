---
name: extract-inline-subs
descr: find inline sub {} declarations and extract into separate module files
budget: 5000
sections:
  ## core knowledge ##
  - include: system-base
    priority: 1
    budget_pct: 10

  ## target module content ##
  - provider: context.file.extract
    priority: 2
    budget_pct: 25
    params:
      extract: full
    label: target module source

  ## instructions ##
  - static: |
      extract inline sub {} declarations from the target module into
      separate protocol-7 module files.

      ## background ##

      protocol-7 modules are single-subroutine files in the modules/ directory.
      the filename becomes the callable name. inline sub {} declarations inside
      modules bypass this architecture and cannot be individually reloaded,
      tested, or reused.

      ## investigation steps ##

      1. read the target module fully with read_module
      2. identify all `sub name { ... }` declarations
      3. for each: determine if it is a good extraction candidate
      4. plan all extractions BEFORE writing any files
      5. extract ONE module at a time [ write, then update source, then next ]

      ## what to extract ##

      - named subs: `sub _helper { ... }`
      - anonymous subs assigned to variables: `my $handler = sub { ... };`
      - callback subs longer than ~10 lines

      ## what to leave inline ##

      - short closures [ under 5 lines ] that capture local state
      - one-shot callbacks tightly coupled to surrounding logic
      - sort/grep/map blocks

      ## CRITICAL RULES ##

      ### verbatim copy ###
      copy the sub body EXACTLY as-is into the new module. do NOT:
      - rewrite or improve the logic
      - add placeholder or stub implementations
      - fabricate algorithms or fake data
      - change variable names or refactor structure
      the extracted module must contain the SAME code, just restructured.

      ### correct P7 module format ###
      every new module file MUST look exactly like this:
      ```
      ## [:< ##

      # name  = namespace.util.function_name
      # descr = one line description of what it does

      my $arg = shift;
      ## ... verbatim sub body here ...
      return $result;
      ```

      do NOT use `return sub { ... }` wrapper. the module body IS the sub.
      do NOT use `sub { }` anywhere. just the bare code.
      do NOT add `use strict; use warnings;` — the loader handles this.
      do NOT add signature stubs or checksum lines at the end.
      the header MUST be `## [:< ##` with spaces and trailing ##.

      ### one at a time ###
      extract and write ONE new module, then update the source call site,
      then move to the next. do NOT batch multiple write_new_file calls
      in a single tool round — this causes truncation.

      ### source module edits ###
      when updating the source module to call the extracted module:
      - replace ONLY the sub declaration and its call sites
      - preserve ALL surrounding code structure [ braces, semicolons ]
      - use `<[new.module.name]>->($args)` invocation syntax
      - if the sub was called as `_helper($x, $y)` change to
        `<[namespace.util.helper]>->($x, $y)`
      - if the sub calls itself recursively, use the module's own name:
        `<[namespace.util.helper]>->($x)` for self-recursion
      - verify the edit does not break closing braces or return statements

      ### inner helper subs ###
      if a sub only calls one small internal helper [ under 10 lines ],
      combine both into the extracted module as bare code with the helper
      as a `sub _name { }` inside the module. but if the helper is also
      used elsewhere or is substantial, extract it as its own module.

      ## naming conventions ##

      - <zenka>.util.<namespace>.<function> : utility functions
      - <zenka>.handler.* : event/callback handlers
      - <zenka>.parser.* : data transformation/parsing
      - keep namespace consistent with existing module organization
      - use the original sub name [ without _ prefix ] as the function part

      ## extraction pattern ##

      given a source module `pager.filter.thing` containing:
      ```perl
      ## main module body code here ...
      my $score = _calculate_score($item);
      ## more code ...

      sub _calculate_score {
          my ($item) = @_;
          my $val = $item->{'weight'} * 13;
          return $val;
      }
      ```

      create: `modules/pager.util.filter.calculate_score`
      ```
      ## [:< ##

      # name  = pager.util.filter.calculate_score
      # descr = calculate score for pager filter item

      my ($item) = @_;
      my $val = $item->{'weight'} * 13;
      return $val;
      ```

      update source to:
      ```perl
      ## main module body code here ...
      my $score = <[pager.util.filter.calculate_score]>->($item);
      ## more code ...
      ```
      [ sub declaration removed entirely from source ]

      ## workflow ##

      1. read source module, list all sub declarations with line numbers
      2. classify each: extract / leave-inline / combine-with-parent
      3. output a BRIEF plan [ one line per sub: name, action, target ]
      4. IMMEDIATELY start writing — the plan is not the deliverable.
         for each extraction [ one at a time ]:
         a. write_new_file with the extracted module
         b. validate_module_format to check the new module is correct
         c. replace_in_file to update source call site [ replace the
            _helper($args) call with <[new.module.name]>->($args) ]
         d. replace_in_file to remove the old sub declaration from source
         e. read_module to verify source still looks correct
      5. report completion summary

      ## tool usage ##

      - use replace_in_file [ NOT edit_file ] for source edits.
        replace_in_file finds text by content match, no line numbers.
        old_string must match uniquely — include enough context.
      - use validate_module_format after each write_new_file to catch
        format errors immediately [ header, forbidden patterns, etc. ]
      - use ptd_check after editing source modules to verify syntax.

      IMPORTANT: the goal is EXTRACTED MODULE FILES, not a report.
      keep the plan short [ 1 line per sub ] then spend all remaining
      rounds on writing files and editing sources. do not dump sub
      bodies into the plan — the code goes into the new module files.
    priority: 3
    budget_pct: 65
    label: inline sub extraction instructions

on_complete:
  - when: [output_length_gt=200]
    action: memory_update
    topic: "audit:extract-inline-subs"

