---
name: bug-fix
budget: 4000
sections:
  - provider: context.error.recent
    budget_pct: 20
    priority: 1
    params:
      filter: "{{error_pattern}}"
  - provider: context.task.active
    budget_pct: 10
    priority: 2
  - provider: context.file
    budget_pct: 50
    priority: 3
    params:
      path: "{{target_file}}"
  - provider: context.git.recent_changes
    budget_pct: 20
    priority: 4
    params:
      since_commit: "HEAD~5"

