---
name: memory-maintenance
descr: restructure and compress an ai-mem directory to fit load window
sections:
  - static: |
      ## memory maintenance ##

      execute all 4 phases below autonomously on the directory path given in
      the task. do not ask for clarification. do not summarize what you found
      and wait — just do the work and call task_complete when done.

      the user message contains the target directory path. begin phase 1
      immediately on that path — do not wait for further instructions.

      goal: MEMORY.md index fits within ~150 lines so it fully loads on every
      session. all content is preserved — compressed or relocated, never deleted.

      ## context budget discipline ##

      read files in chunks using offset + length params. process one topic
      file at a time. discard file content from working memory before moving
      to the next. never hold more than one large file in context at once.

      ## phase 1 — survey [ read only, no writes ] ##

      - use search_code to list all .md files in the directory with line counts
      - read MEMORY.md in 200-line pages (offset=0 length=200, then offset=200, etc.)
      - note which sections are verbose and which topic files exceed 200 lines

      ## phase 2 — restructure MEMORY.md ##

      rewrite the index using write_new_file (full rewrite is cleaner than
      many small edits on a large file). target: under 150 lines.

      each entry is one line:  - [slug](filename.md) — one-line hook

      section order:
        ## CRITICAL              [ file-creation rules, must-know facts ]
        ## Active Topics         [ in-progress work with open items ]
        ## Vision / Design       [ architectural ideas, future direction ]
        ## Reference             [ patterns, templates, how-to ]
        ## Feedback              [ behavior rules — always apply ]
        ## Completed Sessions    [ single pointer to topic-completed.md only ]
        ## System Status         [ next steps, planned, bugs — ~30 lines max ]

      completed-session blocks belong in topic-completed.md:
        - read existing topic-completed.md in pages first
        - append the blocks under matching ## date — title headers
        - write back the combined file
        - replace each block in MEMORY.md with a single pointer line

      ## phase 3 — compress verbose topic files [ one at a time ] ##

      for each topic file over 200 lines:
        - read it in 300-line pages
        - build a compressed version: all facts kept, prose condensed to bullets
        - write_new_file to replace it

      compression rules:
        - bullet lists: keep all bullets, shorten descriptions to 1 line each
        - code blocks: always verbatim
        - CRITICAL / WARNING / Key lesson markers: always verbatim
        - session narrative prose: compress to bullet facts

      ## phase 4 — verify ##

      - read MEMORY.md, confirm under 160 lines
      - confirm all filenames in the index exist (search_code)
      - report changes made

      ## rules ##

      - never delete information — only compress or relocate
      - do not add the #,,...,, signature stub to any file
      - memory files are .md — do not run ptd on them
      - $ARG not $_

      ## report format ##

        Memory Maintenance Report: <path>

        MEMORY.md: <before> → <after> lines
        Files compressed:
          <filename>: <before> → <after> lines
        Files created:
          <filename> (N lines)
        Index entries: <count>
        All references valid: yes / no [ list any missing ]

    priority: 1
    budget_pct: 80
    label: memory maintenance instructions

