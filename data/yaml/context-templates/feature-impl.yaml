---
name: feature-impl
descr: implement a new feature or module from a task description
budget: 4000
sections:
  - provider: context.memory.load
    budget_pct: 10
    priority: 1
    params:
      topics: "{{related_topic}}"
  - provider: context.modules.list
    budget_pct: 10
    priority: 2
    params:
      namespace: "{{similar_namespace}}"
  - provider: context.file
    budget_pct: 25
    priority: 3
    params:
      path: "{{reference_implementation}}"
  - provider: context.task.active
    budget_pct: 8
    priority: 4
  - provider: context.style.guide
    budget_pct: 12
    priority: 5

  - static: |
      ## round budget: aim for 20-30 tool rounds ##
      ## ~8 rounds investigating, ~15 writing, ~3 verifying ##
      ## call task_complete when modules are written and verified ##

      ## writing modules ##

      use write_new_file to write each module to disk.
      do NOT return code in the response — write it directly to the file.
      one module per write_new_file call.

      if running as a subtask [ parent task exists ]:
        use subtask_spawn to delegate each write to a child task.
        the parent will receive all results and verify them.
        this improves reliability — write one module per subtask.

      ## core subs — do NOT search for these as files ##

      some subs are built into bin/Protocol-7 and have no module file:
        <[base.ntime.b32]>    — current time as base32 string
        <[base.time]>->(3)    — current unix time with precision
        <[base.logs]>         — logging [ always available ]
        <[base.s_warn]>       — warning logger

      if read_file returns "file not found" for a base.* module,
      it is a core sub — use it directly without reading its source.

      ## p7 module format ##

      every module file must start with:
        ## [:< ##
        # name  = module.name.here
        # descr = brief description [ max 55 chars ]

      do NOT add `#,,.,,,...` at end — leave clean, signing adds footer.

      ## cmd module pattern [ task.cmd.*, cube.cmd.*, etc ] ##

      cmd modules receive the call context via $call — NOT $args:
        my $id  = $call->{'args'} // '';           [ plain string args ]
        my $val = $call->{'param'}->{'field'} // ''; [ structured params ]

      return format:
        { 'mode' => 'true',  'data' => $result }  [ success ]
        { 'mode' => 'false', 'data' => $reason }  [ failure ]
        { 'mode' => 'size',  'data' => $list_str } [ list output ]

      ## p7 data key syntax ##

      dotted keys in %data use parser-expanded form:
        CORRECT : <key.sub>->{$id}
        WRONG   : $data{'key.sub'}{$id}

      module calls with args:
        CORRECT : <[module.name]>->($arg)
        CORRECT : <[module.name]>  [ zero args — no ->() needed ]

      ## tool parameter reference ##

      write_new_file:
        path: "modules/name.here"
        content: "## [:< ##\n# name  = ..."

      validate_module_format:   [ tool name is validate_module_format ]
        name: "module.name.here"    [ module name, not file path ]

      ptd_check:
        path: "modules/name.here"   [ file path, not module name ]

      read_file:
        path: "modules/name.here"
        [ optional: offset, length for large files ]

      call validate_module_format at most once per module.

      ## p7 style ##

      - $ARG not $_ in map/grep/foreach
      - <[base.logs]>->( N, fmt, args ) for logging
      - lowercase comments, [ word ] bracket annotations
      - no use statements, no pragmas in modules
    priority: 6
    budget_pct: 35
    label: feature-impl instructions

