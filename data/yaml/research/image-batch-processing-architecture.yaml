---
error_handling:

  image_analysis_failures:
    on_llm_api_error: |
      - Log to error_log: { timestamp, image_path, error_type: "llm_api", reason: "..." }
      - Mark job as failed in batch_queue
      - Continue with next image
      - Option: retry logic (configurable retries)

    on_invalid_response: |
      - Log to error_log: { ..., error_type: "parse_error", reason: "invalid JSON" }
      - Mark job as failed
      - Continue with next image

    on_image_missing: |
      - Log to error_log: { ..., error_type: "file_not_found" }
      - Mark job as failed
      - Continue

  child_process_crashes:
    on_child_exit_nonzero: |
      - Detect via SIGCHLD handler
      - Log to error_log: { timestamp, child_pid, image, exit_code, reason }
      - Mark job as failed
      - Optionally retry (respawn child)
      - Continue with queue

    on_timeout: |
      - Parent tracks child start time
      - If no result after timeout (configurable, e.g., 60s):
        - Kill child process
        - Log timeout error
        - Mark job as failed
        - Continue

  file_operation_failures:
    on_copy_failure: |
      - Log to action_log and error_log
      - Continue (don't block batch)
      - Record in operation_log: "rule applied, but action failed"

    on_permission_denied: |
      - Log with details (user, path, permissions)
      - Mark image for manual review
      - Continue

  batch_level_failures:
    on_source_dir_missing: |
      - Fail immediately
      - Return error to requestor
      - Log and exit

    on_invalid_config: |
      - Validate config at start
      - Return error (no batch_id)
      - Log to error_log

---
monitoring_and_debug:

  what_admin_can_query:
    list_job_queue: "list job_queue"
    list_operations: "list operation_log"
    list_errors: "list error_log"
    list_actions: "list action_log"
    batch_status: "image-batch.status"
    child_status: "image-quality.child:PID.status"

  progress_tracking:
    query: "image-batch.status"
    returns: |
      {
        batch_id: "batch_2025_12_07_001",
        status: "running",
        statistics: {
          total_images: 1000,
          analyzed: 456,
          pending: 544,
          failed: 3
        },
        current_operation: {
          image_path: "/data/batch/img_123.jpg",
          stage: "analyzing",
          progress_percent: 45.6,
          child_pids: [12345, 12346, 12347]
        },
        eta_seconds: 1234
      }

  debugging_checklist:
    - "[ ] list operation_log: See major milestones"
    - "[ ] list error_log: See what failed and why"
    - "[ ] list action_log: See file operations performed"
    - "[ ] image-batch.status: Check progress and current operation"
    - "[ ] Check /var/log/image-batch.log (if persisting logs)"
    - "[ ] image-quality.child:PID.status: Check child analyzer state"

---
example_batch_config:
  filename: "batch_high_quality_archive.yaml"
  content: |
    batch:
      id: "archive_2025_12_07"
      source_directory: "/data/generated_images"
      pattern: "*.jpg"

    analysis:
      metrics: ["composition", "lighting", "artifacts", "relevance"]
      confidence_threshold: 0.85

    quality_tiers:
      A: { score_min: 0.90, description: "Premium archive" }
      B: { score_min: 0.75, description: "Standard archive" }
      C: { score_min: 0.50, description: "Lower tier" }
      D: { score_min: 0.0,  description: "Reject" }

    rules:
      - condition: "quality_score > 0.90"
        action: "copy_to"
        target_dir: "/archive/premium"
        metadata_file: true

      - condition: "quality_score > 0.75 AND quality_score <= 0.90"
        action: "copy_to"
        target_dir: "/archive/standard"
        metadata_file: true

      - condition: 'has_artifact("compression")'
        action: "scale_down"
        output_dir: "/optimized"
        params:
          width: 1920
          quality: 85

      - condition: "quality_score < 0.50"
        action: "move_to"
        target_dir: "/rejected"
        log_reason: true

---
estimated_module_count: 20
  image-quality: ~6 modules
  image-batch: ~14 modules
  (can be iterated without complete rewrite)

notes:
  - "Architecture leverages existing list, buffer, fork, and event systems"
  - "Uses YAML for batch config and template system for prompts"
  - "Separation into two zenki enables parallelization"
  - "All operations are observable via lists and status commands"
  - "Error handling built-in from the start"
  - "No custom infrastructure - uses Protocol-7 baseline"

