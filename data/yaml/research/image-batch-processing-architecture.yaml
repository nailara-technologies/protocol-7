---
# Image Batch Processing Architecture & Implementation Plan
# Comprehensive specification for image quality analysis and batch operations
# Based on: zenki-creation-requirements.yaml patterns
# Version: 2025-12-07

project: Protocol-7
feature: Image Batch Processing System
zenki_involved: ["image-quality", "image-batch"]
status: Architecture Design Phase

overview: |
  Distributed image quality analysis system with conditional file operations.
  Two separate zenki with clear separation of concerns:

  1. image-quality: Analyzes individual images, returns quality metrics
     - On-demand (started when needed)
     - Stateless analyzer
     - Forkable for parallelization

  2. image-batch: Orchestrates batch processing workflow
     - On-demand (started with batch command)
     - Manages child processes (image-quality children)
     - Executes conditional file operations based on analysis
     - Maintains audit trail and progress tracking

---
data_structures:

  image_quality_metrics:
    schema: |
      {
        image_path: "/path/to/image.jpg",
        analysis: {
          composition: { quality: 1-5, factors: [... detailed breakdown] },
          lighting: { quality: 1-5, brightness: float, contrast: float },
          artifacts: { compression: bool, noise: bool, blur: bool },
          relevance: { score: 1-5, confidence: float },
          technical: { resolution: "WIDTHxHEIGHT", format: "JPEG", size_mb: float }
        },
        quality_score: 0.0-1.0,    # Computed aggregate
        grade: "A"|"B"|"C"|"D",    # Quality tier
        analyzed_at: timestamp,
        analysis_duration_ms: integer
      }

  batch_configuration:
    yaml_format: |
      batch:
        id: "batch_2025_12_07_001"
        source_directory: "/path/to/images"
        pattern: "*.jpg"  # Optional filter

      analysis:
        metrics: ["composition", "lighting", "artifacts", "relevance"]
        confidence_threshold: 0.8

      quality_tiers:
        A: { score_min: 0.85, description: "Archive quality" }
        B: { score_min: 0.70, description: "General use" }
        C: { score_min: 0.50, description: "Low quality" }
        D: { score_min: 0.0,  description: "Reject" }

      rules:
        # Conditional file operations based on analysis results
        - condition: "quality_score > 0.85"
          action: "copy_to"
          target_dir: "archive/high_quality"
          metadata_file: true

        - condition: "quality_score < 0.5"
          action: "move_to"
          target_dir: "rejected"
          log_reason: true

        - condition: 'has_artifact("compression")'
          action: "scale_down"
          output_dir: "optimized"
          params:
            width: 1920
            quality: 85
            format: "JPEG"

        - condition: 'grade == "C"'
          action: "tag"
          tags: ["low_quality", "review_needed"]
          update_sidecar: true

  batch_state:
    structure: |
      {
        batch_id: "batch_2025_12_07_001",
        status: "running|completed|failed|paused",
        timestamps: {
          created: timestamp,
          started: timestamp,
          last_update: timestamp,
          completed: timestamp (if finished)
        },
        statistics: {
          total_images: integer,
          analyzed: integer,
          pending: integer,
          failed: integer,
          quality_distribution: { A: count, B: count, C: count, D: count }
        },
        current_operation: {
          image_path: "current file",
          stage: "analyzing|copying|scaling|tagging",
          progress_percent: 0-100,
          child_pids: [list of active analysis children]
        }
      }

---
zenka_specifications:

  image_quality:
    type: "on-demand service"
    purpose: "Stateless image analyzer - analyze single images"

    deployment:
      scope: "on-demand"
      restart_policy: "enabled"
      heartbeat: "enabled (if parent manages)"
      idle_timeout: "300s"

    commands:
      analyze:
        input: |
          {
            image_path: "/path/to/image.jpg",
            config: { metrics: ["composition", "lighting", "artifacts"] },
            return_format: "json"
          }
        returns: |
          {
            success: boolean,
            image_path: string,
            analysis: { ... detailed metrics ... },
            quality_score: float,
            grade: string,
            analyzed_at: timestamp,
            duration_ms: integer
          }
        implementation: |
          1. Validate image path exists and is readable
          2. Prepare system prompt using template with config
          3. Load image or send to vision model
          4. Call LLM vision API with template-rendered prompt
          5. Parse JSON response, compute aggregate quality_score
          6. Return structured result

      status:
        returns: |
          {
            ready: boolean,
            uptime_seconds: integer,
            analyses_completed: integer,
            last_analysis_duration_ms: integer
          }

    data_structures:
      <analysis_cache> = {};     # Optional: cache recent results
      <operation_log> = [];      # What was analyzed when
      <error_log> = [];          # Analysis failures

    lists:
      operation_log:
        mask: "timestamp:time image_path:file grade:letter duration:ms"
        filter: { duration: "base.parser.duration_str" }
        descr: "[operations] images analyzed"

      error_log:
        mask: "timestamp:time image_path:file error:reason"
        descr: "[errors] analysis failures"

    module_structure: |
      modules/
        image-quality.init_code
        image-quality.analyze
        image-quality.status
        image-quality.helper.prepare_prompt
        image-quality.helper.parse_result
        image-quality.helper.compute_grade

  image_batch:
    type: "on-demand orchestrator"
    purpose: "Manage batch processing workflow, delegate analysis to children"

    deployment:
      scope: "on-demand"
      restart_policy: "disabled"  # One-off job runner
      heartbeat: "disabled"

    commands:
      process:
        input: |
          yaml_file_path: "/path/to/batch_config.yaml"
        returns: |
          {
            success: boolean,
            batch_id: string,
            status: "started",
            statistics: { ... initial counts ... },
            message: "Batch processing started"
          }
        implementation: |
          1. Parse YAML config file
          2. Validate source directory and rules
          3. Discover images matching pattern
          4. Initialize batch_state, operation_log, error_log
          5. Fork child (image-quality) processes for analysis
          6. Enter monitoring loop:
             - Track child results as they complete
             - Update progress in batch_state
             - Log to operation_log
             - Execute conditional rules (copy, scale, tag)
          7. Aggregate results and return summary

      status:
        returns: |
          {
            batch_id: string,
            status: string,
            statistics: { total, analyzed, pending, failed, distribution },
            current_operation: { image, stage, progress_percent },
            eta_seconds: integer (estimated time remaining)
          }

      pause:
        returns: |
          { success: boolean, message: "Batch paused after current image" }
        implementation: "Stop forking new children, wait for current work, accept status queries"

      resume:
        returns: |
          { success: boolean, batch_id: string, message: "Batch resumed" }
        implementation: "Resume forking from paused position"

      cancel:
        returns: |
          { success: boolean, message: "Batch canceled, in-progress jobs terminated" }
        implementation: "Kill all child processes, log cancellation, finalize state"

    data_structures:
      <batch_queue> = [];              # [{ image_path, status, result, timestamp }, ...]
      <batch_state> = {};              # Current batch info and statistics
      <child_pids> = {};               # { pid => { image_path, started_at, ... }, ... }
      <operation_log> = [];            # Chronological record of operations
      <error_log> = [];                # Failed analyses, rule application errors
      <action_log> = [];               # What actions were taken (copy, scale, tag)

    lists:
      batch_state:
        mask: "batch_id:id status:state analyzed:count pending:count failed:count"
        descr: "[operations] active batch status"

      job_queue:
        mask: "image_path:file status:state grade:letter rule_applied:action result:ok"
        descr: "[operations] job queue and results"

      operation_log:
        mask: "timestamp:time action:op image:file status:state"
        descr: "[operations] major milestones"

      error_log:
        mask: "timestamp:time image:file error_type:type reason:msg"
        descr: "[errors] failed operations"

      action_log:
        mask: "timestamp:time image:file action:op source:file target:file"
        descr: "[actions] file operations (copy/move/scale/tag)"

    module_structure: |
      modules/
        image-batch.init_code
        image-batch.process           # Main orchestrator
        image-batch.status            # Query current state
        image-batch.pause
        image-batch.resume
        image-batch.cancel
        image-batch.child
        image-batch.helper.load_config
        image-batch.helper.discover_images
        image-batch.helper.spawn_analyzers
        image-batch.helper.aggregate_results
        image-batch.helper.apply_rules
        image-batch.operator.copy_to
        image-batch.operator.move_to
        image-batch.operator.scale_down
        image-batch.operator.tag
        image-batch.callback.child_complete
        image-batch.callback.child_error

---
workflow_sequence:

  user_initiates_batch:
    command: |
      image-batch.process /path/to/batch_config.yaml
    cube_routes_to: "image-batch zenka (starts on-demand if needed)"

  image_batch_startup:
    1. "base.init_code loads modules and infrastructure"
    2. "image-batch.init_code initializes data structures and lists"
    3. "image-batch.process handler receives YAML path"
    4. "Parses config with base.yaml.parse"
    5. "Discovers images: find /source -name '*.jpg'"
    6. "Initializes batch_state with total count"
    7. "Logs 'batch started' to operation_log"
    8. "Returns immediate response: batch_id, status='started'"

  parallel_analysis_phase:
    1. "For each image (or up to max parallel children):"
    2. "  - Fork child process (base.fork, runs image-quality analyzer)"
    3. "  - Register child with v7 (base.callback.report_children)"
    4. "  - Record in <child_pids> hash: { pid => { image, started_at, ... } }"
    5. "  - Update <batch_state>.current_operation with new image"
    6. "Main loop (non-blocking):"
    7. "  - Check for child completion (SIGCHLD, waitpid)"
    8. "  - On child complete: receive analysis result"
    9. "  - Update <batch_queue> entry with result"
    10. "  - Call <[image-batch.callback.child_complete]>->(result)"
    11. "  - Continue accepting status queries from parent"
    12. "  - Can accept pause/resume commands mid-batch"

  conditional_operations_phase:
    1. "As analysis results arrive, evaluate rules:"
    2. "  - Parse condition expression (quality_score > 0.85, has_artifact, etc.)"
    3. "  - If matches, execute action:"
    4. "    - copy_to: <[image-batch.operator.copy_to]>->(image, target_dir)"
    5. "    - move_to: <[image-batch.operator.move_to]>->(image, target_dir)"
    6. "    - scale_down: <[image-batch.operator.scale_down]>->(image, config)"
    7. "    - tag: <[image-batch.operator.tag]>->(image, tags)"
    8. "  - Log to action_log: what happened, source, dest, result"
    9. "  - On error: log to error_log, continue with next image"

  result_aggregation:
    1. "When all images analyzed:"
    2. "  - Compute final quality_distribution"
    3. "  - Count success/failed rules"
    4. "  - Generate summary report"
    5. "  - Log 'batch completed' to operation_log"
    6. "  - Write final batch_state to persistent storage"
    7. "  - Return final result to requestor"

