## syntax as load-bearing primitive

convention is not decoration. it is computation:

```
decorative convention:   consistent style → easier to read
load-bearing syntax:     consistent style → semantic work done by structure
                         the convention IS the implementation
```

examples in protocol-7:
- dot-notation namespaces: routing is implicit in the name, not explicit in code
- `<[module.name]>` invocation: callable from the name itself, no lookup required
- `.:[ ]::[ ]:.` frame idiom: structural validation encoded in the visual form
- harmonic checksums: integrity verification is a property of the address
- division by 13: truth is a property of the number, not an assertion about it

in each case, the syntax does work that would otherwise require explicit code.
the convention reduces the code needed to express the same intent.

