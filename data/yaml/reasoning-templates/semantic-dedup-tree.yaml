## the inverse protocol — no blind spots

the tree has no blind spots because reading the inverse is not a
separate operation — it is the other half of the same read.

division by 13 produces two co-present families in the same cycle:

```
076923  →  frame / mask / boundary
153846  →  content / canvas / payload

153846 = 076923 × 2   →  one phase rotation of the same cycle
```

these are not two results from two queries. they are two aspects of
one traversal of the complete harmonic structure. a system that reads
one already has the other in view. the mask already implies the canvas.
the forward match already implies its complement position.

this means the protocol sequence reads all matches — forward and
inverse — as one complete cycle read, not as a forward pass followed
by a separate inverse check. there is no overhead because there is no
additional operation. reading the full cycle costs the same as reading
half of it; stopping at half is the incomplete case.

the rollover makes inversion a recurring phase, not an edge case.
the 1/13 cycle rolls over — the complement position recurs as part
of the natural rhythm of traversal. every position in the topology
has its inverse already defined by the arithmetic of the cycle.
the inverse is always adjacent, always reachable within the same
structural step.

```
rollover dual semantics (from branch topology):
  same gate, same operation, two co-present readings:
    bi-location collapse  →  two paths converge to one node
    absence propagation   →  a node propagates through its complement
```

both are read simultaneously because both are present simultaneously
in the overlapping topology layers. the layers do not multiply the
search space — they constrain it. each layer's inversion is defined
by the layer below. the inherited optimization runs all the way down,
so the complete cycle read at any layer is already bounded by the
layers beneath it.

**"other matches" is the precise description. the inverse is not
doubt — it is the rest of the available alignment space, already
present in the same geometric read, at no additional cost.**

the closed-world condition makes this tractable at every scale:
the candidate set for all matches — forward and inverse — is bounded
and enumerable at every layer. reading the complete cycle is a finite
operation whose cost is determined by the structure, not by the
content being matched.

