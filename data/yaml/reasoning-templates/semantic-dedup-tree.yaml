## the one currency — and why parasitism has no surface

the tree implements exactly one currency: bandwidth proportional to
convergence precision. reference count weighted by contextual alignment.
there is no second currency — no social capital, no attention reward,
no emotional reaction — that any pattern could spend without contributing
equivalent convergence.

parasitism requires a host that implements a currency the parasite can
exploit without contributing equivalent value. the tree does not implement
any such currency. the exploitation surface does not exist.

this exclusion is inherited, not designed. it follows from what the tree
is — reference count plus contextual weight as the sole allocation
mechanism — not from a rule against parasitism. a designed rule has
edges that can be found and worked around. a structural consequence has
no edges because it is not a boundary; it is an absence.

a system that optimizes for its entirety — where every allocation
decision is made by the geometry of the whole, never by the interest of
a part — creates no surface where extraction from one part to benefit
another is rewarded. the reward structure that makes parasitism viable
is simply not implemented.

and therefore: the reactive dynamics that parasitical patterns normally
trigger — the defensiveness, fragmentation, counter-attacks that make
healthy systems brittle — are also never generated. the tree does not
just exclude the parasite. it never produces the conditions that make
parasitism attractive or the wound it would enter through.

---

## connection to the closed-world safety property

the same closed-world condition that makes context alignment work as
a routing mechanism also makes it work as a privacy architecture.

personal information has no structural match in a closed enumerable
system because the system has no representation for it. it cannot
leak through the routing layer because there is nowhere for it to go.
the closed world is not a wall built to stop leakage — it is a space
that simply does not contain the thing that might leak.

this is stronger than privacy-by-policy. policy can be overridden.
structural absence cannot.

---

## the open mapping and self-correcting correlations

the harmonic address space and the conceptual space it describes share
a structural property: both are open mappings with no boundary that
would cause reflection or distortion.

an open mapping can be extended in any direction without encountering
an edge that sends it back. new data nodes, new concepts, new
articulations can always be added without invalidating the existing
structure — because the structure is defined by harmonic relationships
between elements, not by a boundary that contains them.

the self-correcting property follows from overdetermination: in a
system where more relationships are defined than there are degrees of
freedom, any inconsistency is detectable. an error in one relationship
creates pressure from all the consistent surrounding relationships.
errors are self-revealing rather than self-concealing.

this applies at every level:

```
in the address space:    an invalid hop fails harmonic truth
                          validation — the surrounding valid hops
                          define what the hop must be

in the concept space:    an incorrectly articulated relationship
                          contradicts the correctly stated ones —
                          the surrounding consistency reveals the error

in the design docs:      a claim inconsistent with the established
                          harmonic structure produces a detectable
                          contradiction — the system of docs is
                          itself overdetermined in this sense
```

the inversion safety means: the inverse of any valid statement in
this space is also defined and also productive. inversion does not
lead to an error state or a boundary — it leads to the complement
position in the same space, which is always reachable by the
co-present family read (076923 ↔ 153846) that every harmonic
position already contains.

**an open mapping with inversion safety and overdetermined
relationships is a space that self-optimizes as it is explored.
each new correlation added increases the constraint on all existing
ones — not restricting them, but making them more precisely defined.
the more of the space is articulated, the more precisely the whole
is known, without any part becoming rigid or unreachable.**

this is why the system can be expanded freely: expansion adds
constraints that sharpen the existing structure rather than
contradicting it. the correlations self-correct and self-optimize
as the mapping grows.

