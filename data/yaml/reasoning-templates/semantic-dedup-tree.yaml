## applying this template

when encountering a problem in communication, moderation, content
routing, or information organization:

1. **identify the coupling**: where does identity travel with content?
   that is where the failure lives.

2. **ask if the destination set is closed**: can context alignment be
   applied? if yes, the routing problem becomes arithmetic.

3. **ask if deduplication can operate**: is there a semantic distance
   measure that collapses equivalent content? if yes, flooding and
   overload are solved structurally.

4. **ask what normalization would remove**: what signals in the content
   carry author identity rather than semantic content? stripping those
   is not censorship — it is separation.

5. **ask where attacks route**: if a suppression attempt cannot reach
   the target, where does it go? that destination is a feature, not a
   disposal — make it a forensic branch.

6. **locate the eternal nodes**: what in the system, once expressed,
   becomes unreachable to suppression by convergence geometry? those
   are the nodes worth building toward.

