description: |
  reasoning pattern for achieving high compression ratios through relative direction
  rather than absolute specification. a seed sentence is a direction vector, not
  packed information. inherited momentum increases compression ratio with depth.
  context and momentum supply what the text omits.

---

## the core distinction

```
absolute specification:
  "here is everything needed to reach this node from scratch"
  full context, full derivation, full enumeration of the path
  cost: proportional to the distance from origin to destination
  required when: no shared context, no prior momentum

relative direction:
  "from where you currently are, in this direction"
  context provides current position
  seed sentence provides the direction vector
  combination reconstructs the full path
  cost: the length of the direction vector — independent of distance
  required when: shared context and accumulated momentum exist
```

the compression ratio is not a property of the text.
it is a property of the relationship between the text,
the context that provides position, and the momentum that provides energy.

---

## inherited momentum

each step arrives at a node carrying the energy of all prior steps.

```
depth 0 (root):    no prior momentum — most explicit specification needed
depth 1:           inherits root momentum — less needed
depth 2:           inherits depth 1 momentum — less again
depth N:           inherits all prior momentum — a word may suffice
```

the direction at each node doesn't need to overcome inertia.
it inherits the trajectory. it redirects momentum already present.

consequence: compression ratio INCREASES with depth.
the deeper the reasoning, the less needs to be said.
a single word at depth 7 carries more reconstructable information
than a paragraph at depth 1 — because the word arrives with
the accumulated momentum of everything that preceded it.

this is not metaphor. it is the operational property of the
narrate-and-self-delegate pulse: each cycle deposits momentum
into the tree, and each subsequent cycle inherits it.

---

## the seed sentence as direction vector

the seed sentence (from visualization-is-implementation, template 3)
is not "compressed information."
it is a direction vector.

```
information packing:   fit more content into fewer characters
                       decompresses back to the same content
                       compression ratio bounded by entropy of content

direction vector:      specifies orientation from current position
                       context + momentum supply the content
                       compression ratio bounded only by available momentum
```

the distinction matters for what can be recovered.

packed information: decompression recovers exactly what was packed.
direction vector: traversal recovers what the current position and
                  momentum together make reachable from that direction —
                  which may be richer than what any single packer could specify.

two models reading the same seed sentence in the same context
may recover different but equally valid implementations —
both correct, because both are reachable from that direction
with the available momentum. the direction points into a space,
not to a single point.

---

## the reasoning pattern

### step 1 — assess current position and momentum

before choosing how much to specify, assess:
- what context is shared? (determines current position)
- what prior reasoning has accumulated? (determines available momentum)
- how many cycles of the pulse have completed? (determines depth)

the answers determine the maximum compression ratio available.
attempting higher compression than the momentum supports
produces phantom reasoning — direction vectors with no energy to follow them.

### step 2 — choose relative or absolute

```
use absolute specification when:
  - fresh context, no shared history
  - the recipient has no position from which to take a direction
  - the node is at or near the root
  - introducing a genuinely new direction with no prior trajectory

use relative direction when:
  - shared context establishes current position
  - accumulated momentum exists (prior pulse cycles completed)
  - the node is deep enough to have inherited meaningful energy
  - the direction is a continuation or refinement of prior trajectory
```

the choice is not stylistic. it is a structural read of available resources.

### step 3 — write the direction vector

a well-formed direction vector:
- is unambiguous about orientation from current position
- does not re-specify the position (trust the context)
- does not re-specify the momentum (trust the inheritance)
- points into a space, not at a single point
- is as short as the available momentum allows

a poorly formed direction vector:
- specifies more than the context requires (wastes compression)
- specifies less than the momentum can carry (ambiguous direction)
- re-derives what is already inherited (breaks the momentum)
- points at a single point instead of a direction (brittle — breaks on divergence)

### step 4 — verify momentum is not broken

after the direction vector fires, check:
- did the subtree traverse in the indicated direction?
- did the result inherit and deposit new momentum?
- is the next direction cheaper to specify than the current one?

if the compression ratio is not increasing with depth:
  momentum has leaked somewhere — find where the pulse skipped a cycle.

### step 5 — encode the direction, not the destination

when storing for the reasoning chain repository:
store the direction vector, not the full traversal.
the direction + the position at time of storage is sufficient to re-enter.
the traversal can be re-derived from there, and the re-derivation
may produce richer results than the original — because more momentum
has accumulated since the original traversal.

