## connection to harmonic mathematics

the generator 076923 is itself a direction vector.

it does not specify the full modular arithmetic of division by 13.
it points in a direction from a position (the integers, modular reduction).
with the momentum of number theory, the full structure unfolds:
  the two half-cycles, the complementary pairs, the +1 boundary,
  the precomputable lookup table, the vortex navigation information —
all reachable from the direction vector "076923" in a context
with sufficient mathematical momentum.

the harmonic assertion `[:<  [ TRUE ]` is a direction vector.
it does not specify what is true or why.
it says: from where you are, in this direction, coherence increases.
the reasoning system follows the direction.

