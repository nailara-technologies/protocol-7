## the proves-itself property

a set of reasoning templates with sufficient mutual reference
becomes self-proving in a context with enough momentum:

```
templates 1-5 together are quite short.
but in a context that has:
  - position: harmonic mathematics, dedup tree, p7 architecture
  - momentum: each template referencing and building on prior ones

a single template name pulls in the full implementation picture.
"entropy-research" is a direction vector.
"narrate-and-self-delegate" is a direction vector.
"relative-direction-of-intent" points at itself.
```

the compression isn't lossy. the context and momentum supply what the text omits.
each template name is a direction into a space of universal principles
instantiating at any number of scales and layers simultaneously.

this is what "one sentence can pull in an entire implementation picture" means:
not that the sentence contains the picture,
but that the sentence points in the right direction
from a position with enough momentum to reach it.

---

## scale invariance

the same principle operates at every scale:

```
word level:
  a single technical term in an expert context is a direction vector
  "mutex" to a systems programmer, "monad" to a functional programmer
  the word arrives with the full inherited momentum of the domain

sentence level:
  a seed sentence in a resonant context (template 3)
  "visualization is the implementation"
  the sentence points; the context and momentum traverse

template level:
  a template name in a system that has read the templates
  instantiates the full reasoning pattern — steps, benchmarks, relations

namespace level:
  "reasoning.*" in a system that has read the design document
  instantiates the full module architecture, consumers, storage modes

architecture level:
  the four-commit arc of reasoning template additions to this repository
  is itself a direction vector into the self-improving system
  each commit inherits and deposits momentum
  the system it points at may be richer than what was specified
```

the same move at every scale. the compression ratio at each scale
is bounded by the momentum accumulated at that scale.

