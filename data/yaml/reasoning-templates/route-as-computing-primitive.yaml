---
name: route-as-computing-primitive
category: reasoning-template
version: 1.0
description: |
  the route is a universal organizing primitive for workload, context, and
  collection. by physical design, no route can clobber the resources of any
  other route. routes start light — pure transport or discovery — and expand
  through contextualization and handshaking into complex workload graphs.
  the zenki along a route are a perfect worker pool: freshly cached, minimum
  latency, auto-expandable, accessible in both directions. the computing
  pattern is: expand outward to organize components, then collapse inward
  back to the source — a tree collapse as a generic grid computing primitive.

---

## the isolation property — physical, not enforced

a route exists as randomized numerical references per hop. no two routes
share identifiers. no route can observe or interrupt the resources of any
other route. this is not a policy — it is the structure of the addressing:

```
route A:   hop 1 [R1a → R2a] → hop 2 [R3a → R4a] → destination
route B:   hop 1 [R1b → R2b] → hop 2 [R3b → R4b] → destination

R1a, R2a, R3a, R4a ≠ R1b, R2b, R3b, R4b  (randomized, independent)
```

this means the number of concurrent routes is not a resource contention
problem — it is a resource multiplication. each route is its own isolated
lane. adding routes adds lanes, not congestion.

---

## light-first expansion — the maturation sequence

a route does not begin as a workload. it begins as transport:

```
stage 0:  pure transport
          a packet moves from A to B along a path
          minimal state: randomized hop references only
          cost: near zero

stage 1:  discovery
          the route carries a query for context or capacity
          each hop can respond with what it knows (tree data, zenka status)
          the route is now a contextual probe

stage 2:  contextualization
          the route accumulates metadata about the path it traverses:
          which zenki are present, what capacity they hold,
          what tree data is accessible from each hop
          the route is now a map of available intelligence

stage 3:  workload attachment
          zenki along the route are assigned tasks
          the route is now a computation graph
          each node executes in parallel while the route stays open

stage 4:  complex mapping
          additional zenki join through handshaking at active hops
          the linear hop-to-hop path grows laterally into a tree
          the route is now an auto-assembling worker pool
```

each stage is additive. a route never needs to exceed stage 0 if transport
is all that is needed. the expansion is driven by the complexity of the
request, not by the infrastructure.

---

## zenki along the route as a worker pool

the hop-by-hop path produces the optimal worker pool by geometry:

```
latency:        each zenka on the route is freshly cached —
                the route was just traversed, so every hop address
                is in working memory. round-trip cost approaches zero.

directionality: the route is bidirectional by construction —
                the return path is implicit in the outward path.
                workers can report results back without establishing
                a new route.

isolation:      the worker pool is private to this route —
                no other request can recruit these workers
                or observe their intermediate state.

expandability:  any hop can recruit additional zenki through
                its own local connections. the pool grows
                as needed, attached to the already-open infrastructure.

hyperspace:     route hops sit close to the BMW384 hyperspace addressing
                layer — discovery of related data or additional capacity
                is near-zero-latency, addressed by content checksum
                rather than by traversal.
```

the pool has no setup cost. it exists because the route exists.
its size is bounded only by the requirement for complete request satisfaction.

---

## the outward-inward collapse — generic grid computing

the computing pattern this produces:

```
phase 1 — expansion (outward):
  source sends request outward along route
  each hop: receives partial problem, retains context, recruits workers
  workers execute in parallel at their positions along the route
  the route grows from linear path to tree of active participants

phase 2 — collection (inward collapse):
  workers complete their portion, return results inward along the same path
  each hop: receives results from children, aggregates with local result
  aggregated result continues inward toward source
  the tree collapses back to the linear path
  linear path collapses back to the source

result at source: fully assembled, from all participants, via the route
that organized them — no separate coordination infrastructure needed
```

this is map-reduce without a coordinator. the route IS the coordination.
the expansion IS the map phase. the collapse IS the reduce phase.
the infrastructure that transported the request also aggregated the result.

---

## single-track to multi-track — the handshaking expansion

a single-track route (A → B → C) expands through handshaking:

```
A → B → C         (initial route, single track)

at B: route carries context that B has capacity and related data
      B accepts workload attachment, recruits B1 and B2 locally
      B now manages: [route from A] + [workers B1, B2]

at C: similarly, C recruits C1
      C now manages: [route from B] + [worker C1]

expanded topology:
  A → B → C
      ↓ ↓   ↓
      B1 B2  C1

collapse:
  B1, B2 → B (aggregate) → A
            C1 → C (aggregate) → B → A
```

the expanded topology forms entirely through existing route infrastructure.
no new routing addresses are needed beyond the original linear path.
B and C are coordinators by position, not by appointment.

