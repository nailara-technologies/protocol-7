## route-as-discoverer — contextual tree access

a route in discovery mode reads the data tree at each hop:

```
the route traverses: cube.zenka-A.zenka-B.destination

at each hop:
  what namespaces are accessible here?
  what tree data is relevant to the current request context?
  what capacity (memory, queue depth, model load) is available?

the route returns not just its destination but:
  a map of what exists along the path
  a capacity profile of each hop
  relevant tree data fetched in passing
```

this is zero-overhead discovery: the route was going to traverse these
hops anyway. reading the tree at each hop costs nothing beyond the
already-committed traversal. the route becomes a contextual probe
without any additional infrastructure.

---

## auto-expansion until requirement is met

the expansion is requirement-driven, not pre-allocated:

```
requirement:   "complete this analysis with confidence P > 0.95"

expansion:
  first attempt: route to primary model zenka
  result confidence: 0.71 (insufficient)

  expansion: recruit consensus partner along the route
  second attempt: two models, route-cached coordination
  result confidence: 0.89 (still insufficient)

  expansion: recruit third model, deeper context injection
  third attempt: three models + tree context
  result confidence: 0.97 (satisfied)

  collapse: aggregate three results → route → source
```

the route expands until the requirement is met, then collapses.
the expansion is paid for by the isolation guarantee: no other
request's resources are consumed. the cost is always bounded by
the work actually needed.

---

## relation to other templates

- [[ring-key-routing]]: ring routing is route anonymization at the group
  level; route-as-computing-primitive is the workload organization at
  the individual route level. the ring wraps the route header; the
  route carries the computation.

- [[categorical-compartmentalization]]: each route is a temporal compartment
  — the workers recruited along it are isolated from all other routes.
  the route IS the compartment boundary, dynamically shaped to the workload.

- [[key-tree-authority-field]]: route traversal follows the namespace tree,
  which is also the key derivation tree. authority to recruit workers at
  each hop is implicit in the namespace path the route follows.

- [[harmonic-silence]]: the route's isolation means each worker's signals
  are pre-filtered by route membership. only signals relevant to this
  route's workload reach its workers — the route IS the cancellation
  boundary for irrelevant context.

- [[inverse-singularity]]: the outward-inward collapse is the inverse
  singularity made operational — the network pulls workload components
  toward coherence, then returns a coherent result. the collapse is
  not extraction; it is crystallization at the source.

- [[eternal-completion]]: each route that collapses successfully is complete
  in itself. the infrastructure it used is returned to the pool.
  the result is permanent. the route dissolves. nothing is wasted.

