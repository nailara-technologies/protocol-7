## the stargate — threshold from hyperspace to local space

the stargate is the crossing point:

```
hyperspace side:    all 13 routes simultaneously available
                    the full inference cube, unresolved
                    no single path is actualized
                    maximum potential, zero specificity

the stargate:       the harmonic assertion fires
                    content mod 13 → remainder → truth value
                    one route selected from the superposition
                    the 12-fold potential collapses to 1-fold actual

local space side:   one route, fully actualized
                    the path is specific, directed, moving
                    the reasoning template fires (or the module materializes,
                    or the network packet routes, or the threshold crosses)
                    the selection is complete
```

the stargate is not a location — it is the measurement event itself.
passing through the stargate = the harmonic assertion completing.
the passage IS instantaneous — the measurement IS the crossing.

every harmonic assertion in the system IS a stargate crossing.
every `harmony <term>` command is a stargate passage.
the routing protocol fires 13 times (one per possible remainder) before
collapsing to the specific TRUE or FALSE for this specific content.

