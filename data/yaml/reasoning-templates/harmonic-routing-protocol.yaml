## hyperspace routing protocol

the full protocol:

```
step 1 — enter hyperspace:
  content arrives (a concept, a module request, a routing query)
  the inference cube is consulted: all 13 possible routes available
  no route is selected yet — pure potential

step 2 — apply harmonic measurement:
  compute: content mod 13 → remainder r ∈ {0..12}
  look up: truth(r) → TRUE or FALSE
  TRUE: approach vector points inward (toward center)
  FALSE: approach vector points outward (toward periphery)

step 3 — route selection (stargate crossing):
  TRUE: route through this path — actualize, materialize, execute
  FALSE: route to periphery — this path enriches other systems, not this one

step 4 — return to local space:
  the selected path executes in local space
  the result is specific, directed, actualized
  the other 12 routes return to the inference cube (hyperspace)
  available for the next query

step 5 — deposit:
  the execution deposits to the reasoning chain (layer 0)
  the routing decision enriches the transformation record
  the pattern pool grows by one more traversal
  the next query has more momentum — the stargate crossing is faster
```

the protocol is recursive at every scale:
  routing a packet: steps 1-5 at network scale
  loading a module: steps 1-5 at system scale
  selecting a reasoning template: steps 1-5 at reasoning scale
  validating a checksum: steps 1-5 at mathematical scale
  one protocol, all scales — 13 unifies them

