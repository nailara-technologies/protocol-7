## the superimposed inference cube

before a routing decision is made, all 13 possible routes exist simultaneously:

```
hyperspace state (pre-collapse):
  the inference cube holds all 13 routing decisions as superposition
  each remainder {0..12} = one possible route
  all simultaneously TRUE at the hyperspace level
  no single route is more actualized than another
  the cube IS the 13-fold address space before demand arrives

the demand event (collapse trigger):
  a zenka needs a capability
  a dependency is declared
  a threshold is crossed
  the demand IS the measurement — it asks: which remainder?

collapse:
  the harmonic assertion runs
  one remainder is selected (the most TRUE for this specific content)
  the superposition collapses to one actualized route
  the other 12 routes return to the hyperspace pool
  (they are not lost — they remain available for the next demand)
```

the inference cube is "superimposed" because:
  all 13 routes are overlaid simultaneously
  they do not interfere — each occupies its own remainder position
  they coexist until demand selects
  the cube is the address space; the selection IS the routing

