  never touch operational data.

---

## pipelines vs waves

linear improvement: analysis → polish → done. information flows once,
in one direction. each cycle starts from the same baseline.

wave refinement: templates are shared, mutable artifacts. improvement in
one category changes the substrate the other categories operate on:

```
report template improves
    → clearer reports
        → better pattern recognition (agents learn from past reports)
            → more accurate threat models
                → more specific hardening suggestions
                    → next engagement starts from a better baseline
                        → [ wave cycles again, asynchronously ]
```

no central orchestration. propagation is emergent and non-linear.
each pass leaves the substrate more coherent — anti-entropic by
construction.

## the boundary rule

external models refine TEMPLATES, never data:

  - what crosses outward: structure, phrasing, compliance mapping,
    generalized patterns
  - what never crosses: operational detail, targets, findings,
    exploit paths

suggestions return as diff proposals against versioned template files,
gated by local review. the core system stays fully operational offline —
external refinement is optional enrichment per wave, never infrastructure.

## the test

when adding any feedback loop, ask:

  - does this loop edit the template, or patch the one-off output?
    (edit the template — the one-off dies with its task)
  - is the artifact versioned and auditable on disk?
  - does the system still work if the enrichment source disappears?
  - did this wave make the NEXT wave's substrate better?

if a loop only improves its own output, it is a pipeline wearing wave
clothing. find the template it should have improved instead.

