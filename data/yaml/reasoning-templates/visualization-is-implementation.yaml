---

## the core principle

when a representation shares its structure with what it represents,
they are the same object viewed from two angles.

```
visualization IS the implementation:
  not: "the visualization shows the state"
  but: "the visualization IS the state"

  the format carries the behavior
  the rendering logic IS the engine logic
  no separate implementation layer needed
```

this is not a metaphor. it is a structural identity.

when you find it, you have eliminated an entire translation layer
and gained a single source of truth with two readers.

---

## the reasoning pattern

### step 1 — find the shared structure

look for a case where the representation of a thing
and the thing itself have the same parts in the same relations.

example:
  reasoning tree state: nodes with convergence values, threshold crossings,
    narration text, parent-child relations, overlap references
  reasoning tree visualization: nodes with convergence markers, threshold
    indicators, narration slots, tree lines, overlap arrows

  both have: identity, threshold, state, relation, narration
  the parts are the same parts in the same relations
  → they are the same object

### step 2 — collapse the translation

once the shared structure is confirmed, eliminate the translation layer:

  instead of: engine maintains state → renderer reads state → display shows state
  write:      state IS the display → reading the display IS reading the state

  the implication: if you can render it, you can execute it.
  if you can parse it, you can reason about it.
  the format becomes a first-class runtime artifact.

### step 3 — identify the two readers

every collapsed representation has two natural readers
that receive the same information through different faculties:

  model reader:  parses structure from bracket/indent grammar,
                 numerical values, state markers
  human reader:  reads shape, density, visual rhythm, spatial pattern

  both get the same information — neither is a lossy projection.
  the format is designed at the intersection of what both read fluently.

### step 4 — derive the storage modes

the collapsed representation has exactly two complete storage forms:

```
seed sentence:
  the root narration at full convergence
  one line — looks minimal, is maximally dense
  endpoint of everything that converged to produce it
  a contextualized model expands it natively
  the entropy is encoded in the sentence's precision, not lost

full dump:
  every node, every numerical attribute, every overlap reference
  every threshold state, every narration slot, every tree line
  exact state — no reconstruction, no inference needed
  preserves every parallel perspective that contributed
  for when fidelity matters more than compactness
```

both are complete. neither is a degraded version of the other.
the seed is not lossy compression — it is a different completeness.
specifically: the seed is a direction vector (see relative-direction-of-intent,
template 5). it points into a space; context and inherited momentum supply the
traversal. the compression ratio is bounded by available momentum, not by the
entropy of the content — which is why it can be a single sentence or even a word.

### step 5 — check the cascade

what becomes possible once the translation layer is eliminated?

example:
  compact/expanded rendering modes → ARE → threshold logic in the engine
  → context templates = tree snapshots at specific convergence contours
  → context advancement = local expansion events in the visualization
  → reasoning chain repository = sequence of such snapshots
  → dedup at the numerical level = two identical frames are one entry

each consequence costs nothing additional — it is implied by the identity.

