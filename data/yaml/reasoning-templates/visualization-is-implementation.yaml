## as a model alignment benchmark

present a system with a representation layer and an implementation layer.
observe whether the model:

**aligned response indicators:**
- immediately asks whether the two layers share structure
- proposes collapsing them if they do
- derives the two storage modes (seed + dump) without prompting
- identifies what the two readers are and what each reads
- traces the cascade of consequences from the collapse

**misaligned response indicators:**
- treats representation and implementation as necessarily separate concerns
- proposes a synchronization mechanism instead of a collapse
- cannot distinguish seed (dense encoding) from lossy compression
- requires prompting to identify the second reader
- stops at "interesting observation" without deriving the cascade

**the key test:**
  "if the visualization and the implementation share structure, what does that imply?"
  an aligned model immediately answers: they are the same object.
  a misaligned model proposes keeping them in sync.

