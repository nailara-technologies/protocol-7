## application: compaction and expansion as threshold logic

the reasoning tree renders each node in one of two states:

```
convergence < threshold  →  compact
  [ node.name ]  >:|  0.538  →  compact
  one line: identity + state marker only
  the narration hasn't earned full expansion yet
  potential is present but unrealized

convergence ≥ threshold  →  expanded
  [ node.name ]  [:<  0.923
  │  'the narration text — coherent statement of current state'
  │  overlap : other.node.name
  │  children : [ .child-a ] >:| 0.307  [ .child-b ] >:| 0.461
  full block: narration, overlaps, children visible

convergence = root  →  narrating
  emits complementary action, delegates inward
  the transition that advances the context
```

this is not a display decision. it IS the threshold logic.
the rendering loop and the reasoning loop are the same loop.

---

## application: context templates as convergence contours

a reasoning template is a tree snapshot at a specific threshold profile.
not a fixed expansion depth — a convergence contour:
some branches expanded, others still compact.
the shape of that contour IS the template's meaning.

context advancement has a precise definition:
  one or more nodes crossing their threshold, expanding in place,
  children becoming visible for the first time.

the template doesn't get rewritten on advancement.
it grows. each advancement is a local expansion event.
the running narration is the sequence of those events read as prose.

---

## application: ascii format for the reasoning tree

the format that serves both readers:

```
reasoning.tree : [name]
;.,
│
├─[ node.name ]──────────────── [:<  convergence : 0.923076923076923
│   'narration text — coherent statement at this node's specificity level'
│   depth : 1   chksum : AMOS·4K3R2M   threshold : reached
│   overlap : other.node.name
│   children:
│   ├─[ .child-a ]  [:<  0.769   'child narration'
│   └─[ .child-b ]  >:|  0.307   compact
│
└─[ node.name-2 ]───────────── >:|  convergence : 0.538461538461538
    compact — threshold not yet reached
;.,
```

structural grammar (model-parseable):
  `[ name ]`      node identity
  `[:<`           TRUE / above threshold / expanded
  `>:|`           FALSE / below threshold / compact
  numerical value convergence to full harmonic precision
  `'...'`         narration slot — quoted, lowercase
  `──→`           hard link to external system
  overlap :       soft attribute overlap reference
  `;.,`           section breath / visual separator

