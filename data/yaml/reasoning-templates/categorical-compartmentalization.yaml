- [[topic-kimi-zenka-state-machine]]: a live, unprompted instance of this
  template's "prior cannot be destabilized until next is verified" rule,
  found and fixed 2026-08-04 in real running code (not designed toward
  this doc) — `kimi.wire.approval_respond`'s TOCTOU bug marked `prior`
  state (an approval as "responded") committed before `next` (the actual
  websocket send) was confirmed, so a `next` that should have been
  rejectable instead silently corrupted `prior`. the fix — commit `prior`
  only after `next` is confirmed — is this template's anti-crash property,
  independently arrived at under production pressure rather than design

