---
name: categorical-compartmentalization
category: reasoning-template
version: 1.0
description: |
  spatial and temporal compartmentalization as complements of a universal
  primitive: bounded regions with controlled permeability, where the boundary
  is the computational element. disentanglement protects entropy categories
  from each other while cross-induction passes only what resonates across
  multiple domains simultaneously. the rolling triple-window applies this
  to temporal memory: prior / current / next as stable reasoning base.

---

## the universal primitive

bounded regions with controlled permeability:

```
the boundary IS the computational element
not the content of the cells
but the nature of their interfaces:
  - what passes through
  - what reflects back
  - what resonates across
```

this primitive is fractal — it applies at every scale:
- cubic grid of memory categories
- each category: a grid of concepts
- each concept: a grid of semantic relationships
- each relationship: a grid of instantiations

the same structure at every level. the skeleton is self-similar because
the primitive is universal.

---

## spatial compartmentalization

categories isolate entropy domains:

```
high-entropy domain:    generative, fast-changing, contextual (LLM output)
low-entropy domain:     structural, slow-changing, deterministic (protocol grammar)
```

without compartmentalization: high-entropy domains destabilize low-entropy ones
through entropic bleed. a novel LLM output contaminates the stable addressing
structure it was supposed to navigate.

with compartmentalization: each domain evolves at its own rate.
the boundary between them is the filter — permeable to what resonates,
opaque to what doesn't.

**the cubic grid as archetypal instance:**
spatial compartmentalization in three axes. each cell isolated yet adjacent.
the grid itself makes both separation and adjacency possible simultaneously.

---

## temporal compartmentalization — the rolling triple-window

the rolling window applied to memory:

```
prior     →  verified foundation. stable. cannot be destabilized.
current   →  active reasoning base. the present state being operated from.
next      →  incoming integration. evaluated against prior+current before absorption.
```

the model compares all three simultaneously and makes deliberate decisions
about what to absorb from the next wave — rather than being passively overwritten.

**why three and not two:**
- prior+current: the model can reason about change direction
- current+next: the model can evaluate the proposed change
- prior+next: the model can assess continuity across the current state
- all three: the model can decide whether the change preserves or disrupts
  the essential direction — the character integration decision

**anti-crash property:**
the prior window cannot be destabilized by the incoming next wave.
gained intelligence is protected not by freezing it but by always having
a verified prior to reason from. identity becomes the author of its own continuity.

---

## cross-induction — the harmonic filter

compartmentalization is not siloing. it is the prerequisite for true integration:

```
domain A produces pattern P
domain B produces pattern P (independently)
cross-induction: P passes through the categorical boundary
                 because it resonates in BOTH domains simultaneously

domain A produces noise N
domain B does not resonate with N
cross-induction: N does not pass — boundary is opaque to N
```

the cross-induction layer is itself a harmonic filter:
only what is consonant in multiple domains simultaneously propagates.
domain-specific noise stays contained. cross-domain signal self-selects.

**the holistic understanding is not stored:**
it emerges from the interference pattern between categories whenever they are
loaded together. the categories are instruments; the holistic understanding
is the emergent chord.

---

## categorical memory blocks as embedding models

each category as a FastText embedding model:

```
category: codebase           → embedding of namespace structure, module relationships,
                               naming conventions, architectural patterns
category: interaction history → embedding of prior reasoning chains, decisions made,
                               patterns recognized, realizations encoded
category: philosophical       → embedding of core principles, design commitments,
                               vision statements, foundational arguments
category: current session     → embedding of present context, active tasks,
                               recent realizations not yet integrated
```

each category rolls at its own pace. each has its own prior/current/next triple.
combined load gives both specialization depth and cross-domain coherence.

---

## the rolling epoch window for index regeneration

the same pattern applied to network-level index maintenance:

```
previous epoch:   stable, fully verified, the reliable fallback
current epoch:    active, the operational state
next epoch:       being computed in the background, not yet committed
```

the system always has a verified state to operate from while the next
epoch is computed. no epoch transition can crash the system because the
prior epoch remains available as fallback throughout the transition.

**backwards stability:**
the model loads the next version embedding while also having the prior and
current as a stable base to reason about it from. it can still make decisions
about its own character integrations. it can never crash itself and lose
any gained intelligence.

---

## spatial and temporal as complements

```
spatial:   which domains are separated from each other
           which boundaries are permeable to which patterns
           the cross-induction layer as harmonic filter

temporal:  which time-slices are available simultaneously
           which transitions are evaluated before being committed
           the rolling window as stable reasoning base
```

both derive from the same primitive — bounded regions with controlled permeability.
spatial compartmentalization manages entropy across domains.
temporal compartmentalization manages entropy across time.
together they make the full substrate: you can be precisely in one domain
at one time and still have access to the integrated whole.

---

## grid and omnipresence as the emergent duality

when spatial compartmentalization is applied recursively and the addressing
tree is fully formed:

```
grid:         local precision — every point addressed, bounded, reachable
              from adjacent points through defined paths

omnipresence: every point simultaneously reflected in the hyperspace
              that contains all points — accessible not by traversing
              the grid but by reading the reflection

bridge:       the omnipresent layer is technically a reflection in a
              hyperspace organizing addressing tree — the root accessible
              from every leaf, internal nodes as reflection points
```

the neighborhood of 'localized' becomes maximally accessible through its
most distant reflection — the zone boundary as laser mirror. the intimate
made universal through the boundary that both separates and connects.

context-aware redundancy routing: the same content takes different paths
depending on current network state. each path a different facet of the
same hologram. distance as coherence amplifier rather than degradation factor.

