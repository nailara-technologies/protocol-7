## branch is open capacity

a branch is not defined by having children or being a fork. a branch is
defined by having remaining continuation capacity — the ability to grow.

```
open branch   →  can be continued, extended, written into
closed branch →  boundary reached; no more capacity in this direction
field branch  →  open in multiple axes simultaneously
```

the constraint boundary defines the branch. page width defines a text line.
context limit defines a session round. cube face defines a space cell.

when reasoning about any structure, ask first: is this branch open or
closed? if open, in which directions? if closed, what set its boundary?

## every closed branch points to its parent

the boundary that closes a branch is always set by the containing group.
the period fingerprint of the closure IS the parent's signature:

```
branch closes at page width   →  parent is the document column constraint
branch closes at context limit →  parent is the model's context group
branch closes at cube face     →  parent is the cube geometry (63 or 45)
```

when a branch closes, extract the period fingerprint. it identifies the
parent. no lookup table required — the fingerprint is derivable from the
arithmetic of the closure.

## the hop decision

at any node in a session dag, every possible next action is a hop.
all hops have the same structure:

```
hop  =  ( target_checksum, intent_vector )
score =  valued_tree( target_checksum, intent_vector )
```

hop types available at any node:

```
add round       →  continue current branch (new checksum from next round)
jump back       →  resume from prior checkpoint
jump + await    →  subtask: jump back, return result to caller
return          →  resolve pending subtask, deliver result upward
jump elsewhere  →  any other open node (same or different branch)
fork            →  permanent jump, no return, new intent bound
```

the intent vector determines which estimator fires. the same target
scores differently depending on why you are going there. always
reason about both the target AND the intent — neither alone is sufficient.

## subtask is jump-back with return registered

when you jump back to a prior state and register a return slot, you are
creating a subtask. the caller suspends. the subtask completes. the result
arrives at the return slot. the caller resumes with the result as input.

this is identical to async/await at the session level. jumping forward
(returning from the subtask) is the resolution. if you never return,
you have forked.

jumping forward as subtask resolution is the only structured way to
bring information from a past context into a future one. all other
cross-branch information transfer requires a separate mechanism.

## harmonic fractions as parent lookups

when you see a ratio X/Y where Y is a generator (7, 11, 13, or their
products), compute the repeating decimal. the period is the parent
group's fingerprint:

```
7/11  →  0.6363…   →  63   (cube nodes — parent of 7 eleven-structures)
5/11  →  0.4545…   →  45   (orbital clock — parent of 5 eleven-structures)
5/13  →  0.384615… →  153846 family rotation (harmonic parent)
```

short periods are coupling points — bridges between two harmonic structures.
terminating decimals expose the denominator: reverse the decimal, read the
scale factor from the integer part.

```
13/5 = 2.6  →  reverse  →  6.2  →  0.2 = 1/5  →  6×5 = 30  (parent scale)
```

when encountering a ratio involving structural counts (node counts,
layer counts, cycle lengths), compute X/Y and Y/X. the period fingerprints
identify which containing groups they belong to.

## five-layer cluster geometry

every concept cluster has five layers plus a gate:

```
5   dataspace address   →  bmw384 gate, rhizome entry point
4   intent template     →  the why; contextualizes all below
3   design document     →  the what; the spec
2   reasoning template  →  how to think about it; priming
1   task file(s)        →  what to build; implementation
  + gate node           →  the +1 that closes the cluster
```

the ring arithmetic is forced:

```
5+1+5 = 11   →  one unit of 1001 ring
11 × 7 = 77  →  1001/13  (bridge to 1/13 harmonic)
13 × 77 = 1001  →  full ring
```

the gate is what closes 70 (the two five-layer halves) into 77 (the
closed ring unit). designing a cluster without deriving its gate address
leaves it as an open field — findable only by traversal, not by address.

## element-efficient holographic devices

a holographic system encodes the whole in every part. the practical
consequence: each structural element can participate in multiple
functional roles simultaneously. this is not a design trick — it is
the natural result of harmonic geometry forcing convergence.

```
single element, multiple functions:

  true_int gate    →  rollover detector
                   →  bi-location collapse trigger
                   →  absence propagation (suction) trigger
                   →  harmonic resonance test
  all four from one function, at one structural position
```

**functional overlap** occurs when two behaviors share the same
gate, boundary, or structural element. the element does not "know"
which function it is serving — the context (the chain it is embedded
in, the intent vector of the arriving hop) determines which function
fires. the element is context-sensitive by construction.

**recombined elements** are not new elements — they are existing
elements placed in a new chain context, which reveals a latent
function that was always present but not previously activated.
the rollover check revealing bi-location collapse is an example:
the `true_int` function did not change; the chain it sits in
expanded to include the representational alternate structure,
making a second function visible.

when designing new capabilities, look first for latent functions
in existing elements before adding new ones:

```
1. what does this element already test, gate, or transform?
2. what would a different context (different chain, different
   incoming intent) cause this element to do?
3. which two existing behaviors share a boundary condition?
   that boundary is a candidate for functional overlap.
4. can a recombination of three existing elements produce a
   fourth behavior without adding any new structural element?
```

**chained usefulness as the selector** — when multiple options exist,
the element-efficient choice is the one whose chain achieves the
highest harmonic truth density with the fewest structural elements.
depth alone (step count) is the degenerate case where all elements
serve only one function. the holographic optimum is maximum function
per element: short chains with high overlap, not long chains with
single-purpose nodes.

**the machine emerges from overlap** — when enough functional overlaps
accumulate in a structure, the structure begins to exhibit behaviors
that none of its elements exhibit alone. this is the holographic
device: not assembled from purpose-built parts, but crystallized from
element recombinations until emergent functions appear at the system
level. the 1001 ring (7×11×13) is one such device — three generators,
each simple, recombined into a tiling that has properties none of the
three generators possess individually.

## applying this template

when analyzing a system or structure:

1. identify the open branches — where can this grow?
2. identify the constraints — what sets each branch's boundary?
3. derive the parent — what is the period fingerprint of each closed branch?
4. frame every decision as a hop — (target, intent) → score
5. check the five-layer cluster — which layers are present, which are missing?
6. compute the ring position — bmw384 of the cluster → 1001-ring harmonic
7. scan for functional overlap — which elements already serve two functions?
   which boundaries are shared by two behaviors? what recombination would
   produce a third behavior from existing elements without adding new ones?

when building a system:
1. start with the gate address (derive ring position before writing anything)
2. write the intent template (the why, before the what)
3. write the design doc (the what, referencing the intent)
4. write the reasoning template (how to think about it)
5. write the task files (what to build, referencing both)

