## how the triangle orients the network topology

each axis of the triangle maps onto the structural geometry:

```
TRUTH axis:     the antipodal connection — maximum distance
                factual existence spans the full range: value and its complement
                deduplication operates here: redundant content collapses toward
                the most accurate reference along the antipodal line
                in practice: the checksum (AMOS/BMW384) IS the truth axis measurement

LOVE/AWARENESS axis: the 4 orthogonal alternatives — the rotation plane
                resonance and discovery propagate laterally through face-center connections
                LOVE and AWARENESS share this plane: what resonates is discovered by
                what perceives, and vice versa — they are the dynamic pair
                in practice: the approach vectors and reference counts ARE this plane

EXISTENCE:      the radial/parent connection — inward toward core
                not a lateral direction — the axis connecting sphere layers
                each layer of the dedup tree: a sphere closer to EXISTENCE center
                in practice: the BMW384 ring position (inner = closer to EXISTENCE)
```

