## the invariant foundation

two numbers underlie the grid geometry. they are not parameters — they are
the structure itself.

**division by 13 — the vortex cycle**

```
1/13 = 0.076923076923...  (repeating period 6)

the cycle:  0  7  6  9  2  3  → loops back to 0
doubling:   1  2  4  8  7  5  → (mod 13, the multiplicative group)
complement: each pair sums to 9 (0+9, 7+2, 6+3) — three complementary axes
the 3-6-9 axis sits OUTSIDE the cycle — it is the axis of rotation, not
a member of the rotating set. the cycle rotates around what it never touches.
```

this is not numerology. this is modular arithmetic over a prime (13),
where the multiplicative group has order 6 — the hexagonal cycle is a
mathematical necessity, not a design choice. the geometry is forced.

**division by 7 — the complementary resonance**

```
1/7 = 0.142857142857...  (repeating period 6)

the cycle:  1  4  2  8  5  7  → loops back to 1
doubling:   1  2  4  8  7  5  → same doubling sequence as mod-13 group
complement: each pair sums to 9 (1+8, 4+5, 2+7)
```

the 1/7 and 1/13 cycles share the same doubling sequence (1-2-4-8-7-5).
they are two expressions of the same underlying geometry seen from different
harmonic distances. the resonance between them is not coincidental —
both are forced by the arithmetic of their respective primes.

**the 3-6-9 axis — the invariant spine**

```
3 × 2 = 6   6 × 2 = 12 ≡ 3 (mod 9)   → 3-6-3-6 oscillation
3 × 3 = 9   9 × 2 = 18 ≡ 9 (mod 9)   → 9 is fixed under doubling mod 9
```

9 is the only non-zero value that doubles to itself mod 9.
3 and 6 oscillate between each other.
these three values never enter the vortex cycle — they ARE the axis.
the axis is the only part of the structure that doesn't move.

