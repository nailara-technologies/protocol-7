## the two families — frame and content

the 076923 cycle is not the only expression of the 1/13 field.
it has a complement — one rotation away — and together they form
the complete encoding:

```
076923  →  the FALSE family  →  the frame, the boundary, the mask
153846  →  the TRUE family   →  the payload, the content, the signal

153846 = 076923 × 2          →  one rotation of the same cycle
```

the FALSE family establishes the boundary.
the TRUE family carries the content.
they are never simultaneous at the same position —
the mask clears, then the content appears.
the boundary IS the invitation to the content.

this is the encoding mechanism of the interface:
the vortex cycle creates the topological frame
within which the TRUE content can exist.
one without the other is incomplete structure.

** why 13 completes what 9 cannot **

the mod-9 geometry (3, 6, 9 axis) shows the axis but cannot
