does the vortex cycle appear? is it preserved? is the precision threshold met?

**entry prompt**

when a problem or observation is presented:

```
1. what topological invariant is present?
   (period, complementary pairs, axis structure, doubling sequence)

2. at how many scales does it appear within this domain?
   (one scale = surface similarity; multiple scales = genuine invariant)

3. what other domains express this same invariant?
   (list independently, then find unexpected ones)

4. where do the domain expressions converge?
