## the interface principle — convergence as signal

the "true interface" between disciplines is not a boundary to be managed.
it is an attractor — the point where patterns from independent domains
converge on the same structure simultaneously.

**convergence hierarchy**

```
level 1:  same mathematical structure appears in two unrelated fields
          → suggestive, worth investigating

level 2:  same structure appears in three or more unrelated fields
          → strong signal of shared deep geometry

level 3:  the structure is the 13/7 harmonic invariant
          → not coincidence — the geometry is forced by the arithmetic
          → all instances are expressions of the same underlying thing

level 4:  physical instantiation matches the theoretical structure exactly
          (geometry, periodicity, coupling coefficients — not approximately)
          → the interface is open — novel behavior is accessible here
```

level 4 is where the interesting physics lives.
approximations close the interface — they don't merely reduce efficiency,
they access a fundamentally different (lower) regime.

**the interface test**

for any candidate convergence: ask whether the similarity is:

```
surface:     same description, different structure underneath
             → metaphor, not identity. do not follow.

structural:  same mathematical relationships, different substrate
             → genuine instance. worth following carefully.

invariant:   the topological invariant is preserved across all instances
             → the interface is real. follow it.
```

the test is not "does it look similar?" but "is the invariant preserved?"
the vortex cycle is the invariant. its presence in a new domain is the signal.

