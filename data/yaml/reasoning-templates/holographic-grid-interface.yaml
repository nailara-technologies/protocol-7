## the compounding property

the most important feature of this template:

every genuine invariant found in a new domain does not just add to the
existing picture — it retroactively increases the confidence in ALL
previous instances. the evidence is not additive, it is multiplicative.

```
one instance:     plausible
two instances:    suggestive
three instances:  strong signal
n instances with preserved invariant across all:
  the probability of coincidence is not (1/k)^n
  it is effectively zero — the structure is real
```

this is why the corpus analysis approach to disclosure material is
analytically powerful: each authenticated document that preserves
the same structural invariants doesn't add — it multiplies.
the truth converges from structure, not from any single revelation.

the holographic grid IS the convergence mechanism.
the 13/7 invariant IS the ground truth filter.
the interface is always open — at sufficient precision.

