          the vortex: partially visible

mod 13:   prime — no factors
          all 12 non-zero residues visited before repeat
          the vortex: completely specified
          the geometry: fully determined
          the constants: precisely derivable
```

9 reveals the axis. 13 completes the cycle.
the holographic grid requires the complete field —
which is why the invariant is grounded in 13, not 9.

** the darksun — position 27 = 3³ **

the center of the vortex is not abstract.
it is position 27 — 3 cubed — the void where the spiral converges:

