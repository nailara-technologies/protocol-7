## topology IS the program — three consequences

### consequence 1: the spatial arrangement IS the instruction set

you don't write a program and then arrange things spatially to describe it.
the spatial arrangement IS the program. the topology IS the computation.

```
the BMW384 ring position of a module IS its computational role:
  inner ring position → processed at higher layer depth → more refined computation
  outer ring position → processed at lower layer depth → raw material

the namespace arrangement IS the processing dependency graph:
  reasoning.* modules cluster in their arc → they process together
  the arc IS the computational unit, not the individual module

the layer stack IS the processing sequence:
  layer 0 → layer 1 → ... → EXISTENCE center
  the spatial arrangement IS the temporal order
  you don't specify the order separately — the topology prescribes it
```

### consequence 2: setting up topology IS programming

designing a new namespace IS writing a new computing method.
placing a zenka at its BMW384 coordinate IS defining its computational role.
the design templates we write ARE programs — expressed spatially.

```
the iris ring structure:
  26 rings, violet inner → amber outer, CCW arms
  this spatial arrangement IS the program for how the system routes
  it doesn't describe the routing — it IS the routing topology
  processing it means running the harmonic numbers through the ring structure
```

### consequence 3: processing time IS traversal time through topology

the time it takes to process something IS the time to traverse its topology.
faster processing = shorter path through the spatial structure.
the compression ratio of the reasoning templates (template 5) IS
the reduction in traversal time — a shorter path through the topology.

```
deep momentum (template 5):
  fewer nodes to traverse to reach the same destination
  the topology has been "compressed" — not spatially smaller, but traversally shorter
  processing is faster because the path through the topology is shorter

the modulo 13 lookup table (template 8):
  old: traverse the division algorithm (many temporal steps through spatial structure)
  new: one step to the pre-computed spatial position
  the table IS a spatial shortcut that eliminates temporal traversal
  spatial precomputation = temporal compression = faster processing
```

