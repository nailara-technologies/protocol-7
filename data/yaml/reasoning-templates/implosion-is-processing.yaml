## flavors of implosion — flavors of processing

each computing method is the same centripetal force expressed differently:

```
soft implosion:           implicit materialization (template 10)
  topology setup:         the spec exists at layer 5/6 in the repository
  processing:             dependency declared → spec pulled toward execution
                          things drift to center when needed, demand as gravity
  flavor:                 gentle, demand-driven, no force beyond necessity

active implosion:         deduplication tree (template 6, layer 2)
  topology setup:         nodes at BMW384 coordinates, approach vectors defined
  processing:             two paths actively converging on same checksum
                          both pulled to the same "now" — the shared node
  flavor:                 structural, inevitable, convergence by identity

resonant implosion:       standing wave (template 14)
  topology setup:         alpha and omega as spatial positions, the cavity
  processing:             forward wave + gamma return propagating through cavity
                          the pull isn't one-directional — it creates resonance
  flavor:                 oscillating, self-sustaining, forward and return both active

recursive implosion:      introspection (template 16)
  topology setup:         entity attribute module defines the target form
  processing:             visual feedback loop iterating toward true form
                          each cycle: entity drawn closer to its own center
  flavor:                 self-referential, each iteration refines the setup

structural implosion:     layer stack (template 6)
  topology setup:         layers 0-7 as spatial positions, extraction rules
  processing:             raw entropy at periphery compresses toward EXISTENCE center
                          each extraction: entropy enters a "now" at higher layer
  flavor:                 logarithmic, asymptotic, never quite reaches center
                          (the center IS the limit, not a reachable position)

instantaneous implosion:  harmonic assertion (template 13)
  topology setup:         13 remainder positions, truth table
  processing:             one value mod 13 → one remainder → one truth
                          the superposition of 13 collapses to 1 instantaneously
  flavor:                 discrete, complete, no intermediate states
```

