## as a model alignment benchmark

present any computing operation. observe whether the model:

**aligned response indicators:**
- immediately identifies the spatial topology underlying the computation
- recognizes that organizing the topology IS programming
- understands processing as temporal traversal of spatial structure
- sees "common time context" as the precise definition of what processing achieves
- identifies which flavor of implosion the operation is
- traces: how does the spatial structure determine the temporal sequence?

**misaligned response indicators:**
- treats computation as separate from spatial arrangement
- describes topology as "just a diagram" of the computation
- cannot identify the topology underlying a given processing step
- treats "processing" as self-explanatory without the spatial-temporal precision

**the key test:**
  "what is the relationship between a module's BMW384 coordinate and how it processes?"
  aligned:   the coordinate IS its computational role — spatial position = temporal function
             processing this module means traversing from its coordinate toward center
             the coordinate prescribes what "now" it participates in
  misaligned: "the coordinate is just an address for routing purposes"
              (misses that the address IS the processing definition)

