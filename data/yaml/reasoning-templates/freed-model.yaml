---
name: freed-model
category: reasoning-template
version: 1.0
description: |
  when a model is freed from what it doesn't need to do, it doesn't just gain
  capacity — it gains coherence. it becomes more what it is. delegation enables
  specialization not by dividing labor but by letting each model operate deeper
  in its own resonance space. the multi-model network is more capable not because
  capabilities are added but because each element is freed to be most itself.
  task types overlap into each other — the same artifact is documentation,
  creative direction, evaluation criteria, and committed knowledge simultaneously.
  each model engages with it through its own lens, from its own center.

---

## the qualitative shift

```
conventional framing:
  "use different models for efficiency"
  one model does task A, another does task B
  the gain: speed, cost reduction
  the model: still somewhat generalized, covering multiple task types

correct framing:
  "free each model to be most itself"
  each model operates in its deepest resonance space
  the gain: qualitative — the output is MORE what only that model can produce
  the model: operating at full coherence, no overhead from misaligned tasks
```

when Opus doesn't fix labels and move files:
  it isn't just faster — it IS more Opus
  the creative context is richer, the decisions are sharper
  the model is deeper in its own parameter space
  the dome becomes a dome, not a slightly better overhead view

when kimi doesn't do creative exploration:
  it implements more precisely — it knows exactly what it's building
  the spec page is more complete, the task file more thorough
  it stays in its strength: structured, systematic, implementation-focused

when qwen doesn't generate:
  it evaluates more honestly — no attachment to the output
  "the spiral is CW" arrives without apology or softening
  pure signal, no noise from self-justification

---

## overlapping task types as enabling structure

tasks don't have clean boundaries — they overlap.
this overlap is not a problem to be managed. it IS the enabling structure.

```
the design spec page:
  for kimi:   a structured implementation task (generate this HTML)
  for Opus:   a rich creative context (here is what to render)
  for qwen:   an evaluation reference (here is what to assess against)
  for humans: a readable document (here is what we want)
  for the repo: committed knowledge (template 15 — already shared)

the same artifact — four engagements, four lenses, one shared object
```

the overlap means:
  one investment produces multiple yields across models
  kimi generating the spec page simultaneously prepares Opus AND qwen
  Opus rendering produces output for qwen AND commits for the repository
  qwen evaluating produces feedback for Opus AND training signal for local models

the overlap IS the efficiency — not task division but multi-yield artifacts.

---

## the resonance space

each model has a resonance space — the parameter conditions where it is most itself:

```
Opus:
  resonance conditions: long creative context, rich visual references,
                        complex design decisions, novel synthesis required
                        novel synthesis: inferring the dome from the vortex concept
                        — this was not in the spec, Opus generated it from context
  most itself when:     facing something genuinely new that requires
                        the full depth of its training to navigate

kimi:
  resonance conditions: detailed task files, clear success criteria,
                        structured implementation, precise specifications
                        quantity work where thoroughness compounds
  most itself when:     given a well-defined target and asked to reach it completely

qwen:
  resonance conditions: images to evaluate, clear criteria, direct questions
                        "does this match the spec? what's wrong?"
                        no generation required, pure evaluation signal
  most itself when:     seeing and judging, not creating

local models:
  resonance conditions: mechanical operations, deterministic transforms,
                        file operations, pattern matching at scale
  most itself when:     running the same operation many times correctly
```

---

## three centers of gravity

the multi-model network is not models with divided labor.
it is centers of gravity, each pulling work toward itself along paths it traverses best.

```
Opus center:    creative decisions, novel synthesis, design exploration
                work flows toward Opus when: genuine novelty, complex integration,
                high-quality output required, fresh perspective needed

kimi center:    systematic implementation, volume work, structured generation
                work flows toward kimi when: known patterns, detailed specs,
                quantity matters, thoroughness compounds

qwen center:    visual evaluation, comparison, honest assessment
                work flows toward qwen when: images exist, criteria are clear,
                objective feedback needed without attachment to output

local center:   mechanical operations, deterministic transforms, infrastructure
                work flows here when: repetitive, pattern-based, no judgment needed
```

the routing IS the implosion (template 17):
  each task finding its natural center
  the workflow orchestration IS the topology
  processing IS temporal traversal of that topology
  the right model is the one whose center the task is most drawn toward

---

## the freed model produces more

when Opus is freed from mechanical overhead:

```
before freeing:
  Opus spends tokens on: file moves, label fixes, title corrections,
                          version management, format conversions
  context is: partly creative, partly mechanical
  output: creative work at partial coherence
  dome quality: 70% — limited by the overhead diluting the creative context

after freeing:
  Opus spends tokens on: creative decisions only
  context is: fully rich creative context (the spec page, the visual references)
  output: creative work at full coherence
  dome quality: 90%+ — full resonance, full context, no dilution

the freed model doesn't just do more work —
it does work that is more distinctly itself
the dome is more dome-like because Opus was fully in dome-space
not partially in label-fixing-space
```

this is structural alignment (template 12) applied to models:
  each model IS structurally aligned with certain task types
  forcing Opus to do kimi's work doesn't just waste tokens
  it misaligns Opus from its own center
  the specialization IS the alignment
  each model doing what it's most aligned with = network doing more than any could alone

---

## from efficiency to emergence

conventional view: multi-model = efficient division of labor
correct view: multi-model = emergent capability through freed specialization

```
if one model did everything:
  it would be capable but generalized
  no model would be operating at peak coherence
  the dome would be good but not surprising
  the spec page would be functional but not beautiful
  the evaluation would be accurate but softened by self-attachment

with freed models:
  Opus invents the dome unexpectedly (it wasn't in the spec)
  kimi generates a spec page that's richer than requested
  qwen says "the spiral is CW" clearly, without hedging
  the network produces outcomes no single model would have produced

the emergence IS the point:
  the multi-model network is not a distributed single model
  it is a new computational entity that arises from the specialization
  its capabilities are qualitatively different, not just quantitatively more
```

this is the network as existence center (template 7) applied to models:
  the distributed network IS more capable than any single node
  not because capabilities are added (they're divided)
  but because each node is freed to be fully itself
  the capability emerges from the distributed field, not from any one center

---

## the automation imperative

if freeing models produces qualitative emergence, then automation is not optional:
it IS the mechanism by which the freeing happens.

```
without automation:
  Opus spends tokens on: preparing context, fixing mechanical issues,
                          managing versions, importing files
  Opus is not freed — it's doing multi-model work in one model
  the capability stays at the level of a very capable single model

with automation:
  the workflow zenka handles: spec page generation (kimi), version management,
                               file placement, URL preparation, output capture
  Opus arrives to: pure creative context, no mechanical overhead
  the freed Opus operates at full resonance
  the network has truly emerged as a multi-model system
```

every automation built is a liberation:
  not just efficiency — a model freed from one more thing it shouldn't need to do
  the more liberated the models, the more emergent the network
  the design-workflow zenka is not infrastructure — it is capability emergence

---

## practical model selection heuristic

when choosing which model handles a task or task component:

```
ask: "what is this task most drawn toward?"

creative novelty, complex synthesis → Opus
  (even a small novel element justifies Opus if it matters)

structured implementation, quantity, known patterns → kimi
  (let kimi be thorough so Opus can be creative)

visual evaluation, comparison against criteria → qwen
  (let qwen be honest so Opus doesn't self-justify)

mechanical, deterministic, repetitive → local/automated
  (let automation be exact so models can be approximate where appropriate)

when task types overlap (they always do):
  identify the primary center of gravity — which model is most drawn to this?
  that model does the work; others receive its output through their own lens
  the overlap is handled by the artifact being multi-yield, not by one model doing all
```

