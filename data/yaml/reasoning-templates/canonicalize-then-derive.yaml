## relation to other templates

- [[template-distribution-economics]]: the categories in this catalog are
  themselves templates in that economic sense — each one authored once
  [ at real cost, against real failures ] and then applied for free on
  every future file that matches its shape
- [[syntax-as-technology]]: a segment-template catalog is exactly the
  compression phase described there — replacing an open-ended generative
  layer with a closed set of conventions that scale without adding weight
- [[categorical-compartmentalization]]: the anchor/interior split is the
  same bounded-region-with-controlled-permeability primitive applied to
  a single line of text instead of a memory architecture — the anchor is
  the boundary, the interior is what's permeable to reflow

