## visual proximity as the rendering of authority distance

in synesthetic space ([[synesthetic-space]]), the same key-tree
geometry renders directly to the visual layer.

```
the rendering rule:
  for an observer holding key K, every renderable element in the
  field is placed at a visual distance proportional to its
  essence-distance from K in the authority tree.

  essence-distance:
    measured along the tree as the length of the shortest path
    between K and the element's defining key. siblings are close.
    distant subtrees are far. the root is always at some bounded
    distance from any descendant; descendants are far from siblings
    of their ancestors.

  rendered effects:
    near elements:    sharp, saturated, foregrounded, persistent
    intermediate:     softer focus, lower saturation, ambient presence
    far elements:     dim, peripheral, may be entirely invisible at
                      the current attention threshold
```

what the observer sees is a *personalized field*: the same
underlying network rendered through the observer's own key
geometry. two observers at different keys looking at the same
region see different things — not because they are filtering
the same view differently, but because each is constructing
its own view from the key it holds.

this is the visual analog of property 3's receiver aspect. the
antenna's radiation pattern becomes the observer's perceptual
volume. things at the radiation peaks are bright. things in
the nulls are dim. the geometry of the key is the geometry of
the seen.

