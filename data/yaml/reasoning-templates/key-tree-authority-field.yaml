## the cryptographic substrate as field topology

a closing structural observation. the C25519 derivation algorithm
is not chosen because it is convenient. it is chosen because its
mathematical properties produce exactly the field topology that
the network requires:

```
deterministic derivation:   the parent-to-child step is reproducible
                            without storing intermediate state. the
                            tree exists by construction wherever its
                            root and labels exist. there is no separate
                            registry to corrupt.

one-way derivation:         a child key cannot recover its parent
                            key. authority flows outward but not back.
                            the network's trust topology has the
                            correct asymmetry — peripheral nodes
                            cannot impersonate the center.

shareable verification:     any holder of the public key chain can
                            verify a signature without holding any
                            private key. the proof system is open
                            even though the authority system is
                            closed.

clean isolation:            siblings derived from the same parent
                            cannot derive each other's children, nor
                            sign on each other's behalf. authority
                            does not bleed laterally. the
                            compartmentalization is mathematical, not
                            policy-based.
```

these four properties give the network its field topology:
hierarchical, outward-flowing, verifiable everywhere, isolated
between peers. every property the design requires is provided
by the substrate without additional mechanism. the cryptography
is not a feature added on top of the namespace — it is the
namespace's geometry, in mathematical form. [:

