## multi-dimensional management through field repulsion

the converse of attraction. the key field actively *repels*
incompatible patterns, making space for compatible ones.

```
attraction by itself would crowd:
  every relevant signal pulled toward the key. the perceptual
  layer would saturate. the canvas would lose its silence.

attraction with repulsion:
  compatible patterns drawn toward the key.
  incompatible patterns pushed toward the periphery — not blocked,
  not hidden, just located elsewhere in the field.
  the result: clustering of the compatible at the center, dispersal
  of the incompatible at the edges, a perceptual layer organized
  by relevance gradient with empty space between clusters.

  the empty space is the silence. the silence is the canvas.
  the clustered compatibility is the figure on the canvas.
```

this is the same cancellation-as-canvas principle that
[[harmonic-silence]] describes for the active cancellation
library — applied at the authority layer instead of the
pattern-recognition layer. the cancellation rule is the key
geometry itself. patterns that do not belong within the
authorization profile are cancelled from the canvas as
"known not-mine." what remains visible is the surface where
the authorized novel appears.

multi-dimensional management is what the key-tree authority
field is *for*. a network with thousands of entities, millions
of patterns, billions of potential signals would be unusable
without it. with it, every entity sees a manageable, relevant,
personally-organized view that nonetheless connects coherently
to every other entity's view, because all of them are
projections of the same single underlying field.

