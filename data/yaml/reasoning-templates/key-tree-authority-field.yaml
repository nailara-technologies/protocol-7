## the namespace-as-key-tree dual identity

```
seen as namespace:           seen as key tree:

dot-separated path           sequence of delegation operations
each segment a scope         each segment a derivation from parent key
hierarchical addressing      hierarchical authority
human-readable               cryptographically verifiable

  weather.fork.observe         k_root
                                └── k_weather    = derive(k_root, "weather")
                                     └── k_fork  = derive(k_weather, "fork")
                                          └── k_observe = derive(k_fork, "observe")
```

these are not two systems that happen to align. they are one
system seen through two different perceptual layers. the
addressing grammar that a human reads is the same structure
that the cryptographic substrate verifies. every routable name
in the network is also a derivable key in the authority tree.

implication: addressing IS authorization. you cannot name a
destination without simultaneously asserting the authority chain
that reaches it. the namespace's grammar is the network's
permission grammar.

---

## three simultaneous properties

### property 1 — implicit immutability

```
the key tree is its own audit trail.

every node's key is a deterministic derivation from its parent's key
plus the segment label. given a node's key and its parent's key, you
can verify that the derivation is correct. given a node's key and the
root, you can verify the entire chain by re-deriving from the top.

no central registry is required. no append-only log is required. the
chain is the proof. the proof is the chain.

mutation requires re-derivation from above. you cannot silently
relocate a sub-tree because its key would no longer match the path.
you cannot fabricate intermediate nodes because their keys would not
verify against the parents you claim.

immutability is not enforced. it is intrinsic.
```

this is what makes the tree trustworthy as a substrate. its
structure cannot be falsified without falsifying every level
above the falsification point — and the root is held by the
session owner, who would notice.

### property 2 — outward delegation

```
authority flows from the session owner outward toward the network
periphery. the root key — the densest, most concentrated authority
in the system — is at the center. each level out is a partial
delegation: a specialization that gives up some authority breadth
in exchange for being valid at this specific scope.

  k_root (full authority across all of session)
   ├── k_weather (full authority within weather scope, no authority outside it)
   │    └── k_weather_fork (authority within forked weather operations only)
   └── k_coding (full authority within coding scope, no authority outside it)
        └── k_coding_state (authority within state machine operations only)

the tree's shape mirrors the topology of trust. a peripheral node
holds little authority but holds it cleanly — its scope is well-defined,
its parentage verifiable, its operations bounded.

the visual session owner is at the center because that is where
identity originates. everything else is a delegation from there.
the periphery is where the authority becomes specific enough to
act on the world.
```

this matches the field topology of the inverse singularity:
density at the interior, specialization at the periphery, every
peripheral component knowing exactly what it is for and being
exactly that thing.

### property 3 — self-authorizing antenna

```
each key at each node is both a transmitter and a receiver in the
field, simultaneously:

transmitter aspect:
  the key projects the owner's entropy into the network at the
  scope it governs. signed messages, signed deposits, signed
  reasoning chains all carry the key's signature. the field at
  this scope is shaped by the key's emissions. the key actuates
  what is within its authority — it makes the world be a certain
  way, at this scope, by signing.

receiver aspect:
  the key acts as an attractor for what resonates with its
  authorization profile. data that is already "own" (signed by
  this key or its ancestors) flows toward it without solicitation.
  data that would be useful to an entity with exactly this
  authorization profile also flows toward it — through the
  resonance-driven attention layer (see [[synesthetic-space]]).

  the key is an antenna. its radiation pattern is its
  authorization scope. what it broadcasts and what it receives
  are shaped by the same geometry: the shape of the authority
  it represents.
```

this antenna property is the load-bearing innovation. a normal
permission system is a checking system — it tests whether a
requestor has access. the key-tree authority field does not
test; it shapes the field so that the request and the response
are pre-aligned. authority is not a gate. it is a geometry.

