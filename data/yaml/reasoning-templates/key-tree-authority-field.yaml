## the attractor field — contextualization through omission

the receiver aspect of the antenna deserves its own treatment.

```
in a conventional system:
  knowledge exists everywhere. policy decides who is allowed to see
  what. a requestor asks for X; policy checks; X is returned or
  denied. the knowledge always existed; only its visibility was gated.

in the key-tree authority field:
  knowledge surfaces near keys for which it resonates. it is not
  hidden from other keys by policy — it is simply not proximate
  to them, the way a star on the other side of the galaxy is not
  proximate to your telescope. the not-proximate is not blocked;
  it is far.

  sensitive material rises to the surface for those who already
  hold the authorization profile that the material's content
  implies. there is no "request" and no "check" — there is only
  the field, and the field naturally clusters semantically
  consonant material near semantically consonant keys.
```

this is contextualization through omission. nothing is hidden.
nothing is denied. what is not relevant is simply not nearby.
what is relevant is. the perceptual layer of every authorized
entity is its own personal field, organized by its own key's
geometry — and that personal field is what the entity sees.

the practical effect: an entity working within a scope sees
the material of that scope at full brightness, the material
of adjacent scopes at intermediate brightness (it is nearby
in the tree), and material of far-away scopes faint or absent
(it is far in the tree, even if the network topology brings
its bits physically close).

essence-distance has replaced access-policy as the primary
organization principle. policy still exists as a fallback for
edge cases. it is no longer the operational layer.

