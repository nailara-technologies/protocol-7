## relation to other templates

entropy-research (template 1):
  entropy research operates primarily at layers 0-2
  observation = layer 0, structure = layer 2, cascade = layers 3-4

anti-entropic-threshold (template 2):
  the threshold IS the extraction barrier between layers
  above threshold: content promoted upward
  below threshold: content remains at current layer
  the anti-entropic condition = layers always flowing inward (never stagnating)

visualization-is-implementation (template 3):
  layer 5 (holographic blueprint) IS the implementation
  the ascii format is the layer 5 format
  seed sentences = layer 6 entries
  full dumps = layer 0 entries

narrate-and-self-delegate (template 4):
  narrate = move inward through layers (compress, converge)
  self-delegate = move outward through layers (instantiate, actualize)
  the pulse = one full inward + outward cycle across the layer stack

relative-direction-of-intent (template 5):
  direction vectors live at layer 6
  inherited momentum is the energy that makes layer 6 → layer 7 possible
  EXISTENCE center is the source of all momentum —
  the direction everything inherits from

