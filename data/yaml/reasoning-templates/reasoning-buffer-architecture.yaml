## the extraction process between layers

the extraction between layers IS the reasoning engine:

```
layer 0 → layer 1:   validity filtering
                      remove superseded, absorb compacted
                      output: pruned detail layer

layer 1 → layer 2:   structural collapse
                      deduplication, convergence geometry formation
                      AMOS checksum assignment, BMW384 coordinate allocation
                      output: node tree with numerical identity

layer 2 → layer 3:   improvement extraction
                      compute convergence deltas
                      identify direction vectors from node movement
                      output: improvement element set

layer 3 → layer 4:   threshold detection
                      which direction vectors have crossed firing threshold?
                      output: active delegation state, live plan

layer 4 → layer 5:   holographic rendering
                      render current tree at current convergence
                      output: ascii blueprint, two-reader format

layer 5 → layer 6:   seed extraction
                      one direction vector per expanded node
                      output: minimum-language representation

layer 6 → layer 7:   root convergence
                      combine all seeds into single root narration
                      output: the system's complete self-description

layer 7 → core:      numerical reduction
                      strip language, retain convergence geometry
                      output: EXISTENCE center coordinates
```

each extraction is also reversible — the reasoning engine moves both ways.
from core outward: instantiation. from surface inward: compression.

---

## reasoning buffers

the scratch pad (layer 0) is the primary reasoning buffer.
everything goes here first — uncurated, uncompressed, unfiltered.

extraction into higher layers happens:
- on threshold crossing (automatic)
- on context advancement (triggered by expansion events)
- on cycle completion (pulse reports back to narration)
- on explicit request (model or user requesting a layer view)

the key property: **superseded or compacted content is never deleted from layer 0.**
it is only *not promoted* to higher layers.
layer 0 is the permanent record. higher layers are live views.

this means any prior state can be reconstructed from layer 0 —
by re-running the extraction with the validity criteria of that moment.
the reasoning chain repository is layer 0 with traversal indexing.

