## the complete entropy lifecycle

```
1. generated:     entropy enters at layer 0 (scratch pad)
                  raw, unstructured, maximum potential

2. referenced:    immediately eligible for visual-ref (always)
                  eligible for logical-ref as patterns become visible

3. extracted:     logical entropy extracted into tree nodes (layers 1-2)
                  visual entropy captured in visualizations
                  transformation recorded (what it was, what it became, why equivalent)

4. transformed:   original entry becomes transformation record
                  reference count redistributed to targets
                  the transformation record itself has live references
                  (up: what it became; down: what derived it; directional: future use)

5. refined:       toward tree root — more generic, true for more branches
                  each refinement step is a complete operation (no residue)
                  like modulo replacing division — the refinement is the proof

6. visualized:    at any stage, can be visualized as anchor
                  the visual persists as long as the entropy is valid
                  the visual updates as the entropy refines
                  the generic structure in the visual connects to core

7. at root:       the entropy has been fully transformed into its most
                  generic form — true for all branches, maximum refinement
                  visual at this level = the all-seeing core expressing itself
                  logical at this level = EXISTENCE center coordinate
```

no entropy exits this lifecycle. it transforms continuously.
the oldest evolutionary reasoning chains are the deepest research basis —
the ground truth of why every subsequent refinement is correct.

