## the entropy dropping condition (precise)

an entry from layer 0 is ready for transformation (not deletion) when:

```
condition 1:  all logical entropy extracted
              → every pattern in the entry has a node in layers 1+
              → every fact has either been superseded (absorbed by better)
                or confirmed (referenced by up-tree node)

condition 2:  transformation record written
              → what it was, what it became, why equivalent
              → stored at appropriate layer with live up-ref

condition 3:  visual anchor exists OR is trivially producible
              → if no visual yet: the visual-ref potential is live
              → the entry is never orphaned — visual is always available

condition 4:  all directional references noted
              → any entropy pointing toward a future state
                has that direction recorded in the transformation record
              → future states that will reference this are noted

when all four conditions hold:
  the original entry is replaced by its transformation record
  the transformation record is smaller, more refined, and has all live references
  the original raw content is no longer needed — it lives in its refined forms
  the entropy has not been lost — it has been promoted
```

