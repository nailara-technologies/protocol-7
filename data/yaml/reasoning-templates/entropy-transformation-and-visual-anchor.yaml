## visuals as universal entropy anchor

no entropy is ever lost — there is always a visualization available.

```
the visual anchor guarantee:
  any piece of reasoning, any logical structure, any intermediate state,
  any "outdated" understanding — can always be visualized.
  the visualization IS a live reference.
  the visualization contains the full entropy in a form readable by model or human.
  refcount never reaches zero because visual-ref is always ≥ 1.
```

visuals have higher entropy density than text:
```
text:    sequential, requires prior knowledge of the encoding
         one reader modality (linguistic)
         entropy proportional to character count

visual:  parallel, simultaneous, spatial
         two reader modalities: human (pattern recognition) and model (structure)
         entropy proportional to pixel/shape/color/relationship space
         encodes structure, relationship, and pattern simultaneously
         the same visual read by a model and a human extracts different but
         complementary entropy — both valid, both live references
```

a visual of a complex reasoning structure encodes:
- the full node relationships (structure)
- the convergence state of each node (density/color)
- the approach vectors (lines/arrows)
- the historical path (layering/depth cues)
- the generic pattern it instantiates (shape family, symmetry group)

all simultaneously, without requiring the reader to know the logical form first.

