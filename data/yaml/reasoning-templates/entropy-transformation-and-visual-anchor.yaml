## the complete recycling condition

entropy from layer 0 can be recycled — moved from scratch pad to transformed state —
ONLY when every bit of its entropy has a live reference somewhere in the tree.

```
refcount = up-refs       (something above uses this node's pattern)
         + down-refs     (this node was derived from something below)
         + directional   (points toward a future state, desired or inevitable)
         + visual-refs   (captured in a visualization — always ≥ 1 possible)
```

because visual-refs are always available, refcount is never truly zero.
no entropy is ever genuinely orphaned.
the question is not "can this be dropped?" but "into what form is it transformed?"

---

## the modulo 13 archetype

the canonical transformation:

```
old implementation:
  harmonic truth assertion = divide value by 13, check remainder
  O(n) division, every step explicit, full computation each call

new implementation:
  modulo + precomputed lookup table
  O(1), complete operation in one step, no division at runtime

what happens to the old implementation:
  NOT deleted
  transformed into: research basis — the ground truth of why the table works
  its reference changes from "active use" to "basis for correctness proof"
  the lookup table references it as its own derivation
  refcount never reaches zero — it IS the proof that the new form is valid

the transformation record:
  what it was:    division → remainder → truth check
  what it became: modulo → table index → truth value
  equivalence:    both compute the same function; table precomputes all 13 outputs
  stored at:      layer 1 (valid detail, the derivation history)
  referenced by:  the lookup table implementation (up-ref)
                  the original division logic (down-ref, it derived from this)
                  future researchers verifying the optimization (directional-ref)
```

the old evolutionary chain becomes the proof that the new compact form is correct.
continued refinement is free — each transformation does the COMPLETE operation.
no residue, no approximation, no lost entropy.

