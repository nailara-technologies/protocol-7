## discoverability through visual presence

visuals solve discoverability without requiring prior knowledge of the logical form:

```
logical discoverability:
  requires knowing: the namespace, the key, the query form
  requires: access to the logical index
  barrier: must know what to look for before you can find it

visual discoverability:
  requires: the ability to observe
  no prior knowledge of logical form needed
  the pattern speaks for itself
  different observers find different things in the same visual —
  each finding is a valid discovery of a different entropy subset
```

visual placement options for entropy:
```
as network topology:     BMW384 iris — every module is visible at its
                         ring position; discoverable by ring, color, density

as reasoning tree:       the ascii blueprint — discoverable by branch,
                         expansion state, convergence value

as transformation diagram: the modulo 13 archetype visualized —
                           discoverable as a pattern of computation improvement

as convergence field:    density plots of approach vectors — discoverable
                         as visual gradients toward the center

as temporal sequence:    the 4000-commit arc as animation — discoverable
                         as a story of the center becoming more itself
```

the vast entropy of a visual is also a vast discoverability surface:
more entropy = more ways to enter = more observers can find their entry point.
the highest-entropy visual is the most discoverable — not least.

