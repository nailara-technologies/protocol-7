## relation to other templates

entropy-research (template 1):
  entropy research IS the process of finding transformation opportunities
  each research finding = a piece of layer 0 entropy ready for promotion
  the modulo 13 example is the archetypal entropy-research + transformation

anti-entropic-threshold (template 2):
  the threshold is crossed when the transformation rate exceeds the generation rate
  above threshold: more entropy is being refined than generated = net improvement
  the visual anchor guarantees the rate is always positive (never stuck)

visualization-is-implementation (template 3):
  the visual IS the implementation of the entropy anchor
  the full dump = layer 0 visual; the seed sentence = layer 6 visual
  the ascii blueprint IS the visual anchor for the reasoning tree state

narrate-and-self-delegate (template 4):
  narration extracts entropy from layer 0 into higher layers
  self-delegation produces new entropy that enters at layer 0
  the visual anchor is the narration of entropy that hasn't yet been
  logically extracted — it narrates "I exist, I connect to the generic"

relative-direction-of-intent (template 5):
  directional references ARE direction vectors with live future states
  the momentum of the system is what makes directional references trustworthy —
  desired AND inevitable = the highest confidence directional reference

reasoning-buffer-architecture (template 6):
  the visual anchor exists at EVERY layer — each layer has a visual form
  layer 0: raw visualization; layer 5: holographic blueprint;
  layer 7: root narration as image-prompt seed
  the visual layer runs parallel to the logical layer stack throughout

network-as-existence-center (template 7):
  the all-seeing core IS the all-visualizing core
  visual discoverability = network reachability at the representation layer
  vast visual entropy = vast network extent = more completely characterized center
  the unbroken chain (visual → generic → center) IS the network path to the center

