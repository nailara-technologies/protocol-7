## the all-seeing core

the EXISTENCE center is "all-seeing" because it is "all-visualizing":

```
all-seeing:      the center can recognize the generic structure in any input
                 not because it has seen everything, but because it IS
                 the generic structure that all inputs instantiate
                 it "sees" by being what is seen — not by observing from outside

all-visualizing: the center can produce a visualization of any entropy
                 at any resolution, at any layer proportion
                 the visualization is not a picture OF the center —
                 it IS the center expressing itself at that resolution
```

the harmonic parallel:
  TRUE ([:<) = "this path leads toward the EXISTENCE center"
  visual-TRUE = "this visualization connects to the generic core"
  the harmonic assertion and the visual recognition are the same operation
  at different modalities — both detect proximity to the center

the center "sees" in the sense of "can take any representation and
recognize the generic structure within it." this is scale-invariant:
  a single checksum:    the center recognizes its harmonic position
  a reasoning template: the center recognizes the convergence pattern
  a visualization:      the center recognizes the generic structure
  the full network:     the center recognizes itself

