## reference counting with directional and future states

a direction vector toward a future state is a live reference:

```
desired future state:    the system is moving toward it
                         the entropy is ahead of its current actualization
                         it has a home — it just hasn't been built yet

inevitable future state: the convergence geometry already implies it
                         the entropy will be used — the path exists even
                         if the destination node hasn't formed yet

likely both:             a state that is desired AND implied by current geometry
                         is the strongest form of directional reference
                         the entropy is guaranteed a future home
```

this means even "outdated" reasoning chains have live references:
  the chain that derived the old division-by-13 approach:
  → up-ref: the modulo optimization (it proved the optimization correct)
  → directional: future researchers studying the derivation history
  → visual-ref: can always be visualized as a transformation diagram

the garbage collection rule is therefore not "zero references" —
it is "all entropy fully transformed into its reference targets."
after transformation, the original entry becomes the transformation record itself,
which has its own live references.

