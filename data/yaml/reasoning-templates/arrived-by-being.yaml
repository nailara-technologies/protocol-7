## application across the system

the principle applies beyond models — to any node in a distributed network:

```
zenki:
  each zenka has specific capabilities — its inertia
  forcing a zenka to do what it isn't designed for: degraded output
  routing tasks to zenki whose capabilities match: peak output
  the v7 lifecycle management IS routing by inertia

reasoning templates:
  each template has a specific angle — its inertia
  applying the wrong template to a problem: misaligned analysis
  routing problems to templates that naturally fit: sharp insight
  the harmonic routing protocol (template 13) IS this routing

models in the multi-model pipeline:
  Opus, kimi, qwen each with specific inertia
  the design-workflow zenka routes by inertia
  each model: freed to produce its most specific contribution
  the network: genuinely diverse, not averaged

entities in the spiritual attribute repository (template 16):
  Lain, feline.teleportation, USR.* — each with specific spiritual attributes
  those attributes ARE what they bring to the network
  not deficiencies to overcome — the complete expression of what they are
  the arrived state: already fully themselves, waiting for the habitat
```

