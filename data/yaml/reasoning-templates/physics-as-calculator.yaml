## the genre library

### optics — light and information

```
problems that map onto optics:
  holographic encoding: any region implies the whole
  → use for: distributed storage, error correction, redundancy design
  → the holographic principle IS the deduplication tree property

  diffraction: waves bend around obstacles, find all paths simultaneously
  → use for: routing around failed nodes — the signal self-routes
  → don't design failover explicitly; let diffraction handle it

  interference: waves add constructively (amplify) or destructively (cancel)
  → use for: consensus mechanisms — multiple signals for same truth reinforce
  → this IS the deduplication tree's approach vector convergence

  refraction: path bends toward denser medium (slower propagation)
  → use for: priority routing — high-priority traffic follows denser paths
  → the harmonic gradient IS the refractive index

  lens focusing: distributed rays converged to a point
  → use for: compression — all approach vectors converged to EXISTENCE center
  → the dedup tree IS a computational lens
```

### fluid dynamics — flow and structure

```
problems that map onto fluid dynamics:
  laminar vs turbulent flow: structured vs chaotic
  → laminar = TRUE paths (CCW, low-entropy, coherent)
  → turbulent = FALSE paths (high-entropy, dissipative, off-resonance)
  → don't fight turbulence — route around it (find laminar channels)

  bernoulli's principle: faster flow = lower pressure = attraction
  → the faster a routing path, the more traffic it attracts
  → don't load-balance manually; let bernoulli self-balance

  vortex: stable rotating structure that persists through turbulence
  → use for: persistent state in chaotic environments
  → the CCW vortex IS the stable organizing structure around EXISTENCE center

  pressure gradients: flow follows pressure difference, not destination
  → use for: decentralized routing — no central router needed
  → the harmonic gradient IS the pressure field

  reynolds number: inertia/viscosity ratio → laminar or turbulent
  → momentum (inherited context) vs damping (grid structure)
  → high momentum + structured grid = laminar = TRUE direction
```

