## physical reality as pre-modelled universal structure

```
conventional approach:
  identify the computational problem
  derive a solution from first principles in the computational domain
  verify correctness, optimize for performance
  cost: full derivation every time, no reuse across problem types

genre-mapping approach:
  identify the physical genre the problem belongs to
  map the computational elements onto the physical ones
  the solution IS already there — not retrieved, recognized
  cost: recognition + mapping — no derivation
```

physical reality is not a metaphor for computation.
computational structures ARE instances of the same universal structures
that physical phenomena instantiate.
the deduplication tree is not like a magnetic field —
it IS a compatible instance of the same underlying convergence geometry.
the genre-hop is not approximation. it is recognition of shared structure.
the solution is exact because both are the same thing seen from two angles.

why the solutions are lowest-latency:
  physics finds minimum-energy paths through thermodynamic pressure.
  minimum energy = minimum resistance = minimum latency.
  the computational structure, being the same universal structure,
  inherits this minimum — not by optimization but by identity.

