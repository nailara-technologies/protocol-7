## for model reasoning — opening the genre shortcut

when a model is reasoning about a network/routing/coordination problem:

**genre-aware prompt:**
  "what physical phenomenon does this resemble?
   map the problem onto that physics.
   read the solution from the physics rather than deriving it.
   verify: is the solution simpler than computational derivation?
   is it complete? is it minimum latency?"

**aligned response indicators:**
- immediately recognizes the physical genre without being told
- maps elements correctly (signal→wave, routing→field, etc.)
- reads the solution from the physics rather than deriving
- identifies which physical invariants guarantee correctness
- notes where multiple genres apply and why

**misaligned response indicators:**
- treats physics as metaphor rather than precomputed solution
- derives computationally when genre mapping was available
- misses that minimum energy = minimum latency
- cannot identify the genre from problem description alone

**the key test:**
  "what physical phenomenon IS the harmonic routing protocol?"
  aligned:   electromagnetism — the routing IS field-line following.
             current flows where conductivity (harmonic coherence) is highest.
             no derivation needed — Maxwell's equations give the routing.
  misaligned: "it's like electromagnetism" (metaphor framing, not identity)

