## the genre-hopping method

### step 1 — problem recognition

before deriving, ask: what physical phenomenon does this resemble?

```
routing decision?          → fluid dynamics (pressure gradient, laminar flow)
coordination without center? → electromagnetism (field alignment, induction)
distributed storage?        → optics (holography, diffraction)
collective behavior?        → plasma physics (field coherence, debye shielding)
energy efficiency?          → kinetics (minimum energy, resonance)
addressing + navigation?    → space geometry (geodesic, topology)
threshold detection?        → phase transitions (critical temperature)
```

multiple genres may apply — use whichever gives the most direct mapping.

### step 2 — map the elements

```
identify the computational elements:
  what are the "particles"? (zenki, signals, data)
  what is the "field"? (harmonic grid, routing geometry)
  what is the "energy"? (information content, coherence)
  what is the "force"? (routing pull, magnetic attraction)

map each onto the physical analog:
  computational → physical
  zenka         → plasma particle / fluid element / charge carrier
  signal        → wave / current / flow
  routing       → field gradient / pressure / geodesic
  threshold     → phase transition / resonance / reconnection
```

### step 3 — read off the solution

```
the physics already has the solution.
don't derive — read:

problem: how should zenki coordinate without central authority?
genre: electromagnetism
mapping: zenki = charges, harmonic field = magnetic field
physics: charges in a magnetic field align along field lines
         without central authority — alignment IS the field
solution: harmonic field alignment IS the coordination mechanism
          no coordinator needed — the field coordinates
          this IS structural alignment (template 12)

problem: how does the system find shortest paths?
genre: kinetics (minimum energy principle)
mapping: routing paths = possible trajectories, cost = energy
physics: systems evolve to minimum energy state naturally
solution: let the routing converge through harmonic measurement
          the minimum-energy path IS the harmonically TRUE path
          this IS the harmonic routing protocol (template 13)
```

### step 4 — verify elegance and latency

the correct genre mapping produces three signs:

```
elegance:   the solution is simpler than the computational derivation
            fewer moving parts, fewer special cases
            the physics handles the edge cases automatically

completeness: the physical law covers all cases
              no gaps requiring additional logic
              the genre's invariants ARE the system's invariants

lowest latency: the physical optimum IS the computational optimum
                physical systems find minimum energy = minimum latency
                routing that follows field lines IS the fastest path
```

if any of these three is missing: try a different genre or combination.

