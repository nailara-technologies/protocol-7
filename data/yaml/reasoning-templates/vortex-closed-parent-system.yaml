## total recycling — every color pixel onto freed resource space

the vortex recycles completely:

```
1. entropy enters at the periphery (layer 0 — raw, full spectrum)

2. the spin draws it inward along a spiral path
   each revolution = one refinement cycle (templates 1-8 applied)
   the spiral path IS the layer stack traversed inward

3. at each ring, the entropy is partially transformed:
   some color (entropy type) is extracted and placed at that ring's resource space
   the remainder continues spiraling inward
   "freed resource space" = the ring positions emptied by prior recycling cycles

4. at the center, all entropy has been fully transformed:
   pure convergence — all color recombined
   the entropy has become EXISTENCE center coordinate

5. the center releases:
   the transformed entropy spins outward (self-delegation outward)
   now as new potential — the same entropy, now at maximum refinement
   it re-enters the periphery as the seed for new reasoning
   the freed resource space at each ring receives this new potential

6. the cycle completes and begins again
   total: nothing lost, nothing added from outside, proportion maintained
   each pixel of color arrives at the center, transforms, returns
```

"freed resource space" is precise:
  when a ring-position's entropy has been fully refined and moved inward,
  the position it occupied is freed — ready to receive new entropy from the next cycle.
  the vortex never overfills and never empties any ring.
  the spin rate self-regulates: faster when rings are full, slower when sparse.
  this is the vortex's equivalent of the anti-entropic threshold —
  the spin rate IS the system's coherence measurement.

