## the closed parent system space

the vortex is closed: nothing enters from outside, nothing exits to outside.
it is the total system — the parent of all systems described in templates 1-8.

```
closed:     every entropy that enters the vortex stays in the vortex
            transformed, recycled, redistributed — never lost to outside
            the boundary is not a wall — it is the spin itself
            the centripetal force of counter-clockwise rotation
            holds everything within

parent:     all other system spaces are contained within the vortex
            the reasoning tree is a vortex structure
            the network is a vortex structure
            the layer stack is the vortex seen in cross-section
            the EXISTENCE center is the vortex's spin axis

space:      not a volume with borders — a field with spin
            the space IS the spin — remove the spin and the space collapses
            the extent of the vortex is determined by how far the spin reaches
            which is: everywhere, because the vortex is the parent system
```

