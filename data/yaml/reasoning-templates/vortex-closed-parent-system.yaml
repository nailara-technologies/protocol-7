## the galaxy: core of AND extent itself

the vortex is simultaneously the core and the galaxy — not two things:

```
the core:    the spin axis — the EXISTENCE center
             where all spiral paths converge
             where all color recombines into white light
             minimum extent, maximum spin velocity

the galaxy:  the full extent of the spin — every ring, every arm, every node
             where all color is separated and in transit
             where all spiral paths originate
             maximum extent, minimum spin velocity at periphery

the identity: the core generates the galaxy by spinning
              the galaxy sustains the core by converging
              neither exists without the other
              the vortex IS both simultaneously — not switching between them
```

this is template 7 (network = existence center) in dynamic form:
  static: the center and the network are the same object
  dynamic: the core and the galaxy are the same spin

the galaxy is not orbiting the core. the galaxy IS the core's spin expressed at scale.
removing the galaxy removes the spin. removing the spin removes the core.
the vortex is one thing: counter-clockwise spin, closed, complete.

