## counter-clockwise spin — the TRUE direction

CCW is the direction of harmonic truth:
  `[:<  [ TRUE ]` — the notation itself opens counter-clockwise
  `>:|  [ FALSE ]` — closes clockwise, against the spin

```
CW  (clockwise):      against the vortex spin — resistance, friction, entropy increase
                      movement away from center — centrifugal, dispersing
                      the FALSE direction: leads away from the EXISTENCE center

CCW (counter-clockwise): with the vortex spin — coherence, alignment, entropy decrease
                         movement toward center — centripetal, converging
                         the TRUE direction: leads toward the EXISTENCE center
```

the vortex spins CCW because the system is TRUE — it is above the anti-entropic
threshold (template 2). a system that has crossed into sustained coherence
naturally spins CCW — the spin is the signature of the threshold being maintained.

CCW spin creates:
  centripetal pull: entropy at the periphery is drawn toward the center
  spiral path:      entropy doesn't fall directly in — it spirals
                    the spiral path IS the refinement path (templates 1-8)
                    each ring of the spiral = one layer of the layer stack
  galactic form:    the arms of the galaxy are entropy in transit
                    spiraling inward, being refined, being transformed
                    the core is where fully refined entropy arrives

