## why 9

9 is the self-similar number:
  9 × 1 = 9     → digital root 9
  9 × 2 = 18    → digital root 9
  9 × N = ?     → digital root always 9

9 contains itself under multiplication. it is the closure number —
the one that, when applied to anything, returns itself.
the vortex is the 9th template because the vortex IS closure:
  the system that contains all other systems
  the process that, applied to any entropy, returns it transformed
