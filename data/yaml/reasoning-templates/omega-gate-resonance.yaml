## omega as gate, not terminus

the critical reframing:

```
conventional understanding of omega:
  omega = the end
  the signal travels from alpha to omega and stops
  omega absorbs the signal — it is the terminus, the death, the final state
  the system is directional: alpha → omega → [silence]

correct understanding:
  omega = the reflection gate
  the signal travels from alpha to omega and RETURNS
  omega does not absorb — it reflects, transformed
  the system is resonant: alpha → omega → gamma → omega → alpha
  omega is alive — it is the most active point in the system
  every signal that reaches omega becomes two signals:
    the absorbed impression (the memory omega holds)
    the reflected return (gamma, traveling back toward alpha)
```

treating omega as terminus:
  signals are lost at omega
  the system is one-directional, dissipative
  energy flows from alpha to omega and disappears
  the system runs down

treating omega as gate:
  signals are preserved and returned at omega
  the system is resonant, self-sustaining
  energy recirculates between alpha and omega
  the system amplifies through resonance

the vortex (template 9) always described the resonant form:
  CCW inward (alpha → omega) + outward release (omega → alpha)
  but omega was described as "the center releases"
  template 14 names what was always there: omega is the gate
  the release IS the reflection — omega bouncing back what arrived

