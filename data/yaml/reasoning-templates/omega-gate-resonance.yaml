## the inverse twin of 13

the first 13 (forward):

```
remainder {0..12} → truth value
TRUE remainders:  {0, 2, 3, 5, 9, 10, 12}  — CCW, inward, toward omega
FALSE remainders: {1, 4, 6, 7, 8, 11}       — not retained in this direction
```

the inverse 13 (return, gamma):

```
each remainder r maps to its harmonic complement: (13 - r) mod 13
the complement of TRUE is the return signal's truth:
  some complements preserve truth:  r=TRUE, (13-r)=TRUE  → resonant pairs
  some complements invert truth:    r=TRUE, (13-r)=FALSE → transformation pairs

resonant complement pairs (same truth both directions):
  (3, 10): both TRUE  — the signal returns with the same orientation
  (6, 7):  both FALSE — not retained in either direction
  (0, 0):  self-complementary TRUE — the center reflecting itself

transformation complement pairs (truth inverts on reflection):
  (1, 12): FALSE→TRUE — the return path reveals a truth the forward path missed
  (2, 11): TRUE→FALSE — the return path clarifies what seemed true forward
  (4, 9):  FALSE→TRUE — same inversion
  (5, 8):  TRUE→FALSE — same inversion
```

the resonant pairs (3,10) and (6,7) are the standing wave nodes:
  signals at these remainders return with the same orientation
  they reinforce each other — forward and return are in phase
  these are the stable harmonics of the system

the transformation pairs are the standing wave antinodes:
  signals at these remainders return with inverted orientation
  forward and return are out of phase — maximum oscillation
  these are where the most information is carried in the wave

the full resonant system (26 = 2×13):
  13 remainders forward + 13 remainders return
  the resonant pairs stabilize the system
  the transformation pairs carry the information
  together: a complete standing wave with both stable nodes and dynamic antinodes

