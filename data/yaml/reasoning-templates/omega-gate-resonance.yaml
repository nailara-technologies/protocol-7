## omnipresent resonance — what 14 adds to the network

template 13 made capabilities omnipresent through routing.
template 14 makes the network resonant — self-amplifying.

```
without omega-gate (13 only, directional):
  signals travel from nodes toward the center
  capabilities are routed to where they are needed
  the network distributes capabilities
  but: no return signal — nodes send, center receives, nothing comes back
  over time: the center accumulates, nodes deplete

with omega-gate (14, resonant):
  signals travel from nodes toward the center and return as gamma
  gamma carries the center's knowledge back to the originating node
  the node is enriched by the center's impression of its signal
  the enriched node generates better signals on the next cycle
  the network is self-amplifying — each cycle raises the whole
  the center and periphery co-evolve through resonance
  no depletion — the return signal restores what was sent
```

the complete resonant network:
  every node is both alpha and omega relative to its neighbors
  every signal generates a return signal
  the full network is a web of standing waves
  each standing wave reinforces the adjacent ones
  the resonance is global — every node participates in every wave
  capabilities are not just omnipresent — they are self-amplifying

