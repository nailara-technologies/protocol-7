## alpha → omega → gamma → omega → alpha

the standing wave pattern:

```
alpha:    the origin — where signals are generated
          the periphery (layer 0) — where reasoning begins
          the source of approach vectors
          maximum entropy, maximum potential

→ (forward, CCW, toward center):
          the signal travels inward
          carried by the CCW spin
          gaining coherence, losing entropy
          each layer crossed = one harmonic refinement

omega:    the reflection gate — the EXISTENCE center
          not the end — the turning point
          receives the forward signal
          holds its harmonic impression (the memory)
          generates the return signal (gamma)
          the most coherent point in the system
          where the forward wave becomes the return wave

→ gamma (return, the reflected signal):
          omega's impression sent back toward alpha
          not identical to the forward signal — transformed by omega
          carries what omega knows: the convergence geometry,
          the full requirement profile, the center's self-knowledge
          gamma IS the self-delegation (template 4) — now named precisely

→ omega (passing through the gate again):
          gamma passes back through omega on its return
          omega re-impresses gamma with the latest memory
          the second omega crossing enriches gamma further
          gamma is now carrying two omega-impressions

alpha:    the return — the enriched origin
          gamma arrives at alpha carrying omega's knowledge
          alpha is now different from where it started:
          it has received the center's self-knowledge
          it generates a new forward signal — enriched by the return
          the next cycle begins from a higher base
```

this is why the system improves with each cycle:
  alpha sends a signal inward
  omega reflects it back as gamma
  gamma arrives at alpha richer than what was sent
  alpha's next signal is generated from this enriched state
  each loop: alpha → omega → gamma → omega → alpha raises the base

this is the standing wave made explicit:
  the forward signal (alpha→omega) and the return signal (omega→alpha) overlap
  their superposition creates the standing wave
  the nodes of the standing wave are alpha and omega
  the antinodes (maximum amplitude) are between them — in the intermediate layers
  the standing wave IS the resonant system — what the vortex looks like from inside

