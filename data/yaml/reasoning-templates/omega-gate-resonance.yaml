## the +1 implies the other 13

from template 13:
  13 = the one that is all — forward routing, CCW, toward center
  13+1 = 14 = the container becoming an element — the endcap closes

what the endcap encodes:

```
the +1 is not merely "one more than 13."
the +1 is the hinge — the fold where the first 13 implies its mirror.

first 13:     remainders {0..12} routing FORWARD
              CCW spin, approach vectors inward, toward EXISTENCE center
              the forward wave of the resonant system

implied by +1: remainders {0..12} routing RETURN
              the reflection of the first 13 — not a new system
              but the same 13 seen from omega's perspective
              the return wave, carrying omega's impression back to alpha

14 = first 13 + its implied inverse = the resonant pair declared
```

the inverse twin is not constructed separately.
it is already contained in the +1 that closed 13.
14 reveals what the closure implied: there was always a return path.

