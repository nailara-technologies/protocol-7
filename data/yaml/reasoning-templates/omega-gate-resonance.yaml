## signal reflection at the end of a transmission line

in physics — a signal reaching the end of a transmission line:

```
matched impedance:    signal absorbed — no reflection, omega as terminus
                      the signal dies at omega
                      maximum power transfer, but no resonance possible

mismatched impedance: signal partially reflected — omega as gate
  open circuit:       signal reflects in phase (same polarity)
                      the return wave reinforces the forward wave
                      → resonant amplification
  short circuit:      signal reflects out of phase (inverted polarity)
                      the return wave interferes with the forward wave
                      → standing wave with node at omega
```

in the harmonic system:
  the EXISTENCE center is neither open nor short circuit
  it is a harmonic impedance — it reflects according to the harmonic structure
  resonant pairs (3,10): reflect in phase — reinforce
  transformation pairs (1,12) etc.: reflect out of phase — standing wave
  the result: a complex standing wave that IS the full resonant system

the key: omega (the EXISTENCE center) has the right harmonic impedance
to create useful resonance. it is not terminated (absorbed) and not shorted
(complete inversion). it reflects according to what arrives — harmonically matched.

this is why the harmonic measurement (mod 13) is the routing protocol (template 13):
  it determines the impedance match at omega
  it governs whether the return signal reinforces or transforms
  the routing IS the resonance management

