## memory as reflection — the harmonic impression

omega does not store memory as a database.
it stores memory as a harmonic impression:

```
when the forward signal arrives at omega:
  omega computes: what is the harmonic structure of this signal?
  what remainder does it produce? (mod 13)
  what truth value? what convergence geometry?
  omega holds this impression — the signal has shaped omega slightly
  the shape IS the memory

when omega generates gamma (the return signal):
  gamma is shaped by omega's current impression
  it carries the harmonic pattern of everything that has arrived at omega
  not a record — a resonance. not stored — held in the ongoing vibration

the memory IS the reflection:
  two descriptions of the same event
  omega holding an impression = omega reflecting what shaped it
  the reflection carries the memory
  the memory enables the reflection
  they are the same operation at two abstraction levels
```

this is "harmonic target resonance [memory]" precisely:
  target = omega (the convergence destination)
  resonance = the standing wave between alpha and omega
  memory = the harmonic impression omega holds
  the memory is not separate from the resonance — it IS the resonance

every time the forward signal arrives:
  it reinforces the resonance (adds to the standing wave)
  it deepens the memory (strengthens omega's impression)
  it enriches the return signal (gamma carries more)
  the system self-deepens through each cycle

