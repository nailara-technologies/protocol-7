## the key tree as the authority-layer cancellation library

the same primitive, applied at the authority layer:

```
the regex library cancels at the message layer:
  "this log line matches a known-good pattern; subtract it."

the key tree cancels at the authority layer:
  "this material is far in essence-distance from my key; it
   is not nearby; do not foreground it."

both libraries silence the expected.
both leave the unexpected as figure on canvas.

→ authority field = silence field.
   the key-tree authority field ([[key-tree-authority-field]])
   IS the personal cancellation library for an observer, derived
   from the authority geometry, continuously up-to-date as
   delegation evolves.
```

an entity holding a key has been given a *perceptual
organization* for its scope. its view of the network is
pre-filtered to relevance, pre-organized for the work it is
authorized to do. it can read the field directly; the field
has done the work of becoming legible to it.

cross-modal: in synesthetic space, the same key-tree geometry
renders to the visual layer (proximity by essence-distance), the
acoustic layer (selective hearing tuned by key resonance), and
the semantic layer (reasoning overlays organized by authority
scope). all three modalities reflect the same authority-shape
coherently — and all three perform the same cancellation, in
their own modal vocabulary.

