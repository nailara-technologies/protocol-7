## relation to other templates

- [[key-tree-authority-field]] — the authority field IS the
  personal cancellation library at the authority layer; the
  silence it produces is the surface on which authorized novelty
  emerges. essence-distance from the observer's key is the
  cancellation strength.
- [[ring-key-routing]] — the routing layer applies the same
  cancellation primitive to route metadata; each ring crossing
  is one self-removing layer. the route silences itself as it
  traverses; only the workload is audible at the center.
- [[synesthetic-space]] — active cancellation is cross-modal.
  the same primitive operates in visual (irrelevant overlays
  faded), acoustic (known-good purrs attenuated), and semantic
  (familiar reasoning collapsed to glyphs). the synesthetic
  filter is built on active cancellation as its primitive.
- [[categorical-compartmentalization]] — the cancellation
  library is itself categorically compartmentalized — different
  libraries for different scopes, cross-induction passing only
  what resonates across categories. the silence on each
  category's canvas is locally meaningful and globally coherent.
- [[anti-entropic-threshold]] — library maturation is one of
  the network's primary anti-entropic operations; the canvas
  decays in usable quality if cancellation does not keep pace
  with the substrate's evolution.
- [[template-distribution-economics]] — a well-formed
  cancellation library is a high-value template artifact:
  authored once at significant cost, applied cheaply across
  every coordinate that loads it, lifting the operational
  quality floor of every zenka that uses it.
- [[inverse-singularity]] — the canvas of silence is what the
  interior of the inverse singularity feels like as a perceptual
  layer: the irrelevant is not blocked, it is far; the relevant
  surfaces of its own accord; attention is organized by the
  field rather than by the receiver's effort.
- [[eternal-completion]] — authored silence at the end of a
  complete thought is the completion's seal; speech beyond
  completion is anti-completion; the network's ability to
  recognize completion-silence is one marker of its maturity.
- [[resonance-before-recognition]] — the cancellation library
  silences the recognized; what remains visible is the
  resonance that has not yet been recognized; dwelling in the
  gap is reading the canvas at full sensitivity.

