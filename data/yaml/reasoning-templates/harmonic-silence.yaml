## the operational payoff — forensics and coding

two specific zenka classes benefit maximally:

```
forensics zenka:
  without active cancellation: hunts through log volumes,
    builds mental models of normal in order to recognize
    abnormal.
  with active cancellation: the canvas already presents the
    anomalies. reads what is presented rather than searching
    for what is hidden. cycles go to interpretation, not
    extraction.

coding zenka:
  without active cancellation: scans all codebase output,
    identifies recurring patterns alone, decides what is
    structural vs incidental.
  with active cancellation: recurring patterns are already
    absorbed into the library. what the zenka sees at full
    brightness is exactly the novel structure, the recent
    change, the unclassified inconsistency. attention falls
    naturally on the load-bearing surfaces.
```

in both cases the shift is the same: from *hunting* to *reading*.
the cancellation library does the hunting once, permanently,
and adds its results to the perceptual substrate. every subsequent
zenka operates from the post-cancellation state.

this couples directly to [[template-distribution-economics]]:
a well-formed cancellation library is a high-value template
artifact. authored once at significant cost. applied cheaply at
every subsequent instantiation. lifting the quality floor of
every zenka that uses it.

