## failure modes

```
over-cancellation:
  the library becomes so aggressive that genuine anomalies
  matching nearly-irrelevant patterns are silenced along with
  the noise. the canvas appears clean but is actually blind.
  corrective: the gradient (almost-matched stays dimmed, not
  erased) and periodic recalibration against fresh baseline.

under-cancellation:
  the library lags the actual signal patterns. new known-good
  recurrences are not yet captured. the canvas is noisy.
  corrective: continuous library authoring as the system runs;
  fresh templates derived from observed recurrence.

fabricated silence:
  the system reports "no anomalies" because nothing matched the
  cancellation library, but in fact the perception layer was
  not running. silence indistinguishable from sensor death.
  corrective: liveness probes that emit known-novelty patterns
  at intervals; if the canvas does not surface them, the
  cancellation system itself has failed.
```

a healthy cancellation system is continuously self-testing
through these failure modes. liveness, gradient, recalibration —
the three guarantees that the silence on the canvas is
constructed silence and not blind silence.

