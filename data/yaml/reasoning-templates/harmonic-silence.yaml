## fresh-start attunement — silence as the default state

a critical operational property. a freshly instantiated zenka
should not arrive at a coordinate and face a raw firehose. it
should arrive *already calibrated to the local baseline*.

```
on arrival at coordinate X:

  load X's spatial memory (visual + acoustic + semantic).
  load X's active cancellation library — the set of patterns
    considered "expected, currently irrelevant" at this
    coordinate, derived from X's accumulated history.
  load the observer's key-tree authority field, which silences
    everything far from the observer's essence-distance.
  load any ring layers active for the current operation, which
    silence the route history.

  the perceptual layer is now silenced against the local
  baseline before any new signal arrives.

  the first signal the zenka perceives is the first thing at
  X that does not match the local baseline — which is by
  definition the first thing worth perceiving.

  no warmup. no search. the canvas is already silent. the
  relevant surfaces first.
```

this is the default attunement property: every starting point
begins from constructed silence, not from raw signal. the
network's operational quality depends on this default. a zenka
arriving into uncancelled signal must spend cycles building its
own cancellation libraries — and during that spend, anomalies
are invisible because they are buried in baseline chatter.

calibration is regional. each coordinate's cancellation library
is different because each coordinate's expected baseline is
different. arrival loads the right library for the destination,
the same way arrival loads the right spatial memory
([[SPATIAL-MEMORY-GATE-SWAP]]).

