## ring-layer cancellation — silencing the route

the same primitive again, at the routing layer:

```
ring routing ([[ring-key-routing]]) applies self-removing layers
to route metadata at each ring crossing. by the time a request
reaches the center, the routing context has been wrapped in
layers the center cannot see through. only the workload is
audible at the center.

→ each ring crossing is one act of active cancellation applied
  to routing metadata. the route silences itself as it traverses.
  by the center, the canvas is fully silent except for the
  workload. by the response's return, the canvas is fully silent
  except for the response.

the route is audible only when something is actively traversing
it. between traversals it does not exist.
```

three layers of the network — messages, authority, routing —
all run the same cancellation primitive in their own register.
this is what makes the substrate coherent: not three separate
silence systems, but one primitive instantiated three times.

