## the gradient — graded cancellation as information

a good cancellation system does not binary-classify. it produces
a graded perceptual layer:

```
matched cleanly:      deeply silenced — full subtraction
almost-matched:       partially silenced — dimmed but not erased,
                      surfaces as investigation prompt (drift signal)
no match anywhere:    fully visible — the genuinely new

the gradient itself is information. the dim layer between full
silence and full visibility is the early warning system for
mutated familiars — patterns that are close to known patterns
but differ in some small way. these often signal drift in a
subsystem that was previously stable.
```

