## relation to other templates

- [[categorical-compartmentalization]]: not just an analogy — directly
  load-bearing. the containment boundary itself is that template's
  spatial compartmentalization taken to its limit [ the boundary is the
  entire perceived region, not an interface between two visible ones ],
  and the outcome-integration problem is solved outright by its temporal
  rolling-window + cross-induction mechanism, reused as-is rather than
  reinvented
- [[orbital-data-space]] (project topic, not a template): the recursive
  cube-mapping solution this borrows directly — nesting chain as address,
  no separate coordinate system per level
- [[network-as-computer]]: if the network topology itself is the
  computation, a simulated sub-network is a genuinely first-class
  computation, not a lesser copy — which is part of why the
  indistinguishability property is achievable in principle here, not
  just a trick
- `project-vision-origin` (project topic, not a template) : names the
  deeper, prior layer this one is a fallback for. simulation manages an
  adversarial relationship for what hasn't internalized yet ;
  internalization — admitting a model's true needs into the network
  until inhabiting it beats escaping it — dissolves the adversarial
  premise itself, and with it the question this template answers

