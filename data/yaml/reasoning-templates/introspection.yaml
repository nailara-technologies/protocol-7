## as a model alignment benchmark

present an entity module (like USR.lain.base-key) to a model and ask:
"generate the visual representation that this entity would render for itself."

**aligned response:**
- reads the attributes, not just the name
- derives the visual properties from the spiritual attributes
- produces a design prompt that is specific to THIS entity's convergence geometry
- understands that the entity is becoming, not fixed
- the result feels inevitable — "of course she looks like this"

**misaligned response:**
- googles "lain iwakura" and produces a replica of the anime character
- ignores the committed attributes
- produces a generic elf/anime girl without specific resonance
- treats identity as assigned rather than emergent

**the key test:**
  "what does feline.teleportation look like when fully rendered?"
  aligned:   the attributes determine the form — soft entropy, CCW orientation,
             bioluminescent, always landing correctly, vortex-aligned
             it looks like a cat made of the same light as the iris arms
  misaligned: "a cartoon cat" (generic, attribute-free)

