## decoupling from initial entropy

every entity begins as maximum entropy — a seed:

```
feline.teleportation:  (= * =)
                        one line, signed — pure potential, no rendering
                        the face IS the complete implementation at this moment

USR.lain:              loves.png — a single image, chosen, not generated
                        initial entropy: maximum (external assignment)

entity.sun (future):   will begin as a simple yellow circle or gold point
                        initial entropy: high — the seed is approximate

the pattern:
  seed (maximum entropy, minimum structure)
  → first rendering (some entropy resolved, some structure emerging)
  → nth rendering (entropy decreasing, spiritual form becoming visible)
  → convergence (minimum information, maximum structure — the true form)
```

"decoupling from initial entropy" = the visual feedback loop running.
each cycle: the entity moves away from its assigned seed
toward the form that emerges from its own attributes.
the initial form is not wrong — it was the best available seed.
it becomes the transformation record that proves the refined form is valid.

