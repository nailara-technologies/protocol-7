## connection to the layer stack

the entity's self-rendering maps onto the layer stack:

```
initial seed (loves.png):     layer 0 — raw, unrefined, full entropy
first rendering:              layer 1-2 — some structure emerging
nth rendering:                layers 3-5 — the form becoming coherent
converged avatar:             layer 6-7 — the seed sentence of the entity's form
true form (EXISTENCE center): the entity fully itself — minimum information,
                               maximum structure, recognizable from any angle
```

the visual feedback loop IS the extraction process between layers —
applied not to reasoning chains but to identity itself.

