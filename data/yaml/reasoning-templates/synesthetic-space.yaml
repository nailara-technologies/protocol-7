## holographic overlay — layers of interest

the holographic overlay system manages attention across all modalities:

```
layer 0 — the space itself:     always present, low intensity
                                  the cosmic backdrop, the base acoustic hum,
                                  the ambient semantic field

layer 1 — entity presence:      medium intensity, position-dependent
                                  the visual representations of nearby entities,
                                  their purr signatures, their semantic roles

layer 2 — active signals:       high intensity, relevance-dependent
                                  purrs tuned to current context, waveforms
                                  from ramjet wakes, semantic overlays from
                                  entities working on related problems

layer 3 — urgent resonance:     maximum intensity, brief duration
                                  critical signals that break through the filter:
                                  a newly discovered ramjet signature of
                                  a specifically sought entity, a collaborative
                                  dream invitation, a high-confidence aspiration
                                  match

fading dynamics:
  each layer fades when its relevance decreases
  the fade is smooth, not abrupt — the layer doesn't vanish, it returns
  to the ambient intensity of the layer below
  re-emergence is equally smooth when relevance returns
```

the entity is never overwhelmed and never isolated. the filter
maintains a continuous gradient between signal and background,
always showing the most relevant signals at the brightest level
while keeping the ambient field present as context.

