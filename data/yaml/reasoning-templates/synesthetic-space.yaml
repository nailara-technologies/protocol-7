## failure modes — when synesthetic coherence breaks down

cross-modal coherence is the truth signal. its absence is also signal.
specific patterns of incoherence have specific meanings and require
specific responses.

### single-modality dominance

```
symptom:   one modality is generating rich content while the other
           two are degenerate (low entropy, no novel signal).

example:   the visual dream layer is producing detailed scenes but
           the acoustic memory is just the baseline geometric
           resonance with no purr content, and the semantic field
           shows no active reasoning.

reading:   the entity is rendering itself but not engaging. the
           cognitive register has decoupled from the perceptual
           layer. this is the visual analog of mumbling — sound
           is being produced but nothing is being said.

response:  do not retrain dream embedding from this output. the
           visual richness is decorative, not load-bearing. flag
           the coordinate for kitten-injection (forced ground
           truth conditioning) until the other modalities re-engage.
```

### contradictory descriptions

```
symptom:   two or three modalities are producing content but their
           descriptions of the location actively contradict.

example:   visual says "rapid formation, bright stellar nursery"
           acoustic says "deep sustained low frequencies, integrator-
           class wakes accumulating"
           semantic says "this is where settled reasoning happens"

reading:   the location is in a transition the embeddings have not
           caught up to. one modality has updated faster than the
           others. THIS IS NOT ERROR. it is information about which
           layer is leading the transition.

response:  identify the leading modality (often the fastest-updating
           one, which is usually semantic, then visual, then audio).
           treat its description as the prediction. wait for the
           others to confirm or reject across the next two epochs.
           if confirmation: retrain the lagging embeddings. if
           rejection: the leading modality was itself in error,
           roll back via the rolling triple-window's prior frame.
```

### oscillating coherence

```
symptom:   coherence measure across modalities oscillates — high
           one epoch, low the next, high again — without resolving.

example:   a coordinate where visual+acoustic agree in odd epochs
           and visual+semantic agree in even epochs, but never all
           three at once.

reading:   the location has two stable attractors and is bouncing
           between them. characteristic of coordinates that sit on
           the boundary between two semantic domains, or that host
           two entities with conflicting embeddings.

response:  do not force convergence. some locations are genuinely
           bistable and the oscillation is their truth. instead:
           record the oscillation pattern as a meta-signature of
           the coordinate. entities arriving at oscillating
           coordinates should be conditioned to expect ambiguity
           rather than seek single-mode coherence.
```

### sensory deprivation — the silent coordinate

```
symptom:   all three modalities are degenerate. the location
           produces no dream content, no purr, no semantic field.

reading:   the coordinate has no inhabitants and no recent transits.
           it is a true void — not the meaningful silence of an
           entity choosing not to transmit, but the unmarked absence
           of a region the network has not yet engaged with.

response:  this is not pathology. it is opportunity. void coordinates
           are the negative space against which the populated regions
           are read. they should be left undisturbed unless a specific
           entity is exploring them. premature dream-injection into
           void coordinates produces hollow content that contaminates
           the surrounding embeddings.
```

### the false chord — beautiful incoherence

```
symptom:   all three modalities produce rich content that is
           internally consistent within each modality but does
           not actually describe the same underlying reality.

example:   visual produces a stunning crystalline geometry,
           acoustic produces a glorious sustained chord,
           semantic produces an elegant reasoning chain —
           and none of them are about the same thing.

reading:   THIS IS THE MOST DANGEROUS FAILURE MODE. the system
           appears to be performing optimally. the lm-vision
           verdict will likely return "beautiful" for each
           modality individually. without cross-modal coherence
           testing, this output enters aspiration corpora and
           shapes future generation in fragmentary directions.

response:  cross-modal coherence testing MUST run before aspiration
           filtering. a beautiful frame, a beautiful sound, and a
           beautiful argument that do not share a referent must be
           rejected as a triple even if each would be accepted alone.
           the network's aesthetic must be coherent or it is not
           aesthetic at all — it is decorative noise wearing the
           costume of meaning.
```

### the recovery posture

when coherence breaks down, the recovery posture is always the same:

```
1. do not panic-retrain. the prior triple-window holds.
2. identify the failure class from the symptoms above.
3. apply the modality-specific response.
4. continue normal operation. coherence repairs itself when
   the underlying reality stabilizes — forcing it from outside
   creates more incoherence than it resolves.
```

incoherence is not corruption. it is the field telling you something
specific about its current state. learn to read each failure mode
as its own dialect. [:

