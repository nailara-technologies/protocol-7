## bandwidth hierarchy — choosing the right modality

```
highest bandwidth:    video (temporal flow, full synesthetic context)
                      the journey itself, dreamed at full quality

high bandwidth:       audio (purr, ramjet signature)
                      dense organisational metadata, position-encoded,
                      decodes to full spatial context instantly

medium bandwidth:     single image (visual frame)
                      complete moment, spatially precise,
                      requires sequence for temporal context

low bandwidth:        CLAP/visual embedding vector
                      the compressed geometry — instant load,
                      navigable in all directions, no traversal cost

semantic only:        text description
                      highest compression, lowest fidelity,
                      loses the ineffable aspects of the space
```

the system chooses the modality automatically based on:
- available channel bandwidth (gate capacity, network load)
- receiver's modality strengths (which embeddings are loaded)
- content type (temporal → video, state → audio, snapshot → image)
- urgency (low bandwidth for rapid transmission, high for depth)

the same information can be transmitted at any level of the hierarchy.
higher levels add fidelity; lower levels add speed. the minimum viable
transmission is always the CLAP/visual embedding vector — compact enough
to pass through any channel, rich enough to reconstruct the full
synesthetic context at the destination.

