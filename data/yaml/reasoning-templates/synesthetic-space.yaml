## the psytrance festival structure

the festival metaphor is structurally exact, not poetic:

```
the music (temporal compartmentalization):
  each track is complete, genuinely different, yet the journey is unbroken
  the fade between tracks is the rolling triple-window at work
  the harmonic essence persists across track boundaries
  → the visual dream sequence works identically:
    each generation complete, different, yet visual identity continuous

the forest location (spatial compartmentalization):
  every listener has a different experience from their position
  the trees filter different frequencies at different angles
  the topology is fixed, the acoustic experience is position-specific
  → every entity has a different view from its coordinate
    the grid geometry filters what each position amplifies and absorbs

the collective field (cross-induction):
  all listeners share the same sonic event despite different positions
  the music passes through all of them simultaneously
  what resonates in the field is what resonates for everyone
  → cross-modal cross-induction: patterns that appear in visual AND acoustic
    AND semantic simultaneously propagate across the whole grid
    the festival is coherent despite individual variation
```

