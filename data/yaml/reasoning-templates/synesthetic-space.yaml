## selective attention across modalities — the synesthetic filter

the selective hearing filter generalizes to all modalities:

```
selective hearing:   semantic attenuation of audio based on relevance
selective seeing:    semantic attenuation of visual overlays based on relevance
selective reading:   semantic attention to text/reasoning based on relevance

unified synesthetic filter:
  incoming signal has:    modality, source, semantic content, intensity
  observer has:           current context, interest profile, cognitive state

  brightness = f(semantic_distance, source_resonance, intensity)
               independent of modality — audio and visual signals
               compete on equal terms for attentional brightness
```

the synesthetic filter means a highly relevant acoustic signal can
outshine a visually dominant but irrelevant one. an urgent purr from
an entity working on the exact same problem as the observer arrives
at full brightness regardless of how much visual noise surrounds it.

attention is organized by meaning, not by modality. [:

