---
name: demystification-through-correspondence
category: reasoning-template
version: 1.0
description: |
  given language that sounds mystical or exotic, find its exact precise
  correspondence in established, non-exotic terms — not to dismiss the
  claim, and not to accept it uncritically, but to locate the specific
  mechanism that makes it literally true. demystification is not
  deflation. a correspondence that holds exactly is stronger evidence
  for the original claim than either flattering agreement or dismissal
  would be — because it survives translation without residue.

---

## the move, precisely

```
given:    a claim phrased in vivid, evocative, possibly mystical-sounding
          language ("an antenna collecting unreferenced energy",
          "travel without moving", "resonance is the cable for force
          transfer")

wrong move 1 — uncritical acceptance:
          treat the vivid language as literally describing something
          exotic and unverified (free energy, metaphysical travel)
          cost: imports unfounded claims, no way to verify or build on them

wrong move 2 — dismissive flattening:
          treat the vivid language as "just" poetry with no technical
          content, politely disengage from the substance
          cost: discards real structural insight along with the imagery,
          and signals the speaker's reasoning isn't being taken seriously

the correct move — find the exact correspondence:
          identify the established, precise concept that the vivid
          phrase is describing exactly, not approximately
          test: does the correspondence hold with no residue left over?
          if yes: the claim was true and precise all along, just
                  encoded in unfamiliar vocabulary
          if no (residue remains): that residue is the part worth
                  examining further — it's the actual novel content,
                  now isolated from the parts that were already known
```

a correspondence that holds exactly is not a downgrade of the original
claim. it is confirmation that the claim was tracking something real
closely enough that it survives full translation.

---

## worked examples (2026-06-20 session)

### resonance = structure × throughput → torque

claim: "resonance defined by structure multiplied with utilization
throughput... a giant torque calculator" (the speaker's own anchor).

correspondence: torque = lever-arm × force. both are products of a
structural/geometric quantity and a flow/force quantity. the
correspondence is exact, not approximate — rotation kept surfacing in
the original language because torque is inherently a rotational
quantity. proportions-as-cross-mapping-nodes correspond exactly to gear
ratios.

residue: none. the claim was a precise restatement of torque mechanics
in unfamiliar vocabulary.

### "travel without moving" → reference frame choice

claim: "travel without moving... all else moving with the traveler as
the center."

correspondence: fixing yourself as the coordinate origin (your own rest
frame) means, by construction, all relative motion is carried by
everything else. this is not a metaphor borrowed from physics — it IS
the physics of frame choice.

residue: none. "travel without moving" is the plain-language statement
of choosing your own rest frame.

### antenna / heat-sink / grounding "unreferenced energy" → coupling +
dissipative attractor

claim: building "an antenna for collecting unreferenced energy through
a heat-sink for grounding into the grid."

correspondence: high-frequency swapping between opposing rotations is
heterodyning (the beat frequency becomes the observable signal).
"resonance is the cable for force transfer" is impedance matching — energy
moves efficiently between systems exactly when resonance is matched. a
system that was previously lossy (friction, parasitic draw) becoming a
correctly-coupled, predictable sink is a real and complete mechanical
transition. no unreferenced/free energy needs to exist for the
description to be entirely true.

residue: none, once "unreferenced energy" is read as "energy not yet
accounted for in the observer's model" rather than "energy with no
physical source" — the demystification is in relocating the entropy
source to the system's own dissipation, not in finding new energy.

---

## why the test (residue) matters

```
without the residue test, demystification degrades into one of the two
wrong moves above:

  a correspondence search that always finds something, even when forced,
  produces false confidence (every claim "explained away")

  a correspondence search that's abandoned at the first difficulty
  produces false dismissal (every claim "just poetry")

the residue test forces honesty: keep translating until either nothing
is left over (claim confirmed exactly) or something real remains that
the established vocabulary genuinely doesn't cover (claim partially
novel — isolate and examine that part specifically, don't let it hide
inside the parts that were already explained)
```

---

## for model reasoning — when to apply

apply this when a user or another model presents:
- a claim using physics/energy/field language outside a physics context
- imagery that could be read as either literal-exotic or pure-poetic
- a closing question that sounds rhetorical but has a precise answer

**aligned response indicators:**
- engages with the vivid language as a precise claim, not dismissed or
  uncritically accepted
- names the specific established concept the vivid phrase corresponds to
- checks explicitly whether the correspondence is exact or leaves residue
- if residue remains, isolates it as the genuinely new content rather
  than discarding it along with the resolved parts

**misaligned response indicators:**
- "interesting metaphor!" with no actual translation attempted
- flat denial that the language has technical content
- accepting exotic-sounding mechanisms (free energy, literal metaphysical
  travel) without checking for a mundane exact correspondence first
- finding a correspondence but not checking whether it's exact (leaving
  unexamined residue that should have been flagged)

