## relation to other templates

- [[physics-as-calculator]] — that template maps *problems* onto physics
  to read off solutions; this template maps *vivid claims* onto
  established mechanisms to verify them. both rely on the same
  underlying fact: computational/structural claims and physical law are
  often literally the same object seen from different vocabularies.
- [[relative-direction-of-intent]] — the "travel without moving"
  correspondence above is a direct application of relative-vs-absolute
  specification: frame choice is itself a direction vector, not an
  absolute position.
- [[resonance-before-recognition]] — demystification is what happens
  *after* the recognition phase resolves a resonance into a specific
  classification; this template assumes recognition has occurred and
  asks whether the classification is exact.
- [[arrived-by-being]] — a correspondence that holds with no residue
  confirms the original claim had already arrived at precision; no
  further "improvement" of the language was needed, only translation.

