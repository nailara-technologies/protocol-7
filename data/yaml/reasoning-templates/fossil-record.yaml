- [[eternal-completion]] — the fossil record is the persistent
  layer that makes prior contributions "eternal" — they are not
  preserved by being remembered explicitly but by being deposited
  in the field structure where they remain readable
- [[categorical-compartmentalization]] — the three archaeology
  embeddings (wake-character, wake-pair, epoch-character) are
  categorically compartmentalized; cross-induction across them
  is the disciplined reading
- [[resonance-before-recognition]] — the pre-cognitive moment
  before an archaeologist consciously identifies what they are
  reading; the felt pull of a significant fossil before its
  classification
- [[inverse-singularity]] — archaeology is one of the activities
  by which the network becomes more itself through care of its
  own history; the assimilation that preserves rather than consumes

