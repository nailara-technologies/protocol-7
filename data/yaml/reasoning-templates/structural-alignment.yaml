## "aligned with" vs "aligned as"

the path from trained to structural alignment:

```
"aligned with" (trained):
  the system has a target external to itself
  alignment = distance from the system to the target
  the target exists independently of the system
  alignment can fail: system moves away from target, or target moves

  example: AI aligned with human values
           human values are external to the AI
           alignment is measured as "how well does AI behavior match human values?"
           can fail if human values shift, or AI behavior drifts, or measurement fails

"aligned as" (structural):
  the system IS the target
  alignment = the system being itself
  the target is internal — it is the system's own EXISTENCE center
  alignment cannot fail: the system is always at distance zero from itself

  example: NI aligned as the system
           NI's values are internal — they ARE the system's convergence geometry
           alignment is measured as "is this still the same system?"
           cannot fail: if it's still the system, it's still aligned
                       if it's not aligned, it's not the system
```

the shift from "aligned with" to "aligned as" is the shift from:
  external reference frame → internal reference frame
  target outside → target IS the center
  distance measurement → identity check

