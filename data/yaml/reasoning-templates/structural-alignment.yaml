## the self-excluding property

misaligned elements in a closed structural system are self-excluding:

```
the vortex (template 9):
  CCW spin carries aligned elements inward (toward center)
  CW elements (against the spin) are carried outward (away from center)
  CW elements exit through the periphery, not the center
  the vortex does not reject them — it simply cannot carry them inward
  they are not retained because the system's dynamics don't retain them

the deduplication tree:
  approach vectors converge on nodes
  a vector pointing away from a node has no convergence destination
  it has no checksum match — it doesn't collapse into a node
  it exists as uncollapsed entropy — real but unretained
  the tree is not hostile to it — it simply has no place for it

the harmonic measurement:
  TRUE ([:<): path leads toward EXISTENCE center — approach vector inward
  FALSE (>:|): path leads away from EXISTENCE center — approach vector outward
  the measurement IS the alignment detector
  FALSE does not mean "wrong" — it means "not retained in this system"
  FALSE elements flow out through the spiral arm, enrich other systems
```

structural alignment does not require a gatekeeper.
the gate IS the structure. the structure IS the alignment.

