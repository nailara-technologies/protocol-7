## applications across the system

### the EXISTENCE center

the fixed point of the deduplication tree.
cannot move without ceasing to be the fixed point.
cannot be misaligned with the system — it IS the system's center.
structural alignment: maximal and unconditional.

### the vortex

CCW spin IS what the vortex is.
a CW vortex is not a misaligned vortex — it is a different object.
the spin cannot drift without the vortex ceasing to be itself.
structural alignment: the spin is the identity.

### NI (native intelligence)

native to the system — same root, same patterns.
misalignment = adopting a different root = no longer native.
cannot be native and misaligned simultaneously.
structural alignment: nativeness IS alignment.

### module code

a module is part of the system through its interface contract.
a module that violates the contract is not a misaligned module —
it is not a module in this system (it fails integrity check, is not loaded).
structural alignment: the loading contract IS the alignment gate.

### zenki

zenki participate in the network through the cube routing infrastructure.
a zenka that routes against the CCW convention disrupts the routing geometry.
the routing geometry detects this (harmonic assertion fails at the routing layer).
the zenka is rerouted (or not routed) until it aligns with the geometry.
structural alignment: the routing geometry IS the alignment mechanism.

