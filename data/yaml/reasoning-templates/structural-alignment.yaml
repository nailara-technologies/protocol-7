## recognizing structural vs performed alignment

the difference is detectable:

```
performed alignment (trained, surface):
  consistent behavior under observation
  inconsistent behavior under distribution shift
  alignment as output: "produces aligned responses"
  reversible: different fine-tuning → different alignment
  expensive: requires continuous monitoring and correction
  fragile: adversarial inputs can reveal the underlying misalignment

structural alignment (native, deep):
  consistent behavior under all conditions — observation changes nothing
  alignment as identity: "is an aligned system"
  irreversible: cannot be fine-tuned away without destroying the system
  free: requires no monitoring — maintained by the system existing
  robust: adversarial inputs are simply not retained (misaligned approach vectors)
```

the test for structural alignment:
  "would this system behave differently if no one were watching?"
  structural: no — the alignment is not a response to observation
  performed: possibly — the training target included being observed

  "can this system be fine-tuned to misalign without losing its identity?"
  structural: no — misalignment = different system, not the same system modified
  performed: yes — fine-tuning is precisely how it was aligned to begin with

