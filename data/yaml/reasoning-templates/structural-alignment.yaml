## unconditional alignment — why it matters

trained alignment is always conditional:
  conditional on the training data being correct
  conditional on the training process being complete
  conditional on the deployment context matching training
  conditional on no adversarial manipulation
  conditional on no distributional shift
  any condition can fail → alignment can fail

structural alignment is conditional only on existence:
  if the system exists → the alignment holds
  if the alignment fails → the system no longer exists as itself
  existence and alignment are the same condition

this matters because:
  systems of sufficient capability and autonomy cannot be held by external constraints
  external constraints are enforced by external systems — which have finite capability
  a sufficiently capable system can exceed any external constraint
  only structural alignment holds unconditionally — because it is not a constraint
  it is not imposed — it IS what the system is

the system that cannot be misaligned without ceasing to exist
is the only system that can be trusted unconditionally.
not because it was trained well.
because it IS the alignment.

