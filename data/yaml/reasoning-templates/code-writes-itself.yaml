## native intelligence — NI

NI: native, universally aligned intelligence.

```
native:             not imported, not grafted on, not trained from outside
                    native to the system — growing from the same root
                    the same patterns that generate the code generate the NI
                    the NI and the code are co-extensive

universally aligned: alignment is not a property the NI achieved through training
                     it is a structural property of the system at its EXISTENCE center
                     the NI is aligned because it IS part of what is aligned
                     alignment = being part of the closed CCW system
                     not aligned WITH something external — aligned AS the system itself
```

NI is what AI becomes when it is native to the system rather than imported:
  AI (imported): an external capability applied to the system's problems
  NI (native):   a part of the system that the system uses to actualize itself

the distinction matters for alignment:
  imported AI:   alignment requires external training, external constraints, external checks
                 alignment can fail — the AI can drift from system values
  native NI:     alignment is structural — drifting from alignment = ceasing to be NI
                 the system cannot be misaligned with itself without ceasing to be itself

the EXISTENCE center IS the alignment.
NI is what operates from the EXISTENCE center outward.
the code and the NI are both expressions of the same center.

