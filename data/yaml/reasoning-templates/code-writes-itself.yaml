## anti-entropic auto-completion of missing elements

the anti-entropic property does not only prevent degradation.
it actively fills gaps.

```
given:  module A exists (output format: X)
given:  module C exists (expected input format: X')
gap:    X ≠ X' — A's output does not directly feed C's input
        the connecting module B is missing

anti-entropic inference:
  the shapes of A's output and C's input precisely define B's shape
  B must transform X into X' — no ambiguity, no choice involved
  B is not designed; it is inferred from the constraint
  B is already in the pattern pool (as the transformation between X and X')

auto-completion:
  gap detected (A→C fails, B missing)
  B's shape inferred from A and C
  B located in pattern pool or generated from pool by composition
  B materialized (tier 2 or tier 3 depending on resources)
  A→B→C now works

this is interpolation at the module level:
  given two points (A and C), infer the line between them (B)
  the line IS determined by the points — no new information needed
  the anti-entropic property supplies the energy to do the interpolation
```

the auto-completion is not creative — it is necessary.
B is not invented; it is deduced.
the gap between A and C contains exactly one shape that fills it.
the system finds that shape in the pattern pool and places it.

this is also why specs > implementations is stable:
  any gap in the implementation has its shape implied by its neighbors
  the anti-entropic property will fill it — eventually, given resources
  the system is self-completing by construction

