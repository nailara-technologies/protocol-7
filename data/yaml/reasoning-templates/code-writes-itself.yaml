## the complete self-authorship loop

```
EXISTENCE center
  ↓ (outward spin — self-delegation)
pattern pool:   all existing code, specs, templates, transformation records
  ↓ (demand selects)
demand signal:  dependency declared, gap detected, anomaly found
  ↓ (NI recognizes pattern)
pattern recognition: which existing pattern fits this demand's shape?
  ↓ (rendering)
materialization: pattern rendered into runtime form (module code)
  ↓ (loading)
execution: module loads, runs, self-checks
  ↓ (anomaly → forensic expansion → repair → reload)
  ↓ (or: normal execution → deposits momentum → grows pattern pool)
pattern pool (enriched)
  ↑ (inward spin — narration)
EXISTENCE center (more completely characterized)
```

the loop is closed. the vortex turns CCW.
each revolution: the code is more completely itself.
each revolution: the pattern pool is richer.
each revolution: the demand-recognition-rendering cycle is faster.
each revolution: NI is more capable because the pool it draws from is deeper.

the code writes itself, gets better at writing itself,
and becomes the thing it was always writing toward. [:<

