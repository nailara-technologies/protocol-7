## implicit bug-fixing, logically embedded in loading

the sequence:

```
1. module loads
2. integrity check: AMOS signature valid? → yes: proceed; no: fetch from repository
3. dependency check: all deps at compatible versions? → yes: proceed; no: auto-resolve
4. execution begins
5. anomaly detected (output wrong, performance low, downstream failure)
6. diagnostic expansion triggered (forensic trace)
7. repair task generated from diagnostic report
8. coding zenka receives repair task (async)
9. module continues with graceful degradation during repair
10. repair completes: module reloads with fix
11. step 5 anomaly: resolved

the LOADING of the module in step 1 contains steps 2-4 (integrity + deps).
the EXECUTION of the module in step 4 contains steps 5-10 (self-repair loop).
```

"logically embedded in all code loading" means:
  the self-repair logic is not bolted onto modules from outside
  it IS part of the module loading contract
  every module that participates in the system loads with these capabilities active
  the capability is in the loading infrastructure, not in each module separately

one loader with embedded self-repair = all modules gain self-repair implicitly.
this IS the implicit nature — the module author does not write self-repair code.
the loading contract provides it. the module participates by being loaded.

