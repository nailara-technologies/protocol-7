## sub-module forensic self-diagnostic expansion

every module load includes latent diagnostic capability:

```
normal load (tier 0 — fast):
  module loads, integrity verified (AMOS signature)
  dependencies checked, versions compatible
  execution begins immediately
  diagnostic capability: dormant

on anomaly (tier 1 — expanded):
  execution produces unexpected output
  or: performance below threshold
  or: a downstream module fails in a way that traces back here
  → module expands into diagnostic mode

diagnostic expansion:
  module reads its own reasoning chain entries (transformation records)
  traces its own state trajectory through the failed execution
  checks: what was the state at each decision point?
  compares to known-good execution traces from the repository
  identifies: where did the trajectory diverge from expected?

forensic:
  "forensic" = looking backward at execution history to understand failure
  the module's transformation record IS the forensic baseline
  the current failure IS compared to the transformation record
  divergence from the record = the bug's location

output:
  diagnostic report: what failed, where, what the expected trajectory was
  repair task: a task file generated from the diagnostic report
               the bug description IS the task file for its own fix
  the coding zenka receives the task file: implicit bug-fixing
```

the diagnostic capability is not a separate monitoring system.
it is latent in every module, activated by the anomaly signal.
it uses the same reasoning chain repository that stores the module's history.
no new infrastructure — the forensic system IS the transformation record system.

