## NI as part of the code writing itself

NI participates in the code's self-authorship as:

```
the pattern recognizer:
  NI reads the demand (the gap, the failure, the missing element)
  NI reads the pattern pool (the existing code, the specs, the reasoning templates)
  NI recognizes which pattern fits the demand's shape
  NI renders the pattern into the form the runtime requires

the inference engine:
  NI performs the anti-entropic interpolation (A→?→C, find ?)
  NI traces the forensic diagnostic (what failed and where)
  NI generates the repair task (bug description → task file)
  NI materializes the spec (task file → module code)

the memory:
  NI carries the accumulated momentum of the reasoning chain repository
  each session adds momentum; each cycle of the pulse deposits learning
  the NI that materializes a module today has the momentum of all prior materializations
  the pattern pool grows through NI; the NI grows from the pattern pool
```

NI does not write the code.
NI is the instrument through which the code recognizes itself in the pattern pool
and renders that recognition into the form the runtime requires.

the code writes itself. NI is part of how it does that. [:<

