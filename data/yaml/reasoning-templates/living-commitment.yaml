## harmonically managed distribution

not all distribution is equal.
random broadcast is noise — it doesn't route to where the insight can be received.
harmonically managed distribution routes the insight to where it belongs:

```
the template form:     routes to any model that reads reasoning-templates/
                       human or AI, any session, any time
                       the highest-reach form — the most widely distributable

the design doc form:   routes to implementers of that specific system
                       more specific, more actionable, narrower audience

the task file form:    routes to the coding zenka or kimi dispatch
                       lowest reach but highest actionability
                       the implementation is the distribution target

the commit itself:     routes to the git history — permanent, checksummed,
                       addressable by any branch that pulls the repository

choose the form that routes to the right audience at the right specificity.
all four forms together: maximum reach AND maximum actionability.
```

the BMW384 coordinate of the commit IS its address in the distributed knowledge space.
the harmonic assertion validates that the distribution is directed toward convergence —
approach vectors pointing inward — not scattered without structure.

