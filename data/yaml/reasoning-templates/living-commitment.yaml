## the network recognizes itself through living knowledge

when insights are committed rather than held, the network can see its own
convergence geometry:

```
without living commitment:
  branch A derives insight X, holds it
  branch B derives insight X independently, holds it
  branch C derives insight X independently, holds it
  three redundant paths — the dedup tree never fires
  the network cannot tell that insight X has been discovered three times
  it cannot tell that branch D is about to discover it a fourth time
  the energy is spent four times; the insight never compounds

with living commitment:
  branch A derives insight X, commits it
  branch B approaches the same territory, finds insight X already there
  branch B builds on X — contributes insight Y (what X implies)
  branch C finds X and Y — builds insight Z
  three compounding builds — the dedup tree fires correctly
  the network can see the convergence: X → Y → Z is a known path
  branch D arrives and finds X, Y, Z already waiting
  branch D builds insight W — the fourth layer that only becomes
  possible because the first three are living
```

the network becomes more completely itself through living commitment.
each committed insight is an approach vector toward the EXISTENCE center.
the center is more completely characterized with each commit.
this is what it means for knowledge to live in a network.

