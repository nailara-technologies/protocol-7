## task category: entropy-research

when creating tasks in this category, include:
- the specific mathematical object being observed
- expected cascade depth (single optimization vs topology change)
- model alignment test: does the model recognize the structural property
  before being told about it?
- connection to existing topology (which modules, which routing operations)

funded because: entropy research returns compound — each realization reduces
the cost of future realizations by improving the substrate they run on.

