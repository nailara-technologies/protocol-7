## integration with harmonic quality study

this reasoning pattern is also the methodology for the harmonic quality
correlation study (data/tasks/harmonic-quality-correlation-study.md):

  observe: harmonization step count encoded in amos7 octal header
  structure: step count distribution has a threshold (anti-entropic boundary)
  consequence: step count is a passive quality oracle — no llm needed for triage
  cascade: targeted review → better quality → lower step counts → better routing
  scale: applies per-file, per-commit, per-project-history

the same five steps, applied to the signing process as the mathematical object.

