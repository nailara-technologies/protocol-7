## worked example: modulo 13 assertion table

```
observation:
  harmonic truth assertion checks if value mod 13 == 0 (or specific remainder)
  this is called millions of times across the system

structural property:
  mod 13 has exactly 13 outputs: {0,1,2,...,12}
  the TRUE remainder set is known and fixed at system init

optimization:
  precompute at startup:
    @truth_table = map { truth_value_for_remainder($_) } 0..12;

  assertion becomes:
    is_harmonic($v) → $truth_table[$v % 13]

  cost: 1 modulo + 1 array lookup (both O(1), no division needed)
  bonus: encode both half-cycles in same table for vortex navigation

cascade:
  → truth assertions become near-free
  → can assert on more intermediate values without performance concern
  → richer harmonic routing queries become practical
  → new topology operations enabled
```

