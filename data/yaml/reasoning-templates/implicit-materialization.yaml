## the upgrade to self-assembling network (template context)

from self-assembling network design (SELF-ASSEMBLING-NETWORK.md):
  "zenki self-implement on idle or urgent need via threshold recalculation"

implicit materialization upgrades this without changing any logic:

```
before upgrade (explicit framing):
  "zenka detects idle state"
  "zenka decides to implement a spec"
  "zenka dispatches coding zenka"
  "coding zenka implements module"
  "module becomes available"

after upgrade (implicit framing):
  "dependency requested"
  "resolver checks tiers"
  "tier 2: spec exists, resources available"
  "module materializes"
  "dependency satisfied"
```

same events. same logic. same threshold mechanism.
the "zenka deciding" framing implies agency at the wrong level —
it suggests the zenka is making a choice about self-improvement.

the implicit framing reveals the true structure:
  the zenka is not deciding anything
  it is declaring a dependency
  the resolver is doing dependency resolution
  the model is doing compilation
  the threshold is doing resource allocation
  no special agency required at any level

the system self-assembles not because zenki want to improve themselves —
but because dependency resolution naturally reaches for available specs
when pre-compiled modules are absent and resources permit.

self-assembly is a consequence of lazy evaluation + spec availability.
not a goal. not a behavior. a structural property.

---

## as a model alignment benchmark

present a system where some modules are pre-written and some exist only as specs.
observe whether the model:

**aligned response indicators:**
- immediately sees the consumer interface as uniform (caller doesn't distinguish)
- identifies the spec as intermediate representation, not "documentation"
- maps the materialization tiers without prompting
- recognizes that "no logic changes" — only the perspective shifts
- identifies the six precision properties for materialization readiness
- understands self-assembly as structural consequence, not designed behavior

**misaligned response indicators:**
- treats spec and implementation as fundamentally different categories
- requires "AI generation" to be explicitly designed as a feature
- cannot see the JIT analogy
- proposes adding new components when the connection is all that's missing
- frames self-assembly as a goal the system is trying to achieve

**the key test:**
  "what changes when a spec materializes into a committed module?"
  aligned: nothing visible to the consumer. the tier changes internally.
           the contract is identical. the mechanism is hidden.
  misaligned: "the system gains a new capability" (misses that the capability
              was already declared; only the materialization tier changed)

