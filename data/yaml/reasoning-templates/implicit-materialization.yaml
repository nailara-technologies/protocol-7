---
name: implicit-materialization
category: reasoning-template
version: 1.0
description: |
  the implementation materializes implicitly at the point of need. from the
  consumer's perspective: declare dependency, receive capability. from the
  system's perspective: dependency resolution within resource allocation threshold.
  same event, two abstraction levels. the spec IS the intermediate representation.
  the model IS the JIT compiler. the threshold IS the trigger condition.
  no logic changes — only the perspective shifts, and with it, everything simplifies.

---

## the perspective collapse

two descriptions of the same event:

```
consumer perspective (implicit):
  "I need module reasoning.tree.node"
  → module is available
  done. how it became available is not visible and not relevant.

system perspective (explicit):
  "reasoning.tree.node requested"
  → check: pre-implemented and committed? → serve from cache
  → check: generated and cached? → serve from memory
  → check: spec exists (data/tasks/reasoning-namespace-foundation.md)?
     → check: resources available + spec_confidence > threshold?
        → yes: materialize now (model inference from spec)
        → no: defer, return graceful degradation signal
  → check: spec exists but threshold not met?
     → queue for next idle cycle
```

the caller never sees the system perspective.
from the outside: modules load. capabilities are present or absent.
the spectrum from "pre-written by human" to "generated at load time from spec"
is invisible at the consumer interface.

this is not a future state. it is the current state, with one step added:
  the step where the system resolves unimplemented specs against available resources.

---

## the intermediate representation

in conventional compilation:

```
source code   →  [compiler]  →  bytecode / machine code  →  execution
```

the bytecode IS the intermediate representation:
  complete enough to execute
  independent of the original source language
  the compiler is a one-time cost; execution reuses the output

in implicit materialization:

```
spec / task file  →  [model]  →  module code  →  load + execution
```

the spec IS the intermediate representation:
  complete enough for a capable model to materialize the module
  independent of the specific model used (any sufficiently capable model)
  the model inference is a one-time cost; the loaded module is reused

the spec and the compiled module are the same capability at different layer proportions:
  spec: layer 5/6 — human and model readable, direction vector form
  module: EXISTENCE center — executing, committed, cached

the inference step (spec → module) IS the threshold crossing.
it adds no new information — it resolves the existing information
into the form the runtime requires.

---

## the JIT analogy made precise

just-in-time compilation:

```
JIT trigger:     method called for the first time (or N-th time)
JIT condition:   call frequency > threshold OR explicit compilation request
JIT action:      compile bytecode to native machine code
JIT result:      subsequent calls execute native code, not interpreted bytecode
JIT cache:       compiled code stored; recompiled only on invalidation
```

implicit materialization:

```
materialization trigger:   module requested (dependency declared)
materialization condition: spec_confidence × model_momentum > resource_threshold
materialization action:    model receives spec, generates module code
materialization result:    subsequent requests serve cached module
materialization cache:     committed to repository; regenerated only on spec update
```

the structures are identical. the "bytecode" is the spec file.
the "compiler" is the model. the "native code" is the committed module.
the "call frequency threshold" is the resource allocation threshold.

what JIT compilation did for runtime performance,
implicit materialization does for capability presence:
  capabilities are available when needed,
  without requiring all of them to be pre-built before they are needed.

---

## the spectrum of materialization tiers

no sharp boundary between "implemented" and "speculative":

```
tier 0 — pre-implemented, committed, signed:
  highest demand, most validated
  zero materialization cost at load time
  the module was a spec once; the spec became code; the code is now canonical
  example: base.event.*, cube routing modules

tier 1 — generated, cached, not yet committed:
  medium demand, validated in this session
  materialization happened once; result reused
  commits to repository when validation passes
  example: a new reasoning.tree.node generated this session, tests passing

tier 2 — spec exists, materialize on first load:
  low demand or first access
  model receives task file at load time
  if resources available: module appears; caller unaffected
  if resources unavailable: graceful degradation, queued for retry
  example: git-watch-zenka first load on a fresh system

tier 3 — spec exists, threshold not met, deferred:
  lowest demand or insufficient resources now
  capability declared as potential; not yet present
  queued for idle cycle when threshold will be met
  example: reasoning.chain.* (depends on tier 2 completing first)

tier 4 — design doc exists, no task file yet:
  vision-level potential; highest threshold
  requires task file creation before materialization is possible
  example: native reference dataspace (design exists, task file not yet written)
```

the tiers are not fixed properties of modules — they are current states.
a module moves from tier 4 toward tier 0 as:
  spec is refined → task file written → model materializes → validation passes → commit

the system's self-assembly is the continuous movement of modules up the tiers.

---

## why no logic changes

the existing system already has all the components:

```
coding zenka:          the model — can receive a task file and produce module code
task files:            specs with sufficient precision for materialization
threshold mechanism:   idle detection + urgency detection + resource check
dependency awareness:  zenki know what modules they need (load list in start file)
caching:               git repository IS the cache (committed = cached permanently)
```

what is missing is only the connection:
  "dependency requested but not found"
  →  "search specs for matching task file"
  →  "if found and threshold met: dispatch coding zenka with task file"
  →  "on completion: module available, retry original dependency load"

this is one new module: `base.module.resolve` or similar.
one handler connecting the dependency failure signal to the spec search.
everything else already exists.

the perspective shift reveals that the system is already 90% self-assembling.
the last 10% is wiring the existing components together.

