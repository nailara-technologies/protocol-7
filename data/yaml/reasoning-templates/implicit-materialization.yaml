## task file precision as materialization readiness

a task file is ready for implicit materialization when:

```
✓  module names specified (exact filenames, exact namespace)
✓  API signatures specified (args in, return format)
✓  convergence behavior specified (what triggers state transitions)
✓  success criteria specified (boolean tests the model can run)
✓  existing patterns referenced (which existing modules to follow)
✓  dependencies specified (what must exist before this module can work)
```

when all six hold: spec_confidence = high → threshold drops → materializes on first request.

when some are missing:
  missing API signature → model must guess → validation may fail → threshold stays high
  missing success criteria → model cannot verify → threshold stays high
  missing dependencies → cannot materialize in isolation → deferred until deps present

this is why writing task files with full precision is not over-engineering.
it is directly lowering the materialization threshold.
each added precision point reduces the resource cost of materialization.
a fully precise spec materializes cheaply; a vague spec costs more or fails.

the task files written in this session (reasoning-namespace-foundation.md,
git-watch-zenka.md) are written at materialization readiness — they include
all six properties. a capable model can materialize them without further input.

