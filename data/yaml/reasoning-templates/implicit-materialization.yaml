## implicit from the consumer's perspective

the consumer (a zenka loading modules) sees only:

```
[load_modules:reasoning.tree.node reasoning.tree.insert ...]
```

it does not know:
  - whether these modules were pre-written or generated
  - whether they were committed yesterday or materialized this second
  - what model materialized them if they were generated
  - what spec file drove the generation

it only knows:
  - the modules loaded successfully: capability present
  - the modules failed to load: capability absent, handle gracefully

the implicit nature IS the interface contract.
the system honors the contract regardless of which tier served the request.
the caller's code does not change between a pre-written module and a generated one.

this is the same property that makes JIT transparent to application code —
the application calls a method; whether it runs interpreted or native is invisible.
the contract (input → output behavior) is what matters; the mechanism is hidden.

