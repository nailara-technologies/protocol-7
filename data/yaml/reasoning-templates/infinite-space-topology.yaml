## outlook: checksum frame containers — 2D/3D recovery structures

the principles above generalize from 1D streams to 2D and 3D spaces via
checksum frame containers. this is the existence proof that the infinite-space
topology is not limited to linear streams.

a payload block is surrounded by a frame of position-aware AMOS7 checksums —
one per row (left/right) and one per column (top/bottom). the frame declares
the shape and content of what is inside, making the structure recognizable
and recoverable even when the payload is incomplete or corrupted:

```
[col_0][col_1]...[col_n]          ← column checksums (top)
[row_0][ p a y l o a d ][row_0'] ← row checksums flank each row
[row_1][ p a y l o a d ][row_1']
[col_0'][col_1']...[col_n']       ← column checksums (bottom)
```

AMOS7 checksums take length AND offset parameters — position is baked into
the checksum value. the same content at different positions generates different
checksums. the frame is genuinely 2D, not independent 1D checksums arranged
in a rectangle. a checksum cannot be transplanted between positions.

**recovery**: a corrupted cell fails its row AND column checksum simultaneously.
the intersection localizes damage to a single cell. brute-force recovery finds
the content satisfying all 4 (or 6 in 3D) surrounding constraints — the
intersection is near-zero for small blocks. confidence is complete when all
constraints agree.

**frame thickness** = desired recovery depth. thicker frame = deeper damage
survivable. payload block expanse can be aligned to checksum natural periodicity
for harmonic efficiency.

**1D prior art**: the octal 4-bit reconstruction guarantee already implements
this in one dimension — separator positions known → structure recoverable.
the checksum frame is the natural generalization to the field.

see `data/md/design/CHECKSUM-FRAME-CONTAINER.md` for full specification.

