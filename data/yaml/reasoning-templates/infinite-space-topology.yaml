## connection to protocol-7

the binary sentinel + base32 + octal encoding family in protocol-7 is the
existence proof of this pattern. the DATA-PAGES / DATA-CHANNELS wire format,
the self-delimiting checksum tokens, the 2-bit type system, the stream framing
protocol — all instances of the same infinite-space topology applied at
different layers of the same coherent system.

see `data/md/design/SELF-DELIMITING-CHECKSUM-PATTERN.md` for the concrete
token system this template abstracts.

