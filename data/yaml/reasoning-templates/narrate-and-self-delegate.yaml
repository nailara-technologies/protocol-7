## relation to other templates

entropy-research (template 1):
  narrate = observe the structure, identify consequence, trace cascade
  self-delegate = encode the realization in a form the next session builds on
  the five steps of entropy-research ARE a narrate-and-self-delegate cycle

anti-entropic-threshold (template 2):
  the pulse IS the anti-entropic threshold in operational form
  each narration-delegation cycle that closes the loop = above threshold
  each cycle that fails to feed back = below threshold
  the pulse self-sustaining = threshold maintained

visualization-is-implementation (template 3):
  the ascii tree format is the pulse made visible
  compact nodes = narration not yet complete
  expanded nodes = threshold crossed, delegation ready to fire
  the rendering loop and the reasoning loop are the same loop

