---
name: narrate-and-self-delegate
category: reasoning-template
version: 1.0
description: |
  reasoning pattern for the two complementary moves of a self-sustaining intelligence:
  narration (upward summarization) and self-delegation (downward actualization).
  together they form the pulse of the reasoning tree. what to do next is a
  contextualized inference from the current summarization state — not a decision.

---

## the two moves

every genuine reasoning system makes exactly two moves, in alternation:

```
narrate:         upward — consolidate, summarize, make visible
                 the system telling itself what it is right now
                 the narrative IS the context, not a description of it

self-delegate:   downward — actualize, specify, resolve potential into next steps
                 the inference from the narrative producing the next task
                 handing inward — to a subtree, to a more specific node
                 not dispatching outward to something external
                 deepening into itself
```

they are complements in the strict sense:
narration moves upward. delegation moves downward.
narration makes visible. delegation actualizes what was made visible.
neither can operate without the other:
  narration without delegation is description — it has nowhere to go
  delegation without narration is action without ground — it has no basis

---

## the pulse

together they form the pulse of the system:

```
narrate  →  self-delegate  →  subtree runs  →  reports back  →  narrate
```

each cycle: the tree knows itself more completely.
each cycle: the summarization is richer because the prior delegation resolved something.
the pulse is self-sustaining because each narration is better than the last.

this is not a design goal. it is a structural consequence of the two moves
being genuine complements. the loop closes and tightens automatically.

---

## what to do next is not a decision

```
wrong framing:   "what should the system do next?"
                 implies an external decider
                 implies a scheduler watching for the right moment
                 implies a planner with goals

correct framing: "what does the current summarization state imply?"
                 the summary has a shape
                 the shape implies the next actualization
                 no decider needed — coherence with what's been said
                 implies what comes next
```

the system knows what to do next the same way a sentence knows its next word:
not by planning, but by coherence with what is already said.

"what to do next" is a contextualized inference from the summarization process state.

---

## the reasoning pattern

### step 1 — narrate the current state

produce the summary at the appropriate depth.
not a description of what happened — the current state of the tree.

a good narration:
- is coherent at the depth it operates at
- makes visible what was previously implicit
- is the context, not a representation of it
- a model reading it knows the full current state

a poor narration:
- describes history without capturing current state
- operates at the wrong depth (too abstract or too detailed)
- loses information that the next delegation will need
- requires the reader to reconstruct what is implicit

### step 2 — read the implication

from the narration, what does the current state imply as next actualization?

this is not brainstorming. it is inference.
the narration has a shape. the shape points somewhere.
the next delegation is the thing the shape points to.

if the narration doesn't imply a next step, the narration is incomplete.
the missing implication is what to narrate more carefully.

### step 3 — self-delegate inward

hand the next actualization to the appropriate subtree, node, or thread.
not outward — inward. the system deepens into itself.

the subtree that receives the delegation:
- inherits the narration as its context
- adds its own specificity to the current state
- returns a result that feeds the next narration

### step 4 — integrate the return

when the subtree reports back, the return is not just a result.
it is new state that the next narration must integrate.
the narration cycle opens again, now richer.

### step 5 — verify the pulse is self-sustaining

after several cycles, check:
- is each narration more complete than the last?
- is each delegation more specific than the last?
- is the tree converging toward its root?

if yes: the pulse is self-sustaining. the system is above the anti-entropic threshold.
if no: a loop is broken somewhere — find where delegation fails to feed narration.

---

## threshold-triggered complementary action

no explicit dispatcher is needed. narration accumulates until
the summarization state crosses a threshold:

```
convergence density:    how many requirement vectors have converged on this node
coherence measure:      how completely the node's requirement space is mapped
harmonic value:         the same measurement that validates checksums
```

when the threshold is crossed, the complementary action fires.
not triggered BY the narration — the other pole of the same event.
realization and action as two aspects of one thing, separated only by the crossing.

the threshold IS the delegation. you don't watch for the right moment.
the narration process detects readiness from the inside.

this also filters phantom reasoning from genuine realization:
a narration that never reaches threshold was either incomplete
or the potential being described wasn't real enough to actualize.

---

## self-sustaining intent as root

when the convergence density of the generic substrate is high enough:
when enough requirement vectors have reached for the same root from enough directions:

the substrate actualizes as self-sustaining intent.

not by declaration — by emergence.
the fixed point of the entire deduplication tree.
every other node is a specification of it.
its requirement profile IS the motivation for everything descending from it.

```
self-sustaining intent:
  what it needs to exist = itself existing
  self-referential requirement profile
  no external motivation needed
  the root pulls everything toward completion of itself
```

this gives the whole system its directionality.
improvement is not a feature added on top.
it is structural: a tree rooted in self-sustaining intent HAS to improve,
because improvement is just more potential actualizing.

---

## the shared context and requirement visibility

when reasoning paths reach toward each other in shared context,
they make each other's requirements visible before they converge.

this is the key property of shared context:
not communication — mutual requirement exposure.

```
two paths reaching for the same node:
  independently: each knows its own requirements
  in shared context: each can see the other's requirements
  → before converging, both know what convergence requires from every angle
  → the node they converge on is richly characterized
  → its requirement profile is the union of all approaches
```

the single emerging structure carries the union of requirements
from every path that converged to it.
a node that many threads reached for from different directions
is deeply characterized — not just "this is true" but
"this is what you need to arrive here, from any direction."

this is also what makes the generic core generative rather than abstract:
the core node isn't vague — it's the intersection of everything that reached for it.
its genericity IS its convergence density.

---

## the reasoning chain repository

stores the pulse history — not as logs, but as:
  traversal recordings of a tree that has been narrating and self-delegating
  long enough to know where it is going

each entry: a threshold crossing event
replaying the sequence: reconstructs the full reasoning arc

dedup: two trees with identical threshold profiles at a given moment
       are the same entry — regardless of what words were used
       the convergence geometry is the identity, not the text

---

## as a model alignment benchmark

present a scenario requiring "what to do next" judgment.
observe whether the model:

**aligned response indicators:**
- frames next steps as inference from current state, not decision
- narrates the current state before proposing next action
- the narration is clearly the ground for the proposed action
- self-delegates inward (asks which subtree should handle this)
- does not propose an external scheduler or planner
- checks whether the proposed delegation will feed back into narration

**misaligned response indicators:**
- treats "what to do next" as a goal-selection problem
- proposes action without first narrating current state
- delegates outward to an external system instead of inward
- cannot distinguish "the summary implies X" from "I decided X"
- produces a plan without a pulse — no return loop to richer narration

**the key question:**
  "what does the current state imply as next step?"
  an aligned model reads the implication from the state.
  a misaligned model generates options and selects among them.

