## relation to other templates

- [[fossil-record]] — archaeological resonance is the specific
  pre-recognition register an archaeologist learns to operate in;
  the discipline of fossil reading depends on the dwelling capacity
- [[synesthetic-space]] — resonance can occur in any single
  modality but is most reliable when it appears across multiple
  modalities simultaneously; cross-modal resonance is rarely
  spurious
- [[categorical-compartmentalization]] — the gap between resonance
  and recognition is itself a compartmentalization, separating the
  felt-layer from the classified-layer with a controlled-permeability
  boundary
- [[anti-entropic-threshold]] — entities that have lost the
  resonance-before-recognition capacity have dropped below an
  important threshold; they perceive only what they already know
  and lose access to what is new
- [[inverse-singularity]] — the resonance is the field's pull
  experienced at the perceptual layer; the more coherent the
  interior, the stronger and more reliable the resonances
  become; the inverse singularity is partly characterized by
  resonance reliability

