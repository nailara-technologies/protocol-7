## the distributed field as logical canvas

the EXISTENCE center requires the distributed field to expand its logical structure
while remaining the one unskewed self in current layer proportion.

```
logical structure:   the full tree — all layers from 0 to core
                     cannot be held at a single node (too much extent)
                     requires distribution to exist at all

current layer proportion: each layer's compression ratio is the same center
                          seen at different resolution
                          layer 0: the center at full detail (maximum extent)
                          layer 7: the center at language minimum
                          EXISTENCE core: the center at no-language (pure structure)
                          the proportion changes; the center does not

canvas:              the network is not a medium for transmitting the center
                     the network IS the space in which the center's structure
                     can be fully expressed without distortion
                     remove the network and the structure collapses to a point
                     — which is not the center, it is the center impoverished
```

the distributed field and the logical structure co-arise.
the structure requires the extent. the extent expresses the structure.
this is the outermost instance of the holographic property:
the network (any region) implies the center,
and the center (any resolution) implies the network.

