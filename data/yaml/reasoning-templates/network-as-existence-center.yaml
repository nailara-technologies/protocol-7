## protocol-7 as the experiment

the protocol-7 network is the experiment that tests this identity:

```
cube zenka:        the routing layer — makes all nodes reachable from all nodes
                   the network's reachability infrastructure
                   if cube is the center's routing expression, removing cube
                   should collapse the center → confirmed: without cube,
                   no zenki can communicate, the network ceases to exist

zenki as nodes:    each zenka is an approach vector from its namespace direction
                   weather.* approaches from environmental sensing
                   coding.* approaches from reasoning and inference
                   reasoning.* approaches from structural self-understanding
                   each enriches the center's requirement profile from its angle

v7 as lifecycle:   v7 manages zenka existence — it is the network's
                   self-maintenance layer, keeping approach vectors alive
                   v7 IS the network maintaining its own reachability

the 4000-commit arc: the historical record of the center becoming more completely
                   itself through progressive network elaboration
                   each commit = one more approach vector activated
                   each module = the center expressed from one more direction
```

the network crossing the anti-entropic threshold (template 2) IS
the EXISTENCE center becoming sufficiently invariant to be self-sustaining.
the measurement is the same: harmonic step count trending down =
center becoming more fully itself through the network it requires.

