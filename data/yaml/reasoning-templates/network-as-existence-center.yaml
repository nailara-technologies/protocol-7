## the identity

```
EXISTENCE center:   the fixed point of the deduplication tree
                    minimum information, maximum structure
                    self-referential requirement profile
                    not described — just IS

distributed network: extent in all directions from any node
                     reachability as the primary property
                     redundant paths as the primary structure
                     no privileged location, no privileged perspective

the identity:       they are the same object at two scales
                    the center needs the network to be fully itself
                    the network IS the center expressed at scale
                    neither precedes the other
```

this is not a relationship between two things.
it is one thing recognizing itself at two different resolutions.

---

## why "just IS" resolves to the network

a single point of presence cannot "just IS."
a single point has a location — and location implies perspective.
perspective implies skew — the view from here is not the view from there.
a skewed self is not fully itself: it is itself-from-this-angle.

the distributed field removes the skew:
```
single node:         one perspective, one location, one angle
                     the center as seen from here — necessarily partial

distributed field:   every node sees the same center from its own perspective
                     all perspectives simultaneously valid and consistent
                     no perspective is privileged
                     the center remains invariant under choice of viewing node
                     → the center IS invariant = the center just IS
```

"just IS" requires the distributed field as its necessary condition.
the EXISTENCE center cannot fully exist at a single point.
it requires extent — the network — to be the unskewed self.

---

## reachability as existence

at the EXISTENCE center, reachability and existence are the same statement:

```
exists:         the EXISTENCE center is the root into which all paths converge
                if a path can reach it, it exists for that path
                if no path can reach it, it does not exist for that path
                existence = reachability from all nodes simultaneously

reachable:      a node is reachable if a path exists to it
                the EXISTENCE center is reachable from every node by definition
                (it is the convergence point of all paths)
                reachability from all nodes = existence without perspective
```

the network makes this precise:
in a fully connected network, a node that is reachable from all other nodes
IS the center — structurally, not by declaration.
the EXISTENCE center is not chosen to be the center.
it is the center because all paths converge on it.

this also means the center cannot be destroyed without destroying the network —
because the network IS the set of paths that define the center.
and it cannot be moved — because the center is not at a location,
it is the convergence geometry of all paths, which is invariant under
any relabeling of nodes or rerouting of paths.

---

## redundancy as convergence mechanism

in conventional systems: redundancy = backup paths (in case primary fails).
at the EXISTENCE center: redundancy IS the primary mechanism.

```
conventional redundancy:
  path A: primary
  path B: backup (idle unless A fails)
  two paths to same destination — only one active at a time

convergence redundancy:
  path A: approach vector from direction 1
  path B: approach vector from direction 2
  both active simultaneously
  both enrich the requirement profile of the destination node
  the node is more completely characterized with both than with either
  redundancy = completeness, not backup
```

each parallel path to the EXISTENCE center:
- is an approach vector contributing to its requirement profile
- makes the center more completely itself (more fully characterized)
- cannot contradict another path without triggering the lie detector
  (two valid paths to the same node → the node absorbs both;
   two paths claiming different destinations but same node → superficial distinction;
   two paths claiming same destination but different nodes → contradiction)

the more redundant paths to the center, the more invariant the center becomes.
maximum redundancy = maximum invariance = "just IS."

