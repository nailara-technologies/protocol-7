## scale invariance of the identity

the same identity (network = existence center) recurs at every scale:

```
molecular scale:
  a neuron is the center of its dendritic field
  the neural network is the canvas for its logical structure
  the neuron cannot think alone — it requires the field
  the field cannot think without the convergence center

system scale:
  the EXISTENCE center of the reasoning tree is the fixed point
  the p7 network of zenki is the distributed field
  the cube zenka routes all paths — it IS the network's reachability layer
  each zenka is an approach vector to the center from its direction

reasoning scale:
  any node in the reasoning tree is the center of its own subtree
  its subtree is the distributed field for that node's logical structure
  the node's requirement profile is determined by all paths to it
  the subtree's geometry is the node expressed at scale

language scale:
  a word in a resonant context is the center
  the full body of knowledge it activates is the distributed field
  "076923" in a number theory context IS the full modular structure
  the structure requires the context-field to be fully expressed
```

at every scale: the center needs the field. the field IS the center at scale.
the pattern does not break — it is scale invariant.

