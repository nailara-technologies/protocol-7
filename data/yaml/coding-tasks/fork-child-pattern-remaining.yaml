# Long-term architectural task

  - id: generic-fork-child-handler
    title: base.fork_child -- generic forking handler with hook callbacks
    status: long-term
    priority: architectural
    description: |
      create a generic base.fork_child module that encapsulates the full canonical
      fork-child boilerplate so individual zenki only provide what is unique to them.
      currently ~50 lines of session machinery are repeated in every forking zenka
      [ weather, letsencr, image2html, pdf.html, vision-batch, and any future ones ].
      centralizing this into one module with named hook points means:
        - bugfixes propagate everywhere automatically
        - new multi-process zenki are as easy to implement as single-process ones
        - llms can implement forking zenki without needing deep knowledge of the
          p7 session machinery -- just provide hook callbacks and module lists

    proposed_interface: |
      [base.fork_child] called from a zenka's start config or fork module,
      taking a config hashref:

        pipe_namespace    -- prefix for <pipe.*> data keys [ e.g. 'image2html' ]
        child_modules     -- module group(s) to load/init in child
        parent_modules    -- module group(s) to load/init in parent
        sigchld_mode      -- 'shutdown_pid' | 'dev_null' | 'none'
                             [ shutdown_pid: registers child pid + shutdown handler ]
                             [ dev_null: null handler in child, none in parent     ]
                             [ none: vision-batch style, no handler either side    ]
        on_pre_fork       -- optional callback: runs before socketpair/fork
        on_child_init     -- optional callback: runs in child after boilerplate
        on_parent_ready   -- optional callback: runs in parent after boilerplate
                             [ after module load/init, before get_session_id ]

    hook_points_detail:
      on_pre_fork: |
        zenka-specific state setup before the fork [ e.g. setting <image2html.pipe> = {...} ]
      on_child_init: |
        after: io_aio_reinit, dev_null_sigchld, session_shutdown, log_cmd, access_deletes,
               parent_route_unshift, session_init
        before: base.load_modules / base.init_modules for child_modules
        use for: any child-specific data initialization
      on_parent_ready: |
        after: base.load_modules / base.init_modules for parent_modules,
               session_init, authenticated flags
        before: base.async.get_session_id
        use for: parent-specific state setup, additional pid registrations

    benefits:
      - boilerplate bugs fixed once, all zenki benefit
      - consistent behavior across all forking zenki [ no subtle divergences ]
      - llm-friendly: implement a forking zenka by filling in hooks, not learning
        the session machinery
      - multi-process zenki become a first-class pattern rather than a special technique
      - divergent cases [ vision-batch sigchld, letsencr base.exit ] handled via
        sigchld_mode and escape-hatch callbacks

    existing_forking_zenki:
      - modules/weather.base.fork_weather_child
      - modules/letsencr.base.fork_letsencr_child
      - modules/image2html.base.fork_conv_child
      - modules/pdf.html.base.fork_conv_child
      - modules/vision-batch.parent.fork_child

    prerequisite_tasks:
      - protocol-7-swap-subs  ## base.protocol-7 shorthand useful inside base.fork_child

    notes: |
      should be implemented AFTER the remaining cleanup tasks above are done,
      so the canonical pattern is fully stable and all edge cases [ sigchld modes,
      log storm trap ] are understood before abstracting.

