phase_2:
  name: "HTTP Handler Route Dispatcher Implementation"
  tokens_allocated: 12
  duration: "~4-6 hours"

  tasks:
    - name: "Design HTTP Route Matching"
      tokens: 2
      actions:
        - "Define route patterns (priority order)"
        - "Create route dispatch table"
        - "Design pattern matching algorithm"
        - "Plan caching strategy for routes"

      route_patterns: |
        Priority 1 (Dynamic):
          /.well-known/acme-challenge/* → acme.http.challenge_handler
          /api/* → letsencrypt.http.api_handler
          /template/* → web.process-template-ipc
          /dynamic/* → web.process-template-ipc

        Priority 2 (Template-based):
          /* → Check vhost/_templates for matching file
             → If found, render via web.process-template-ipc
             → Cache result (1800s TTL)
             → Serve rendered content

        Priority 3 (Static):
          /* → Serve from /var/httpd/{vhost}/

      success_criteria: "Route dispatch algorithm clearly defined"

    - name: "Extend httpd.http_get Handler"
      tokens: 5
      actions:
        - "Add route dispatcher to httpd.http_get"
        - "Implement pattern matching with base.parser.pattern_split"
        - "Integrate web.process-template-ipc for dynamic routes"
        - "Add caching layer (Redis or in-memory)"
        - "Implement fallback to static file serving"
        - "Add request logging and metrics"

      code_structure: |
        sub httpd.http_get {
          my ($path, $vhost) = @_;

          # Route 1: ACME challenges
          if ($path =~ m|^/.well-known/acme-challenge/(.+)$|) {
            return acme.http.challenge_handler($1);
          }

          # Route 2: API endpoints
          if ($path =~ m|^/api/(.+)$|) {
            return letsencrypt.http.api_handler($1);
          }

          # Route 3: Template-based dynamic content
          my $template_file = check_template_exists($vhost, $path);
          if ($template_file) {
            return web.process-template-ipc($template_file, {
              vhost => $vhost,
              path => $path,
              cache_ttl => 1800,
            });
          }

          # Route 4: Static files
          return serve_static_file($vhost, $path);
        }

      success_criteria: "HTTP handler routing working, dynamic content being processed"

    - name: "Test Route Dispatcher with Sample Content"
      tokens: 3
      actions:
        - "Create sample template: /var/httpd/127.0.0.1/index.html.template"
        - "Test ACME challenge route: /.well-known/acme-challenge/test"
        - "Test API route: /api/certificate-status"
        - "Test template route: /index.html"
        - "Test static file route: /static/style.css"
        - "Verify caching behavior"
        - "Check request logging"

      sample_templates: |
        /var/httpd/127.0.0.1/index.html.template:
          <html>
            <head><title><{page.title}></title></head>
            <body>
              <h1>Welcome to <[web:get-hostname]></h1>
              <p>Generated at: <[web:current-timestamp]></p>
              <p>Certificate expires: <[letsencrypt:get-cert-expiry]></p>
            </body>
          </html>

      success_criteria: "All routes tested, dynamic content generated correctly"

