## CRITICAL PATH (Token-Efficient Implementation)

critical_blockers:
  - name: "base.parser.pattern_split Recovery"
    impact: "BLOCKING Phase 3 Stage 1 - HTTP handler route dispatcher"
    estimated_effort: "4-6 hours (1-2 tokens)"
    description: |
      Must extract base.parser.pattern_split from Protocol-7 binary and
      de-obfuscate to readable Perl. This is prerequisite for HTTP request
      routing and path pattern matching needed for dynamic content delivery.

    steps:
      - "Export from binary: ./bin/Protocol-7 -export-inline-subs base.parser.pattern_split"
      - "De-obfuscate extracted code"
      - "Test pattern matching: /blog/*, /api/*, /files/*"
      - "Add to modules/ directory"
      - "Commit with documentation"

    why_critical: |
      Without this, HTTP handler cannot properly route requests to different
      template processors, ACME challenges, or static files. This is the
      single highest-impact blocker preventing dynamic website generation.

  - name: "HTTP Handler Route Dispatcher Design"
    impact: "BLOCKING web content delivery"
    estimated_effort: "2-3 tokens"
    description: |
      Extend httpd.http_get handler with intelligent routing based on request
      paths. Routes template requests to web.process-template-ipc, ACME
      challenges to acme handler, static files to filesystem.

    design_reference: "docs/architecture/NEW_ZENKA_ARCHITECTURE.md (section 3.2)"

    core_pattern: |
      GET /blog/2025-11-14-post.html
        → Check if template exists in /blog/_templates/
        → If yes, process via web.process-template-ipc (async)
        → Cache result (1800s TTL)
        → Return rendered content

      GET /.well-known/acme-challenge/{token}
        → Route to acme.http.handler

      GET /static/style.css
        → Serve from /var/httpd/{vhost}/static/

      GET /api/certificate-status
        → Route to letsencrypt.http.api_handler

