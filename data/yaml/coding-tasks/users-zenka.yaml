---
# Task: Users (v7-managed) Zenka
# Date: 2026-08-10
# Status: design, early — storage layout decided, integration boundary open
# Context: todo 5PN [ new-zenki ] "create users v7-managed zenka design file"
# Related: data/yaml/coding-tasks/user-edit-console-zenka.yaml (JUE) — the
#          console this zenka is canonical storage/authority FOR. That doc's
#          users_zenka_relationship section already resolved: users zenka
#          owns storage, discovery, and key authority; user-edit is a thin
#          UI client with no local storage of its own. This doc is where
#          that ownership actually gets specified.
# Why now: per user (2026-08-10) — this zenka was the main missing piece
#          blocking real testing/adoption of the cross-host stack that
#          already exists (p-7-r, link-upgrade, ssh zenka, discover/
#          orbital, see discovery_integration below): none of it had a
#          real per-user identity/record system to test against. Phase 1
#          (host-system/ only) landing gives that a concrete target —
#          expect phase 2 (remote/) to double as the real-world exercise
#          of the transport findings recorded below, not a separate
#          from-scratch integration effort.

task_metadata:
  title: "users zenka — canonical user records, distributed discovery, key authority"
  description: >
    A v7-managed zenka that is the canonical local authority for user
    records (the data user-edit console edits), tracks distributed
    discovery of the same kind of records from other nodes, and acts as
    a key authority for local zenki: when a zenka needs to contact a
    user or another zenka, it asks the users zenka to resolve the
    correct key, which then feeds routing directly.
  priority: low
  category: "new-zenki"
  runtime_surface: >
    HEADLESS — no UI of any kind, terminal or GUI. RESOLVED 2026-08-10,
    per user, alongside user-edit-console-zenka.yaml's
    amos_term_plugin_overlap resolution: user-edit is the terminal
    console (and later, additively, a GTK3-class GUI via amos-term);
    this zenka is pure backend authority underneath both. Nothing about
    rendering, key input, or amos-term's plugin system applies here.

## -----------------------------------------------------------------------
## storage layout — decided
## -----------------------------------------------------------------------

storage_layout:
  decided: >
    /etc/protocol-7/users/host-system/ and /etc/protocol-7/users/remote/
    {incoming,outgoing}/ — both user-verified against bin/harmony.
    Precedent: /etc/protocol-7/ already has non-per-zenka top-level dirs
    today (certs, export, import, jobsite, zenki) — a shared "users"
    dir at that level, not nested under a per-zenka etc_P7/<zenka>
    subdirectory, matches existing convention. Register these as
    keywords via base.path.register_keywords per
    user-edit-console-zenka.yaml's phase_1b (e.g. USERS_HOST,
    USERS_REMOTE_IN, USERS_REMOTE_OUT), not hardcoded path strings.
    Format: YAML throughout, read/written via modules/format.yaml.*
    (load_keyword_path/write_file — load_keyword_path already calls
    base.path.resolve_keywords internally, the exact read-side
    counterpart to the keyword registration above), not JSON. set-up's
    JSON profile format is a kiosk-appliance-era holdover, not a
    convention to match — see user-edit-console-zenka.yaml's
    set_up_format_gap for the full context; format.json.* / format.yaml.*
    are already symmetric shared modules either way, so this isn't
    blocked on anything, it's a plain module choice.
  host_system: |
    /etc/protocol-7/users/host-system/
    canonical records for users this node is authoritative for. This is
    what user-edit console reads defaults from and writes edits back to,
    through users.* commands (never touched directly by user-edit — see
    JUE's users_zenka_relationship).
  remote_incoming: |
    /etc/protocol-7/users/remote/incoming/
    records/requests received FROM other nodes about their users —
    populated by whatever discovery transport this zenka uses (see
    discovery_integration below). Directional split (incoming vs
    outgoing) mirrors the pattern discover.* already uses internally
    for packet handling (discover.handler.incoming_packet /
    discover.process_incoming_packet / discover.send_packet) — worth
    confirming this zenka reuses that split deliberately, not by
    coincidence, once discovery_integration below is resolved.
  remote_outgoing: |
    /etc/protocol-7/users/remote/outgoing/
    this node's own host-system records staged/queued for
    announcement to other nodes.
  not_yet_decided: >
    exact record format (per-user file? one file per host-system user,
    named how?), and what "incoming"/"outgoing" actually persist —
    full user records, or lighter sync/announce requests referencing
    records that live elsewhere (host-system/). The discover.* precedent
    (discover.load_resend_requests persists resend-reqs under
    var_P7/<zenka>/resend-reqs/, not etc_P7) suggests request-shaped
    transient state might belong under var_P7 instead of etc_P7/remote —
    worth resolving before implementation: etc_P7/users/remote may be
    the wrong tier for anything that isn't durable across a full node
    rebuild.

## -----------------------------------------------------------------------
## discovery — likely integration point, not a fresh build
## -----------------------------------------------------------------------

discovery_integration:
  finding: >
    modules/discover.* already exists and does real distributed
    discovery: mcast-based host announcement (discover.mcast.init_code,
    discover.format_discover_mcast_packet, discover.send_packet), an
    incoming/outgoing packet handling split
    (discover.handler.incoming_packet, discover.process_incoming_packet),
    and — notably — discover.orbital.store_remote ALREADY stores
    hostname + decoded pubkey + p7ref + timestamp per known remote node
    in <discover.orbital.known>, in memory. That is materially the same
    shape as "key authority for routing," already half-built.
  open_question: >
    RESOLVED (2026-08-10, verified against live code): NOT a straight
    wrap. Two real findings settle this:
      1. reach — discover.mcast.init_code sets mesg_ttl=3 (a few router
         hops, bounded site/local-network scope, not WAN/global). This
         matches — doesn't conflict with — identity_checksum_choice's
         BMW-L13 "host/medium-network" scope decision above. No WAN
         concern to design around.
      2. granularity mismatch — discover.orbital.store_remote stores ONE
         ENTRY PER HOST (hostname + the host's own single C25519 pubkey +
         p7ref), signed by one per-host key (discover.crypt.key_name).
         The mcast packet format (discover.format_discover_mcast_packet)
         carries zero per-user information. discover.* discovers NODES,
         not the individual user accounts living on them — it cannot
         become users-zenka's remote/ user records via a simple wrap,
         because it was never user-shaped to begin with.
  resolution: >
    Two layers, not one:
      - discover.orbital.known stays exactly what it already is: a
        presence/routing substrate ("which hosts exist, how do I reach
        them" — host pubkey + p7ref). users zenka does NOT reimplement
        or duplicate this.
      - users zenka's remote/ is a genuine APPLICATION-LAYER exchange on
        top: once discover says a host exists and how to reach it, users
        makes a real routed request to THAT HOST'S OWN users zenka asking
        for its user records — a new, small request/response protocol
        addressed to a peer users zenka, not a data wrap of discover's
        host-presence cache.
  transport_dependency_found: >
    CORRECTED (2026-08-10, traced one level deeper — the first pass was
    wrong): external.cmd.connect-orbital does NOT open a real cross-host
    connection today. It resolves a discover.orbital.known entry to an
    IP/pkey, then calls nodes.cmd.add-tronk via protocol-7.route-send —
    but (a) base.protocol-7.route-send is a SAME-HOST helper (prepends
    protocol-7.network.parent_route hops, then calls
    protocol-7.command.send.local — no network hop at all), and (b)
    nodes.cmd.add-tronk only records {name, addr, pkey} into
    <nodes.trunc> locally; the line where it would actually connect is a
    literal unimplemented stub: `## establish encrypted connection ..,
    ## [ LLL ] ##`. So the orbital/external/nodes path provides presence
    (discover) and a connection-state UI (external.cmd.list-connections
    etc, 'encrypted'=>FALSE/TRUE tracked per-connection) but NO working
    cross-host transport yet, full stop — not an encrypted-vs-plaintext
    question, a not-yet-connected-anywhere one.
  transparent_link_model: >
    per user direction (2026-08-10): when a real transport exists, the
    link should present as an ordinary protocol-7 link to the zenki on
    either end — "as if unencrypted," i.e. wire-protocol-transparent,
    with any encryption happening at a layer below the zenka code, not
    as a zenka-visible concern. Real, complete precedent for exactly
    this shape already exists: the `ssh` zenka (modules/ssh.connection.
    start opens a real authenticated+hostkey-verified SSH tunnel via
    Net::SSH2, then ssh.handler.nailara_io / ssh.handler.ssh_io pipe RAW
    protocol-7 wire bytes bidirectionally between a local protocol-7
    socket and the remote proto-7 port through that tunnel). Neither
    side's zenka code ever sees SSH — it just reads/writes a normal
    local protocol-7 socket. This is the working, complete version of
    what external.cmd.connect-orbital's 'encrypted' field gestures at
    but never implements. Two real options once remote/ is actually
    built, in order of how much new work each needs:
      (a) reuse the ssh zenka's tunnel machinery directly as the
          transport for a users-zenka remote connection (link setup via
          ssh profiles, addressed by name) — least new code, but couples
          remote/ to ssh-zenka link configuration existing per peer pair
      (b) finish the nodes.cmd.add-tronk [LLL] stub to actually connect
          (mirroring ssh's own connect+pipe shape but keyed off
          discover.orbital's already-known pkey/p7ref instead of a
          manually configured ssh profile) — more work, but is the
          "real" fix for the orbital/external path as originally
          intended, and doesn't require a pre-configured ssh link per
          peer
    neither is required to finish users-zenka's phase 1 (host-system/
    only, already shipped). This is recorded so phase 2 doesn't start
    from "the transport already exists" (it doesn't) or invent a THIRD
    transport pattern alongside ssh's and orbital's half-built one.
  working_transport_precedent_p7r: >
    verification caveat, per user (2026-08-10): this and
    link_upgrade_perl_side below are CODE-REVIEW findings only — p-7-r
    was confirmed installed and its usage banner runs, but no live
    round-trip against a real remote protocol-7 host was tested this
    session. Per user: these components should, for their STATED
    functions, be at least feature-complete — i.e. treat "auth-keypair
    handshake + TOFU + command/reply parsing" and "DH key exchange
    negotiation" as intended-complete implementations of exactly what
    they claim to do, not partial stubs, UNLESS a piece is explicitly
    marked incomplete (e.g. base.handler.link-upgrade.response's literal
    TODO/placeholder comment) — that marked gap is a real, narrow
    exception (cipher NOT applied to payload post-handshake), not
    evidence the surrounding handshake/auth machinery is unreliable.
    SUPERSEDES the "no working cross-host transport exists" framing
    above for one-shot command execution specifically (ssh/orbital
    analysis above still stands for a persistent tunnel). bin/c_src/
    p-7-r.c (protocol-7-remote) is a COMPLETE, ALREADY-WORKING,
    already-installed standalone C client — confirmed live at
    /usr/local/bin/p-7-r, auto-compiled+installed by the v7 zenka
    (modules/v7.compile_bin_p7r, same auto-install pattern CLAUDE.md
    documents for p7c) — not a stub, not aspirational. Usage: `p-7-r
    <hostname[:port]> <command> [args]`, default port 42. Real,
    working handshake against a live remote protocol-7 host: reads the
    \\PROTOCOL-7-VERSION\\<VERSION>\\ banner, `select auth-keypair`,
    TOFU-validates the server's pubkey (shells to p7-tofu-helper.pl —
    same TOFU mechanism project-zenka-cryptographic-identity-survey.md
    found on the SERVER side, plugin.auth.auth-keypair.
    validate-incoming-tofu — this is its client-side counterpart, both
    real), sends `auth <user> <c25519_pubkey> <ed25519_sig>` (shells to
    p7-auth-keypair-helper.pl gen-auth), then the actual command, then
    parses the real TRUE/FALSE/SIZE/CHRSIZE/STRM reply grammar — the
    same wire-level shape as the .cmd. reply contract
    (feedback-cmd-data-must-be-string.md) this doc's own value-get/
    value-all bugs were just fixed against, just at the wire level
    instead of the Perl %code level.
    CONFIRMS transparent_link_model exactly: auth is always signed
    (C25519/Ed25519), but the command/reply payload is plaintext by
    default — encryption is a fully optional negotiated upgrade
    (PROTOCOL_7_LINK_UPGRADE=yes env var triggers negotiate_link_upgrade:
    ephemeral DH via p7-link-upgrade-helper.pl gen-ephemeral/compute-dh/
    derive-key). This is real code proving the "as if unencrypted,
    transparent to the zenki, encryption optional" model already ships
    today, independent of ssh/orbital.
    practical implication for remote/: this is the most direct existing
    path to "ask a peer host's users zenka for its records" — a
    users.remote-* command could shell out to p-7-r <peer-host>
    users.value-all (peer host/port resolved from discover.orbital.known
    presence data), OR a native-Perl equivalent could be built reusing
    the same three helper scripts (p7-tofu-helper.pl,
    p7-auth-keypair-helper.pl, p7-link-upgrade-helper.pl) p-7-r already
    shells out to, avoiding a subprocess per request. Either way: this
    is the concrete unblock for remote/'s transport question, more
    direct than either finishing the orbital [LLL] stub or wiring
    through the ssh zenka. Still not decided WHICH of shell-out-to-p7-r
    vs native-Perl-via-the-same-helpers remote/ should use — that's the
    next open question, not "is there a working transport" (there is).
  link_upgrade_perl_side: >
    the server-side (and a client-side helper) Perl implementation of
    the SAME protocol p-7-r.c speaks, confirmed wire-compatible:
    cube.cmd.link-upgrade returns literally "TRUE link-upgrade OK
    <pubkey_b32>" — the exact string p-7-r.c's negotiate_link_upgrade()
    parses via strstr(response_line,"OK "). Session state machine:
    state 1 (plaintext/authenticated, default, indefinite) -> state 2
    (protocol.protocol-7.link-upgrade.init generates an ephemeral
    Curve25519 keypair + capability list [ChaCha20-Poly1305 encryption;
    utf7/base32/base32-xz encoding]; base.handler.link-upgrade processes
    link-pub-key/link-confirm-encoding/link-complete, does REAL DH via
    Crypt::Curve25519::curve25519_shared_secret) -> state 3 (upgraded).
    A client-side Perl equivalent of p-7-r.c's C handshake also exists:
    protocol.protocol-7.link-upgrade.handshake($socket,$options).
    GAP FOUND (real, on BOTH ends, not just one): base.handler.
    link-upgrade.response is a literal `## TODO: Implement link-upgrade
    response formatting ... Placeholder: pass through unchanged` — and
    re-checking p-7-r.c's own main read loop, enc_state.key (the derived
    shared secret) is computed but never actually used to encrypt/
    decrypt the subsequent recv()/write() traffic either. So: the DH
    handshake itself is real, complete, and wire-compatible C25519/
    Curve25519 crypto — but NEITHER side applies the negotiated cipher
    to payload data afterward yet. State 3 is reached, but nothing is
    actually encrypted once there. Do not assume "link-upgrade" gives
    remote/ real transport encryption today — it gives a real, reusable
    key-exchange primitive with the cipher-application step still open
    on both client and server. If remote/ needs actual encrypted
    payload later, this is the near-complete primitive to finish
    (implement the missing cipher wrapper in
    base.handler.link-upgrade.response and its p-7-r.c counterpart),
    not something to build from scratch.
  if_integration_chosen: >
    [ superseded by resolution above — kept for history ] users zenka
    would not reimplement packet handling — it would consume
    discover.orbital.known (or a discover.* accessor built for this
    purpose) and be the thing that PERSISTS it durably + exposes it via
    users.* commands + folds in host-system's own local records, rather
    than discover.* owning persistence itself. discover.* today looks
    memory-only (<discover.orbital.known>, no store-to-disk call seen in
    store_remote) — persistence is the gap users zenka would actually
    fill, not discovery itself.
  identity_checksum_choice: >
    RESOLVED (2026-08-10, per user + verified against live code): use
    BMW-L13 (base.chk-sum.bmw.L13-str / harmonize_L13) as the identity
    checksum for remote/{incoming,outgoing} records, not a fresh scheme.
    Precedent: discover.orbital.store_remote ALREADY keys known remote
    pubkeys by BMW-L13 today — this is not a new choice, it's reusing the
    exact mechanism the discovery layer already validates. BMW-L13 is not
    a truncated BMW512 — harmonize_L13 folds the 512-bit digest through
    the harmonic (division-by-13) AMOS7::Assert::Truth::true_int
    validator until the result passes, then base32-encodes to a fixed
    13-char string (~65 bits). It sits deliberately between AMOS7's
    7-char scheme (cheap, small-scope — fine for host-system/'s local
    users) and full BMW224/384 (geometric routing, currently
    local-module-scoped only, not a network mechanism — see
    project-checksum-addressing-implementation-survey.md). Net effect:
    host-system/ local records can stay on AMOS7 or a C25519-derived
    P7REF (base.p7ref.self shape); remote/{incoming,outgoing} identity —
    the actual multi-node discovery layer — uses BMW-L13, same as
    discover.orbital already does, rather than inventing a fourth
    checksum convention.

## -----------------------------------------------------------------------
## central registration point — future scope, not phase 1/2
## -----------------------------------------------------------------------

central_registration_point: >
  per user (2026-08-10): host-system/ records are intended to eventually be
  the CENTRAL registration point for a broader class of per-user
  peripheral/personal data — not just what user-edit console's form edits,
  but things like personal email addresses and similar — with OTHER zenki
  resolving their own config FROM these records rather than duplicating it:
    - smtpd (modules/smtpd.* — real, live mail archive/route/classify
      zenka today) would resolve a user's mail identity/routing data from
      here instead of its own separate config, once wired.
    - nameserv's PLANNED TXT/SRV record features (per user — confirmed not
      yet built: grepped modules/nameserv.* for literal TXT/SRV record
      generation, found none; only coincidental substring hits like
      discover-nodes/p7ref_lookup) would generate DNS TXT/SRV records FROM
      user-zenka data (e.g. SPF/DKIM/MX-relevant fields tied to a user's
      registered email) rather than a separate nameserv-side config surface.
  this directly matches [[feedback-no-personal-data-in-repo-tree]]'s
  existing rule (never hardcode PII into repo-tracked files, use external
  dirs) — host-system/ under /etc/protocol-7/users/ already IS that
  external, non-repo location, so this isn't a new constraint, it's the
  natural consumer other zenki should have been resolving PII from all
  along instead of ad-hoc per-zenka config.
  reproducible-setup package: per user, host-system/'s eventual role is to
  BE (or be referenced by) a package from which an entire node's set-up can
  be recreated — echoes set-up zenka's already-real profile export/import
  machinery (set-up.cmd.export-config/create-profile/install-profile/
  fetch-zenka-config, whole-zenka-config JSON snapshots — see
  user-edit-console-zenka.yaml's related_precedent_set_up_zenka) at a
  different granularity (per-user field records, not whole-zenka-config
  blobs). Whether this means host-system/ becomes one of the things
  set-up's profile export captures, or a parallel reproducibility
  mechanism, is NOT decided — flagging the connection so a future
  reproducible-setup design doesn't start from scratch or duplicate
  set-up's existing profile machinery.
  status: vision-level, not scoped as phase 1 or phase 2 work. Recorded
  here so the eventual "other zenki consume user records" and "node
  recreation package" designs start from this doc's existing storage
  layout/identity decisions rather than reinventing them.

## -----------------------------------------------------------------------
## key authority
## -----------------------------------------------------------------------

key_authority:
  role: >
    per user direction: when a local zenka wants to contact a user or
    another zenka, it asks the users zenka to acquire/resolve the
    correct key, and that key feeds routing directly.
  precedent: >
    discover.orbital.store_remote already decodes and stores a pubkey
    per known remote host (see discovery_integration above) — if
    discovery integration is chosen, key authority is largely "expose
    that lookup as a users.* command, backed by host-system/ for local
    users and remote/ for discovered ones," not new key-handling logic.
  relationship_to_crypt_C25519: >
    crypt.C25519.* / ~/.n/user-keys remain the actual key material and
    signing operations — users zenka is an AUTHORITY/DIRECTORY over
    which key belongs to which user/host for routing purposes, not a
    replacement for crypt.C25519. Needs a clear boundary statement once
    written: users zenka resolves "which key", crypt.C25519 does
    "operations with a key".

## -----------------------------------------------------------------------
## external source hooks — key generation, cross-zenka data lookup
## -----------------------------------------------------------------------

external_source_hooks:
  requirement: >
    per user direction: users zenka needs hooks out to external sources —
    key generation (when a lookup misses and no key exists yet for a
    local host-system user) and data lookup from OTHER zenki (unnamed so
    far — could overlap with discovery_integration's discover.* question
    above, or be a distinct need; not specified beyond "other zenki").
    Both are cross-zenka operations, not in-process calls.
  async_design: >
    per user direction, correctly: this needs a real async design, not a
    synchronous call. The right mechanism already exists and is used
    elsewhere in this codebase — do NOT invent a new hook-registry
    abstraction for this. FALSE START avoided during this design: was
    initially going to point at base.handler.hooks.register/unregister,
    but that's session I/O interception (input-pre/output/command hooks
    on a connection) — a completely different concern, wrong fit,
    corrected before it went further.
    The actual precedent: `{ mode => 'deferred' }` + `base.callback.
    cmd_reply`, exactly as mpv.cmd.quit / mpv.snapshot.cmd_reply already
    do — a .cmd. handler returns deferred immediately (stashing the
    caller's reply_id), does async work, and calls
    `<[base.callback.cmd_reply]>->($reply_id, {mode=>..., data=>...})`
    once that work resolves, to actually deliver the reply.
    For users zenka's external hooks this nests one level deeper: a
    users.* command that needs a key generated or data looked up from
    another zenka returns deferred to ITS caller, issues a routed
    command to the external zenka (crypt.C25519 for key generation,
    presumably — not yet confirmed callable this way; whichever zenka
    for data lookup — not yet named), and on receiving THAT zenka's
    reply (via its own <zenka>.handler.*_reply-style callback, same
    shape as mpv.snapshot.cmd_reply), calls base.callback.cmd_reply to
    complete the ORIGINAL deferred command back to whoever asked users.*
    in the first place. Two hops, same primitive reused at each hop —
    not two different mechanisms.
  open_questions:
    - does crypt.C25519 already expose a routable command for key
      generation, or would one need to be added? Not checked yet.
    - which zenka(s) provide "data lookup from other zenki" — genuinely
      unnamed by user direction so far, distinct open item from
      discovery_integration's discover.* question above (that's about
      distributed USER discovery specifically; this may be broader)

## -----------------------------------------------------------------------
## relationship to user-edit console (JUE)
## -----------------------------------------------------------------------

user_edit_relationship: >
  Per user-edit-console-zenka.yaml's users_zenka_relationship (already
  resolved): user-edit has no storage of its own. It calls a users.*
  command surface — get(user) to populate form defaults, set(user,
  values) on submit. That command surface is this doc's to define; JUE
  only needs the names/args once they exist. host-system/ is exactly
  what those get/set calls read and write.

open_questions:
  - a DIFFERENT, still-planned `settings` zenka is intended for later —
    the name was freed by set-up's rename (commit 089844a94, "'set-up'
    <-- 'settings'"; set-up is real installer-profile machinery,
    unrelated in granularity to this doc's storage). whether that future
    `settings` zenka subsumes THIS doc's host-system/ canonical storage
    or is scoped to something else entirely is undecided — see
    user-edit-console-zenka.yaml's related_precedent_set_up_zenka for
    the full note. do not build storage_layout against either
    assumption; reconcile explicitly once a `settings` design exists.
  - discovery_integration's core question (integrate with discover.* vs
    separate) — resolve before implementation, it changes this zenka's
    entire discovery-side design
  - remote/incoming and remote/outgoing: full records or sync requests —
    and does that belong under etc_P7 (durable) or var_P7 (transient),
    per storage_layout.not_yet_decided
  - record format for host-system/ (per-user file naming, structure) —
    needed before users.* get/set can be specified concretely
  - v7-managed lifecycle specifics (always-on vs on-demand, restart
    policy) not yet addressed at all — this doc is storage/discovery/key
    scope only so far

