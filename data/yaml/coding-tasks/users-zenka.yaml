task_metadata:
  title: "users zenka — canonical user records, distributed discovery, key authority"
  description: >
    A v7-managed zenka that is the canonical local authority for user
    records (the data user-edit console edits), tracks distributed
    discovery of the same kind of records from other nodes, and acts as
    a key authority for local zenki: when a zenka needs to contact a
    user or another zenka, it asks the users zenka to resolve the
    correct key, which then feeds routing directly.
  priority: low
  category: "new-zenki"
  runtime_surface: >
    HEADLESS — no UI of any kind, terminal or GUI. RESOLVED 2026-08-10,
    per user, alongside user-edit-console-zenka.yaml's
    amos_term_plugin_overlap resolution: user-edit is the terminal
    console (and later, additively, a GTK3-class GUI via amos-term);
    this zenka is pure backend authority underneath both. Nothing about
    rendering, key input, or amos-term's plugin system applies here.

## -----------------------------------------------------------------------
## storage layout — decided
## -----------------------------------------------------------------------

storage_layout:
  decided: >
    /etc/protocol-7/users/host-system/ and /etc/protocol-7/users/remote/
    {incoming,outgoing}/ — both user-verified against bin/harmony.
    [ tier caveat added later the same session: the remote/ half's
      DEFAULT tier is var_P7, with etc_P7 as an override — see
      var_vs_etc_tier below. host-system/ is etc_P7, unqualified. ]
    Precedent: /etc/protocol-7/ already has non-per-zenka top-level dirs
    today (certs, export, import, jobsite, zenki) — a shared "users"
    dir at that level, not nested under a per-zenka etc_P7/<zenka>
    subdirectory, matches existing convention. Register these as
    keywords via base.path.register_keywords per
    user-edit-console-zenka.yaml's phase_1b (e.g. USERS_HOST,
    USERS_REMOTE_IN, USERS_REMOTE_OUT), not hardcoded path strings.
    Format: YAML throughout, read/written via src/format.yaml.*
    (load_keyword_path/write_file — load_keyword_path already calls
    base.path.resolve_keywords internally, the exact read-side
    counterpart to the keyword registration above), not JSON. set-up's
    JSON profile format is a kiosk-appliance-era holdover, not a
    convention to match — see user-edit-console-zenka.yaml's
    set_up_format_gap for the full context; format.json.* / format.yaml.*
    are already symmetric shared modules either way, so this isn't
    blocked on anything, it's a plain module choice.
  host_system: |
    /etc/protocol-7/users/host-system/
    canonical records for users this node is authoritative for. This is
    what user-edit console reads defaults from and writes edits back to,
    through users.* commands (never touched directly by user-edit — see
    JUE's users_zenka_relationship).
  remote_incoming: |
    /etc/protocol-7/users/remote/incoming/
    NOTE: var_P7/users/remote/incoming/ is the DEFAULT tier for this
    path and the etc_P7 form shown here is the OVERRIDE tier — see
    var_vs_etc_tier below, which was decided after this entry was
    written.
    records/requests received FROM other nodes about their users —
    populated by whatever discovery transport this zenka uses (see
    discovery_integration below). Directional split (incoming vs
    outgoing) mirrors the pattern discover.* already uses internally
    for packet handling (discover.handler.incoming_packet /
    discover.process_incoming_packet / discover.send_packet) — worth
    confirming this zenka reuses that split deliberately, not by
    coincidence, once discovery_integration below is resolved.
  remote_outgoing: |
    /etc/protocol-7/users/remote/outgoing/
    NOTE: same tier caveat as remote_incoming — var_P7/users/remote/
    outgoing/ is the DEFAULT, etc_P7 the OVERRIDE, per var_vs_etc_tier
    below.
    this node's own host-system records staged/queued for
    announcement to other nodes.
  record_format: >
    RESOLVED (2026-08-11, per user), applying the existing addressing-
    trinity primitive (data/ai-mem/claude/topic-addressing-trinity.md —
    name/checksum/timestamp as three orthogonal axes, not merged into
    one hash) directly to remote/ records:
      name:      dotted path segment (e.g. the record's place under
                 users.remote.incoming/outgoing)
      checksum:  BMW-L13 of the remote user's C25519 pubkey — identity
                 axis. Stays pure/timestamp-free per
                 identity_checksum_choice and discover.orbital.
                 store_remote's own precedent (keys ALREADY computed
                 this way from pubkey bytes alone, no time/nonce input)
                 — this is what stays re-derivable by anyone from the
                 pubkey alone, and what must NOT move when content
                 changes, so directory/routing addressing never breaks.
      timestamp: creation ntime — temporal axis, separate field
      latest / current: per the trinity's own pattern, diverge only
                 when deliberately pointing at prior state (rollback/
                 audit/snapshot) — this is the resolved mechanism for
                 the "unchangeable root + appended session, compaction
                 changes the record but not its identity" question
                 raised during this design pass: BMW-L13(pubkey) is the
                 permanent root/directory name; content changes are
                 appended (mirrors zenka-key-identity-infrastructure.
                 md's world-appendable log/ pattern under a task's
                 pubkey directory) and tracked via latest/current
                 rather than by mutating the identity checksum.
                 Compacting the append-log into a fresh baseline is
                 free to change a separate CONTENT checksum (a distinct
                 field, not yet named) without touching the identity
                 checksum used as the parent directory.
      nested entries under a remote/ record (if any) would use
      CHECKSUM-PARENTING-NAMESPACE-TREES.md's auto-parenting relation
      (C0 = chksum(C1 ':' name)) rather than a second identity scheme —
      distinct role from the BMW-L13 root: structural/parenting, not
      peer identity.
    directory-as-session fallback: per user direction, treating every
    node as BOTH a directory (structural/addressable) and a session
    (append-only/temporal) by default avoids needing to pick one
    up-front and re-architect later when the other turns out to be
    needed too — a plain record can always grow a log/ subdirectory
    without changing its address, and a session can always be addressed
    as a directory without inventing a new identity scheme.
  var_vs_etc_tier: >
    RESOLVED (2026-08-11, per user): var_P7/users/remote/{incoming,
    outgoing}/ is the DEFAULT tier — matches the discover.*
    precedent (discover.load_resend_requests persists resend-reqs
    under var_P7/<zenka>/resend-reqs/, not etc_P7) for request/sync-
    shaped state that shouldn't survive a full node rebuild by default.
    etc_P7/users/remote/ acts as an OVERRIDE tier on top: a record
    present there wins over the var_P7 default for that same BMW-L13
    identity, for the case of a deliberately PERMANENT link between two
    hosts maintained by the same user (e.g. always-trusted peers that
    should survive a rebuild without needing rediscovery/re-sync).
    Lookup order: check etc_P7/users/remote/<BMW-L13>/ first, fall back
    to var_P7/users/remote/<BMW-L13>/ if absent — same directory-as-
    session shape either way (record_format above), just a different
    durability tier for the same identity-addressed directory.
  not_yet_decided: >
    RESOLVED (2026-08-11, per user): lightweight — sync/announce
    requests referencing records that live elsewhere (host-system/ for
    local, the peer's own host-system/ for remote), NOT full record
    copies. Sized specifically to make session state recoverable across
    a host reboot: enough of the trinity fields (record_format above —
    identity checksum + name + timestamp/latest/current pointer) to
    resume an in-flight exchange or re-establish a known peer link
    without needing a full re-sync from scratch, but no record content
    duplication. This is consistent with var_vs_etc_tier's var_P7
    default (transient-but-recoverable, not durable-by-default) — the
    lightweight shape is exactly what makes var_P7 an acceptable
    default: there's little to lose and quickly reconstruct if it's
    cleared, since the authoritative content stays in host-system/ (or
    the remote peer's own host-system/), never duplicated into
    incoming/outgoing.

## -----------------------------------------------------------------------
## discovery — likely integration point, not a fresh build
## -----------------------------------------------------------------------

discovery_integration:
  finding: >
    src/discover.* already exists and does real distributed
    discovery: mcast-based host announcement (discover.mcast.init_code,
    discover.format_discover_mcast_packet, discover.send_packet), an
    incoming/outgoing packet handling split
    (discover.handler.incoming_packet, discover.process_incoming_packet),
    and — notably — discover.orbital.store_remote ALREADY stores
    hostname + decoded pubkey + p7ref + timestamp per known remote node
    in <discover.orbital.known>, in memory. That is materially the same
    shape as "key authority for routing," already half-built.
  open_question: >
    RESOLVED (2026-08-10, verified against live code): NOT a straight
    wrap. Two real findings settle this:
      1. reach — discover.mcast.init_code sets mesg_ttl=3 (a few router
         hops, bounded site/local-network scope, not WAN/global). This
         matches — doesn't conflict with — identity_checksum_choice's
         BMW-L13 "host/medium-network" scope decision below. No WAN
         concern to design around.
      2. granularity mismatch — discover.orbital.store_remote stores ONE
         ENTRY PER HOST (hostname + the host's own single C25519 pubkey +
         p7ref), signed by one per-host key (discover.crypt.key_name).
         The mcast packet format (discover.format_discover_mcast_packet)
         carries zero per-user information. discover.* discovers NODES,
         not the individual user accounts living on them — it cannot
         become users-zenka's remote/ user records via a simple wrap,
         because it was never user-shaped to begin with.
  resolution: >
    Two layers, not one:
      - discover.orbital.known stays exactly what it already is: a
        presence/routing substrate ("which hosts exist, how do I reach
        them" — host pubkey + p7ref). users zenka does NOT reimplement
        or duplicate this.
      - users zenka's remote/ is a genuine APPLICATION-LAYER exchange on
        top: once discover says a host exists and how to reach it, users
        makes a real routed request to THAT HOST'S OWN users zenka asking
        for its user records — a new, small request/response protocol
        addressed to a peer users zenka, not a data wrap of discover's
        host-presence cache.
  transport_dependency_found: >
    CORRECTED (2026-08-10, traced one level deeper — the first pass was
    wrong): external.cmd.connect-orbital does NOT open a real cross-host
    connection today. It resolves a discover.orbital.known entry to an
    IP/pkey, then calls nodes.cmd.add-tronk via protocol-7.route-send —
    but (a) base.protocol-7.route-send is a SAME-HOST helper (prepends
    protocol-7.network.parent_route hops, then calls
    protocol-7.command.send.local — no network hop at all), and (b)
    nodes.cmd.add-tronk only records {name, addr, pkey} into
    <nodes.trunc> locally; the line where it would actually connect is a
    literal unimplemented stub: `## establish encrypted connection ..,
    ## [ LLL ] ##`. So the orbital/external/nodes path provides presence
    (discover) and a connection-state UI (external.cmd.list-connections
    etc, 'encrypted'=>FALSE/TRUE tracked per-connection) but NO working
    cross-host transport yet, full stop — not an encrypted-vs-plaintext
    question, a not-yet-connected-anywhere one.
  transparent_link_model: >
    per user direction (2026-08-10): when a real transport exists, the
    link should present as an ordinary protocol-7 link to the zenki on
    either end — "as if unencrypted," i.e. wire-protocol-transparent,
    with any encryption happening at a layer below the zenka code, not
    as a zenka-visible concern. Real, complete precedent for exactly
    this shape already exists: the `ssh` zenka (src/ssh.connection.
    start opens a real authenticated+hostkey-verified SSH tunnel via
    Net::SSH2, then ssh.handler.nailara_io / ssh.handler.ssh_io pipe RAW
    protocol-7 wire bytes bidirectionally between a local protocol-7
    socket and the remote proto-7 port through that tunnel). Neither
    side's zenka code ever sees SSH — it just reads/writes a normal
    local protocol-7 socket. This is the working, complete version of
    what external.cmd.connect-orbital's 'encrypted' field gestures at
    but never implements. Two real options once remote/ is actually
    built, in order of how much new work each needs:
      (a) reuse the ssh zenka's tunnel machinery directly as the
          transport for a users-zenka remote connection (link setup via
          ssh profiles, addressed by name) — least new code, but couples
          remote/ to ssh-zenka link configuration existing per peer pair
      (b) finish the nodes.cmd.add-tronk [LLL] stub to actually connect
          (mirroring ssh's own connect+pipe shape but keyed off
          discover.orbital's already-known pkey/p7ref instead of a
          manually configured ssh profile) — more work, but is the
          "real" fix for the orbital/external path as originally
          intended, and doesn't require a pre-configured ssh link per
          peer
    neither is required to finish users-zenka's phase 1 (host-system/
    only, already shipped). This is recorded so phase 2 doesn't start
    from "the transport already exists" (it doesn't) or invent a THIRD
    transport pattern alongside ssh's and orbital's half-built one.
  working_transport_precedent_p7r: >
    verification caveat, per user (2026-08-10): this and
    link_upgrade_perl_side below are CODE-REVIEW findings only — p-7-r
    was confirmed installed and its usage banner runs, but no live
    round-trip against a real remote protocol-7 host was tested this
    session. Per user: these components should, for their STATED
    functions, be at least feature-complete — i.e. treat "auth-keypair
    handshake + TOFU + command/reply parsing" and "DH key exchange
    negotiation" as intended-complete implementations of exactly what
    they claim to do, not partial stubs, UNLESS a piece is explicitly
    marked incomplete (e.g. base.handler.link-upgrade.response's literal
    TODO/placeholder comment) — that marked gap is a real, narrow
    exception (cipher NOT applied to payload post-handshake), not
    evidence the surrounding handshake/auth machinery is unreliable.
    SUPERSEDES the "no working cross-host transport exists" framing
    above for one-shot command execution specifically (ssh/orbital
    analysis above still stands for a persistent tunnel). bin/c_src/
    p-7-r.c (protocol-7-remote) is a COMPLETE, ALREADY-WORKING,
    already-installed standalone C client — confirmed live at
    /usr/local/bin/p-7-r, auto-compiled+installed by the v7 zenka
    (src/v7.compile_bin_p7r, same auto-install pattern CLAUDE.md
    documents for p7c) — not a stub, not aspirational. Usage: `p-7-r
    <hostname[:port]> <command> [args]`, default port 42. Real,
    working handshake against a live remote protocol-7 host: reads the
    \\PROTOCOL-7-VERSION\\<VERSION>\\ banner, `select auth-keypair`,
    TOFU-validates the server's pubkey (shells to p7-tofu-helper.pl —
    same TOFU mechanism project-zenka-cryptographic-identity-survey.md
    found on the SERVER side, plugin.auth.auth-keypair.
    validate-incoming-tofu — this is its client-side counterpart, both
    real), sends `auth <user> <c25519_pubkey> <ed25519_sig>` (shells to
    p7-auth-keypair-helper.pl gen-auth), then the actual command, then
    parses the real TRUE/FALSE/SIZE/CHRSIZE/STRM reply grammar — the
    same wire-level shape as the .cmd. reply contract
    (feedback-cmd-data-must-be-string.md) this doc's own value-get/
    value-all bugs were just fixed against, just at the wire level
    instead of the Perl %code level.
    CONFIRMS transparent_link_model exactly: auth is always signed
    (C25519/Ed25519), but the command/reply payload is plaintext by
    default — encryption is a fully optional negotiated upgrade
    (PROTOCOL_7_LINK_UPGRADE=yes env var triggers negotiate_link_upgrade:
    ephemeral DH via p7-link-upgrade-helper.pl gen-ephemeral/compute-dh/
    derive-key). This is real code proving the "as if unencrypted,
    transparent to the zenki, encryption optional" model already ships
    today, independent of ssh/orbital.
    practical implication for remote/: this is the most direct existing
    path to "ask a peer host's users zenka for its records" — this is
    the concrete unblock for remote/'s transport question, more direct
    than either finishing the orbital [LLL] stub or wiring through the
    ssh zenka.
  transport_implementation_choice: >
    RESOLVED (2026-08-11, per user: "native perl would almost always be
    preferred to shelling out"), verified against live code: native-Perl,
    NOT shell-out-to-p7-r. The p7-*-helper.pl scripts
    (p7-tofu-helper.pl, p7-auth-keypair-helper.pl,
    p7-link-upgrade-helper.pl) only exist because p-7-r.c is C and needs
    popen() to reach Perl's crypto libs (Crypt::Ed25519,
    Crypt::Curve25519) at all — that barrier does not apply to a Perl
    zenka. Confirmed both sides of the handshake already exist as
    in-process %code modules, not scripts: server-side TOFU/auth-keypair
    is plugin.auth.auth-keypair(.validate-incoming-tofu/.init_code),
    already real; client-side is
    protocol.protocol-7.link-upgrade.handshake($socket,$options) — this
    doc's own link_upgrade_perl_side note already identifies it as "a
    client-side Perl equivalent of p-7-r.c's C handshake." crypt.C25519.*
    additionally exposes session-key/session-sig generation natively
    (crypt.C25519.cmd.get-session-sig etc.) — no subprocess needed for
    the signing step either. Shelling out to p-7-r per remote/ request
    would mean spawning a subprocess per call and parsing its
    TRUE/FALSE/SIZE/STRM text reply grammar back into Perl data,
    duplicating auth logic that already runs in-process on both ends.
    users.remote-* should compose plugin.auth.auth-keypair +
    protocol.protocol-7.link-upgrade.handshake + crypt.C25519.* directly,
    not shell out to p-7-r or its helper scripts.
  IMPLEMENTED (2026-08-11): slice 1 landed and is live-verified end to
    end — users.cmd.remote-get (server, read-only, its own access-grant
    surface, reuses users.record.validate) + users.cmd.remote-fetch
    (client, deferred) + users.remote_fetch.run (the actual connect/
    auth/dispatch worker) + auth.client.auth-keypair.authenticate (new,
    modeled directly on auth.client.zenka.authenticate) +
    users.handler.remote_fetch_reply (completes the original caller's
    deferred reply once the async round-trip finishes). Verified via a
    loopback self-test against this host's own cube (127.0.0.1:42,
    identity 'test-auth-keypair', narrow access.cmd.usr.test-auth-keypair
    = users.remote-get grant in cfg/zenki/cube/access.users) —
    reliable across repeated runs, correctly rejects unknown users, no
    session leaks. NOT implemented in this slice: discover.orbital.known
    -> host:port resolution (still takes an explicit host[:port] arg),
    the remote/{incoming,outgoing} sync-cache storage layer, link-upgrade
    encryption, or SIGNED-COMMAND-INTERFACE.md command-level signing on
    top of the connection-level auth-keypair signing.

    Real bugs found and fixed along the way, worth recording since none
    of them were documented anywhere and several are non-obvious traps
    for the NEXT thing that composes these same primitives:

    (1) TOFU pin-key stability — plugin.auth.auth-keypair.
    validate-incoming-tofu pins the CLIENT's session pubkey on first
    contact (etc_home/.n/remote-keys/incoming/<user>.public) and only
    reaches 'authorized' once an admin creates a SYMLINK at
    authorized/<zenka>/<user>.public pointing at that pinned file (or,
    as used for the self-test, pointing directly at a real master-key
    file — the TOFU check only requires -l/-f on that path, it doesn't
    itself compare content; load-authorized-users, a SEPARATE mechanism
    reading the SAME path, is what needs the content to be the actual
    master pubkey). A client that regenerates its session keypair on
    every connection can NEVER reach 'authorized' — each connection
    re-pins a different key forever. The client identity must be a
    STABLE, disk-persisted key (crypt.C25519.key_exists + load_keypair
    if present, else gen_keys + write_keys), not regenerated per call.

    (2) crypt.C25519.key_vars cache hijack — calling key_vars($name) for
    a name that ISN'T the process's real base key, when it's the FIRST
    key_vars() call in the process and that name's key files already
    exist on disk, silently sets <crypt.C25519.base_key_name> to that
    name permanently (crypt.C25519.key_vars:29-33). A later unqualified
    sign_data(\$msg) call then signs with the WRONG key. Always pass the
    real base key name explicitly to sign_data's second arg rather than
    relying on the implicit default once any OTHER named key has been
    touched in the same process.

    (3) plugin.auth.auth-keypair's own success line is literally
    "AUTH_TRUE =)" — a distinct wire format from the generic
    TRUE/FALSE/SIZE/CHRSIZE .cmd. reply grammar used for actual routed
    commands. auth.client.zenka.process_auth_reply already checks for
    this exact string and is genuinely reusable for auth-keypair despite
    its zenka-specific namespace.

    (4) protocol.protocol-7.auth.select-method is NOT generically reusable
    across auth methods — it hard-requires the reply be literally 'TRUE
    continue', but auth.auth_select's auth-keypair branch replies 'TRUE
    <server_pubkey_b32>' instead (doubles as TOFU material). Had to
    inline the select-method exchange for auth-keypair rather than reuse
    that helper.

    (5) base.session.init's $name param must satisfy base.regex's
    usr_str_re (alnum/hyphen/underscore only, max 32 chars) or it
    silently returns undef with no other symptom — a label like
    "remote-fetch:<host>:<port>" fails outright.

    (6) base.protocol-7.command.send.local must be called via its
    non-prefixed swap-family alias, <[protocol-7.command.send.local]>,
    not <[base.protocol-7.command.send.local]> — matches
    base.protocol-7.route-send's own internal call site.

    (7) A registered reply handler's real call signature (confirmed
    against base.handler.command.process_reply, NOT what
    discover.orbital.handler.local_p7ref_reply's single-arg shift
    suggested) is a SINGLE hashref: { sid, cmd, call_args, params,
    data? }. 'cmd' is the wire-level mode keyword (TRUE/FALSE/SIZE/...);
    SIZE mode carries its payload in a separate top-level 'data' key,
    TRUE/FALSE carry theirs in call_args->{'args'} instead.

    (8) The real deadlock, found via this same loopback self-test before
    any of the above were fixed: an EARLIER version of remote_fetch.run
    did the entire handshake AND the subsequent command/reply via manual
    blocking socket reads. Looping back through this SAME host's own
    cube meant cube routed users.remote-get back to THIS SAME users
    zenka process's own pre-existing link session — which could not be
    serviced because the process was blocked waiting on its own reply,
    on its own single-threaded event loop. v7.restart could not recover
    it either, since the stuck process couldn't process its own
    restart/stop command while blocked — required v7.stop (TERM then
    KILL) to recover, and surfaced a second real gap: users'
    start.cfg had no max_concurrency limit, so a racing
    v7.start during the hang produced two live instances at once (fixed:
    max_concurrency = 1, matching image2html/window-place's own
    precedent). Fixed at the ROOT by modeling the post-handshake flow on
    how every regular protocol-7 session already works: base.session.init
    + explicit base.session.init_state($id, 1) hands the connection to
    the normal event-driven command-dispatch machinery, so the event
    loop is never blocked waiting on itself — this also means a real
    cross-host call (a genuinely separate peer process) was never at
    risk of THIS specific deadlock, but the blocking-read version would
    still have been bad practice there too (indefinite stall on a slow/
    dead peer). Only the brief connect + auth-keypair handshake itself
    remains a bounded blocking call, the same accepted shape
    auth.client.zenka.authenticate already uses for cube's own primary
    link connection.
  link_upgrade_perl_side: >
    the server-side (and a client-side helper) Perl implementation of
    the SAME protocol p-7-r.c speaks, confirmed wire-compatible:
    cube.cmd.link-upgrade returns literally "TRUE link-upgrade OK
    <pubkey_b32>" — the exact string p-7-r.c's negotiate_link_upgrade()
    parses via strstr(response_line,"OK "). Session state machine:
    state 1 (plaintext/authenticated, default, indefinite) -> state 2
    (protocol.protocol-7.link-upgrade.init generates an ephemeral
    Curve25519 keypair + capability list [ChaCha20-Poly1305 encryption;
    utf7/base32/base32-xz encoding]; base.handler.link-upgrade processes
    link-pub-key/link-confirm-encoding/link-complete, does REAL DH via
    Crypt::Curve25519::curve25519_shared_secret) -> state 3 (upgraded).
    A client-side Perl equivalent of p-7-r.c's C handshake also exists:
    protocol.protocol-7.link-upgrade.handshake($socket,$options).
    GAP FOUND, then CLOSED same day (2026-08-10, commit f7c65afb4, kimi
    K3 dispatch + live verification): base.handler.link-upgrade.response
    WAS a literal TODO placeholder, and p-7-r.c's enc_state.key was
    derived but never used — cipher was negotiated but never applied to
    payload. Real bug found in the process: client derived its nonce/KDF
    session_id from time(NULL), server used its own internal session id
    — they never matched, so decryption would have failed on every frame
    even with the cipher wired in. Both fixed: client now sends its
    session_id in link-complete; both ends derive
    sha256(dh_secret . session_id) and use matching per-direction nonce
    counters. Real hooks turned out to be
    protocol.protocol-7.encryption.init (state-3 setup) +
    src/base.handler.link-upgrade.{input,output} (new files) — NOT
    the .response placeholder, which is confirmed dead/unused code, left
    alone. Verified end-to-end against the live installed
    /usr/local/bin/p-7-r (reinstalled via the standard v7
    checksum-mismatch auto-recompile path): PROTOCOL_7_LINK_UPGRADE=yes
    returns correct real data over genuinely encrypted framing (wire
    capture confirmed zero plaintext command/reply bytes post-handshake),
    default plaintext path unaffected. link-upgrade now DOES give real
    transport encryption, not just a key-exchange primitive — this
    changes working_transport_precedent_p7r's calculus above: p-7-r with
    PROTOCOL_7_LINK_UPGRADE=yes is now a genuinely encrypted one-shot
    transport option for remote/, not just signed-plaintext.
  if_integration_chosen: >
    [ superseded by resolution above — kept for history ] users zenka
    would not reimplement packet handling — it would consume
    discover.orbital.known (or a discover.* accessor built for this
    purpose) and be the thing that PERSISTS it durably + exposes it via
    users.* commands + folds in host-system's own local records, rather
    than discover.* owning persistence itself. discover.* today looks
    memory-only (<discover.orbital.known>, no store-to-disk call seen in
    store_remote) — persistence is the gap users zenka would actually
    fill, not discovery itself.
  identity_checksum_choice: >
    RESOLVED (2026-08-10, per user + verified against live code): use
    BMW-L13 (base.chk-sum.bmw.L13-str / harmonize_L13) as the identity
    checksum for remote/{incoming,outgoing} records, not a fresh scheme.
    Precedent: discover.orbital.store_remote ALREADY keys known remote
    pubkeys by BMW-L13 today — this is not a new choice, it's reusing the
    exact mechanism the discovery layer already validates. BMW-L13 is not
    a truncated BMW512 — harmonize_L13 folds the 512-bit digest through
    the harmonic (division-by-13) AMOS7::Assert::Truth::true_int
    validator until the result passes, then base32-encodes to a fixed
    13-char string (~65 bits). It sits deliberately between AMOS7's
    7-char scheme (cheap, small-scope — fine for host-system/'s local
    users) and full BMW224/384 (geometric routing, currently
    local-module-scoped only, not a network mechanism — see
    project-checksum-addressing-implementation-survey.md). Net effect:
    host-system/ local records can stay on AMOS7 or a C25519-derived
    P7REF (base.p7ref.self shape); remote/{incoming,outgoing} identity —
    the actual multi-node discovery layer — uses BMW-L13, same as
    discover.orbital already does, rather than inventing a fourth
    checksum convention.
  remote_command_authorization: >
    per user (2026-08-11): a peer host's users.remote-* request needs to
    be authorized at the COMMAND level, not just the connection level —
    connection auth (p-7-r's `auth <user> <c25519_pubkey> <ed25519_sig>`
    handshake, working_transport_precedent_p7r above) proves who opened
    the link, it does not imply every command sent over it should be
    treated as equally privileged (e.g. users.value-get vs. a future
    users.value-delete). data/md/design/SIGNED-COMMAND-INTERFACE.md is
    the existing design for exactly this second layer — design-only
    today (base.cmd.extract_signature_footer, base.cmd.verify_signature,
    bin/p7-sign-cmd all unimplemented, confirmed via file check), but
    directly applicable: a users.remote-* handler that mutates
    (vs. reads) would be a natural security.cmd.require-signed candidate,
    verified via that doc's BMW384-digest + C25519-signature footer
    before the handler runs, with key_fp -> username resolution and a
    per-command authorized-keys list — the same authenticate-then-
    authorize split already used for admin_group/admin_user gating in
    coding.start.chmod_child / ncode.start.chmod_child. Layering, top to
    bottom: p-7-r/link-upgrade (transport-level signed connection,
    working today) -> SIGNED-COMMAND-INTERFACE.md (command-level
    signature, design-only) -> users.remote-* handler (not yet built).
    Not decided: which users.remote-* commands actually need
    require-signed vs signed-optional vs unsigned — flagging the
    mechanism exists and where it plugs in, not scoping phase 2's exact
    tier assignment.

## -----------------------------------------------------------------------
## central registration point — future scope, not phase 1/2
## -----------------------------------------------------------------------

central_registration_point: >
  per user (2026-08-10): host-system/ records are intended to eventually be
  the CENTRAL registration point for a broader class of per-user
  peripheral/personal data — not just what user-edit console's form edits,
  but things like personal email addresses and similar — with OTHER zenki
  resolving their own config FROM these records rather than duplicating it:
    - smtpd (src/smtpd.* — real, live mail archive/route/classify
      zenka today) would resolve a user's mail identity/routing data from
      here instead of its own separate config, once wired.
    - nameserv's PLANNED TXT/SRV record features (per user — confirmed not
      yet built: grepped src/nameserv.* for literal TXT/SRV record
      generation, found none; only coincidental substring hits like
      discover-nodes/p7ref_lookup) would generate DNS TXT/SRV records FROM
      user-zenka data (e.g. SPF/DKIM/MX-relevant fields tied to a user's
      registered email) rather than a separate nameserv-side config surface.
  this directly matches [[feedback-no-personal-data-in-repo-tree]]'s
  existing rule (never hardcode PII into repo-tracked files, use external
  dirs) — host-system/ under /etc/protocol-7/users/ already IS that
  external, non-repo location, so this isn't a new constraint, it's the
  natural consumer other zenki should have been resolving PII from all
  along instead of ad-hoc per-zenka config.
  reproducible-setup package: per user, host-system/'s eventual role is to
  BE (or be referenced by) a package from which an entire node's set-up can
  be recreated — echoes set-up zenka's already-real profile export/import
  machinery (set-up.cmd.export-config/create-profile/install-profile/
  fetch-zenka-config, whole-zenka-config JSON snapshots — see
  user-edit-console-zenka.yaml's related_precedent_set_up_zenka) at a
  different granularity (per-user field records, not whole-zenka-config
  blobs). Whether this means host-system/ becomes one of the things
  set-up's profile export captures, or a parallel reproducibility
  mechanism, is NOT decided — flagging the connection so a future
  reproducible-setup design doesn't start from scratch or duplicate
  set-up's existing profile machinery.
  status: vision-level, not scoped as phase 1 or phase 2 work. Recorded
  here so the eventual "other zenki consume user records" and "node
  recreation package" designs start from this doc's existing storage
  layout/identity decisions rather than reinventing them.

## -----------------------------------------------------------------------
## key authority
## -----------------------------------------------------------------------

key_authority:
  role: >
    per user direction: when a local zenka wants to contact a user or
    another zenka, it asks the users zenka to acquire/resolve the
    correct key, and that key feeds routing directly.
  precedent: >
    discover.orbital.store_remote already decodes and stores a pubkey
    per known remote host (see discovery_integration above) — if
    discovery integration is chosen, key authority is largely "expose
    that lookup as a users.* command, backed by host-system/ for local
    users and remote/ for discovered ones," not new key-handling logic.
  relationship_to_crypt_C25519: >
    crypt.C25519.* / ~/.n/user-keys remain the actual key material and
    signing operations — users zenka is an AUTHORITY/DIRECTORY over
    which key belongs to which user/host for routing purposes, not a
    replacement for crypt.C25519. Needs a clear boundary statement once
    written: users zenka resolves "which key", crypt.C25519 does
    "operations with a key".

## -----------------------------------------------------------------------
## external source hooks — key generation, cross-zenka data lookup
## -----------------------------------------------------------------------

external_source_hooks:
  requirement: >
    per user direction: users zenka needs hooks out to external sources —
    key generation (when a lookup misses and no key exists yet for a
    local host-system user) and data lookup from OTHER zenki (unnamed so
    far — could overlap with discovery_integration's discover.* question
    above, or be a distinct need; not specified beyond "other zenki").
    SUPERSEDED IN PART: the key-generation half of this framing was
    walked back — it is NOT an external/cross-zenka hook at all, see
    key_generation_CORRECTED directly below. Only the data-lookup half
    of this requirement still stands as written.
  key_generation_CORRECTED: >
    CORRECTED (2026-08-11, per user — the cross-zenka framing below was
    wrong for this half): key generation is NOT a cross-zenka operation.
    users zenka should simply load crypt.C25519 directly into its own
    modules.load, exactly as the keys zenka's start file already does
    (cfg/zenki/keys/zenka.v7:8, `modules.load = crypt.C25519
    terminal keys`) — plain in-process module loading, nothing
    routable. crypt.C25519 already has a complete "ensure key
    loaded-or-generated" interface, just needs enabling: shared-params
    already sets `crypt.C25519.autocreate-user-key = yes`
    (cfg/shared-params:22), and crypt.C25519.post_init
    (lines ~44-61) checks on every init whether the private/public key
    files exist for the current key user and, if not, auto-generates
    and writes them via crypt.C25519.gen_keys + .write_keys — entirely
    during that zenka's own init lifecycle, no command, no deferred
    reply, no cross-process call. The earlier draft of this section
    (previously proposing a new crypt.C25519.cmd.generate-key routable
    command) was solving a problem that doesn't exist for this half —
    it only applied to the OTHER, still-genuinely-unnamed half of this
    section: data lookup from other zenki.
  autocreated_key_encryption_caveat: >
    NOTED (2026-08-11, per user), verified against live code:
    crypt.C25519.post_init's autocreate path calls
    <[crypt.C25519.gen_keys]> with no passphrase argument, and
    crypt.C25519.write_keys (lines ~81-132) only encrypts the secret/
    private key at rest (AMOS7::Twofish, '.:' prefix) when an
    encryption key/passphrase IS present — with none, it writes the
    UNENCRYPTED form ('U:' prefix). So autocreated keys (both the
    DEFAULT tier below and any future EXPANSION-tier generation) are
    unencrypted at rest by default, protected only by unix file
    permissions (~/.n/user-keys/, 0700-class), not a passphrase. Per
    user: this still has real value — once TOFU-validated, a stable
    signing key an attacker would need actual filesystem access to
    steal is meaningfully safer than not signing at all, and it's
    exactly the right shape for cross-host request signing
    (working_transport_precedent_p7r's `auth <user> <pubkey> <sig>`
    handshake, users.remote-* per transport_implementation_choice) —
    those need non-interactive signing with no human present to type a
    passphrase, so passphrase-protected keys would be the wrong choice
    there regardless. Not a defect to fix, just a property to keep in
    mind: autocreated keys trade passphrase-protection for
    availability/non-interactivity, deliberately.
    Encrypted-key-plus-prompt is NOT missing functionality, per user —
    it already exists: crypt.C25519.load_keypair (lines ~57-79, 137-149)
    has a real interactive passphrase-prompt flow via AMOS7::TERM::
    read_password_single/read_password_repeated, with retry-on-error
    re-prompting, used for human-facing console contexts (e.g. keys
    zenka). It's console/terminal-bound (needs AMOS7::TERM), which is
    exactly why the non-interactive post_init autocreate path can't use
    it and correctly falls back to unencrypted — two different key-
    protection modes for two different contexts (interactive console
    identity vs. unattended daemon/signing identity), not one
    unfinished feature.
  v7_mediated_trust_chain_OUT_OF_SCOPE: >
    RAISED then EXPLICITLY DEFERRED (2026-08-11, per user): a v7-spawn-
    time trust-chain mechanism for zenka identity keys (extending the
    real, existing exclusive stdin channel v7 already uses for cube.key
    / base.auth.set_v7_key — see cfg/zenki/*/start.cfg,
    src/base.auth.set_v7_key, base.cmd.verify-instance) does NOT
    belong in this doc — it's system-wide (every v7-spawned zenka), not
    users-zenka-specific. Per user: postpone until different topology-
    based key types exist; likely becomes safer/more feasible
    specifically for zenki that DON'T need their own key-generation
    ability at all (v7 provisions instead). Belongs in a future v7/
    zenka-lifecycle or key-topology design doc, not here — recorded as
    a pointer only so it isn't lost, not designed further in this doc.
  key_ownership_model: >
    RESOLVED (2026-08-11, per user), two tiers:
    DEFAULT — with default parameters, users zenka (running as the
    protocol-7 unix user, v7-managed) resolves its OWN identity key via
    the plain autocreate flow above, which lands on protocol-7.base
    (confirmed live: `USER=protocol-7 Protocol-7 keys list` shows
    exactly global-root + protocol-7.base under that user, both
    no-r.perms) — this is users zenka's own self-identity, nothing
    cross-user. crypt.C25519.get_usr_keys_dir($requested_user) DOES
    support resolving an arbitrary OTHER user's key directory by name
    (falls back through base.get_homedir), but that's path resolution
    only — actual read/write there needs real OS permission on that
    directory, which protocol-7 does not have on e.g. taeki's
    /home/taeki/.n/user-keys/ under normal permissions (no-r.perms
    precedent above suggests these are deliberately locked down even
    cross-user by default).
    EXPANSION (explicitly wanted, not default) — users zenka generating
    keys ON BEHALF OF other host-system users, for remote-host
    provisioning / desktop-recreation scenarios (ties directly into
    central_registration_point's reproducible-setup-package vision
    above, and set-up zenka's existing profile export/import
    machinery) — per user: build this as a cryptographically secured
    expansion using the SAME admin-group chmod_child-style privileged-
    child escalation already found in coding.start.chmod_child /
    ncode.start.chmod_child (fork requires root, immediately drops to
    admin_user + admin_group, verifies target-path ownership before
    ANY write, tiny fixed request protocol over a pipe — never a
    general privileged shell), gated additionally behind
    discovery_integration.remote_command_authorization's
    SIGNED-COMMAND-INTERFACE.md-style command signature (this is
    exactly the kind of mutating, security-sensitive operation that
    section flagged as a require-signed candidate, not signed-optional
    or unsigned). NOT yet designed: the exact chmod_child-equivalent
    protocol verbs for key generation specifically (create/gen key file
    under an ownership-verified target dir, mirroring the existing
    gwd/create/mkdir verb set) — flagging the shape, not the full spec.
    Mirror on the user-edit side: per user, user-edit zenka (running as
    the human operator, e.g. taeki — see runtime_surface /
    user_edit_relationship) would by the same plain autocreate flow
    default to loading taeki.base, not protocol-7.base — same
    mechanism as users zenka's own DEFAULT tier above, just resolved
    under a different running-as user. No special-casing needed between
    the two zenki; the running-as user is what determines <user>.base,
    consistently.
  async_design: >
    per user direction, correctly: cross-zenka calls (the data-lookup
    half specifically — key generation no longer needs this, see
    key_generation_CORRECTED above) need a real async design, not a
    synchronous call. The right mechanism already exists and is used
    elsewhere in this codebase — do NOT invent a new hook-registry
    abstraction for this. FALSE START avoided during this design: was
    initially going to point at base.handler.hooks.register/unregister,
    but that's session I/O interception (input-pre/output/command hooks
    on a connection) — a completely different concern, wrong fit,
    corrected before it went further.
    The actual precedent: `{ mode => 'deferred' }` + `base.callback.
    cmd_reply`, exactly as mpv.cmd.quit / mpv.snapshot.cmd_reply already
    do — a .cmd. handler returns deferred immediately (stashing the
    caller's reply_id), does async work, and calls
    `<[base.callback.cmd_reply]>->($reply_id, {mode=>..., data=>...})`
    once that work resolves, to actually deliver the reply.
    For users zenka's data-lookup hook this nests one level deeper: a
    users.* command that needs data looked up from another zenka
    returns deferred to ITS caller, issues a routed command to that
    external zenka (not yet named), and on receiving THAT zenka's
    reply (via its own <zenka>.handler.*_reply-style callback, same
    shape as mpv.snapshot.cmd_reply), calls base.callback.cmd_reply to
    complete the ORIGINAL deferred command back to whoever asked users.*
    in the first place. Two hops, same primitive reused at each hop —
    not two different mechanisms.
  existing_C25519_cmd_surface_quality_finding: >
    FOUND 2026-08-11, reviewed with user: crypt.C25519.cmd.
    register-master-key / .set-client-key / .clear-zenka-key have no
    caller-identity check in-module (register-master-key accepts any
    caller-supplied <username> <pubkey> pair and registers it as that
    username's master trust anchor; no access.zenki grep hit gates any
    of the three by name anywhere in cfg/zenki/*/access.*,
    and crypt.C25519 loads broadly across most zenki's
    subroutines.load-early). register-master-key's file also carries a
    broken/placeholder signature footer (literal "XYZABC123DEFGH456...",
    "TEST1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ..." text where a real
    AMOS7 signature belongs) ahead of what looks like an actual one.
    Per user: this reads as early-stage/prototype-quality code (likely
    LLM-scaffolded, never cleaned up) rather than a deliberately shipped
    security hole — NOT currently wired into anything live, so nothing
    breaks by changing it freely. NOTE: this no longer blocks or
    motivates anything in THIS doc per key_generation_CORRECTED above
    (no new crypt.C25519.cmd.* command is needed here at all) — it's
    now purely its own standalone cleanup item, worth its own todo so
    it isn't
    forgotten before something DOES start calling them.
  data_lookup_zenki_RESOLVED: >
    RESOLVED (2026-08-11, per user): udev and fs are the concrete named
    zenki — external storage (e.g. a USB key) detected by udev counts
    as exactly this kind of "data lookup from other zenki." Grounds a
    thread from earlier this session that was discussed but never
    actually written down until now:
      - udev zenka (cfg/zenki/udev/, src/udev.*) is a
        real, working rule/action mechanism over `udevadm monitor`
        output — confirmed live via cfg/zenki/udev/
        rules-set-up.U2F-tokens, which matches vendor/model IDs on
        device insert/remove and fires `net.cmd`-ROUTED commands
        (currently `notify.message`, but the action slot accepts any
        routed command) — this is the real hook point, not a pub/sub
        bus other zenki subscribe to.
      - fs zenka (cfg/zenki/fs/, src/fs.*) is a thin
        Sys::Filesystem wrapper: fs.get_filesystems (list mounted/
        unmounted), fs.cmd.mount/.re-mount/.unmount/.is_mounted. No
        2FA-specific detection lives here (that's udev's rule-matching
        job) — fs only handles the mount/unmount step once a device
        path is known.
    multi_target_storage (new, follows from the above): a udev rule's
    `inserted` action could route to a new users.cmd.register-target
    (or similar) instead of/alongside notify.message, which would do a
    merge-safe base.path.register_keywords call (NOTE:
    register_keywords REPLACES the whole keyword table wholesale per
    its own implementation — src/base.path.register_keywords:56 —
    so a dynamic add here MUST read-existing -> merge -> write-back;
    every current caller only calls it once at init with a static set,
    so this would be the first read-modify-write caller) to add e.g.
    USERS_MOBILE for a detected external storage path, with fs handling
    the actual mount step udev's action would trigger first. Concrete
    driver for the earlier-flagged "user-edit and users zenka would be
    multi-target, able to register a mobile storage" idea. NOT yet
    designed: the exact register-target command shape, or whether
    host-system/ records or user-edit's own outbox would be what
    actually gets targeted at a mobile path once registered — flagging
    the mechanism and the concrete udev/fs precedent, not a full spec.

## -----------------------------------------------------------------------
## relationship to user-edit console (JUE)
## -----------------------------------------------------------------------

user_edit_relationship: >
  Per user-edit-console-zenka.yaml's users_zenka_relationship (already
  resolved): user-edit has no storage of its own. It calls a users.*
  command surface — get(user) to populate form defaults, set(user,
  values) on submit. That command surface is this doc's to define; JUE
  only needs the names/args once they exist. host-system/ is exactly
  what those get/set calls read and write.

open_questions:
  - a DIFFERENT, still-planned `settings` zenka is intended for later —
    the name was freed by set-up's rename (commit 089844a94, "'set-up'
    <-- 'settings'"; set-up is real installer-profile machinery,
    unrelated in granularity to this doc's storage). whether that future
    `settings` zenka subsumes THIS doc's host-system/ canonical storage
    or is scoped to something else entirely is undecided — see
    user-edit-console-zenka.yaml's related_precedent_set_up_zenka for
    the full note. do not build storage_layout against either
    assumption; reconcile explicitly once a `settings` design exists.
  - RESOLVED [ kept for history ] — discovery_integration's core question
    [ integrate with discover.* vs separate ] — answered in
    discovery_integration.resolution — two layers, discover.orbital.known
    stays a host-presence substrate, users' remote/ is a separate
    application-layer request/response to a peer users zenka. Transport
    for that is likewise resolved in transport_implementation_choice
    (native Perl, p-7-r-compatible handshake, no shell-out).
  - RESOLVED [ kept for history ] — remote/incoming and remote/outgoing,
    full records or sync requests, and etc_P7 vs var_P7 — answered in
    storage_layout.not_yet_decided (lightweight sync/announce requests,
    no record-content duplication) and storage_layout.var_vs_etc_tier
    (var_P7 default tier, etc_P7 override tier for permanent peer links).
  - RESOLVED IN IMPLEMENTATION — record format for host-system/,
    phase 1 shipped as one YAML file per user at [USERS_HOST]/<user>.yaml,
    read/written via format.yaml.load_keyword_path — see
    src/users.cmd.value-get / .value-set / .value-all and
    src/users.init_code's USERS_HOST keyword registration.
    RESOLVED IN IMPLEMENTATION (2026-08-11): the remaining per-field
    ENVELOPE schema (as opposed to the still-intentionally-open settings
    payload inside it) has shipped — src/users.record.build /
    .validate wrap value-set/value-get's arbitrary JSON fields in a
    name/checksum/timestamp/metadata.updated_at/fields envelope,
    checksum = AMOS7(7-char) of "host-system:<name>" (name-derived only,
    no key-material read), live-verified via p7c against the running
    zenka (checksum/timestamp stable across updates, malformed/legacy
    records cleanly rejected by value-get, value-all unaffected).
  - v7-managed lifecycle: RESOLVED (2026-08-11, per user) — on-demand
    stays the default, including for development and low-memory nodes
    (e.g. "atom"). An always-on override is expected later specifically
    for nodes where low latency matters and resources aren't a
    constraint — per user, a currently-uninstalled fanless desktop node
    (16GB RAM, 1TB SSD) sitting behind them is the concrete case this
    will apply to. Per CLAUDE.md's existing deployment-option list
    (Always-on: cfg/zenki/v7/start-set-up.base; On-demand:
    start.on-demand = 1 in that node's own start.cfg), this is a
    PER-NODE CONFIG CHOICE already supported by the existing v7
    lifecycle mechanism, not something requiring new code in users
    zenka itself. CORRECTED (2026-08-11, caught mid-session): this
    already exists — cfg/zenki/users/start.cfg landed
    in df2e83d85 (phase-1 CRUD skeleton commit), start.on-demand=1,
    4200s idle timeout, matching the calc/image2html precedent. An
    earlier draft of this note incorrectly claimed no such file existed
    yet and briefly overwrote it with a near-duplicate before the
    mistake was caught and reverted (git checkout, no lasting change) —
    nothing to do here; whichever node wants always-on later adds its
    own override (unset start.on-demand, or list in that node's
    start-set-up.base), on-demand nodes need no changes at all.

