## Risk & Mitigation

### Risk: Phase 2 scope creep (filesystem is complex)
**Mitigation**: Split into minimal viable checksum-FS + phased indexer upgrade

### Risk: Hardware issues during Phase 5 (corrupted drives)
**Mitigation**: Archive recovered data first, verify checksums, deploy recovery features during integration

### Risk: Linux transition stalls (configuration complexity)
**Mitigation**: Use Phase 6 installers as "target specification" - drives Phase 2 design decisions

### Risk: Cubic topology mapping assumptions wrong
**Mitigation**: Use v13.7.1 visualization as real-time validation tool during Phase 4

