## Vision Summary

Convert 24-year data loss consequences into preventative infrastructure.
Build resilient, reproducible system that makes accidental data loss technically impossible.
Focus on: reproducibility → distributed addressable storage → multi-node network deployment → automated resilience.

---

## Phase Overview & Dependencies

### Phase 1: Session Cleanup & Immediate Debugging
**Status**: Ready to start
**Duration**: 2-3 days
**Blocker**: None
**Enables**: Phase 2
**Component**: `phase-1-session-cleanup-nshell-debugging.yaml`

Critical path work:
- Archive visualization work (clears session)
- Resume ctrl+o nshell debugging (second Claude Code shell)
- Lock down nshell debug interface for ctrl+o functionality

### Phase 2: Indexer & Checksum Filesystem Foundation
**Status**: Pending Phase 1 completion
**Duration**: 1-2 weeks
**Blocker**: Phase 1 (nshell debug interface)
**Enables**: Phase 3, Phase 4
**Component**: `phase-2-indexer-checksum-filesystem.yaml`

Infrastructure cornerstone:
- Upgrade indexer zenka for rapid file serving
- Implement checksum-based file system structure
- Enable LLM-based file analysis and batch processing
- Build foundation for reproducible file handling across hosts

### Phase 3: Coding Zenka Integration & LLM Adaptation
**Status**: Pending Phase 2
**Duration**: 1-2 weeks
**Blocker**: Phase 2 (filesystem interface)
**Enables**: Phase 4, Phase 5
**Component**: `phase-3-coding-zenka-filesystem-integration.yaml`

Hybrid local/remote capability:
- Coding zenka adapter to checksum filesystem
- Source data access via distributed storage
- Copy-on-write output handling
- Local LLM feature completion & testing

### Phase 4: Cubic Space Network Mapping
**Status**: Pending Phase 2
**Duration**: 1-2 weeks
**Blocker**: Phase 2 (checksum-based paths addressable)
**Enables**: Phase 5, Phase 6
**Component**: `phase-4-cubic-topology-network-mapping.yaml`

Network becomes distributed topology:
- Map checksum-based filesystem onto cubic space coordinates
- Achieve addressable grid for Protocol-7 nodes
- Enable routing across topological structure
- Validate visualization against actual topology

### Phase 5: Multi-Node Deployment & Repair
**Status**: Pending Phase 4
**Duration**: 2-3 weeks
**Blocker**: Phase 4 (topology mapping working)
**Enables**: Phase 6
**Component**: `phase-5-multinode-deployment.yaml`

Transcend single-host limitations:
- Add Raspberry Pi node
- Add fanless ATOM desktop/server host
- Repair & integrate 2 corrupted/crashed laptops
- Establish inter-node communication via cubic topology
- Test distributed resilience mechanisms

### Phase 6: Reproducible Desktop System & Installers
**Status**: Pending Phase 5
**Duration**: 1-2 weeks
**Blocker**: Phase 5 (multi-node working)
**Component**: `phase-6-reproducible-desktop-system.yaml`

Turn ephemeral hosts into reproducible infrastructure:
- Create automated installers for fully configured Protocol-7 desktop
- Linux base system + all configuration
- Data migration tooling for existing nodes
- Desktop environment hardening for reproducibility

