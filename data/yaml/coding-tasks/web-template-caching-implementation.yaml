## Notes & Considerations

### Why This Approach?

1. **Documentation First**: Clear spec prevents refactoring mid-way
2. **Live Testing**: Validate against running v7 zenka, not assumptions
3. **Modular Implementation**: Each module independent, can test separately
4. **Namespace Flexible**: Can use `ncode replace all` later if needed
5. **Feature Complete**: All 3 modules + optional integration = full system

### What Could Go Wrong (Mitigations)

| Risk | Mitigation |
|------|-----------|
| Module syntax errors | Test each immediately after creating |
| Cache key conflicts | Use consistent format: "$vhost:$path" |
| TTL logic bugs | Test with short TTL (2-5 seconds) |
| Integration breaks existing code | Keep changes minimal, test static files still work |
| Storage structure issues | Follow existing patterns (web.menu_generator) |

### Future Optimizations (Post-Implementation)

1. Persistent cache (file-based like weather.parent.cache)
2. Cache statistics and monitoring
3. Automatic cache invalidation on file changes
4. Cache warming (pre-render popular templates)
5. Distributed caching for multi-instance deployments

