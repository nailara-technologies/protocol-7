## PHASE 5: Optional - HTTP Handler Integration

phase_5:
  name: "HTTP Handler Integration (Optional, Future Session)"
  tokens_allocated: 0.5
  duration: "30 minutes"
  
  description: |
    This phase is OPTIONAL and can be deferred to a future session.
    The modules work standalone and can be tested independently.
    Integration into httpd.http_get provides the final piece but is not
    required for modules to function.

  tasks:
    - name: "Integrate Router into httpd.http_get or httpd.request_handler"
      tokens: 0.5
      actions:
        - "Locate: httpd.http_get or httpd.request_handler module"
        - "Add: Early call to httpsd.route_template_request"
        - "Add: Control flow based on route.type (template/api/acme/static)"
        - "Call: httpd.process_template for template routes"
        - "Test: Existing static file handling still works"
        - "Commit: Integration changes separately"
      
      pseudocode: |
        # In httpd.http_get:
        
        my $route = <[httpsd.route_template_request]>>->($method, $uri, $vhost, $session_id);
        
        if ($route->{type} eq 'template') {
            return <[httpd.process_template]->($route->{handler_args}{session_id},
                                               $route->{handler_args}{template_path});
        }
        elsif ($route->{type} eq 'api') {
            # Route to API handler
            return <[base.protocol-7.command.send.local]>->(...);
        }
        elsif ($route->{type} eq 'acme') {
            # Route to ACME handler
            return <[acme.http.handler]>->(...);
        }
        else {
            # static file - existing logic
            return <[httpd.file_transfer]>->(...);
        }
      
      success_criteria:
        - "HTTP requests routed correctly"
        - "Template requests processed via new system"
        - "Static file serving unchanged"
        - "Existing functionality not broken"

