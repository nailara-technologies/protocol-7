## Testing Checklist

### Unit Tests (Per Module)
```
[ ] web.scan_content_directories
    [ ] Detects templates in vhost subdirectories
    [ ] Detects templates in vhost root
    [ ] Detects templates in global directory
    [ ] Returns correct structure with mtime
    [ ] Handles missing templates (has_template=0)
    [ ] Caches results
    [ ] Invalidates cache on mtime change

[ ] web.template_cache.get
    [ ] Returns content for valid non-expired entry
    [ ] Returns undef for expired entry
    [ ] Removes expired entry automatically
    [ ] Updates cache_hits metric
    [ ] Handles missing key gracefully

[ ] web.template_cache.set
    [ ] Stores content successfully
    [ ] Returns 1 on success
    [ ] Returns 0 if content exceeds max size
    [ ] Sets correct TTL
    [ ] Updates templates_cached metric
    [ ] Handles edge cases (empty content, unicode)

[ ] httpsd.route_template_request
    [ ] Routes ACME challenges correctly
    [ ] Routes API endpoints correctly
    [ ] Detects template requests
    [ ] Falls back to static files
    [ ] Normalizes paths correctly
    [ ] Caches routing decisions
    [ ] Returns correct structure
```

### Integration Tests
```
[ ] Full workflow: Request → Route → Template → Cache
    [ ] Request comes in
    [ ] Router determines it's a template
    [ ] httpd.process_template called
    [ ] web.process_template_recursive called
    [ ] Cache.get checks (miss on first)
    [ ] Template processed
    [ ] Cache.set stores result
    [ ] Second request hits cache
    [ ] TTL expiration clears cache

[ ] Fallback chain working
    [ ] Vhost-specific template found first
    [ ] Global template found second
    [ ] Static file served when no template

[ ] Cache invalidation
    [ ] Template file updated
    [ ] Old cache still served (until TTL expires)
    [ ] Manual refresh clears cache
    [ ] New render on next request
```

### Performance Validation
```
[ ] First request (cache miss): baseline time
[ ] Second request (cache hit): <5% of first request time
[ ] Route caching: routing decision under 1ms
[ ] Content scanning: <100ms for typical vhost
```

