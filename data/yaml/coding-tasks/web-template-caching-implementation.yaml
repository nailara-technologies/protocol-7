## PHASE 2: Module Implementation

phase_2:
  name: "Core Module Implementation"
  tokens_allocated: 2.5
  duration: "1-1.5 hours"
  
  tasks:
    - name: "Implement: web.scan_content_directories"
      tokens: 0.75
      actions:
        - "Create: modules/web.scan_content_directories"
        - "Function: Recursively scan /var/httpd/{vhost}/ for template candidates"
        - "Return: Hash of { path => { has_template, template_path, mtime, ... } }"
        - "Store: Results in $data{'web.content_index'} with mtime tracking"
        - "Pattern: Use File::Find or simple directory recursion"
        - "Caching: Cache by vhost, invalidate on mtime change or manual refresh"
      
      pseudocode: |
        sub scan_content_directories {
            my ($base_dir, $vhost) = @_;
            
            # Build index from /var/httpd/{vhost}/
            my $index = {};
            
            # For each file, check if template exists
            foreach my $file (@files) {
                $index->{$file} = {
                    path => $file,
                    has_template => (check if _templates/ version exists),
                    template_path => (if exists),
                    mtime => (file modification time),
                };
            }
            
            # Store in data structure
            <web.content_index> = $index;
            
            return $index;
        }
      
      success_criteria:
        - "Module loads without errors"
        - "Detects templates in all 3 hierarchy levels"
        - "Returns correct structure: { path => { has_template, template_path, ... } }"
        - "Stores results in $data{'web.content_index'}"
        - "Handles multiple vhosts correctly"
      
      testing:
        - "Create test directory: /tmp/test_vhost/ with subdirs and _templates/"
        - "Call module with test dir"
        - "Verify results match expected structure"
        - "Test with missing templates (negative case)"

    - name: "Implement: web.template_cache.get"
      tokens: 0.5
      actions:
        - "Create: modules/web.template_cache.get"
        - "Function: Retrieve cached template by key"
        - "Return: Content if exists and not expired, else undef"
        - "Check: Timestamp-based TTL expiration"
        - "Remove: Expired entries from cache automatically"
        - "Pattern: Similar to weather.parent.cache.read_cache_data"
      
      pseudocode: |
        sub template_cache_get {
            my $cache_key = shift;
            
            my $entry = <web.template_cache>{$cache_key};
            return undef unless defined $entry;
            
            my $age = time - $entry->{timestamp};
            if ($age > $entry->{ttl}) {
                delete <web.template_cache>{$cache_key};  # Expired
                return undef;
            }
            
            <web.metrics>{cache_hits}++;
            return $entry->{content};
        }
      
      success_criteria:
        - "Module loads without errors"
        - "Returns content for valid, non-expired entries"
        - "Returns undef for expired entries"
        - "Removes expired entries automatically"
        - "Updates metrics on cache hit"
      
      testing:
        - "Store test content with 2-second TTL"
        - "Retrieve immediately (should hit)"
        - "Wait 3 seconds and retrieve (should miss/expire)"
        - "Verify entry removed from cache"

    - name: "Implement: web.template_cache.set"
      tokens: 0.5
      actions:
        - "Create: modules/web.template_cache.set"
        - "Function: Store rendered template with TTL"
        - "Return: 1 on success, 0 if size exceeded"
        - "Check: Size limit against <web.cfg.template_max_size>"
        - "Store: { content, timestamp, ttl, size } structure"
        - "Update: Metrics (templates_cached increment)"
      
      pseudocode: |
        sub template_cache_set {
            my ($cache_key, $content, $ttl) = @_;
            
            my $max_size = <web.cfg.template_max_size>;
            if (length($content) > $max_size) {
                return 0;
            }
            
            <web.template_cache>{$cache_key} = {
                content   => $content,
                timestamp => time(),
                ttl       => $ttl // <web.cfg.cache_ttl>,
                size      => length($content),
            };
            
            <web.metrics>{templates_cached}++;
            return 1;
        }
      
      success_criteria:
        - "Module loads without errors"
        - "Stores content with correct structure"
        - "Returns 1 on successful store"
        - "Returns 0 if content exceeds max size"
        - "Updates metrics correctly"
      
      testing:
        - "Store valid content (should return 1)"
        - "Try to store content larger than limit (should return 0)"
        - "Retrieve stored content (should be exact match)"
        - "Verify metrics incremented"

    - name: "Implement: httpsd.route_template_request"
      tokens: 1
      actions:
        - "Create: modules/httpsd.route_template_request"
        - "Function: Route HTTP request to appropriate handler"
        - "Routes: ACME → API → Template → Static (priority order)"
        - "Normalize: Remove query strings, fragments, double slashes"
        - "Template check: Use vhost_template_resolver or content_index"
        - "Caching: Cache routing decisions with TTL"
        - "Return: { type, path, handler, handler_args, reason, cache_ttl }"
      
      pseudocode: |
        sub route_template_request {
            my ($method, $uri, $vhost, $session_id) = @_;
            
            # Normalize URI
            my $path = normalize_path($uri);
            
            # Check cache
            my $cached = check_route_cache($vhost, $path);
            return { $cached->{route}, cached => 1 } if $cached;
            
            # Priority 1: ACME Challenge
            if ($path =~ m|^/.well-known/acme-challenge/|) {
                return { type => 'acme', path => $path, ... };
            }
            
            # Priority 2: API
            if ($path =~ m|^/api/| or $path =~ m|^/webhook/|) {
                return { type => 'api', path => $path, ... };
            }
            
            # Priority 3: Check for template
            my $template_path = <[httpd.vhost_template_resolver]>->($vhost, $path, 'tmpl');
            if (defined $template_path) {
                return { type => 'template', path => $path, template_path => $template_path, ... };
            }
            
            # Priority 4: Static file (default)
            return { type => 'static', path => $path, ... };
        }
      
      success_criteria:
        - "Module loads without errors"
        - "Routes ACME challenges correctly"
        - "Routes API endpoints correctly"
        - "Detects templates via resolver"
        - "Falls back to static for non-template files"
        - "Returns correct structure with all required fields"
        - "Caching works (same request returns cached result)"
      
      testing:
        - "Route ACME challenge: /.well-known/acme-challenge/token123"
        - "Route API: /api/users, /webhook/github"
        - "Route template: /blog/post.html (if template exists)"
        - "Route static: /static/style.css, /index.html"
        - "Test path normalization: //path//, /path/?, /path#anchor"
        - "Verify caching: call twice, check cached=1 on second"

