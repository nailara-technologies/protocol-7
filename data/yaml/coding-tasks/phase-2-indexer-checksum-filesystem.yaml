### Group B: Indexer Zenka Upgrade
**Priority**: HIGH
**Status**: Pending Phase 1 (or parallel with A1 design)
**Effort**: 20-30 hours
**Enables**: Phase 3, Phase 4
**Dependencies**: Group A checkpoint (after A2 minimally)

#### Task B1: Analyze current indexer zenka capabilities & limitations
**Status**: pending
**Effort**: 2-3 hours
**Blocker**: None (analysis task)

Description:
  Understand current state of indexer zenka before upgrading.
  Identify gaps between current and desired capabilities.

Steps:
  1. Review indexer zenka configuration:
     - cfg/zenki/indexer/start
     - Understand what it currently indexes
     - What optimization exists already?

  2. Review indexer modules:
     - src/indexer.* (all indexer-specific modules)
     - Understand indexing algorithm
     - Identify bottlenecks

  3. Review indexer performance:
     - How fast does current indexer search/retrieve?
     - What scale has it been tested at?
     - Memory/CPU profile?

  4. Identify desired capabilities:
     - Integration with checksum-based filesystem
     - Support for rapid file serving
     - Batch file analysis support (for LLM)
     - Cross-node indexing

  5. Document gap analysis:
     - What new capabilities needed?
     - What performance improvements needed?
     - What API changes needed?

Acceptance criteria:
  - Current indexer capabilities documented
  - Performance profile established
  - Gap analysis completed
  - Upgrade strategy planned

#### Task B2: Design indexer upgrade for checksum-filesystem integration
**Status**: pending (after B1 and A1)
**Effort**: 3-4 hours
**Blocker**: Tasks B1 and A1 completion
**Dependencies**: Task B1, Task A1

Description:
  Design how indexer will work with checksum-based filesystem.

Key design decisions:
  1. Index structure
     - Should index be hierarchical like filesystem?
     - Should index be flat key-value?
     - Should index include metadata?

  2. Update strategy
     - How often to update index when files change?
     - Immediate updates or periodic batch?
     - Transactional consistency requirements?

  3. Search capabilities
     - Search by filename?
     - Search by content (checksums)?
     - Search by metadata?
     - Full-text search for file contents?

  4. Network capabilities
     - Should indexer know about files on other nodes?
     - How to discover new nodes' files?
     - How to handle index conflicts?

  5. Performance
     - Target latency for file lookup?
     - Target throughput for batch analysis?
     - Caching strategy?

Steps:
  1. Document new index structure
  2. Specify update protocol (how files signal index changes)
  3. Define search API
  4. Plan for network-aware indexing
  5. Define performance targets

Acceptance criteria:
  - New indexer design documented
  - Integration with checksum-FS clear
  - API specification written
  - Network discovery strategy planned

#### Task B3: Implement indexer upgrade
**Status**: pending (after B2)
**Effort**: 15-20 hours
**Blocker**: Task B2 completion
**Dependencies**: Task B2

Description:
  Implement the upgraded indexer based on design.

New/upgraded modules:
  1. indexer.checksum-fs-adapter
     - Bridge between indexer and checksum-FS
     - Listen for file changes
     - Update index accordingly

  2. indexer.search-api (upgrade existing)
     - Support checksum-based searches
     - Support metadata-based searches
     - Support batch queries (for LLM analysis)

  3. indexer.network-discovery (new)
     - Discover files on remote nodes
     - Maintain network-aware index
     - Handle index synchronization

  4. indexer.performance-optimization (new)
     - Caching layer for frequent searches
     - Query result streaming
     - Batch operation support

Steps:
  1. Implement checksum-FS adapter
     - Test with small number of files
     - Verify index stays in sync

  2. Upgrade search API
     - Test new query types
     - Verify backward compatibility

  3. Implement network discovery
     - Test with multiple nodes (simulated first)
     - Test index consistency

  4. Optimize performance
     - Profile with large file counts
     - Implement caching
     - Optimize hot paths

  5. Create integration tests
     - Test full workflow: add file → index → search
     - Test cross-node scenarios (simulated)
     - Test consistency under load

Acceptance criteria:
  - All new modules implemented
  - Integration tests passing
  - Performance targets met
  - Backward compatibility maintained
  - Ready for Phase 3 integration

