### Group C: LLM File Analysis Integration
**Priority**: HIGH (parallel with Groups A & B)
**Status**: Pending Phase 1 or parallel
**Effort**: 10-15 hours
**Enables**: Phase 3 (coding zenka uses this for analysis)
**Dependencies**: Group A (preferably A2), Group B (preferably B3)

#### Task C1: Design LLM-based file analysis system
**Status**: pending
**Effort**: 2-3 hours
**Blocker**: None (design task)

Description:
  Design how LLMs will analyze files in batch mode.

Key capabilities needed:
  1. Batch file selection
     - Select files by pattern (*.yaml, *.md, etc.)
     - Select files by directory
     - Select files by metadata (date, size, etc.)
     - Select files by checksum patterns

  2. Analysis tasks
     - Summarization (what does this file do?)
     - Deduplication detection (is this copy of X?)
     - Quality assessment (is this well-structured?)
     - Relationship mapping (what files reference this?)
     - Paragraph-level extraction (for what-AI-thinks)

  3. LLM integration
     - Which model(s) for which analysis?
     - How to feed file content to LLM?
     - How to handle very large files (streaming? chunking?)
     - How to aggregate results across multiple files?

  4. Result storage
     - Where to store analysis results?
     - Should results be checksum-based indexed?
     - How to update when file changes?
     - How to share results across nodes?

Steps:
  1. Document analysis task types
  2. Design batch selection interface
  3. Specify LLM integration points
  4. Plan for large file handling
  5. Design result storage/retrieval

Acceptance criteria:
  - Analysis task types documented
  - Batch selection interface designed
  - LLM integration strategy clear
  - Large file handling plan created
  - Result storage strategy defined

#### Task C2: Implement LLM file analysis modules
**Status**: pending (after C1, during/after A2 implementation)
**Effort**: 8-12 hours
**Blocker**: Task C1 completion, Group A partial completion
**Dependencies**: Task C1

Description:
  Build modules for LLM-based file analysis.

New modules:
  1. llm.file-analyzer.batch-selector
     - Interface for selecting file batches
     - Support various selection criteria

  2. llm.file-analyzer.content-feeder
     - Stream file content to LLM
     - Handle large files appropriately
     - Preserve context across multiple files

  3. llm.file-analyzer.task-runner
     - Run analysis tasks (summarize, deduplicate, etc.)
     - Aggregate results
     - Handle LLM failures gracefully

  4. llm.file-analyzer.result-storage
     - Store analysis results
     - Index by checksum + analysis type
     - Enable result retrieval and updates

  5. llm.file-analyzer.quality-assessment
     - Identify well/poorly structured files
     - Suggest improvements
     - Flag potential issues

Steps:
  1. Implement batch-selector module
     - Test with various selection criteria

  2. Implement content-feeder module
     - Test with small, medium, large files
     - Verify context preservation

  3. Implement task-runner module
     - Test with actual LLM calls
     - Test error handling

  4. Implement result-storage module
     - Verify integration with checksum-FS

  5. Implement quality-assessment module
     - Test on what-AI-thinks files

  6. Create integration tests

Acceptance criteria:
  - All modules implemented
  - Integration tests passing
  - Tested on real files (what-AI-thinks directory)
  - Ready for Phase 3 integration

