description: |
  Build the foundational infrastructure for reproducible, distributed file handling.
  Implement checksum-based filesystem structure that enables:
  - Reproducible file addressing across all nodes
  - LLM-based file analysis and batch processing
  - Resilience against data loss through addressable deduplication
  - Fast file serving via upgraded indexer zenka

  This is the cornerstone infrastructure enabling all subsequent phases.

---

## Strategic Context

The checksum-based filesystem is NOT just a storage system. It becomes:
- The addressing scheme for the cubic topology network (Phase 4)
- The foundation for distributed resilience (Phase 5)
- The data layer for reproducible configuration (Phase 6)
- The target system for all subsequent LLM-assisted development

**Why checksum-based?**
- Each file has deterministic, content-addressable identity
- Identical files across nodes automatically deduplicate
- Enables "copy-on-write" semantics for safe experimentation
- Creates mathematical foundation for cubic topology mapping

---

## Task Groups

### Group A: Checksum Filesystem Design & Implementation
**Priority**: CRITICAL
**Status**: Pending Phase 1
**Effort**: 40-60 hours
**Enables**: Phase 3, Phase 4, Phase 5, Phase 6

#### Task A1: Design checksum-based filesystem structure
**Status**: pending
**Effort**: 4-6 hours
**Blocker**: None (design-only task)

Description:
  Define the filesystem structure that will be implemented.
  This becomes the specification for phases 2-6.

Deliverables:
  1. Checksum algorithm selection
     - Current: Likely AMOS7 checksums (BMW, ELF, JHA)
     - Confirm: Which algorithms for file identity? directory structure?
     - Decision: 128-bit, 256-bit, hybrid approach?

  2. Directory structure specification
     - Root: /checksums/ or similar base location
     - Level 1: By checksum first N characters? (e.g., /checksums/a7/b3/...)
     - Level 2: Filename preservation or hash-only?
     - Metadata: Where is file metadata stored?

  3. Metadata format (YAML? JSON? Binary?)
     - File attributes (original name, size, permissions, timestamps)
     - Source tracking (which node created it, when, why)
     - Usage tracking (which processes/zenka access it)
     - Integrity verification (multi-algorithm checksums)
     - Copy-on-write status (is this a CoW copy? of what?)

  4. Deduplication strategy
     - How to detect identical files across network?
     - How to consolidate duplicates safely?
     - How to track which nodes have which file versions?
     - Transaction semantics for deduplication

  5. Copy-on-write semantics
     - How to create CoW copies safely?
     - When does a copy become its own independent file?
     - How to merge improvements back to shared version?

Steps:
  1. Review existing Protocol-7 checksum modules:
     - src/base.chk-sum.* (current implementations)
     - src/crypt.C25519.* (cryptographic foundations)
     - AMOS7::CHKSUM modules (extended checksums)

  2. Document checksum algorithm properties:
     - Speed vs security trade-offs
     - Collision resistance needed for deduplication?
     - Network transmission overhead?

  3. Design directory structure
     - Create specification diagram/document
     - Plan for scalability (billions of files?)
     - Plan for performance (fast lookups)

  4. Specify metadata format
     - Create example YAML/JSON schemas
     - Define required vs optional fields
     - Plan for metadata versioning/evolution

  5. Document copy-on-write semantics
     - Create state transition diagrams
     - Define transaction safety requirements
     - Plan rollback/recovery procedures

  6. Get user review/approval before implementation

Key design questions:
  - Should directory structure be hierarchical or flat?
  - How many levels of indirection (speed vs space)?
  - How to handle file renames? (are they new files or metadata updates?)
  - How to handle large files? (streaming? chunking?)
  - How to handle symlinks/references?

Acceptance criteria:
  - Written specification document (YAML or markdown)
  - Directory structure fully specified
  - Metadata format defined and example files created
  - Copy-on-write semantics documented
  - Deduplication strategy clear and documented
  - User approval of design before implementation begins

#### Task A2: Implement core checksum-based filesystem modules
**Status**: pending (after A1)
**Effort**: 15-20 hours
**Blocker**: Task A1 completion
**Dependencies**: Task A1

Description:
  Build the actual filesystem modules based on A1 specification.
  Create modules for file operations in the checksum-based filesystem.

Modules to create:
  1. base.checksum-fs.init
     - Initialize filesystem structure
     - Check for existing checksums directory
     - Create necessary base directories
     - Set up metadata storage

  2. base.checksum-fs.store
     - Accept incoming file (name, content)
     - Calculate checksum(s)
     - Store in checksum directory structure
     - Create metadata entry
     - Return content-addressable path

  3. base.checksum-fs.retrieve
     - Given checksum or path, retrieve file
     - Validate integrity against stored checksums
     - Return content

  4. base.checksum-fs.verify
     - Verify file integrity
     - Check all stored checksums match
     - Report discrepancies (potential corruption)
     - Attempt recovery if metadata available

  5. base.checksum-fs.deduplicate
     - Scan for duplicate files (by checksum)
     - Report duplicates found
     - Optionally consolidate (with safety checks)
     - Track deduplication metadata

  6. base.checksum-fs.cow-create
     - Create copy-on-write copy of file
     - Mark as CoW with parent reference
     - Track independently for modifications

  7. base.checksum-fs.metadata-update
     - Update metadata for file (attributes, usage)
     - Preserve integrity guarantees
     - Handle metadata versioning

Steps:
  1. Create base.checksum-fs.init module
     - Test directory structure creation
     - Test metadata storage initialization

  2. Create base.checksum-fs.store module
     - Test checksum calculation
     - Test file storage in hierarchy
     - Test metadata creation
     - Test with various file types/sizes

  3. Create base.checksum-fs.retrieve module
     - Test retrieval by path
     - Test retrieval by checksum
     - Test with missing files (error handling)

  4. Create base.checksum-fs.verify module
     - Test integrity checking
     - Test with corrupted files (simulate)
     - Test recovery attempts

  5. Create remaining modules with integration tests

  6. Create integration test suite
     - Store, retrieve, verify workflow
     - Deduplication workflow
     - CoW workflow
     - Error recovery workflows

Acceptance criteria:
  - All 7 core modules implemented
  - Unit tests for each module passing
  - Integration tests passing
  - Error handling comprehensive
  - Documentation complete (inline comments)
  - Ready for indexer integration

#### Task A3: Migrate existing important files to checksum-based system
**Status**: pending (after A2)
**Effort**: 4-6 hours
**Blocker**: Task A2 completion
**Dependencies**: Task A2

Description:
  Migrate critical system files and data to checksum-based filesystem.
  Establishes proof-of-concept and validates design assumptions.

Files to migrate:
  1. Configuration files (cfg/zenki/* and cfg/shared-params)
  2. Data files (data/asc/what-AI-thinks/ - the 64 directories, 413 files)
  3. Visualization archive (just created in Phase 1)
  4. Module source files (selective - start with non-critical ones)
  5. Logs and diagnostic data

Steps:
  1. Create migration tool (base.checksum-fs.migrate module)
     - Batch import files from directories
     - Preserve original paths in metadata
     - Create checksums
     - Report progress/errors

  2. Migrate configuration files first (small, critical)
     - Verify checksums after migration
     - Test that config can be accessed/loaded
     - Create rollback points

  3. Migrate data/asc/what-AI-thinks/ directory
     - This is 64 dirs, 413 files - good scale test
     - Perfect opportunity to find duplicates/redundancy
     - Will validate deduplication logic

  4. Migrate visualization archive
     - Validates that HTML files work in system
     - Tests serving from checksum filesystem

  5. Document migration process for Phase 5 (remote nodes)

Acceptance criteria:
  - All critical files migrated
  - Checksums verified after migration
  - Files accessible via checksum paths
  - Original paths preserved in metadata
  - Deduplication identified and available
  - Rollback procedure tested
  - Migration tooling ready for Phase 5

