## Priority Breakdown

### TIER 1: HIGH PRIORITY (Session-Ready, Foundational)

**1. Rename workflow zenka to 'work'**
  status: pending
  effort: medium (1-1.5h)
  impact: high (improves accessibility of all workflow commands)

  steps:
    - Rename: cfg/zenki/workflow/ → cfg/zenki/work/
    - Update all module references: src/workflow.* → src/work.*
    - Update bin/Protocol-7 command parsing
    - Run: p7.sourcecode update-sub-list
    - Update version: workflow version-sign-commit "Rename workflow zenka to work"
    - Re-sign all changed files

  benefits:
    - work overview (shorter than workflow overview)
    - work todo-list, work bug-list, work search
    - Better discoverability

  related_files:
    - cfg/zenki/workflow/zenka.v7
    - src/workflow.*
    - bin/Protocol-7
    - data/yaml/workflow-suggestions.yaml

**2. Fix 'param = ' header missing value parser error**
  status: pending
  effort: small (30-45 min)
  impact: high (fixes parser bug causing incorrect output)

  problem:
    - When "param = " header has no value (empty)
    - Parser incorrectly treats NEXT source line as parameter value
    - Even though endline separates them
    - Likely interference with comment continuation feature

  symptoms:
    - Perl code appears in output instead of proper parameter handling
    - Affects workflow statistics and header parsing throughout system

  investigation_needed:
    - Locate param header parsing code in bin/Protocol-7
    - Understand endline handling vs comment continuation
    - Create test case with empty param header

  fix_approach:
    - Add endline validation after "param = "
    - Distinguish between continuation and parameter value
    - Document parser rules for param headers

### TIER 2: MEDIUM PRIORITY (Enhances code quality, build on TIER 1)

**3. Create sourcecode zenka 'top 50' command**
  status: pending
  effort: medium (1-2h)
  impact: medium (helps identify code quality issues)

  purpose:
    - Identify code with lines exceeding average width
    - Prioritize by code file name length (shorter = more generic = more important)
    - Display in format matching bin/dev/ptd and amos-chksum output

  parameters:
    - Optional: number limit (default 47)
    - Sort: by relevance (lines overshooting + file importance)

  output_metrics:
    - File name
    - Line count
    - Lines exceeding average width
    - Total bytes in overshooting lines
    - Code quality score

  command_example:
    - sourcecode top [<n>]          # default 47 results
    - sourcecode top 100            # top 100 results
    - sourcecode top quality        # sorted by quality score

**4. Create sourcecode zenka signature iteration analyzer**
  status: pending
  effort: medium (1-2h)
  impact: medium-high (correlates quality with signature iterations)

  purpose:
    - Decode octal iteration counter from file signatures
    - Correlate iterations with code quality/changes
    - Help identify files needing most harmonization

  theory:
    - Files with FEWER iterations = higher quality changes
    - Statistically observed: lower iteration = better next version
    - Use to prioritize harmonization efforts

  output:
    - Files sorted by: length, then iteration counter
    - Show: file size, iteration count, quality estimate
    - Highlight files with high iteration counts (need work)

**5. Clean up worst outlier subroutines**
  status: pending
  effort: medium (1-2h)
  impact: medium (improves code maintainability)

  steps:
    1. Run sourcecode top command (from TIER 2 task #3)
    2. Run signature analyzer (from TIER 2 task #4)
    3. Identify 5-10 worst outliers
    4. Address code width issues
    5. Update versions and re-sign

  selection_criteria:
    - Lines most overshooting average width
    - Highest iteration counts
    - File importance (shorter files = more generic = higher priority)

