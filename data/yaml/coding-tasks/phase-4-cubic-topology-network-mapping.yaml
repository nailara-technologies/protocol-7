### Group B: Topology Implementation
**Priority**: CRITICAL
**Status**: Pending Group A
**Effort**: 25-35 hours
**Enables**: Group C
**Blocker**: Group A (design done)

#### Task B1: Implement checksum-to-coordinate modules
**Status**: pending (after A1-A2)
**Effort**: 8-12 hours
**Blocker**: Group A completion
**Dependencies**: Group A

Description:
  Build the coordinate system modules.

New modules:
  1. base.topology.coordinate-system
     - Define coordinate representation (x, y, z, etc.)
     - Implement coordinate math operations
     - Validate coordinate validity

  2. base.topology.checksum-to-coordinate
     - Map checksums to coordinates
     - Ensure deterministic mapping
     - Handle collisions (if applicable)

  3. base.topology.coordinate-validation
     - Verify coordinate is in valid grid
     - Validate topology constraints
     - Report invalid coordinates

  4. base.topology.proximity
     - Calculate distance between coordinates
     - Identify nearby coordinates
     - Support range queries ("all files near coordinate X")

  5. base.topology.metadata
     - Store per-coordinate metadata
     - Track replicas and their locations
     - Manage coordinate assignment

Steps:
  1. Implement coordinate-system module
     - Test coordinate math
     - Verify operations

  2. Implement checksum-to-coordinate module
     - Test mapping consistency
     - Verify determinism

  3. Implement validation module
     - Test with valid/invalid coordinates

  4. Implement proximity module
     - Test distance calculations
     - Test range queries

  5. Implement metadata module
     - Test metadata operations

  6. Integration testing
     - Full workflow: file → checksum → coordinate → metadata

Acceptance criteria:
  - All coordinate modules working
  - Mapping deterministic and collision-free
  - Integration tests passing
  - Ready for node positioning

#### Task B2: Implement node positioning & routing
**Status**: pending (after B1)
**Effort**: 10-15 hours
**Blocker**: Task B1
**Dependencies**: Task B1

Description:
  Build node positioning and routing.

New modules:
  1. base.topology.node-registry
     - Track all nodes in topology
     - Store node coordinates
     - Store node metadata (status, services, replicas)

  2. base.topology.node-discovery
     - Discover nodes joining topology
     - Assign coordinates to new nodes
     - Update registry

  3. base.topology.routing
     - Route messages between nodes via topology
     - Use shortest path in cubic space
     - Handle unavailable nodes (reroute)

  4. base.topology.replica-management
     - Decide which nodes hold which files
     - Create replicas for resilience
     - Manage replica placement

  5. base.topology.healing
     - Detect missing nodes
     - Rebalance topology
     - Repair broken connections

Steps:
  1. Implement node-registry module
     - Test node storage/retrieval

  2. Implement node-discovery module
     - Test new node addition
     - Verify coordinate assignment

  3. Implement routing module
     - Test message routing
     - Test rerouting around failures

  4. Implement replica-management module
     - Test replica creation/placement
     - Test replica consistency

  5. Implement healing module
     - Test failure detection
     - Test topology repair

  6. Integration testing
     - Multi-node scenarios
     - Failure/recovery scenarios

Acceptance criteria:
  - Node positioning working
  - Routing operational
  - Replica management functional
  - Healing procedures working
  - Multi-node integration tested

#### Task B3: Integrate with filesystem indexer
**Status**: pending (after B2)
**Effort**: 5-8 hours
**Blocker**: Task B2, Phase 2 (indexer complete)
**Dependencies**: Task B2, Phase 2

Description:
  Connect topology system with filesystem and indexer.

Steps:
  1. Update indexer to use topology coordinates
     - Index files by coordinate, not just checksum
     - Support proximity-based queries

  2. Update file storage to reference topology
     - Store replica locations via topology
     - Use topology for placement decisions

  3. Create topology-aware file retrieval
     - Find nearest replica
     - Use topology-optimized path
     - Handle replicas on unavailable nodes

  4. Integration testing
     - Store file, verify topology placement
     - Retrieve file, verify path
     - Handle replica unavailability

Acceptance criteria:
  - Filesystem integrated with topology
  - File placement topology-aware
  - Retrieval topology-optimized
  - Failover working

