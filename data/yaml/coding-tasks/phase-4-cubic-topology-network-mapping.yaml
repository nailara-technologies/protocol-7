description: |
  Map checksum-based filesystem onto cubic space topology.
  Transform abstract file addresses into navigatable network coordinates.
  Create addressable grid for Protocol-7 nodes.

  This is the "aha moment" where the system transitions from:
  - Distributed files and services → Topologically organized network
  - Abstract checksums → Spatial coordinates
  - Separate nodes → Single navigatable grid

---

## Strategic Context

The cubic topology is not just visualization. It becomes:
1. **Addressing scheme**: Every file, node, service has topological coordinate
2. **Routing**: Network packets follow topological paths
3. **Resilience**: Topology-aware replication and failover
4. **Discovery**: Finding files/services by topological proximity
5. **Scaling**: New nodes automatically fit into topology

The v13.7.1 visualization created in Phase 1 becomes a real-time view of the actual network topology.

---

## Task Groups

### Group A: Topology Design & Specification
**Priority**: CRITICAL
**Status**: Pending Phase 2
**Effort**: 8-12 hours
**Enables**: Group B, Group C
**Blocker**: Phase 2 (checksum-FS must be addressable)

#### Task A1: Design checksum-to-coordinate mapping
**Status**: pending
**Effort**: 4-6 hours
**Blocker**: Phase 2 completion
**Dependencies**: Phase 2 (checksum-FS design)

Description:
  Design mathematical mapping from checksums to cubic coordinates.

Key design decisions:
  1. Coordinate system
     - 3D cubic grid? (x, y, z coordinates)
     - What's the grid size? (8x8x8? 16x16x16? 64x64x64?)
     - How many dimensions? (3D? Higher-dimensional?)

  2. Mapping algorithm
     - Deterministic? (same checksum → same coordinate always)
     - One-to-one? (no collisions)
     - Preserves locality? (similar checksums → nearby coordinates?)

  3. Checksum to coordinate transformation
     - Hash checksum to coordinate range?
     - Use checksum bits directly?
     - Multiple checksum algorithms? (for consistency checking)

  4. Grid density
     - One file per coordinate? Or multiple?
     - Multiple replicas sharing coordinate?
     - How to handle coordinate conflicts?

  5. Node positioning
     - Where do nodes sit in topology?
     - Do nodes have fixed coordinates?
     - Do nodes move as network scales?

Steps:
  1. Research cubic topology literature
     - Hypercube topologies
     - Space-filling curves (Hilbert, Z-order)
     - Proximity-preserving hashing

  2. Design mapping algorithm
     - Document mathematical properties
     - Create examples (file → checksum → coordinate)
     - Verify no collisions (or collision strategy)

  3. Design grid structure
     - Specify grid dimensions
     - Plan for scalability
     - Handle partial grids (not all coordinates occupied)

  4. Design node positioning
     - How are nodes distributed in grid?
     - How do new nodes find their position?
     - How does topology self-organize?

  5. Get user feedback and validation

Acceptance criteria:
  - Mapping algorithm fully specified
  - Mathematical properties documented
  - Examples created and verified
  - Scalability plan clear
  - Grid structure design complete
  - Node positioning strategy clear
  - Ready for implementation

#### Task A2: Validate topology design against v13.7.1 visualization
**Status**: pending (after A1)
**Effort**: 2-3 hours
**Blocker**: Task A1
**Dependencies**: Task A1, Phase 1 (v13.7.1 available)

Description:
  Use v13.7.1 visualization to validate the topology design.
  Does the design match the visual representation?

Steps:
  1. Extract topology structure from v13.7.1
     - Identify the 8x63 sub-cube node group
     - Understand connection patterns
     - Identify propagation rules

  2. Compare with designed topology
     - Do checksums map correctly?
     - Are connections preserved?
     - Does propagation match design?

  3. Identify discrepancies
     - What doesn't match?
     - Is design wrong, or visualization wrong?
     - How to resolve?

  4. Iterate on design if needed
     - Fix design issues identified
     - Update specification
     - Verify against visualization again

  5. Document validation process
     - How to continuously validate
     - What to check during implementation

Acceptance criteria:
  - Topology design validated against v13.7.1
  - Discrepancies resolved or documented
  - Validation process documented
  - Design locked in for implementation

