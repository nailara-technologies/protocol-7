### Group B: Local LLM Features Completion
**Priority**: HIGH
**Status**: Pending Phase 2 (can start during A1-A2 design phase)
**Effort**: 15-20 hours
**Enables**: Group C
**Blocker**: None immediately (but Phase 2 helps)

#### Task B1: Identify incomplete LLM features
**Status**: pending
**Effort**: 2-3 hours
**Blocker**: None (analysis task)

Description:
  Audit coding zenka to identify incomplete LLM-based features.
  What was started but not finished?

Areas to investigate:
  1. src/coding.* - what's implemented, what's stubbed?
  2. Inference server management - complete?
  3. LLM prompt engineering - any incomplete approaches?
  4. Response processing - all use cases covered?
  5. Error handling - what scenarios not handled?
  6. Configuration - what settings missing?

Steps:
  1. Review all coding.* modules
  2. Check for TODO/FIXME comments
  3. Review coding zenka configuration
  4. Identify broken tests or known issues
  5. Prioritize by user impact

Acceptance criteria:
  - Comprehensive list of incomplete features
  - Prioritized by impact
  - Owners/stakeholders identified
  - Ready for implementation planning

#### Task B2: Complete critical LLM features
**Status**: pending (after B1)
**Effort**: 10-15 hours
**Blocker**: Task B1
**Dependencies**: Task B1

Description:
  Implement identified critical LLM features.
  Focus on features blocking other work or affecting user experience.

Features likely to need work:
  1. **Inference server reliability**
     - Auto-restart on failure?
     - Health checking?
     - Graceful degradation?

  2. **Prompt optimization**
     - Test different prompts for different tasks
     - Compare response quality
     - Optimize for speed vs quality

  3. **Response parsing**
     - Extract structured data from LLM output
     - Handle various response formats
     - Validate results

  4. **Context management**
     - How to feed files to LLM
     - How to maintain conversation context across files
     - How to handle large projects

  5. **Error recovery**
     - What to do if LLM response is invalid?
     - How to retry intelligently?
     - User notification?

Steps:
  1. Prioritize top 3-5 incomplete features
  2. Implement each with tests
  3. Integration testing with adapter (from Group A)
  4. User testing/feedback

Acceptance criteria:
  - Critical features implemented
  - Tests passing
  - Integrated with adapter
  - Ready for production use

