description: |
  Integrate coding zenka with checksum-based filesystem and LLM capabilities.
  Enable local LLM-based usecase features with distributed data access.
  Create adapter layer for source data retrieval and copy-on-write output.

  This enables hybrid local/remote development mode where:
  - Coding zenka can access source data from distributed filesystem
  - Output is isolated via copy-on-write semantics
  - LLM assistance is available for both analysis and generation
  - Results can be shared back to network safely

---

## Strategic Context

Coding zenka is the LLM-assisted development orchestrator. Phase 3 enables:
1. **Source data access**: Pull code/docs from checksum-FS for analysis
2. **LLM-assisted analysis**: Understand what code does via LLM
3. **Safe experimentation**: CoW outputs for modifications
4. **Knowledge building**: Store results back to filesystem (Phase 2's LLM analysis)
5. **Reproducibility**: All operations are reproducible via checksums

This is the foundation for LLM-in-the-loop development across all nodes.

---

## Task Groups

### Group A: Coding Zenka Filesystem Adapter
**Priority**: CRITICAL
**Status**: Pending Phase 2
**Effort**: 20-30 hours
**Enables**: Group B, Group C
**Blocker**: Phase 2 (checksum-FS working)

#### Task A1: Design filesystem adapter architecture
**Status**: pending
**Effort**: 3-4 hours
**Blocker**: None (design task)

Description:
  Design how coding zenka will interface with checksum-based filesystem.

Key design points:
  1. Adapter interface
     - Source data retrieval (get file by checksum/path)
     - Output storage (write with CoW semantics)
     - Metadata access (understand file context)
     - Batch operations (load project structure)

  2. Data flow
     - How does coding zenka request files?
     - How are files streamed to coding zenka?
     - How are results written back?
     - Transaction boundaries?

  3. Copy-on-write semantics
     - When does an input become mutable output?
     - How to track input→output relationships?
     - How to merge successful changes back?

  4. Error handling
     - What if source file is corrupted?
     - What if storage fails mid-operation?
     - Recovery procedures?

  5. Performance considerations
     - Should commonly-used files be cached locally?
     - Should access be asynchronous?
     - How to handle large project structures?

Steps:
  1. Document adapter interface (API design)
  2. Design data flow diagrams
  3. Plan CoW semantics in detail
  4. Plan error scenarios and recovery
  5. Get user feedback before implementation

Acceptance criteria:
  - Adapter interface fully specified
  - Data flow diagrams created
  - CoW mechanics documented
  - Error handling strategy clear
  - API ready for implementation

#### Task A2: Implement filesystem adapter modules
**Status**: pending (after A1)
**Effort**: 15-20 hours
**Blocker**: Task A1, Phase 2 (checksum-FS complete)
**Dependencies**: Task A1

Description:
  Build the adapter modules.

New modules:
  1. coding.checksum-fs-adapter.retrieve
     - Load files by checksum/path
     - Preserve metadata (original name, timestamps)
     - Stream for large files
     - Error handling for missing/corrupted files

  2. coding.checksum-fs-adapter.store-output
     - Write coding results to filesystem
     - Create as CoW copies
     - Maintain input→output relationships
     - Preserve checksums for verification

  3. coding.checksum-fs-adapter.project-loader
     - Load entire project structure
     - Understand file organization
     - Build project dependency graph
     - Prepare for LLM analysis

  4. coding.checksum-fs-adapter.batch-operations
     - Load multiple files efficiently
     - Cache for performance
     - Transaction support (all-or-nothing)

  5. coding.checksum-fs-adapter.metadata-handler
     - Extract/update file metadata
     - Preserve source tracking
     - Manage CoW metadata

Steps:
  1. Implement retrieve module
     - Test with individual files
     - Test with metadata preservation
     - Test error handling

  2. Implement store-output module
     - Test CoW creation
     - Verify checksums
     - Test metadata tracking

  3. Implement project-loader module
     - Test with real projects
     - Verify dependency detection

  4. Implement batch operations
     - Test with multi-file projects
     - Verify performance

  5. Implement metadata handler
     - Test all metadata operations

  6. Integration testing

Acceptance criteria:
  - All adapter modules working
  - Integration tests passing
  - Performance acceptable
  - CoW semantics preserved
  - Ready for LLM integration

#### Task A3: Integrate adapter with existing coding zenka
**Status**: pending (after A2)
**Effort**: 4-6 hours
**Blocker**: Task A2
**Dependencies**: Task A2

Description:
  Wire the adapter into the coding zenka workflow.

Steps:
  1. Review current coding.init_code module
     - Understand current data sources
     - Plan adapter integration points

  2. Add filesystem adapter to initialization
     - Load adapter modules
     - Configure for checksum-FS
     - Test initialization

  3. Update coding task handlers to use adapter
     - Replace current data loading with adapter
     - Update output handling for CoW
     - Preserve existing behavior

  4. Create compatibility layer (if needed)
     - Ensure backward compatibility
     - Support both old and new data sources (transition)

  5. End-to-end testing
     - Load project via adapter
     - Run analysis
     - Store output
     - Verify integrity

Acceptance criteria:
  - Adapter integrated without breaking existing features
  - Backward compatibility maintained
  - End-to-end workflow tested
  - Ready for Phase 4 integration

