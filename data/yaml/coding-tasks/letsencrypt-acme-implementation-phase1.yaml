dependencies_already_loaded:

  cryptography: |
    - Crypt::Ed25519 (account key signing)
    - Crypt::OpenSSL::X509 (CSR and cert parsing)
    - Crypt::OpenSSL::RSA (certificate key generation)
    - Crypt::Misc (base32r encoding/decoding)
    - Digest::SHA (for JWK thumbprint)

  http_client: |
    - LWP::UserAgent (HTTP requests)
    - LWPx::ParanoidAgent (paranoid agent for security)
    - JSON::XS (JSON encoding/decoding)
    - MIME::Base64 (base64 encoding)

success_criteria:

  minimum_viable: |
    ✓ Can fetch ACME directory from Let's Encrypt
    ✓ Can register account (or retrieve existing)
    ✓ Can create order for domain
    ✓ Can generate CSR for domain(s)
    ✓ Handlers return correct reply format
    ✓ Error messages are descriptive
    ✓ No blocking operations in parent
    ✓ All operations work over IPC pipe

  verification: |
    Test by:
    1. Call parent command: p7 letsencrypt.child.cmd.new-certificate example.com
    2. Check parent handler receives proper reply (size mode with certificate)
    3. Verify no startup errors
    4. Confirm child stays alive after operations
    5. Test error handling (invalid domain, network error, etc)

next_phase_depends_on: |
