description: |
  Create fully automated installers for reproducible Protocol-7 systems.
  Turn ephemeral hardware into persistent, recoverable configurations.
  Enable rapid deployment of new nodes with standard configuration.

  Result: Reproducible desktop system that can be deployed to any hardware.
  No more suffering data loss from hardware failures.
  No more manual configuration of multiple machines.

  "The state for some relief after 24 years of suffering consequences of
   losing hardware and degrading remainders."

---

## Strategic Context

Phase 6 completes the circle: **Reproducibility becomes the operating system.**

Everything before Phase 6 was building infrastructure. Phase 6 packages that infrastructure
into reproducible, deployable form.

Once Phase 6 is complete:
- **New hardware is deployed in minutes, not days**
- **Configuration is declarative, not manual**
- **System can be rebuilt from checksums, not fragile backups**
- **Hardware failure becomes a non-event** (just swap and redeploy)

---

## Task Groups

### Group A: System Configuration Declaratization
**Priority**: CRITICAL
**Status**: Pending Phase 5
**Effort**: 20-30 hours
**Enables**: Group B (installers)
**Blocker**: Phase 5 (system operating, stable)

#### Task A1: Capture current system configuration
**Status**: pending
**Effort**: 4-6 hours
**Blocker**: None (capture task)

Description:
  Document the current state of all nodes.
  What makes each node work? What needs to be configured?

Capture scope:
  1. **OS-level configuration**
     - Linux distribution and version
     - Kernel version and patches
     - System libraries and versions
     - Locale and timezone settings
     - Network configuration (IPs, DNS, routing)

  2. **User configuration**
     - User accounts needed
     - Group membership
     - SSH keys
     - Permissions (sudo, etc.)

  3. **Protocol-7 configuration**
     - Directory structure
     - Module locations
     - Zenka definitions
     - Configuration files
     - Secrets/keys (how managed?)

  4. **Service configuration**
     - Which services start on boot?
     - Service dependencies
     - Service configuration files
     - Logging/monitoring configuration

  5. **Storage configuration**
     - Checksum-FS setup
     - Data directory structure
     - Backup/replication setup
     - Disk partitioning

  6. **Network configuration**
     - Node positions in topology
     - Network services (cube, routing)
     - Firewall rules
     - DNS/service discovery

Steps:
  1. **On each node**, document:
     - `cat /etc/os-release` (OS info)
     - `uname -a` (kernel)
     - `ip addr show` (network)
     - `ps aux` (running services)
     - Configuration file list
     - User list and groups

  2. **Review Protocol-7 state**
     - Directory tree
     - Module inventory
     - Configuration inventory
     - Running zenka list

  3. **Create configuration checklist**
     - All items to be automated
     - Dependencies between items
     - Order of application

  4. **Identify sensitive data**
     - Keys and secrets
     - User credentials
     - Certificates
     - How to handle in installer?

Acceptance criteria:
  - Complete configuration captured
  - All nodes documented
  - Checklist created
  - Dependencies identified
  - Sensitive data strategy planned
  - Ready for declaratization

#### Task A2: Create Ansible playbooks (or equivalent)
**Status**: pending (after A1)
**Effort**: 10-15 hours
**Blocker**: Task A1
**Dependencies**: Task A1

Description:
  Convert captured configuration into automated form.
  Use Ansible (or equivalent) to make configuration reproducible.

Playbooks needed:
  1. **base-system.yml**
     - OS updates
     - System libraries
     - Required packages
     - User accounts
     - Permissions
     - Locale/timezone

  2. **network-config.yml**
     - Network interfaces
     - IP configuration
     - DNS setup
     - Routing
     - Firewall rules

  3. **protocol7-base.yml**
     - Directory structure
     - Source code checkout
     - Dependency installation (CPAN modules)
     - Module compilation
     - Basic zenka setup

  4. **protocol7-services.yml**
     - Checksum-FS initialization
     - Indexer setup
     - Node positioning in topology
     - Service startup

  5. **node-specific.yml**
     - Per-node customization
     - Node ID and position
     - Storage configuration
     - Service distribution

Steps:
  1. **Set up Ansible environment**
     - Install Ansible
     - Create playbook structure
     - Define inventory

  2. **Create base-system playbook**
     - Test on fresh Ubuntu/Debian VM
     - Iterate until reproducible
     - Document any manual steps

  3. **Create network-config playbook**
     - Configure networking
     - Verify connectivity

  4. **Create protocol7-base playbook**
     - Install Protocol-7
     - Compile modules
     - Verify installation

  5. **Create protocol7-services playbook**
     - Start services
     - Verify they're working
     - Check topology integration

  6. **Create node-specific playbooks**
     - One per node type (Pi, ATOM, laptop, desktop)
     - Hardware-specific configurations
     - Service distribution

  7. **Integration test**
     - Deploy to fresh node
     - Verify full system works
     - Iterate to fix issues

Acceptance criteria:
  - All playbooks written
  - Integration tested
  - Can deploy fresh system in under 1 hour
  - All manual steps eliminated (or documented)
  - Sensitive data handled securely

#### Task A3: Create installer wrapper script
**Status**: pending (after A2)
**Effort**: 3-4 hours
**Blocker**: Task A2
**Dependencies**: Task A2

Description:
  Create a single command to deploy new nodes.

Installer should:
  1. **Detect hardware/OS**
     - Identify node type
     - Identify OS
     - Set configuration accordingly

  2. **Run playbooks in order**
     - Base system first
     - Network configuration
     - Protocol-7 installation
     - Services startup

  3. **Handle user input**
     - Which node type? (Pi/ATOM/laptop/desktop)
     - Node name/ID?
     - Network configuration?
     - Topology position?

  4. **Provide progress feedback**
     - What's being installed
     - Expected time remaining
     - Any errors

  5. **Verify success**
     - System is operational
     - Services are running
     - Can reach network
     - Can reach cube

Example flow:
```
./install-protocol7.sh
  → Select hardware type: [1] Raspberry Pi [2] ATOM [3] Laptop [4] Desktop
  → Enter node ID: pi-001
  → Configure network: [1] DHCP [2] Static IP
  → Running base system configuration...
  → Running network configuration...
  → Running Protocol-7 installation...
  → Running services startup...
  → Verifying system... ✓ Success
```

Steps:
  1. Create installer script
  2. Test with various inputs
  3. Add error handling
  4. Add recovery procedures
  5. Document usage

Acceptance criteria:
  - Installer works end-to-end
  - Can deploy fresh node in 30-60 minutes
  - Error handling is robust
  - User feedback is clear

---

### Group B: OS-Level Installer Creation
**Priority**: HIGH
**Status**: Pending Group A
**Effort**: 10-15 hours
**Enables**: Group C
**Blocker**: Group A (Ansible playbooks complete)

#### Task B1: Create bootable installer image
**Status**: pending (after A3)
**Effort**: 5-8 hours
**Blocker**: Group A completion
**Dependencies**: Group A

Description:
  Create bootable install media that includes Protocol-7 installer.

Deliverables:
  1. **Debian/Ubuntu installer variant**
     - Standard installer with preseed configuration
     - Automatically partitions disk
     - Automatically configures network
     - Automatically runs Ansible playbooks
     - Automatically starts Protocol-7 services

  2. **Raspberry Pi SD card image**
     - Raspbian with Protocol-7 pre-configured
     - Boots directly into working system
     - Network auto-configuration
     - Just insert SD and boot

  3. **Installation ISO files**
     - For desktops/laptops/ATOM
     - Both UEFI and BIOS compatible
     - Supports both interactive and automated install

  4. **Network boot image** (optional)
     - For headless servers (ATOM, etc.)
     - PXE boot support
     - Enables deployment without USB/CD

Steps:
  1. **Create Debian preseed file**
     - Automate OS installation
     - Partition configuration
     - Network setup
     - Post-install script (run Ansible)

  2. **Create Raspberry Pi image**
     - Use raspios-builder or similar
     - Include Protocol-7 installation
     - Pre-configure network (or autodetect)

  3. **Build installer ISO**
     - Use debian-live or similar
     - Include preseed file
     - Include Ansible playbooks
     - Test on VirtualBox/KVM

  4. **Create documentation**
     - How to write USB media
     - How to boot from media
     - How to configure installation
     - How to verify installation

Acceptance criteria:
  - Bootable ISO files created
  - Raspberry Pi image created
  - Can deploy fresh system unattended
  - Installation verified on test hardware

#### Task B2: Create system recovery media
**Status**: pending (after B1)
**Effort**: 3-4 hours
**Blocker**: Task B1
**Dependencies**: Task B1

Description:
  Create recovery media for failed systems.

Recovery media should:
  1. **Boot from USB without installation**
     - Live system with Protocol-7 tools
     - Can access local filesystem
     - Can access network (cube)

  2. **Provide recovery tools**
     - Checksum-FS repair tools
     - File integrity verification
     - Data recovery from cloud backup
     - Filesystem repair utilities

  3. **Enable system restoration**
     - Download fresh system from cube
     - Restore user data from checksums
     - Re-run Ansible to restore configuration
     - Boot into recovered system

Steps:
  1. Create recovery ISO
     - Based on Debian live
     - Include recovery tools
     - Pre-configured to find cube network

  2. Include recovery script
     - Download and verify system
     - Restore data from checksums
     - Run Ansible to restore config
     - Verify system works

  3. Test recovery
     - Corrupt filesystem on test node
     - Boot from recovery media
     - Run recovery script
     - Verify system works

Acceptance criteria:
  - Recovery ISO created
  - Can recover from corrupted filesystem
  - Can download fresh system
  - Can restore user data

