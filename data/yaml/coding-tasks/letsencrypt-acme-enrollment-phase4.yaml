## Data Structures

activity_log (in acme-activity buffer):
  - timestamp: HH:MM:SS format
  - level: 1 (warning) or 2 (info)
  - operation: "enrollment|revocation|challenge|error|renewal"
  - domain: "example.com"
  - status: "pending|success|failed|validated"
  - details: "error message or additional info"

pending_challenges (not yet stored):
  - domain: "example.com"
  - type: "http-01|dns-01"
  - token: "ACME challenge token"
  - key_auth: "key authorization string"
  - created_at: "timestamp"
  - expires_at: "timestamp"
  - status: "pending|validated|failed"

## Key Design Decisions

1. **Base32r Encoding**: Certificate bundles encoded as base32r-JSON for secure binary transmission over text-based protocol
2. **Exponential Backoff**: Shorter retry delays for enrollment (5/15/30min) vs renewal (5/10/20/40/80min) - new certs more likely to succeed on retry
3. **Activity Logging**: All operations logged to buffer with timestamp, operation type, domain, status for comprehensive debugging
4. **HTTPd Notification**: Parent notifies HTTPd immediately after successful certificate save, before returning to user
5. **Existing Infrastructure**: Reuses Phase 1 ACME modules (acme_new) and Phase 2 storage (save_certificate)

