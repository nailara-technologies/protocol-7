## Completed Components

### Parent-Side Enrollment
- **letsencrypt.parent.cmd.request-certificate**: User-facing command to request new SSL certificate
  * Validates that certificate doesn't already exist
  * Discovers alternative domains from HTTPd (www variants)
  * Queues enrollment command to child process
  * Logs activity at each step
  * Returns immediate status to user

- **letsencrypt.parent.handler_enrollment_reply**: Processes enrollment response from child
  * Decodes base32r-encoded JSON certificate bundle
  * Validates bundle contains required fields (certificate, key)
  * Saves certificate using Phase 2 infrastructure
  * Updates certificate registry with metadata and expiration
  * Notifies HTTPd to reload with new certificate
  * Implements exponential backoff retry: 5min, 15min, 30min (3 attempts max)
  * Logs all transitions to activity buffer

- **letsencrypt.parent.handler_enrollment_retry**: Retry orchestration
  * Scheduled via event.add_timer with exponential delays
  * Re-queues enrollment command to child on retry
  * Maintains attempt counter for backoff calculation

### Child-Side Enrollment
- **letsencrypt.child.cmd.request-certificate**: Child-side enrollment wrapper
  * Accepts domain from parent via call.args
  * Retrieves alternative domains from parent parameters
  * Invokes letsencrypt.child.acme_new (from Phase 1)
  * Assembles certificate bundle with:
    - certificate_pem (full chain)
    - private_key_pem
    - expires_at (validation deadline)
    - domains (primary + alternatives)
  * Encodes bundle as base32r-JSON for secure transmission
  * Returns SIZE mode response with encoded data

### Activity Visibility
- **letsencrypt.parent.cmd.activity-log**: Display and filter ACME operation history
  * Reads from acme-activity buffer (Phase 3 infrastructure)
  * Optional filter by domain, operation, or status
  * Configurable result limit (default: 50 entries)
  * Shows newest entries first with formatted table:
    - Timestamp (HH:MM:SS)
    - Operation (enrollment, revocation, challenge, etc.)
    - Domain name
    - Status (pending, success, failed)
    - Details (error messages or additional info)
  * Total count of entries shown at bottom

## Outstanding Phase 4 Tasks

### Challenge Handling (Not Yet Implemented)
- letsencrypt.child.handle_challenge: Process domain validation challenges
  * HTTP-01: Create challenge response file
  * DNS-01: Return challenge token for DNS update
  * Poll for challenge completion
  * Handle timeout/retry logic

- letsencrypt.parent.handler_challenge_needed: Store and manage pending challenges
  * Track HTTP-01 challenges awaiting response
  * Track DNS-01 challenges awaiting validation
  * Store challenge tokens and keys
  * Implement challenge timeout (usually 300s)

- letsencrypt.parent.notify_httpd_challenge: Notify HTTPd to serve HTTP-01 challenge
  * Send challenge token/path to HTTPd
  * HTTPd serves from /.well-known/acme-challenge/
  * Wait for ACME validation

