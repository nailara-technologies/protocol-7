## symptom 1 -- transport's subscription never arrives ##
# `bin/dev/cred-mesh-test` scenario 4 : proxy's subscription flushes its
# cache correctly on rotation ; transport's does not.
# `base.protocol-7.command.send.local`'s route-send from transport
# reports success (count : 1) -- the send side believes it worked.
# cred-mesh's own log shows ZERO mentions of transport ever arriving --
# not a permission denial (that specific bug is fixed and confirmed
# gone), just silence. The vanishing point is somewhere between
# send.local's successful queue and cred-mesh's cmd.subscribe_rotation
# wrapper actually running. proxy's byte-identical call path works
# every time. `base.handler.command.route_to_target` (the receiving-side
# dispatch) is the next place to instrument -- not yet done by anyone.

## symptom 2 -- base32.decode undef, transport only ##
# live log during the same test run (transport PID freshly spawned):
#   tr.,.rt : [PID] <<< undefined value as subroutine reference >>> [transport.cmd.cred-rotated:8]
# line 8 is `<[base.base32.decode]>->( \$args_b32 )` --
# `$code{'base.base32.decode'}` is undef in transport's own %code.
# The byte-identical call in proxy.cmd.cred-rotated works fine in proxy.
#
# already ruled out for symptom 2:
#   - not a whitelist gap: cfg/zenki/proxy/subroutine.white-list and
#     cfg/zenki/transport/subroutine.white-list both list
#     base.base32.decode (confirmed identical lines, both present)
#   - not a stale process: transport was freshly spawned by the same
#     test run that hit this

## working theory -- may explain BOTH symptoms at once ##
# transport's modules.load token set (`auth net protocol io.unix io.ip
# ui format.yaml transport devmod`, cfg/zenki/transport/zenka.v7) may
# not expand to the same actual %code population as proxy's token set
# for equivalent tokens, even though the whitelist generator (bin/dev/
# dep-graph) thinks both are covered. whitelist presence and actual
# base.load_modules/base.load_code population are two DIFFERENT
# mechanisms -- do not assume one implies the other. Compare proxy's
# and transport's modules.load token expansion directly (what actually
# lands in %code for each, not what the whitelist file says) before
# assuming this theory is right; it is a lead, not a confirmed cause.
# This is speculative and untested -- do not treat it as fact, verify it.

