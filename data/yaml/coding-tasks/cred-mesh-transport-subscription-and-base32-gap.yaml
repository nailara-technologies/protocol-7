## p7 pitfalls (apply throughout) ##
notes: |
  No SUPER:: calls (P7 modules have no class hierarchy). Use $ARG, not
  $_, in map/grep/for. Use bin/dev/ptd -c to check syntax, never raw
  perl -c (it doesn't know this codebase's <var>/<[code]> macro syntax
  and will report false errors). base.logs not base.log for multi-arg
  sprintf-style calls. TRUE/FALSE are 5/0 in this codebase, not 1/0.
  Never use \<var> for a live reference -- a leading backslash is this
  codebase's macro-escape and silently watches/reads a dead
  literal-string reference instead of the real data slot.

