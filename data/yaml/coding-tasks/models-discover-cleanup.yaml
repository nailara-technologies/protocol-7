# Task: Consolidate models discovery commands
# Created: 2026-03-31
# Priority: medium

overview:
  The models zenka currently has 3 commands that do overlapping discovery/registry
  operations. This creates confusion, code duplication, and inconsistent interfaces.

current_commands:
  - name: models.cmd.discover
    purpose: List models from registry
    flags: [":all:", ":available:", ":unavailable:"]
  
  - name: models.cmd.discover_files
    purpose: Discover .gguf from filesystem, populate registry
    flags: []
  
  - name: models.cmd.clear-registry
    purpose: Clear registry, optionally re-scan
    flags: [":re-scan:"]

problems:
  - Redundancy: discover_files and clear-registry :re-scan: do similar scanning
  - Inconsistent interface: Different flag conventions across commands
  - Unclear purpose: Users don't know which command to use when
  - Code duplication: Scanning logic exists in multiple places

proposed_solution:
  Merge into a single models.discover command with unified flags:
  
  models.discover                    # List from registry
  models.discover :re-scan:          # Re-scan filesystem, update registry
  models.discover :clear:            # Clear registry without scan
  models.discover :clear: :re-scan:  # Clear then re-scan
  
  # Filter flags (work with all modes)
  models.discover :available:        # Only show available (file exists)
  models.discover :unavailable:      # Only show unavailable (file missing)

affected_zenki:
  - coding.*          # model discovery at startup
  - lm-vision.*       # vision model loading
  - image-quality.*   # vision model config
  # TODO: audit all zenki that call these commands

implementation_steps:
  - step: 1
    task: Audit usage
    details: Find all callers of the 3 commands across all zenki
  
  - step: 2
    task: Design unified interface
    details: Finalize flag semantics and backward compatibility plan
  
  - step: 3
    task: Create models.discover (unified)
    details: New consolidated command with all functionality
  
  - step: 4
    task: Update callers
    details: Migrate each zenka to new interface
  
  - step: 5
    task: Deprecate old commands
    details: Mark as deprecated, keep as wrappers with warnings
  
  - step: 6
    task: Remove old commands
    details: After transition period, remove deprecated commands

files_to_modify:
  - modules/models.cmd.discover
  - modules/models.cmd.discover_files
  - modules/models.cmd.clear-registry
  # Plus any zenka modules that call the above

acceptance_criteria:
  - Single models.discover command handles all use cases
  - All existing functionality preserved via flags
  - No breaking changes to external zenki (deprecation period)
  - Documentation updated
  - Old commands marked deprecated with migration notice

related_work:
  - Recent fix: models.gguf.file.extract_name (parent directory name extraction)
  - Recent fix: models.gguf.file.is_garbage_name (garbage name detection)

