## Challenge Lifecycle Flow

1. **Child sends challenge notification**
   - Via base.protocol-7 command protocol
   - Contains: domain, token, key_auth, type
   - Handler: letsencrypt.parent.handler_challenge_needed

2. **Parent stores challenge**
   - Adds to pending_challenges hash
   - Sets expiration: current_time + 300 seconds
   - Logs to activity buffer: 'pending'

3. **Parent notifies HTTPd**
   - Calls httpd.cmd.setup-acme-challenge
   - HTTPd creates challenge response file
   - HTTPd serves at /.well-known/acme-challenge/{token}

4. **ACME server validates challenge**
   - Child polls challenge status (from Phase 1)
   - Child waits for 'valid' status
   - Child notifies parent of completion

5. **Parent receives validation result**
   - Via letsencrypt.parent.handler_challenge_validated
   - Updates challenge status: 'pending' → 'valid' or 'failed'
   - Logs result to activity buffer
   - On failure: requests HTTPd cleanup

6. **Challenge timeout or completion**
   - Valid challenges kept in storage for reference
   - Failed/timed-out challenges removed
   - Challenge file cleaned up by HTTPd
   - Activity logged with timestamp

## Data Flow

```
Child (ACME Process):
  1. Handles ACME challenge from server
  2. Creates HTTP-01 response file
  3. Sends challenge notification to parent:
     letsencrypt.parent.handler_challenge_needed

Parent:
  4. Stores challenge in pending_challenges
  5. Notifies HTTPd to serve challenge response
  6. Sets up 5-minute timeout
  7. Logs activity: 'challenge', domain, 'pending'

HTTPd:
  8. Creates challenge file: /.well-known/acme-challenge/{token}
  9. Serves key_auth content when ACME requests it
  10. Returns success to parent

Child (continued):
  11. Polls challenge status from ACME server
  12. Waits for 'valid' status (up to 60 attempts, 1-10 sec intervals)
  13. Notifies parent: letsencrypt.parent.handler_challenge_validated

Parent:
  14. Updates challenge status: 'pending' → 'valid'
  15. Logs activity: 'challenge', domain, 'success'
  16. Continues with certificate finalization
```

## Key Design Decisions

1. **5-Minute Timeout**: Standard ACME challenge timeout (300 seconds)
   - Enforced via event.add_timer
   - Challenge removed if not validated within timeout
   - Activity logged when timeout occurs

2. **Challenge Token as Key**: Pending challenges keyed by token
   - Allows quick lookup when validation completes
   - Prevents duplicate challenges
   - Easy timeout cleanup

3. **HTTPd Decoupling**: Parent doesn't create challenge files directly
   - Delegates to HTTPd via command protocol
   - Allows HTTPd to handle vhost-specific paths
   - Clean separation of concerns

4. **Activity Logging**: All challenge events logged
   - Challenge received: 'pending'
   - HTTPd notified: 'pending'
   - Validation completed: 'success' or 'failed'
   - Timeout occurred: 'failed'
   - Provides complete audit trail

5. **DNS-01 Support**: Stored but not fully automated
   - DNS-01 challenges stored in pending_challenges
   - Manual update required for DNS TXT record
   - Future phase: integrate with DNS provider API

