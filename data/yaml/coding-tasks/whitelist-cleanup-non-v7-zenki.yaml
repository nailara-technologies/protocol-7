---
title: fix subroutine whitelist generation bug [ zenka-specific modules leaking ]
priority: medium
status: completed
completed: 2026-03-14
commit: a7f0b29db, 0928ac133
type: bug

description: |
  subroutine whitelists were designed to be generated by tracing actual entry
  points per zenka — so only modules a zenka actually loads/calls compile
  eagerly, everything else defers. instead, zenka-specific namespaces are
  leaking across all whitelists.

  all v7.* modules are v7-zenka-specific. they should never appear in
  non-v7 zenki whitelists. currently ~83 v7.* entries appear in whitelists
  for httpsd, calc, cube, etc. the same likely applies to other namespaces.

  this defeats deferred compilation — non-v7 zenki eagerly compile v7 modules
  they never call. a whitelist that contains everything is equivalent to no
  whitelist at all.

scope: |
  - trace what went wrong in the whitelist generator [ why zenka-specific
    modules are appearing in all zenki instead of just their own ]
  - all v7.* entries belong only in configuration/zenki/v7/subroutine.white-list
  - same principle for other zenka-specific namespaces [ httpsd.*, cube.*, etc. ]
  - regenerate whitelists from actual per-zenka entry point traces

notes: |
  noted 2026-03-17 during concurrent restart commit review
  new modules v7.handler.drain_timeout, v7.zenka.cmd.drain-instance,
  v7.zenka.instance.handover_cleanup were added to all zenki by the same
  buggy generator — should only be in v7/subroutine.white-list

