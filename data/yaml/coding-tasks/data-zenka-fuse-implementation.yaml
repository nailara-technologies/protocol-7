## phase 1 — local hash FUSE mount (no network async needed)

description: |
  for data living in the local in-process hash, FUSE callbacks can return
  data directly — no async/blocking problem. this is the primary use case
  and should work without a child process.

type_mapping:
  HASH   → fuse directory (getattr returns S_IFDIR, readdir returns keys)
  SCALAR → fuse file      (getattr returns S_IFREG + size, read returns value)
  ARRAY  → fuse directory (entries are array elements with auto-named keys)

path_translation:
  fuse path  /user/taeki/files/uploads
  hash path  user.taeki.files.uploads
  rule: strip leading slash, replace / with .

modules_to_implement:
  - name: data.mount.fuse.init_code
    descr: load Fuse module, set up mount registry in <data.fuse.mounts>

  - name: data.mount.fuse.getattr
    descr: fuse getattr callback — translate path, check ref type, return stat struct

  - name: data.mount.fuse.readdir
    descr: fuse readdir callback — return list of keys/indices at hash path

  - name: data.mount.fuse.read
    descr: fuse read callback — return scalar value (or serialized ref) as file content

  - name: data.mount.fuse.write
    descr: fuse write callback — update scalar value in hash (optional phase 1)

  - name: data.mount.fuse.open
    descr: fuse open callback — validate path exists, check permissions via data.get.check_permissions

  - name: data.mount.fuse.release
    descr: fuse release callback — cleanup open file state

  - name: data.mount.fuse.spawn
    descr: |
      fork a child process (fork-child pattern) that calls Fuse::main() with
      the above callbacks. child blocks in FUSE event loop; parent continues
      async. register child pid in <data.fuse.mounts>{$local_dir}.

modules_to_complete:
  - name: data.cmd.attach-fs-mount
    current_state: |
      validation done (hash_path exists, local_dir exists + writable),
      then: my $export_count = 0;  — stops here
    needed: call data.mount.fuse.spawn to fork FUSE child for this mount

  - name: data.cmd.mount-hash
    current_state: shows hash listing only (no actual mount)
    needed: same as attach-fs-mount — delegate to data.mount.fuse.spawn

  - name: data.cmd.mount-cube
