## phase 2 — network-backed / remote data (optional, future)

description: |
  when the requested hash path is not local (remote cubic lookup, network
  fetch), the FUSE child cannot return immediately. use the child+IPC pattern
  from the design doc: child queues request to parent, parent fetches async,
  populates shared cache (data.mount.shm), signals child, child returns data.

  this phase is NOT required for phase 1 to be useful. defer unless needed.

async_strategy: Option C (Protocol-7 native deferred replies) preferred
  — child sends request with callback id via parent route
  — parent issues deferred data.get call
  — when reply arrives, parent sends to child session
  — child matches callback id, serves FUSE read

reference: |
  data/md/design/CONCEPT-DATA-ZENKA-ARCHITECTURE.md
  section "The FUSE Blocking Problem" and "Child Zenka Pattern" diagram

---

## testing

manual_test_sequence:
  - "p7 data.attach-fs-mount network.hosts /tmp/test-mount"
  - "ls /tmp/test-mount"       # should show hash keys as dirs/files
  - "cat /tmp/test-mount/..."  # read scalar value
  - "p7 data.dump data.fuse.mounts"  # verify registry entry
  - "fusermount -u /tmp/test-mount"  # unmount and verify child exits

success_criteria:
  - mount command forks child, returns immediately to parent
  - ls on mount point shows correct directory structure
  - cat on a scalar key returns the value
  - child process exits cleanly on unmount
  - parent remains stable throughout

notes: |
  the fork-child canonical pattern is documented in MEMORY.md and the
  completed task archive. use IO::AIO::reinit() in child before Fuse::main().
  keep zenka_logfile at default (1) in the child to avoid log storm.

