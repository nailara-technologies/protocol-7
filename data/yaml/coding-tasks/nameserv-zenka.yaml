---
# Task: Nameserv Zenka - Protocol-7 DNS Name Server Integration
# Date: 2026-02-19
# Status: pending
# Context: Protocol-7 DNS infrastructure for remote server deployment

task_metadata:
  title: "Nameserv Zenka - Authoritative DNS with Dynamic Record Management"
  description: >
    A Protocol-7 zenka wrapping Net::DNS::Nameserver (or equivalent) to
    provide authoritative DNS service for domains hosted on the server.
    Exposes zone management and record control as Protocol-7 commands,
    enabling other zenki (notably letsencr) to write DNS records directly
    without shell access or external tools. Authoritative-only initially;
    recursive resolution and DNSSEC are phase 2 additions.
  priority: high
  category: "infrastructure"

## -----------------------------------------------------------------------
## phase 1: authoritative dns server zenka
## -----------------------------------------------------------------------

nameserv:
  motivation: >
    Remote server acts as authoritative nameserver for hosted domains.
    A Protocol-7 nameserv zenka provides: (a) authoritative DNS responses
    without depending on external bind/unbound configuration, (b) dynamic
    record updates driven by other zenki (letsencr dns-01 challenge,
    httpsd virtual host additions), (c) zone data stored in Protocol-7
    configuration format rather than zone files, making it natural to
    generate, version, and modify records through the zenka network.
    The server previously had a monolithic hand-written Perl DNS script;
    this zenka replaces it with a fully integrated, event-driven solution.

  prior_art: >
    A monolithic Perl DNS script was written previously for this server.
    It handled authoritative responses for a small zone but had no
    Protocol-7 integration. That script serves as proof-of-concept that
    pure-Perl DNS is viable; the zenka design supersedes it with proper
    async I/O, command surface, and inter-zenka protocol.

  capabilities:

    authoritative_dns:
      - serve A, AAAA, CNAME, MX, TXT, NS, SOA record types
      - respond to UDP DNS queries on port 53 (configurable)
      - handle multiple zones (one zenka serves all hosted domains)
      - reject recursive queries (authoritative-only in phase 1)
      - nameserv.status command: running state, zone count, query rate

    zone_management:
      - zones loaded from configuration/zenki/nameserv/zones/ directory
      - one YAML file per zone: zone name, TTL, SOA fields, records list
      - nameserv.reload-zones: reparse all zone files without restart
      - nameserv.list-zones: show loaded zones and record counts
      - nameserv.show-zone <domain>: dump all records for a zone

    dynamic_record_control:
      - nameserv.set-record <domain> <type> <name> <value> [ttl]
        writes or replaces a record; persists to zone YAML file
      - nameserv.remove-record <domain> <type> <name>
        deletes a record; updates zone YAML file
      - nameserv.get-record <domain> <type> <name>
        returns current value for a record
      - all mutations trigger in-memory zone refresh (no restart needed)

    letsencr_integration:
      - letsencr calls nameserv.set-record to write _acme-challenge TXT
        records for dns-01 ACME challenge fulfillment
      - letsencr calls nameserv.remove-record to clean up after validation
      - nameserv emits dns-record-set / dns-record-removed events for
        letsencr to confirm propagation before notifying ACME server
      - enables wildcard certificate issuance (dns-01 only challenge type
        that works for *.domain.com certificates)

    httpsd_integration:
      - when httpd.cmd.add-vhost creates a new vhost, nameserv receives
        nameserv.set-record to add the corresponding A/AAAA record
      - inverse: nameserv.remove-record called from httpd.cmd.del-vhost
      - keeps DNS and web serving configuration in sync automatically

    query_logging:
      - optional query logging to p7-log (level 3 by default)
      - nameserv.query-stats: queries per second, NX rate, record type breakdown
      - nameserv.activity-log: recent query log with client IP, query, response

  new_zenka:
    name: nameserv
    start_mode: stdin-zenka
    user: nameserv   # or protocol-7 user with cap_net_bind_service for port 53
    on_demand: false  # always-on on remote server profile
    modules:
      - nameserv.base          # init, config, zone loading infrastructure
      - nameserv.handler.query # UDP query parsing and response dispatch
      - nameserv.zone          # in-memory zone data structure and lookup
      - nameserv.zone.persist  # zone YAML read/write for dynamic updates
      - nameserv.cmd.*         # set-record, remove-record, reload-zones, etc.

  configuration:
    nameserv.cfg.listen_addr  = 0.0.0.0
    nameserv.cfg.listen_port  = 53
    nameserv.cfg.zones_dir    = configuration/zenki/nameserv/zones
    nameserv.cfg.default_ttl  = 300
    nameserv.cfg.log_queries  = 0   ## 0=off 1=errors 3=all

  zone_file_format: |
    ## example: configuration/zenki/nameserv/zones/example.com.yaml
    ---
    domain:  example.com
    ttl:     300
    soa:
      mname:   ns1.example.com
      rname:   hostmaster.example.com
      serial:  2026021901
      refresh: 3600
      retry:   900
      expire:  604800
      minimum: 300
    records:
      - type: NS    name: "@"              value: ns1.example.com.
      - type: NS    name: "@"              value: ns2.example.com.
      - type: A     name: "@"              value: 203.0.113.1
      - type: A     name: ns1              value: 203.0.113.1
      - type: MX    name: "@"   priority: 10  value: mail.example.com.
      - type: TXT   name: "@"              value: "v=spf1 mx ~all"

  async_implementation:
    - UDP socket created with IO::Socket::IP, set non-blocking
    - event watcher via Event.pm add_var on socket file descriptor
    - on readable: recvfrom() reads one DNS query datagram
    - parse query with Net::DNS::Packet->new(\$raw_data)
    - look up records in in-memory zone hash
    - assemble response with Net::DNS::Packet
    - sendto() response datagram (single non-blocking UDP send)
    - entire path synchronous and fast: no AIO, no blocking I/O needed
    - zone file updates use IO::AIO for async YAML write-back

  net_dns_usage: >
    Net::DNS::Nameserver provides a callback-based DNS server; however
    its built-in event loop conflicts with Protocol-7's Event.pm loop.
    Preferred approach: use Net::DNS::Packet directly for query parsing
    and response construction, with Protocol-7's own UDP socket event
    watcher. This gives full control over the event loop and avoids
    callback thread issues. Net::DNS remains the dependency for DNS
    protocol parsing; the socket and dispatch layer is custom.

## -----------------------------------------------------------------------
## phase 2: recursive resolution and dnssec (future)
## -----------------------------------------------------------------------

phase_2_recursive:
  motivation: >
    Some deployments need the nameserv zenka to also resolve external
    names (for LLM queries, outbound mail MX lookup, etc.) without
    depending on systemd-resolved or an external resolver. A caching
    recursive resolver built into the zenka eliminates that dependency
    and gives the network visibility into DNS queries made by other zenki.

  components:
    recursive_resolver:
      - follow referrals from root hints file (IANA root zone)
      - QNAME minimization for privacy (RFC 7816)
      - negative caching (NXDOMAIN, NODATA) per RFC 2308
      - configurable upstream forwarder as fallback

    dnssec_validation:
      - validate RRSIG / DNSKEY / DS chains for signed zones
      - trust anchor for root zone (RFC 5011 automatic update)
      - AD bit set in responses to stub resolver when chain valid
      - DNSSEC signing of hosted zones (phase 2b, offline key workflow)

    nameserv_integration:
      - nameserv.cfg.mode = authoritative | recursive | hybrid
      - hybrid: authoritative for local zones, recursive for others
      - local zones always take priority over upstream answers
      - resolver cache exposed: nameserv.flush-cache, nameserv.cache-stats

## -----------------------------------------------------------------------
## dynamic dns: home node reachability
## -----------------------------------------------------------------------

dynamic_dns:
  motivation: >
    Protocol-7 nodes running at home or on private networks have
    dynamic public IPs. Without a VPS hop or when a VPS hop has
    failed, direct reachability depends on knowing the current IP.
    Dynamic DNS lets home nodes register their current address with
    the authoritative nameserv, making them directly reachable by
    name from anywhere. Supports the full range of use cases from
    fully public routed networks down to partial configurations:
    single home node with no VPS, multiple nodes with intermittent
    hops, and IPv6-only home connections with stable prefixes.

  node_registration:
    - each Protocol-7 node has a stable node identity (Curve25519 key)
    - nodes register a subdomain: <node-id>.nodes.domain.com
    - registration authenticated by signing update request with node key
    - nameserv verifies signature against known node public key
    - on success: A (IPv4) and/or AAAA (IPv6) records written for node
    - short TTL on dynamic records: 60s (fast propagation on IP change)
    - SOA serial auto-incremented on each update

  update_protocol:
    p7_native: >
      preferred path: home node sends nameserv.update-address command
      over existing Protocol-7 session (if any route to server exists).
      command carries: node-id, new IP(s), timestamp, signature.
      no extra protocol needed when P7 connectivity is available.

    http_fallback: >
      when no P7 session is available (VPS down, not yet connected):
      node sends HTTP POST to a dedicated endpoint on httpd:
        POST /api/dns/update
        body: { node_id, ip4, ip6, timestamp, signature }
      httpd.cmd.dns-update routes to nameserv.update-address internally.
      enables IP registration from a basic curl/wget script with no
      Protocol-7 binary required on the home node side.

    dyndns_compat: >
      optional: expose RFC 2136 DNS UPDATE (dynamic DNS standard)
      or dyn.com-compatible HTTP API (/nic/update?hostname=&myip=)
      for compatibility with existing home router DDNS clients.
      most consumer routers support dyn.com protocol natively,
      requiring no custom software on the home network.

  commands:
    - nameserv.update-address <node-id> <ip4> [ip6] [signature]
      registers or updates address record for a node
    - nameserv.list-nodes
      shows all registered nodes, their current IPs, and last-seen time
    - nameserv.node-status <node-id>
      current IP, TTL, last update timestamp, online/stale state
    - nameserv.remove-node <node-id>
      deregisters a node (admin command, signed)
    - nameserv.add-node-key <node-id> <pubkey>
      registers a node's public key for future update authentication

  stale_detection:
    - nodes must refresh their record within nameserv.cfg.ddns_refresh_ttl
      (default: 300s) or record is marked stale
    - stale records kept in zone but flagged: NXDOMAIN not returned
      immediately (allows reconnection within a grace period)
    - nameserv.cfg.ddns_stale_grace = 3600s: after this, record removed
    - stale-node event emitted: other zenki can react (e.g. routing tables)

  ipv6_preference: >
    home nodes often have stable IPv6 prefixes (provider-assigned /64)
    even when IPv4 is dynamic. AAAA records updated alongside A records.
    when both present, IPv6 preferred by resolvers (standard behavior).
    allows IPv6-native direct connectivity even when IPv4 NAT changes.

  netfilter_integration: >
    when nameserv.update-address is called with a new IP for a known
    node, nameserv emits node-address-changed event. netfilter zenka
    can subscribe and update whitelist rules (e.g. knock whitelist,
    trusted-source rules for admin ports) automatically when a home
    node's IP changes. closes the loop: DNS and firewall stay in sync
    with actual node location.

  partial_use_case_support:
    no_vps: >
      home node registers IP directly via HTTP fallback to the server.
      other nodes resolve the subdomain to reach the home node directly.
      no routing hop needed; only the authoritative DNS server required.

    vps_down: >
      if the VPS hop fails, nodes that have cached the dynamic DNS entry
      (short TTL ensures freshness) can fall back to direct IP connection.
      home node continues refreshing its DNS record independently.
      system degrades gracefully: loses routing hop, retains direct reach.

    nat_traversal_hint: >
      dynamic DNS does not solve NAT traversal for inbound connections.
      supplementary: node can publish its external port mapping via TXT
      record (e.g. mapped port from UPnP or manual forward) alongside
      its A record. resolvers read TXT to determine connection port.
      future: integrate with a STUN-like zenka for NAT traversal assist.

  configuration:
    nameserv.cfg.ddns_enabled       = 1
    nameserv.cfg.ddns_zone          = nodes.domain.com
    nameserv.cfg.ddns_record_ttl    = 60      ## seconds
    nameserv.cfg.ddns_refresh_ttl   = 300     ## node must refresh within
    nameserv.cfg.ddns_stale_grace   = 3600    ## seconds before removal
    nameserv.cfg.ddns_http_endpoint = 1       ## enable httpd integration

## -----------------------------------------------------------------------
## network topology dns: p7 resource and branch discoverability
## -----------------------------------------------------------------------

network_topology_dns:
  motivation: >
    DNS is the natural discovery layer for a distributed Protocol-7
    network. Beyond home node registration, the nameserv zenka can
    serve as a topology registry: Protocol-7 network branches, service
    endpoints, checksum-addressed resources, and resource groups are
    all published in DNS. Any node that can resolve the authoritative
    zone immediately discovers the current network layout without
    requiring a central coordinator. Discoverability is passive and
    decentralized; the DNS zone IS the topology map.

  p7_network_branches:
    - each Protocol-7 branch (cluster of zenki) registered as SRV records:
        _p7._tcp.branch-name.nodes.domain.com SRV 10 1 7777 host.domain.com
    - priority and weight fields used for load distribution and failover
    - multiple SRV records per branch name = redundant endpoints
    - branch health: nameserv removes SRV record when branch stops
      responding (health check integration with infra zenka)
    - client discovery: nodes query SRV for branch name to find entry points

  checksum_based_resource_addressing: >
    Protocol-7 resources identified by AMOS7 checksum can be published
    in DNS as TXT records under a content-addressed subdomain:
      <checksum>.res.domain.com TXT "p7-resource v=1 size=<n> copies=<n>"
    resolvers query the checksum subdomain to discover which nodes hold
    the resource and how many copies exist. combined with SRV records
    pointing to serving nodes, enables checksum-routed content delivery
    without a central index. resource groups (sets of related resources)
    published as additional TXT records linking group checksum to member
    checksums.

  load_balancing_dns:
    - multiple A/AAAA records per service name: standard DNS round-robin
    - weighted round-robin via TTL tuning: lower TTL on preferred nodes
      causes resolvers to refresh more often, naturally biasing traffic
    - health-checked records: infra zenka calls nameserv.remove-record
      on health check failure; nameserv.set-record on recovery
    - nameserv.cfg.lb_mode = round-robin | weighted | failover
    - failover: only first healthy record returned until primary recovers

  commands_extension:
    - nameserv.register-branch <name> <host> <port> [priority] [weight]
      publishes SRV record for a Protocol-7 branch endpoint
    - nameserv.deregister-branch <name> <host>
      removes SRV record (called on graceful shutdown or health failure)
    - nameserv.register-resource <checksum> <host> [size] [copies]
      publishes TXT record for a content-addressed resource
    - nameserv.list-branches: all registered branch SRV records
    - nameserv.list-resources: all checksum-registered resources

## -----------------------------------------------------------------------
## integration summary
## -----------------------------------------------------------------------

integration_matrix:
  letsencr:
    - dns-01 challenge: nameserv.set-record + nameserv.remove-record
    - wildcard certs become possible via dns-01
    - letsencr waits for dns propagation before notifying ACME
  httpsd:
    - vhost add/remove triggers corresponding A/AAAA record changes
  postfix:
    - MX records managed via nameserv.set-record
    - SPF / DKIM TXT records added during postfix setup
  netfilter:
    - node-address-changed event triggers firewall whitelist update
    - home node IP changes propagate to netfilter knock whitelist
  events:
    - SOA serial auto-increment on zone change (event-driven)
    - zone-changed and node-address-changed events emitted on mutation
    - stale-node event emitted when ddns_refresh_ttl exceeded

verification:
  phase_1:
    - dig @localhost example.com A returns correct IP
    - nameserv.set-record creates TXT record visible to dig within 1s
    - nameserv.remove-record deletes record, NXDOMAIN returned after
    - letsencr dns-01 challenge completes end-to-end (wildcard cert)
    - nameserv.reload-zones picks up new zone file without restart
    - multiple concurrent UDP queries answered without event loop stall

  dynamic_dns:
    - nameserv.update-address registers node, A record visible in dig within 1s
    - unauthenticated update rejected (wrong or missing signature)
    - HTTP fallback: curl POST /api/dns/update updates record correctly
    - dyn.com-compat: router DDNS client updates record on IP change
    - stale detection: record flagged after ddns_refresh_ttl, removed after grace
    - node-address-changed event delivered to netfilter within 1s of update
    - IPv6 AAAA record updated alongside A record when both provided
    - direct connection to home node succeeds after VPS hop simulated down

  phase_2:
    - dig @localhost google.com A resolves via recursive path
    - DNSSEC validation: dig +dnssec returns AD bit for signed domains
    - cache flush: nameserv.flush-cache clears entries, next query re-resolves
    - hybrid mode: local zone answers authoritative, external recursive

