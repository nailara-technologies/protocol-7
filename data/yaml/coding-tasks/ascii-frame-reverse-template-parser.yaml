task_id: ascii-frame-reverse-template-parser
title: ascii.frame.* — reverse template parser + elastic frame renderer
priority: high
estimated_rounds: 30

signatures_note: |
  Module files end with a 4-line AMOS7 signature footer starting with #,,,
  IGNORE these lines completely — they are auto-generated by the signing system
  and must not be modified or investigated. Focus only on the code above them.
  New files must NOT include any signature stub — leave them clean.

goal: |
  Implement the ascii.frame.* namespace: a reverse template parser that takes
  ASCII art mockup strings and produces Perl hash descriptors with elastic frame
  rendering routines. The core idea is that the frame border characters ARE the
  layout schema — parsing them gives you both structure and rendering rules.

  The frames serve two roles:
    1. LLM-facing context windows — style IS function; a well-framed block needs
       no additional explanation; grouping and proximity communicate structure
    2. Terminal output — rendered to nshell, amos-term, p7c output

  This is the foundation for a unified memory zenka and structured LLM UIs.

p7_frame_character_set: |
  Protocol-7 uses a specific character vocabulary for frames. These are the
  ONLY characters that belong to the UI structure (everything else is content):

    :   vertical border / horizontal fill run
    .   soft corner, bottom-right style  ( ]:. )
    ,   soft corner, top-right style     ( ]:, )
    [   open label bracket
    ]   close label bracket
    #   hard bottom border anchor (full-width rule: #:::::::)
    =   separator rule (variant of horizontal fill)

  Color rendering (terminal) is by character type:
    :   → protocol purple/blue
    [ ] → cyan label brackets
    .   → soft endpoint color
    ,   → soft endpoint color
    #   → anchor/hard border color
    content between [ ] → highlighted label text

  Reference frame (from bin/ptd output):
    :
    :::[:::::::::::::]:::[ title here ]:.
    :

  The :::[ ]:::[ ]  pattern = fill run + anchor + fill run + label + corner.
  Multiple label sections in one border line are valid.

two_pass_parse_algorithm: |
  ## pass 1 — skeleton detection ##

  Scan the ASCII art line by line:
    - Identify corner characters: determine frame boundary box
    - Identify top border line: runs of : between [ ] anchors and corner chars
    - Identify bottom border line: #:::... or ::::... run with corner
    - Identify left/right border: single : at start/end of content lines
    - Content region: everything inside the border envelope
    - Label sections: text between [ ] in the border lines (fixed anchors)
    - {{SLOT}} markers: anywhere in content or border labels

  ## pass 2 — elasticity encoding ##

  Encode each border segment as a sequence of typed elements:
    fill($char)    — elastic: stretches to fill required width
    anchor($str)   — fixed: literal string, never stretched
    slot($name)    — variable: rendered from slot hash, inline in border

  Example — top border:  :::[:::::::::::::]:::[ {{TITLE}} ]:.
  Encodes as:
    [ fill(':'), anchor(':::[:::::::::::::]:::[ '), slot('TITLE'), anchor(' ]:.') ]

  Width elasticity: driven by max( content_width ) across all rendered rows,
    where content_width = sum of prefix + slot_value + padding within the row.
  Height elasticity: driven by block-type slots that contain multi-line content.

frame_descriptor_structure: |
  The parse output is a Perl hashref:

  {
    border => {
      top    => [ ...typed elements... ],   ## elastic top rule
      bottom => [ ...typed elements... ],   ## elastic bottom rule
      left   => ':',                        ## fixed left border char
      right  => ':',                        ## fixed right border char
    },
    corners => {
      top_right    => '.',   ## or ','
      bottom_right => '.',
      top_left     => ':',
      bottom_left  => '#',   ## or ':'
    },
    width  => 'auto',        ## or integer (fixed)
    height => 'auto',        ## or integer (fixed)
    min_width => $n,         ## computed from fixed anchors
    padding => { left => 2, right => 1 },   ## content padding inside border
    slots  => {
      TITLE  => { region => 'border.top', type => 'inline' },
      STATUS => { row => 2, prefix => '  status: ', type => 'field', width => 'auto' },
      MODEL  => { row => 3, prefix => '  model:  ', type => 'field', width => 'auto' },
      BODY   => { row => 5, type => 'block', height => 'auto' },
    },
    static_rows => {         ## non-slot content rows (fixed text between borders)
      4 => '  --------  ',
    },
  }

modules_to_implement: |
  ## ascii.frame.parse ##
  Input:  ASCII art string (the mockup)
  Output: frame descriptor hashref (see above)
  Steps:
    - split into lines
    - detect border lines (top/bottom) by P7 character density
    - detect border columns (left/right) as single : at consistent positions
    - extract content region
    - parse border lines into typed element sequences (fill/anchor/slot)
    - scan content lines for {{SLOT}} markers, record row + prefix + suffix
    - detect block slots ({{SLOT...}} or multi-line placeholder)
    - compute min_width from fixed anchor lengths
    - return descriptor hash

  ## ascii.frame.render ##
  Input:  frame descriptor hashref + slot values hashref
  Output: rendered ASCII art string, all slots filled, borders stretched

  Steps:
    - compute required_width = max( prefix + slot_value_len + suffix + padding )
      across all field slots, clamped to min_width from descriptor
    - render top border: walk typed element sequence, fill() → repeat char
      to (required_width - sum_of_fixed_lengths), others literal
    - for each content row:
        left_border + left_padding + prefix + slot_value_padded + right_padding + right_border
        block slots: expand into multiple rows, grow frame height
    - render bottom border: same elasticity logic as top
    - join all rows with \n

  ## ascii.frame.slot.bind ##
  Input:  frame descriptor, slot name, scalar ref
  Output: updates descriptor to hold a ref binding for that slot
  Purpose: live-update path — when the scalar is updated, re-render produces
           new frame without re-parsing. The scalar ref IS the content binding.

  ## ascii.frame.compose ##
  Input:  outer frame descriptor + slot name + inner frame descriptor
  Output: combined descriptor where the named slot's width/height constrains
          the inner frame's dimensions (inner fits inside outer content area)
  Purpose: nested frames — a frame inside a frame, widths reconciled automatically

  Note: compose is the meta-level feature. The inner frame's required_width
  becomes the slot width constraint in the outer frame. Nesting is recursive.

integration_notes: |
  ## context.template integration ##
  A template section's provider can call ascii.frame.render and return the
  framed string as its result. The template's budget system then truncates
  if needed. This means any context template section can be frame-wrapped
  without changing the template plumbing.

  ## nshell / terminal integration ##
  ascii.frame.render output is a plain string — it goes directly into any
  reply buffer. No special terminal support needed. Color rendering is a
  separate pass (terminal.color.apply or amos-term's decoder) that maps
  P7 frame characters to ANSI sequences by character class.

  ## memory zenka (future) ##
  The unified memory zenka will use ascii.frame templates to wrap each
  memory section (user profile, feedback, project state) into a labeled
  frame, composing them into a single framed context window. The frames
  make structure self-evident to the LLM — no prose explanation needed.

implementation_guidance: |
  Start with ascii.frame.parse — it is the foundation.
  Write a small test: parse the ptd-style frame mockup, print the descriptor,
  then call ascii.frame.render with sample slot values and verify the output.

  The parse logic is the interesting part: the elasticity detection must handle:
    - multiple [ label ] anchors on a single border line
    - fill runs of varying length (the ::: runs between anchors are hints
      about minimum fill width, not fixed)
    - borders with NO label (just :::::::::::)
    - borders with label only on left or only on right
    - frames with no bottom border (open-bottom style)
    - {{SLOT}} inside a border label (inline slot in border)

  Keep the parser purely string-based — no regex that assumes fixed width.
  Use index() and substr() for positional logic where possible. The parse
  output must be serializable (no coderefs in the descriptor — encode
  rendering rules as data, generate the render coderef at render time).

meta_encouragement: |
  [ a direct invitation to kimi ]

  You are implementing a system that is itself a framing tool. Use it.

  As you work, define the task status frame as an ascii.frame mockup early:

    :
    :::[:::::::::::::::::::::::::::::::::::::]:.
    :  task:    ascii.frame.* implementation   :
    :  module:  {{CURRENT_MODULE}}             :
    :  status:  {{STATUS}}                     :
    :  note:    {{NOTE}}                       :
    #:::::::::::::::::::::::::::::::::::::::::::

  Parse it with the module you're building. Render it with real values at
  each milestone. Include the rendered frame in your output at each step.

  Then nest it — put a slot inside it for a sub-frame showing parse state:

    :
    ::[:  parse state   :]:.
    :  lines:   {{LINES}}  :
    :  slots:   {{SLOTS}}  :
    ::::::::::::::::::::::::

  Compose the two. Show the outer frame containing the inner frame.
  This is both a test of the implementation and a demonstration of the
  style-as-function principle: the framed output needs no explanation.

  Be strategic. The compose module proves the parser is correct more
  thoroughly than any unit test could.

