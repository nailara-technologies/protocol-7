## Why Now & Why Worth It

### Lesson From The Bug
Two routing mechanisms fighting (string prefix + buffer append) showed that:
- Workarounds become maintenance burden
- Mixing abstraction levels creates subtle bugs
- Proper architecture scales better

### Payoff
- **Elegance**: 'select' emerges from session model, not special case
- **Flexibility**: All zenka benefit, not just nshell
- **Simplicity**: Single routing mechanism (session-level), not two
- **Robustness**: No more protocol error handler abuse
- **Foundation**: Enables more complex multi-hop topologies later

### Team Bandwidth Consideration
- This is properly scoped as a coding task
- Not something to "do on the side" while generating other code
- Fits in the WIP branch already isolated for nshell infrastructure work
- Clear phases allow incremental progress

