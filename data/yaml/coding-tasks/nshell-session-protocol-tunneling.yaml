## Risk Mitigation

### Risk: Session tunneling adds complexity to base.handler.command
**Mitigation**: Complexity is managed (routing logic isolated), benefits all zenka

### Risk: Performance impact from tunneling
**Mitigation**: Measure carefully, optimize before committing, keep optimization path open

### Risk: Backward compatibility with existing code
**Mitigation**: 'select' command continues working unchanged, migration is gradual

### Risk: Multiple zenka affected by changes
**Mitigation**: Changes to base.* modules, extensive testing before merge

