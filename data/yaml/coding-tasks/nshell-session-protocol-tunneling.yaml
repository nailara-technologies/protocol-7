- [ ] protocol-7-menu benefits from unified routing

**Integration:**
- [ ] Real hardware, Xvfb, Xephir all addressable identically
- [ ] Window layout history distributed
- [ ] All special-case display mode code removed
- [ ] Complete documentation of graphical patterns

