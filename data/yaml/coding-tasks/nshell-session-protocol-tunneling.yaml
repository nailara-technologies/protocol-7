description: |
  Implement protocol-level session tunneling and distributed resource buffers as foundation for
  unified management of shells and graphical desktops across all platforms (Linux, Windows, macOS).
  Enable safe, capability-based access for zenka and LLM agents through template-filtered access trees.
  Eliminate distinction between local and remote shells, between different display modes (host/Xvfb/Xephir),
  and between different operating systems. Resolve nshell technical debt while laying groundwork for
  comprehensive infrastructure automation with built-in security context. Phase 1 focuses on shell
  infrastructure; Phase 2 applies identical principles to graphical desktops.

---

## Background & Vision

### The Goal: Unified Multi-Platform Shell Management
Enable any shell on any OS (Linux, Windows, macOS) to be:
- Addressed identically through protocol-7 routing
- Accessed through safe, capability-based templates
- Used by zenka and LLM agents with built-in constraints
- Managed through distributed session buffers at protocol level

**Key insight**: Safety comes from filtering at protocol layer, not restricting shell access.
- Administrator powershell remains powerful
- But zenka/LLMs interact through template-filtered command trees
- Even accidental damage prevented by capability abstraction
- LLMs get partial access without worrying they could break things

### Current Limitations
1. **OS-specific shell management**: Each OS needs different handling
2. **No distributed buffers**: Session history stuck at single endpoint
3. **No safe abstraction layer**: Direct shell access vs. capability-based access
4. **Workaround infrastructure**: nshell uses error handlers + direct buffer append
5. **No unified addressing**: 'select' is string-level hack, not proper routing

### Identified Bug (Feb 2026) - Symptom of Architecture Gap
When 'select httpd' active + user input causes state change:
- p7-log.append command routed to httpd instead of p7-log zenka
- Dual route ID prefix corrupts message: `(415059)(731779)p7-log.append ...`
- Root cause: mixing string-level prefix hacking with protocol-level buffer append

### Why Fix This Now
- Foundation needed for cubic space topology mapping (already starting)
- Enables Windows integration via socat (cmd.exe/powershell.exe as protocol-7 sessions)
- LLM safety model depends on capability abstraction at protocol level
- With LLM support, complex unified design is now tractable
- Postponed concepts (relative/absolute routing, context trees) converge here

---

## Proposed Solution: Unified Shell Infrastructure

### Three-Layer Architecture

#### Layer 1: Distributed TTY Buffers
**Purpose**: Session history/state management at protocol level, not OS-specific
- Buffers exist as first-class protocol-7 objects
- Can be mounted to any session, local or remote
- Accessible from multiple route points (distributed)
- History moves with session, not stuck at endpoint
- Example: powershell session keeps history accessible from both Windows node AND management zenka

#### Layer 2: Session Protocol Tunneling
**Purpose**: Make any shell (Linux/Windows/macOS) addressable identically
- Transparent one-hop routing (local shell looks same as remote shell)
- Sessions own their routing context (relative/absolute addressing)
- 'select' command emerges naturally (just changes session context)
- Works for all zenka communication, not just user input
- Removes error-handler abuse workaround

#### Layer 3: Capability-Based Command Filtering
**Purpose**: Safe access for zenka/LLMs without restricting shell power
- Template-based command trees define "what can be executed"
- Security context-aware filtering applies policies per user/agent
- Administrator shells behind capability abstraction, not restriction
- LLM agents work with constrained interfaces by design
- Accidental damage prevented by abstraction, not by limiting access
- Works identically across all platforms

### Complete Picture
```
Windows Machine          Linux Machine          macOS Machine
  ↓                        ↓                        ↓
cmd.exe/powershell      bash/zsh               bash/zsh
  ↓                        ↓                        ↓
[Capability Tree]  [Capability Tree]    [Capability Tree]
  ↓                        ↓                        ↓
[Session Protocol Tunneling Layer]
  ↓
[Distributed TTY Buffers] (history accessible from anywhere)
  ↓
[Zenka/LLM Agents] (see all shells as identical, work through templates)
```

### Integration Points
- **socat**: Bridge Windows shells (cmd.exe/powershell.exe) to protocol-7 sessions
- **Process reuse**: First process spawns task-specific children (cheap on Windows)
- **Template system**: Security policies as data, not code
- **Cubic topology**: Shell sessions are nodes in cubic addressing space

