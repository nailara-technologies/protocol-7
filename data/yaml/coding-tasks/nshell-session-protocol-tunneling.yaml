## Implementation Phases

### Phase 1: Analysis & Design
**Effort**: 2-3 hours
**Blocker**: None
**Enables**: Phase 2

#### Task 1.1: Trace current session routing
- How sessions currently handle message routing
- How base.handler.command manages command prefixes
- Where 'select' state lives in the session model
- How protocol-7.send.local works vs. direct buffer append

Implementation notes:
- Read: base.session.init, base.handler.command
- Document: Session data structure, handler invocation flow
- Identify: Points where 'select' state needs to be passed

Acceptance criteria:
- Clear diagram of session → message → handler flow
- Understanding of where routing decisions happen
- Identified integration points for tunneling

#### Task 1.2: Design transparent tunnel protocol extension
- How to represent "tunnel to different zenka" in session context
- Protocol changes needed (minimal)
- How namespace inheritance works (child sessions)
- Error handling for tunnel failures

Implementation notes:
- Design: Session contains "routing namespace" field
- Behavior: Messages automatically tunnel through session chain
- Migration: How existing code can opt-in to tunneling

Acceptance criteria:
- Documented protocol extension (1-2 pages)
- Session model changes clearly specified
- Migration path from workaround to proper solution defined
- Risk analysis for backward compatibility

### Phase 2: Infrastructure Implementation
**Effort**: 4-6 hours
**Blocker**: Phase 1 completion
**Enables**: Phase 3

#### Task 2.1: Extend session data structure
- Add routing namespace field to session context
- Implement namespace inheritance for child sessions
- Document new session fields and initialization

Implementation notes:
- Modify: base.session.init (add namespace parameter)
- Update: Session data structure docs
- Backward compat: namespace defaults to current zenka

Acceptance criteria:
- Sessions track routing namespace
- Child sessions inherit/override parent namespace
- All existing sessions continue working

#### Task 2.2: Implement protocol tunneling in base.handler.command
- Detect when message needs tunneling (namespace != local)
- Route through proper zenka chain transparently
- Handle tunnel failures gracefully

Implementation notes:
- Modify: base.handler.command routing logic
- Add: Tunnel negotiation with intermediate zenka
- Handle: Error cases (tunnel unavailable, permission denied)

Acceptance criteria:
- Messages tunnel to correct zenka when namespace set
- Errors reported properly
- No performance regression for non-tunneled messages

#### Task 2.3: Update session initialization to set namespace
- When session created, set initial routing namespace
- For nshell: namespace defaults to 'cube' (not 'nshell')
- Allow namespace switching without creating new session

Implementation notes:
- Modify: nshell session init
- Add: Command to change routing namespace (replaces 'select')
- Document: Namespace context inheritance

Acceptance criteria:
- nshell sessions correctly initialize namespace
- Namespace can be changed dynamically
- System commands (logging) reach correct zenka

