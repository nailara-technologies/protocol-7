## Architecture Philosophy & Vision

### Why This Matters
This infrastructure unifies heterogeneous infrastructure (Windows, Linux, macOS) under a single management model:
- **Slim trunk**: Terminal I/O → route → command handling
- **Safe abstraction**: Capability trees instead of direct shell access
- **LLM-friendly**: Agents get safe, constrained interfaces by design
- **Unifies precedents**: Converges relative/absolute routing, context trees, 'select' into coherent whole

### Safety Model Innovation
Rather than restricting access to keep systems safe:
- **Grant full access** through filtered capabilities
- **Let administrators be powerful** but through abstraction layers
- **Prevent accidental damage** with template constraints
- **Enable LLM agents** without worrying about capability misuse
- **Works the same** across all platforms

### Connection to Broader Work
- **Cubic space topology**: Shell sessions become nodes in routing hierarchy
- **Distributed buffers**: History accessible from multiple route points
- **Template system**: Security policies as declarative data
- **Management zenka**: Can interact with infrastructure uniformly
- **LLM groups**: Have safe, structured access to managed systems

### Parallel: Graphical Desktop Unification (Phase 2)

This shell infrastructure mirrors upcoming work on distributed graphical desktops. The same principles that make shells manageable across platforms will unify graphical access.

#### Current State: X-11 Modes & Infrastructure

**Display Modes:**
- **'host'** - Direct access to real hardware display (physical monitor)
- **'Xephir'** - Nested X server (X11 window running inside another X session)
- **'Xvfb'** - Virtual framebuffer (headless, accessible via VNC/SPICE)

**Related Zenka:**
- **openbox** - Window manager (handles window placement, decorations, focus)
- **Layer management zenka** - Controls window layer stacking and spatial layout
- **protocol-7-menu** - Menu system (transitioning from kiosk-focused to flexible user desktops)

**Current Limitations:**
- Each display mode handled separately (host/Xephir/Xvfb as distinct code paths)
- Session state not distributed across display modes
- Window history/layout not accessible from management plane
- Protocol-7-menu (and by extension nshell) treats graphical access as special case
- No safe capability filtering for graphical operations (full access or none)

#### Vision: Unified Graphical Desktop Infrastructure

Same three-layer architecture as shell infrastructure:

**Layer 1: Distributed Frame & Session Buffers**
- Frame buffer accessible as protocol-7 resource (not tied to display hardware)
- Window layout history and state distributed
- Session state (open windows, positions, focus) replicated across access points
- Example: User can start desktop on 'host', pause, resume on 'Xvfb', switch back seamlessly

**Layer 2: Display Mode Tunneling**
- Real hardware → Xvfb → Xephir all appear identically to clients
- Transparent switching between display modes (mode parameter in session context)
- Desktop sessions own their display mode (can switch transparently)
- Works for all zenka communication, not just user interaction
- Removes special-case handling for different display modes

**Layer 3: Graphical Capability Filtering**
- Template-based window/command access (parallel to shell command trees)
- Security context-aware window access (who can see/interact with which windows)
- LLM agents interact with GUI through constrained capability trees
- Example: LLM can navigate menu system but cannot move system tray
- Works identically across all display modes

#### Integration with Shell Infrastructure

**nshell zenka** will benefit directly:
- nshell terminal window becomes protocol-7 session object
- Terminal multiplexing uses same session routing as shell routing
- User can 'select' between terminal windows and graphical contexts using same mechanism
- Terminal history and layout distributed alongside shell session history

**protocol-7-menu zenka** will become unified resource:
- Menu (whether text-based in terminal or graphical in desktop) uses same routing
- Menu commands deliver to same action handlers regardless of display mode
- Menu session and shell session can be bridged through unified routing

#### Concrete Example: User Workflow

```
User boots into Debian (native Linux host)
  ↓
Runs: p7 protocol-7-menu (launches protocol-7-menu zenka)
  ↓
protocol-7-menu can run in:
  - Text-mode in nshell (terminal)
  - Graphical mode on real hardware (Xvfb → hardware bridge)
  - Nested mode within existing desktop (Xephir)
  ↓
User selects 'Windows VM' from menu
  ↓
KVM Windows session appears as protocol-7 resource
  ↓
User can now:
  - Access Windows powershell through nshell (shell tunneling)
  - View Windows desktop through graphical UI (graphical tunneling)
  - Both shells and windows addressable identically through protocol-7 routing
  ↓
User pauses work, switches to laptop
  ↓
On laptop: p7 protocol-7-menu connects to same infrastructure
  ↓
Session state restored (same windows visible, same shells available)
    ↓
Work continues seamlessly (display mode transparently handled)
```

#### Phase 2 Implementation Structure

Will parallel Phase 1-4 shell infrastructure work:

**Phase 1**: Analyze current X-11/openbox/layer-management interaction
**Phase 2**: Extend session model with frame buffer distribution
**Phase 3**: Implement display mode tunneling, migrate from mode-specific code paths
**Phase 4**: Remove special-case handling, document graphical patterns

**Related Existing Code:**
- `modules/X-11.*` - Current X11 mode handling
- `modules/openbox.*` - Window manager integration
- `modules/protocol-7-menu.*` - Menu zenka (benefits from unified routing)
- `modules/nshell.*` - Terminal zenka (will integrate with graphical context)

#### Why Both Together?

Shells and desktops follow identical abstraction:
1. Multiple backends (shells: bash/zsh/powershell | displays: host/Xvfb/Xephir)
2. Session ownership (every shell/desktop is a protocol-7 resource)
3. Distributed buffers (history/state accessible from anywhere)
4. Capability filtering (safe access through templates)
5. Unified routing (select between them identically)

**The convergence**: Both emerge naturally from protocol-7's core abstraction - **any resource becomes addressable, manageable, and safe**.

#### Concrete Use Case: Windows 11 Virtualization + Debian Host

User has:
- Real Debian host (native OS, ready for Linux work)
- Windows 11 VM (KVM, accessible for Windows applications)

With unified infrastructure:
- **Shell access**: Debian bash and Windows powershell through same nshell interface
- **Graphical access**: Debian desktop and Windows desktop through same graphical menu
- **Resource sharing**: File systems and data accessible uniformly
- **Session continuity**: Pause work on host, resume on Windows VM, back to Debian - seamlessly

This is the **practical realization** of heterogeneous infrastructure management - not a theoretical exercise.

#### Success Criteria - Graphical Phase

**Foundation:**
- [ ] Display mode abstraction designed (real/Xvfb/Xephir as session parameter)
- [ ] Frame buffer distribution designed
- [ ] Window/desktop capability system designed

**Implementation:**
- [ ] Layer 1: Distributed frame buffers working
