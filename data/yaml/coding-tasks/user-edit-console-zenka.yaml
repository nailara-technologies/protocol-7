phase_1_skeleton:
  motivation: >
    `keys` is structurally the right clone base: a 24-line `start` file
    that loads modules and drops straight into console_command, no
    access.* files, minimal source/ placeholders. None of its CONTENT is
    reusable — its 30 keys.console.* command modules and pm-dep set
    (Curses::UI, Term::Clui, Crypt::*) are key-management-specific.
  clone_steps:
    - configuration/zenki/user-edit/start
      modules.load = terminal editor ascii.frame user-edit
      [ drop crypt.C25519 entirely — this zenka has no key-management
        role; if it needs to identify the operator it uses the existing
        session/auth identity, not a standalone key load ]
    - configuration/zenki/user-edit/pm-dep/
      keep only what terminal/editor/ascii.frame actually require —
      audit against keys' 30-module pm-dep list rather than copying it
      wholesale; most of it (Crypt::Ed25519, Digest::BMW, Compress::Raw::Lzma)
      is C25519/checksum-specific and unused here
    - configuration/zenki/user-edit/source/ — placeholders per loaded module
    - new modules/user-edit.* namespace (or user-edit-console.* — pick one;
      keys.console.* precedent suggests <zenka-name>.console.* subcommands
      if an interactive console mode is wanted in addition to the form)
  boot_checklist: >
    follow the two operational checklists already in memory —
    feedback-ondemand-zenka-start-checklist.md (start file shape, cube
    auth.zenki grant, access.cmd.usr.cube grant) and
    feedback-new-zenka-boot-checklist.md (grant → p7c reload → p7c
    v7.reload → p7c v7.start_once → show-buffer verification sequence)
    — both already reference real, live-verified gotchas for this exact
    kind of new-zenka bring-up.

  CORRECTION_needed_2026_08_10_FIXED: >
    fixed same day, pending sign+commit. configuration/zenki/user-edit/
    start now loads auth.client/net/protocol/io.unix, sets
    system.auth-user = <user-edit.unix_user> (resolved in
    user-edit.init_code, corrected there too — see below), and calls
    [base.net.connect:'unix'], mirroring nshell/start closely (skips
    [base.get_session_id] for the same reason nshell does — Unix-user
    auth, not a cube session). source/ placeholders added for the four
    new namespaces (auth, auth.client, net, protocol, io.unix — auth
    included even though only auth.client is in modules.load, matching
    nshell's source/ set exactly). base.call.console_command's one-shot
    CLI-dispatch ending kept as-is — nshell's persistent zenka.loop +
    stdin-watcher machinery is phase_3's concern, not this fix's scope.
    SEPARATE finding, also fixed: user-edit.init_code's HOME_N keyword
    was resolving ~/.n via a raw AMOS7::FILE::get_homepath() perlmod
    call — user pointed out base.get_homedir already exists as the
    P7-native wrapper for this, used by crypt.C25519.get_usr_keys_dir
    for this exact ~/.n purpose. Switched to base.get_homedir($requested
    _user), requested_user being <user-edit.unix_user> (now resolved
    before the path-keyword block, not after).
  CORRECTION_needed_2026_08_10_original_note: >
    per user direction: the phase 1 skeleton as ALREADY COMMITTED
    (0fee40f7c) is incomplete — it has NO network connectivity at all
    (modules.load = terminal editor ascii.frame user-edit, no
    auth.client/net/protocol/io.unix, no [base.net.connect:'unix']),
    because it was cloned from `keys`, which is intentionally a fully
    standalone/offline tool. That was fine for phases 1b/outbox/draft
    (pure local file I/O), but user-edit will need to reach the users
    zenka's users.* command surface once 5PN exists, and per user
    direction it is NOT currently a "hybrid zenka" (protocol-7-menu's
    shape: standalone-startable AND v7-startable AND network-connected —
    the v7-startable part is explicitly NOT needed yet) — what it needs
    is nshell's shape: console-only [ human-invoked directly, no v7
    lifecycle management ], but network-connected to reach other zenki.
    read configuration/zenki/nshell/start in full — it is the concrete
    precedent to follow for the network-connectivity retrofit:
      - modules.load needs auth.client/net/protocol/io.unix added
        [ nshell: "auth.client net protocol io.unix ui ascii format.yaml
        editor nshell" — user-edit's equivalent drops nshell-specific
        pieces, keeps the net stack ]
      - system.auth-user = <user-edit.unix_user> [ nshell's pattern:
        authenticate as the invoking Unix user, not a zenka credential —
        fits a personal interactive console; means [base.get_session_id]
        is correctly SKIPPED, same as nshell explicitly skips it ]
      - [base.net.connect:'unix'] — the actual connection call, currently
        entirely absent from user-edit's start file
    this is a real gap in already-landed work, not a future nice-to-have
    — flagging it now before phase_3 gets built assuming connectivity
    that doesn't exist yet. Needs its own follow-up dispatch/fix to
    configuration/zenki/user-edit/start (and likely pm-dep/source
    placeholders for the newly-added modules) before phase_3 can do
    anything real with users.*.

## -----------------------------------------------------------------------
## phase 1b: path discovery — register roots, don't hardcode them
## -----------------------------------------------------------------------

phase_1b_path_discovery:
  motivation: >
    user-edit needs to know about more than one filesystem root: the
    zenka_dir pair (var_P7/user-edit, etc_P7/user-edit) it gets for
    free like any zenka, PLUS home-relative roots such as ~/.n/ — which
    already exists today as a real, live convention for per-user data
    (crypt.C25519.get_usr_keys_dir: ~/.n/user-keys, key_vars:
    ~/.n/remote-keys/authorized, create-session-seed-file: ~/.n/enc-entropy)
    — PLUS whatever additional roots show up later. This is not a
    problem to solve locally: base.path.register_keywords /
    base.path.resolve_keywords / base.path.to_keywords already IS a
    generic named-path-root registry, used elsewhere today
    (workspace-transfer.pre_init registers a keyword set from env at
    pre_init) — a zenka calls register_keywords({ NAME => path, ... })
    once, then resolve_keywords('[NAME]/rest/of/path') anywhere. Per
    user direction: this is base infra several zenki already lean on,
    configurably — user-edit should be a consumer of it, not a second
    implementation.
  what_this_zenka_registers: |
    at minimum, mirroring what base.file.zenka_dir.* already exposes
    plus the one convention it does NOT cover:
      VAR_P7   -> <system.path.zenka-dirs.var_P7>/user-edit   [ existing,
                  via base.file.zenka_dir.load/write — register as a
                  keyword too so path strings can use [VAR_P7] uniformly
                  rather than mixing keyword-resolved and zenka_dir-style
                  paths in the same module ]
      ETC_P7   -> <system.path.zenka-dirs.etc_P7>/user-edit   [ ditto ]
      HOME_N   -> ~/.n                                        [ NOT
                  currently a registered keyword anywhere — every
                  consumer today hardcodes sprintf( '%s/.n/...', $home )
                  independently (crypt.C25519.get_usr_keys_dir,
                  session.console.setup-keys, p7-auth-keypair-helper.pl,
                  p7-tofu-helper.pl). registering it once here doesn't
                  require touching those call sites, but it means
                  user-edit's own path-building doesn't repeat the same
                  hardcoding a fourth time ]
    additional roots: registered the same way, as they're identified —
    the point of using register_keywords is that the list is open-ended
    by construction, not a fixed enum this design has to fully specify.
  reads_and_writes_through_format_yaml: >
    every path this zenka resolves via [KEYWORD]/... should be read/
    written through modules/format.yaml.* (load_keyword_path already
    calls base.path.resolve_keywords internally — it's the direct
    read-side counterpart to this phase; write_file is the equivalent
    write-side call), not a bespoke YAML::XS or File::Slurp call site.
    see local_edit_outbox and draft_auto_save below, both updated to
    use format.yaml.* directly.
  not_in_scope_here: >
    migrating the four existing ~/.n/ hardcoders to use the keyword
    registry is a separate, optional cleanup — not required for this
    zenka to function, and not this design's call to make unilaterally
    since those call sites belong to crypt.C25519 / session / standalone
    helper scripts outside user-edit's namespace.

## -----------------------------------------------------------------------
## amos-term plugin system overlap — check before building phase 2/3
## -----------------------------------------------------------------------

amos_term_plugin_overlap: >
  per user direction: amos-term now has a general, hot-reloadable plugin
  system (amos-term.plugin-init_code, landed 42ba2e636/854c23d34) with
  FIVE hook types registered in <amos-term.plugin-types>: decoder
  (buffer.decode), routing (event.route), render (render.frame), input
  (input.key), and interaction (agent.query — ask-user flow with
  timeout-degrade-to-observation and a GTK window-open path, built for
  the coding-zenka fallback-chain). At least three of these bear
  directly on what this design already proposes:
    - render hook (render.frame) vs phase_2_rendering's proposed
      editor.ui.ascii_frame backend
    - input hook (input.key) vs editor.control.process_key
    - interaction hook (agent.query, ask_user_stream, timeout-degrade,
      GTK-degrade-when-no-display) vs this doc's submit/draft
      confirmation prompts (see draft_auto_save's restore-UX question) —
      worth checking whether amos-term.interaction.ask is reusable there
      once a GUI backend exists, instead of writing a bespoke prompt.
  RESOLVED (2026-08-10, per user): BOTH will exist, not either/or —
  terminal-first, GUI second, sequenced not competing:
    - user-edit itself: terminal/console, matching the keys precedent
      exactly. Phase 2 targets editor.ui.ascii_frame — ascii.frame.*
      only, no amos-term dependency — full stop, this is the near-term
      implementation target.
    - a GUI backend (GTK3-class) is real, planned, and NOT speculative —
      amos-term is the identified closest fit for it (its plugin system
      already has the render/input hooks and a GTK window-open path via
      the interaction plugin type), to be added as an ADDITIVE second
      editor.ui.* backend later, per the interface doc's existing
      terminal/gtk3/vterm backend-swappable design — not a replacement
      for the terminal path.
    - amos-term's role here is bigger than user-edit specifically: per
      user direction, it's intended as the general vehicle for OTHER
      settings-related UIs/forms too, not a one-off integration for this
      zenka alone. Don't design amos-term hooks narrowly around
      user-edit's exact needs when that work eventually starts.
    - users zenka (5PN) is HEADLESS — no UI of any kind, terminal or
      GUI. It's pure backend authority (storage/discovery/key-authority).
      This overlap section and its render/input/interaction questions
      apply to user-edit only, never to 5PN.
  practical effect: phase_2_rendering below can proceed now, scoped to
  ascii.frame.* / editor.ui.terminal only. The amos-term GUI backend is
  a separate, later phase (not yet named/scoped in this doc) — when it
  starts, check amos-term.plugin-render/plugin-input/plugin-interaction's
  actual call shape before building against it, and keep it additive to
  editor.ui.* rather than a fork of the field-schema/editor.control.*
  layer everything else already shares.

## -----------------------------------------------------------------------
## phase 2: rendering — ascii.frame.* as editor.ui.* backend
## -----------------------------------------------------------------------

phase_2_rendering:
  motivation: >
    ascii.frame.* (modules/ascii.frame.*, 23 files) is an existing
    mockup-driven layout engine: parse a text mockup into a frame
    descriptor (ascii.frame.parse / from_mockup), bind scalar refs to
    named slots for live updates (ascii.frame.slot.bind), compose nested
    frames (ascii.frame.compose), and render to either ascii-art terminal
    output or HTML (ascii.frame.render / render.html). This was not
    accounted for in editor-namespace-interface-design.yaml's editor.ui.*
    section [ which only names terminal/gtk3/vterm ] — it is a strong
    fourth backend candidate, specifically well-suited to forms: a
    settings mockup with one named slot per field, each slot bound to
    that field's live buffer value.
  proposed_backend: |
    editor.ui.ascii_frame — new editor.ui.* backend implementing the
    render_field / render_form / update_cursor / refresh_display contract
    from the interface doc, by:
      - loading a per-schema mockup ( ascii.frame.load / from_mockup ),
        one slot per schema field, named to match field name
      - render_form: ascii.frame.slot.bind each field's current value,
        then ascii.frame.render — reuses the existing renderer wholesale,
        no new drawing code
      - active_field focus indicator: either a slot-value convention
        [ e.g. bracket/highlight marker prepended by editor.ui.ascii_frame
          before binding, not by ascii.frame.* itself — ascii.frame stays
          focus-agnostic ] or a dedicated marker slot per field
      - the HTML render path (ascii.frame.render.html) is a free second
        UI surface for the same form/mockup — worth keeping in mind if a
        browser-facing settings page is ever wanted, without a rewrite
  open_question: >
    does ascii.frame's slot model cleanly support cursor position display
    within a field's live value [ needed for editor.ui.* per the interface
    contract's update_cursor call ], or does that require ascii.frame
    changes too? not yet checked against ascii.frame.render's actual
    column math — verify before committing to this as the sole backend.

## -----------------------------------------------------------------------
## phase 3: form definition and submission
## -----------------------------------------------------------------------

phase_3_form:
  motivation: >
    Once phase 0-2 land, the console itself is thin: define a schema,
    create() it, loop process_key, submit() on completion, stage then
    push values to the users zenka. Per users_zenka_relationship, host-
    system/ is the canonical store — schema field defaults are populated
    FROM a users.* get call, and submit values are pushed THROUGH a
    users.* set call — but per local_edit_outbox, every submit is staged
    to var_P7/user-edit/ FIRST, commit-to-users-zenka second. Exact
    users.* command names are 5PN's to define; this doc treats them as
    an integration point, not a spec.
  sketch: |
    CORRECTED (2026-08-10): NOT a blocking "read key" loop — user-edit
    needs concurrent keyboard input AND network I/O (users.* replies,
    external_source_hooks' deferred cmd_reply completions) running
    through the same event loop, exactly like nshell already does.
    mirror nshell.setup_stdin_watcher's shape: event.add_io on fd 0,
    poll=>'r', repeat=>TRUE, handler=>a user-edit shell-loop-equivalent
    module — NOT a synchronous read() call anywhere in the flow.

    user-edit.console.start [ after base.net.connect per the
      CORRECTION_needed_2026_08_10 note in phase_1_skeleton above ]:
      $schema = { fields => [ ... per-setting field defs, types TBD per
                               setting ... ], submit_on => 'explicit_key:F2' }
      # field defaults populated from users.<get-command> before create()
      $editor_state = editor.control.create($schema)
      [user-edit.setup_stdin_watcher] -> event.add_io registers
        user-edit's key-handler module on fd 0 [ mirrors
        nshell.setup_stdin_watcher exactly ]
      per keystroke event: editor.control.process_key -> dispatch action
        -> write into the watched field-value scalar [ see
        display_update_trigger below — this write is what fires the
        base.event.add_var re-render watcher, not a direct render call
        here ]
      on submit: editor.control.submit($editor_state) -> { ok, values }
                 -> write values to var_P7/user-edit/ outbox [ durable,
                    unconditional — see local_edit_outbox ]
                 -> attempt users.<set-command>( values )  [ command
                    name: 5PN's to define ]
                 -> on success: mark/remove outbox entry
                 -> on failure/offline: leave staged, retry later
                    [ retry_mechanism: open question ]
  display_update_trigger: >
    per user direction: use base.event.add_var (a real, established P7
    primitive — Event->var() under the hood, watches a scalar ref, fires
    a handler on write; live precedent: jobqueue.event.register_job_queues
    watches a counter scalar, poll=>'w', fires jobqueue.handler.
    queue_counter on every write) rather than manually calling
    editor.ui.ascii_frame.render_form after every mutation site by hand.
    This unifies two distinct triggers under one mechanism: a normal
    keystroke edit (editor.control.commands.insert/delete writing into a
    field's buffer) AND an async external resolution completing (5PN's
    external_source_hooks — a key-generation or data-lookup reply
    arriving and updating a field's value out-of-band, well after the
    keystroke that originally triggered it) both just need to WRITE the
    watched scalar; the watcher fires the re-render either way, so the
    render call site doesn't need to know which case triggered it.
    NOT YET DESIGNED: exactly which scalar(s) to watch — per-field value
    scalars individually, or one coarser "form dirty" flag scalar that
    render_form's caller watches once — and whether editor.control.*'s
    buffer internals expose a stable scalar ref suitable for this
    (editor.buffer.memory's storage shape needs checking, not assumed).
    Not required for phase_2's already-landed render_form/render_field
    (they render on demand when called). UPGRADED from "additive" to
    LOAD-BEARING for phase_3, per the event-driven correction to
    phase_3_form's sketch above: since keyboard input now arrives via
    event.add_io rather than a blocking loop, there is no natural
    "just re-render after the read() returns" point left in the flow —
    the watcher IS the mechanism that connects a keystroke's write to
    the field buffer with an actual screen redraw, not an optional
    convenience on top of a simpler loop that could do it directly.
  validators: >
    per-field validator hooks already exist in the schema shape
    ($field->{validator}) — use them for setting-specific constraints
    (e.g. log level must be one of a fixed set) rather than validating
    post-hoc after submit.

## -----------------------------------------------------------------------
## verification
## -----------------------------------------------------------------------

verification:
  phase_0:
    - editor.control.create() accepts a 2+ field schema without error
    - Tab/Shift-Tab produce field_next/field_prev only when fields > 1
    - active_buffer() returns the correct field's buffer ref after navigation
  phase_1:
    - zenka boots via the standard checklist, reaches show-buffer-visible state
    - no crypt.C25519 / Curses::UI / Term::Clui pm-deps remain in pm-dep/
  phase_1b:
    - register_keywords called once at pre_init/init_code with at least
      VAR_P7/ETC_P7/HOME_N; resolve_keywords round-trips a [KEYWORD]/path
      string to the correct absolute path for each
  phase_2:
    - a 2-field mockup renders via ascii.frame with live slot values
    - focus indicator visibly moves on field_next/field_prev
  phase_3:
    - full loop: navigate fields (values pre-populated via users.* get),
      edit a value, submit, confirm value reaches the users zenka via
      users.* set [ exact command surface blocked on 5PN's design ]
    - offline case: users.* set unreachable at submit time -> outbox
      entry persists in var_P7/user-edit/ across a zenka restart ->
      once reachable again, staged entry commits and is cleared
      [ retry trigger mechanism itself is an open question below ]
  draft_auto_save:
    - periodic checkpoint writes a non-empty draft; an idle tick with no
      changes does not rewrite the file [ mpv.snapshot.write precedent ]
    - killing the zenka mid-edit still leaves a draft on disk [ end_code
      callback fired ]; killing it with -9 (SIGKILL, unblockable) may
      lose up to one checkpoint interval — acceptable, same tradeoff
      mpv accepted
    - restart with a pending draft present -> draft reappears in the
      form per restore_on_startup's chosen UX

open_questions:
  - RESOLVED: runtime surface is terminal-first (ascii.frame.*, no
    amos-term dependency), with an amos-term-hosted GTK3-class GUI
    backend planned as an additive second editor.ui.* backend later —
    see amos_term_plugin_overlap above. phase_2 below proceeds against
    terminal only.
  - GUI backend scoping (amos-term-hosted editor.ui.gtk3-equivalent) —
    not yet its own phase/task, deliberately deferred until the
    terminal path (phase 2/3) is real; when it starts, remember amos-
    term's role is general infrastructure for settings UIs broadly, not
    user-edit-specific — don't narrow the plugin hooks to this zenka's
    exact shape
  - users.* command surface for get/set of a user's editable fields —
    5PN's to define; this console just needs the names/args once they
    exist
  - retry_mechanism for the local edit outbox: event-driven (fires on
    reconnect / users zenka becoming reachable) vs periodic timer vs
    only-on-next-console-launch — not yet decided, and it determines
    whether this zenka needs a background timer at all outside active
    console sessions
  - conflict handling: if host-system/'s record changed elsewhere
    between staging and eventual commit of an offline edit, does submit
    win, lose, or prompt — not addressed yet, only matters once
    retry_mechanism exists
  - draft restore UX: auto-load a found draft silently, or prompt
    "restore unsaved draft? y/n" — mpv's restore_on_startup is a bare
    boolean auto-restore, but a settings form overwriting live fields
    silently on launch may be more surprising than a paused video
    resuming; lean prompt unless there's a reason not to
  - draft_save_interval_seconds default for the periodic BACKSTOP timer
    only — the primary trigger is field-transition (decided, see
    draft_auto_save), so this default matters less than mpv's did;
    anything in the tens-of-seconds range is probably fine as a backstop
  - ascii.frame cursor-position support (phase_2 open_question)
  - masked field type: does any target setting need it for v1, or can it
    wait
  - is a bare interactive console mode (user-edit.console.* commands,
    mirroring keys.console.*) wanted alongside the form, or is the form
    the only interface
  - does user-edit ever need to browse/edit anything under HOME_N
    directly (vs. everything routing through users.* per
    users_zenka_relationship) — e.g. is remote-keys/authorized ever
    user-edit's concern, or strictly crypt.C25519/keys territory

