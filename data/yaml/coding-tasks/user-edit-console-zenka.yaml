task_metadata:
  title: "user-edit console zenka — interactive settings editor over editor.control.*"
  description: >
    A new zenka, cloned in skeleton-shape from `keys` (thin standalone
    console zenka, not key-management content), that presents a
    multi-field form for editing a user's settings and writes the
    submitted values back to wherever user settings actually live. Uses
    editor.control.* for field state/keystroke handling and ascii.frame.*
    for layout/rendering, instead of hand-rolling either.
  priority: normal
  category: "new-zenki"

overarching_theme: >
  per user direction: read everything in this doc as also laying
  groundwork for a GUI-and-terminal-capable INSTALLER workflow — built
  from the same independently usable elements, not as a monolith that
  only works wired into user-edit specifically. This reframes, rather
  than replaces, what's already designed:
    - editor.control.* (field state/keys), ascii.frame.* / amos-term
      render+input plugins (rendering), the path registry
      (base.path.register_keywords), and the outbox/draft-save pattern
      are ALL already being designed as standalone primitives, not
      user-edit-internal helpers — this theme confirms that was the
      right instinct and raises the bar on it: each piece should be
      callable/testable on its own, an installer step (or any other
      future form) reuses them directly, not through user-edit as a
      dependency.
    - scope widens from "a user's settings" to "user AND system
      [host-local or remote] settings" — i.e. the same field-schema +
      submit/outbox machinery this doc specifies for host-system/
      user records may also need to target host-local system config
      and, via 5PN's remote/ discovery+key-authority layer, REMOTE
      system settings too (installer-style: configuring a node you're
      not sitting at). Not designed here — flagging that user-edit's
      backing command surface may end up being "users.* for user
      records, something-else.* for system config," both driving the
      identical editor.control/ascii.frame/outbox stack, rather than
      user-edit being permanently user-records-only.
    - GUI-and-terminal-capable directly motivates
      amos_term_plugin_overlap's open question (below) rather than
      settling it: an installer plausibly needs BOTH a terminal path
      (ascii.frame, no amos-term dependency, works over SSH/serial) and
      a GUI path (amos-term window, render/input plugins) for the exact
      same field schema — which argues for editor.ui.* staying backend-
      swappable (already the design, per the interface doc's
      terminal/gtk3/vterm split) rather than picking one now.
  not scoping an installer zenka here — no todo item exists for one yet.
  this section exists so implementation of user-edit's pieces is done in
  a way that doesn't foreclose that reuse, not so this doc grows into an
  installer design. worth its own todo/design file when it's time.

related_precedent_set_up_zenka: >
  there is already a real installer-adjacent zenka: `set-up`
  (configuration/zenki/set-up), renamed from `settings`
  (commit 089844a94, "renamed agent : 'set-up' <-- 'settings'").
  set-up.cmd.create-profile / install-profile / export-config /
  fetch-zenka-config manage named PROFILES — whole-zenka-config JSON
  snapshots, captured from /etc/protocol-7/import and installed to
  set-up.profile_dir, exported/fetched per zenka. This is real,
  file-granularity installer machinery: bundle/replay a set of zenka
  configs as a unit. It is a DIFFERENT granularity than what user-edit/
  users(5PN) do — set-up moves whole JSON config blobs per zenka;
  user-edit edits individual fields within one user's record — so this
  is not redundant with anything designed so far, but it IS part of the
  same "installer workflow" the overarching_theme above names, and
  worth knowing about before any future installer design assumes it's
  starting from nothing.
  per user direction: the rename freed the `settings` name for a
  DIFFERENT, still-planned zenka — not set-up's successor, a distinct
  future thing. Its relationship to 5PN (users zenka, host-system/
  canonical storage) and to this doc is NOT decided and must not be
  assumed: does the future `settings` zenka SUBSUME what 5PN was just
  designed to own (canonical local settings storage), making 5PN's
  host-system/ actually settings zenka's storage rather than users
  zenka's? Or is `settings` scoped to something else entirely (e.g.
  set-up's profile JSON, given the name history) leaving 5PN's design
  untouched? Do not build against either assumption — when a `settings`
  design file exists, reconcile it against users-zenka.yaml (5PN)
  explicitly before either implementation proceeds.

set_up_format_gap: >
  per user direction: set-up's profile system is JSON-only
  (set-up.json.*, import_dir/profile_dir all handle .json) — it is
  "missing a yaml expansion." User's own call: that gap can wait until
  a previously-planned GENERIC CONVERSION PARSER exists, rather than
  set-up growing bespoke YAML handling now.
  found, per user follow-up: two references, neither a scoped converter
  spec.
    1. data/md/design/CONCEPT-DATA-ZENKA-ARCHITECTURE.md:271 — a single
       bullet ("Transformations: On-the-fly format conversion
       (JSON→YAML)") listed as one illustrative use case for CODE-ref
       lazy transformers inside that doc's much larger "data zenka"
       vision (a FUSE-mounted %data-as-filesystem fabric — indexer +
       checksums + cubic topology + native FS access). That doc's own
       "Current State" section says "Stub exists" — data.init_code
       (File::ExtAttr autoload) plus two unimplemented command stubs
       (data.cmd.mount-cube, data.cmd.attach-fs-mount).
    2. data/md/investigation/yaml/YAML-AS-GATEWAY-FORMAT.md — a full
       standalone philosophy doc, but its actual argument is NOT
       "build a JSON↔YAML converter." It argues signed YAML (YAML +
       AMOS7 signatures) should BE the canonical gateway format for
       specifications entering Protocol-7 in the first place — XML is
       "maximum bloat," JSON is "bracket hell," YAML is what aligns
       with the project's bloat-avoidance philosophy — with a
       yaml-validator-style zenka reading signature-verified YAML and
       executing/enforcing it as a contract. No JSON→YAML conversion
       mechanism is scoped anywhere in it; the framing is "arrive as
       signed YAML," not "convert into YAML."
  so there is no scoped "generic conversion parser" project anywhere in
  the repo — correcting the earlier framing above ("a known planned
  dependency, spec pending"): what actually exists is (a) one
  illustrative bullet in a stub-only vision doc, and (b) a philosophy
  argument that set-up's own JSON profiles are arguably already on the
  wrong side of Protocol-7's stated format preference, which cuts
  against "wait for a converter" and toward "set-up's profile format
  should move to signed YAML directly, when it's time" — the opposite
  direction from a JSON→YAML bridge. Neither doc gives set-up's gap a
  near-term unblock; recorded here as context, not as something to
  build against.
  origin + direction, per user: set-up's JSON focus dates back to a
  kiosk-appliance-era subsystem, years old — not a deliberate current
  preference, a historical holdover. Project direction going forward:
  minimize JSON generally; where no Protocol-7-native format exists yet
  for a given use, YAML is the sane fallback — consistent with
  YAML-AS-GATEWAY-FORMAT.md's stated philosophy above.
  CORRECTION, per user follow-up: there is no near-term-unblock problem
  at all — modules/format.json.* (encode/decode/init_code, JSON::XS-
  backed) and modules/format.yaml.* (load_str/dump_str/load_file/
  write_file/load_keyword_path, YAML::XS-preferred-with-pure-YAML-
  fallback via format.yaml.pre_init) are ALREADY symmetric, shared,
  ready-to-use modules — not something set-up or anyone else has to
  build. format.yaml.load_keyword_path even calls
  base.path.resolve_keywords directly — the exact mechanism phase_1b
  below already specifies for VAR_P7/ETC_P7/HOME_N. So: no converter,
  generic or otherwise, is a real dependency for anything in this doc
  or 5PN. Withdrawing the earlier "no near-term unblock in sight" line
  above — it was wrong; format.yaml.* already IS the unblock, today.
  Net effect for this doc and 5PN: use format.yaml.write_file /
  format.yaml.load_keyword_path directly for host-system/,
  remote/{incoming,outgoing}/, and local_edit_outbox/draft_auto_save's
  persistence — not a bespoke YAML::XS Load/Dump call site each, per
  the earlier protocol-7-menu.position.save-style sketch. That module
  hand-rolled its own YAML::XS Load/Dump because format.yaml.* may not
  have existed yet when it was written (or simply predates the
  convention) — this doc should use the shared module, not repeat that
  pattern.
