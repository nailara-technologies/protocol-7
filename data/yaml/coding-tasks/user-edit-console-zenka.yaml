  field_types_needed: >
    enum (dropdown-style settings, e.g. log level, theme) and masked
    (credentials/secrets fields, if any settings are secret) are named in
    the editor schema but interface-only stubs. A settings form is the
    first realistic consumer of both — check at design time whether any
    target setting is enum-shaped or secret-shaped, since that determines
    whether those stubs must be filled before this zenka's first release
    or can wait for a later field.
  no_settings_data_format_exists: >
    grepped repo-wide: there is no "user settings" storage format today.
    modules/USR.<user>.* holds only public keys (3 files total, all
    base-key). There is nothing resembling a settings mask, profile
    record, or per-user config tree to bind editor fields to. Per
    users_zenka_relationship below, this format is owned and designed by
    5PN (users zenka), not here — this zenka only needs to know the
    users.* command surface it calls through, once 5PN defines it.

users_zenka_relationship: >
  RESOLVED (2026-08-09, per user); full spec now in
  data/yaml/coding-tasks/users-zenka.yaml (5PN). Split (a). The users
  zenka (5PN) is
  the canonical authority — it owns user data/settings storage (the
  records this console edits), distributed-discovery features for
  finding users/records across nodes, AND key authority for local
  zenki: when a zenka needs to contact a user or another zenki, it asks
  the users zenka to acquire/resolve the correct key, which then feeds
  routing directly. This means:
    - user-edit console has NO CANONICAL settings storage of its own —
      host-system/ (5PN) is the source of truth. It DOES need local
      durable staging for edits in flight, see local_edit_outbox below;
      that is not canonical storage, it's a write-ahead buffer for
      offline/transient-access resilience.
    - the data_model / storage format itself belongs in 5PN's design
      doc, not this one. This doc only needs the users.* command
      surface (get/set/list a user's editable fields) once 5PN defines
      it — treat that as this zenka's actual integration point.
    - key authority living in users zenka is a reason this zenka does
      NOT need crypt.C25519 itself (phase_1_skeleton already drops it,
      correctly) — key acquisition for anything this console needs is
      a users.* call, not a local key load.
    - discovery features (distributed lookup) are 5PN's concern; this
      console only ever edits records for the locally-authenticated
      user/session, it does not need to implement discovery itself.

local_edit_outbox: >
  per user direction: var_P7/user-edit/ should persist every edit as
  soon as it's made — WHETHER OR NOT the users.* commit has succeeded
  yet — so the console is offline-capable. Applying an edit depends on
  transient access (network to wherever users zenka resolves/commits
  the record, per 5PN's still-open discovery_integration question), so
  the local copy has to be durable independent of that path being up.
  this is a write-ahead OUTBOX, not a cache: it exists to survive a
  crash/restart/disconnect between "user typed it" and "users zenka
  confirmed it," not to duplicate host-system/ as a second source of
  truth. lifecycle:
    - on submit() ok=1 (phase 0/3): format.yaml.write_file the submitted
      values to a [VAR_P7]/user-edit/outbox/ path [ resolved via
      phase_1b's registered keywords, e.g. format.yaml.load_keyword_path's
      sibling write path — use the shared format.yaml.* module, not a
      bespoke YAML::XS Load/Dump call site ] BEFORE attempting the
      users.* set call — durability first, network second
    - attempt users.* set immediately after
    - on confirmed commit: mark/remove the outbox entry
    - on failure or no connectivity: entry stays, retried later — see
      retry_mechanism below (open question, not yet designed)
  this changes phase_1_skeleton's var_P7 usage from "default zenka
  scratch dir, incidental" to "load-bearing for the offline story" —
  worth calling out explicitly in implementation, not left implicit.

draft_auto_save: >
  per user direction: reuse the mpv zenka's state snapshot/restore
  pattern (commit bba7c09b3, mpv.snapshot.*) for the DRAFT — the
  in-progress, not-yet-submitted field values while the user is still
  editing. This is distinct from local_edit_outbox above: outbox covers
  values already submitted but not yet committed to users zenka; draft
  auto-save covers values not yet even submitted, so a crash/restart
  mid-edit (before F2/submit) doesn't lose keystrokes either. mirror
  mpv's actual mechanism, not just its intent — PLUS a second precedent
  that changes the trigger shape: protocol-7-menu's window-drag handler
  (graphical-startup-init) updates position in memory on every
  motion-notify-event tick [ cache only, no disk write ], and only
  calls protocol-7-menu.position.save on button-release-event, once the
  gesture is actually complete. That's the better model for a text
  field than a flat timer: a field is being actively typed in
  continuously [ like drag motion ], and the natural "gesture complete"
  boundary is leaving the field, not a fixed wall-clock interval.
  DECIDED, supersedes the earlier open question: trigger draft save on
  editor.control.process_key returning action=field_next/field_prev [
  i.e. on leaving a field ] and on end_code, not on a flat periodic
  timer. A short periodic timer MAY still be worth keeping as a backstop
  for a single-field schema or a very long stay in one field [ where
  field_next never fires ] — that's additive, not a replacement for the
  field-transition trigger:
    - field-transition trigger (primary), mirroring position.save on
      button-release: fires on action=field_next/field_prev
    - periodic backstop timer (secondary, optional), mirroring
      mpv.snapshot_interval_seconds (default 60s there) — a
      user-edit.draft_save_interval_seconds config var,
      format.yaml.write_file'd to [VAR_P7]/user-edit/draft/ alongside
      the outbox, same shared module as local_edit_outbox above
    - empty-state guard, mirroring mpv.snapshot.write's skip-if-empty:
      don't let a periodic tick overwrite a good draft with blank
      fields — same failure mode mpv hit and fixed in the same commit
    - restore_on_startup gate, mirroring mpv.restore_on_startup: on
      launch, if a draft exists, load it back into the form rather than
      starting blank — exact UX (auto-load vs prompt) is an open
      question below
  end_code callback for pre-exit flush, mirroring mpv.cmd.quit's
  graceful pre-quit snapshot.save: register via
  `push <callbacks.end_code>->@*, qw| user-edit.draft.save |;` per
  data/ai-mem/claude/feedback-zenka-shutdown-end-code-callback.md. The
  actual hazard that memory file documents is EVENT LOOP AVAILABILITY,
  not "network" as such — bin/Protocol-7's END block fires during Perl
  global destruction, after Event::loop has already stopped, so
  anything that needs the loop pumped again (a route-send followed by
  event.once to actually flush it, radio.end_code's segfault) is unsafe
  there. Plain filesystem writes are synchronous and need no loop at
  all, so they still work fine in that context — which is exactly why
  user-edit's draft save is safe as a bare end_code callback and
  radio's mpv-fade wasn't: the write itself isn't the risk, needing the
  loop afterward is.
  caveat, not a data-loss risk: `<[base.log]>`/`<[base.logs]>` calls
  made from inside this callback may themselves route through
  zenka-to-zenka logging (p7-log) or otherwise depend on the same
  stopped event loop — so a log line from user-edit.draft.save at exit
  time is best-effort, may not appear. That's a missing log message,
  not a lost draft: the file write happens independently of whether the
  log call actually got flushed anywhere. Worth a plain comment at the
  call site so a future reader doesn't mistake a missing exit-log line
  for the save having failed.
  do not follow the mpv precedent past this point: mpv ALSO needs a
  network-facing pre-quit path (fading the player), which is why
  mpv.cmd.quit's flow is more involved (deferred reply + 2s safety-net
  timer) than a plain end_code push — user-edit's draft save doesn't
  need any of that, a bare end_code callback suffices.

