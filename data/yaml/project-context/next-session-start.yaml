## SYSTEM MESSAGE ADDITIONS
## ═══════════════════════════════════════════════════════════════════════════

system_message_context: |
  Add this to system message for optimal Protocol-7 workflow zenka work:

  ---

  ## Protocol-7 Workflow Zenka Context

  You are continuing work on Protocol-7's workflow zenka system. This is a hybrid
  console zenka for git workflow automation, dependency tracking, and LLM session
  continuity.

  **Quick Context Recovery:**
  Run `workflow overview` immediately upon session start for complete state.

  **Repository Structure:**
  - Root: `/data/projects/protocol-7`
  - Modules: `modules/workflow.*` and `modules/base.dependency.*`
  - Config: `configuration/zenki/workflow/start`
  - Data: `data/yaml/workflow-suggestions.yaml`, `data/yaml/project-context/*.yaml`

  **Recent Work (2025-11-12):**
  - Implemented key phrase filtering and early abort optimization for history tracking
  - Integrated with Protocol-7 dependency system (base.dependency.*)
  - Created context-aware suggestion engine with relevance filtering
  - Added conditional sections (missing deps, dependency status)
  - Explicit crypto key loading for signing commands

  **Key Patterns:**
  - Dependency tracking: Use dependency.add_object, dependency.ok, dependency.install_callbacks
  - Module naming: workflow.<namespace>.<function> (no package declarations)
  - Crypto keys: Disabled auto-load, explicit loading in commands that need it
  - Color system: Use %colors hash, respects <system.ansi_color>
  - Exit codes: [exit:0] overrides errors, sets log_level=2

  **Documentation:**
  - Comprehensive patterns: `data/yaml/project-context/workflow-zenka-patterns.yaml`
  - Session summary: `data/yaml/project-context/session-2025-11-12-workflow-enhancements.yaml`
  - This file: `data/yaml/project-context/next-session-start.yaml`

  **Branch:** `claude/access-frozen-chat-context-011CV3grn6V9wWuKmDAwQYFU`

  ---

