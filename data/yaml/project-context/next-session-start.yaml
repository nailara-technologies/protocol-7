## ═══════════════════════════════════════════════════════════════════════════
## TROUBLESHOOTING GUIDE
## ═══════════════════════════════════════════════════════════════════════════

common_issues:

  crypto_key_warnings:
    symptom: "no read permission for key 'protocol-7.base.secret'"
    cause: "auto_load_keys was enabled, trying to load keys for read-only commands"
    solution: "Already fixed - crypt.C25519.auto_load_keys = no in workflow/start"

  deep_recursion_error:
    symptom: "<< EMERGENCY SHUTDOWN >> [ anticipated deep recursion in log system ]"
    cause: "Undefined values in %data hash accessed in log messages"
    solution: "Use // 0 or // {} for all data hash access, check for defined before using"

  git_path_error:
    symptom: "cd: can't cd to /home/user/protocol-7"
    cause: "git.cfg.repository_path set to wrong path"
    solution: "Already fixed - set to /data/projects/protocol-7 in workflow/start"

  dependency_not_found:
    symptom: "dependency.ok: object id 'X' not found"
    cause: "Dependency system not initialized before use"
    solution: "Call workflow.setup_module_dependencies before workflow.check_dependencies"

