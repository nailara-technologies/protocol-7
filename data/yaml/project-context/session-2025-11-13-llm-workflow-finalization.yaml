critical_bug_fixed:
  bug: "Signature Re-signing All Files"
  symptom: "Every commit was re-signing all 5000+ files instead of just modified ones"

  root_causes:
    - "Key swapping happened before validation, not during signing"
    - "Modified file detection was too broad"
    - "Only checked production key, not LLM dev key"

  solution:
    - "Restructured to keep keys in original slots during validation"
    - "Check both production AND LLM dev key signatures"
    - "Only swap keys during actual signing operation"
    - "Git-based modified file detection"

  impact:
    before: "5000+ files re-signed, several minutes per commit"
    after: "Only modified files without valid signatures signed, seconds per commit"

key_realizations:
  dual_key_validation_pattern:
    insight: "Must check BOTH keys before deciding to sign"
    reason: |
      Files can have valid signatures from either:
      1. Production key (user-signed, must preserve)
      2. LLM dev key (already signed this session, don't re-sign)
    implementation: |
      # Check production key
      if ( $prod_key_loaded ) {
          my $valid_with_prod = <[source.signature_valid]>->($file_path, $sig_key_name);
          $needs_signing = 0 if $valid_with_prod;
      }

      # Check LLM dev key
      if ( $needs_signing ) {
          my $valid_with_llm = <[source.signature_valid]>->($file_path, $test_key_name);
          $needs_signing = 0 if $valid_with_llm;
      }

  key_swapping_timing:
    insight: "Swap keys ONLY during signing, not during validation"
    reason: "Validation needs keys in their proper slots to work correctly"
    pattern: |
      # 1. Keep keys in original slots during validation
      $prod_key = $keys{'C25519'}{$sig_key_name};
      $llm_key = $keys{'C25519'}{$test_key_name};

      # 2. Validate with keys in original slots
      <[source.signature_valid]>->($file_path, $sig_key_name);  # Production
      <[source.signature_valid]>->($file_path, $test_key_name); # LLM dev

      # 3. Swap ONLY for signing
      my $original = $keys{'C25519'}{$sig_key_name};
      $keys{'C25519'}{$sig_key_name} = $keys{'C25519'}{$test_key_name};
      <[source.cmd.get-code-signed]>->($file_path);
      $keys{'C25519'}{$sig_key_name} = $original;

  path_auto_discovery:
    insight: "Use existing $data{'system'}{'root_path'} instead of FindBin"
    reason: "Workflow zenka already has root path discovery built-in"
    pattern: |
      my $root_path = $data{'system'}{'root_path'};
      my $workspace_repo = "$root_path/../workspace-transfer";
    benefits:
      - "Simpler than FindBin pattern"
      - "Uses existing infrastructure"
      - "Works consistently across all zenkas"

  git_modified_file_detection:
    insight: "Use git commands to detect modified files, not sourcecode.source_path_set_up"
    reason: "source_path_set_up returns ALL source files (5000+), not just modified"
    pattern: |
      git diff --name-only                    # Unstaged changes
      git diff --cached --name-only           # Staged changes
      git ls-files --others --exclude-standard # New files
    benefits:
      - "Only processes actually modified files"
      - "Respects git's understanding of changes"
      - "Performance: ~3 files vs 5000 files"

  module_loading_requirements:
    insight: "Must load AND initialize modules before using zenka functions"
    pattern: |
      <[base.load_modules]>->(qw| source amos7 sourcecode |);
      <[base.init_modules]>->(qw| source amos7 sourcecode |);
      <[sourcecode.init_code]> if exists $code{'sourcecode.init_code'};
    reason: |
      - load_modules: Loads module code into memory
      - init_modules: Initializes module state and dependencies
      - init_code: Module-specific initialization (e.g., sign_template)

architectural_insights:
  in_process_signing_advantages:
    approach: "Load modules and sign within same process"
    vs_subprocess: |
      OLD: system('./bin/Protocol-7', 'sourcecode', 'update-signatures')
      NEW: <[source.cmd.get-code-signed]>->($file_path)
    benefits:
      - "No subprocess overhead"
      - "Direct access to key hash for swapping"
      - "Can load production key for validation"
      - "Ctrl+C support without killing subprocess"
      - "Better error handling"

  trust_chain_model:
    phases:
      development:
        actor: "LLM"
        key: "LLM-dev.sourcecode"
        purpose: "Sign for transit and verification"

      verification:
        actor: "User"
        key: "LLM-dev.sourcecode (public)"
        purpose: "Verify LLM-signed files"

      acceptance:
        actor: "User"
        key: "proto-7.sourcecode (production)"
        purpose: "Re-sign after approval"

    security_model:
      - "LLM signatures are ephemeral (for verification only)"
      - "Production signatures indicate user approval"
      - "User must audit before accepting"
      - "LLM key compromise = low impact (only affects pending review)"

  smart_filtering_pipeline:
    stage_1: "Git change detection (modified/new files only)"
    stage_2: "Path filtering (Protocol-7 source files only)"
    stage_3: "Production signature check (preserve user-signed)"
    stage_4: "LLM dev signature check (avoid re-signing)"
    result: "Only files actually needing signatures get signed"

technical_patterns:
  key_management:
    pattern_name: "Persistent Unencrypted Development Key"
    implementation: |
      # Generate once, save to disk
      <[crypt.C25519.gen_keys]>->($test_key_name);
      <[crypt.C25519.write_keys]>->($test_key_name, undef, FALSE);

      # Load in subsequent sessions
      <[crypt.C25519.load_keypair]>->($test_key_name);

    benefits:
      - "Consistent signatures across session"
      - "No need to regenerate every time"
      - "Public key can be shared via git"

  automatic_export:
    pattern_name: "Automatic Public Key Export to Sibling Repository"
    implementation: |
      my $root_path = $data{'system'}{'root_path'};
      my $workspace_repo = "$root_path/../workspace-transfer";
      my $pub_key_export = "$workspace_repo/LLM-dev.sourcecode.pub";
      system('cp', $pub_key_file, $pub_key_export);

    benefits:
      - "User can import key from git"
      - "No manual key exchange needed"
      - "Automatic on every commit"

  dual_key_checking:
    pattern_name: "Check Both Keys Before Signing Decision"
    implementation: |
      # Try production key
      my $valid_prod = <[source.signature_valid]>->($file, $prod_key_name);
      $needs_signing = 0 if $valid_prod;

      # Try LLM dev key if production failed
      if ( $needs_signing ) {
          my $valid_llm = <[source.signature_valid]>->($file, $llm_key_name);
          $needs_signing = 0 if $valid_llm;
      }

    benefits:
      - "Preserves all valid signatures"
      - "Prevents signature oscillation"
      - "Respects user and LLM signatures"

