          impact: Attackers could spoof as <admin-user> template
          fix: Added assignment on line 46
      - unclear_return_codes:
          plugin: plugin.auth.unix
          issue: Returns FALSE instead of explicit 0 for success
          fix: Changed line 96 to return (0, $auth_user)
    files:
      - src/plugin.auth.zenka
