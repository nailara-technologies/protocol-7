## ═══════════════════════════════════════════════════════════════════════════
## INTEGRATION ARCHITECTURE OPTIONS
## ═══════════════════════════════════════════════════════════════════════════

option_analysis:

  option_1_http_microservice:
    name: "HTTP Microservice Bridge (Recommended)"
    description: |
      Create Python HTTP server running Whisper & Invoke separately.
      Protocol-7 modules make REST calls to Python services.

      Pros:
      - Minimal Protocol-7 changes (just HTTP client module)
      - Easy to debug (standard HTTP)
      - Can run services independently
      - Scales to multiple clients
      - Fits your "super-worm" network philosophy

      Cons:
      - HTTP overhead
      - Service startup/management needed
      - Network reliability issues (local socket mitigates)

      Implementation:
      - Python REST API server (Flask/FastAPI) running Whisper
      - Another for Invoke AI (or unified)
      - Protocol-7 module: audio.service.transcribe (HTTP POST to Python)
      - Protocol-7 module: image.service.generate (HTTP POST to Python)

    effort: "LOW (2-3 hours for basic wrapper)"
    credits_needed: "3-5%"

  option_2_ipc_socket_bridge:
    name: "Unix Domain Socket Bridge"
    description: |
      Direct Perl ↔ Python via Unix socket.
      More efficient than HTTP, similar to cube.handle pattern.

      Pros:
      - No HTTP overhead
      - Fits Protocol-7's existing socket architecture
      - Can handle streaming (useful for long transcriptions)

      Cons:
      - More complex Protocol-7 code
      - Requires custom protocol definition
      - Harder to debug

      Implementation:
      - Python process listens on /var/run/.7/audio.sock
      - Protocol-7 module: audio.parent.socket.connect
      - Streaming results similar to cube.handle model

    effort: "MEDIUM (4-6 hours)"
    credits_needed: "5-8%"

  option_3_subprocess_wrapper:
    name: "Subprocess Wrapper (Simplest Start)"
    description: |
      Perl spawns Python script directly, captures JSON output.
      Blocking call pattern, simplest to implement.

      Pros:
      - Absolutely minimal Python code needed
      - No service management
      - Fits simple console command pattern
      - Can start immediately

      Cons:
      - Blocking (can't handle multiple requests)
      - Subprocess overhead on each call
      - No streaming support

      Implementation:
      - Python script: ~/whisper-cuda/bin/whisper-wrapper.py
      - Protocol-7 module: audio.cmd.transcribe-file
      - Simple: fork + exec + capture output

    effort: "VERY LOW (1-2 hours)"
    credits_needed: "2-3%"

