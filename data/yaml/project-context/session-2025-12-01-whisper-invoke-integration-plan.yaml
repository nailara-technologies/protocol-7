## ═══════════════════════════════════════════════════════════════════════════
## PHASE 1: SUBPROCESS WRAPPER APPROACH (QUICKSTART)
## ═══════════════════════════════════════════════════════════════════════════

phase_1_design:

  file_structure:
    description: "Minimal additions to Protocol-7"
    files_to_create:
      - "src/audio.service.transcribe"
        purpose: "Calls Python Whisper wrapper via subprocess"
        interface: "$call = { audio_path, model, language }"
        returns: "{ success, transcript, detected_language, duration, model_used }"

      - "src/audio.cmd.transcribe"
        purpose: "Console command wrapper"
        interface: "shift -> file path from command line"
        returns: "Pretty-printed results to console"

      - "~/whisper-cuda/bin/whisper-wrapper.py"
        purpose: "Python bridge script"
        interface: "Command line args + JSON output"
        location: "Inside ~/whisper-cuda venv"

    files_to_modify:
      - "cfg/zenki/work/start"
        change: "Add audio module to modules.load"
        impact: "Minor - one line"

  module_implementation_patterns:

    audio_service_transcribe: |
      ## src/audio.service.transcribe
      ## Calls Python Whisper wrapper, returns JSON result

      my $call = shift || {};
      my $audio_path = $call->{'audio_path'} // '';
      my $model_size = $call->{'model'} // 'medium';
      my $language = $call->{'language'} // 'auto';

      # Validate file exists
      unless (-f $audio_path) {
          return {
              'success' => 0,
              'error' => "Audio file not found: $audio_path"
          };
      }

      # Call Python wrapper
      my $python_bin = "$ENV{'HOME'}/whisper-cuda/bin/python";
      my $wrapper = "$ENV{'HOME'}/whisper-cuda/bin/whisper-wrapper.py";

      my @cmd = (
          $python_bin,
          $wrapper,
          '--audio-file', $audio_path,
          '--model', $model_size,
          '--language', $language
      );

      my $json_output = `@cmd 2>&1`;

      # Parse JSON result
      my $json = JSON::XS->new();
      my $result = eval { $json->decode($json_output) }
          // { success => 0, error => "Failed to parse Python output: $json_output" };

      return $result;

    python_wrapper_skeleton: |
      #!/usr/bin/env python3
      # ~/whisper-cuda/bin/whisper-wrapper.py
      # Wrapper to call Whisper from Protocol-7

      import json
      import sys
      import argparse
      import whisper
      import torch

      parser = argparse.ArgumentParser()
      parser.add_argument('--audio-file', required=True)
      parser.add_argument('--model', default='medium')
      parser.add_argument('--language', default=None)
      args = parser.parse_args()

      try:
          device = "cuda" if torch.cuda.is_available() else "cpu"
          model = whisper.load_model(args.model, device=device)

          result = model.transcribe(
              args.audio_file,
              language=args.language if args.language != 'auto' else None,
              fp16=torch.cuda.is_available()
          )

          output = {
              "success": True,
              "transcript": result['text'],
              "language": result.get('language', 'unknown'),
              "duration": result.get('duration', 0),
              "model_used": args.model
          }
      except Exception as e:
          output = {
              "success": False,
              "error": str(e)
          }

      print(json.dumps(output))
      sys.exit(0 if output['success'] else 1)

  console_command_pattern:
    description: "audio.cmd.transcribe for command line use"
    usage: "work transcribe /path/to/audio.mp3 [model_size]"
    example: |
      [taeki] /data/projects/protocol-7 :. p7.work transcribe /tmp/test.wav medium

      ✓ Transcription complete
      ─────────────────────────────────────────────────────
