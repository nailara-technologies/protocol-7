## ═══════════════════════════════════════════════════════════════════════════
## PHASE 2: HTTP MICROSERVICE PATTERN (SCALING)
## ═══════════════════════════════════════════════════════════════════════════

phase_2_design:
  description: |
    Once Phase 1 works, upgrade to HTTP service for better performance
    and to handle Invoke AI integration.

  architecture:
    - "Python HTTP server running in separate process"
    - "Listens on http://localhost:7777 (configurable)"
    - "Protocol-7 modules make REST calls"
    - "Can serve multiple Protocol-7 zenka simultaneously"

  benefits:
    - "Non-blocking calls (could use event watchers)"
    - "Service can be restarted without restarting zenka"
    - "Scales to multiple clients"
    - "Same pattern for Invoke AI image generation"

  python_service_skeleton: |
    # ~/whisper-cuda/bin/audio-service.py
    from flask import Flask, request, jsonify
    import whisper
    import torch
    import json

    app = Flask(__name__)
    model = None

    @app.route('/transcribe', methods=['POST'])
    def transcribe():
        global model

        data = request.json
        audio_path = data.get('audio_path')
        model_size = data.get('model', 'medium')
        language = data.get('language', None)

        if model is None:
            device = "cuda" if torch.cuda.is_available() else "cpu"
            model = whisper.load_model(model_size, device=device)

        try:
            result = model.transcribe(
                audio_path,
                language=language,
                fp16=torch.cuda.is_available()
            )
            return jsonify({
                "success": True,
                "transcript": result['text'],
                "language": result.get('language'),
                "duration": result.get('duration')
            })
        except Exception as e:
            return jsonify({"success": False, "error": str(e)}), 400

    if __name__ == '__main__':
        app.run(host='localhost', port=7777)

  protocol_7_caller_module: |
    ## src/audio.service.http.transcribe
    ## Make HTTP call to Python service

    my $call = shift || {};
    my $audio_path = $call->{'audio_path'};

    use LWP::UserAgent;
    my $ua = LWP::UserAgent->new;

    my $response = $ua->post(
        'http://localhost:7777/transcribe',
        Content => JSON::XS->new->encode({
            audio_path => $audio_path,
            model => $call->{'model'} // 'medium'
        }),
        'Content-Type' => 'application/json'
    );

    return $response->is_success
        ? JSON::XS->new->decode($response->content)
        : { success => 0, error => $response->status_line };

