invoke_ai_integration:
  current_state: |
    Invoke AI running on Windows host at C:\Users\User\Invoke\
    Accessible from WSL at /user/Invoke/
    Has working models and configuration already in place

  integration_approach: |
    Option A: Use existing Windows installation via API
    - Invoke AI can expose HTTP API
    - Protocol-7 calls it like any other HTTP service
    - Shared model library avoids duplication

    Option B: Install native WSL version
    - Copy models from /user/Invoke to ~/invokeai-wsl
    - Use symlinks to save disk space
    - Better GPU performance (eliminate Windows overhead)
    - Can be done incrementally

  recommended_approach: "Option A (immediate) → Option B (later)"

  phase_1_action: "Document Invoke API endpoint patterns"
  phase_2_action: "Create image.service.generate module"

  example_module_invoke: |
    ## src/image.service.generate
    ## Calls Invoke AI HTTP service

    my $call = shift || {};
    my $prompt = $call->{'prompt'} // '';
    my $model = $call->{'model'} // 'sd15';

    use LWP::UserAgent;
    my $ua = LWP::UserAgent->new;

    my $response = $ua->post(
        'http://localhost:9090/api/v1/images/generate',
        Content => JSON::XS->new->encode({
            prompt => $prompt,
            model => $model,
            steps => $call->{'steps'} // 20,
            width => $call->{'width'} // 512,
            height => $call->{'height'} // 512
        }),
        'Content-Type' => 'application/json'
    );

    return $response->is_success
        ? JSON::XS->new->decode($response->content)
        : { success => 0, error => $response->status_line };

