## ═══════════════════════════════════════════════════════════════════════════
## THE RESULT: HUMAN + SYSTEM OPTIMIZATION
## ═══════════════════════════════════════════════════════════════════════════

collaborative_optimization: |
  System alone: Good at discovering patterns in data
  Users alone: Good at understanding context and goals

  System + Users together through visualization:
  - Users see patterns system found
  - Users contribute domain knowledge
  - Users validate system's conclusions
  - System implements user feedback
  - System learns from user validation

  Result: Accelerated improvement, higher trust, better outcomes

  Example workflow:
    1. System discovers: "Model A much faster for short questions"
    2. System visualizes: Shows clear pattern in dashboard
    3. User notices: "Yes! Short questions are my common use case"
    4. User suggests: "Route short questions to A, long to B"
    5. System implements: Changes routing rules
    6. System monitors: Shows improvement in user's common tasks
    7. User confirms: "Perfect! Exactly what I needed"
    8. System learns: "User context matters, weight short questions higher"

