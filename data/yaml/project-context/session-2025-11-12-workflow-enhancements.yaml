protocol7_patterns:
  
  dependency_system:
    overview: "Sophisticated tracking system used by v7, jobqueue, workflow"
    namespace: "base.dependency.* swapped to dependency.* via swap_subs"
    setup_steps:
      1: "Define callback: <namespace>.callback.object.<type>"
      2: "Register: dependency.install_callbacks('namespace')"
      3: "Create objects: dependency.add_object({...})"
      4: "Check status: dependency.ok($object_id)"
    
  crypto_keys:
    auto_load: "Set crypt.C25519.auto_load_keys = no to disable"
    explicit_load: "Use key_exists + load_keypair in commands that need keys"
    benefit: "Read-only commands avoid key loading overhead"
  
  file_operations:
    put_bin: "Use <[file.put_bin]>->($path, \\$content) to write files"
    slurp: "Use <[file.slurp]>->($path) to read files into scalar ref"

