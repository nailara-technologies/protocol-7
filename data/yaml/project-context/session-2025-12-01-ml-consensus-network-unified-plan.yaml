immediate_implementation:

  action_1_install_ollama:
    description: "Get local LLMs running"
    steps:
      - "curl https://ollama.ai/install.sh | sh"
      - "mkdir -p ~/ollama-models"
      - "OLLAMA_MODELS=~/ollama-models ollama serve"
      - "In another terminal: ollama pull mistral"
      - "Test: curl http://localhost:11434/api/generate -X POST -d '{\"model\":\"mistral\",\"prompt\":\"Hello\"}'"
    time: "10 minutes"
    credits: "< 0.5%"

  action_2_create_llm_service_module:
    description: "Wrapper module for Ollama queries"
    file: "src/llm.service.query"
    code_skeleton: |
      ## src/llm.service.query
      ## Query local LLM via Ollama

      my $call = shift || {};
      my $prompt = $call->{'prompt'} // '';
      my $model = $call->{'model'} // 'mistral';

      use LWP::UserAgent;
      my $ua = LWP::UserAgent->new;

      my $response = $ua->post(
          'http://localhost:11434/api/generate',
          Content => JSON::XS->new->encode({
              model => $model,
              prompt => $prompt,
              stream => 0  # Don't stream for now
          }),
          'Content-Type' => 'application/json'
      );

      if ($response->is_success) {
          my $result = JSON::XS->new->decode($response->content);
          return {
              success => 1,
              response => $result->{'response'},
              model => $model,
              timestamp => time()
          };
      } else {
          return {
              success => 0,
              error => $response->status_line
          };
      }

    time: "30 minutes"
    credits: "< 0.5%"

  action_3_create_console_command:
    description: "llm.cmd.chat for testing"
    file: "src/llm.cmd.chat"
    usage: "work chat 'What is 7 * 13?'"
    time: "20 minutes"
