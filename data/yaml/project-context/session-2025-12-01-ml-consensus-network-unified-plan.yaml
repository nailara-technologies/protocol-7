      sync_direction: |
        LLM Consensus Group output
          ↓
        Living Tree node (BASE32 encoded)
          ↓
        Bidirectional sync to other groups
          ↓
        Self-correction: Other groups notice disagreement
          ↓
        Re-evaluation with fresh perspective

  component_4_cubic_topology_consensus:
    name: "Spatial Reasoning & Voting"
    uses: "Cubic topology from html-form/visualizations/"
    mechanism: |
      Agent Positioning in Cubic Space:
      - Each LLM consensus group = point in cubic space
      - Position determined by answer vector
      - Distance = disagreement between groups
      - Rotation = voting mechanism

      Consensus Algorithm:
      1. Each group generates answer + confidence
      2. Map answer to cubic space position
      3. Calculate distances between all positions
      4. Use harmonic division (div-7, div-13) for voting thresholds
      5. Convergence = all positions near center
      6. Divergence = need re-evaluation

    protocol_7_integration:
      new_module: "consensus.cubic_topology.vote"
      function: |
        Takes: [ { answer, confidence, source }, ... ]
        Returns: { consensus, certainty_level, dissent_vector }

      new_module: "consensus.cubic_topology.position_map"
      function: |
        Maps text answer to 3D cubic coordinates
        Uses harmonic hashing for determinism

