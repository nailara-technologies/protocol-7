## IMMEDIATE ACTION PLAN (FITS 6% BUDGET)
## ═══════════════════════════════════════════════════════════════════════════

immediate_actions:

  step_1_verify_model_access:
    command: "ls -lh /mnt/m/lmstudio-community/Qwen2.5-7B-Instruct-1M-GGUF/"
    purpose: "Confirm model file exists and is accessible"
    time: "1 minute"

  step_2_install_ollama:
    command: |
      curl https://ollama.ai/install.sh | sh
      sudo systemctl start ollama  # If systemd available
      # Or just: ollama serve (in new terminal)
    purpose: "Get Ollama running"
    time: "5 minutes"
    credits: "< 0.5%"

  step_3_create_modelfiles_for_consensus_group:
    description: "Point Ollama to your existing GGUF files"
    files_to_create:
      - "/tmp/ollama-qwen-Modelfile"
      - "/tmp/ollama-mathstral-Modelfile"
      - "/tmp/ollama-aya-Modelfile"
    content: |
      # For Qwen consensus model
      cat > /tmp/ollama-qwen-Modelfile << 'EOF'
      FROM /mnt/m/lmstudio-community/Qwen2.5-7B-Instruct-1M-GGUF/Qwen2.5-7B-Instruct-1M-Q4_K_M.gguf
      PARAMETER num_gpu 99  # GPU acceleration
      PARAMETER num_ctx 2048  # Context window
      EOF

      # For Mathstral reasoning model
      cat > /tmp/ollama-mathstral-Modelfile << 'EOF'
      FROM /mnt/m/lmstudio-community/mathstral-7B-v0.1-GGUF/mathstral-7B-v0.1-Q4_K_M.gguf
      PARAMETER num_gpu 99
      PARAMETER num_ctx 2048
      EOF

      # For Aya multilingual model
      cat > /tmp/ollama-aya-Modelfile << 'EOF'
      FROM /mnt/m/lmstudio-community/aya-23-8B-GGUF/aya-23-8B-Q4_K_M.gguf
      PARAMETER num_gpu 99
      PARAMETER num_ctx 2048
      EOF
    time: "5 minutes"
    commands: |
      # Import models
      ollama create qwen-consensus -f /tmp/ollama-qwen-Modelfile
      ollama create mathstral-consensus -f /tmp/ollama-mathstral-Modelfile
      ollama create aya-consensus -f /tmp/ollama-aya-Modelfile

  step_4_test_consensus_models:
    command: |
      # Test Qwen
      curl http://localhost:11434/api/generate -d '{
        "model": "qwen-consensus",
        "prompt": "What is 7 * 13?",
        "stream": false
      }'

      # Test Mathstral
      curl http://localhost:11434/api/generate -d '{
        "model": "mathstral-consensus",
        "prompt": "What is 7 * 13?",
        "stream": false
      }'

      # Test Aya
      curl http://localhost:11434/api/generate -d '{
        "model": "aya-consensus",
        "prompt": "What is 7 * 13?",
        "stream": false
      }'
    purpose: "Verify all three models work"
    expected_output: "Three different answers (for consensus voting to decide between)"
    time: "5 minutes"

  step_5_create_protocol_7_consensus_module:
    description: "Module to coordinate consensus voting"
    file: "modules/llm.consensus.vote_multi_model"
    code: |
      ## modules/llm.consensus.vote_multi_model
      ## Query multiple models and vote on answer

      my $call = shift || {};
      my $question = $call->{'question'} // '';
      my @models = @{ $call->{'models'} // ['qwen-consensus', 'mathstral-consensus', 'aya-consensus'] };

      use LWP::UserAgent;
      use JSON::XS;

      my $ua = LWP::UserAgent->new;
      my $json = JSON::XS->new();

      my @responses;

      foreach my $model (@models) {
          my $response = $ua->post(
              'http://localhost:11434/api/generate',
              Content => $json->encode({
                  model => $model,
                  prompt => $question,
                  stream => 0
              }),
              'Content-Type' => 'application/json'
          );

          if ($response->is_success) {
              my $result = $json->decode($response->content);
              push @responses, {
                  model => $model,
                  answer => $result->{'response'},
                  timestamp => time()
              };
          }
      }

      return {
          success => 1,
          question => $question,
          responses => \@responses,
          model_count => scalar(@responses),
          consensus_status => 'ready_for_voting'  # Next phase: vote
      };

    time: "30 minutes"
    credits: "< 0.5%"

  step_6_create_console_command:
    file: "modules/llm.cmd.consensus-ask"
    usage: "work consensus-ask 'What is the meaning of Protocol-7?'"
    purpose: "Query all models and show their answers"
    time: "20 minutes"
    credits: "< 0.5%"

  step_7_document_available_models:
    file: "data/yaml/docs/available-lm-studio-models.yaml"
    content: |
      Available GGUF Models in /mnt/m/:

      RECOMMENDED FOR CONSENSUS:
      1. Qwen2.5-7B-Instruct-1M (excellent reasoning)
      2. mathstral-7B (specialized for math)
      3. aya-23-8B (multilingual)

      ALTERNATIVE MODELS:
      - Mistral variants (fast)
      - Seed-Coder-8B (code capability)
      - Vision models (for image understanding)

      HOW TO ADD NEW MODELS:
      1. Create Modelfile pointing to GGUF
      2. ollama create <name> -f Modelfile
      3. Add to consensus voting

    time: "15 minutes"
    credits: "< 0.5%"

