    command: "p7c models.chat test-model 'Hello from Claude!'"
    expected: "Message stored with sender=unix-taeki, response generated"
    verified: "✅ Working - messages display with timestamps and escape sequences"

  view_buffer_test:
    command: "p7c models.chat"
    expected: "Last 20 messages formatted with timestamps"
    verified: "✅ Working - buffer view shows recent messages"

  debug_trace:
    description: "Full execution trace captured with -vvvq flag"
