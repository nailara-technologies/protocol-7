token_management:

  budget_tracking:
    session_budget: "6% of total remaining credits"
    tokens_available: "~12,000 tokens (estimate)"
    tracking_method: |
      Each query logged: { task_id, tokens_used, model, success }
      Running total displayed
      When budget <10%: Switch to caching-only mode
      When budget depleted: Use only local services

  token_efficiency_rules:
    rule_1_cache_first: "Always check cache before querying LLM"
    rule_2_local_first: "Use local rules/patterns before complex reasoning"
    rule_3_single_model: "Start with single model, upgrade to consensus if needed"
    rule_4_concise_prompts: "Shorter prompts use fewer tokens, better quality"
    rule_5_batch_queries: "Group related questions together"

  cost_per_operation:
    cached_answer: "0 tokens"
    local_rule_execution: "0 tokens"
    single_llm_query: "100-300 tokens"
    consensus_voting: "300-900 tokens"
    whisper_transcription: "0 tokens (GPU)"
    invoke_generation: "0 tokens (GPU)"

  budget_allocation_strategy:
    phase_1_setup: "Use 2% to set up coding zenka infrastructure"
    phase_2_testing: "Use 2% to test routing and consensus"
    phase_3_production: "Reserve 2% for actual task execution"

