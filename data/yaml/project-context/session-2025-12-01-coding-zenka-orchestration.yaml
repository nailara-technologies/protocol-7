## ═══════════════════════════════════════════════════════════════════════════
## THE CORE IDEA: CODING ZENKA AS ORCHESTRATION BRAIN
## ═══════════════════════════════════════════════════════════════════════════

core_vision: |
  A coding zenka that:
  1. Receives work requests (from users, other zenka, or API)
  2. Analyzes what needs to be done (code analysis, task decomposition)
  3. Routes work to appropriate services:
     - Complex reasoning → LLM consensus voting
     - Creative content → Invoke AI
     - Transcription → Whisper
     - Code generation → Specialized LLM
     - Protocol-7 module coding → Local rules
  4. Tracks success/failure and learns
  5. Improves workflows automatically
  6. Manages token budget across all operations

  Not a chatbot. An autonomous task coordinator that knows
  when to think (LLM), when to create (Invoke), when to listen (Whisper),
  and when to write code directly (Protocol-7 native).

## ═══════════════════════════════════════════════════════════════════════════
## ARCHITECTURE: CODING ZENKA LAYERS
## ═══════════════════════════════════════════════════════════════════════════

coding_zenka_layers:

  layer_1_task_intake:
    name: "Work Request Ingestion"
    inputs:
      - Console commands from users
      - IPC from other zenka
      - HTTP API requests (via httpsd)
      - File-based task queue
    responsibility: |
      1. Parse incoming work request
      2. Extract key information: scope, complexity, deadline, constraints
      3. Classify work type (code, analysis, creative, transcription, etc.)
      4. Store in work queue with metadata

  layer_2_task_analysis:
    name: "Intelligent Decomposition"
    decision_engine: |
      Analyze work request to determine:

      COMPLEXITY SCORE (1-10):
      - Simple: Direct answer from rules/cache
      - Medium: Single LLM query
      - Complex: Consensus voting needed
      - Very Complex: Multi-step workflow required

      WORKLOAD TYPE:
      - Code generation: Route to coding-specialized model
      - Analysis: Route to reasoning-specialized model
      - Creative: Route to diverse consensus group
      - Transcription: Route to Whisper
      - Image generation: Route to Invoke AI
      - Learning/Improvement: Route to reflection module

      TOKEN BUDGET:
      - Calculate estimated tokens needed
      - Check remaining budget
      - Route accordingly (local first, LLM if justified)

      SUCCESS HISTORY:
      - Has similar task been done before?
      - What was success rate?
      - Can we use cached answer?
      - Should we use different approach?

  layer_3_workload_routing:
    name: "Intelligent Service Dispatch"
    routing_rules:
      rule_1_local_first: |
        If answer exists in knowledge base or cache: SERVE CACHED
        Tokens saved: 100% of query cost

      rule_2_simple_rules: |
        If task matches simple rules (format conversion, basic validation): EXECUTE LOCALLY
        Tokens saved: Query cost (only use consensus for verification if uncertain)

      rule_3_code_generation: |
        If task is "generate Protocol-7 module": Route to CODE-SPECIALIST LLM
        Use Mathstral or Seed-Coder for code tasks
        Cost: ~200-500 tokens per module

      rule_4_reasoning_simple: |
        If task is analysis but doesn't need consensus: Route to SINGLE LLM
        Use Qwen or Mathstral
        Cost: ~100-300 tokens

      rule_5_reasoning_complex: |
        If task needs verification or is controversial: Route to CONSENSUS VOTING
        Query all 3 models: Qwen + Mathstral + Aya
        They vote on answer
        Cost: ~300-900 tokens (more expensive but highest confidence)

      rule_6_creative_generation: |
        If task is "generate image description" or "brainstorm ideas": Route to DIVERSE CONSENSUS
        Get perspectives from multiple models
        Cost: ~200-600 tokens

      rule_7_transcription: |
        If task is "transcribe audio": Route to WHISPER
        No token cost (local GPU)
        Cache result in knowledge base

      rule_8_image_generation: |
        If task is "generate image from text": Route to INVOKE AI
        No token cost (local GPU + /user/Invoke)
        Cache generated image + metadata

  layer_4_execution_coordination:
    name: "Parallel/Sequential Execution Management"
    capabilities:
      parallel_execution: |
        Can query multiple LLMs simultaneously (if enough VRAM)
        Load Qwen, Mathstral, Aya in sequence and collect responses
        Then vote on results

      sequential_optimization: |
        Load one model at a time (most memory efficient)
        Pass question through each model
        Aggregate responses
        Execute voting

      hybrid_mode: |
        Pre-load 2 models while querying 1st
        Reduces context-switch overhead
        Balances memory vs. speed

  layer_5_result_validation:
    name: "Quality & Certainty Assessment"
    validation_steps:
      step_1_confidence: |
        For consensus voting: certainty level from cubic topology voting
        For single model: check response quality signals
        For cached answer: trust level based on age and success history

      step_2_consistency: |
        Compare answer to previous answers to similar questions
        Check if contradictions with knowledge base
        Flag if inconsistency detected

      step_3_success_metrics: |
        Did answer meet original requirement?
        Can user verify success?
        Should this be stored in knowledge base?

      step_4_learning: |
        Store outcome: question + answer + success/failure
        Update success metrics for routing rules
        Adjust model specialization assignments if needed

  layer_6_workflow_improvement:
    name: "Automatic Learning & Optimization"
    improvement_loop: |
      After each task completion:
      1. Extract patterns: What made this successful?
      2. Update routing rules: "Code generation works better with Seed-Coder"
      3. Optimize prompts: "Consensus voting needs less detail, single LLM needs more context"
      4. Cache patterns: "This type of task has 95% success with approach X"
      5. Predict: "Next similar task: use approach X"

    metrics_tracked:
      - Success rate per task type
      - Token efficiency (output tokens per input token)
      - Time to completion
      - Model specialization effectiveness
      - Consensus agreement rates
      - Cache hit rates

## ═══════════════════════════════════════════════════════════════════════════
## WORKLOAD DEFINITION & MANAGEMENT
## ═══════════════════════════════════════════════════════════════════════════

workload_definition:

  structured_task_format:
    description: "How work is represented internally"
    example_task: |
      {
        id: "task-20251201-001",
        type: "code-generation",
        subtype: "protocol-7-module",
        source: "console-command",

        request: {
          description: "Create module to transcribe audio via Whisper",
          language: "perl",
          target: "Protocol-7 module",
          constraints: ["Must follow style guide", "Cache results"],
          deadline: "within session"
        },

        analysis: {
          complexity: 6,
          estimated_tokens: 400,
          routed_to: "code-specialist-llm",
          fallback: "consensus-coding",
          cache_priority: "high",
          success_history: { similar_tasks: 5, success_rate: 0.8 }
        },

        execution: {
          status: "pending",
          started: null,
          completed: null,
          model_used: null,
          tokens_used: 0,
          result: null,
          success: null
        },

        learning: {
          approach_effectiveness: null,
          should_cache: true,
          pattern_id: null,
          next_improvement: null
        }
      }

  task_queue_management:
    purpose: "Manage incoming work efficiently"
    storage: "$data{'coding'}{'task_queue'}"
    features:
      - Priority queue (urgent tasks first)
      - Dependency tracking (task A must finish before B)
      - Parallel execution planning
      - Resource allocation (token budget, VRAM, time)
      - Progress tracking
      - Failure recovery

  task_types_mapped_to_services:
    type_analysis: Route to analysis consensus, track reasoning quality
    type_code_generation: Route to Seed-Coder or Mathstral, validate syntax
    type_code_review: Route to reasoning consensus, check patterns
    type_creative: Route to diverse consensus, collect ideas
    type_transcription: Route to Whisper, cache result
    type_image_generation: Route to Invoke AI, cache image
    type_module_coding: Route to code-specialist, verify Protocol-7 patterns
    type_documentation: Route to writing-optimized model
    type_debugging: Route to code-specialist + reasoning
    type_optimization: Route to performance-specialized model

