## Dual GPU+CPU Strategy for ik_llama.cpp Integration
## Comprehensive approach to reliable and performant inference
## Date: 2025-12-05

overview:
  goal: "Implement intelligent workload routing between GPU-accelerated and CPU-only inference"
  philosophy: "Use GPU when available for 100x speed improvement, fall back to CPU for 100% reliability"
  implementation: "Hybrid zenka system in Protocol-7 with automatic failover"
  status: "Both binaries built and tested, ready for integration"

deployment_binaries:
  gpu_accelerated:
    name: "llama-server-cuda-12.5.0"
    location: "/data/source/ik_llama.cpp/llama-server-cuda-12.5.0"
    size: "6.2 MiB (includes CUDA libraries)"
    build_method: "Docker-based compilation with full CUDA 12.5.0 stack"
    compilation_time: "~30 minutes (includes Docker build)"
    dependencies: |
      - libcudart.so.12 (CUDA runtime)
      - libcublas.so.12 (GPU math)
      - libcublasLt.so.12 (GPU tensor operations)
      - libcurand.so.10 (GPU random)
      - libcusparse.so.12 (GPU sparse operations)
      - NVIDIA RTX 3060 or compatible GPU

    test_status: "✅ VALIDATED"
    test_model: "Qwen2.5 7B Instruct 1M (Q4_K_M)"
    gpu_info: "NVIDIA GeForce RTX 3060 (11GB VRAM, Ampere)"
    performance:
      gpu_memory: "~7.5 GB for 7B model with full offloading"
      tokens_per_second: "~5-10 (estimated, -ngl 33)"
      latency: "100-200ms per token"
      use_case: "Interactive queries, real-time responses"

  cpu_only:
    name: "llama-server-cpu"
    location: "/data/source/ik_llama.cpp/llama-server-cpu"
    size: "6.1 MiB (fully self-contained)"
    build_method: "Direct CMake compilation with native optimizations"
    compilation_time: "~45 seconds (-j8)"
    dependencies: "None (fully statically compiled)"

    test_status: "✅ VALIDATED"
    test_model: "Qwen2.5 7B Instruct 1M (Q4_K_M)"
    system_info: "x86_64 with 8 CPU cores, AVX2 support"
    performance:
      system_memory: "~8-10 GB for 7B model"
      tokens_per_second: "~0.05-0.1 (8 threads)"
      latency: "10-20 seconds per token"
      use_case: "Batch processing, background tasks, fallback"

comparative_analysis:
  primary_decision_factor: "Latency requirements and reliability needs"

  use_gpu_when:
    - "Latency < 1 second required (interactive)"
    - "GPU has sufficient free VRAM (>8GB for 7B model)"
    - "Low-medium throughput (1-5 concurrent requests)"
    - "Real-time user-facing queries"
    - "Context-aware responses needed immediately"

  use_cpu_when:
    - "GPU unavailable or no NVIDIA hardware"
    - "GPU already at capacity (high queue)"
    - "Batch processing multiple queries"
    - "Background tasks (non-interactive)"
    - "Maximize uptime/availability over speed"
    - "Cost optimization for non-interactive workloads"

  decision_tree: |
    1. Is GPU available and initialized?
       → Yes: Check free VRAM
       → No: Route to CPU

    2. Does GPU have >8GB free VRAM?
       → Yes: Estimate queue depth
       → No: Route to CPU

    3. Is queue depth < 3 requests?
       → Yes: Route to GPU (will be fast)
       → No: Queue for CPU (balanced load)

    4. Is this a batch request (>100 tokens context)?
       → Yes: Prefer CPU (better throughput)
       → No: Prefer GPU (better latency)

