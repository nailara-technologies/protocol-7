protocol7_integration:
  architecture_pattern: "Multi-zenka hierarchical system"

  zenka_design:
    coding_zenka:
      description: "Main inference coordinator"
      responsibilities:
        - "Route queries to appropriate backend"
        - "Manage model lifecycle"
        - "Provide unified API for inference"
        - "Handle request queuing and prioritization"

    gpu_inference_zenka:
      description: "GPU-accelerated inference worker"
      responsibilities:
        - "Manage CUDA initialization"
        - "Monitor GPU memory"
        - "Execute GPU-offloaded inference"
        - "Report performance metrics"

    cpu_inference_zenka:
      description: "CPU-only fallback worker"
      responsibilities:
        - "Manage CPU threading"
        - "Execute full model on CPU"
        - "Provide reliable fallback"
        - "Handle batch operations"

  communication_protocol:
    request_format: |
      {
        "type": "inference",
        "model": "qwen2.5-7b",
        "prompt": "What is the capital of France?",
        "context_length": 2048,
        "max_tokens": 256,
        "temperature": 0.7,
        "priority": "interactive",
        "timeout_ms": 30000
      }

    response_format: |
      {
        "status": "success",
        "backend": "gpu|cpu",
        "response": "The capital of France is Paris.",
        "tokens_generated": 8,
        "latency_ms": 450,
        "model": "qwen2.5-7b"
      }

  message_routing:
    local_context: "coding.inference"
    gpu_context: "gpu_inference.process"
    cpu_context: "cpu_inference.process"
    fallback_chain: "GPU → CPU → Error"

model_management:
  supported_models:
    - name: "Qwen2.5 7B"
      size: "7 billion parameters"
      quantization: "Q4_K_M"
      context_window: "1M tokens"
      vram_required: "~7.5 GB (GPU)"
      memory_required: "~8 GB (CPU)"
      location: "/mnt/m/lmstudio-community/Qwen2.5-7B-Instruct-1M-GGUF/"

  model_loading_strategy:
    eager_load: false
    lazy_load: true
    preload_on_startup: false
    keep_in_memory: true
    max_concurrent_models: 1

  model_switching:
    cost: "2-5 seconds (model unload + load)"
    notification: "Inform routing zenka of switching"
    queue_handling: "Queue pending requests during switch"

inference_request_types:
  interactive:
    latency_requirement: "< 2 seconds"
    preferred_backend: "GPU"
    timeout: "30 seconds"
    priority: "HIGH"
    use_case: "User-facing chat, real-time responses"

  batch:
    latency_requirement: "None (best effort)"
    preferred_backend: "CPU"
    timeout: "300 seconds"
    priority: "LOW"
    use_case: "Background analysis, processing multiple queries"

  testing:
    latency_requirement: "< 10 seconds"
    preferred_backend: "Either"
    timeout: "60 seconds"
    priority: "MEDIUM"
    use_case: "Model validation, feature testing"

failure_handling:
  gpu_unavailable:
    action: "Automatically route to CPU"
    logging: "Warn level (expected scenario)"
    recovery: "Continue with CPU, retry GPU check"

  gpu_out_of_memory:
    action: "Queue for CPU, continue accepting requests"
    logging: "Info level (load management)"
    recovery: "Monitor for GPU memory release"

  inference_timeout:
    action: "Return error to client"
    logging: "Error level (unexpected)"
    recovery: "Log details, optionally retry on other backend"

  both_backends_failed:
    action: "Return error with diagnostic info"
    logging: "Critical level (system failure)"
    recovery: "Alert administrator, check system resources"

monitoring_metrics:
  gpu_metrics:
    - "GPU memory used / total"
    - "GPU temperature"
    - "Request queue depth"
    - "Average latency per request"
    - "Tokens generated per second"
    - "Error rate"

  cpu_metrics:
    - "CPU utilization (%)"
    - "Memory used / total"
    - "Thread count active"
    - "Request queue depth"
    - "Average latency per request"
    - "Tokens generated per second"
    - "Error rate"

  system_metrics:
    - "Total requests processed"
    - "Requests routed to GPU"
    - "Requests routed to CPU"
    - "Fallback events (GPU → CPU)"
    - "System uptime"
    - "Average response latency"

