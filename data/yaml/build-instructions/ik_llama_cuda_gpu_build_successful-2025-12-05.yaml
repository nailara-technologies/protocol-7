---
# ik_llama.cpp GPU-Accelerated Build Recipe - SUCCESSFUL
# Date: 2025-12-05
# Status: VALIDATED - Executable and libraries successfully compiled and extracted
# Purpose: GPU-accelerated llama-server for coding zenka (LLM inference acceleration)

# ============================================================================
# PROJECT OVERVIEW
# ============================================================================
project:
  name: "ik_llama.cpp GPU-Accelerated Build"
  source_repo: "https://github.com/ggerganov/llama.cpp"
  target_binary: "llama-server"
  gpu_acceleration: "CUDA 12.5.0"
  target_platform: "Linux (Debian 12 WSL2 with RTX 3060)"
  primary_use_case: "Protocol-7 coding zenka - fast LLM inference for code generation"

# ============================================================================
# HARDWARE & ENVIRONMENT REQUIREMENTS
# ============================================================================
requirements:
  system:
    os: "Linux (Debian 12+, Ubuntu 22.04+)"
    architecture: "x86_64"
    container_runtime: "Docker (with NVIDIA Docker support)"
    available_disk_space: "100GB (for compilation artifacts)"
    available_memory: "16GB RAM minimum"

  gpu:
    model: "NVIDIA RTX 3060 (or equivalent with CUDA capability 86+)"
    vram: "12GB minimum"
    compute_capability: "86 (Ampere architecture)"
    driver_requirement: "NVIDIA driver 525.0+ supporting CUDA 12.5"
    verification_cmd: "nvidia-smi --query-gpu=name,compute_cap --format=csv,noheader"

  cuda_toolkit:
    version: "12.5.0"
    source: "nvidia/cuda Docker image (automatic via Docker)"
    components:
      - "libcudart.so.12 (CUDA runtime)"
      - "libcuda.so.1 (CUDA driver interface)"
      - "CUDA compilation tools (nvcc)"
      - "cuDNN (optional, for optimized kernels)"

  build_tools:
    cmake: "3.23+ (required for CUDA CMake support)"
    compiler: "gcc/g++ (standard Ubuntu/Debian package)"
    docker: "24.0+ (BuildKit support recommended)"
    git: "2.34+ (for source management)"

# ============================================================================
# CRITICAL ISSUES & SOLUTIONS (from development attempts #1-11)
# ============================================================================
critical_issues:

  issue_1_linker_undefined_references:
    attempts_affected: [1, 2, 3, 4, 5]
    error_message: |
      /usr/bin/ld: ../../ggml/src/libggml.so: undefined reference to `cuGetErrorString'
      /usr/bin/ld: ../../ggml/src/libggml.so: undefined reference to `cuMemCreate'
      ERROR: undefined reference to CUDA functions during final linking

    root_cause: |
      CMake configuration was not explicitly specifying CUDA library paths during linking.
      The build system couldn't find CUDA libraries in /usr/local/cuda/lib64 at link time,
      resulting in undefined external references to CUDA driver functions.

    solution: |
      Add explicit linker flags to CMake configuration to force library path discovery:

      CMAKE_EXE_LINKER_FLAGS:
        -L/usr/local/cuda/lib64 -lcudart -lcuda -Wl,-rpath-link,/usr/local/cuda/lib64

      CMAKE_SHARED_LINKER_FLAGS:
        -L/usr/local/cuda/lib64 -lcudart

    applied_in_dockerfile: |
      RUN cmake -B build \
          -DGGML_CUDA=ON \
          -DCMAKE_CUDA_ARCHITECTURES=86 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda \
          -DCMAKE_EXE_LINKER_FLAGS="-L/usr/local/cuda/lib64 -lcudart -lcuda -Wl,-rpath-link,/usr/local/cuda/lib64" \
          -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/local/cuda/lib64 -lcudart"

    outcome: "✅ RESOLVED in Attempt #6 - Binary compiled to 100%"

  issue_2_glibc_incompatibility:
    attempts_affected: [1, 2, 3, 4, 5]
    error_pattern: "glibc mismatch errors or ABI incompatibility"

    root_cause: |
      Debian 12 (bookworm) uses glibc 2.36, which is incompatible with NVIDIA CUDA devel
      containers that expect glibc 2.35 from Ubuntu 22.04 (jammy). The linker would fail
      when attempting to use system libraries incompatible with container environment.

    solution: |
      Use Ubuntu 22.04 (jammy) base image in Docker instead of Debian default.
      This matches the NVIDIA CUDA image's expected glibc version.

    applied_in_dockerfile: |
      FROM nvidia/cuda:12.5.0-devel-ubuntu22.04    # ✅ Ubuntu 22.04 (not Debian 12)
      ...
      FROM nvidia/cuda:12.5.0-runtime-ubuntu22.04   # ✅ Runtime stage also Ubuntu 22.04

    outcome: "✅ RESOLVED via Docker containerization"

  issue_3_docker_runtime_verification_failure:
    attempts_affected: [6, 7, 8, 9]
    error_message: |
      ./llama-server: error while loading shared libraries: libcuda.so.1: cannot open shared object file
      ERROR: failed to solve: process "/bin/sh -c llama-server --version" did not complete successfully

    root_cause: |
      Attempted to verify binary functionality INSIDE Docker devel container where:
      1. Only build libraries present (libcudart.so.12 available)
      2. libcuda.so.1 (driver interface) NOT available (it comes from NVIDIA driver on host)
      3. The test was happening in devel stage before copying to runtime stage

      Docker containers cannot access host NVIDIA driver libraries directly.

    solution: |
      REMOVE verification step from Docker build and move verification to host system.
      The Docker container doesn't need libcuda.so.1; it only needs to compile successfully.
      Verification happens on the HOST where NVIDIA driver IS available.

    applied_in_dockerfile: |
      # OLD (Attempts #6-8, BROKEN):
      RUN llama-server --version

      # NEW (Attempt #10+, CORRECT):
      # Note: Binary verification happens on host system where CUDA driver libraries are available
      # The Docker container doesn't have libcuda.so.1 which comes from the NVIDIA driver on the host

    outcome: "✅ RESOLVED in Attempt #10 - Removed Docker verification"

  issue_4_missing_supporting_libraries:
    attempts_affected: [9, 10]
    error_message: |
      ./llama-server-cuda: error while loading shared libraries: libcudart.so.12: cannot open shared object file

    root_cause: |
      Binary was extracted from container but supporting libraries were NOT extracted:
      - libggml.so (compiled ggml library)
      - libllama.so (compiled llama library)
      - libmtmd.so (multi-threaded multi-device library)
      - libcudart.so.12 (CUDA runtime library)

      Binary extraction only copied /usr/local/bin/llama-server, leaving dependencies in container.

    solution: |
      Modify build script to extract ALL required libraries alongside binary:

      1. Extract main libraries from container:
         - /build/build/ggml/src/libggml.so
         - /build/build/src/libllama.so
         - /build/build/examples/mtmd/libmtmd.so

      2. Extract CUDA runtime libraries from container:
         - /usr/local/cuda/lib64/libcudart.so.12
         - /usr/local/cuda/lib64/libcublas.so.12
         - /usr/local/cuda/lib64/libcublasLt.so.12

      3. Set LD_LIBRARY_PATH when running binary:
         export LD_LIBRARY_PATH=/path/to/extracted/libs:$LD_LIBRARY_PATH

    applied_in_build_script: |
      # Extract required libraries
      for lib in libggml.so libllama.so libmtmd.so; do
        docker cp ${CONTAINER_ID}:/usr/local/lib/${lib} ${OUTPUT_DIR}/
      done

      # Extract CUDA runtime libraries
      for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12 ...; do
        docker cp ${CONTAINER_ID}:/usr/local/cuda/lib64/${lib} ${OUTPUT_DIR}/ 2>/dev/null
      done

    outcome: "✅ RESOLVED in Attempt #11"

# ============================================================================
# BUILD STRATEGY & ARCHITECTURE
# ============================================================================
build_architecture:
  approach: "Docker Multi-Stage Build with Layer Caching"

  benefits:
    - "Avoids glibc incompatibility between Debian 12 and CUDA containers"
    - "Leverages Docker layer caching for fast iteration (30min first build, 3-5min subsequent)"
    - "Complete build isolation - no contamination of host system"
    - "Easy reproduction - Dockerfile is self-contained"
    - "Clean extraction of artifacts to host"

  stages:
    stage_0_compilation:
      image: "nvidia/cuda:12.5.0-devel-ubuntu22.04"
      purpose: "Full compilation environment with CUDA toolkit"
      steps:
        - "Install build dependencies (git, build-essential, cmake, pkg-config)"
        - "Copy source code into container"
        - "Configure CMake with CUDA support enabled"
        - "Compile llama-server and all supporting libraries"
        - "Binary output: /build/build/bin/llama-server"

    stage_1_runtime:
      image: "nvidia/cuda:12.5.0-runtime-ubuntu22.04"
      purpose: "Minimal runtime environment for artifact extraction"
      steps:
        - "Copy binary from compilation stage"
        - "Copy supporting libraries from compilation stage"
        - "Register libraries with ldconfig"
        - "Set proper LD_LIBRARY_PATH"

  dockerfile_location: "/data/source/ik_llama.cpp/Dockerfile.cuda-build"
  build_script_location: "/data/source/ik_llama.cpp/build-cuda-docker.sh"

# ============================================================================
# STEP-BY-STEP BUILD INSTRUCTIONS
# ============================================================================
build_instructions:

  step_1_prerequisites:
    description: "Verify system has required tools and GPU support"
    commands:
      - name: "Check NVIDIA driver"
        cmd: "nvidia-smi"
        expected_output: "NVIDIA-SMI X.X.X (driver version 525+)"

      - name: "Verify CUDA capability"
        cmd: "nvidia-smi --query-gpu=compute_cap --format=csv,noheader"
        expected_output: "8.6 or higher (for RTX 3060: 8.6)"

      - name: "Verify Docker installation"
        cmd: "docker --version && docker info | grep 'Runtimes' | grep nvidia"
        expected_output: "Docker with nvidia-docker runtime configured"

      - name: "Check available disk space"
        cmd: "df -h /dev/shm && df -h ."
        expected_output: "At least 100GB available in current directory"

  step_2_obtain_source:
    description: "Get ik_llama.cpp source code"
    commands:
      - name: "Navigate to work directory"
        cmd: "cd /data/source/ik_llama.cpp"

      - name: "Verify source tree"
        cmd: "ls -la Dockerfile.cuda-build build-cuda-docker.sh CMakeLists.txt"
        expected_output: "All three files present"

  step_3_optional_network_optimization:
    description: "Configure proxy if download speeds are limited (optional)"
    note: |
      If downloading CUDA packages from nvidia.com is slow, use an HTTP/SOCKS proxy
      to a VPS with better connectivity. Update these in Dockerfile.cuda-build:

    environment_variables:
      http_proxy: "http://PROXY_HOST:PORT"
      https_proxy: "http://PROXY_HOST:PORT"
      ALL_PROXY: "socks5://PROXY_HOST:PORT"

  step_4_start_build:
    description: "Launch Docker build (takes 20-30 minutes on first run with layer caching)"
    commands:
      - name: "Start build with progress output"
        cmd: "./build-cuda-docker.sh 2>&1 | tee build.log"
        estimated_time: "20-30 minutes (first run with layer caching)"
        expected_output: |
          [INFO] Checking prerequisites...
          [INFO] ✓ Docker found
          [INFO] ✓ NVIDIA driver found
          [INFO] Building Docker image with CUDA 12.5.0...
          [Build progress output - [nn%] building...]
          [INFO] ✓ Docker image built successfully
          [INFO] Extracting llama-server binary and libraries from container...
          [INFO] ✓ Binary extracted to: ./llama-server-cuda-12.5.0
          [INFO] ✓ Libraries extracted to: ./
          [INFO] === Build Complete ===

  step_5_verify_extraction:
    description: "Confirm binary and libraries were properly extracted"
    commands:
      - name: "Check binary exists and is executable"
        cmd: "ls -lh llama-server-cuda-12.5.0"
        expected_output: "-rwxr-xr-x ... llama-server-cuda-12.5.0 (500MB+)"

      - name: "Verify symlink created"
        cmd: "ls -l llama-server-cuda"
        expected_output: "llama-server-cuda -> llama-server-cuda-12.5.0"

      - name: "Check supporting libraries extracted"
        cmd: "ls -lh libggml.so libllama.so libmtmd.so"
        expected_output: "All three .so files present"

      - name: "Check CUDA runtime libraries extracted"
        cmd: "ls -lh libcudart.so.12"
        expected_output: "libcudart.so.12 (or libcudart.so.12.*)"

  step_6_test_binary_locally:
    description: "Test binary on host system with proper library path"
    commands:
      - name: "Run version check with library path"
        cmd: "export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH && ./llama-server-cuda --version"
        expected_output: |
          build number: X
          build commit: xxxxxxx
          build compiler: xxx
          build flags: xxx
          (with CUDA enabled)

      - name: "Verify GPU detection"
        cmd: "export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH && ./llama-server-cuda --gpu-layers 1 -ngl 33 --help 2>&1 | grep -i 'gpu\\|cuda\\|layers'"
        expected_output: "GPU/CUDA related flags and options displayed"

  step_7_test_with_model:
    description: "Run inference with actual model to validate GPU acceleration"
    commands:
      - name: "Download test model (7B or smaller for quick test)"
        cmd: |
          # Example: Qwen2 7B
          huggingface-cli download Qwen/Qwen2-7B-Instruct-GGUF qwen2-7b-instruct-q4_k_m.gguf --local-dir ./models

      - name: "Run server with GPU acceleration"
        cmd: |
          export LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH
          ./llama-server-cuda -m ./models/qwen2-7b-instruct-q4_k_m.gguf \
            -ngl 33 \
            -c 4096 \
            --port 8000 &
        expected_behavior: "Server starts and shows 'llm_load_tensors: offloading' messages"

      - name: "Test inference request"
        cmd: |
          curl http://localhost:8000/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen2",
              "messages": [{"role": "user", "content": "Say hello"}],
              "temperature": 0.7
            }'
        expected_output: "JSON response with generated text"

      - name: "Monitor GPU usage"
        cmd: "watch -n 1 nvidia-smi"
        expected_behavior: "GPU memory increasing to ~6-8GB, GPU utilization 80%+"

# ============================================================================
# PERFORMANCE VALIDATION & BENCHMARKING
# ============================================================================
performance_testing:

  test_models:
    - name: "Qwen2 7B Instruct"
      quantization: "Q4_K_M"
      vram_required: "~6GB"
      expected_tokens_per_sec: "15-25 tok/s (RTX 3060 with ngl=33)"
      use_case: "Lightweight inference testing"

    - name: "Qwen2 14B Chat"
      quantization: "Q4_K_M"
      vram_required: "~10GB"
      expected_tokens_per_sec: "8-12 tok/s (RTX 3060 with ngl=33)"
      use_case: "Medium-sized coding tasks"

    - name: "Qwen3 Coder 30B (target)"
      quantization: "Q4_K_M"
      vram_required: "~19GB"
      expected_behavior: "Will utilize main memory + VRAM"
      note: "GPU offload limited by RTX 3060 VRAM; requires hybrid CPU+GPU"

  benchmark_template:
    prompt_size: "200-500 tokens"
    output_size: "500-1000 tokens"
    repetitions: "5 runs (warm cache)"
    metrics_to_measure:
      - "Time to first token (TTFT)"
      - "Tokens per second (throughput)"
      - "GPU memory utilization"
      - "GPU load percentage"
      - "Batch processing capability"

# ============================================================================
# DEPLOYMENT & OPERATIONAL SETUP
# ============================================================================
deployment:

  artifact_directory_structure: |
    /data/source/ik_llama.cpp/
    ├── llama-server-cuda                 # Symlink to latest version
    ├── llama-server-cuda-12.5.0         # Actual binary (executable)
    ├── libggml.so                       # Compiled ggml library
    ├── libllama.so                      # Compiled llama library
    ├── libmtmd.so                       # Multi-device library
    ├── libcudart.so.12                  # CUDA runtime (essential)
    ├── libcublas.so.12                  # CUDA BLAS (optional, for performance)
    └── [other extracted CUDA libs]

  runtime_setup:
    shell_environment: |
      # For manual testing or development:
      export LD_LIBRARY_PATH=/data/source/ik_llama.cpp:$LD_LIBRARY_PATH
      export CUDA_VISIBLE_DEVICES=0  # Use first GPU if multiple available

    systemd_service_example: |
      [Unit]
      Description=GPU-Accelerated llama-server for Protocol-7
      After=network.target

      [Service]
      Type=simple
      User=llama
      WorkingDirectory=/data/source/ik_llama.cpp
      Environment="LD_LIBRARY_PATH=/data/source/ik_llama.cpp:$LD_LIBRARY_PATH"
      Environment="CUDA_VISIBLE_DEVICES=0"
      ExecStart=/data/source/ik_llama.cpp/llama-server-cuda \
        -m /path/to/model.gguf \
        -ngl 33 \
        -c 4096 \
        --port 8000
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  protocol_7_integration:
    zenka_module_location: "modules/coding.llm_inference"
    approach: "Hybrid strategy"
    strategy_description: |
      1. Local GPU inference for fast queries (< 50 tok, immediate turnaround)
         - Route to llama-server-cuda on RTX 3060
         - ~100ms latency, 15-25 tok/s throughput
         - Cost: GPU power consumption (~250W)

      2. Remote CPU inference for slow queries (large outputs, batch processing)
         - Route to remote 7B model on fallback server
         - ~500ms latency, 2-5 tok/s throughput
         - Cost: Network latency, external server resources

    configuration_example: |
      # coding.llm_inference zenka configuration
      llm.primary.host = localhost
      llm.primary.port = 8000
      llm.primary.model = "qwen3-coder-30b-q4km"
      llm.primary.gpu_layers = 33
      llm.primary.max_tokens = 4096

      llm.fallback.host = remote_server.example.com
      llm.fallback.port = 9000
      llm.fallback.model = "qwen2-7b-q4km"
      llm.fallback.gpu_layers = 33

      # Route decisions
      router.fast_threshold = 50      # tokens
      router.slow_threshold = 1000    # tokens
      router.timeout_fallback = 3000  # milliseconds

# ============================================================================
# TROUBLESHOOTING GUIDE
# ============================================================================
troubleshooting:

  symptom_1_libcudart_not_found:
    error: "error while loading shared libraries: libcudart.so.12"
    causes:
      - "LD_LIBRARY_PATH not set"
      - "libcudart.so.12 not extracted from container"
      - "CUDA runtime version mismatch"
    solutions:
      - "Run with: export LD_LIBRARY_PATH=/path/to/libs:$LD_LIBRARY_PATH"
      - "Verify library exists: ls -lh ./libcudart.so.12"
      - "Re-run build script: ./build-cuda-docker.sh"

  symptom_2_segmentation_fault:
    error: "Segmentation fault (core dumped)"
    causes:
      - "Mismatched CUDA versions"
      - "Incompatible library ABI"
      - "GPU driver outdated"
    solutions:
      - "Verify nvidia-smi output matches CUDA 12.5"
      - "Run: nvidia-smi --query-gpu=driver_version --format=csv,noheader (expect 525+)"
      - "Rebuild from scratch: ./build-cuda-docker.sh"

  symptom_3_docker_build_fails:
    error: "Docker build error: ... during cmake or compilation"
    causes:
      - "Insufficient disk space"
      - "Network issues downloading packages"
      - "Docker daemon not running or misconfigured"
    solutions:
      - "Check space: df -h"
      - "Clear Docker cache: docker system prune -a"
      - "Retry with proxy if needed (edit Dockerfile)"
      - "Restart Docker: sudo systemctl restart docker"

  symptom_4_slow_build:
    issue: "Build taking > 45 minutes"
    analysis:
      - "First build: Normal (30+ min for full compilation)"
      - "Subsequent builds: Should be < 5 min (docker cache)"
    solutions:
      - "Check if docker is reusing cache: Look for 'CACHED' in output"
      - "Ensure source code hasn't changed between runs"
      - "Check system load: high CPU/memory might slow compilation"

# ============================================================================
# VALIDATION CHECKLIST
# ============================================================================
validation_checklist:
  - name: "Docker build completed successfully"
    command: "grep -i 'Build Complete' build.log"
    expected: "✅ Found"

  - name: "Binary extracted to host"
    command: "test -x ./llama-server-cuda-12.5.0 && echo OK"
    expected: "OK"

  - name: "All supporting libraries extracted"
    command: "ls -1 libggml.so libllama.so libmtmd.so libcudart.so.12"
    expected: "All files listed"

  - name: "Binary runs with GPU support"
    command: "LD_LIBRARY_PATH=.:$LD_LIBRARY_PATH ./llama-server-cuda --version | grep -i cuda"
    expected: "CUDA version or CUDA support mentioned"

  - name: "GPU detection working"
    command: "nvidia-smi | grep -i process"
    expected: "llama-server or similar process using GPU memory"

  - name: "Inference produces tokens"
    command: "curl http://localhost:8000/v1/chat/completions ... | jq .choices[0].message.content"
    expected: "Non-empty text response"

