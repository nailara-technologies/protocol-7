      coding.cfg.mode.doc.system        = <system prompt variant>
    precedence, most specific wins : explicit in the request [ a template name in the prompt -- coding.prompt.assemble's existing dynamic template match -- or a caller's system text ] > the mode's preset [ walked up the mode tree ] > default. a mode only fills what nothing more specific already set.
