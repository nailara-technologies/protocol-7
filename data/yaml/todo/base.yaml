- added: 3XAPPQ4YJU
  details: |-
    bin/dev/git-hooks/pre-commit:304 runs `bin/Protocol-7 sourcecode
    verify-p7-signatures`, which currently re-verifies signatures broadly
    rather than scoping to just the staged file set -- so `update-signatures`
    has to sign everything each commit, not just what actually changed. This
    gets painful fast on a multi-file session (e.g. a whole zenka's worth of
    edits): every commit round-trips through a full re-sign even for a
    one-line follow-up fix.

    Idea 1 (original): scope both the verify step (line 304) and the signing
    pass itself to `git diff --cached --name-only` (the hook already
    computes this list earlier for the descr/param-length check, around
    line 84) rather than whatever broader set verify-p7-signatures currently
    walks. Would speed up commits significantly on multi-file work.

    Idea 2 (2026-08-31/09-01, background pre-computation, bigger win):
    watch the repo root with Linux::Inotify2 for file changes; after a short
    no-further-changes timeout on a given file, run the expensive
    proof-of-work-like truth-template signature search for it IN THE
    BACKGROUND, speculatively, before anyone actually asks to commit --
    but do NOT write the footer to the file yet. Store the precomputed
    signature either in memory only, or encrypted with Twofish such that
    only the user's own C25519 key can decrypt it.

    Key property: this keeps "actually signing a file" a protected, deliberate
    decision -- the background watcher only computes candidate signatures on
    file-change detection, it has no say in whether they get applied. Only
    the user's own key can decrypt a precomputed value to actually append/
    replace the footer. But because the expensive search already happened
    ahead of time in the background, the commit-time signing step becomes
    just "decrypt precomputed value (fast) + write it" instead of "search
    for a valid signature from scratch (the current proof-of-work-like cost
    update-signatures pays synchronously today, matching all truth
    templates). Extremely accelerated for the actual commit-time path,
    without weakening who gets to decide a file is actually signed.

    Needs: reading verify-p7-signatures' and update-signatures' actual
    current scoping logic first (idea 1) to see whether they already accept
    a file-list argument or would need one added; for idea 2, needs its own
    design pass (inotify watcher process lifecycle, where precomputed
    values live pending decryption, cache invalidation when a watched file
    changes again before its precomputed signature is ever applied).
  done_at: 3XI3JOOLOE
  id: ADR
  priority: normal
  status: done
  tags:
  - git-hooks
  text: scope pre-commit signature check to staged files
