  text: 'proxy -> external link tunnel : native hysteria replacement over STRM'
- added: 3X42L4O2OA
  details: |-
    p7-vault : file import \ export -- encrypted blob store, vault-managed metadata

    user idea 2026-10-12 : clone the notes feature for files. completes the alternative-desktop gap and gives redundancy for a move to a different location. LAYERS : a 'file' vault entry [ title, size, blob name, per import : host, path, mode, owner, mtime ] + a separate blob directory, deduplicated by checksum name. export suggests the recorded path for the current host, falls back to other hosts' paths ; restores mode + mtime, owner only as root [ warn otherwise ] ; never overwrites without asking. BLOB NAME : keyed checksum [ key derived from the vault key ] -- a plain content checksum lets anyone with the blob dir confirm that a known file is held. BLOBS : encrypted, streamed in chunks [ per-file key in the entry, chunk index in the aead data, last chunk flagged : no reorder, no truncation ], never held whole in memory. SYNC : blobs are write-once like entry versions -> the union sync covers them, a server can mirror the store. builds on part 2 [ notes editor, overview, 3-char codes, sync ]. VAULT-FORMAT.md gets the blob layout.
    later [ user 2026-10-12 ] : zenki read vault data directly [ AMOS7::Vault, no conversion needed ]. key stays with the user : an unlocked session serves requests over a local socket [ agent model, like ssh-agent ], grants per zenka and per entry type \ code [ like the sync writer grants ], nothing readable by default -- the vault key is never handed to a zenka [ zenki run as protocol-7, the vault is the user's ].
    protocol-7-menu integration [ user 2026-10-12 ] : grants are plain agent data, set without any exchange with the zenka. the menu shows pending requests [ 'zenka X asks for entry Y' : once \ always \ deny ], lists and revokes grants per zenka, and offers time-limited grants.
    code signing [ user 2026-10-12 ] : the signing run gets the sourcecode key through the vault agent instead of a passphrase prompt, approved in the menu. stricter than other grants : approval per run [ no 'always', at most a very short window ], the request shows what is signed [ file count + list ] ; the agent performs the signing and returns only signatures -- the key never leaves it, not even to the requesting zenka.
    menu <-> agent [ user 2026-10-12 ] : an authenticated bidirectional STRM session [ see B2K ]. approving is authority : the session is bound to the real user [ kernel peer check on the unix socket + keypair login, never a claimed name -- the 2026-09-20 $USER bypass ]. a pending request names the zenka as the cube authenticated it, never as self-described [ else one zenka requests under another's grants ].
    approval as a dependency [ user 2026-10-12 ] : a request waits on 'user approved', the menu click resolves it and everything waiting proceeds [ template engine : slot resolution = dependency resolution ]. the approval carries the request id + a checksum of what was shown [ e.g. the file list to sign ] : a changed request does not match and stays open. only the authenticated menu session resolves it ; zenki can wait on it, never resolve it.
    STAGE 1 LANDED d36724870 [ 2026-10-12 ] : import \ export \ files, keyed-mac blob names, chunked cascade, mid-import check, blobs in sync. open : gc of unreferenced blobs, then the agent \ grants \ menu \ code-signing stages.
