    - the coding task wrote 6 helper scripts into <repo>/tmp/ [ removed with owner ok ] : task scratch files belong in the coding zenka's own var dir, never the repository tree
    - coding.cmd.submit already refuses an empty prompt [ "work request required" ] and decodes a B32: prefix itself -> p7c only has to send B32:<base32r> for a multi-line argument. small : a whitespace-only prompt passes [ test \S, not length ] ; the second "work request required after decoding" check repeats the first condition and can never fire
