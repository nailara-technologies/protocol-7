    - coding.cmd.ask-reply too [ owner ] : a third dialect -- param hash request \ question \ description + data appended as "Context:", literal \n unescaped, and base32 AUTO-DETECTED without a prefix [ any arg of only A-Z2-7 is decoded : a one-word all-caps prompt like REVIEW becomes garbage ] -> the shared helper serves submit, summarize-context and ask-reply alike, with explicit prefixes only [ :B32: \ B32:, :file: \ :path: ], multiline data, plain args
    - one location = one policy [ owner 2026-10-22 ] : :file: as in summarize-context reads ANY file the coding zenka user can read and hands it to a model [ on a server : ~/.n/user-keys/*.private, readable /etc/protocol-7 files ] -- through a link identity an exfiltration path. the helper enforces : allowed roots for :file: [ repo tree + a configured task dir ; never key dirs or /etc/protocol-7 ; no symlink out of a root ], forms per caller [ :file: for local admin sessions only, never link identities like remote-fetch \ assess-worker ], each form enable \ disable in the coding config, size limits on decoded \ read input, one log line per :file: read [ caller, path, size ]
    - split by who may read [ owner ] : files OUTSIDE the repo are read client-side with the caller's own permissions and sent as payload [ bin/coding-task -file already does this, base32r ] ; server-side :file: \ :path: is limited to the repository tree -- the zenka never reads a file on someone's behalf that they could not read themselves
