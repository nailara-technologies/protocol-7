    - vault sync package carries an import PUBLIC key [ X25519 ] + key id ; its private half lives INSIDE the vault [ under the master key ] -- only an unlocked host can open items
    - per item [ HPKE base \ sealed box shape ] : fresh ephemeral X25519 pair, shared secret with the import key, HKDF over [ ephemeral pub, import pub, label "p7-vault-import v1" ] -> item key, ChaCha20-Poly1305 with a random 12 byte nonce, metadata [ item id, type, source host, time, import key id ] as AAD ; synced item = ephemeral pub || nonce || ciphertext ; ephemeral private discarded at once -> a compromised remote holds nothing that opens past items. NOT a static sender key [ one key for all of a host's items, past items open once it leaks ]
    - sender authenticity : item also signed [ labelled sig ] by the sending host's identity key [ host-root delegated, like nameserv-sync ] ; importer shows "from <host>, signed, pin ok"
    - import : decrypt, write as a normal new-version vault entry, sync a tombstone so every copy is dropped. reject : tombstone + shred, nothing into the vault. ignore : local mark only, item stays in sync for another host
    - plaintext never on the remote's disk : memory only while encrypting, secret_wipe after
    - key rotation : key id per item, old import privates kept until no item names them ; replay : importer remembers imported item ids
    - primitives exist : CryptX X25519 + ChaCha20-Poly1305 [ link-upgrade ], AMOS7::Vault versions + secret_wipe, the vault sync [ HTC ]
