  details: |-
    before the loop detector fails a task [ 'loop detected: task stopped after repeated warnings' ], queue an assertion by the same model in an isolated no-tools child task : fresh context, only the task description and a short history of the last rounds [ tool calls + results, trimmed ]. the existing in-context LOOP ASSERTION REQUEST [ coding.async.state_machine, loop_assertion_pending ] asks the looping model inside the very context that pulls it into the loop.

    verdicts [ with a reason ] :
    - loop : fail the task as now, with the assertion's reason in the detail
    - not a loop : continue, reset the loop score
    - done but not finished : the work is there [ e.g. the file is written ] and only task_complete is missing -> complete the task with its output

    seen 2026-10-10 : the 35b-a3b q3_k_m wrote src/doc/model-sweep-cursor.md correctly [ criteria 3/3 ], then repeated tool calls until the detector stopped it after 347 s [ score 95.5 ] -- a 'done but not finished' case. user idea.

    advanced version [ user idea ] : a 'not a loop' verdict also proposes a whitelist regex for the content that fooled the detector [ ascii art, tables, box frames, repeated structured lines ]. the loop detector checks the whitelist first and skips the assertion for matching repetition.

    safeguards :
    - a pattern must match the flagged repetition and must not match a generic case [ test it against a few known real loops before storing ]
    - anchored and specific [ refuse .* style patterns ], length-limited
    - stored with origin [ model, task, date ] and a hit counter ; patterns that never match again expire
    - reviewable list [ e.g. a command to show / drop them ] so a bad pattern cannot silently disable loop detection
