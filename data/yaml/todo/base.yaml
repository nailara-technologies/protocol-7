    rule and worked examples, e.g. $data{'watcher'}{'io'}{'transfer'} ->
    <watcher.io.transfer>, and the partial-path form <watcher.io>->{$name}
    for a trailing dynamic key).

    Heuristic (user-specified, 2026-09-01): safe to compact any run of >= 2
    consecutive {'key'} segments immediately following $data{'key0'},
    stopping at the first character that isn't a literal '{' opening
    another key segment -- i.e. stop at a dynamic index ({$var}), a method
    call, or any other trailing expression. Applies equally to reads,
    writes, and delete.

    Related: 7XX (perltidy's own string-literal-splitting bug) is a sibling
    format-code gap found in the same general area -- worth processing
    together in one format-code pass/dispatch rather than two separate
    ones.
  done_at: 3XAZ376BDQ
