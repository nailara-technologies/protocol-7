- added: 3X32FAHIGQ
  details: |-
    the smtpd zenka still misses parts for the move [ CJ3 ] : automatic mail account setup from the contact address data in the users zenka -- in smtpd itself or in a new setup zenka. first : list what smtpd already does and what is missing [ user, 2026-10-11 ].

    secondary handling \ cross-sync [ 2026-10-11 ] -- soon needed, there is no secondary mail server today :
    1 first : a backup mx [ lower priority ] that queues and forwards to the primary -- it must check recipients like the primary [ wildcard \ provider scheme, CJ3 ], else it accepts spam for unknown addresses and bounces it to forged senders [ backscatter ]
    2 later : two equal mx with mailbox sync [ fits n7fs : mailboxes as replicated content ]
    mailbox sync as a protocol feature [ user ] : messages are immutable, addressed by checksum -- exchange checksum lists ; only the state changes [ read, deleted, moved ], each change stamped with a high-resolution ntime. a side says 'my newest state is T' [ like the httpd zenka's etag, but able to find the newest ], the other sends only what is newer ; the newer stamp wins a conflict, equal stamps decided by a fixed rule [ e.g. node checksum ]. needs the servers' clocks in step [ ntp ]

    own protocol inside, adapters at the edge [ user, 2026-10-11 ] : between our servers only the native protocol [ DATA \ DELTA streams, the mailbox sync above -- expandable with what we really want ] ; towards the world thin adapters that speak exactly what is expected, backed by the same mailboxes :
    - smtp in : smtpd zenka exists [ 14 modules : receive, parse, classify, archive, route, list, retrieve ] -- missing : STARTTLS, recipient checks for the wildcard \ provider scheme
    - smtp out : missing -- outgoing queue + retries, dkim signing, spf \ dmarc records in dns
    - imap \ pop3 : missing -- adapters over the stored mailboxes ; for the user's own reading also the CT2 web page
    - certificates : letsencr zenka exists with DNS-01 through the registrar's api [ and cloudflare ] -- dns-01 works for any name, so the mail host names join the automated renewal ; missing : mail names in the certificate, smtpd \ imap loading it and reloading after renewal
  done_at: null
  id: UZU
  priority: normal
  status: open
  tags:
  - smtpd
  - users
  - setup
  text: "smtpd : automatic account setup from the users zenka's contact data"

