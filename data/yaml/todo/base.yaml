    move every service off the old low-power host onto the two new servers [ neighbors at the same provider, unlimited traffic between them ], make them resilient and convenient, then retire the old host [ user, 2026-10-11 ]. no host names or addresses in the tree : old host, new server 1 \ 2.

    - services : smtpd [ see UZU ], http[s]d, and the rest the old host runs -- list them there first
    - mail today on the old host : postfix and its mail set-up, read with neomutt directly on the host. all need native protocol-7 replacements : smtpd zenka for receiving \ sending [ instead of postfix ], mailbox storage, and a reading client [ a zenka-served mail view, e.g. in the CT2 web page, or an nshell \ terminal reader ] -- migrate the existing mailboxes before the old host goes
    - addressing to keep [ generic, no real addresses in the tree ] : a wildcard per user subdomain [ *@<user>.<domain> ] catches everything ; providers each get their own local part there [ <provider>@<user>.<domain> -- shows who leaked or sold an address, easy to filter or shut off ] ; plain accounts on the main domain [ <user>@<domain> ] exist too. the smtpd zenka needs : wildcard subdomains per user, routing \ folders by local part, plain accounts. the vault's login entry for a provider can record which address it uses [ 5OT ]
    - nameserv is NOT on the old host : a separate goal for the self-contained set-up [ dns is at the registrar's panel today ]. e.g. own authoritative server on a new server, the registrar or the other new server as secondary ; later zenki manage records through the registrar's api, credentials from the vault [ 5OT ]
    - local proxy : hysteria already runs on new server 1 but no config is migrated yet ; the udt-link zenki are meant to replace hysteria with native links later
    - protocol-7 itself : new server 1 and the old host already run it [ 3X2YZXGSNY-9883.0 per the 2026-10-09 handover ] ; the cube binds 127.0.0.1:42 by design, reached through an ssh forward + p-7-r [ handover open item 2 ] -- then known nodes between the hosts instead of plain ssh config
    - resilience : the two servers back each other up [ nameserv secondary, smtp fallback mx, http failover ] -- decide per service
    - inference : see 6WP [ new server 1 runs fablevibes on cpu at 56 \ 9 t/s ]

    dns + mail redundancy [ 2026-10-11 ] -- once there were 3 dns and 3 mail servers, today no secondary :
    - name servers DN0000 and DN0110 under the project's network domain [ both pass the harmony check, lower and upper case ] on the two new servers : one primary, one secondary [ zone sync via axfr \ ixfr, later the nameserv zenka ]
    - the registrar's name servers as a third, a secondary of our primary -- the two new servers are neighbors in one data center [ rfc 2182 : avoid a shared point of failure ], the third sits outside it
    - two name servers usually suffice for delegation ; check the exact .ax \ .network registry rules in the registrar's panel
    - glue records : the name server names lie inside the delegated domain, the registrar needs their ips as host objects
    - certificates : dns-01 is already underway [ memory handover 2026-10-09 acme async, open item 5 : zones + nameserv on both servers, the cross-host route to the 2nd nameserv, the registrar delegation, the wildcard test ; data/tasks/letsencr-acme-async.md ]. done : acme flow on the event loop, nameserv add-txt \ remove-txt with longest zone match, dns-01 providers for the registrar's api and cloudflare. one wildcard certificate for the project's network domain would cover the name servers, the mail host names and every service host -- smtpd \ imap need no certificates of their own
    - keep new server 1 running without break [ user, 2026-10-11 ] : its ram \ disk upgrade [ 24 GB, 450 GB ] was a one-off grant for an accounting change -- a regular re-order would not get it again. never cancel or pause it to save a month's cost ; its old plan cannot be ordered any more
