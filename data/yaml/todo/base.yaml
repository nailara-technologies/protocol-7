- added: 3X3YJK6VPU
  details: |-
    presets as dotted config keys, nesting from the dots :
      coding.cfg.mode.default.model = <fablevibes>
      coding.cfg.mode.code.model    = <35b q3>
      coding.cfg.mode.code.new.max_rounds = ..
    lookup walks up : code.new.parser -> code.new -> code -> default. a sub-mode only lists what differs.
    settings per mode : model, tool set \ groups, reasoning budget, max rounds, budget, result template, later a reviewer model.

    choosing the mode, most explicit first :
    - prompt tag :mode:code.new: [ like :image-attach: ]
    - mode: per task in batch specs and todo items [ XOJ overnight runs ]
    - automatic classification later [ RC7 ], fallback default

    grouping : a 35b load takes ~6 min -- the queue groups tasks by the model their mode resolves to, batch \ overnight runs order by model, a single interactive task may still switch.

    purpose [ user, 2026-10-10 ] : other zenki submit work by mode and never manage models themselves.
    seen 2026-10-10 : fablevibes 14b fast + reliable on edits \ docs, 35b q3_k_m on new code [ coding-35b-compare ].

    combined selector [ user, 2026-10-10 ] : the mode also picks the context template(s) and the system prompt, not only model + settings.
