    - a small working seed : the model batch blob store [ content-addressed blobs, manifests, verify, atomic restore, diff ]

    missing link : the import command -- chunk, address under a branch.* path in an epoch, replicate over DATA \ DELTA to N nodes, remove the source only after the copies are confirmed. order matters most : any failure leaves the source in place.

    one structure for everything [ user, 2026-10-11 ] : storage, precomputed search index, routing \ discovery topology and filesystem overlay the same <epoch>/<amos>/<bmw> tree. the anonymized checksum search [ EPOCH-CHECKSUM-EXCLUSION-ADDRESSING.md, section 'cross-epoch exclusion as collision load-balancer', ~line 555 ] : the query is an amos checksum of 'search.type : <pattern>', the reply a BMW-L13 proof matching the BMW384 content checksum, which is also the anonymous, cacheable route to the data [ any cache on the route answers early ]. the index regenerates per epoch ; cross-epoch exclusion keeps a query from epoch E resolvable at E+1. an epoch/chksum level is a fixed 14 characters -- an N-deep path is N * 14 characters, homogeneous lookup latency, only depth varies [ stricter than classifying segments by shape ].

    later : resource accounting on the same structure [ user, 2026-10-11 ] -- read-me/documentation/dev/NRT.NRD.asc [ amos resource tokens : accounts = 7-char amos checksum + c25519 public key, signed ; token value = total connected resources \ user accounts ; resources = disk storage, data traffic, processing ] and data/md/design/NETWORK-RESOURCE-TOKEN-ARCHITECTURE.md [ layer 5 : resource distribution ]. n7fs gives the measurable units : a replicated chunk = an <amos>/<bmw> directory of known size on a known node, the redundancy factor N a visible cost, DATA \ DELTA streams the traffic, remote batches the processing. not needed for the first version.

    P7REF ties in directly [ user, 2026-10-11 ] -- data/md/design/P7REF-STORAGE.md :
    - the outward syntax : p7://<type>:<address>[@<authority>][|<segment>][?<query>] [ checksum, 9p, path, segment, nested ] -- how a node or user names something in n7fs without knowing where it is stored ; 'storage p7ref resolve' exists as the resolver
    - typed checksums : base.p7refs.gen_template_chksum builds the reference type [ P7REF CODE REF HASH SCALAR ARRAY GLOB ] into the checksum through truth templates, optionally excluding the other types -- the same mechanism as the cross-epoch exclusion. a checksum carries WHAT it addresses as part of its value
    - in the layout : references/<ntime>/<amos>/<bmw>/addr holds P7REFs, and a reader tells a reference checksum from a content checksum by its value, not only by the segment's width

    implicitly callable references -> a distributed computing substrate [ user, 2026-10-11 ] :
    - code is content : every module is a signed file ; a CODE-typed checksum addresses executable code like any data
    - calling a reference = resolve to code and run it where it is cheapest [ code to the data or data to the code ] -- the address does not say where
    - results are content too : for deterministic code, ( code checksum, input checksum ) fixes the result ; stored under its own checksum with a reference from that pair, a repeated call anywhere finds it instead of computing -- network-wide memoization through the same dedup as files. ties to the dedup tree [ convergence of independent attempts = confidence ] and to resource accounting [ processing as a measured resource ]
    - precondition : before running code by reference, verify its signature against a trusted key and check access -- AMOS7 signatures and the C25519 trust identity [ host-root ] exist to build on
    - the source of every call is accessible by naming convention [ user ] : a fixed key under the code's checksum holds it [ e.g. <epoch>/<amos>/<bmw>/source, beside signature and meta ] ; a result's references lead to ( code, input ) and from there one fixed step to 'source'. no call is a black box -- anyone holding a result can read, verify and reproduce the code that made it. continues how protocol-7 works today : <[module.name]> calls, the same name leads to the readable source in src/ -- n7fs keeps that across the network, with a checksum for the file name
    - source code and release versions become coordinates as relevant as network timestamps and epochs [ user ] -- the version format already is one : cfg/protocol-7.src-ver = ntime + release counter [ e.g. 3X3YNK45GI-9928.0 ]. a result is located by WHEN [ epoch, ntime ], WITH WHAT CODE [ code checksum, release ] and FROM WHAT INPUT [ input checksum ]. gives : no silent overwrite on a new release [ older results stay addressable under their version, comparable with the new one ], reproducible past states [ the code that ran then is reachable like the data ], release diffs as the set of results that changed for the same input

    version control as the completing element [ user, 2026-10-11 ] : a differential, metadata-carrying filesystem with callable references makes importing the source history and a version-aware network one logical flow.
    - git is a content-addressed filesystem already : blob -> content under <epoch>/<amos>/<bmw>/, tree -> a directory manifest checksum [ like model_batch.manifest ], commit -> a node with references to its parents, meta, ntime + release counter ; the amos7 signatures in every file arrive with the content
    - import from a stream : git fast-export gives the whole history in order [ ~10k commits back to fbb9a337a, 2012 ]
    - keep each git sha1 as a reference : links, commit messages and memory notes stay valid
    - git stays the gateway for a while [ push, external tools ], n7fs history grows beside it ; two-way sync later
    - signing becomes native : what the pre-commit hook checks today [ signatures, version counter ] becomes part of creating a version node
    - result : a code version is a node, results reference it -- the network knows which version produced what

    native branching -> task \ flow \ context integration and entity management [ user, 2026-10-11 ] :
    - a branch = a new node pointing to its parent state ; cheap, unchanged content is shared
    - a task branches off a state and works there ; its result reference can be assigned as a dependency to a parallel task
    - dependency management belongs in the P7REF structure : a dependency is a reference that does not resolve yet, resolution = it now points to content and the waiting side continues. base.dependency.* [ objects + callbacks, used today by the model pin's model_checksum_loaded ] is the runtime of exactly that
    - parallels the template structure : data/md/design/TEMPLATE-RESOLUTION-ENGINE.md [ a tree of named slots, each resolved through a typed chain ; ui layout, application, zenka, data tree, STRM channel are views of one tree ; part of it used by the web zenka : process-template, execute_template_command ]. an open slot = an unresolved reference, a resolved subtree = a state
    - entities \ zenki : a zenka can run on a branch of its state [ try something without touching the main line ]
    - cases of the same thing : coding subtasks, XOJ overnight results, CT2 fix branches -- work on a branch of a state, the result a reference others wait for

