- added: 3XLKLZUNG4
  details: |-
    N7FS -- a checksum-addressed, replicated network filesystem. an import command [ 'assimilate' ] turns local files into network content : verified, redundant, then removed from the old location [ user's design, notes 2026-10-11 ].

    lineage : bin/assimilate in the very first commit [ fbb9a337a, 2012-06-05 ] moved files to /data/files/<sha1>.<ext> with a metadata record [ name, file format, size, mtime, import time, md5 + sha1 ]. same idea : a file loses its location and gains an address from its content, name and metadata survive as description.

    layout [ user ] : checksums are directory levels, never file names ; under them key names as files or directories, categorically, e.g.
      <epoch>/<amos>/<bmw>/content | chunks/ | meta/ | references/<ntime>/<amos>/<bmw>/addr
    - an amos collision is no error : two <bmw> siblings under one <amos> directory
    - epochs and timestamps give categorical grouping [ validity windows, time-sorted history ]
    - depth must stay open-ended -- needs that cannot be guessed now. every path segment is classifiable by shape alone [ ntime \ epoch b32, 7-char amos, long bmw, lowercase key word ], so a reader walks any depth without a fixed schema and new levels need no migration
    - free with this : reverse references [ reference counts for cleanup, provenance ], atomic publish [ build under a temp name, one rename ], verify-by-path [ the path is the checksum ]
    - to weigh : inodes \ 4k blocks per small key file [ chunk size, packing ; xfs copes better than ext4 ], very large <amos> directories [ an optional prefix level ]

    root and holders [ user, 2026-10-18 ] : /N7FS/<disk-id>/<epoch>/<amos>/<bmw>/content
    - /N7FS/ is the one fixed entry point ; a real directory under / or a symlink into /var/ or /data/ -- a per-host choice, tools only know /N7FS
    - <disk-id> = the holder : an amos checksum over the initialization parameters [ public key, network timestamp, name or type .. ], written INSIDE the store as well as being its directory name. attach \ detach = mount \ unmount at /N7FS/<disk-id> ; on attach the name must match the id inside [ wrong disk under a remembered name, or a clone = a duplicate id, never a silent second holder ]
    - and the SIGNATURE of a parent or root key [ e.g. host-root ] over the context intent, the timestamp and the public key delegated to -- the id then carries its own authorization : anyone holding the store verifies who created it, for what, and that the store key was delegated [ same shape as host-root signing the cube key, .dlg ]. the signature, the signed fields and the delegated public key are kept inside the store, so the id can be recomputed and checked on attach
    - collisions avoided at decision time : if the id is taken, take the next network timestamp [ smallest increment ] and checksum again
    - nested form <mount>:<disk> [ user, 2026-10-18 ; the nested <amos>:<amos> checksums ] : <disk> is the dataset identity, stable and transferable across the network ; <mount> is a checksum per attachment [ e.g. over disk-id, host key, mount timestamp ], new on every mount. usage is ONE checksum by context -- the disk to address the dataset, the mount alone as the local handle [ unmount ] ; <mount>:<disk> is the full form saying what it is. a clone or replica attached elsewhere = the same <disk> under another <mount> : explicit, verifiable, countable as a holder -- never silent
    - the DISK is the parent, mounts are back-references under it [ references/<ntime>/<mount> ] -- a disk can have several parallel mounts, so no mount can be its root ; finding the disk from a mount handle is a lookup, not a hierarchy. the directory stays /N7FS/<disk>/. mount records kept in two places : the host's registry [ known while the disk is detached or read-only ] and the disk itself when writable [ its travel history ] ; signed, timestamped entries -> merging is a union. refine at the next opportunity
    - CLONE AWARENESS for every mobile storage protocol-7 writes to [ user, 2026-10-18 ; from data/tasks/device-database-auto-install.md ] -- comes implicitly from timestamps + signatures together : each attach appends a signed, timestamped mount record to the disk's own travel history, so a cloned disk shows up as the SAME disk-id with two DIVERGING signed histories [ a fork, dated by the last common record ]. a missing or unsigned record fails closed
      the same for VM IMAGES [ user ] : each boot appends a signed, timestamped record -- a cloned vm forks its history, and a vm restored from a SNAPSHOT presents an OLDER state. rollback needs an external witness : the network remembers each identity's latest record [ a vm alone cannot know it was rolled back ]. also catches the classic clone flaw -- copies sharing host keys and machine-id
      CHEAP form [ user ] : the witness keeps only a signed FIRST-use and LAST-use timestamp per identity -- together they define the available ROLLBACK WINDOW. a presented state dated inside [ first, last ) is a genuine earlier state of this identity [ a snapshot -- allowed or not by policy ] ; before first or unsigned = foreign or forged ; equal to last = current. two timestamps instead of a history
    - id length [ user, 2026-10-18 ] : amos-7 is unique only where a registry checks it [ inside one namespace, retry at decision time ]. across namespaces ids are never compared bare -- like cube session ids, the REFERENCE between two ids is the route, both may come from the same or separate namespaces, and that held reference is the functional part. so two equal amos-7 disk-ids in two networks never collide : each is reached through its own link [ <route>:<mount>:<disk>, nested ]. a longer checksum [ BMW-L13 over the same signed init record ] stays useful as PROOF when a link is set up [ which disk is behind it ], not as a global name
    - global addressing [ user, 2026-10-18 ] : DISCOVERY is the true global root, and it maps into addressing topologically. content is global already by its checksum [ the WHAT needs no namespace ] ; holders, disks and nodes are the WHERE -- found through discovery [ discover's orbital p7refs, nodes' position from ip + session key, nameserv <amos>.n7fs.<domain> -- see below ], reached through held references. a global address = a discovery position plus the route from there
    - the TRUE address is multi-dimensional [ user, 2026-10-18 ] : true as in always valid -- all the elements a re-discovery needs. context is the essence : the same key or the same bytes can be different things in different contexts [ a reused key ; two users with one public key told apart by name and creation epoch already, plus attributes like the home network ]. the content checksum fixes the bytes, the context dimensions fix what they ARE. existing forms to build on : the epoch + key + name triple <epoch>:<key>:<name> [ data/tasks/epoch-validity-search-protocol.md, e.g. V7L36SA:K:username ] and typed checksums [ base.p7refs.gen_template_chksum : the reference type inside the checksum value ]
    - one id per filesystem, not per physical disk ; meta records the device, so two partitions of one drive do not count as redundancy
    - addresses stay root-free [ <epoch>/<amos>/<bmw> ] and identical on every disk -- resolution looks under each attached disk-id, finding it under several IS the redundancy count. <disk-id> and <amos> share a shape, the position [ directly under /N7FS ] tells them apart
    - FIRST VERSION need not be perfect [ user, 2026-10-18 ] -- the early focus is converting datasets to upgraded versions EASILY and SAFELY : every store and node records its format version in meta ; an upgrade = read the old form, write the new one beside it [ e.g. under a new epoch ], verify, then switch -- the old form stays until the new one is confirmed, same order as assimilate [ any failure leaves the source in place ]. a converter per version step, chained for older stores
    - from the VAULT design [ user : will come in handy -- data/md/design/VAULT-FORMAT.md, data/ai-mem/claude/project-2026-10-09-vault-ntime-landed.md ] : a magic + FORMAT BYTE in every binary header [ 'P7VK' \ 'P7VE' + format ] -> the version the converters need ; one IMMUTABLE file per version -> sync = union of files, restore = undelete ; synced writes [ tmp + fsync + link \ rename + dir fsync ] -> atomic publish ; read back + compare after writing ; a damaged newest version falls back to the older one ; restore never replaces and refuses a foreign store [ = the disk-id check on attach ] ; a REFUSAL must happen before any state is changed [ the rewrap bug : refused after the wrap was already removed ] ; recovery proven by an independent reader written from the spec alone -> write the N7FS spec so a second implementation can read a store. CAUTION : base32 ntime sorts only with JITTER [ not strictly monotonic at fine resolution ] -- the vault names use decimal ; references/<ntime>/ path segments need a sortable form
    - why the vault fits [ user ] : it was built for three constraints -- standalone [ no running network needed ], secrets handling, and backups stored on FOREIGN or potentially taken hosts. that is the N7FS holder threat model : a holder cannot read [ ciphertext ], cannot forge [ aead \ signatures ], can only withhold or delete -- answered by redundancy across holders
    - that is the MINIMUM protection state [ user ] ; distribution itself adds the next one, above all on SUB-BIT level : no holder keeps whole bits, only shares -- even with a key compromised, one holder's part reveals nothing [ xor \ threshold secret sharing ; k of n holders reconstruct, fewer learn nothing ]. the keys archive's bit-splicing, declined for the single-location vault [ no gain under an aead ], gains its purpose here
    - a further layer [ user, later ] : only GROUPS of zenki -- not attackable as a group because they are distributed -- can work with a dataset at all [ known form : threshold \ secure multi-party computation, no single member ever holds the whole ]. now : the base level only ; the patterns built here [ shares, thresholds, verify-before-switch ] are expected to reappear at other scales
    - placement and transport [ user, 2026-10-18 ] :
      - `:<content>` [ empty holder part ] = root-free address : read finds any copy ; a WRITE lets placement pick the holder [ next best by policy : local first, space, redundancy target, trust ] -- the content part is computed, a mismatching write is refused. model ids already have this split [ install-path part : content part ; `:QDBKEXY` ], the leading colon replaces any wildcard
      - latency CASCADE : accept into the fastest tier, trickle to slower durable tiers [ irrigation ] ; holders get a tier class [ volatile, local durable, remote durable ] -- volatile copies never count toward the redundancy target
      - UNMOUNT the source as soon as every byte is read and verified in memory [ the medium still holds its data, re-insertable ] ; RELEASE [ delete ] only after N durable copies. exception : a medium with its own history [ mount record, rotating identity material ] gets its signed reception record written BEFORE unmount
      - confirmations can arrive DEFERRED at any later network entry point ; task results travel the same way -- a mobile medium is a store-and-forward relay [ delay-tolerant networking, the data mule ] ; signed entries, so no trust in path, place or time
      - optional NETWORK DEDUP : compare at least two independent checksums [ e.g. amos + bmw384 ] with a network copy ; if every assertion matches, the local copy is dropped instead of transferred and a reference to the network version stands as if the transfer completed [ only when that copy is durable, N holders ]. the same frees space temporarily while the network is assumed stable -- re-fetched on demand
      - and per BLOCK, not only per file [ user ] : a range [ offset, length ] identical to one in the network is referenced from there in the tree -- same range, same checksum address on both sides. fixed offsets lose alignment after an insertion ; content-defined cut points keep it [ the mod-13 rolling chunker : data/tasks/darksun-mod13-rolling-chunker.md -- cut where a rolling window reads 0 mod 13 ], so shifted data still dedups. or SCAN the offset [ user ] : slide a cheap rolling checksum over the local data, byte by byte, against the network's block list and confirm a hit with a strong checksum -- matches at any offset [ the rsync algorithm ]. both together : content-defined blocks for storage, the offset scan for transfers against blocks cut elsewhere. the SAME mod-13 window serves both : 10^6 = 1 mod 13, so a 6-digit window rolls in one step [ v' = 10v - d_out + d_in mod 13 ] -- the cut rule and the weak rolling checksum of the scan [ simulated 2026-10-02 : a 1-digit insert changed zero boundaries ; data/ai-mem/claude/topic-harmonic-correlation-ledger.md ]
    - first store : on the xfs data disk [ suits the many small key files ] ; the image store is the first user -- the invoke-web image index [ invoke-web.index.backup_path, 48680 images ] can serve as assimilate's source list

    designs it brings together [ data/md/design/ ] :
    - path structure : BRANCH-NAMESPACE-MASTER.md [ branch.* addressing layer ], P7REF-STORAGE.md
    - nested checksums + epochs : EPOCH-CHECKSUM-EXCLUSION-ADDRESSING.md [ newest, 2026-10-02 ], CHECKSUM-NESTED-ADDRESSING-AND-EPOCH-VALIDITY.md
    - update protocol \ streams : DATA-PROTOCOL-SYNC.md [ DATA reply, DELTA with the state checksum as sync point ; open : DELTA diff module, ACK, backpressure ], DANCING-ZENKI-RHIZOME-STATE.md [ travelling checksum tree ]
