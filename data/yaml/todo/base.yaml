  details: |-
    user 2026-10-29 : coding \ review zenki, models and users drop ideas into the channels where they arise [ chat channels, task notes, review findings ] ; those are collected into one incoming queue [ deduplicated, with origin ]. at night, when all systems are idle, models discuss the queue together and prepare PRIORITIZED suggestions for the morning -- suggestions only, the user decides. related : XOJ [ overnight results as reviewable patches ], 6WP [ remote overnight batches ], HX4 [ review zenki that would also emit findings ], llm.service.consensus_vote [ for agreeing on priority ]. not the same as the 'idea pool' in NETWORK-SNAPSHOT-AND-IDEA-POOL.md [ that one is a capability view ] -- name them apart.
    admission review [ user ] : the intake has its own security review layer BEFORE an idea is admitted -- the queue feeds models with more overall capability, so an unreviewed idea is a prompt-injection path [ a crafted 'idea' from a page, mail or remote channel steering a more capable model ]. ideas from outside sources are treated as data : screened [ instructions, payloads, links ], tagged with origin and trust, and only admitted ideas reach the night discussion ; rejected ones stay visible for review, never silently dropped.
    why a review, not redundancy [ user ] : the set-up lets ONE model have an idea. making that tamper-evident by redundancy would need e.g. 7 models on the exact same task with the exact same seed entropy and a 5 of 7 agreement -- costly. a security review of what the single model produced is the efficient alternative ; the heavy 5-of-7 form stays available for the cases that warrant it.
    optional remote validation [ user ] : ideas are rare compared to rounds, so reproducing the round that produced one stays affordable -- re-run that exact task with the same seed entropy on remote models [ deterministic inference : same model, sampler, seed ] and compare. matching reproductions add logical trust to the idea ; a mismatch is a flag for the review. per-idea and optional, sized by how often ideas actually occur.
