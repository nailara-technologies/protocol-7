    - already planned [ user ] : data/asc/what-AI-thinks/markdown-form/protocol7/specs/DNS_RHIZOME.md [ 2025-10-17 : node records in public dns -- TXT 'v=proto7 vm= loc= cost= ram= bw= harmonic=', SRV with priority \ weight, DNSSEC signatures, client discovery through a validating resolver ] and data/md/documentation/DNS_RHIZOME_ROADMAP.md [ phase 1 done : dns, discover, nodes \ tofu ; phase 2 in progress : txt \ srv generation, zone integration, dynamic updates, dnssec ; phase 3 open : cubic positioning, neighbors, rings, 5-of-7 consensus ; phase 4 : load-aware routing, failover, task migration ]. links : phase 3 positioning partly arrived through the nodes zenka's orbital p7refs ; the txt capability fields [ cost, ram, bw ] are the resource declaration NRT accounting needs ; phase 2 dynamic updates = what nameserv's add-txt \ remove-txt began ; checksum names <amos>.n7fs.<domain> = a new record type in the same scheme

    closing the loop : the network stores its own set-up [ user, 2026-10-11 ] -- zones, zenka configs per host, host records \ contracts [ non-secret metadata ], certificates, the vault : versioned, replicated, signed, in n7fs.
    - rebuild a node : a new or reinstalled server fetches its set-up by reference, verifies checksum + signature -- restored, not hand-configured again [ the safety the move needs ]
    - every change is a version : a zone edit or config change is a node with ntime, release and author -- visible, revertable
    - one source for what depends on each other : registry glue, zone records and server ips come from the same data, an ip change is one change
    - rule : secrets stay encrypted -- vault entries and private keys enter n7fs only as the ciphertext p7-vault already writes ; replication copies ciphertext, only key holders open it
    - and so : reproducible [ user ] -- setup, code and data all versions in one structure : any past state [ epoch + release ] rebuildable exactly [ retrace a bug as it really happened ] ; test environments by branching the setup [ identical except the change -- where CT2 fix branches can run without touching the live system ] ; verifiable : same setup + code + data versions -> same checksums, divergence shows at once [ the dedup tree's convergence principle ]
