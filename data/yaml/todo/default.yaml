- added: 2026-08-16T03:57:16
  details: |-
    the coding zenka has an abort-inference and a stop-task command :


    coding.commands abort

                                       .: 'coding' zenka commands :.

    abort-inference [task_id] __ abort the currently-running or specific inference call

    coding.commands stop-task

                                       .: 'coding' zenka commands :.

    stop-task [task_id] __ stop a running coding task


    ..the coding task is to check if current tools in bin/mcp-server-p7
      exist that would stop a codinng zenka task, i.e. summarization, and
      if so, if a propagation command for aborting inference is missing.

      if there are no such p7_ tools in the MCP server list yet, the question
      is if there should be added one for that. because often the coding zenka
      is multiplexing inference tasks, and a summarization with rolling window
      can occupy the coding zenka it for many more minutes.
  done_at: 2026-08-17T18:49:31
