context:
  destination: atom.host
  tags: [ mobile, high-loss ]

transports:
  - type: udt-tunnel
    endpoint: atom:7000
    credential: atom.udt-psk
    min_quality: { loss_max: 0.95 }

  - type: quic-hysteria
    endpoint: atom:443
    credential: atom.hysteria-auth
    min_quality: { loss_max: 0.95 }

  - type: direct-tcp
    credential: ~
    min_quality: { loss_max: 0.30 }

fallback: direct-tcp

