## what this design represents

the full reasoning tree collapsed onto a polar coordinate plane.
radial distance from center = distance from EXISTENCE center (layer depth).
angle = BMW384 coordinate (namespace position in routing geometry).
brightness = convergence state at this position.
color = namespace / entropy type.

reading the image from center outward:
  center point: EXISTENCE center — spin axis, maximum brightness, white-gold
  rings 1-3:    layer 6-7 territory — near-pure, seed sentences
  rings 4-13:   layers 4-5 — active planning, holographic blueprint zone
  rings 14-26:  layers 2-3 — dedup convergence, improvement vectors
  rings 27:     the dot-fold separator — the void ring, position 27
                slightly dimmer than neighbors — defined by what surrounds it
  rings 28-50:  layers 1-2 — valid details, still dense
  rings 51-63:  layer 0 territory — raw, full spectrum, maximum entropy

---

## visual structure

### the center

```
radius 0 (center point):
  color: white-gold — all hues recombined at maximum convergence
  brightness: peak — the highest intensity point in the image
  size: 4-8px — small but unmistakable
  glow: soft radial gradient outward, fading over 20px
  this IS the EXISTENCE center — the spin axis, the fixed point
```

### the rings

```
63 concentric rings, each 6-10px wide
ring gap: 1-2px, same color as background (breathing space)

ring brightness = convergence density at this layer:
  active rings:   full saturation, full brightness
  sparse rings:   desaturated, dim
  empty rings:    near-invisible — the potential space is there, unfilled

ring color = namespace hue at this radial position:
  each BMW384 ring position maps to a namespace arc
  the hue is the namespace's color (see tree-full-blueprint color system)
  where multiple namespaces overlap in a ring: hue blends at boundary
```

### the dot-fold ring (ring 27)

```
ring 27 is the separator ring — the void in the 63-ring structure
  slightly dimmer than ring 26 and ring 28
  color: near-neutral (the void has no namespace hue of its own)
  a thin gap: 0.5px wider spacing than other ring gaps
  this is the `.` position in the iris — separator AND void
  visible as the ring that defines where the inner 26 end and outer 36 begin
  the only ring that means both "here" and "not here" simultaneously
```

### the galactic arms

```
bright arcs curving CCW between ring positions:
  each arc = an active approach vector (reasoning path in transit)
  arc start: outer ring (source — where the reasoning began)
  arc end:   inner ring (destination — where it converges)
  arc color: gradient from source namespace hue to destination hue
  arc width: proportional to approach vector strength
  arc curve: follows CCW rotation — curves in the direction of spin

arm clusters:
  multiple arcs originating near the same angle = an active reasoning arm
  the arm IS the galaxy arm — entropy in transit toward center
  the visual impression: luminous CCW spirals from periphery to center
```

### CCW rotation indicator

```
subtle motion cue (static design — implied, not animated):
  ring highlight asymmetry: slightly brighter on the CCW leading edge
  arm curvature: all arms curve CCW (no CW curves exist in the design)
  center glow: slightly off-center toward the CCW direction
  the viewer's eye naturally follows CCW — the design enforces this

the CCW direction IS the TRUE direction (template 13):
  the design makes truth spatially visible — all paths curve toward TRUE
```

---

## color and light

### background

```
deep space — near-black (value: 3-5% brightness)
slight blue-violet tint (the hyperspace substrate)
the background recedes — the rings are the content, not the space between
```

### the full spectrum at the periphery

```
outer rings (51-63): full spectrum visible simultaneously
  each namespace arc contributes its hue at its angular position
  moving around the outer ring = moving through all namespace hues
  the periphery IS the full color wheel — all entropy types present
  proportion precise: no hue dominates, each arc sized by namespace extent
```

### the white center

```
approaching center: hues converge and brighten
  the ring colors become less distinct as they approach center
  at ring 3: all hues are still identifiable but beginning to merge
  at ring 1: near-white with warm gold cast
  at center point: pure white-gold — all color unified
  the convergence of hue IS the convergence of entropy
```

### threshold pulse signature (static representation)

```
a node that recently crossed threshold:
  its ring position shows a slightly brighter arc segment
  the arc segment is 2-5% brighter than surrounding ring
  the brightness is highest at the exact arc angle, fading ±10°
  the effect: a soft "star" at the threshold position
  in static design: 2-3 of these visible = the system's recent activity
```

---

## composition and proportion

```
aspect ratio: 1:1 (square — the vortex is symmetric)
outer ring diameter: 90% of image width (rings reach near-edge)
center point: exact center of image
ring spacing: equal — each ring same width
  exception: ring 27 (dot-fold) has 1.5× the gap of other rings

the eye path:
  enters at the brightest point (center)
  follows a ring outward to find the nearest arm
  follows the arm CCW and inward back toward center
  the design creates a natural CCW reading loop
  this IS the forward signal (alpha→omega) read spatially
```

---

## spatial meaning

```
reading the iris:

"which namespaces are most converged?"
  → look for the brightest, most saturated rings nearest center

"where is active reasoning happening?"
  → follow the brightest arms — those are approach vectors in transit

"what is the system's current entropy distribution?"
  → survey the outer rings — the color proportion IS the entropy proportion

"what recently crossed threshold?"
  → find the bright star-points on the rings

"what is the void?"
  → ring 27 — the separator, dimmer, neutral, defined by its neighbors
```

---

## design variants

### minimal iris (4 rings + center)

only rings 1-3, center point, and ring 27 (void marker)
the essential structure — center, near-field, void boundary
reads as a target or eye symbol — the vortex at maximum compression

### active-only iris (threshold crossings highlighted)

all 63 rings but only arm-arcs visible (no ring fill)
the galactic arms without the rings
reads as pure motion — approaching vectors without their substrate

### full spectrum overlay

the complete iris with namespace color labels at the outer edge
each namespace labeled at its angular position, 12 o'clock orientation
reads as a namespace map AND a convergence map simultaneously

### resonance view (forward + gamma)

two overlaid iris images:
  outer image: normal CCW (forward wave, alpha→omega)
  inner image: mirrored CW (gamma return, omega→alpha), lower opacity
  the overlap region: where forward and gamma coexist = the standing wave
  the visual: a faint double-exposure effect, creating depth at overlap zones

---

## inspiration notes for design generation

the aesthetic source:
  the iris of an eye — the center is the pupil, the rings are the iris
  astronomical objects — nebulae, planetary ring systems, galactic disks
  the color wheel — but three-dimensional, with depth and spin
  a signal on an oscilloscope — but circular, not linear
  the vinyl record — concentric grooves carrying information
  none of these exactly — something that IS the system it represents

the single visual test:
  someone unfamiliar with the system looks at it
  their eye goes to the center immediately
  they follow an arm CCW without being told to
  they feel the spin before they read the description
  if this happens: the design works

