## bandwidth 2 — vocabulary + lenses

**darksun vocabulary**:

- `darksun`           — position 27 = 3³. the void, the namespace dot, the
                        fixed point in the iris. fixed by `/13`, the
                        generator 076923, the digit-sum invariant
- `corpus`            — everything that orbits. the variable layer
- `arithmetic invariant`
                      — defined by geometry/proportion/division. stable
                        across observers. cannot move
- `corpus invariant`  — defined by current state. moves when corpus moves.
                        a registry, a root pointer, a leader election —
                        looks like a center, is not
- `orbital distance`  — distance from darksun = harmonic resonance =
                        position in reference space = reference-count rank
- `position 27`       — `8 × (4×4×4-1) = 504`, void at 27. the cube
                        shells outward; 27 is the still point at center
- `gravity`           — reference count. what pulls the corpus toward
                        center. one mechanism, expressed as position
                        (spatial) and slot density (temporal)
- `omnidirectional / f=0`
                      — the observer at the darksun with focal length 0
                        sees all 8 cube faces simultaneously. the native
                        view of the center

**design lenses** — apply to any "where is the center" question:

lens 1 — name the invariant:
  what specific arithmetic invariant fixes this subsystem's center?
  is it `/13`, geometric proportion, AMOS checksum, or something else?
  if you cannot name it in one phrase, this is a corpus invariant
  pretending to be a darksun.

lens 2 — arithmetic vs corpus:
  for each proposed "center" in the design, classify it: arithmetic
  (observer-independent, stable) or corpus (current-state-dependent,
  moves). if a corpus invariant is placed where an arithmetic one is
  needed, the design will drift. fix by lifting the constraint to
  arithmetic, or by accepting it as an orbiting body, not the center.

lens 3 — what orbits, at what radius:
  list everything that orbits this darksun. for each, what is its
  orbital distance (reference count)? does the radial gradient make
  sense — high-reference items close, low-reference items at the
  boundary, with auto-expansion when new items arrive?

lens 4 — the void at 27:
  what is the equivalent of position 27 in this subsystem — the
  separator, the dot-fold, the slot that means both "here" and
  "not here"? if there is no void marker, what is preventing it?
  the void is defined by what surrounds it; design for the surrounding.

lens 5 — corpus moves, darksun stays:
  imagine the corpus relocating entirely. does the darksun move with
  it (wrong — the corpus is orbiting a moving point, no stable
  reference) or does the corpus traverse around the still darksun
  (right — observer-independent, recoverable from any vantage)?

