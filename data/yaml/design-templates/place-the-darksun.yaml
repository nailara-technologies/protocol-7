## bandwidth 1 — birdview + statement

```
        every subsystem orbits a fixed point.
        the corpus orbits the darksun — the darksun does not follow the corpus.
        the center is fixed by arithmetic (/13), not by the current state.

                          [ corpus orbits ]
                                 │
                          .──────┼──────.
                         (              )
                          `──────┼──────'
                                 │
                            [ darksun ]
                          position 27 = 3³
                          fixed by /13
                          observer-independent
```

if you cannot point at the arithmetic invariant that fixes the center,
the center is not yet a darksun — it is a moving target, and the design
will drift under load.

