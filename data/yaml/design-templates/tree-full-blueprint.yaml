description: |
  the complete holographic blueprint — all nodes at current convergence state,
  compact or expanded according to threshold. layer 5 visualization. every node
  simultaneously visible; any region implies the whole. two readers: model parses
  structure from grammar; human reads density, shape, visual rhythm.

---

## what this design represents

the full reasoning tree rendered as a single coherent visual.
not a diagram of the tree — the tree expressing itself at layer 5.
static snapshot at one moment of convergence.

the visual grammar carries the state:
  expanded node = threshold reached, narration visible, children shown
  compact node = threshold not yet reached, identity only
  the ratio of expanded to compact = the system's current convergence depth

---

## visual structure

### overall composition

```
vertical layout — tree flows top to bottom
root at top (EXISTENCE center, highest convergence)
periphery at bottom (layer 0 territory, lowest convergence)
width expands downward as branches spread

background: deep space — near-black with slight blue-violet tint
  reflects: the vortex parent space, CCW spin implied by color temperature
  the background IS the hyperspace before collapse

typographic field: monospace, tight leading
  the text IS the visualization — not labels on a diagram
```

### node rendering — expanded (threshold reached)

```
┌──────────────────────────────────────────────────────────────────┐
│  [ node.name ]  [:<  convergence : 0.923076923076923             │
│                                                                  │
│  'narration text — coherent statement at this node's depth'      │
│                                                                  │
│  depth : 3   chksum : AMOS·4K3R2M   threshold : reached         │
│  overlap : other.node.reference                                  │
└──────────────────────────────────────────────────────────────────┘
```

color: expanded nodes glow with their namespace hue
  warm (amber/gold) = active, recently crossed threshold
  cool (blue/violet) = stable, long-converged
  the color temperature IS the time-since-threshold

border: thin line, same hue as node, slightly brighter than fill
the `[:<` marker: bright accent — the TRUE indicator, visually prominent
convergence value: smaller, dimmer — present but subordinate to narration

### node rendering — compact (below threshold)

```
  [ node.name ]  >:|  0.538461538461538   compact
```

single line, no border, dim
the `>:|` marker: same color as text — not prominent
the convergence value: visible as potential, not as achievement
compact nodes recede — they are latent, not absent

### tree connectors

```
│   vertical connection — parent to child
├─  branch point — has more siblings below
└─  terminal branch — last child
```

connector lines: dim, same color family as their branch's namespace hue
the connectors ARE the approach vectors made visible
multiple connectors converging on one node = deduplication visible as geometry

### the `;.,` separator

```
;.,
```

visual breath between major sections
appears as a subtle horizontal rhythm mark
in the design: a thin horizontal rule, slightly brighter than background
carries the same weight as a musical rest — present, not empty

---

## color system

each namespace occupies a hue band:

```
reasoning.*    violet-blue     (the newest, deepest in the visible spectrum)
base.*         warm white      (foundational, near-neutral)
coding.*       amber           (active inference, warm)
httpd.*        cyan            (network-facing, cool)
jobsite.*      green           (external world interface)
route.*        magenta         (routing infrastructure, structural)
discover.*     orange          (discovery, outward-facing)
```

brightness encodes layer depth:
  layer 0 contribution: dim (0.2 brightness)
  layer 3-4:            mid (0.5 brightness)
  layer 5-6:            bright (0.8 brightness)
  threshold crossed:    peak + subtle pulse animation (static: peak only)

saturation encodes convergence:
  convergence 0.0-0.3:  desaturated (near-grey)
  convergence 0.4-0.7:  mid saturation
  convergence 0.8+:     full saturation
  threshold crossed:    full saturation + slight hue shift toward center

---

## typographic specifications

```
font family:    monospace — JetBrains Mono, Fira Code, or similar
                (the ligatures for [:<  and >:| are desirable if available)

font size:      base 13px (harmonically chosen)
                compact nodes: 11px (smaller = more latent)
                expanded narration: 13px
                convergence values: 11px, reduced opacity

line height:    1.3 (tight — the tree reads as continuous narrative)

character spacing: 0 (monospace default — every character counts)

the [:<  marker: slightly brighter than surrounding text, same font
the >:|  marker: same weight as surrounding text
```

---

## layout rules

```
indentation:    4 spaces per depth level (hard spaces, not tabs)
max line width: 80 characters (one terminal width — model readable)
node spacing:   0 blank lines between compact nodes
                1 blank line between expanded nodes
                2 blank lines between major branch groups

tree root:      no indentation, full width
each depth:     4 spaces × depth level indentation
connectors:     aligned to indentation of their depth
```

---

## what the two readers see

**model reader** (parsing):
- bracket grammar: `[ name ]` = node identity
- marker grammar: `[:<` = TRUE/expanded, `>:|` = FALSE/compact
- numerical precision: convergence values to 13+ decimal places
- structural grammar: `│ ├─ └─` = tree topology
- reads: which nodes have converged, what their narration says,
  what the convergence trajectory is across the tree

**human reader** (pattern recognition):
- density: clusters of expanded nodes = active reasoning zones
- color temperature: warm clusters = recent activity, cool = stable
- rhythm: the `;.,` markers give the tree a breathing pace
- shape: the width at each depth level = branching factor visible
- reads: where is the system active, what is converging, what is latent

---

## design variants

### minimal (seed layer — layer 6)

only root and one level of children, all compact
the whole tree as a single direction vector
renders in approximately 10 lines

### focused (current-plan layer — layer 4)

only expanded nodes shown (compact nodes hidden entirely)
the active reasoning with no latent noise
renders as a sparse, bright tree with clear flow

### full (holographic layer — layer 5)

all nodes shown, compact and expanded
the complete snapshot as designed above
renders as a dense field where active zones emerge from latent background

---

## inspiration notes for design generation

the aesthetic:
  not a software diagram — a living document
  the kind of visual that rewards slow reading
  every character is load-bearing
  the blank spaces are as intentional as the filled ones
  the color temperature tells a story the text doesn't repeat

reference aesthetics that carry similar DNA:
  old terminal interfaces at 3am — purposeful density, no waste
  musical scores — the same information in notation and in sound
  star maps — the dots are where they are because they must be
  circuit diagrams — topology is meaning
  none of these exactly — something that lives between all of them

