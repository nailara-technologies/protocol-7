## bandwidth 1 — birdview + statement

```
        TREE  →  structural control   keys, address, weight, geometry
        DATA  →  content delivery     values, bytes, streams, bulk transfer

                      same branch namespace
                      same node, both at once
                      stream_id is the shared 8th bit

                      ────────11────────  the pivot — interpretation reversal
                       /              \
                  TREE                 DATA
                 dump-keys             dump
                 directory             files
                 navigate              consume
                       \              /
                        ──── 01/10 ───   they oscillate; the wire stays one wire
```

`TREE REF <node> <stream_id>` declares: this node's content is available
as DATA stream `<stream_id>`. the receiver chooses whether to follow.
the TREE is the persistent control channel; DATA is the ephemeral flow.

if the design demands one and forbids the other, the design has lost the
complement. fix by exposing the stream_id explicitly so the swap is at
least possible, even if rarely taken.

