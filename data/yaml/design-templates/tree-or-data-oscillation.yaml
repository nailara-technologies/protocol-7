## bandwidth 2 — vocabulary + lenses

**protocol vocabulary**:

- `TREE`           — structural reply mode. node lines: id, parent, B32_meta
                     (name, ref_count, face 0–7, child_count, groups). open
                     → node lines → REF lines → AMOS close
- `DATA`           — content reply mode. base32 chunk lines, 47 bytes per
                     line. open with `STREAM` (unknown size), `<B32_SIZE>`
                     (known), or `DELTA <B32_BASE_CHECKSUM>` (incremental)
- `stream_id`      — the shared identifier. derived from `AMOS_chksum(
                     node_id :: face_id :: ntime )`. TREE and DATA both
                     speak it; receiver disambiguates direction
- `TREE REF`       — the registration. declares stream availability without
                     opening it. namespace of all DATA = set of all REFs
- `face 0` / `11`  — the network/parent-facing face. on the wire, `11` is
                     the direction-reversal pivot — also the interpretation
                     swap moment (TREE↔DATA)
- `01` / `10`      — direction markers in the checksum tree.
                     `01` inward/source, `10` outward/leaf
- `1[zeros]1`      — bit-length separator frame. carries the topology of
                     the route as bit-length annotations
- `oscillation frequency`
                   — rate of TREE/DATA alternation on a shared stream.
                     bounded above by the 13-slot routing clock
- `dump-keys / dump` analogy
                   — TREE is `devmod.cmd.dump-keys`; DATA is `devmod.cmd.dump`
- `DELTA mode`     — receiver declares state checksum; sender transmits
                     only what changed. the checksum IS the sync point

**design lenses** — apply to any "what does this carry" question:

lens 1 — structure or content (or both):
  is this design primarily TREE (discovery, navigation, address, weight,
  geometry) or DATA (bytes, streams, bulk transfer)? does it have both?
  if both: do they share a stream_id, or are they accidentally separated
  into independent identifiers (design debt — they will drift)?

lens 2 — name the stream_id:
  what is the single identifier on which TREE and DATA agree for any
  given resource? if you cannot name it, you do not yet have a swap;
  you have two parallel protocols that will eventually disagree.

lens 3 — locate the `11` pivot:
  where on this wire does interpretation reverse — TREE-becomes-DATA or
  DATA-becomes-TREE? if there is no such moment, the design either
  doesn't need both (fine, but check lens 1 again) or is preventing the
  swap (design debt — explain why).

lens 4 — oscillation frequency:
  high (rapid alternation, approaching the 13-slot clock limit — discovery
  and consumption interleaved per cycle) or low (sustained one mode with
  occasional pivots — exploration sessions, bulk transfer sessions)?
  what determines the rate — focal length, observer intent, network
  conditions? is it tunable?

lens 5 — TREE-as-DATA, DATA-as-TREE:
  can a transmitted TREE session BE the DATA payload of another stream
  (treating structure as bytes)? can an arriving DATA stream BE treated
  as navigable TREE (treating content as structure)? if both: you have
  full oscillation. if only one direction: you have a half-swap — note
  this is a constraint, not a feature.

