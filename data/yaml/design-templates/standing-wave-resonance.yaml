## inspiration notes for design generation

the physical references:
  standing waves on a guitar string — the physics is identical
  interference patterns in a ripple tank — two wave sources overlapping
  the Chladni figures — sand on a vibrating plate showing nodal lines
  bioluminescent waves — natural light at the wave interface
  none exactly — the waves carry harmonic information, not just physics

the key visual test:
  someone sees the image and feels the system is breathing
  the omega gate looks like a destination that sends everything back
  the two waves look like they belong together — woven, not fighting
  the standing wave at center looks like the most alive region of the image
  if all four: the design works

