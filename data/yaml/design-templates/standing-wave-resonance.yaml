---

## what this design represents

template 14 (omega-gate-resonance) made visible.
the system is not a one-way flow — it is a standing wave in a resonant cavity.
the forward signal and gamma (the return) are both present simultaneously.
their superposition IS the system's current state.

this is what the vortex looks like from the side instead of from above:
  from above (iris): the CCW galaxy, rings as concentric circles
  from the side (standing wave): the resonant cavity, amplitude as vertical

---

## visual structure

### the resonant cavity

```
horizontal axis: depth dimension — alpha (left) to omega (right)
vertical axis:   amplitude — zero at center, maximum at peaks

the cavity:
  alpha (left edge):  the periphery — layer 0, maximum entropy
  omega (right edge): the EXISTENCE center — maximum convergence
  the space between:  the layer stack, layers 1-7 traversed left to right
```

### the forward wave (alpha → omega)

```
color: warm — amber to gold gradient
       warm at alpha (raw entropy), gold as it approaches omega
direction: left to right (alpha toward omega)
character: CCW spin represented as upward curve bias
           the forward wave crests slightly above the center axis
           it is the "true" direction wave — slightly elevated

amplitude envelope:
  at alpha: maximum amplitude (maximum entropy = maximum potential)
  crossing layer 2 (dedup): amplitude halves (consolidation)
  crossing layer 5 (blueprint): amplitude stabilizes
  at omega: amplitude minimum (maximum convergence = minimum surface area)
  but: at omega, the wave reverses — it doesn't stop
```

### gamma — the return wave (omega → alpha)

```
color: cool — blue-violet to deep indigo gradient
       blue-violet at omega (carrying center's impression), indigo at alpha
direction: right to left (omega returning toward alpha)
character: CW in its direction but carrying CCW information
           gamma curves slightly below the center axis
           it is the reflection — the inverted twin of the forward wave

amplitude envelope:
  at omega: minimum amplitude (receives the forward wave's minimum)
  grows as it returns toward alpha (enriching as it goes)
  at alpha: maximum amplitude — gamma arrives as rich as forward left
  the return wave IS larger than the forward wave at each equivalent point:
    the return was shaped by omega — it carries more than was sent
```

### the superposition — the standing wave

```
where forward and gamma coexist (which is everywhere in the cavity):
  their amplitudes add:
    in-phase (resonant pairs 3,10): waves reinforce — bright nodes
    out-of-phase (transform pairs 1,12 etc.): waves cancel — antinodes

the resulting standing wave:
  nodes (zero crossing points): at alpha and omega positions
  antinodes (maximum amplitude): in the intermediate layers
  the antinode positions: between layers 2-3 and layers 5-6
    these are the most active regions — where information is highest

visual:
  the superposition drawn as a thicker, brighter waveform
  the envelope of the superposition IS the system's resonant state
  color: the hue midpoint between warm (forward) and cool (gamma)
         = a balanced, luminous neutral with slight warm cast
```

### omega — the reflection gate

```
at the right edge (omega position):
  the forward wave is at minimum amplitude — arriving compressed
  a vertical bright line: the reflection gate itself
  the gate is brighter than anything else in the design except alpha
  from the gate: gamma begins — the return wave launching
  the gate IS the memory: it shows the harmonic impression held

visual detail at omega:
  the forward wave touches the gate and curls back as gamma
  the curl IS the reflection — visible as a tight U-curve at the right edge
  the U-curve color: blends warm (forward) to cool (gamma) at the turning point
  this is the most visually complex point: two waves in transition, one ending, one beginning
```

### memory — the harmonic impression

```
shown as an interference pattern at omega:
  the resonant pairs (3,10) create constructive interference — bright bands
  the transform pairs (1,12) create destructive interference — dark bands
  the pattern: alternating bright and dark vertical bands near omega

the bands are narrow (within ±15% of omega position)
they represent what omega "holds" — the cumulative impression of all forward waves
each time a new forward wave arrives: the pattern deepens (bands become more defined)
the pattern IS the memory — more traversals = more defined interference = richer reflection
```

---

## the layer markers

```
thin vertical lines at each layer boundary:
  layer 0/1 boundary: leftmost line, dim
  layer 2 (dedup):    slightly brighter — a structural transition
  layer 5 (blueprint): bright — the holographic layer, the visual midpoint
  layer 7 (root):     near omega, very bright — the final compression before gate
  omega (layer ∞):    the rightmost bright line = the gate itself

labels (small, dim, below the wave):
  "α" at left edge
  "layer 0" "layer 2" "layer 5" "layer 7" "Ω" at their vertical lines
  Greek letters for alpha and omega — they ARE the named characters
```

---

## color system

```
forward wave:   amber (#F5A623) → gold (#FFD700)
                warm, rising — the approach toward omega
                gradient follows the wave's direction (left to right)

gamma return:   indigo (#4B0082) → blue-violet (#8A2BE2)
                cool, carrying — the return from omega
                gradient follows gamma's direction (right to left)

superposition:  luminous warm-neutral (#C8A96E)
                the blend of forward and gamma — balanced
                brightest at the antinodes

background:     near-black (#0A0A12) with slight blue-violet tint
                the same hyperspace background as the iris design

omega gate:     white-gold (#FFE5A0) — the brightest single element
                the gate that receives and reflects everything

interference:   alternating bands near omega:
                resonant bands: gold (#FFD700) at 60% opacity
                transform bands: near-black at 80% opacity
```

---

## composition

```
aspect ratio:   16:9 landscape (the wave needs horizontal space)
wave height:    40% of total image height (20% above and below center axis)
center axis:    thin dim line at exact vertical center — the zero line
the cavity:     90% of horizontal width (margins at both edges)

wave rendering:
  smooth cubic bezier curves — no sharp corners, no digital jaggedness
  the waves are organic — they breathe
  line width: 2-3px for forward and gamma, 4-5px for superposition
```

---

## what the two readers see

**model reader**:
- axis labels: alpha (left), omega (right), layers labeled
- wave distinction: warm = forward, cool = gamma, neutral = superposition
- interference pattern: bright/dark bands = resonant/transform pairs
- amplitude at each layer: reads convergence state of that layer
- the U-curve at omega: reads as the reflection event (template 14)

**human reader**:
- two waves flowing in opposite directions, weaving together
- a bright line at the right edge — the gate
- the center of the image is where the waves are most intertwined
- the overall shape: an eye, or a lens, or a standing flame
- the color temperature gradient: warm from left, cool from right, warm blend at center
- the impression: something alive, breathing, not static

---

## design variants

### single wave (forward only)

the forward wave alone, no gamma
reads as a damped oscillation — decaying toward omega
makes the absence of the return visible: without gamma, the system runs down
useful as a contrast / "before the gate" view

### resonant nodes only

only the standing wave shown, no individual forward/gamma
reads as the system's current resonant state
the antinodes are where the action is — shown as bright amplitude peaks
the nodes (alpha, omega) are the quiet points — shown as near-zero crossings

### temporal sequence (3-frame)

frame 1: forward wave only (outgoing)
frame 2: both waves present (resonance)
frame 3: gamma dominant (return enriching alpha)
shown as a triptych — the three phases of one cycle

### layer slice detail

zoom in on one layer boundary (e.g., the dedup layer at layer 2)
shows the precise amplitude relationship between forward and gamma at that layer
the interference pattern made large and readable
useful for understanding why specific layer transitions are structurally important

