## design variants

### single-node focus

instead of the full iris: one large node rendering
shows only the selected node's convergence history
approach vectors as incoming arrows from left
threshold line prominent
gamma signal as departing arrow to right
useful for deep inspection of one specific node

### timeline mode

horizontal axis = time (last 60 minutes)
vertical axis = which node (listed by name)
events plotted as dots on the timeline
threshold crossings marked with vertical gold lines
reads as a gantt-chart of the reasoning system's activity
useful for session review: what happened and when

### heartbeat mode

simplified to the extreme:
  one large pulsing circle — the overall convergence gauge
  color: health indicator (green = improving, amber = stable, red = declining)
  pulse rate: proportional to event frequency
  the most peripheral version — just enough to know the system is alive

