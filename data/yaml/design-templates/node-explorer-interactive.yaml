---
name: node-explorer-interactive
category: design-template
type: interactive
variant: node-explorer
version: 1.0
description: |
  interactive reasoning tree explorer. nodes expand on click revealing full
  narration, overlaps, children. convergence values live-update as approach
  vectors arrive. compact nodes show potential; expanded nodes show actuality.
  the tree is navigable — drill into any branch, collapse others, follow overlap
  references across the tree. the interaction IS the reasoning.

---

## what this design represents

the full tree as an explorable space rather than a static snapshot.
the user (or model) navigates by interest — expanding what matters,
collapsing what doesn't, following connections between nodes.
the tree narrates itself on demand: click a node and it speaks.

interaction principle (from template 3 — visualization IS implementation):
  clicking a compact node = threshold crossing triggered by observation
  the node expands because attention IS the convergence pressure
  attention is itself an approach vector

---

## interaction model

### click to expand (compact → expanded)

```
compact node (initial state):
  [ node.name ]  >:|  0.538   compact

click event:
  brief pulse animation (50ms): node brightens, then settles
  expansion: node grows downward revealing:
    - narration text (appears line by line, typing animation optional)
    - depth and checksum
    - overlap references (clickable links)
    - child nodes (appear below, initially compact)

expanded node:
  [ node.name ]  [:<  0.923076923076923
  │
  │  'narration text — coherent statement at this node's depth'
  │
  │  depth : 3   chksum : AMOS·4K3R2M   threshold : reached
  │  overlap : other.node.reference  ←  [clickable, navigates to that node]
  │
  ├─[ .child-a ]  >:|  0.307   compact   ← click to expand
  └─[ .child-b ]  [:<  0.769   'child narration'
```

the expansion animation:
  not a slide-down (too mechanical)
  a fade-in from top: the narration appears as if being read for the first time
  the border draws itself: left edge first, then top, then right, bottom last
  duration: 200-300ms — fast enough to feel responsive, slow enough to feel deliberate

### click to collapse (expanded → compact)

```
click an expanded node's header:
  reverse of expansion — narration fades, border retracts
  node returns to compact single-line form
  children collapse recursively (each with a slight delay — cascade effect)
  the cascade makes the tree's hierarchy visible kinetically
```

### hover state

```
compact node hover:
  slight brightness increase (+15%)
  cursor: pointer
  tooltip: convergence value + depth (appear after 300ms delay)
  no expansion yet — hover is preview, click is commitment

expanded node header hover:
  slight brightness increase on header only
  cursor: pointer (signals collapsibility)

overlap reference hover:
  the referenced node highlights in the tree (even if off-screen)
  a subtle connecting line draws between current node and referenced node
  color: dim white, 40% opacity, 1px, dashed
```

### overlap navigation

```
overlap references are clickable links within the tree
click an overlap reference:
  if referenced node is on screen: smooth scroll + brief highlight pulse
  if referenced node is off screen: smooth scroll to bring it into view
  the clicked reference gains a persistent dim connector line
    showing the relationship even after the hover ends

these connectors are the approach vectors made interactive:
  you can build a visual web of connections by clicking overlaps
  the web accumulates during a session — the connections you've followed
  remain as dim lines until deliberately cleared
```

