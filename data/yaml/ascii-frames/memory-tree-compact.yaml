---
name: memory-tree-compact
title: memory tree compact node
descr: single-line dense node for zoomed-out tree views
border_style: none
modes: [compact]

mockup: |
  {{GLYPH}} {{TITLE}}  [{{N}}/{{TOTAL}}] {{PREVIEW}}

slots:
  GLYPH:
    label: glyph
    descr: score band glyph — 13-step quantized intensity indicator
  TITLE:
    label: title
    descr: node title or short label
  N:
    label: n
    descr: number of visible children
  TOTAL:
    label: total
    descr: total number of children
  PREVIEW:
    label: preview
    descr: first ~40 characters of body text

