---
name: memory-tree-node
title: memory tree node
descr: expanded card for a single branch or leaf node
border_style: single
modes: [expanded]

mockup: |
  .:[ {{N}}/{{TOTAL}}         ]::[ {{TITLE}} ]:.
  :  score: {{SCORE_BAR}}                      :
  :  curve: {{CURVE}}                          :
  :  {{CHILDREN...}}                           :
  :............................................:

slots:
  TITLE:
    label: title
    descr: node title for the top label bar
  SCORE_BAR:
    label: score bar
    descr: visual score indicator rendered as glyph band
  N:
    label: n
    descr: visible child count
  TOTAL:
    label: total
    descr: total child count
  CURVE:
    label: curve
    descr: falloff curve type for this node's children
  CHILDREN:
    type: block
    label: children
    descr: composed child frame block

