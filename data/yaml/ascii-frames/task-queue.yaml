---
name: task-queue
title: tasks
descr: active task queue — each line carries an inline status marker; frame grows with task count
border_style: single
modes: [expanded]

mockup: |
  .:[ {{COUNT}}                   ]::[ tasks ]:.
  :  {{TASKS...}}                              :
  :............................................:

slots:
  COUNT:
    label: count
    descr: active task count
  TASKS:
    type: block
    label: tasks
    descr: |
      block slot — one task per line, each with inline status marker.
      line format:  [ active ]  task description
                    [ pending ] task description
                    [ done ]    task description

