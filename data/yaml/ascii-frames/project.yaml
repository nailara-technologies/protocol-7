---
name: project
title: project
descr: project state fact with motivation and recency — [ age ] proximity signals how load-bearing the memory still is
border_style: single
modes: [expanded]

mockup: |
  .:[ {{FACT}}                  ]::[ project ]:.
  :  {{FACT}}                                  :
  :  ==[ why & apply ]=======================  :
  :  why:    {{WHY}}                           :
  :  apply:  {{APPLY}}                         :
  :  [ {{AGE}} ]                               :
  :............................................:

slots:
  FACT:
    label: fact
    descr: the project state fact or decision — the ground truth
  WHY:
    label: why
    descr: motivation behind the fact — constraint, deadline, or stakeholder requirement
  APPLY:
    label: apply
    descr: how this fact should shape suggestions and decisions
  AGE:
    label: age
    descr: recency indicator — how long ago this was recorded; e.g. '3 days' or '2026-05-28'

