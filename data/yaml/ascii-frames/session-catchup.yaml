---
name: session-catchup
title: last session
descr: recent session summary — open-height block slot; depth determines how much history is loaded
border_style: single
modes: [expanded]

mockup: |
  .:[ {{AGE}}              ]::[ last session ]:.
  :  {{SUMMARY...}}                            :
  :............................................:

slots:
  AGE:
    label: age
    descr: session recency — e.g. '2h ago' or 'yesterday'
  SUMMARY:
    type: block
    label: summary
    descr: free-form session summary text; may span many lines; subject to context budget truncation with sentinel injection

