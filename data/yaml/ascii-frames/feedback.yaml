---
name: feedback
title: feedback
descr: behavioral rule with justification — the = separator marks the boundary between rule and context
border_style: single
modes: [expanded]

mockup: |
  ..[..........................]..[ feedback ]:.
  :  {{RULE}}                                  :
  :  ==[ why & apply ]=======================  :
  :  why:    {{WHY}}                           :
  :  apply:  {{APPLY}}                         :
  ::::::::::::::::::::::::::::::::::::::::::::::

slots:
  RULE:
    label: rule
    descr: the behavioral rule itself — most important, read first
  WHY:
    label: why
    descr: the reason or past incident that motivates the rule
  APPLY:
    label: apply
    descr: when and where this rule applies — edge case guidance

