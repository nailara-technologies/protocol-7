---
name: key-holder-status
title: key-holder
descr: key-holder child process status panel
border_style: single
modes: [expanded]

mockup: |
  .:[ key-holder ]::::::::::::::::::::::::::[ {{HOLDER_STATE}} ]:.
  :  pid:          {{HOLDER_PID}}                             :
  :  locked:       {{HOLDER_LOCKED}}                          :
  :  last op:      {{HOLDER_LAST_OP}}                         :
  :..................................................:

slots:
  HOLDER_STATE:
    type: inline
    label: holder state
    descr: running or not started
  HOLDER_PID:
    label: pid
    descr: child process id
  HOLDER_LOCKED:
    label: locked
    descr: key memory lock status
  HOLDER_LAST_OP:
    label: last op
    descr: last operation with age, e.g. "decrypt    (2s ago)"

