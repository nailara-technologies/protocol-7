---
name: registry-detail
title: slot detail
descr: single-slot metadata card with all registry fields
border_style: single
modes: [expanded]

mockup: |
  .:[ {{SLOT_NAME}} ]::::::::::::::::::::::[ {{SENSITIVITY}} ]:.
  :  owner:        {{OWNER}}                                  :
  :  type:         {{TYPE}}                                   :
  :  storage:      {{STORAGE_TIER}}                           :
  :  registered:   {{REGISTERED_NTIME}}                       :
  :  rotated:      {{LAST_ROTATED}}                           :
  :  rotate every: {{ROTATE_INTERVAL}}                        :
  :  subscribers:  {{SUBSCRIBERS}}                            :
  :............................................................:

slots:
  SLOT_NAME:
    type: inline
    label: slot name
    descr: slot identifier in top border left bracket
  SENSITIVITY:
    type: inline
    label: sensitivity
    descr: sensitivity level in top border right bracket
  OWNER:
    label: owner
    descr: owning zenka or module
  TYPE:
    label: type
    descr: credential type
  STORAGE_TIER:
    label: storage tier
    descr: local, remote, etc.
  REGISTERED_NTIME:
    label: registered
    descr: ntime when slot was first registered
  LAST_ROTATED:
    label: last rotated
    descr: ntime of last rotation or 'never'
  ROTATE_INTERVAL:
    label: rotate interval
    descr: rotation policy interval or 'manual'
  SUBSCRIBERS:
    label: subscribers
    descr: comma-joined zenka names subscribed to rotation strms

