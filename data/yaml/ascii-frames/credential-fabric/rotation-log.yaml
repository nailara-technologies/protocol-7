---
name: rotation-log
title: rotation log
descr: recent credential rotation events
border_style: single
modes: [expanded]

mockup: |
  .:[ rotation log ]:::::::::::::::::::::::[ last {{LOG_COUNT}} ]:.
  :  {{ROTATIONS_BLOCK...}}                                   :
  :..............................................................:

slots:
  LOG_COUNT:
    type: inline
    label: log count
    descr: number of displayed rotation entries
  ROTATIONS_BLOCK:
    type: block
    label: rotations
    descr: |
      one line per rotation event.
      format: <ntime_b32>  <slot>  by:<actor>  result:<ok|fail>

