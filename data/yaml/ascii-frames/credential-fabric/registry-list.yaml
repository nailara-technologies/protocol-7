---
name: registry-list
title: slots
descr: full slot registry list with column-aligned rows
border_style: single
modes: [expanded]

mockup: |
  .:[ slots ]::::::::::::::::::::::::::::::::::[ {{SLOT_COUNT}} ]:.
  :  {{SLOTS_BLOCK...}}                                       :
  :..............................................................:

slots:
  SLOT_COUNT:
    type: inline
    label: slot count
    descr: number of registered slots displayed in top border
  SLOTS_BLOCK:
    type: block
    label: slots
    descr: |
      one line per slot. column-aligned format:
      slot-name           owner       type         sens

