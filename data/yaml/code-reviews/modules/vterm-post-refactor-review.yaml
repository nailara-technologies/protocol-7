    - vterm.shm: fallback_local default is TRUE, attach/read/write/detach all functional
    - vterm.consensus.check_channel: clean 3-line threshold check
    - vterm.consensus.declaration_value: clean set→255, clear→0, superposition→128
    - vterm.consensus.cell_fingerprint: pack('c4') sub-bit fingerprint is sound
    - vterm.compositor.blend.consensus: logic correct (once BUG-3 is fixed in shm)
    - vterm.compositor.blend.normal: correct reverse-layer last-wins pattern
    - vterm.compositor.blend.additive: correct clamped additive blend
    - vterm.util.clamp: correct 3-line clamp
    - vterm.subbit.check_threshold: threshold/state update logic is correct
    - vterm.compositor: dispatches all three blend modes and three layouts correctly
    - vterm.consensus.compute: overall structure matches spec design

  ## ── RECOMMENDED FIX ORDER ────────────────────────────────────────────────

  fix_priority:
    1: BUG-3  ## cell.size_bytes must be correct before any shm I/O works
    2: BUG-4  ## instance hashref access (init path)
    3: BUG-2  ## vote channel extraction (all writes are wrong until fixed)
    4: BUG-1  ## check_layer_agreement crashes at runtime
    5: DESIGN-1  ## 0-state routing mathematical correctness
    6: DESIGN-2  ## ghost layer identity (needed before forensic layouts)

