## KNOWN ISSUES & RECOMMENDATIONS ##

### HIGH PRIORITY ###
1. **note_write, note_read, note_list handlers crashing**
   - All three handlers call undefined subroutine references
   - Need to check if note.write, note.read, note.list are properly registered
   - May need to check %code hash for these entries

2. **validate_module parameter format**
   - Both calls returned "module parameter required"
   - May need to pass `tool_call` object with `function.arguments` structure
   - Or check if module parameter needs different format

3. **ptd_format non-writable file warnings**
   - Files reported as non-writable during formatting
   - May need to check file permissions or use staging directory

### MEDIUM PRIORITY ###
4. **list_files pattern matching with "." root**
   - Patterns like `test\.tool` or `src/` return no files when root is `.`
   - Works with full paths like `/data/projects/protocol-7/src`
   - May need to handle "." root specially

5. **extract_file "functions" mode**
   - Returns entire file content instead of specific function definitions
   - May need better implementation to extract actual function bodies

6. **ncode_search regex escaping**
   - Query "note\.write" returned "invalid characters" error
   - Query "note_write" worked fine
   - May need different regex escaping for ncode_search

### LOW PRIORITY ###
7. **list_modules with "." namespace**
   - Returns `..` instead of empty list or current modules
   - May need special handling for "." namespace

8. **module_deps for simple modules**
   - test.tool3 returned empty dependencies (expected, but verify)
   - coding.system_prompt returned correct dependencies
   - Works as designed

