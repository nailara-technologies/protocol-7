# NAMING CONVENTIONS

convention: "module.namespace.domain.operation"
examples:
  - "coding.task.analyze_complexity"
    part_0: "coding" (zenka-specific)
    part_1: "task" (domain)
    part_2: "analyze_complexity" (operation)

  - "coding.helper.task_priority"
    part_0: "coding"
    part_1: "helper" (utility functions)
    part_2: "task_priority" (what it calculates)

  - "coding.learning.record_outcome"
    part_0: "coding"
    part_1: "learning" (domain)
    part_2: "record_outcome" (operation)

benefits:
  - Immediate understanding of module purpose from name
  - Logical file organization matching architecture
  - Easy to locate related modules
  - Clear responsibility boundaries

