# ARCHITECTURAL PATTERNS

## Pattern 1: Wrapper Architecture (jobqueue integration)

description: |
  Thin wrapper modules that delegate to lower-level services while adding domain-specific logic.
  This pattern leverages existing generic infrastructure (jobqueue) without code duplication.

implementation:
  - location: "src/coding.task.*"
  - base_service: "jobqueue.* (generic job queue management)"
  - added_logic: "Priority calculation, type mapping, status translation"
  - benefits:
      - Infrastructure reuse without duplication
      - Clear separation between generic and domain-specific logic
      - Easier to maintain and test
      - Shared error handling from base service

example_modules:
  - name: "coding.task.enqueue"
    wraps: "jobqueue.add_job()"
    adds: "Priority calculation from task type"
    result: "Elegant priority-aware task queuing"

  - name: "coding.task.status"
    wraps: "jobqueue.get_job_data()"
    adds: "Status translation to human-readable format"
    result: "Clean API hiding jobqueue implementation details"

  - name: "coding.task.dequeue"
    wraps: "jobqueue.get_next_job('queued')"
    adds: "Consistent queue name management"
    result: "Prevents queue name typos and improves consistency"

## Pattern 2: One-Module-One-Function Principle

description: |
  Extract inline subroutines into dedicated modules rather than grouping multiple functions.
  Each module has a single, focused responsibility with clear inputs and outputs.

rationale:
  - Discoverability: Module name clearly indicates function purpose
  - Reusability: Functions can be imported independently by other modules
  - Testability: Single responsibility simplifies unit testing
  - Maintainability: Changes are localized to specific modules
  - Navigation: `<[module.name]>->()` syntax makes call chain obvious

implementation_examples:
  task_analysis:
    - "coding.task.analyze_complexity"
    - "coding.task.classify_type"
    - "coding.task.estimate_tokens"
    - "coding.task.check_history"
    - "coding.task.analyze_full (orchestrator)"

  learning:
    - "coding.learning.record_outcome"
    - "coding.learning.update_success_rate"
    - "coding.learning.get_statistics"
    - "coding.learning.identify_patterns"
    - "coding.learning.analyze_model_specialization"

  routing:
    - "coding.routing.check_cache_first"
    - "coding.routing.can_use_local_rules"
    - "coding.routing.determine_service"
    - "coding.routing.determine_fallback"
    - "coding.routing.make_routing_decision (orchestrator)"

## Pattern 3: Dynamic Calculations vs Static Values

description: |
  Avoid hardcoding configuration values. Instead, create helper modules that calculate
  values dynamically based on logic, making the system adaptable without code changes.

examples:
  task_priority_calculation:
    module: "coding.helper.task_priority"
    maps: "task type → priority score"
    dynamic_adjustments:
      - urgent_flag: "-2 priority penalty for urgency"
      - size_flag: "+1 priority boost for large tasks"
    benefit: "Priority logic can evolve without touching enqueueing code"

  complexity_scoring:
    module: "coding.task.analyze_complexity"
    calculates: "1-10 complexity score based on multiple factors"
    factors:
      - word_count: ">100 words = +2, >50 = +1"
      - keywords: "Complex keywords = +2 each, medium = +1 each"
      - task_type: "code/generation = +3, consensus = +4, transcription = -2"
      - constraints: "each constraint = +1"
    capped: "between 1-10"
    benefit: "Scoring logic centralized, easily adjusted per policy"

  token_estimation:
    module: "coding.task.estimate_tokens"
    base_estimates:
      code-generation: 300
      reasoning: 200
      brainstorming: 200
      analysis: 150
      transcription: 50
      image-generation: 50
    adjustments:
      - description_length: "1 token per 4 characters"
      - consensus_multiplier: "3x for voting models"
    benefit: "Token cost estimation decoupled from task processing"

## Pattern 4: Orchestrator Modules

description: |
  Create "orchestrator" modules that coordinate multiple analysis steps and return
  consolidated results. These modules provide high-level workflow management.

examples:
  - name: "coding.task.analyze_full"
    orchestrates:
      - "coding.task.analyze_complexity"
      - "coding.task.classify_type"
      - "coding.task.estimate_tokens"
      - "coding.task.check_history"
    consolidates: "All analyses into single result with updated task data"
    benefit: "Client code calls one module instead of managing workflow"

  - name: "coding.routing.make_routing_decision"
    orchestrates:
      - "coding.routing.check_cache_first"
      - "coding.routing.can_use_local_rules"
      - "coding.routing.determine_service"
      - "coding.routing.determine_fallback"
    consolidates: "All routing decisions into single routing recommendation"
    benefit: "Routing logic remains testable and modular, but coordinated"

  - name: "coding.learning.generate_recommendations"
    orchestrates:
      - "coding.learning.analyze_model_specialization"
      - "coding.learning.identify_patterns"
    consolidates: "Routing, caching, and specialization recommendations"
    benefit: "Recommendations generated from learned patterns"

