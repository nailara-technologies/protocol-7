## Routing Decision Modules (6 modules)

module: "coding.routing.check_cache_first"
purpose: "Cache lookup optimization"
checks: "Task description against cached results"
returns: "found flag, cached_result, cache_key"
use_case: "First step in routing decision"

---

module: "coding.routing.can_use_local_rules"
purpose: "Detects simple tasks that don't need LLM"
simple_tasks: "format, convert, validate, check, list, count"
non_llm_types: "transcription (use whisper service)"
returns: "can_use_local_rules flag, recommended_service"
use_case: "Skip LLM for operations that don't need it"

---

module: "coding.routing.determine_service"
purpose: "Main service selection based on task characteristics"
considers:
  - "Task type (transcription→whisper, image-generation→invoke-ai, etc.)"
  - "Complexity score (determines consensus vs single model)"
  - "Constraints (consensus voting requirement)"
service_selection:
  transcription: "whisper"
  image-generation: "invoke-ai"
  code-generation: "mathstral or consensus"
  reasoning: "qwen or consensus"
  analysis: "qwen or consensus"
  brainstorming: "diverse consensus"
returns: "primary service recommendation with token cost and reason"
use_case: "Determine ideal service for task execution"

---

module: "coding.routing.determine_fallback"
purpose: "Fallback service if primary fails"
fallback_logic:
  consensus: "fallback to single-llm"
  invoke-ai: "no fallback (specialized)"
  whisper: "no fallback (specialized)"
  default: "fallback to consensus-voting"
returns: "fallback service recommendation"
use_case: "Handle primary service unavailability"

---

module: "coding.routing.make_routing_decision"
purpose: "Orchestrates all routing rules in sequence"
orchestrates:
  - "1. check_cache_first"
  - "2. can_use_local_rules"
  - "3. determine_service (primary)"
  - "4. determine_fallback"
returns: "Complete routing decision with primary/fallback services"
use_case: "End-to-end routing decision workflow"

---

module: "coding.routing.get_routing_stats"
purpose: "Returns routing performance metrics"
returns: "routes_made, cache_hits, services_used, average_token_cost"
use_case: "Monitoring and optimization analysis"

