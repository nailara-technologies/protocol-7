# EXTRACTED MODULES (27 total)

## Task Management Wrappers (5 modules)

module: "coding.task.dequeue"
purpose: "Get next available task from 'queued' queue"
wraps: "jobqueue.get_next_job('queued')"
returns: "job_id, task_id, task_type, priority, status"
use_case: "Main task processing loop"

---

module: "coding.task.complete"
purpose: "Mark task as completed and move to 'completed' queue"
wraps: "jobqueue.move_job() and jobqueue.get_job_data()"
parameters: "job_id, optional result"
use_case: "After successful task execution"

---

module: "coding.task.fail"
purpose: "Mark task as failed with error message"
wraps: "jobqueue.move_job() to 'error' queue"
parameters: "job_id, error_msg"
use_case: "After task execution failure"

---

module: "coding.task.queue_stats"
purpose: "Get queue statistics across all states"
wraps: "Multiple jobqueue.count() calls"
returns: "counts for queued, running, completed, error, paused, depending, aborted"
use_case: "Health monitoring and capacity planning"

---

module: "coding.task.clear"
purpose: "Remove completed tasks from queue"
wraps: "jobqueue.remove_job()"
parameters: "job_id (specific) or bulk flag (all completed)"
use_case: "Queue maintenance and cleanup"

---

