# ANTI-PATTERNS ELIMINATED

## Anti-Pattern 1: Inline Anonymous Subroutines

problem: |
  Functions defined as anonymous variables within modules:
  ```perl
  my $analyze_complexity = sub { ... };
  my $classify_type = sub { ... };
  ```

issues:
  - Not callable through Protocol-7 module system
  - Lost discoverability (can't list available functions)
  - Reduced reusability across modules
  - Complicated call chain (need variable reference)
  - Testing requires module initialization

solution: "Extract to native modules, use <[module.name]->() syntax"
result: "27 modules eliminated ~170+ lines of duplicated/hidden code"

## Anti-Pattern 2: Monolithic Modules

problem: |
  Single module containing many loosely-related functions (e.g., coding.task.analyze
  contained 5 distinct analytical operations, coding.routing.decide_service contained 6
  routing decision points)

issues:
  - Hard to test individual operations
  - Difficult to reuse specific functionality
  - Module initialization cost for single function use
  - Dependencies tangled across operations

solution: "One-module-one-function principle"
result: "Each operation independently importable and testable"

## Anti-Pattern 3: Hardcoded Configuration Values

problem: |
  Task priority mappings, token estimates, and complexity weights hardcoded in analysis logic

issues:
  - Changing estimates requires code modification
  - Different zenka might need different estimates (not possible)
  - No audit trail of configuration changes
  - Scaling strategy locked into code

solution: "Dynamic calculation modules (helper.task_priority, estimate_tokens, etc.)"
result: "Configuration logic decoupled from processing logic"

