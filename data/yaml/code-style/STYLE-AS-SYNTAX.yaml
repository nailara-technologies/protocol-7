#
# name = STYLE-AS-SYNTAX
# descr = Protocol-7 style compliance as structural integrity indicator
#

# OVERVIEW
# Protocol-7 code style is not aesthetic—it is syntactic. Style violations
# correlate with logical errors and architectural problems. This document
# explains why style matters for code quality and LLM navigation.

style_principle: |
  In Protocol-7, style IS syntax. Deviations from established patterns
  signal lower code quality and hidden architectural issues. Once you notice
  code violating the style, you are statistically looking at code with
  logical errors. Style compliance is a guardrail that prevents silent
  failures and masks problems.

why_style_matters:
  code_quality_correlation:
    description: |
      Style violations correlate with logical errors. When code deviates
      from established patterns, it often indicates:
      - Incomplete understanding of requirements
      - Architectural misalignment
      - Edge cases not considered
      - Hidden assumptions not documented

    pattern: |
      Bad style → Lower quality code (not vice versa)
      This is measurable and statistically reliable.

  lowercase_narrative:
    description: |
      Comments begin lowercase. This is not pedantic—it creates a lowercase
      narrative flow that reads as continuous thought.

    why: |
      - Speed reading: lowercase flow eliminates visual disruption
      - Brain pattern matching: narrative consistency aids comprehension
      - LLM integration: consistent lowercase narrative generates code
        that integrates seamlessly with existing patterns

    example_good: "## read config from file"
    example_bad: "## Read config from file"

  bracket_conventions:
    description: |
      Use [word] for annotations. Never (word) in comments.
      This visual distinction separates code comments from syntax annotations.

    why: |
      - Clarity: brackets signal "this is a note about code structure"
      - Parsing: brackets don't conflict with Perl parentheses
      - Consistency: enables pattern recognition across large codebases

    example_good: "## check if reply handler is set [ for route correlation ]"
    example_bad: "## check if reply handler is set (for route correlation)"

  holographic_consistency:
    description: |
      Code reads as holographic—every line continues the same visual
      and logical narrative. Inconsistency breaks the continuity and
      signals architectural issues.

    impact: |
      - Readable: code flows naturally
      - Debuggable: deviations are immediately visible as errors
      - Maintainable: patterns are self-evident
      - LLM-friendly: consistent patterns enable confident code generation

for_lazy_on_demand_compilation:
  overview: |
    Protocol-7 will implement lazy/on-demand compilation where routine load
    priority is determined by:
    - Critical path requirements (compile immediately)
    - Common usage patterns (compile during idle callbacks)
    - Rare routines (compile on-demand when called)

  why_style_enables_this: |
    Automated dependency scanning and code-flow mapping requires:
    - Consistent module loading interfaces (`<[module.name]>->()`)
    - Parseable routine call patterns
    - Clear distinction between code and data
    - Reliable identification of dependencies

    Consistent style makes this analyzable. Inconsistent style requires
    code simulation to determine dependencies, which is:
    - Expensive (computational overhead)
    - Unreliable (edge cases missed)
    - Scales poorly as system grows

  formalized_dynamics: |
    Instead of avoiding dynamic code, formalize it through interfaces:
    - `*.cmd.*` for commands (formal interface)
    - `*.console.*` for console handlers (formal interface)
    - `*.init_code`, `*.pre_init`, `*.post_init` for lifecycle (formal interface)

    Formalization makes dynamics:
    - Analyzable (automated discovery of patterns)
    - Optimizable (improvements propagate to all instances)
    - Safe (clear interfaces prevent hidden coupling)
    - Maintainable (interface adherence vs. registry management)

for_llm_integration:
  problem_with_inconsistency: |
    When LLMs generate code without style consistency:
    - Generated code doesn't integrate with existing patterns
    - Reviewers catch style issues, which often hide logic issues
    - Hidden logic is masked by surface corrections
    - Technical debt accumulates silently
    - Future modifications become increasingly risky

  solution_approach: |
    Style-aware code generation prevents masked problems:
    1. Maintain consistent style during generation
    2. When style deviates, this flags logical issues (not just aesthetics)
    3. Reviewers can trust that style compliance = logical soundness
    4. Integration is seamless, no "polishing" needed
    5. Code quality remains high across iterations

  blind_spot_prevention: |
    Style violations create blind spots where:
    - Code looks functional (surface level)
    - But architectural assumptions are wrong (deep level)
    - Reviewer assumes style isn't important
    - Logic errors compound silently

    Strict style adherence prevents this by making deviations signal
    problems that demand investigation before proceeding.

  cost_aware_decisions: |
    Instead of forbidding dynamics, share cost awareness:
    - Models naturally reconsider expensive routes when simpler exists
    - Decisions made with full awareness of consequences
    - No arbitrary rules, but shared understanding of trade-offs
    - Architecture emerges from informed choices, not prohibition

for_distributed_systems_survival:
  externally_imported_complexity: |
    Distributed systems face existential risk from code duplication
    across multiple contexts. "Externally imported complexity" means:
    - Code copied to multiple locations (variants)
    - Each variant "works fine" (deceptive)
    - Each variant blocks optimal version from being used
    - Updates to original don't reach copies
    - Fixes to copies don't propagate

  the_catastrophic_pattern: |
    Externally imported complexity leads to cascading failure:
    1. Variant A breaks
    2. Triggers dependent break in Variant B (relied on A's behavior)
    3. Variant B failure cascades to Variant C
    4. No containment: variants scattered but deeply interdependent
    5. Corruption propagates through network faster than response
    6. System loses coherence and disintegrates

    This is not technical debt. This is existential risk.

  blocking_optimization: |
    Each copy of code actively blocks optimization:
    - Optimized version exists but hidden under N copies
    - Each copy "works" (no pressure to use optimized version)
    - System never better than worst implementation
    - Improvements can't propagate to all variants
    - Optimization attempts break some variant, causing revert
    - System locked at "works but suboptimal"

  early_extraction_is_survival: |
    Extract and formalize code BEFORE copies proliferate:
    - Early extraction cost: minimal (one version exists)
    - Late extraction cost: coordination across N variants
    - Extraction prevents cascade risk before it exists
    - Formal interfaces enable optimization waves
    - Improvements propagate instantly to all instances

    Non-destructive deduplication through formalization is not
    optimization—it is system survival mechanism.

  consuming_safety_layers: |
    Protocol-7's resilience depends on layered error handling,
    fallbacks, self-healing, and mathematical harmony detection.

    Debt accumulation erodes these layers:
    - Add debt in layer 1: layer 2 catches it
    - Add debt in layer 2: layer 3 catches it
    - Each layer's reliability is partially surrendered
    - Safety margin is finite
    - Eventually layers get perforated
    - System collapses from accumulated layer erosion, not one failure

    Do NOT consume safety layers for short-term speed.
    Respect the architecture that enables resilience.

  switchable_alternates_for_experimentation: |
    Experimental code must be switchable alternate approach:
    - NOT a modification to established code
    - Coexists with legacy without interfering
    - Default behavior unchanged (safe)
    - Can be tested in production without risk
    - If breaks: switch back instantly
    - If superior: becomes primary, legacy becomes fallback

    Once legacy is relieved of essential responsibility:
    - Safe to refactor boldly
    - Becomes next experimental ground
    - Code gets recycled into better form

    This creates self-optimizing, sustainable system where
    everything eventually improves through safe cycles.

for_project_maintainers:
  when_llm_deviates_from_style: |
    Do NOT accept style-inconsistent code that "works." Instead:
    1. Identify the style violation
    2. Investigate what logic issue it might be masking
    3. Ask: why did the LLM deviate here?
    4. Often uncovers hidden architectural problem
    5. Fix the root issue, not the symptom

  protocol_7_specific: |
    Protocol-7 has 24 years of carefully evolved style. This isn't
    random convention—it's been refined through experience to catch
    problems early. Style deviations are not modernization; they are
    regression to lower quality.

  about_technical_debt: |
    In Protocol-7, technical debt is not just code quality issue.
    It is:
    - Risk of cascading failures through distributed system
    - Erosion of safety layers that enable resilience
    - Blocking of optimization that prevents system improvement
    - Consumption of finite safety margin

    Debt in critical systems is existential risk, not cleanup work.

