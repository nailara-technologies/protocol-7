---
# protocol-7 code style conventions
# reference for code generation, review, and consistency enforcement

conventions:

  # comment style
  comments:
    description: "maintain lowercase narrative flow in comments"
    rules:
      - "start comments lowercase [ ## read config from file ]"
      - "no capital letters at comment start"
      - "avoid sentence-like punctuation [ unless essential ]"
    example:
      bad:  "## Read the configuration from file"
      good: "## read configuration from file"

  # bracket and parenthesis usage
  brackets:
    description: "use square brackets for annotations and context"
    rules:
      - "use [ word ] for annotations"
      - "use [ word ] in comments for context clarification"
      - "avoid parentheses in comments [ use brackets instead ]"
    example:
      bad:  "## read config (from file)"
      good: "## read config [ from file ]"

  # lowercase narrative
  narrative:
    description: "code should read as continuous lowercase narrative"
    rules:
      - "maintain visual consistency"
      - "no jarring capitals breaking rhythm"
      - "holographic consistency across all code levels"
    rationale: "smooth visual flow aids speed reading and comprehension"

  # visual consistency
  visual_flow:
    description: "every visual element should support reading flow"
    rules:
      - "consistent indentation patterns"
      - "aligned bracket usage"
      - "predictable spacing and structure"
    rationale: "brain recognizes patterns instantly; consistency reduces cognitive load"

  # documentation
  documentation:
    description: "keep documentation aligned with code style principles"
    rules:
      - "use lowercase narrative in docs"
      - "use [ brackets ] for context"
      - "avoid formal academic style in comments"
    rationale: "code comments are part of the codebase narrative, not separate documentation"

# special protocol-7 conventions [ to be expanded ]
protocol7_specific:

  module_naming:
    description: "module names follow zenka.subsystem.function pattern"
    example: "src/nshell.search.handler"

  state_variables:
    description: "state tracking uses consistent naming prefix"
    pattern: "ctrl_o_* for ctrl-o related state"
    example: "ctrl_o_start_position, ctrl_o_iteration_count"

  colon_keywords:
    description: "flags and intent markers use :keyword: colon-bracket syntax"
    rationale: >
      visually distinguishes functional intent from regular parameters or
      variable content — readable at a glance in code, command strings,
      network messages, and documentation. consistent across all contexts
      since the web-browser zenka normalizes this as the p7 flag vocabulary.
      any zenka in a routing chain can recognize and act on :keyword: tokens
      without separate flag-parsing logic, and without ambiguity about
      whether something is a mode flag or a data value.
    rules:
      - "single flags: :dry-run:, :verbose:, :force:"
      - "typed flags: :action:scroll_down:, :action:filter:"
      - "never use --flag or -f style in p7 command arguments"
      - "llm-generated commands must use :flag: not --flag"
    examples:
      bad:  "p7c models.adapter.repair invoke --dry-run --verbose"
      good: "p7c models.adapter.repair invoke :dry-run: :verbose:"

  # to be expanded with:
  # - return value conventions
  # - error handling patterns
  # - state machine patterns

llm_integration:

  feedback_style:
    description: "zenki provide constructive style feedback to llms"
    format: "corrected N instances of [ issue description ]"
    example: "corrected 3 capitalized comments for lowercase narrative flow"

  learning_loop:
    - "corrections are silent during generation [ no disruption ]"
    - "feedback provided after completion [ learning opportunity ]"
    - "llm incorporates style into context for future generations"
    - "repeated corrections decrease as llm learns conventions"

  context_reminders:
    description: "include style conventions when initializing llm context"
    use_cases:
      - "new llm session starting protocol-7 work"
      - "periodic reminder for long multi-turn conversations"
      - "explicit style reset if code quality diverges"

code_presence_and_cross_namespace_calls:  # july 2026, commits b674ecd80/ae6b1f79b

  referenced_sub_scanner:
    description: >
      base.referenced_subroutines.clear_from_disk [ every reload/init ]
      regex-scans compiled source for literal-quoted $code{'name'} patterns
      and reports ones with no matching %code entry into the 'undef-subs'
      buffer [ query via 'show-buffer undef-subs' ]. entries clear by actual
      %code definition [ real compile or deferred stub ], not by
      file-existence on disk [ old behavior, masked real bugs ].
    rules:
      - "never write exists $code{'literal.name'} directly — the scanner flags it"
      - "dynamic-key access via base.code.exists is invisible to the scanner"

  primitives:
    description: "use these instead of raw %code checks or zenka-name identity proxies"
    rules:
      - "<[base.code.exists]>->('name') : presence check via dynamic key"
      - "<[base.code.call_expected]>->($cond, 'name', @args) : call if cond true, loud error if sub missing"
      - "<[base.code.call_optional]>->('name', @args) : call if present, silent skip"
      - "<[base.mod.exists]>->('ns') : checks <base.p7_mod.loaded>->{ns} — ground truth for this zenka"
    examples:
      expected: "<[base.code.call_expected]>->( <[base.mod.exists]>->(qw| v7 |), qw| v7.teardown | )"
      hard_requirement: "<[base.code.call_expected]>->( TRUE, qw| crypt.C25519.cmd.get-public-key | )  # auth.auth_select"
      optional: "<[base.code.call_optional]>->( qw| channels.cmd.update |, { 'args' => $str } )"
    anti_patterns:
      - "<system.zenka.name> eq 'v7' as proxy for 'is v7 namespace compiled here'"
      - "exists $code{'literal.name'} written inline in a module"

  rename_caveat:
    description: >
      before renaming or moving any module, grep the whole tree for
      sprintf.*<name-fragment> constructions, not just literal <[...]>
      calls — dynamic resolution like sprintf('prefix.%s.suffix', $var) is
      invisible to both literal grep and the referenced-sub scanner.
      known cases: base.net.connect, base.handler.auth cap-neg dispatcher
      [ a rename silently broke nshell cube connect until testing caught it ].
    command: "grep -rn 'sprintf' src/ | grep -i '<name-fragment>'"

