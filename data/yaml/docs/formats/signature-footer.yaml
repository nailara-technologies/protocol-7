      Improved in commit b90bbbbff with 4-tier flexible extraction pattern hierarchy:
      - Uses concrete regex anchors for reliable matching
      - Patterns from most specific to most lenient
      - Handles edge cases where standard patterns fail
      - Critical bug fix: Sets needs_separator_endline for first-time signing
      - See signature-endline-handling.yaml for pattern details
  validation:
    character_sets:
      valid_chars: "[0-9A-Z]"
      header_chars: "[.,]"
    checks:
      - "structural validity"
      - "length matching"
      - "character validity"
      - "checksum verification"
      - "template validation"
      - "signature file template checking"
  metadata:
    payload_checksum: "AMOS payload checksum"
    endline_state: "Stripped endline state encoded in header"
    iterations_remaining: "AMOS footer iteration counter encoded in header"
    signature_type: "C25519-B32 signature format"
    checksum_type: "BMW-384-B32 checksum format"
  processing_flow:
