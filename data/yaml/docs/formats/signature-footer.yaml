signature_format:
  name: "AMOS7 Data Signature Format"
  version: "1.0"
  structure:
    header:
      name: "First Header Line"
      format: "Encoded octal bit header"
      representation: "#[,,,,,,,,,,,,,,,,,,,]"
      characters:
        ".": "binary 1"
        ",": "binary 0"
      bits: 57
      octal_digits: 19
      encoding:
        digits_0_10: "AMOS payload checksum (11 bits)"
        digit_11: "Stripped endline state (1 bit)"
        digits_12_18: "AMOS footer iteration counter (8 bits)"
      special_cases:
        all_zeros: "Inverts binary encoding mode"
    signature:
      name: "Signature Body"
      format: "BMW-384-B32 checksum + C25519-B32 signature"
      components:
        checksum:
          type: "BMW-384-B32"
          encoding: "Base32"
        signature:
          type: "C25519-B32"
          encoding: "Base32"
      parts:
        sig-part-0: "first 51 characters"
        sig-part-1: "next 52 characters"
    footer:
      name: "Footer Structure"
      format: "Signature template with substituted variables"
      components:
        - header_line: "First line with encoded header bits"
        - signature_line: "Base32 encoded signature data"
      variables:
        'data-chksum':
          pos: 80
          len: 77
          str_ref: "payload_data_ref->{'data-chksum'}"
        'signature':
          parts:
            - pos: 163
              len: 51
              str_ref: "calc_result_href->{'sig-part-0'}"
            - pos: 242
              len: 52
              str_ref: "calc_result_href->{'sig-part-1'}"
        'data-type':
          pos: 298
          len: 4
          str: "DATA"
        'signature-type':
          pos: 233 - length $sig_name_str
          len: length $sig_name_str
          str_ref: "$sig_name_str"
      validation:
        length_check: true
        structural_check: true
        character_validation: true
        checksum_verification: true
        template_validation: true
        signature_template_check: true
  encoding_functions:
    decode_header: "amos7.decode_octal_bit_header"
