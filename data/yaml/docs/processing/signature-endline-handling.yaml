title: Signature Endline Normalization and Delta Encoding
description: |
  Comprehensive documentation of the simplified endline normalization system in Protocol-7.
  This system normalizes separator endlines to exactly 1, encodes the transformation as a
  delta in the signature for reversibility, and enables self-healing through canonical format.
  No complex recovery mechanisms - clean normalization-based approach with deterministic behavior.

