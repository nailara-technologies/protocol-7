key_components:
  normalization_core:
    title: "Endline Normalization and Delta Encoding"
    module: "modules/source.cmd.get-code-signed (lines 161-195)"
    description: |
      The core of the new system: detect original endline state, calculate transformation
      delta, normalize to exactly 1 separator endline, and encode the delta for reversibility.

      Algorithm:
      ```perl
      # Count trailing endlines before signature
      my $original_trailing = $src_str =~ m/(\n*)$/ ? length($1) : 0;

      # Map original endline count to endline state value (delta = transformation applied)
      my $endline_delta;
      if ( $original_trailing == 0 ) {
          # No endlines: need to add exactly 1 separator
          $endline_delta = 6;  # "add separator endline"
      } elsif ( $original_trailing == 1 ) {
          # Already exactly 1: no change needed
          $endline_delta = 5;  # "no change"
      } else {
          # Multiple endlines: need to normalize to exactly 1
          $endline_delta = 1;  # "normalize excess endlines"
      }

      # Normalize to exactly 1 trailing endline
      $src_str =~ s/\n*$/\n/s;

      # Recalculate footer with normalized content
      $recalc_data = <[source.create_harmonic_footer]>->( $footer_data, $sign_verbosity );

      # Append footer directly - content already has exactly 1 trailing newline
      # This provides canonical format: content\n#signature (exactly 1 separator newline)
      $src_str .= $recalc_data->{'signature-footer-str'};
      ```

      Key insight: All normalization happens in one place before signing, ensuring
      deterministic behavior and no oscillation.

  delta_encoding:
    title: "Delta Encoding for Reversibility"
    module: "modules/amos7.encode_octal_header (position 11)"
    description: |
      The transformation delta is encoded as a single octal digit in the AMOS7 header
      to enable reconstruction of the original file-as-found state:

      - State 5 (octal 5): No change - file already had exactly 1 trailing endline
      - State 6 (octal 6): Add separator - file had 0 endlines, we added 1
      - State 1 (octal 1): Normalize excess - file had 2+ endlines, we normalized to 1
      - States 2-4: Reserved for future use
      - States 0, 7: Reserved for future use

      To reverse the transformation (get back original file):
      - If state 1: Add back the excess endlines to the signature breakpoint
      - If state 6: Remove the separator endline we added
      - If state 5: No reversal needed (canonical format is original state)

  canonical_format:
    title: "Canonical Signature Format"
    description: |
      All signed files follow the canonical format:
      ```
      <file_content>\n#<signature_footer>
      ```

      Where:
      - `<file_content>` is the actual code/data
      - `\n` is exactly ONE newline (separator between content and signature)
      - `#<signature_footer>` is the signature metadata and BMW checksum

      This canonical format is:
      - Deterministic: same content always produces same format
      - Verifiable: verifier knows to look for exactly 1 separator newline
      - Reversible: delta encoding records what transformation was applied
      - Self-healing: if corrupted, re-signing restores canonical format

  verification:
    module: "modules/sourcecode.console.verify-p7-signatures"
    description: |
      Verification confirms:
      1. File is in canonical format (exactly 1 separator newline)
      2. BMW checksum matches the signature
      3. Cryptographic signature is valid
      4. Endline state encoding is present and correct

      If verification finds files not in canonical format, they are marked invalid
      and will be fixed by the self-healing `update-signatures` process.

  self_healing:
    title: "Self-Healing Through Normalization"
    trigger: "bin/Protocol-7 sourcecode update-signatures"
    description: |
      When files are re-signed (either via update-signatures or commit hooks):

      1. Extract current signature and endline state
      2. Read file content
      3. Detect current trailing endlines
      4. Normalize to exactly 1 endline
      5. Calculate transformation delta
      6. Recalculate signature with normalized content
      7. Encode delta in AMOS7 header for reversibility
      8. Write file back in canonical format

      Result: Files always converge to canonical format. No oscillation.
      No complex recovery logic needed. Pure deterministic normalization.

logical_flow:
  - step: 1
    name: "Count trailing endlines"
    module: "source.cmd.get-code-signed:163"
    description: "Detect how many newlines exist at the end of content before signature"

  - step: 2
    name: "Calculate transformation delta"
    module: "source.cmd.get-code-signed:169-179"
    description: "Map endline count to state value (1=normalize excess, 5=no change, 6=add separator)"

  - step: 3
    name: "Normalize to canonical format"
    module: "source.cmd.get-code-signed:182"
    description: "Regex: s/\\n*$/\\n/s - normalize ALL trailing endlines to exactly 1"

  - step: 4
    name: "Recalculate and append signature"
    module: "source.cmd.get-code-signed:191-195"
    description: "Recalculate footer with normalized content, append directly (no extra prefix)"

endline_states:
  - state: 1
    description: "Normalize excess endlines (state 1 = normalize excess)"
    condition: "File had 2 or more trailing newlines"
    transformation: "Remove excess, keep exactly 1 separator newline"
    use_case: "Common when multiple developers or editors add extra newlines"
    encoding_location: "AMOS7 header position 11 (octal digit)"
    reversible: "Yes - can restore original excess endlines using this delta"

  - state: 5
    description: "No change (state 5 = already canonical)"
    condition: "File already had exactly 1 trailing newline"
    transformation: "No modification applied"
    use_case: "File was already in canonical format"
    encoding_location: "AMOS7 header position 11 (octal digit)"
    reversible: "Yes - canonical format IS the original state"

  - state: 6
    description: "Add separator endline (state 6 = add separator)"
    condition: "File had 0 trailing newlines"
    transformation: "Add exactly 1 newline (separator between content and signature)"
    use_case: "File missing separator endline (most common issue)"
    encoding_location: "AMOS7 header position 11 (octal digit)"
    reversible: "Yes - can remove the separator we added using this delta"

  - states: "2, 3, 4, 0, 7"
    description: "Reserved for future use"
    rationale: "Current system uses only states 1, 5, 6. Additional states available for future enhancements."

workflow_overview:
  title: "Complete Endline Normalization Workflow"
  description: |
    The new simplified system replaces complex BMW recovery with deterministic normalization:

    OLD APPROACH (Complex):
    - Multiple endline states (0-7) each removing different amounts
    - BMW checksum brute-force recovery on mismatches
    - Complex symmetry fixes and state locking
    - Potential for oscillation in edge cases

    NEW APPROACH (Simple):
    - Only 3 active states: 1 (normalize excess), 5 (no change), 6 (add separator)
    - Deterministic normalization to canonical format (exactly 1 separator endline)
    - Delta encoding for reversibility (what transformation was applied)
    - No oscillation: same input always produces same canonical output
    - All normalization in one place: source.cmd.get-code-signed lines 161-195

  benefits:
    deterministic: "Same file always normalizes to same canonical format"
    predictable: "No brute-forcing, no recovery modes, no special cases"
    reversible: "Delta encoding records transformation, can restore original"
    efficient: "Single pass through the file, no multiple recalculations"
    maintainable: "Clear logic in one module, easy to understand and debug"
    no_oscillation: "Convergence guaranteed - files stabilize after first signing"

problem_solved:
  description: |
    BEFORE: Files could have 0, 1, 2, or many trailing newlines before signature.
    Different signatures had different state encodings. Re-signing could fail if
    states didn't match. Complex recovery logic needed.

    AFTER: All files normalized to exactly 1 trailing newline before signature.
    Transformation recorded in state delta. Any corrupted file re-signs to same
    canonical format. Pure deterministic behavior.

  examples:
    case_1:
      description: "File with no trailing newlines"
      before: "content#signature_footer"
      transformation: "Add 1 separator"
      after: "content\n#signature_footer"
      encoded_state: 6

    case_2:
      description: "File with 1 trailing newline (already canonical)"
      before: "content\n#signature_footer"
      transformation: "No change"
      after: "content\n#signature_footer"
      encoded_state: 5

    case_3:
      description: "File with 3 trailing newlines"
      before: "content\n\n\n#signature_footer"
      transformation: "Normalize to 1"
      after: "content\n#signature_footer"
      encoded_state: 1

delta_encoding_semantics:
  description: |
    Each state encodes what transformation was applied, enabling reversibility:

  state_1_normalize_excess:
    meaning: "File originally had 2+ trailing newlines, we normalized to 1"
    reversal_logic: "Detect signature position, count encoded endlines, add them back"
    canonical_file: "content\n#signature"
    original_file_reconstruct: "content\n...\n#signature (add back excess endlines)"

  state_5_no_change:
    meaning: "File already had exactly 1 trailing newline"
    reversal_logic: "No reversal needed - canonical format IS the original"
    canonical_file: "content\n#signature"
    original_file_reconstruct: "content\n#signature (identical)"

  state_6_add_separator:
    meaning: "File had 0 trailing newlines, we added 1 separator"
    reversal_logic: "Remove the separator endline we added"
    canonical_file: "content\n#signature"
    original_file_reconstruct: "content#signature (remove separator)"

integration_summary:
  detection_phase:
    location: "source.cmd.get-code-signed:163"
    behavior: "Count trailing newlines in file content"
    output: "$original_trailing = length of existing newlines"

  calculation_phase:
    location: "source.cmd.get-code-signed:169-179"
    behavior: "Map endline count to delta state"
    logic: |
      if (0 endlines) → state 6 (add separator)
      if (1 endline) → state 5 (no change)
      if (2+ endlines) → state 1 (normalize excess)
    output: "$endline_delta = state value"

  normalization_phase:
    location: "source.cmd.get-code-signed:182"
    behavior: "Apply regex to normalize all trailing endlines to exactly 1"
    regex: "s/\\n*$/\\n/s"
    effect: "All files converge to canonical format"

  signing_phase:
    location: "source.cmd.get-code-signed:191-195"
    behavior: "Recalculate signature and append to normalized content"
    format: "content\n#signature_footer (exactly 1 separator)"
    stability: "Re-signing same file produces identical output"

conclusion: |
  The new endline normalization system achieves simplicity without sacrificing
  functionality:

  **Core Principle**: Normalize everything to canonical format (exactly 1 separator
  endline), encode what transformation was applied (delta state), and make the
  system self-healing through deterministic behavior.

  **Key Advantages**:
  1. Simple: Only 3 states, clear logic, single module handles all normalization
  2. Deterministic: Same input always produces same output (no oscillation)
  3. Reversible: Delta encoding preserves information about what we changed
  4. Self-Healing: Files automatically converge to canonical format on re-signing
  5. Efficient: Single-pass normalization, no complex recovery logic

  **Files Stay Valid**:
  - Verification checks for canonical format (exactly 1 separator endline)
  - Files in canonical format pass verification
  - Update-signatures normalizes any file to canonical format
  - System reaches stable state after first signing

  **User Experience**:
  - Run `bin/Protocol-7 sourcecode update-signatures` when signatures fail
  - System automatically normalizes all files to canonical format
  - Signatures remain valid across multiple signing cycles
  - No manual intervention needed