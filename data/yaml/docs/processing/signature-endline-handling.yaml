endline_states:
  - state: 0
    description: "Remove 4 trailing newlines (state 0 = remove 4)"
    modification: "s/\\n{4,}$/\\n/s"
    use_case: "File had multiple trailing newlines, reduce to single"

  - state: 1
    description: "Remove 3 trailing newlines (state 1 = remove 3)"
    modification: "s/\\n{3,}$/\\n/s"
    use_case: "File had 3 or more trailing newlines"

  - state: 2
    description: "Remove 2 trailing newlines (state 2 = remove 2)"
    modification: "s/\\n{2,}$/\\n/s"
    use_case: "File had 2 or more trailing newlines"

  - state: 3
    description: "Remove 1 trailing newline (state 3 = remove 1)"
    modification: "s/\\n{1,}$/\\n/s"
    use_case: "File had multiple newlines, but preserve one"

  - state: 4
    description: "Remove 0 newlines (state 4 = no change)"
    modification: "No change applied"
    use_case: "Endlines already correct or file ends without newline"

  - state: 5
    description: "Default state - preserve current endline state"
    modification: "No modification"
    use_case: "Default/safe state when endline handling is uncertain"

  - state: 6
    description: "Add 1 endline (separator only)"
    modification: "s/(\\n*)$/$1\\n/s"
    use_case: "File missing separator endline between content and signature"

  - state: 7
    description: "Add 2 endlines (complete line + separator)"
    modification: "s/(\\n*)$/$1\\n\\n/s"
    use_case: "File incomplete (no final newline) AND missing separator endline"

bmw_checksum_recovery_mechanism:
  title: "Intelligent BMW Checksum-Based Endline-State Recovery"
  description: |
    The core breakthrough of the signature system: when a BMW checksum mismatch occurs,
    instead of failing, the system uses the BMW checksum as cryptographic ground truth
    to brute-force the correct endline-state. This solves the oscillation problem where
    files become invalidly signed after content changes.

  problem_solved:
    - "Stale endline-state values after file content modifications"
    - "Infinite re-signing loops (oscillation) when signatures are updated"
    - "Need to know correct endline-state without explicitly tracking it"

  solution:
    - "Use BMW checksum as ground truth (cryptographic verification)"
    - "Try all 8 possible endline-states (0-7)"
    - "For each state, apply endline restoration and recalculate BMW"
    - "Record the state that produces matching BMW checksum"
    - "Next signing cycle uses correct state (prevents oscillation)"

  implementation_in_modules:
    - module: source.signature_valid
      location: "lines 480-542"
      triggered_by: "BMW checksum mismatch in repair mode"
      algorithm: |
        1. BMW checksum mismatch detected in strict mode → fail fast
        2. In repair mode, enter brute-force recovery:
           a. foreach endline_state (0..7):
              - Apply endline restoration for this state
              - Recalculate BMW checksum on modified payload
              - If BMW matches signature's BMW → found correct state!
              - Record recovered state in footer_data
           b. If no state matches → allow validation (will be fixed on re-signing)
        3. Update footer_data->{'endline-state-encoded'} with recovered state
        4. Next signing cycle automatically uses correct state (stable)

    - module: source.create_harmonic_footer
      triggered_by: "Signature creation process"
      uses: "Footer data with recovered endline-state from signature_valid"
      applies: "The recovered state during payload normalization"

    - module: source.cmd.get-code-signed
      triggered_by: "File signing operations"
      calls: "source.signature_valid in repair mode"
      receives: "Recovered endline-state from verification"
      applies: "Recovered state during signing (ensures stability)"

  recovery_flow:
    step_1: "Extract signature from file (repair mode)"
    step_2: "Call source.signature_valid with mode='repair'"
    step_3: "BMW mismatch detected → brute-force recovery begins"
    step_4: "Try each endline-state, find matching BMW"
    step_5: "Update footer_data with recovered state"
    step_6: "Return to source.cmd.get-code-signed with correct state"
    step_7: "Re-sign using correct state (now stable for future operations)"
    step_8: "Write file → signature stays valid (no oscillation)"

  key_constraints:
    - "Recovery only happens in repair mode (not strict mode)"
    - "Recovery respects existing endline state encoding limits"
    - "Prevents oscillation by recording the state that matches BMW"
    - "Cryptographic verification ensures recovered state is correct"
    - "Integration into extraction/verification/signing pipeline is seamless"

  implementation_details:
    endline_restoration_pseudo_code: |
      foreach state (0..7):
        if state == 0 or state < 5:
          remove_count = 4 - state
          payload =~ s/\n{remove_count,}$/\n/s
        elsif state == 6:
          payload =~ s/(\n*)$/$1\n/s
        elsif state == 7:
          payload =~ s/(\n*)$/$1\n\n/s

    bmw_calculation: |
      bmw_ctx = bmw_start_ctx->clone
      bmw_ctx->add(footer_start_line + '#')
      test_bmw_bin = bmw_ctx->digest
      test_bmw = encode_b32r(test_bmw_bin)

    success_condition: |
      if test_bmw == signature_footer_data->{'bmw-chksum'}:
        recovered_state = test_state
        signature_footer_data->{'endline-state-encoded'} = recovered_state
        signature_footer_data->{'recovered-endline-state'} = recovered_state
        break

  operational_modes:
    strict_mode:
      behavior: "Fail immediately on BMW checksum mismatch"
      use_case: "Initial verification, strict validation"
      recovery: "None"

    repair_mode:
      behavior: "Attempt BMW-based recovery on mismatch"
      use_case: "File updates, signature re-signing, automated healing"
      recovery: "Brute-force all 8 endline-states to find correct one"
      result: "Records correct state for stable future operations"

