---
title: Signature Endline Handling
description: |
  Documentation of the endline handling fix in the Protocol-7 signature verification and
  update system, explaining the critical order of operations and logic flow.

commit_reference: D0561F9C58919909C3A8B756135E3B2FBD88D1EC
commit_author: "Taeki Ten of {[.NAiLArA:T3K`]} <taeki.ten@protocol-7.network>"
commit_date: "Tue Oct 14 03:54:06 2025 +0200"
commit_message: "fixed endline handling in 'sourcecode'-zenka 'update-signatures' command."

affected_modules:
  - modules/source.extract_sig_body
  - modules/source.signature_valid
  - modules/source.cmd.get-code-signed
  - modules/source.create_harmonic_footer
  - modules/sourcecode.console.verify-p7-signatures

key_components:
  detection:
    module: source.extract_sig_body
    description: |
      Detects missing separator endlines between content and signature footers.

      The critical change shifts from treating missing separator endlines as fatal
      errors to flagging them for repair:

      Before:
      ```perl
      if ($seperator_endline_absent) {    ## [ ERR: policy ]
          $footer_data->{'encountered-error'}
              = 'data signature footer not valid [ no seperator endline ]';
          return $footer_data;  // Early termination!
      }
      ```

      After:
      ```perl
      if ($seperator_endline_absent) {
          // Store information instead of treating as error
          $footer_data->{'needs_separator_endline'} = TRUE;

          // Check if the last line is also incomplete
          my $last_line_incomplete = ( $$src_ref !~ m/\n$/ );
          $footer_data->{'last_line_incomplete'} = $last_line_incomplete;

          // Continue processing to allow proper restoration
      }
      ```

      This change enables the detection of both:
      - Missing separator endlines between content and signature
      - Incomplete last lines (content that doesn't end with a newline)

  verification:
    module: source.signature_valid
    description: |
      The signature validation module was updated to recognize and flag endline issues:

      ```perl
      } elsif ( $signature_footer_data->{'needs_separator_endline'} ) {
          // Consider signatures with missing separator endlines as invalid
          // so they will be updated by the signature process
          return ( FALSE, { 'footer-needs-separator-endline' => TRUE } )
              if wantarray;
          return FALSE;
      }
      ```

      This marks files with missing separator endlines as invalid signatures,
      ensuring they'll be fixed when signatures are updated.

  planning:
    module: source.create_harmonic_footer
    description: |
      This module now properly sets the endline state based on the detected conditions:

      ```perl
      // Determine endline state based on detected conditions
      my $endline_modification_state;

      // Check for special cases that need endline adjustments
      if ($footer_data->{'needs_separator_endline'} && $footer_data->{'last_line_incomplete'}) {
          // State 7: Add 2 endlines (complete line + separator)
          $endline_modification_state = 7;
      } elsif ($footer_data->{'needs_separator_endline'}) {
          // State 6: Add 1 endline (separator only)
          $endline_modification_state = 6;
      } else {
          // Use existing state or default
          $endline_modification_state = $footer_data->{'endline-state-encoded'} // 5;
      }
      ```

      The endline state is encoded in the AMOS7 header and dictates how endlines
      are restored when signatures are processed.

  execution:
    module: source.cmd.get-code-signed
    description: |
      This module now explicitly checks and fixes endlines before appending signatures:

      ```perl
      // Before appending the signature, ensure proper endline handling
      my $ends_with_newline = $src_str =~ m/\n$/;
      my $needs_endline_fix = !$ends_with_newline
          || ($footer_data && $footer_data->{'needs_separator_endline'});

      if ($needs_endline_fix) {
          if (!$ends_with_newline && ($footer_data && $footer_data->{'last_line_incomplete'})) {
              $src_str =~ s/\n*$/\n\n/s;  // Add 2 endlines: complete line + separator
          } elsif ($footer_data && $footer_data->{'needs_separator_endline'}) {
              $src_str =~ s/\n*$/\n/s;    // Add 1 endline (separator only)
          } elsif (!$ends_with_newline) {
              $src_str .= "\n";           // Complete the last line
          }
      }

      // Now append the signature
      $src_str .= $recalc_data->{'signature-footer-str'};
      ```

  checking:
    module: sourcecode.console.verify-p7-signatures
    description: |
      This module checks for missing separator endlines during verification:

      ```perl
      # Check if signature has missing separator endline
      if ( $footer_data->{'needs_separator_endline'} ) {
          <[base.log]>->( 1, ':E: missing separator endline before signature' );
          $invalid_count++;
          next;
      }
      ```

logical_flow:
  - step: 1
    name: "Detection in extract_sig_body"
    description: "The file is scanned and any endline issues are flagged rather than immediately rejected."

  - step: 2
    name: "Verification in signature_valid"
    description: "The verification process checks for endline issues and marks them as invalid."

  - step: 3
    name: "Planning in create_harmonic_footer"
    description: "Determines what kind of endline fix is needed based on the detected issues."

  - step: 4
    name: "Execution in cmd.get-code-signed"
    description: "The actual fixes are applied before appending the signature."

endline_states:
  - state: 5
    description: "Default state - endline state unchanged"

  - state: 6
    description: "Add 1 endline (separator only)"

  - state: 7
    description: "Add 2 endlines (complete line + separator)"

proposed_enhancements:
  title: "Conditional Bypass Pattern for Improved Endline Handling"
  description: |
    To enhance the existing endline handling implementation, we propose adding a
    conditional bypass pattern to provide more flexibility in how endline issues are handled.
    This allows for different modes of operation without major code restructuring.

  key_principles:
    - "Separate detection from handling"
    - "Maintain backward compatibility"
    - "Add flexibility through operation modes"
    - "Reduce code duplication"

  module_modifications:
    - module: source.extract_sig_body
      changes: |
        Add a mode parameter to allow conditional early termination:

        ```perl
        # Add mode parameter with default value for backward compatibility
        my $src_ref = shift;
        my $strip   = shift // '';
        my $mode    = shift // 'strict'; # Options: 'strict', 'repair', 'info'

        # Later in the code, where it detects endline issues:
        if ($seperator_endline_absent) {
            # Always store the information regardless of mode
            $footer_data->{'needs_separator_endline'} = TRUE;
            my $last_line_incomplete = ( $$src_ref !~ m/\n$/ );
            $footer_data->{'last_line_incomplete'} = $last_line_incomplete;

            # Issue warning
            map { <[base.log]>->( 0, ": $ARG" ) }
                ( 'data-signature footer has no', ': separator endline' );

            # Only treat as error in strict mode
            if ($mode eq 'strict') {
                $footer_data->{'encountered-error'}
                    = 'data signature footer not valid [ no separator endline ]';
                return $footer_data; # Early return only in strict mode
            }

            # Otherwise continue processing to allow repair
            <[base.log]>->( 0, ": fixing in $mode mode" ) if $mode eq 'repair';
        }
        ```

    - module: source.signature_valid
      changes: |
        Add conditional handling based on mode:

        ```perl
        # Add mode parameter with default for backward compatibility
        my $payload_sref          = shift // '';
        my $signature_footer_data = shift;
        my $truth_checks          = shift // {};    ##  optional  ##
        my $key_name_param        = shift;          ##  optional  ##
        my $mode                  = shift // 'strict'; # Options: 'strict', 'repair'

        # Later in the endline checking code:
        } elsif ( $signature_footer_data->{'needs_separator_endline'} ) {
            # Record the issue regardless of mode
            $truth_status_report->{'footer-needs-separator-endline'} = TRUE;

            # Only fail in strict mode
            if ($mode eq 'strict') {
                $verified_true = FALSE;
                return ($verified_true, $truth_status_report) if wantarray;
                return $verified_true;
            }

            # In repair mode, continue validation but note the issue
            <[base.log]>->( 1, ': allowing validation despite missing separator endline (repair mode)' )
                if $mode eq 'repair';
        }
        ```

    - module: sourcecode.console.verify-p7-signatures
      changes: |
        Add a repair mode flag to the verification command:

        ```perl
        my $command_params = shift // '';
        my $verify_verbosity = 2;    ## [ 0 | 1 | 2 ] ##
        my $verify_mode = 'strict';  ## [ 'strict', 'repair' ] ##

        # Parse mode flag from command
        if ($command_params =~ s/ *:repair-mode: *//i) {
            $verify_mode = 'repair';
            <[base.log]>->( 1, ': running in repair mode (will not fail on fixable issues)' );
        }

        # Later in the file checking code:
        # Check if signature has missing separator endline
        if ( $footer_data->{'needs_separator_endline'} ) {
            <[base.log]>->( 1, ':E: missing separator endline before signature' );

            if ($verify_mode eq 'strict') {
                $invalid_count++;
                next;
            } else {
                <[base.log]>->( 1, ': continuing in repair mode' );
                # Allow verification to continue but note the issue
                $repair_needed_count++;
            }
        }

        # Pass mode to signature validation
        my ( $is_valid, $report_ref ) = <[source.signature_valid]>->(
            \$src_str, $footer_data, {}, $signature_key_name, $verify_mode
        );
        ```

    - module: source.cmd.get-code-signed
      changes: |
        Add a mode parameter for consistency:

        ```perl
        my $src_file     = shift;
        my $allow_modify = shift // 0;
        my $mode         = shift // 'repair'; # Default to repair for this module
        ```

  integration_approach:
    - "Add new parameters with backward-compatible defaults"
    - "Pass mode parameters through the full validation chain"
    - "Preserve existing behavior for non-endline-related issues"
    - "Keep the existing endline state encoding system (5, 6, 7)"

  benefits:
    - "More flexibility in how endline issues are handled"
    - "Support for verification-only and repair modes"
    - "Detailed reporting of issues without immediate failure"
    - "Easier debugging and testing of signature issues"
    - "Minimal code changes for maximum impact"

conclusion: |
  The order of operations is critical for proper handling of signature endlines.

  By changing the detection phase to flag issues rather than immediately error out, the
  system can properly diagnose and correct different types of endline problems throughout
  the entire pipeline. This ensures proper handling of all cases:

  - Files with no endline at all
  - Files missing just the separator endline
  - Files with signatures directly appended to content
  - Previously valid files that need no changes

  The fix ensures that signatures in all files, particularly Markdown files, have the
  proper separator endlines, which is essential for both readability and proper signature
  verification.

  The proposed conditional bypass enhancement would further improve the system by adding
  flexibility in how endline issues are handled, without requiring major code restructuring.
  This would enable advanced use cases such as verification-with-repair, signature checking
  without failure, and better reporting of signature issues.