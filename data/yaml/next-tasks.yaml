tasks:

  visualization:

    - id: orbital-radius-adjust
      desc: change p7refToCoords radius 140→210 (FORMATION_SPACING/2, midpoint to next node group)
      effort: trivial
      assignee: coding-zenka
      status: open
      files:
        - data/web-root/vhosts/space.v7.ax/visualization.html
      notes: >
        5 call sites, all p7refToCoords(..., 140) — change to 210.
        makes peers orbit at the boundary of local space, improves planetary system geometry.

    - id: color-threshold-brightness
      desc: global BRIGHTNESS scalar over all rgba alphas in visualization.html
      effort: small
      assignee: claude
      status: open
      notes: >
        single variable wired through draw functions.
        makes all colors relative to one brightness control.

    - id: shell-2-orbital-render
      desc: render peers' peers at radius 280 (nameserv radius), dimmed to alpha 0.3
      effort: medium
      assignee: kimi
      status: open
      blocked-by: orbital-radius-adjust
      notes: >
        JS rendering half can be stubbed now (radius 280, alpha 0.3, existing drawNodeGlow).
        P7 side needs kimi: grid fragment sync via discover.orbital.share_grid_fragment /
        external.orbital.sync_grid_fragment — 13 nested orbit references already in codebase.

  graphics-matrix:

    - id: voxel-space-research
      desc: harmonic voxel space — division-13 frequency mapping to 3D voxel grid
      effort: medium
      assignee: coding-zenka
      status: open
      files:
        - data/tasks/graphics-matrix-voxel-space.md

    - id: channel-palette-population
      desc: confirmed already working — archive task file
      effort: trivial
      assignee: any
      status: done

  infrastructure:

    - id: index-zenka-xfs-template
      desc: XFS template for index zenka
      effort: medium
      assignee: coding-zenka
      status: open
      files:
        - data/tasks/index-zenka-xfs-template.md

    - id: stream-cancel-session-teardown
      desc: session-close teardown for STRM cancel (open item from STRM stack)
      effort: medium
      assignee: kimi
      status: open
      notes: see topic-stream-cancel-design.md — teardown not yet implemented

    - id: compaction-visibility
      desc: log compaction events visibly in show-buffer (currently silent)
      effort: small
      assignee: kimi
      status: open

  blocked:

