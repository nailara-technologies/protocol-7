---
patterns:
  - name: smtpd-classify-10-interview
    descr: interview request keyword match
    pattern: '(?i)\binterview\b'
    action_type: classify
    label: interview_request
    status: auto-apply
    origin: manual
    applicability:
      file_type: mail
      confidence: 0.95
      scope: ['smtpd.classify', 'smtpd.*']
    stats: { applied: 0, matched: 0, false_positive: 0 }

  - name: smtpd-classify-20-rejection
    descr: rejection keyword match (de/en)
    pattern: '(?i)\b(?:ablehnung|rejection|regret|unfortunately|nicht\s+berücksichtigt|nicht\s+ausgewählt)\b'
