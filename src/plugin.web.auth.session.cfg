# name  = plugin.web.auth.session.cfg
# descr = resolve bounded ui session settings
# note  = host config overrides live under web.auth.session ; invalid or
#         non-positive values never disable a bound

my $stored = $data{'plugin.web.auth'}{'cfg'}{'session'} // {};
my $host   = <web.auth.session>                         // {};
$stored = {} if ref $stored ne qw| HASH |;
$host   = {} if ref $host ne qw| HASH |;

my $defaults = {
    'ttl_seconds'          => 86400,
    'idle_timeout_seconds' => 900,
    'max_age_seconds'      => 43200,
    'overlap_seconds'      => 30,
};

my $cfg = {};
for my $key ( keys %{$defaults} ) {
    my $value = $host->{$key} // $stored->{$key} // $defaults->{$key};
    $value = $defaults->{$key}
        if not defined $value
        or $value !~ m|^\d+$|
        or $value < 1;
    $cfg->{$key} = 0 + $value;
}

return $cfg;

