# name  = plugin.web.auth.admit.cfg
# descr = login admission tuning constants
# note  = login admission tuning constants [ LOGIN-ADMISSION.md sections
#         2 + 3 : the numbers are declared first guesses there ] ; any of
#         them may be overridden in host config [ /etc/protocol-7/web/
#         host.cfg : web.auth.admit.<key> = <value> ]

my $admit = $data{'plugin.web.auth'}{'admit'} //= {};
return $admit->{'cfg'} if ref $admit->{'cfg'} eq qw| HASH |;

my $cfg = {
    'free_fails'   => 5,       ## failures before any wait applies        ##
    'wait_cap'     => 3600,    ## per-source wait ceiling [ seconds ]     ##
    'queue_cap'    => 5,       ## waiting requests per source             ##
    'check_rate'   => 20,      ## admitted token checks per second        ##
    'half_life'    => 7200,    ## failure-weight decay [ seconds ]        ##
    'known_window' => 30 * 86400,    ## recent-success window [ seconds ] ##
    'merge_min'    => 8,         ## failing sources -> prefix merges        ##
    'merge_eps'    => 0.05,      ## decayed weight below : not failing      ##
    'weight_mid'   => 0.25,      ## failure weight : /24 \ /48              ##
    'weight_top'   => 0.0625,    ## failure weight : /16 \ /32              ##
    'entry_ttl'    => 120,       ## queued request lifetime [ seconds ]     ##
    'save_every'   => 5,         ## state save throttle [ seconds ]         ##
};

## host config overrides [ web.auth.admit.<key> in host.cfg ] ##
my $overrides = <web.auth.admit> // {};
for my $key ( keys %{$cfg} ) {
    my $val = $overrides->{$key} // next;
    $cfg->{$key} = $val if $val =~ m|^\d+(?:\.\d+)?$|;
}

$admit->{'cfg'} = $cfg;

return $cfg;

