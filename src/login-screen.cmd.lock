# name  = login-screen.cmd.lock
# descr = lock the active user session with the greeter window

return { 'mode' => qw| false |, 'data' => 'no active user session' }
    if <login-screen.state> ne qw| session |;

my $username = <login-screen.session_user> // '';
return { 'mode' => qw| false |, 'data' => 'invalid session user' }
    if $username !~ m|^[a-z_][a-z0-9_-]{0,31}$|;

<[login-screen.show_lock]>->($username);
return { 'mode' => qw| true |, 'data' => "session locked for $username" };

