# name   = coding.sign_queue.cfg
# descr  = sign queue dirs : bin, state, tests, repo root
# return = { root, bin, state, tests, limit, tmpdir }
#
# coding.cfg.sign_queue_bin_dir [ p7-sign-run, p7-commit ], _state_dir
# [ the job state files ], _test_dir [ tests= names ] ; defaults are the
# repo's bin/dev, data/state and bin/test-scripts. _test_limit : seconds
# one tests= run may take [ 1800 ] ; _test_tmpdir : the TMPDIR the tests
# get [ test-tmp under the zenka's var dir, never /tmp ]

my $root  = <coding.cfg.sign_queue_root> // <system.root_path> // '';
my $var   = ( <system.path.zenka-dirs> // {} )->{'var_P7'};
my $zname = <system.zenka.name>                // '';
my $state = <coding.cfg.sign_queue_state_dir>  // "$root/data/state";
my $limit = <coding.cfg.sign_queue_test_limit> // 1800;
$limit = 1800 if $limit !~ m|\A\d+\z| or not $limit;
return {
    'limit'  => $limit,
    'tmpdir' => <coding.cfg.sign_queue_test_tmpdir> // (
        defined $var && length $zname
        ? "$var/$zname/test-tmp"
        : "$state/test-tmp"
    ),
    'root'  => $root,
    'bin'   => <coding.cfg.sign_queue_bin_dir> // "$root/bin/dev",
    'state' => $state,
    'tests' => <coding.cfg.sign_queue_test_dir> // "$root/bin/test-scripts"
};

